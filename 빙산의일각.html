<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script id="kjs-menu-lib">
/* 수업 게임 서랍 · 공통 메뉴 (학년 → 대단원 → 중단원·차시, 검색)
   KJSMenu.init({
     key, items:[{id, grade, unit, mid, title, sub, kind:'unit'|'mid'|'lesson', words:[], tags:[]}],
     extras:['내 세트'],            // 누르면 게임의 원래 선택 화면(내가 만든 목록)을 보여 줌
     mount: Element,                // 이 요소 앞에 메뉴를 넣음
     legacyCss: 'selector, ...',    // 메뉴가 켜져 있을 때 숨길 원래 선택 UI
     isVisible: () => bool,         // 선택 화면일 때만 메뉴 표시 (생략 가능)
     observe: Element,              // 화면이 바뀌는지 지켜볼 요소 (생략 가능)
     mode: 'start' | 'select',      // start: 누르면 바로 시작 / select: 고른 뒤 ▶ 시작
     onPick(item), onStart(item), startLabel
   })
*/
(function(){
  var ORDER = {
    "중1": ["과학과 인류의 지속가능한 삶","생물의 구성과 다양성","열","물질의 상태 변화","힘의 작용","기체의 성질","태양계"],
    "중2": ["물질의 특성","지권의 변화","빛과 파동","물질의 구성","식물과 에너지","동물과 에너지","전기와 자기","별과 우주"],
    "중3": ["화학 반응의 규칙과 에너지 변화","기권과 날씨","운동과 에너지","자극과 반응","생식과 유전","에너지 전환과 보존","별과 우주"]
  };
  var CSS = [
    ".km{background:#fff;color:#1b2b2a;border:1.5px solid #dfe3de;border-radius:16px;padding:0 14px 14px;margin:12px 0 16px;",
    " font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif;text-align:left;line-height:1.45}",
    ".km *{box-sizing:border-box}",
    ".km-nav{position:sticky;top:0;z-index:30;background:#fff;padding:12px 0 10px;border-bottom:1px solid #e6e9e4;border-radius:16px 16px 0 0}",
    ".km-search{display:flex;align-items:center;gap:8px;background:#f5f7f4;border:1.5px solid #dfe3de;border-radius:12px;padding:0 12px;margin-bottom:8px}",
    ".km-search:focus-within{border-color:#0CA678;background:#fff}",
    ".km-search input{flex:1;min-width:0;border:0!important;box-shadow:none!important;outline:0;background:transparent;font:inherit;font-size:16px;padding:10px 0;color:#1b2b2a}",
    ".km-search button{border:0;background:transparent;font-size:15px;cursor:pointer;color:#6b7672;padding:4px}",
    ".km-row{display:flex;align-items:flex-start;gap:10px;margin-top:6px}",
    ".km-row[hidden]{display:none!important}",
    ".km-lab{flex:none;width:58px;padding-top:7px;font-size:12.5px;font-weight:800;color:#6b7672}",
    ".km-chips{display:flex;gap:6px;flex-wrap:wrap}",
    ".km-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}",
    ".km-chip{flex:none;border:1px solid #dfe3de;background:#fff;color:#1b2b2a;border-radius:9px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}",
    ".km-chip.g[aria-pressed=true]{background:#1b2b2a;color:#fff;border-color:#1b2b2a}",
    ".km-chip.u[aria-pressed=true]{background:#0CA678;color:#fff;border-color:#0CA678}",
    ".km-chip.j{font-size:12.5px;padding:5px 10px;border-radius:999px}",
    ".km-chip.j.m{border-color:#7048E8;color:#5f3dc4}.km-chip.j.un{border-color:#0CA678;color:#0b7a5a}",
    ".km-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:9px 12px;background:#fff8e1;border:1px solid #f3d27a;border-radius:10px;font-size:14px}",
    ".km-sel[hidden]{display:none!important}",
    ".km-sel b{font-weight:800}",
    ".km-go{border:0;background:#1b2b2a;color:#fff;border-radius:9px;padding:8px 16px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-left:auto}",
    ".km-body{padding-top:6px}",
    ".km-uh{font-size:14px;font-weight:800;color:#6b7672;margin:14px 0 8px;display:flex;align-items:center;gap:8px}",
    ".km-uh::after{content:'';flex:1;height:1px;background:#e6e9e4}",
    ".km-mh{font-size:13.5px;font-weight:800;margin:14px 0 8px 2px;scroll-margin-top:200px}",
    ".km-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}",
    ".km-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e1e5e0;border-radius:14px;padding:13px 15px;cursor:pointer;font:inherit;color:#1b2b2a;scroll-margin-top:200px;transition:border-color .12s,box-shadow .12s}",
    ".km-card:hover{border-color:#0CA678;box-shadow:0 4px 14px rgba(0,0,0,.06)}",
    ".km-card[aria-pressed=true]{border-color:#e8900c;box-shadow:0 0 0 3px #ffe8b0}",
    ".km-card .k{font-size:12px;font-weight:800;color:#e8900c}",
    ".km-card .w{font-size:12px;font-weight:800;color:#6b7672}",
    ".km-card .t{display:block;font-size:17px;font-weight:800;margin:2px 0 3px;letter-spacing:-.01em}",
    ".km-card .s{display:block;font-size:13px;color:#6b7672}",
    ".km-card .h{display:block;font-size:12.5px;color:#6b7672;margin-top:5px}",
    ".km-card.unit{background:linear-gradient(135deg,#eef6f2,#fff);border-color:#0CA678;grid-column:1/-1}",
    ".km-card.unit .k{color:#0b7a5a}",
    ".km-card.mid{background:linear-gradient(135deg,#f3f0fb,#fff);border-color:#7048E8;grid-column:1/-1}",
    ".km-card.mid .k{color:#5f3dc4}",
    ".km-hit{background:#fff3bf;border-radius:3px}",
    ".km-empty{color:#6b7672;padding:16px 4px}",
    ".km-note{font-size:13px;color:#6b7672;margin:8px 2px}",
    "@media (max-width:640px){.km{padding:0 10px 12px}.km-row{flex-direction:column;gap:4px}.km-lab{width:auto;padding-top:0}.km-grid{grid-template-columns:1fr}.km-mh,.km-card{scroll-margin-top:260px}}",
    "@media print{.km{display:none!important}}"
  ].join("\n");

  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function nrm(s){ return String(s || "").toLowerCase().replace(/\s+/g, ""); }
  function mark(text, q){
    var t = String(text), i = t.toLowerCase().indexOf(q.toLowerCase());
    if (!q || i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<span class="km-hit">' + esc(t.slice(i, i + q.length)) + "</span>" + esc(t.slice(i + q.length));
  }

  function init(o){
    if (!document.getElementById("km-style")) { var st = el("style"); st.id = "km-style"; st.textContent = CSS; document.head.appendChild(st); }
    var items = o.items || [];
    var grades = ["중1","중2","중3"].filter(function(g){ return items.some(function(x){ return x.grade === g; }); });
    items.forEach(function(x){ if (["중1","중2","중3"].indexOf(x.grade) < 0 && grades.indexOf(x.grade) < 0) grades.push(x.grade); });
    (o.extras || []).forEach(function(g){ if (grades.indexOf(g) < 0) grades.push(g); });
    items.forEach(function(x){
      x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|"));
      x.th = nrm([x.unit, x.mid, x.title].join("|"));
    });
    var LS = "km-" + (o.key || location.pathname);
    var st = { g: grades[0], u: 0, q: "", sel: null };
    try { var sv = JSON.parse(localStorage.getItem(LS) || "{}"); if (grades.indexOf(sv.g) >= 0) st.g = sv.g; if (sv.u >= 0) st.u = sv.u; } catch(e) {}
    function save(){ try { localStorage.setItem(LS, JSON.stringify({ g: st.g, u: st.u })); } catch(e) {} }

    var root = el("section", "km"); root.setAttribute("aria-label", "학년 · 단원 · 차시 고르기");
    var nav = el("div", "km-nav");
    nav.innerHTML =
      '<label class="km-search"><span aria-hidden="true">🔍</span><input type="text" placeholder="단원·차시·낱말 검색 (예: 광합성, 보일, 뉴런)" autocomplete="off"><button type="button" hidden aria-label="검색어 지우기">✕</button></label>' +
      '<div class="km-row"><span class="km-lab">학년</span><div class="km-chips km-g"></div></div>' +
      '<div class="km-row km-urow"><span class="km-lab">대단원</span><div class="km-scroll km-u"></div></div>' +
      '<div class="km-row km-jrow"><span class="km-lab">바로가기</span><div class="km-scroll km-j"></div></div>' +
      '<div class="km-sel" hidden><span>선택: <b></b></span><button type="button" class="km-go"></button></div>';
    var body = el("div", "km-body");
    root.appendChild(nav); root.appendChild(body);
    var mountEl = typeof o.mount === "function" ? o.mount() : o.mount;
    mountEl.parentNode.insertBefore(root, mountEl);

    var qIn = nav.querySelector("input"), qX = nav.querySelector(".km-search button");
    var selBox = nav.querySelector(".km-sel"), goBtn = nav.querySelector(".km-go");
    goBtn.textContent = "▶ " + (o.startLabel || "시작하기");
    goBtn.onclick = function(){ if (st.sel && o.onStart) o.onStart(st.sel); };

    var legacyStyle = el("style"); document.head.appendChild(legacyStyle);
    function setLegacy(show){ var t = (!show && o.legacyCss) ? o.legacyCss + "{display:none!important}" : ""; if (legacyStyle.textContent !== t) legacyStyle.textContent = t; }

    function pick(x){
      if (o.mode === "select") {
        st.sel = x; if (o.onPick) o.onPick(x);
        selBox.hidden = false; selBox.querySelector("b").textContent = x.grade + " · " + (x.unit ? x.unit + " · " : "") + x.title;
        paintSel();
      } else if (o.onPick) o.onPick(x);
    }
    function paintSel(){
      body.querySelectorAll(".km-card").forEach(function(c){ c.setAttribute("aria-pressed", String(!!st.sel && c._item === st.sel)); });
    }
    function card(x, q){
      var c = el("button", "km-card " + (x.kind || "lesson"));
      c.type = "button"; c._item = x;
      var kind = x.kind === "unit" ? "🌳 대단원 종합" : x.kind === "mid" ? "🌿 중단원 종합" : (x.badge || "");
      c.innerHTML = (q ? '<span class="w">' + esc(x.grade + (x.unit ? " · " + x.unit : "")) + "</span> " : "") +
        (kind ? '<span class="k">' + esc(kind) + "</span>" : "") +
        '<span class="t">' + (q ? mark(x.title, q) : esc(x.title)) + "</span>" +
        (x.sub ? '<span class="s">' + esc(x.sub) + "</span>" : "");
      if (q) {
        var hits = (x.words || []).filter(function(w){ return String(w).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
        var u = []; hits.forEach(function(h){ if (u.indexOf(h) < 0) u.push(h); });
        if (u.length) c.appendChild(el("span", "h", "찾은 낱말: " + u.slice(0, 5).map(function(w){ return mark(String(w).slice(0, 40), q); }).join(", ") + (u.length > 5 ? " …" : "")));
      }
      c.onclick = function(){ pick(x); };
      return c;
    }
    function unitsOf(g){
      var list = [];
      items.forEach(function(x){ if (x.grade === g && x.unit && list.indexOf(x.unit) < 0) list.push(x.unit); });
      var ord = ORDER[g] || [];
      return list.sort(function(a, b){ var ia = ord.indexOf(a), ib = ord.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    }
    function render(){
      var gBox = nav.querySelector(".km-g"), uBox = nav.querySelector(".km-u"), jBox = nav.querySelector(".km-j");
      gBox.innerHTML = ""; uBox.innerHTML = ""; jBox.innerHTML = ""; body.innerHTML = "";
      grades.forEach(function(g){
        var b = el("button", "km-chip g"); b.type = "button"; b.textContent = g;
        b.setAttribute("aria-pressed", String(g === st.g && !st.q));
        b.onclick = function(){ st.g = g; st.u = 0; clearQ(); save(); render(); };
        gBox.appendChild(b);
      });
      var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
      setLegacy(isExtra && !st.q);
      var units = unitsOf(st.g);
      if (st.u >= units.length) st.u = 0;
      nav.querySelector(".km-urow").hidden = !units.length || !!st.q;
      units.forEach(function(u, i){
        var b = el("button", "km-chip u"); b.type = "button"; b.textContent = u;
        b.setAttribute("aria-pressed", String(i === st.u));
        b.onclick = function(){ st.u = i; save(); render(); };
        uBox.appendChild(b);
      });
      var cur = uBox.children[st.u]; if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: "nearest", block: "nearest" });

      if (st.q) {
        nav.querySelector(".km-jrow").hidden = true;
        var q = nrm(st.q);
        var res = items.filter(function(x){ return x.hay.indexOf(q) >= 0; }).sort(function(a, b){
          var ka = { unit: 0, mid: 1 }[a.kind]; var kb = { unit: 0, mid: 1 }[b.kind];
          return ((b.th.indexOf(q) >= 0) - (a.th.indexOf(q) >= 0)) || ((ka == null ? 2 : ka) - (kb == null ? 2 : kb));
        });
        body.appendChild(el("div", "km-uh", "‘" + esc(st.q) + "’ 검색 결과 " + res.length + "개"));
        if (!res.length) body.appendChild(el("p", "km-empty", "찾는 내용이 없습니다. 다른 낱말로 검색해 보세요."));
        var grid = el("div", "km-grid");
        res.slice(0, 60).forEach(function(x){ grid.appendChild(card(x, st.q.trim())); });
        body.appendChild(grid); paintSel(); return;
      }
      if (isExtra) {
        nav.querySelector(".km-jrow").hidden = true;
        if (o.onExtra) setTimeout(function(){ o.onExtra(st.g); }, 0);
        body.appendChild(el("p", "km-note", (o.extraNote || "아래에서 직접 만든 목록을 고르거나 새로 만들 수 있습니다.")));
        return;
      }
      var unit = units[st.u];
      var list = items.filter(function(x){ return x.grade === st.g && (unit ? x.unit === unit : !x.unit); });
      if (!unit) list = items.filter(function(x){ return x.grade === st.g; });
      if (unit) body.appendChild(el("div", "km-uh", esc(st.g + " · " + unit)));
      var groups = [], gmap = {};
      list.forEach(function(x){
        var key = x.kind === "unit" ? "__unit" : (x.mid || "");
        if (!gmap[key]) { gmap[key] = { name: key, list: [] }; groups.push(gmap[key]); }
        gmap[key].list.push(x);
      });
      var jumps = 0;
      groups.forEach(function(gr, gi){
        var sec = el("div", "km-sec");
        if (gr.name && gr.name !== "__unit") {
          var mh = el("div", "km-mh", esc(gr.name)); sec.appendChild(mh);
          var jb = el("button", "km-chip j m", "🌿 " + esc(gr.name)); jb.type = "button";
          jb.onclick = function(){ mh.scrollIntoView({ behavior: "smooth", block: "start" }); };
          jBox.appendChild(jb); jumps++;
        }
        var grid = el("div", "km-grid");
        gr.list.forEach(function(x){
          var c = card(x, "");
          grid.appendChild(c);
          if (x.kind === "unit") {
            var ub = el("button", "km-chip j un", "🌳 대단원"); ub.type = "button";
            ub.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "start" }); };
            jBox.insertBefore(ub, jBox.firstChild); jumps++;
          } else if (x.kind !== "mid") {
            var lb = el("button", "km-chip j", esc(x.short || x.title)); lb.type = "button";
            lb.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "center" }); };
            jBox.appendChild(lb); jumps++;
          }
        });
        sec.appendChild(grid); body.appendChild(sec);
      });
      nav.querySelector(".km-jrow").hidden = jumps < 2;
      paintSel();
    }
    function clearQ(){ st.q = ""; qIn.value = ""; qX.hidden = true; }
    qIn.addEventListener("input", function(){ st.q = qIn.value.trim(); qX.hidden = !st.q; render(); });
    qX.addEventListener("click", function(){ clearQ(); render(); qIn.focus(); });

    function sync(){
      if (typeof o.mount === "function") {
        var m = o.mount();
        if (m && m !== root && m.parentNode && root.nextSibling !== m) m.parentNode.insertBefore(root, m);
      }
      var vis = o.isVisible ? !!o.isVisible() : true;
      var want = vis ? "" : "none";
      if (root.style.display !== want) root.style.display = want;
      if (!vis) setLegacy(true); else {
        var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
        setLegacy(isExtra && !st.q);
      }
    }
    if (o.observe) {
      var busy = false;
      new MutationObserver(function(){
        if (busy) return; busy = true;
        requestAnimationFrame(function(){ try { sync(); } finally { busy = false; } });
      }).observe(o.observe, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
    }
    render(); sync();
    return { refresh: function(newItems){ if (newItems) { items = newItems; items.forEach(function(x){ x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|")); x.th = nrm([x.unit, x.mid, x.title].join("|")); }); } render(); sync(); },
             root: root, select: function(x){ st.sel = x; paintSel(); } };
  }
  window.KJSMenu = { init: init };
})();

</script>

  display: flex !important;

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "iceberg-game-data-v1";
  var TEAM_COLORS = ["#2f8fae","#ff9142","#8a5fd6","#1fb88f","#e2503a","#4f6fd1"];
  var BUZZ_KEYS = ["f","j","d","k","s","l"];
  var ROUND_DURATION = 90;
  var HINT_INTERVAL = 14;
  var WRONG_PENALTY = 5;

  function sampleData(){
    return {
      teams: [
        {id:"t1", name:"1팀", color:TEAM_COLORS[0], key:BUZZ_KEYS[0]},
        {id:"t2", name:"2팀", color:TEAM_COLORS[1], key:BUZZ_KEYS[1]}
      ],
      categories: [
        {id:"g1", topic:"중1 · 기체의 압력", words:["압력", "면적", "충돌", "입자", "쇠구슬"]},
        {id:"g2", topic:"중1 · 보일 법칙", words:["반비례", "부피감소", "대기압", "뽁뽁이", "공기침대"]},
        {id:"g3", topic:"중1 · 샤를 법칙", words:["비례", "온도", "열기구", "축구공", "피스톤"]},
        {id:"g4", topic:"중1 · 생활 속 기체", words:["탁구공", "타이어", "과자봉지", "공기방울", "마시멜로"]}
      ]
    };
  }

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ var parsed = JSON.parse(raw); if(parsed && parsed.teams && parsed.categories) return parsed; }
    }catch(e){}
    return sampleData();
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({teams:S.teams, categories:S.categories})); }catch(e){}
  }

  var S = Object.assign({view:"setup", currentRound:-1, scores:{}, round:null}, loadData());

  /* ---------------- sound ---------------- */
  var actx = null;
  function ctx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq, dur, type, delay, vol){
    var c = ctx(); if(!c) return;
    var t0 = c.currentTime + (delay||0);
    var osc = c.createOscillator(); var gain = c.createGain();
    osc.type = type||"sine"; osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.12, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  var SND = {
    buzz: function(){ beep(880,0.09,"square",0); beep(1180,0.09,"square",0.06); },
    correct: function(){ beep(660,0.11,"triangle",0); beep(880,0.11,"triangle",0.09); beep(1320,0.18,"triangle",0.18); },
    wrong: function(){ beep(180,0.28,"sawtooth",0,0.1); },
    hint: function(){ beep(1500,0.05,"sine",0,0.05); },
    roundClear: function(){ beep(523,0.12,"triangle",0); beep(659,0.12,"triangle",0.1); beep(784,0.12,"triangle",0.2); beep(1046,0.22,"triangle",0.3); },
    timeUp: function(){ beep(300,0.3,"sawtooth",0,0.09); beep(220,0.35,"sawtooth",0.25,0.09); }
  };

  function announce(msg){ var el=document.getElementById("live"); if(el) el.textContent = msg; }

  /* ---------------- helpers ---------------- */
  function shuffledIdx(n){
    var arr=[]; for(var i=0;i<n;i++) arr.push(i);
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
    return arr;
  }
  function pointsForHintLevel(level){ return Math.max(20, 120 - (level-1)*20); }

  function startRound(catIndex){
    var cat = S.categories[catIndex];
    var words = cat.words.map(function(w){
      var chars = Array.from(w);
      return { text:w, chars:chars, order:shuffledIdx(chars.length), solved:false, awarded:0 };
    });
    S.currentRound = catIndex;
    S.round = {
      words: words, hintLevel: 1, timeLeft: ROUND_DURATION, running:true,
      lockedTeam: null, elapsedSinceHint: 0, ended:false
    };
    render();
    tick();
  }

  var timerHandle = null;
  function tick(){
    clearInterval(timerHandle);
    timerHandle = setInterval(function(){
      var r = S.round; if(!r || !r.running) return;
      r.timeLeft--; r.elapsedSinceHint++;
      if(r.elapsedSinceHint >= HINT_INTERVAL && r.timeLeft > 0){
        r.elapsedSinceHint = 0; revealHint();
      }
      if(r.timeLeft <= 0){
        r.timeLeft = 0; r.running = false; clearInterval(timerHandle);
        finishRoundTimeout();
      }
      renderTimerOnly();
    }, 1000);
  }

  function revealHint(){
    var r = S.round; if(!r) return;
    var changed = false;
    r.words.forEach(function(w){ if(!w.solved && w.order.length > 0){ } });
    r.hintLevel = Math.min(r.hintLevel + 1, 12);
    SND.hint();
    render();
  }

  function currentRevealSet(word, hintLevel){
    var n = Math.min(hintLevel, word.chars.length);
    var set = {};
    for(var i=0;i<n;i++) set[word.order[i]] = true;
    return set;
  }

  function finishRoundTimeout(){
    var r = S.round; if(!r) return;
    r.words.forEach(function(w){ if(!w.solved){ w.solved = true; w.awarded = 0; w.timedOut = true; } });
    r.ended = true; SND.timeUp();
    render();
  }

  function allSolved(){
    return S.round && S.round.words.every(function(w){ return w.solved; });
  }

  function tryBuzz(teamId){
    var r = S.round; if(!r || !r.running || r.ended) return;
    if(r.lockedTeam) return;
    r.lockedTeam = teamId;
    SND.buzz();
    var t = S.teams.filter(function(x){return x.id===teamId;})[0];
    announce((t?t.name:"팀") + " 버저를 눌렀습니다.");
    render();
  }

  function resolveWord(wordIdx, correct){
    var r = S.round; if(!r || !r.lockedTeam) return;
    var team = r.lockedTeam;
    if(correct){
      var w = r.words[wordIdx];
      if(!w.solved){
        w.solved = true; w.awarded = pointsForHintLevel(r.hintLevel);
        S.scores[team] = (S.scores[team]||0) + w.awarded;
        window.KJS&&KJS.ok();
        announce("정답! " + w.awarded + "점 획득");
      }
      r.lockedTeam = null;
      if(allSolved()){ r.running = false; r.ended = true; clearInterval(timerHandle); SND.roundClear(); }
    } else {
      r.timeLeft = Math.max(0, r.timeLeft - WRONG_PENALTY);
      r.lockedTeam = null;
      window.KJS&&KJS.no();
      announce("오답 처리. " + WRONG_PENALTY + "초 감점.");

  function parseLegacy(text){
    var cats = [];
    var jRe = /&j(\d+)=([^&]+)&/g, m;
    var topics = {};
    while((m = jRe.exec(text))){ topics[m[1]] = m[2].trim(); }
    var mRe = /&m(\d+)=([^&]+)&/g;
    var words = {};
    while((m = mRe.exec(text))){ words[m[1]] = m[2].split(",").map(function(s){return s.trim();}).filter(Boolean); }
    Object.keys(topics).sort(function(a,b){return +a-+b;}).forEach(function(k){
      var ws = words[k] || [];
      while(ws.length<5) ws.push("");
      cats.push({id:"c"+uid(), topic:topics[k], words:ws.slice(0,5)});
    });
    return cats;
  }

  function loadUnit(g, u){
    var item = null;
    CATALOG.forEach(function(c){ if(c.g===g && c.u===u) item = c; });
    if(!item) return false;
    S.categories = item.rounds.map(function(r){
      return { id: uid(), topic: r.topic, words: r.words.slice() };
    });
    pickLabel = g + " · " + u + " (" + item.rounds.length + "라운드)";
    pickG = g; pickU = u;
    saveData();
    return true;
  }

    var units = CATALOG.filter(function(c){ return c.g===pickGrade; }).map(function(c){
      return '<div class="pick-unit">'+
        '<button class="pick-main" data-action="pick-unit" data-g="'+c.g+'" data-u="'+esc(c.u)+'">'+
          '<b>'+esc(c.u)+'</b><span>'+c.rounds.length+'라운드 · '+esc(c.rounds[0].topic)+' 외</span>'+

        '<button class="pick-go" data-action="pick-play" data-g="'+c.g+'" data-u="'+esc(c.u)+'" title="바로 시작">▶</button>'+

    return '<div class="panel pick-panel">'+

    '</div>';

              '</div>'+
            '</details>'+
          '</div>'+
        '</div>'+
        '<div style="margin-top:24px; text-align:center;">'+
          '<button class="btn btn-spark" style="font-size:17px; padding:14px 40px;" data-action="go-play" '+(canStart?'':'disabled')+'>게임 시작 ▶</button>'+
          (canStart?'':'<p class="sub" style="margin-top:8px;">모든 라운드의 주제와 5개 단어를 채워야 시작할 수 있어요</p>')+
        '</div>'+
      '</div>';
  }

  function renderTimerOnly(){
    var fill = document.getElementById("timer-fill-el");
    var num = document.getElementById("timer-num-el");
    if(fill && S.round){
      var pct = Math.max(0, S.round.timeLeft/ROUND_DURATION*100);
      fill.style.width = pct+"%";
      fill.style.background = pct<25 ? "linear-gradient(90deg,var(--danger),#ff8a6a)" : "linear-gradient(90deg,var(--aurora),var(--glacier))";
    }
    if(num && S.round) num.textContent = S.round.timeLeft+"s";
  }

  function renderPlay(){
    var r = S.round; var cat = S.categories[S.currentRound];
    var teamCards = S.teams.map(function(t){
      var locked = r && r.lockedTeam===t.id;
      return '<div class="team-card '+(locked?'locked':'')+'" style="background:'+t.color+'">'+
        '<div class="tname"><span>'+esc(t.name)+'</span><span class="tkey">'+t.key.toUpperCase()+'</span></div>'+
        '<div class="tscore mono">'+(S.scores[t.id]||0)+'</div>'+
        '<button class="buzz" data-action="buzz" data-id="'+t.id+'" aria-label="'+esc(t.name)+' 버저"></button>'+
      '</div>';
    }).join("");

    var wordsHtml = "";
    if(r){
      wordsHtml = r.words.map(function(w, wi){
        var revealSet = currentRevealSet(w, r.solved_hintOverride || r.hintLevel);
        var tiles = w.chars.map(function(ch, ci){
          var shown = w.solved || revealSet[ci];
          return '<div class="tile '+(shown?"revealed":"hidden")+'">'+(shown?esc(ch):"")+'</div>';
        }).join("");
        var canResolve = r.lockedTeam && !w.solved && !r.ended;
        return '<div class="word-row '+(w.solved?"solved":"")+'">'+
          '<div class="tiles">'+tiles+'</div>'+
          (canResolve ? '<div class="resolve-row"><button class="btn-yes" data-action="resolve-yes" data-widx="'+wi+'" title="정답">✓</button><button class="btn-no" data-action="resolve-no" data-widx="'+wi+'" title="오답">✕</button></div>'
            : '<div class="word-pts mono">'+(w.solved ? (w.timedOut ? "시간초과" : "+"+w.awarded) : "")+'</div>')+
        '</div>';
      }).join("");
    }

    var pct = r ? Math.max(0, r.timeLeft/ROUND_DURATION*100) : 100;
    var timerColor = pct<25 ? "linear-gradient(90deg,var(--danger),#ff8a6a)" : "linear-gradient(90deg,var(--aurora),var(--glacier))";

    var buzzBanner = "";
    if(r && r.lockedTeam){
      var lt = S.teams.filter(function(t){return t.id===r.lockedTeam;})[0];
      buzzBanner = '<div class="buzz-banner"><span>🔔 '+esc(lt?lt.name:"")+' 답변 중!</span></div>';
    }

    var roundOverControls = "";
    if(r && r.ended){
      roundOverControls = '<button class="btn btn-spark" data-action="next-round">'+(S.currentRound+1>=S.categories.length? "최종 결과 보기 🏆" : "다음 라운드 ▶")+'</button>';
    } else {
      roundOverControls =
        '<button class="btn btn-ghost" data-action="toggle-timer">'+(r&&r.running?"⏸ 일시정지":"▶ 재개")+'</button>'+
        '<button class="btn btn-ghost" data-action="force-hint">💡 힌트 공개</button>'+
        '<button class="btn btn-ghost" data-action="skip-round">라운드 건너뛰기</button>';
    }

    app.innerHTML =
      '<div class="stage">'+
        buzzBanner+
        '<div class="topbar"><button class="btn btn-ghost" data-action="back-setup" style="font-size:12px; padding:6px 12px;">설정으로</button></div>'+
        '<div class="score-row">'+teamCards+'</div>'+
        '<div class="round-wrap">'+
          '<div class="round-top">'+
            '<div><div class="round-label">ROUND '+(S.currentRound+1)+' / '+S.categories.length+'</div>'+
            '<h2 class="round-title">'+esc(cat.topic)+'</h2></div>'+
            '<div class="timer-wrap"><div class="timer-gauge"><div id="timer-fill-el" class="timer-fill" style="width:'+pct+'%; background:'+timerColor+'"></div></div>'+
            '<div id="timer-num-el" class="timer-num">'+(r?r.timeLeft:ROUND_DURATION)+'s</div></div>'+
          '</div>'+
          '<div class="words">'+wordsHtml+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="host-bar">'+roundOverControls+'</div>';
  }

  function renderFinal(){
    var ranked = S.teams.slice().sort(function(a,b){ return (S.scores[b.id]||0)-(S.scores[a.id]||0); });
    var medals = ["🥇","🥈","🥉"];
    var rows = ranked.map(function(t,i){
      return '<div class="podium-row" style="border-color:'+t.color+'66">'+
        '<div class="rank">'+(medals[i]||(i+1))+'</div>'+
        '<div class="pname">'+esc(t.name)+'</div>'+
        '<div class="pscore mono" style="color:'+t.color+'">'+(S.scores[t.id]||0)+'</div>'+
      '</div>';
    }).join("");
    app.innerHTML =
      '<div class="stage" style="min-height:100vh;">'+
        '<div class="final-wrap">'+bergIcon(90)+
          '<h1>게임 종료!</h1>'+
          '<p style="color:#a9cddb;">수고했어요, 오늘의 빙산 탐험가들 👏</p>'+
          '<div class="podium">'+rows+'</div>'+
          '<div id="scoreBoxBerg" style="max-width:360px;margin:10px auto 0;text-align:left;"></div>'+
          '<div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">'+
            '<button class="btn btn-spark" data-action="go-play">같은 문제로 다시하기</button>'+
            '<button class="btn btn-ghost" data-action="back-setup">설정으로 돌아가기</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    fireConfetti();
    window.KJSScore && KJSScore.finishTeams({
      game: "iceberg", unit: pickU, lesson: pickLabel,
      teams: S.teams.map(function(t){ return { name: t.name, score: S.scores[t.id] || 0 }; }),
      container: document.getElementById("scoreBoxBerg")
    });
  }

  function render(){
    if(S.view==="setup") renderSetup();
    else if(S.view==="play") renderPlay();
    else renderFinal();
  }

  /* ---------------- confetti ---------------- */
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function fireConfetti(){
    if(reduceMotion) return;
    var cv = document.getElementById("confetti");
    cv.hidden = false; cv.width = window.innerWidth; cv.height = window.innerHeight;
    var c = cv.getContext("2d");
    var colors = TEAM_COLORS;
    var parts = [];
    for(var i=0;i<120;i++){
      parts.push({x:Math.random()*cv.width, y:-20-Math.random()*200, r:4+Math.random()*4,
        c:colors[i%colors.length], vy:2+Math.random()*3, vx:-1+Math.random()*2, rot:Math.random()*6, vr:-0.2+Math.random()*0.4});
    }
    var start = Date.now();
    function step(){
      c.clearRect(0,0,cv.width,cv.height);
      var t = Date.now()-start;
      parts.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        c.fillStyle=p.c; c.fillRect(-p.r,-p.r/2,p.r*2,p.r);
        c.restore();
      });
      if(t<3200) requestAnimationFrame(step); else { cv.hidden = true; }
    }
    requestAnimationFrame(step);
  }

  /* ---------------- event delegation ---------------- */
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]"); if(!el) return;
    var action = el.getAttribute("data-action");
    if(action==="pick-grade"){ pickGrade = el.getAttribute("data-g");
      try{ localStorage.setItem("iceberg-grade", pickGrade); }catch(err){} render(); }
    else if(action==="pick-unit"){
      if(loadUnit(el.getAttribute("data-g"), el.getAttribute("data-u"))){
        render();
        var btn = document.querySelector('[data-action="go-play"]');
        if(btn) btn.scrollIntoView({behavior:"smooth", block:"center"});
      }
    }
    else if(action==="pick-play"){
      if(loadUnit(el.getAttribute("data-g"), el.getAttribute("data-u"))) goPlay();
    }
    else if(action==="team-add") addTeam();
    else if(action==="team-remove") removeTeam(el.getAttribute("data-id"));
    else if(action==="cat-add") addCategory();
    else if(action==="cat-remove") removeCategory(el.getAttribute("data-id"));
    else if(action==="load-sample"){ if(confirm("예시 데이터로 현재 설정을 덮어쓸까요?")) loadSample(); }
    else if(action==="import-legacy"){
      var txt = document.getElementById("import-box").value;
      var cats = parseLegacy(txt);
      if(cats.length){ S.categories = cats; saveData(); render(); } else alert("가져올 데이터를 찾지 못했어요. 형식을 확인해주세요.");
    }
    else if(action==="import-json"){
      try{ var data = JSON.parse(document.getElementById("import-box").value);
        if(data.teams) S.teams = data.teams; if(data.categories) S.categories = data.categories;
        saveData(); render();
      }catch(err){ alert("JSON 형식이 올바르지 않아요."); }
    }
    else if(action==="export-json"){
      document.getElementById("import-box").value = JSON.stringify({teams:S.teams, categories:S.categories}, null, 1);
    }
    else if(action==="go-play") goPlay();
    else if(action==="back-setup"){ if(S.view==="setup" || confirm("설정 화면으로 돌아갈까요? 현재 점수는 사라져요.")) backToSetup(); }
    else if(action==="buzz") tryBuzz(el.getAttribute("data-id"));
    else if(action==="resolve-yes") resolveWord(+el.getAttribute("data-widx"), true);
    else if(action==="resolve-no") resolveWord(+el.getAttribute("data-widx"), false);
    else if(action==="next-round") nextRound();
    else if(action==="skip-round") skipRound();
    else if(action==="toggle-timer") toggleTimer();
    else if(action==="force-hint") revealHint();
  });

  document.addEventListener("input", function(e){
    var el = e.target; var action = el.getAttribute("data-action");
    if(action==="team-name"){
      var t = S.teams.filter(function(x){return x.id===el.getAttribute("data-id");})[0];
      if(t){ t.name = el.value; saveData(); }
    } else if(action==="topic-edit"){
      var c = S.categories.filter(function(x){return x.id===el.getAttribute("data-cid");})[0];
      if(c){ c.topic = el.value; saveData(); }
    } else if(action==="word-edit"){
      var c2 = S.categories.filter(function(x){return x.id===el.getAttribute("data-cid");})[0];
      if(c2){ c2.words[+el.getAttribute("data-widx")] = el.value; saveData(); }
    }
  });

  render();

  /* republish/hot-reload state carry (best-effort) */
  try{
    if(window.claude && window.claude.hot){
      window.claude.hot.snapshot(function(){ return {S:S}; });
      var boot = function(data){ if(data && data.S){ S = data.S; } render(); };
      if(window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude.hot.data);
    }
  }catch(e){}
})();
</script>

    for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(m.isDark(r,k))q.fillRect((k+b)*cell,(r+b)*cell,cell,cell);
    var cap=url;try{cap=decodeURI(url);}catch(e){}ov.querySelector('.cap').textContent=cap;ov.querySelector('canvas').style.display='';}
  catch(e){ov.querySelector('.er').textContent='QR을 만들 수 없어요. 주소가 너무 길어요.';}}
function openQr(){
  if(!ov){ov=D.createElement('div');ov.id='kjsQrOv';ov.innerHTML='<div class="c"><h2></h2><p class="note" style="display:none">지금은 내 컴퓨터에서 열린 파일이라 학생 휴대폰에서는 열리지 않아요. GitHub에 올린 <b>인터넷 주소</b>(https://계정명.github.io/저장소명/아무_자료.html)를 한 번 붙여 넣으면 이 컴퓨터가 기억해요.</p><input type="url" placeholder="https://계정명.github.io/저장소명/아무_자료.html" autocomplete="off" spellcheck="false"><canvas width="300" height="300" style="display:none"></canvas><div class="cap"></div><div class="er"></div><div class="row"><button type="button" class="mk">QR 만들기</button><button type="button" class="bg">⛶ 크게 보기</button><button type="button" class="cl">닫기 ✕</button></div></div>';D.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('on');});
    ov.querySelector('.cl').onclick=function(){ov.classList.remove('on');};
    ov.querySelector('.bg').onclick=function(){ov.classList.toggle('big');ov.querySelector('.bg').textContent=ov.classList.contains('big')?'⛶ 작게 보기':'⛶ 크게 보기';};
    ov.querySelector('.mk').onclick=function(){var u=normUrl(ov.querySelector('input').value);if(!u){ov.querySelector('.er').textContent='http:// 또는 https:// 로 시작하는 주소를 넣어 주세요.';return;}lsSet(LSK,u);openQr();};
    ov.querySelector('input').addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')ov.querySelector('.mk').click();});}
  ov.querySelector('h2').textContent='📱 학생 접속 QR · '+(CFG.name||D.title||FILE);
  var url=targetUrl(),isWeb=/^https?:$/.test(location.protocol);
  ov.querySelector('.note').style.display=(!isWeb)?'':'none';
  ov.querySelector('input').style.display=(!isWeb&&!url)?'':'none';ov.querySelector('.mk').style.display=(!isWeb&&!url)?'':'none';
  ov.querySelector('.bg').style.display=url?'':'none';ov.classList.add('on');
  if(url)paint(url);else{ov.querySelector('canvas').style.display='none';ov.querySelector('.cap').textContent='';}
}
window.kjsOpenQr=openQr;
function mountQr(){
  if(CFG.noqr||D.getElementById('kjsQrBtn')||!D.body)return;
  var host=null;(CFG.qrHost||['.header-actions','.unified-nav-actions']).some(function(s){host=D.querySelector(s);return !!host;});
  var b=D.createElement('button');b.id='kjsQrBtn';b.type='button';b.textContent='📱 QR';b.title='학생 접속 QR코드 (이 게임)';
  if(host){var sib=host.querySelector('button');b.className=(sib?sib.className:'')+' kjs-in';host.insertBefore(b,host.firstChild);b.style.cssText+=';min-height:44px;cursor:pointer';}
  else{b.className='kjs-float';D.body.appendChild(b);}
  b.onclick=openQr;
}
/* ---------- 시작 ---------- */
function boot(){mountQr();update();setTimeout(update,500);setTimeout(update,1500);}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',boot);else boot();
addEventListener('load',function(){schedule(100);});
window.__kjsKitApi={update:update,refit:refit,isPlay:isPlay,get zoom(){return z;},fits:fits,cfg:CFG,openQr:openQr};
})();

</script>
