<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과학수업 통합 서랍 · Cognitive Science Hub</title>
<style>
:root {
  --primary-blue: #2563eb;
  --primary-indigo: #4338ca;
  --accent-amber: #d97706;
  --accent-green: #059669;
  --accent-purple: #7c3aed;
  --ink: #0f172a;
  --ink-light: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --bg: #f8fafc;
  --card: #ffffff;
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.05);
  --shadow-lg: 0 10px 25px -3px rgba(15,23,42,0.09), 0 4px 8px -4px rgba(15,23,42,0.04);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { text-decoration: none; color: inherit; }

/* ==========================================================================
   1. 인지공학적 헤더 (정보 압축 및 청킹)
   ========================================================================== */
.header {
  background: #ffffff;
  border-bottom: 1.5px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 10px rgba(15,23,42,0.04);
}

.header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.brand-title h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #0f172a;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-sub {
  margin: 2px 0 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.badge-cognitive {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 999px;
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #bfdbfe;
}

.header-utils {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-guide-modal {
  background: #f1f5f9;
  border: 1px solid var(--line-strong);
  color: var(--ink-light);
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn-guide-modal:hover {
  background: #e2e8f0;
  color: var(--ink);
}

/* ==========================================================================
   2. 1차 네비게이션 (작업기억 5개 이하 청킹)
   ========================================================================== */
.primary-nav-bar {
  background: #f8fafc;
  border-bottom: 1px solid var(--line);
}
.primary-nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}
.primary-nav-btn {
  padding: 12px 18px;
  font-size: 14.5px;
  font-weight: 800;
  color: #475569;
  background: transparent;
  border: none;
  display: flex;
  align-items: center;
  gap: 7px;
  position: relative;
  transition: all 0.15s;
  white-space: nowrap;
}
.primary-nav-btn:hover {
  color: var(--primary-blue);
}
.primary-nav-btn.active {
  color: var(--primary-blue);
  background: #ffffff;
}
.primary-nav-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--primary-blue);
}
.nav-counter {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: #e2e8f0;
  color: #475569;
}
.primary-nav-btn.active .nav-counter {
  background: #dbeafe;
  color: #1e40af;
}

/* ==========================================================================
   3. 메인 레이아웃 및 2차 네비게이션 (CTML 수업 인지 단계)
   ========================================================================== */
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* 수업 인지 흐름 바 (Segmenting Principle) */
.flow-selector-card {
  background: #ffffff;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.flow-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stage-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: thin;
}
.stage-chip {
  background: #f1f5f9;
  border: 1.5px solid #e2e8f0;
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 13.5px;
  font-weight: 800;
  color: #334155;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.15s;
}
.stage-chip:hover {
  background: #e2e8f0;
  border-color: #cbd5e1;
}
.stage-chip.active {
  background: #0f172a;
  border-color: #0f172a;
  color: #ffffff;
}

/* 특정 인지 단계별 신호화(Signaling) 컬러 */
.stage-chip.stage-all.active { background: #0f172a; border-color: #0f172a; }
.stage-chip.stage-sim.active { background: #2563eb; border-color: #1d4ed8; }
.stage-chip.stage-ws.active { background: #059669; border-color: #047857; }
.stage-chip.stage-org.active { background: #0891b2; border-color: #0e7490; }
.stage-chip.stage-eval.active { background: #7c3aed; border-color: #6d28d9; }

/* 검색 및 대단원 칩 바 */
.filter-search-row {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.search-wrapper {
  flex: 1;
  min-width: 280px;
  background: #ffffff;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius-md);
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
}
.search-wrapper:focus-within {
  border-color: var(--primary-blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.search-input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  padding: 10px 0;
  font-size: 14.5px;
}
.unit-chips-container {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.unit-chip {
  background: #ffffff;
  border: 1px solid var(--line-strong);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-light);
  transition: all 0.15s;
}
.unit-chip:hover {
  border-color: var(--primary-blue);
  color: var(--primary-blue);
}
.unit-chip.active {
  background: #eff6ff;
  border-color: #3b82f6;
  color: #1d4ed8;
  font-weight: 800;
}

/* ==========================================================================
   4. 단원별 통합 모듈 카드 (Integrated Lesson Card)
   - Spatial Contiguity Principle: 가상실험+활동지+게임을 한 영역에 배치
   ========================================================================== */
.results-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
}
.results-info h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  color: #334155;
}

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
}
@media (max-width: 680px) {
  .lesson-grid { grid-template-columns: 1fr; }
}

.lesson-card {
  background: #ffffff;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.lesson-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: #cbd5e1;
}

/* 이중부호화 헤더 (시각적 앵커 + 언어적 앵커) */
.card-top {
  display: flex;
  gap: 14px;
  margin-bottom: 12px;
}
.visual-anchor {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: #f8fafc;
  border: 1.5px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 26px;
}

.title-area {
  flex: 1;
}
.meta-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.badge-grade {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #0f172a;
  color: #ffffff;
}
.badge-unit {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #e2e8f0;
}
.lesson-card-title {
  margin: 0;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #0f172a;
  line-height: 1.35;
}

.btn-star {
  background: transparent;
  border: none;
  font-size: 20px;
  color: #cbd5e1;
  padding: 2px;
  line-height: 1;
  transition: transform 0.15s, color 0.15s;
}
.btn-star:hover { transform: scale(1.2); }
.btn-star.active { color: #f59f00; }

/* 인지적 개념 설명 및 발문 앵커 */
.concept-lead {
  font-size: 13.5px;
  color: #334155;
  line-height: 1.55;
  margin: 0 0 14px;
  background: #f8fafc;
  border-left: 3px solid #2563eb;
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
}

/* 키워드 태그 */
.concept-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.tag-kw {
  font-size: 11px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  color: #64748b;
  padding: 2px 6px;
  border-radius: 4px;
}

/* ==========================================================================
   5. 공간적 근접성 액션 버튼 매트릭스 (4단계 수업 도구 세트)
   ========================================================================== */
.card-tools-matrix {
  border-top: 1px dashed var(--line);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.matrix-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 4px;
}

.action-btn-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 6px;
}

.btn-action {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-align: center;
  transition: all 0.15s;
  border: 1.5px solid transparent;
}

/* 신호화 컬러 매핑 */
/* 1) 가상실험실 (Blue) */
.btn-sim {
  background: #eff6ff;
  border-color: #bfdbfe;
  color: #1d4ed8;
}
.btn-sim:hover {
  background: #2563eb;
  color: #ffffff;
  border-color: #2563eb;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
}

/* 2) 탐구 활동지 (Green) */
.btn-ws {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #047857;
}
.btn-ws:hover {
  background: #059669;
  color: #ffffff;
  border-color: #059669;
}

/* 3) 개념 정리 도구 (Teal/Cyan) */
.btn-org {
  background: #f0fdfa;
  border-color: #99f6e4;
  color: #0f766e;
}
.btn-org:hover {
  background: #0d9488;
  color: #ffffff;
  border-color: #0d9488;
}

/* 4) 형성평가 & 게임 (Purple) */
.btn-game {
  background: #faf5ff;
  border-color: #e9d5ff;
  color: #7e22ce;
}
.btn-game:hover {
  background: #7c3aed;
  color: #ffffff;
  border-color: #7c3aed;
}

.btn-snake {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #047857;
}
.btn-snake:hover {
  background: #10b981;
  color: #ffffff;
  border-color: #10b981;
}

.btn-shoot {
  background: #eef2ff;
  border-color: #c7d2fe;
  color: #3730a3;
}
.btn-shoot:hover {
  background: #4f46e5;
  color: #ffffff;
  border-color: #4f46e5;
}

/* 빈 화면 */
.empty-state {
  background: #ffffff;
  border: 2px dashed #cbd5e1;
  border-radius: var(--radius-lg);
  padding: 50px 20px;
  text-align: center;
  color: var(--muted);
  margin-top: 20px;
}
.group-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 12px 0 -2px; padding: 8px 14px; background: #0f172a; color: #fff; border-radius: 10px; font-weight: 800; font-size: 15px; }
.group-head .gh-sub { margin-left: auto; font-size: 12px; font-weight: 700; color: #cbd5e1; }
</style>
</head>
<body>

<!-- 상단 인지공학 헤더 -->
<header class="header">
  <div class="header-inner">
    <div class="brand-group">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">
        <h1>과학수업 통합 서랍 <span class="badge-cognitive">CTML 인지설계 v3.0</span></h1>
        <div class="brand-sub">이중부호화 · 작업기억 최적화 · 가상실험실 & 수업게임 연계 허브</div>
      </div>
    </div>
    <div class="header-utils">
      <button class="btn-guide-modal" id="btnBoard" title="가상실험을 전체화면 전자칠판 보기로 열기"><span>🖥 전자칠판 모드 : 켬</span></button>
      <a href="./가상실험실_서랍.html" class="btn-guide-modal" title="가상실험실 서랍">
        <span>🔬 가상실험</span>
      </a>
      <a href="./시작하기_수업게임서랍.html" class="btn-guide-modal" title="수업 게임 서랍">
        <span>🎮 수업게임</span>
      </a>
      <a href="./동기유발_서랍.html" class="btn-guide-modal" title="동기유발 서랍 (수업 시작 3분)">
        <span>🚀 동기유발</span>
      </a>
    </div>
  </div>

  <!-- 1차 네비게이션 (5개 이내 청킹) -->
  <nav class="primary-nav-bar">
    <div class="primary-nav-inner" id="primaryNav">
      <button class="primary-nav-btn active" onclick="setPrimaryFilter('ALL')">
        <span>전체 과학</span> <span class="nav-counter" id="countAll">0</span>
      </button>
      <button class="primary-nav-btn" onclick="setPrimaryFilter('중1')">
        <span>중1 과학</span> <span class="nav-counter" id="countJ1">0</span>
      </button>
      <button class="primary-nav-btn" onclick="setPrimaryFilter('중2')">
        <span>중2 과학</span> <span class="nav-counter" id="countJ2">0</span>
      </button>
      <button class="primary-nav-btn" onclick="setPrimaryFilter('중3')">
        <span>중3 과학</span> <span class="nav-counter" id="countJ3">0</span>
      </button>
      <button class="primary-nav-btn" onclick="setPrimaryFilter('FAV')">
        <span>★ 내 수업 서랍</span> <span class="nav-counter" id="countFav">0</span>
      </button>
    </div>
  </nav>
</header>

<!-- 메인 컨테이너 -->
<main class="container">

  <!-- 2차 네비게이션: CTML 수업 인지 단계 (Segmenting Principle) -->
  <section class="flow-selector-card">
    <div class="flow-title">
      <span>수업 인지 흐름 필터 (Mayer의 자르기 원리 기반)</span>
      <span style="font-weight:500;">한 화면에 관련 도구를 근접 배치합니다</span>
    </div>
    <div class="stage-chips" id="stageChips">
      <button class="stage-chip stage-all active" onclick="setStageFilter('ALL')">
        <span>전체 흐름 보기</span>
      </button>
      <button class="stage-chip stage-sim" onclick="setStageFilter('SIM')">
        <span>🔬 1단계: 가상실험실(미시·거시 탐구)</span>
      </button>
      <button class="stage-chip stage-ws" onclick="setStageFilter('WS')">
        <span>📄 2단계: 학생 탐구 활동지</span>
      </button>
      <button class="stage-chip stage-org" onclick="setStageFilter('ORG')">
        <span>🧠 3단계: 정리·개념화(마인드맵)</span>
      </button>
      <button class="stage-chip stage-eval" onclick="setStageFilter('EVAL')">
        <span>🔔 4단계: 형성평가·게임</span>
      </button>
    </div>
  </section>

  <!-- 검색 및 대단원 필터 바 -->
  <div class="filter-search-row">
    <div class="search-wrapper">
      <span>🔍</span>
      <input type="text" id="keywordSearch" class="search-input" placeholder="개념어, 법칙명, 차시 검색 (예: 정전기, 보일, 멘델, 네프론, 감수분열, 증류...)" autocomplete="off">
    </div>
    <div class="unit-chips-container" id="unitChips">
      <!-- JS 렌더링 -->
    </div>
  </div>

  <!-- 결과 헤더 -->
  <div class="results-info">
    <h3 id="resultTitle">수업 모듈 카드 (0개 차시)</h3>
    <div style="font-size:12.5px; color:var(--muted);" id="cognitiveTip">
      💡 <b>이중부호화 안내:</b> 각 카드에는 시각적 심상과 언어적 개념이 1:1로 짝지어져 있습니다.
    </div>
  </div>

  <!-- 단원별 통합 모듈 카드 그리드 (Spatial Contiguity Principle) -->
  <div class="lesson-grid" id="lessonGrid">
    <!-- JS 렌더링 -->
  </div>

  <!-- 빈 검색 결과 -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div style="font-size:32px; margin-bottom:10px;">🔬</div>
    <h3 style="margin:0 0 6px;">해당 조건의 수업 자료가 없습니다.</h3>
    <p style="margin:0;">검색어를 비우거나 다른 학년 또는 수업 인지 단계 탭을 눌러보세요.</p>
  </div>

</main>

<script>

/* 상태 관리 */
let selectedPrimary = "ALL"; // ALL, 중1, 중2, 중3, FAV
let selectedStage = "ALL";   // ALL, SIM, WS, ORG, EVAL
let selectedUnit = "ALL";
let searchQuery = "";

// 로컬 스토리지 즐겨찾기
const LS_FAV_KEY = "scihub_favs_v3";
let favs = {};
try { favs = JSON.parse(localStorage.getItem(LS_FAV_KEY) || "{}"); } catch(e) { favs = {}; }

function saveFavs() {
  try { localStorage.setItem(LS_FAV_KEY, JSON.stringify(favs)); } catch(e){}
}

function toggleFav(id, event) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  if (favs[id]) delete favs[id]; else favs[id] = true;
  saveFavs();
  updateCounters();
  render();
}

/* 필터 핸들러 */
function setPrimaryFilter(filter) {
  selectedPrimary = filter;
  selectedUnit = "ALL"; // 학년 변경 시 단원 리셋
  document.querySelectorAll(".primary-nav-btn").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");
  renderUnitChips();
  render();
}

function setStageFilter(stage) {
  selectedStage = stage;
  document.querySelectorAll(".stage-chip").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");
  render();
}

function setUnitFilter(unit) {
  selectedUnit = unit;
  document.querySelectorAll(".unit-chip").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");
  render();
}

/* 카운터 갱신 */
function updateCounters() {
  document.getElementById("countAll").textContent = LESSON_MODULES.length;
  document.getElementById("countJ1").textContent = LESSON_MODULES.filter(m => m.grade === "중1").length;
  document.getElementById("countJ2").textContent = LESSON_MODULES.filter(m => m.grade === "중2").length;
  document.getElementById("countJ3").textContent = LESSON_MODULES.filter(m => m.grade === "중3").length;
  document.getElementById("countFav").textContent = Object.keys(favs).length;
}

/* 대단원 칩 렌더링 */
function renderUnitChips() {
  const container = document.getElementById("unitChips");
  container.innerHTML = "";

  let modules = LESSON_MODULES;
  if (selectedPrimary !== "ALL" && selectedPrimary !== "FAV") {
    modules = modules.filter(m => m.grade === selectedPrimary);
  }

  const units = Array.from(new Set(modules.map(m => m.unit)));

  const allBtn = document.createElement("button");
  allBtn.className = "unit-chip" + (selectedUnit === "ALL" ? " active" : "");
  allBtn.textContent = "전체 단원";
  allBtn.onclick = () => setUnitFilter("ALL");
  container.appendChild(allBtn);

  units.forEach(u => {
    const btn = document.createElement("button");
    btn.className = "unit-chip" + (selectedUnit === u ? " active" : "");
    btn.textContent = u;
    btn.onclick = () => setUnitFilter(u);
    container.appendChild(btn);
  });
}

/* 메인 렌더링 엔진 */
function render() {
  const grid = document.getElementById("lessonGrid");
  const emptyState = document.getElementById("emptyState");
  const resultTitle = document.getElementById("resultTitle");
  const q = searchQuery.trim().toLowerCase();

  const filtered = LESSON_MODULES.filter(item => {
    // 1. 1차 학년/즐겨찾기 필터
    if (selectedPrimary === "FAV") {
      if (!favs[item.id]) return false;
    } else if (selectedPrimary !== "ALL") {
      if (item.grade !== selectedPrimary) return false;
    }

    // 2. 대단원 필터
    if (selectedUnit !== "ALL" && item.unit !== selectedUnit) return false;

    // 3. 2차 수업 인지 단계 필터
    if (selectedStage === "SIM" && !item.tools.sim) return false;
    if (selectedStage === "WS" && !item.tools.ws) return false;
    if (selectedStage === "ORG" && !item.tools.org) return false;
    if (selectedStage === "EVAL" && !item.tools.game) return false;

    // 4. 검색어 필터
    if (q) {
      const textBlock = (item.title + " " + item.lesson + " " + item.unit + " " + item.conceptLead + " " + item.keywords.join(" ")).toLowerCase();
      if (!textBlock.includes(q)) return false;
    }

    return true;
  });

  const GR = ["중1", "중2", "중3"];
  const UO = {
    "중1": ["과학과 인류의 지속가능한 삶", "생물의 구성과 다양성", "열", "물질의 상태 변화", "힘의 작용", "기체의 성질", "태양계"],
    "중2": ["물질의 특성", "지권의 변화", "빛과 파동", "물질의 구성", "식물과 에너지", "동물과 에너지", "전기와 자기", "별과 우주"],
    "중3": ["화학 반응의 규칙과 에너지 변화", "기권과 날씨", "운동과 에너지", "자극과 반응", "생식과 유전", "에너지 전환과 보존", "별과 우주"]
  };
  const gr = g => { const i = GR.indexOf(g); return i < 0 ? 9 : i; };
  const ur = (g, u) => { const i = (UO[g] || []).indexOf(u); return i < 0 ? 99 : i; };
  filtered.map((m, i) => (m._o = i, m));
  filtered.sort((a, b) => gr(a.grade) - gr(b.grade) || ur(a.grade, a.unit) - ur(b.grade, b.unit) || a._o - b._o);

  resultTitle.textContent = `수업 모듈 카드 (${filtered.length}개 차시 연계 세트)`;

  if (filtered.length === 0) {
    grid.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }

  emptyState.style.display = "none";
  grid.innerHTML = "";

  let lastGroup = "";
  filtered.forEach(m => {
    const gk = m.grade + "|" + m.unit;
    if (gk !== lastGroup) {
      const n = filtered.filter(x => x.grade + "|" + x.unit === gk).length;
      const gh = document.createElement("div");
      gh.className = "group-head";
      gh.innerHTML = `<span>${m.grade}</span><span>·</span><span>${m.unit}</span><span class="gh-sub">${n}개 차시</span>`;
      grid.appendChild(gh);
      lastGroup = gk;
    }
    const isFav = !!favs[m.id];
    const card = document.createElement("article");
    card.className = "lesson-card";

    // 도구 버튼 구성 (Spatial Contiguity: 4단계 수업 세트 근접 배치)
    let toolsHtml = "";
    
    // 1) 가상실험실
    if (m.tools.sim) {
      toolsHtml += `
        <a href="${simHref(m.tools.sim.url, m.title)}" class="btn-action btn-sim" target="_blank" title="가상실험실 조작">
          <span>🔬 ${m.tools.sim.nm}</span>
        </a>
      `;
    }
    // 1-2) 같은 차시의 추가 가상실험
    if (m.tools.sim2) {
      toolsHtml += `
        <a href="${simHref(m.tools.sim2.url, m.tools.sim2.nm)}" class="btn-action btn-sim" target="_blank" title="같은 차시의 추가 가상실험">
          <span>🔬 ${m.tools.sim2.nm}</span>
        </a>
      `;
    }
    // 2) 활동지
    if (m.tools.ws) {
      toolsHtml += `
        <a href="${m.tools.ws.url}" class="btn-action btn-ws" target="_blank" title="1쪽 오프라인 활동지 인쇄/열기">
          <span>📄 ${m.tools.ws.nm}</span>
        </a>
      `;
    }
    // 3) 개념화/마인드맵
    if (m.tools.org) {
      toolsHtml += `
        <a href="${m.tools.org.url}" class="btn-action btn-org" target="_blank" title="개념 구조화 및 정리">
          <span>🧠 ${m.tools.org.nm}</span>
        </a>
      `;
    }
    // 4) 형성평가/게임
    if (m.tools.game) {
      toolsHtml += `
        <a href="${m.tools.game.url}" class="btn-action btn-game" target="_blank" title="개념 인출 및 형성평가 게임">
          <span>🔔 ${m.tools.game.nm}</span>
        </a>
      `;
    }

    // 5) 올인원 뱀주사위 : 이 차시의 단원 퀴즈로 모둠 대항 보드게임
    {
      const SNAKE_UNITS = {
        "중1": ["기체의 성질", "물질의 상태 변화", "태양계"],
        "중2": ["전기와 자기", "빛과 파동", "물질의 특성", "물질의 구성", "식물과 에너지", "동물과 에너지", "별과 우주"],
        "중3": ["자극과 반응", "생식과 유전", "운동과 에너지", "에너지 전환과 보존", "별과 우주"]
      };
      const known = (SNAKE_UNITS[m.grade] || []).includes(m.unit);
      const fq = "g=" + encodeURIComponent(known ? m.grade : "전학년") + "&u=" + encodeURIComponent(known ? m.unit : "종합 과학");
      const sHref = boardMode
        ? "./전자칠판_실행기.html?f=" + encodeURIComponent("올인원_뱀주사위놀이.html") + "&imm=1&fq=" + encodeURIComponent(fq) + "&t=" + encodeURIComponent("올인원 뱀주사위")
        : "./올인원_뱀주사위놀이.html?" + fq;
      toolsHtml += `
        <a href="${sHref}" class="btn-action btn-snake" target="_blank" title="${known ? m.unit : '전 단원'} 퀴즈로 즐기는 모둠 뱀주사위 보드게임">
          <span>🐍 뱀주사위 (${known ? m.unit : '종합'})</span>
        </a>
      `;
    }

    // 6) 개념 격추 : 이 차시의 단원 개념으로 도전 (별과 우주는 해당 차시까지 바로 선택)
    {
      const SHOOT_UNITS = {
        "중1": ["과학과 인류의 지속가능한 삶", "생물의 구성과 다양성", "열", "물질의 상태 변화", "힘의 작용", "기체의 성질", "태양계"],
        "중2": ["물질의 특성", "지권의 변화", "빛과 파동", "물질의 구성", "식물과 에너지", "동물과 에너지", "전기와 자기", "별과 우주"],
        "중3": ["화학 반응의 규칙과 에너지 변화", "기권과 날씨", "운동과 에너지", "자극과 반응", "생식과 유전", "에너지 전환과 보존", "별과 우주"]
      };
      if ((SHOOT_UNITS[m.grade] || []).includes(m.unit)) {
        let lessonNo = "";
        if (m.unit === "별과 우주") {
          if (m.lesson.includes("색과 표면 온도")) lessonNo = "1";
          else if (m.lesson.includes("밝기와 등급")) lessonNo = "2";
          else if (m.lesson.includes("연주 시차")) lessonNo = "3";
        }
        const fq = "g=" + encodeURIComponent(m.grade) + "&u=" + encodeURIComponent(m.unit) + (lessonNo ? "&s=" + lessonNo : "");
        const kHref = boardMode
          ? "./전자칠판_실행기.html?f=" + encodeURIComponent("개념격추.html") + "&imm=1&fq=" + encodeURIComponent(fq) + "&t=" + encodeURIComponent("개념 격추")
          : "./개념격추.html?" + fq;
        toolsHtml += `
        <a href="${kHref}" class="btn-action btn-shoot" target="_blank" title="${m.unit}${lessonNo ? ' ' + lessonNo + '차시' : ''} 개념으로 도전하는 개념 격추">
          <span>🎯 개념 격추</span>
        </a>
      `;
      }
    }

    card.innerHTML = `
      <div>
        <div class="card-top">
          <div class="visual-anchor" title="개념 시각적 심상">${m.icon}</div>
          <div class="title-area">
            <div class="meta-badges">
              <span class="badge-grade">${m.grade}</span>
              <span class="badge-unit">${m.unit}</span>
              <span class="badge-unit" style="background:#fff7ed;color:#c2410c;">📘 ${m.lesson}</span>
            </div>
            <h4 class="lesson-card-title">${m.title}</h4>
          </div>
          <button class="btn-star ${isFav ? 'active' : ''}" onclick="toggleFav('${m.id}', event)" title="내 수업 서랍에 담기">
            ★
          </button>
        </div>

        <div class="concept-lead">
          ${m.conceptLead}
        </div>

        <div class="concept-tags">
          ${m.keywords.map(k => `<span class="tag-kw">#${k}</span>`).join("")}
        </div>
      </div>

      <div class="card-tools-matrix">
        <div class="matrix-label">
          <span>⚡ 연계 수업 도구 세트 (공간적 근접성)</span>
        </div>
        <div class="action-btn-row">
          ${toolsHtml}
        </div>
      </div>
    `;

    grid.appendChild(card);
  });
}

/* 검색 리스너 */
document.getElementById("keywordSearch").addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});

// 초기화
updateCounters();
renderUnitChips();
render();

document.getElementById("btnBoard").onclick = () => { boardMode = !boardMode; try { localStorage.setItem(LS_BOARD, boardMode ? "on" : "off"); } catch(e) {} syncBoardBtn(); if (typeof render === "function") render(); };
syncBoardBtn();

<script id="visitCounter">
/* 방문자 수 표시 (맨 아래 작게) — 무료 Abacus 카운터 사용, 개인정보·로그인 없음.
   · 같은 브라우저는 하루에 한 번만 센다 / 인터넷이 없거나 막혀 있으면 아무것도 표시하지 않는다 */
(function(){
  if(typeof fetch!=='function')return;
  try{
  var NS_OVERRIDE='';   /* 직접 지정하려면 영문·숫자로 입력 (예: 'my-science-lab'). 비워 두면 주소로 자동 생성 */
  var API='https://abacus.jasoncameron.dev';
  var h=location.hostname;
  if(!/^https?:$/.test(location.protocol)||/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(h))return;
  var seg=(location.pathname.split('/')[1]||'');if(/\.html?$/i.test(seg))seg='';
  var ns=(NS_OVERRIDE||('sci-'+h+(seg?'-'+seg:''))).replace(/[^A-Za-z0-9_.\-]/g,'-').slice(0,60);
  var d=new Date(),p=function(n){return(n<10?'0':'')+n;},day=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  var LS='vcDay_'+ns,seen='';try{seen=localStorage.getItem(LS)||'';}catch(e){}
  var first=(seen!==day);
  function call(kind,key){
    var url=API+'/'+kind+'/'+encodeURIComponent(ns)+'/'+encodeURIComponent(key);
    var ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();},5000);
    return fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(t);return r.ok?r.json():null;}).catch(function(){clearTimeout(t);return null;});
  }
  var kind=first?'hit':'get';
  Promise.all([call(kind,'total'),call(kind,'d'+day)]).then(function(r){
    var total=r[0]&&r[0].value,today=r[1]&&r[1].value;
    if(typeof total!=='number')return;
    if(first){try{localStorage.setItem(LS,day);}catch(e){}}
    var f=function(n){return typeof n==='number'?n.toLocaleString('ko-KR'):'-';};
    var el=document.createElement('div');el.id='vcBox';
    el.style.cssText='text-align:center;font-size:12px;line-height:1.4;color:#94a3b8;padding:14px 8px 18px;font-family:inherit;font-weight:600;letter-spacing:.01em;user-select:none;-webkit-user-select:none';
    el.setAttribute('aria-label','방문자 수');
    el.textContent='👀 방문자  오늘 '+f(today)+'  ·  전체 '+f(total);
    document.body.appendChild(el);
  });
  }catch(e){}
})();
</script>
</body>
</html>
