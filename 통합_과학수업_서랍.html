<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과학수업 통합 서랍 · Cognitive Science Hub</title>
<style>
:root {
  --primary-blue: #2563eb;
  --primary-indigo: #4338ca;
  --accent-amber: #d97706;
  --accent-green: #059669;
  --accent-purple: #7c3aed;
  --ink: #0f172a;
  --ink-light: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --bg: #f8fafc;
  --card: #ffffff;
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.05);
  --shadow-lg: 0 10px 25px -3px rgba(15,23,42,0.09), 0 4px 8px -4px rgba(15,23,42,0.04);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { text-decoration: none; color: inherit; }

/* ==========================================================================
   1. 인지공학적 헤더 (정보 압축 및 청킹)
   ========================================================================== */
.header {
  background: #ffffff;
  border-bottom: 1.5px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 10px rgba(15,23,42,0.04);
}

.header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.brand-title h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #0f172a;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-sub {
  margin: 2px 0 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.badge-cognitive {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 999px;
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #bfdbfe;
}

.header-utils {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-guide-modal {
  background: #f1f5f9;
  border: 1px solid var(--line-strong);
  color: var(--ink-light);
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn-guide-modal:hover {
  background: #e2e8f0;
  color: var(--ink);
}

/* ==========================================================================
   2. 1차 네비게이션 (작업기억 5개 이하 청킹)
   ========================================================================== */
.primary-nav-bar {
  background: #f8fafc;
  border-bottom: 1px solid var(--line);
}
.primary-nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}
.primary-nav-btn {
  padding: 12px 18px;
  font-size: 14.5px;
  font-weight: 800;
  color: #475569;
  background: transparent;
  border: none;
  display: flex;
  align-items: center;
  gap: 7px;
  position: relative;
  transition: all 0.15s;
  white-space: nowrap;
}
.primary-nav-btn:hover {
  color: var(--primary-blue);
}
.primary-nav-btn.active {
  color: var(--primary-blue);
  background: #ffffff;
}
.primary-nav-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--primary-blue);
}
.nav-counter {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: #e2e8f0;
  color: #475569;
}
.primary-nav-btn.active .nav-counter {
  background: #dbeafe;
  color: #1e40af;
}

/* ==========================================================================
   3. 메인 레이아웃 및 2차 네비게이션 (CTML 수업 인지 단계)
   ========================================================================== */
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* 수업 인지 흐름 바 (Segmenting Principle) */
.flow-selector-card {
  background: #ffffff;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.flow-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stage-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: thin;
}
.stage-chip {
  background: #f1f5f9;
  border: 1.5px solid #e2e8f0;
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 13.5px;
  font-weight: 800;
  color: #334155;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.15s;
}
.stage-chip:hover {
  background: #e2e8f0;
  border-color: #cbd5e1;
}
.stage-chip.active {
  background: #0f172a;
  border-color: #0f172a;
  color: #ffffff;
}

/* 특정 인지 단계별 신호화(Signaling) 컬러 */
.stage-chip.stage-all.active { background: #0f172a; border-color: #0f172a; }
.stage-chip.stage-sim.active { background: #2563eb; border-color: #1d4ed8; }
.stage-chip.stage-ws.active { background: #059669; border-color: #047857; }
.stage-chip.stage-org.active { background: #0891b2; border-color: #0e7490; }
.stage-chip.stage-eval.active { background: #7c3aed; border-color: #6d28d9; }

/* 검색 및 대단원 칩 바 */
.filter-search-row {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.search-wrapper {
  flex: 1;
  min-width: 280px;
  background: #ffffff;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius-md);
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
}
.search-wrapper:focus-within {
  border-color: var(--primary-blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.search-input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  padding: 10px 0;
  font-size: 14.5px;
}
.unit-chips-container {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.unit-chip {
  background: #ffffff;
  border: 1px solid var(--line-strong);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-light);
  transition: all 0.15s;
}
.unit-chip:hover {
  border-color: var(--primary-blue);
  color: var(--primary-blue);
}
.unit-chip.active {
  background: #eff6ff;
  border-color: #3b82f6;
  color: #1d4ed8;
  font-weight: 800;
}

/* ==========================================================================
   4. 단원별 통합 모듈 카드 (Integrated Lesson Card)
   - Spatial Contiguity Principle: 가상실험+활동지+게임을 한 영역에 배치
   ========================================================================== */
.results-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
}
.results-info h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  color: #334155;
}

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
}
@media (max-width: 680px) {
  .lesson-grid { grid-template-columns: 1fr; }
}

.lesson-card {
  background: #ffffff;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.lesson-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: #cbd5e1;
}

/* 이중부호화 헤더 (시각적 앵커 + 언어적 앵커) */
.card-top {
  display: flex;
  gap: 14px;
  margin-bottom: 12px;
}
.visual-anchor {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: #f8fafc;
  border: 1.5px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 26px;
}

.title-area {
  flex: 1;
}
.meta-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.badge-grade {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #0f172a;
  color: #ffffff;
}
.badge-unit {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #e2e8f0;
}
.lesson-card-title {
  margin: 0;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #0f172a;
  line-height: 1.35;
}

.btn-star {
  background: transparent;
  border: none;
  font-size: 20px;
  color: #cbd5e1;
  padding: 2px;
  line-height: 1;
  transition: transform 0.15s, color 0.15s;
}
.btn-star:hover { transform: scale(1.2); }
.btn-star.active { color: #f59f00; }

/* 인지적 개념 설명 및 발문 앵커 */
.concept-lead {
  font-size: 13.5px;
  color: #334155;
  line-height: 1.55;
  margin: 0 0 14px;
  background: #f8fafc;
  border-left: 3px solid #2563eb;
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
}

/* 키워드 태그 */
.concept-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.tag-kw {
  font-size: 11px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  color: #64748b;
  padding: 2px 6px;
  border-radius: 4px;
}

/* ==========================================================================
   5. 공간적 근접성 액션 버튼 매트릭스 (4단계 수업 도구 세트)
   ========================================================================== */
.card-tools-matrix {
  border-top: 1px dashed var(--line);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.matrix-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 4px;
}

.action-btn-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 6px;
}

.btn-action {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-align: center;
  transition: all 0.15s;
  border: 1.5px solid transparent;
}

/* 신호화 컬러 매핑 */
/* 1) 가상실험실 (Blue) */
.btn-sim {
  background: #eff6ff;
  border-color: #bfdbfe;
  color: #1d4ed8;
}
.btn-sim:hover {
  background: #2563eb;
  color: #ffffff;
  border-color: #2563eb;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
}

/* 2) 탐구 활동지 (Green) */
.btn-ws {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #047857;
}
.btn-ws:hover {
  background: #059669;
  color: #ffffff;
  border-color: #059669;
}

/* 3) 개념 정리 도구 (Teal/Cyan) */
.btn-org {
  background: #f0fdfa;
  border-color: #99f6e4;
  color: #0f766e;
}
.btn-org:hover {
  background: #0d9488;
  color: #ffffff;
  border-color: #0d9488;
}

/* 4) 형성평가 & 게임 (Purple) */
.btn-game {
  background: #faf5ff;
  border-color: #e9d5ff;
  color: #7e22ce;
}
.btn-game:hover {
  background: #7c3aed;
  color: #ffffff;
  border-color: #7c3aed;
}

.btn-snake {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #047857;
}
.btn-snake:hover {
  background: #10b981;
  color: #ffffff;
  border-color: #10b981;
}

.btn-shoot {
  background: #eef2ff;
  border-color: #c7d2fe;
  color: #3730a3;
}
.btn-shoot:hover {
  background: #4f46e5;
  color: #ffffff;
  border-color: #4f46e5;
}

/* 빈 화면 */
.empty-state {
  background: #ffffff;
  border: 2px dashed #cbd5e1;
  border-radius: var(--radius-lg);
  padding: 50px 20px;
  text-align: center;
  color: var(--muted);
  margin-top: 20px;
}
.group-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 12px 0 -2px; padding: 8px 14px; background: #0f172a; color: #fff; border-radius: 10px; font-weight: 800; font-size: 15px; }
.group-head .gh-sub { margin-left: auto; font-size: 12px; font-weight: 700; color: #cbd5e1; }

/* ===== 간소화: 한 줄 필터 바 + 접이식 목록 (주의집중 부담 최소화) ===== */
.header-inner{padding:8px 16px;gap:10px}
.brand-icon{width:36px;height:36px;font-size:18px;border-radius:10px}
.brand-title h1{font-size:18px}
.container{padding-top:14px}
.results-info{margin-bottom:10px}
.fbar{position:relative;display:flex;gap:8px;align-items:stretch;margin:0 0 12px;flex-wrap:wrap;z-index:60}
.fbar .search-wrapper{flex:1 1 240px;min-width:200px}
.fbar .search-input{padding:11px 0}
.fb-btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;font-size:14px;font-weight:700;color:#334155;white-space:nowrap;cursor:pointer}
.fb-btn .fb-k{font-size:11.5px;font-weight:800;color:#64748b}
.fb-btn b{display:inline-block;font-weight:800;color:#0f172a;max-width:9.5em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.fb-btn i{font-style:normal;font-size:11px;color:#64748b}
.fb-btn.on{background:#eff6ff;border-color:#3b82f6}
.fb-btn.on b{color:#1d4ed8}
.fb-btn.open{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.fb-fav.on{background:#fffbeb;border-color:#f59f00;color:#b45309}
.fb-home.on{background:#0f172a;border-color:#0f172a;color:#fff}
.fpanel{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1.5px solid #cbd5e1;border-radius:14px;box-shadow:0 10px 25px -3px rgba(15,23,42,.18);padding:12px;max-height:60vh;overflow:auto}
.fpanel.open{display:block}
.fpanel .primary-nav-inner,.fpanel .unit-chips-container,.fpanel .grade-chips-container,.fpanel .stage-chips{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding:0;margin:0;max-width:none}
.fpanel .primary-nav-btn{border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 14px;background:#f8fafc;min-height:44px}
.fpanel .primary-nav-btn.active{background:#eff6ff;border-color:#3b82f6;color:#1d4ed8}
.fpanel .primary-nav-btn.active::after{display:none}
.fpanel .unit-chip,.fpanel .grade-chip,.fpanel .stage-chip{min-height:40px;padding:8px 14px}
.btn-all{min-height:40px;padding:0 16px;border-radius:10px;border:1.5px solid #0f172a;background:#0f172a;color:#fff;font-weight:800;font-size:13.5px;cursor:pointer}
@media (max-width:640px){.fb-btn b{max-width:6em}.fbar .search-wrapper{flex-basis:100%}}
/* ===== 단원 연계 지도 (v2) ===== */
.unit-map{grid-column:1/-1;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 14px;margin:-2px 0 6px;display:grid;gap:7px;font-size:13px}
.unit-map .um-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.unit-map .um-lab{flex:0 0 92px;font-weight:900;color:#334155;font-size:12.5px}
.unit-map .um-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1.5px solid #cbd5e1;background:#fff;color:#0f172a;font-weight:800;font-size:12.5px;cursor:pointer;text-decoration:none;font-family:inherit}
.unit-map .um-chip:hover{border-color:#2563eb;color:#1d4ed8}
.unit-map .um-chip .no{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#0f172a;color:#fff;font-size:11px}
.unit-map .um-arrow{color:#94a3b8;font-weight:900}
.unit-map .um-chip.intro{background:#fefce8;border-color:#fde68a;color:#a16207}
.unit-map .um-chip.wrap{background:#faf5ff;border-color:#e9d5ff;color:#7e22ce}
.unit-map .um-chip.link{background:#ecfeff;border-color:#a5f3fc;color:#0e7490}
.unit-map .um-why{font-weight:600;color:#64748b;font-size:12px}
.btn-intro{background:#fefce8;color:#a16207;border-color:#fde68a}
.btn-intro:hover{background:#fef9c3}
.stp{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:50%;background:rgba(15,23,42,.85);color:#fff;font-size:10.5px;font-weight:900;margin-right:3px}
.lesson-nav{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed #e2e8f0;font-size:12px}
.lesson-nav button{flex:1;min-width:0;border:1.5px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:6px 8px;font-weight:800;font-size:12px;color:#334155;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
.lesson-nav button:hover:not(:disabled){border-color:#2563eb;color:#1d4ed8}
.lesson-nav button:disabled{opacity:.35;cursor:default}
.lesson-nav .ln-pos{flex:0 0 auto;font-weight:900;color:#64748b}
.lesson-card.flash{animation:cardFlash 1.6s ease}
@keyframes cardFlash{0%,60%{box-shadow:0 0 0 4px #38bdf8;border-color:#38bdf8}100%{}}
@media (max-width:680px){.unit-map .um-lab{flex-basis:100%}}
.unit-map .um-chip.mg-h{display:none}
</style>
</head>
<body>

<!-- 상단 인지공학 헤더 -->
<header class="header">
  <div class="header-inner">
    <div class="brand-group">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">
        <h1>과학수업 통합 서랍 <span class="badge-cognitive">CTML 인지설계 v3.0</span></h1>
        <div class="brand-sub">이중부호화 · 작업기억 최적화 · 가상실험실 & 수업게임 연계 허브</div>
      </div>

}

  h += `<div class="um-row"><span class="um-lab">🏁 단원 마무리</span>` +

  if (ug.length) h += `<div class="um-row"><span class="um-lab">🎮 단원 게임</span>` + ug.map((x, i) => `<a class="um-chip wrap${i >= 6 ? " mg-h" : ""}" href="${gameLink(x)}" target="_blank" title="수업 게임 서랍에 등록된 게임">${x.ic} ${x.nm}</a>`).join("") + (ug.length > 6 ? `<button type="button" class="um-chip" onclick="this.parentNode.querySelectorAll('.mg-h').forEach(e => e.classList.remove('mg-h')); this.remove();">＋${ug.length - 6}개 더</button>` : "") + `</div>`;
  const prev = UNIT_LINKS.filter(l => l[1] === key), next = UNIT_LINKS.filter(l => l[0] === key);

      next.map(l => lk(l[1], l[2], "이어서 ▶")).join(" ") + `</div>`;
  }
  box.innerHTML = h; return box;
}

/* ===== 한 줄 필터 바 : 드롭다운 패널 열기/닫기 ===== */
function closePanels(){
  document.querySelectorAll(".fpanel.open").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".fb-btn[data-p]").forEach(b => { b.classList.remove("open"); b.setAttribute("aria-expanded","false"); });
}
function togglePanel(btn){
  const p = document.getElementById(btn.dataset.p);
  const was = p.classList.contains("open");
  closePanels();
  if (!was) { p.classList.add("open"); btn.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
}
function initBar(){
  document.querySelectorAll(".fb-btn[data-p]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); togglePanel(b); }));
  document.querySelectorAll(".fpanel").forEach(p => {
    p.addEventListener("click", () => { showAll = true; }, true);
    p.addEventListener("click", e => { if (e.target.closest("button")) closePanels(); });
  });
  document.addEventListener("click", e => { if (!e.target.closest(".fbar")) closePanels(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePanels(); });
}
function fbSet(id, t){ const e = document.getElementById(id); if (e) e.textContent = t; }
function fbOn(id, on){ const e = document.getElementById(id); if (e) e.classList.toggle("on", !!on); }

const PRI_KEYS = ["ALL","중1","중2","중3","FAV"];
const PRI_LABEL = {ALL:"전체 과학", "중1":"중1 과학", "중2":"중2 과학", "중3":"중3 과학", FAV:"내 수업 서랍"};
const STAGE_LABEL = {ALL:"전체 흐름", SIM:"가상실험", WS:"활동지", ORG:"마인드맵", EVAL:"형성평가·게임"};
const UORD = ["과학과 인류의 지속가능한 삶","생물의 구성과 다양성","열","물질의 상태 변화","힘의 작용","기체의 성질","태양계","물질의 특성","지권의 변화","빛과 파동","물질의 구성","식물과 에너지","동물과 에너지","전기와 자기","별과 우주","화학 반응의 규칙과 에너지 변화","기권과 날씨","운동과 에너지","자극과 반응","생식과 유전","에너지 전환과 보존"];
let homeMeta = {nf:0, nr:0, fb:false};
function isHome(){ return !showAll && selectedPrimary === "ALL" && selectedStage === "ALL" && selectedUnit === "ALL" && !searchQuery.trim(); }
function homeList(){
  const fv = LESSON_MODULES.filter(m => favs[m.id]);
  const rec = recents.map(id => LESSON_MODULES.find(m => m.id === id)).filter(m => m && !favs[m.id]);
  homeMeta = {nf: fv.length, nr: rec.length, fb: false};
  let list = fv.concat(rec);
  if (!list.length) { list = LESSON_MODULES.slice(0, 6); homeMeta.fb = true; }
  return list;
}
function homeTitle(){
  return homeMeta.fb ? "처음이라면 이 차시부터 (추천 6개)" : "★ 즐겨찾기 " + homeMeta.nf + " · 🕘 최근 사용 " + homeMeta.nr;
}
function renderHomeAct(home){
  const e = document.getElementById("homeAct"); if (!e) return;
  e.innerHTML = home ? '<button type="button" class="btn-all" onclick="showAllNow()">전체 ' + LESSON_MODULES.length + '개 차시 보기 ▸</button>' : "";
}
function showAllNow(){ showAll = true; render(); }
function syncNavActive(){
  document.querySelectorAll(".primary-nav-btn").forEach((b, i) => b.classList.toggle("active", PRI_KEYS[i] === selectedPrimary));
  document.querySelectorAll(".stage-chip").forEach((b, i) => b.classList.toggle("active", i === 0));
}
function goHome(){
  selectedPrimary = "ALL"; selectedStage = "ALL"; selectedUnit = "ALL"; searchQuery = ""; showAll = false;
  const inp = document.getElementById("keywordSearch"); if (inp) inp.value = "";
  closePanels(); syncNavActive(); renderUnitChips(); render();
}
function toggleFavView(){
  showAll = true; closePanels();
  selectedPrimary = (selectedPrimary === "FAV") ? "ALL" : "FAV"; selectedUnit = "ALL";
  syncNavActive(); renderUnitChips(); render();
}
function syncBar(){
  fbSet("fbCatV", selectedPrimary === "ALL" ? (showAll ? "전체 과학" : "처음 화면") : (PRI_LABEL[selectedPrimary] || selectedPrimary));
  fbSet("fbUnitV", selectedUnit === "ALL" ? "전체" : selectedUnit);
  fbSet("fbStageV", STAGE_LABEL[selectedStage] || "전체 흐름");
  fbSet("fbFavN", Object.keys(favs).length);
  fbOn("fbCat", selectedPrimary !== "ALL"); fbOn("fbUnit", selectedUnit !== "ALL"); fbOn("fbStage", selectedStage !== "ALL");
  fbOn("fbFav", selectedPrimary === "FAV"); fbOn("fbHome", isHome());
}

/* 필터 핸들러 */
function setPrimaryFilter(filter) {
  selectedPrimary = filter;
  selectedUnit = "ALL"; // 학년 변경 시 단원 리셋
  document.querySelectorAll(".primary-nav-btn").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");
  renderUnitChips();
  render();
}

function setStageFilter(stage) {
  selectedStage = stage;
  document.querySelectorAll(".stage-chip").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");
  render();
}

function setUnitFilter(unit) {
  selectedUnit = unit;
  document.querySelectorAll(".unit-chip").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");
  render();
}

/* 카운터 갱신 */
function updateCounters() {
  document.getElementById("countAll").textContent = LESSON_MODULES.length;
  document.getElementById("countJ1").textContent = LESSON_MODULES.filter(m => m.grade === "중1").length;
  document.getElementById("countJ2").textContent = LESSON_MODULES.filter(m => m.grade === "중2").length;
  document.getElementById("countJ3").textContent = LESSON_MODULES.filter(m => m.grade === "중3").length;
  document.getElementById("countFav").textContent = Object.keys(favs).length;
}

/* 대단원 칩 렌더링 */
function renderUnitChips() {
  const container = document.getElementById("unitChips");
  container.innerHTML = "";

  let modules = LESSON_MODULES;
  if (selectedPrimary !== "ALL" && selectedPrimary !== "FAV") {
    modules = modules.filter(m => m.grade === selectedPrimary);
  }

  const _gr = g => ["중1", "중2", "중3"].indexOf(g);
  const _rank = u => { let best = [9, 99]; modules.forEach(m => { if (m.unit === u) { const r = [_gr(m.grade), (UNITS_KNOWN[m.grade] || []).indexOf(m.unit)]; if (r[0] < best[0] || (r[0] === best[0] && r[1] < best[1])) best = r; } }); return best; };
  const units = Array.from(new Set(modules.map(m => m.unit))).sort((a, b) => { const x = _rank(a), y = _rank(b); return x[0] - y[0] || x[1] - y[1]; });

  const allBtn = document.createElement("button");
  allBtn.className = "unit-chip" + (selectedUnit === "ALL" ? " active" : "");
  allBtn.textContent = "전체 단원";
  allBtn.onclick = () => setUnitFilter("ALL");
  container.appendChild(allBtn);

  units.forEach(u => {
    const btn = document.createElement("button");
    btn.className = "unit-chip" + (selectedUnit === u ? " active" : "");
    btn.textContent = u;
    btn.onclick = () => setUnitFilter(u);
    container.appendChild(btn);
  });
}

/* 메인 렌더링 엔진 */
function render() {
  const grid = document.getElementById("lessonGrid");
  const emptyState = document.getElementById("emptyState");
  const resultTitle = document.getElementById("resultTitle");
  const q = searchQuery.trim().toLowerCase();

  let filtered = LESSON_MODULES.filter(item => {
    // 1. 1차 학년/즐겨찾기 필터
    if (selectedPrimary === "FAV") {
      if (!favs[item.id]) return false;
    } else if (selectedPrimary !== "ALL") {
      if (item.grade !== selectedPrimary) return false;
    }

    // 2. 대단원 필터
    if (selectedUnit !== "ALL" && item.unit !== selectedUnit) return false;

    // 3. 2차 수업 인지 단계 필터
    if (selectedStage === "SIM" && !item.tools.sim) return false;
    if (selectedStage === "WS" && !item.tools.ws) return false;
    if (selectedStage === "ORG" && !item.tools.org) return false;
    if (selectedStage === "EVAL" && !item.tools.game) return false;

    // 4. 검색어 필터
    if (q) {
      const textBlock = (item.title + " " + item.lesson + " " + item.unit + " " + item.conceptLead + " " + item.keywords.join(" ")).toLowerCase();
      if (!textBlock.includes(q)) return false;
    }

    return true;
  });

  const home = isHome();
  if (home) filtered = homeList();

  const GR = ["중1", "중2", "중3"];
  const UO = {
    "중1": ["과학과 인류의 지속가능한 삶", "생물의 구성과 다양성", "열", "물질의 상태 변화", "힘의 작용", "기체의 성질", "태양계"],
    "중2": ["물질의 특성", "지권의 변화", "빛과 파동", "물질의 구성", "식물과 에너지", "동물과 에너지", "전기와 자기", "별과 우주"],
    "중3": ["화학 반응의 규칙과 에너지 변화", "기권과 날씨", "운동과 에너지", "자극과 반응", "생식과 유전", "에너지 전환과 보존", "별과 우주"]
  };
  const gr = g => { const i = GR.indexOf(g); return i < 0 ? 9 : i; };
  const ur = (g, u) => { const i = (UO[g] || []).indexOf(u); return i < 0 ? 99 : i; };
  if (!home) { filtered.map((m, i) => (m._o = i, m));
  filtered.sort((a, b) => gr(a.grade) - gr(b.grade) || ur(a.grade, a.unit) - ur(b.grade, b.unit) || flowPos(a) - flowPos(b) || a._o - b._o); }

  resultTitle.textContent = home ? homeTitle() : `수업 모듈 카드 (${filtered.length}개 차시 연계 세트)`;
  renderHomeAct(home);
  syncBar();

  if (filtered.length === 0) {
    grid.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }

  emptyState.style.display = "none";
  grid.innerHTML = "";

  let lastGroup = "";
  filtered.forEach(m => {
    const gk = m.grade + "|" + m.unit;
    if (!home && gk !== lastGroup) {
      const n = filtered.filter(x => x.grade + "|" + x.unit === gk).length;
      const gh = document.createElement("div");
      gh.className = "group-head";
      gh.innerHTML = `<span>${m.grade}</span><span>·</span><span>${m.unit}</span><span class="gh-sub">${n}개 차시</span>`;
      grid.appendChild(gh);
      grid.appendChild(unitMapEl(m.grade, m.unit));
      lastGroup = gk;
    }
    const isFav = !!favs[m.id];
    const card = document.createElement("article");
    card.className = "lesson-card";
    card.dataset.id = m.id;
    card.id = "card-" + m.id;

    // 도구 버튼 구성 (Spatial Contiguity: 4단계 수업 세트 근접 배치)
    let toolsHtml = `
        <a href="${introHref(m.grade, m.unit)}" class="btn-action btn-intro" target="_blank" title="수업 시작 3분 동기유발 (${m.unit})">
          <span><i class="stp">①</i>🚀 도입 3분</span>
        </a>
      `;
    
    // 1) 가상실험실
    if (m.tools.sim) {
      toolsHtml += `
        <a href="${simHref(m.tools.sim.url, m.title)}" class="btn-action btn-sim" target="_blank" title="가상실험실 조작">
          <span><i class="stp">②</i>🔬 ${m.tools.sim.nm}</span>
        </a>
      `;
    }
    // 1-2) 같은 차시의 추가 가상실험
    if (m.tools.sim2) {
      toolsHtml += `
        <a href="${simHref(m.tools.sim2.url, m.tools.sim2.nm)}" class="btn-action btn-sim" target="_blank" title="같은 차시의 추가 가상실험">
          <span><i class="stp">②</i>🔬 ${m.tools.sim2.nm}</span>
        </a>
      `;
    }
    // 1-3) 같은 차시의 탐구형 가상실험실 (more)
    if (Array.isArray(m.tools.more)) {
      m.tools.more.forEach(x => {
        toolsHtml += `
        <a href="${simHref(x.url, x.nm)}" class="btn-action btn-sim" target="_blank" title="같은 차시의 탐구형 가상실험실">
          <span><i class="stp">②</i>🔬 ${x.nm}</span>
        </a>
      `;
      });
    }
    // 2) 활동지
    if (m.tools.ws) {
      toolsHtml += `
        <a href="${m.tools.ws.url}" class="btn-action btn-ws" target="_blank" title="1쪽 오프라인 활동지 인쇄/열기">
          <span><i class="stp">③</i>📄 ${m.tools.ws.nm}</span>
        </a>
      `;
    }
    // 3) 개념화/마인드맵
    if (m.tools.org) {
      toolsHtml += `
        <a href="${m.tools.org.url}" class="btn-action btn-org" target="_blank" title="개념 구조화 및 정리">
          <span><i class="stp">④</i>🧠 ${m.tools.org.nm}</span>
        </a>
      `;
    }
    // 4) 형성평가/게임
    if (m.tools.game) {
      toolsHtml += `
        <a href="${m.tools.game.url}" class="btn-action btn-game" target="_blank" title="개념 인출 및 형성평가 게임">
          <span><i class="stp">⑤</i>🔔 ${m.tools.game.nm}</span>
        </a>
      `;
    }

    // 5) 올인원 뱀주사위 : 이 차시의 단원 퀴즈로 모둠 대항 보드게임
    {
      const SNAKE_UNITS = {
        "중1": ["기체의 성질", "물질의 상태 변화", "태양계"],
        "중2": ["전기와 자기", "빛과 파동", "물질의 특성", "물질의 구성", "식물과 에너지", "동물과 에너지", "별과 우주"],
        "중3": ["자극과 반응", "생식과 유전", "운동과 에너지", "에너지 전환과 보존", "별과 우주"]
      };
      const known = (SNAKE_UNITS[m.grade] || []).includes(m.unit);
      const fq = "g=" + encodeURIComponent(known ? m.grade : "전학년") + "&u=" + encodeURIComponent(known ? m.unit : "종합 과학");
      const sHref = boardMode
        ? "./전자칠판_실행기.html?f=" + encodeURIComponent("올인원_뱀주사위놀이.html") + "&imm=1&fq=" + encodeURIComponent(fq) + "&t=" + encodeURIComponent("올인원 뱀주사위")
        : "./올인원_뱀주사위놀이.html?" + fq;
      toolsHtml += `
        <a href="${sHref}" class="btn-action btn-snake" target="_blank" title="${known ? m.unit : '전 단원'} 퀴즈로 즐기는 모둠 뱀주사위 보드게임">
          <span><i class="stp">⑤</i>🐍 뱀주사위 (${known ? m.unit : '종합'})</span>
        </a>
      `;
    }

    // 6) 개념 격추 : 이 차시의 단원 개념으로 도전 (별과 우주는 해당 차시까지 바로 선택)
    {
      const SHOOT_UNITS = {
        "중1": ["과학과 인류의 지속가능한 삶", "생물의 구성과 다양성", "열", "물질의 상태 변화", "힘의 작용", "기체의 성질", "태양계"],
        "중2": ["물질의 특성", "지권의 변화", "빛과 파동", "물질의 구성", "식물과 에너지", "동물과 에너지", "전기와 자기", "별과 우주"],
        "중3": ["화학 반응의 규칙과 에너지 변화", "기권과 날씨", "운동과 에너지", "자극과 반응", "생식과 유전", "에너지 전환과 보존", "별과 우주"]
      };
      if ((SHOOT_UNITS[m.grade] || []).includes(m.unit)) {
        let lessonNo = "";
        if (m.unit === "별과 우주") {
          if (m.lesson.includes("색과 표면 온도")) lessonNo = "1";
          else if (m.lesson.includes("밝기와 등급")) lessonNo = "2";
          else if (m.lesson.includes("연주 시차")) lessonNo = "3";
        }
        const fq = "g=" + encodeURIComponent(m.grade) + "&u=" + encodeURIComponent(m.unit) + (lessonNo ? "&s=" + lessonNo : "");
        const kHref = boardMode
          ? "./전자칠판_실행기.html?f=" + encodeURIComponent("개념격추.html") + "&imm=1&fq=" + encodeURIComponent(fq) + "&t=" + encodeURIComponent("개념 격추")
          : "./개념격추.html?" + fq;
        toolsHtml += `
        <a href="${kHref}" class="btn-action btn-shoot" target="_blank" title="${m.unit}${lessonNo ? ' ' + lessonNo + '차시' : ''} 개념으로 도전하는 개념 격추">
          <span><i class="stp">⑤</i>🎯 개념 격추</span>
        </a>
      `;
      }
    }

    const _fl = flowOf(m.grade, m.unit), _ix = _fl.findIndex(x => x.id === m.id);
    const _pv = _ix > 0 ? _fl[_ix - 1] : null, _nx = _ix >= 0 && _ix < _fl.length - 1 ? _fl[_ix + 1] : null;
    const navHtml = `<div class="lesson-nav">
          <button ${_pv ? `onclick="goCard('${_pv.id}')" title="${_pv.lesson}"` : "disabled"}>◀ ${_pv ? _pv.lesson.replace(/^별의 특성 : |^우주의 구성 : /, "") : "첫 차시"}</button>
          <span class="ln-pos">${_ix + 1}/${_fl.length}</span>
          <button ${_nx ? `onclick="goCard('${_nx.id}')" title="${_nx.lesson}"` : "disabled"}>${_nx ? _nx.lesson.replace(/^별의 특성 : |^우주의 구성 : /, "") : "마지막 차시"} ▶</button>
        </div>`;
    card.innerHTML = `
      <div>
        <div class="card-top">
          <div class="visual-anchor" title="개념 시각적 심상">${m.icon}</div>
          <div class="title-area">
            <div class="meta-badges">
              <span class="badge-grade">${m.grade}</span>
              <span class="badge-unit">${m.unit}</span>
              <span class="badge-unit" style="background:#fff7ed;color:#c2410c;">📘 ${m.lesson}</span>
            </div>
            <h4 class="lesson-card-title">${m.title}</h4>
          </div>
          <button class="btn-star ${isFav ? 'active' : ''}" onclick="toggleFav('${m.id}', event)" title="내 수업 서랍에 담기">
            ★
          </button>
        </div>

        <div class="concept-lead">
          ${m.conceptLead}
        </div>

        <div class="concept-tags">
          ${m.keywords.map(k => `<span class="tag-kw">#${k}</span>`).join("")}
        </div>
      </div>

      <div class="card-tools-matrix">
        <div class="matrix-label">
          <span>⚡ 수업 흐름 ① 도입 → ② 탐구 → ③ 활동 → ④ 정리 → ⑤ 평가</span>
        </div>
        <div class="action-btn-row">
          ${toolsHtml}
        </div>
        ${navHtml}
      </div>
    `;

    grid.appendChild(card);
  });
}

syncBoardBtn();

  var ns=(NS_OVERRIDE||('sci-'+h+(seg?'-'+seg:''))).replace(/[^A-Za-z0-9_.\-]/g,'-').slice(0,60);
  var d=new Date(),p=function(n){return(n<10?'0':'')+n;},day=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  var LS='vcDay_'+ns,seen='';try{seen=localStorage.getItem(LS)||'';}catch(e){}
  var first=(seen!==day);
  function call(kind,key){
    var url=API+'/'+kind+'/'+encodeURIComponent(ns)+'/'+encodeURIComponent(key);
    var ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();},5000);
    return fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(t);return r.ok?r.json():null;}).catch(function(){clearTimeout(t);return null;});
  }
  var kind=first?'hit':'get';
  Promise.all([call(kind,'total'),call(kind,'d'+day)]).then(function(r){
    var total=r[0]&&r[0].value,today=r[1]&&r[1].value;
    if(typeof total!=='number')return;
    if(first){try{localStorage.setItem(LS,day);}catch(e){}}
    var f=function(n){return typeof n==='number'?n.toLocaleString('ko-KR'):'-';};
    var el=document.createElement('div');el.id='vcBox';
    el.style.cssText='text-align:center;font-size:12px;line-height:1.4;color:#94a3b8;padding:14px 8px 18px;font-family:inherit;font-weight:600;letter-spacing:.01em;user-select:none;-webkit-user-select:none';
    el.setAttribute('aria-label','방문자 수');
    el.textContent='👀 방문자  오늘 '+f(today)+'  ·  전체 '+f(total);
    document.body.appendChild(el);
  });
  }catch(e){}
})();
</script>
</body>
</html>
