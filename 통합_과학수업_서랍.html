<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과학수업 통합 서랍 · Cognitive Science Hub</title>
<style>
:root {
  --primary-blue: #2563eb;
  --primary-indigo: #4338ca;
  --accent-amber: #d97706;
  --accent-green: #059669;
  --accent-purple: #7c3aed;
  --ink: #0f172a;
  --ink-light: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --bg: #f8fafc;
  --card: #ffffff;
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.05);
  --shadow-lg: 0 10px 25px -3px rgba(15,23,42,0.09), 0 4px 8px -4px rgba(15,23,42,0.04);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { text-decoration: none; color: inherit; }

/* ==========================================================================
   1. 인지공학적 헤더 (정보 압축 및 청킹)
   ========================================================================== */
.header {
  background: #ffffff;
  border-bottom: 1.5px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 10px rgba(15,23,42,0.04);
}

.header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.brand-title h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #0f172a;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-sub {
  margin: 2px 0 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.badge-cognitive {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 999px;
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #bfdbfe;
}

.header-utils {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-guide-modal {
  background: #f1f5f9;
  border: 1px solid var(--line-strong);
  color: var(--ink-light);
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn-guide-modal:hover {
  background: #e2e8f0;
  color: var(--ink);
}

/* ==========================================================================
   2. 1차 네비게이션 (작업기억 5개 이하 청킹)
   ========================================================================== */
.primary-nav-bar {
  background: #f8fafc;
  border-bottom: 1px solid var(--line);
}
.primary-nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}
.primary-nav-btn {
  padding: 12px 18px;
  font-size: 14.5px;
  font-weight: 800;
  color: #475569;
  background: transparent;
  border: none;
  display: flex;
  align-items: center;
  gap: 7px;
  position: relative;
  transition: all 0.15s;
  white-space: nowrap;
}
.primary-nav-btn:hover {
  color: var(--primary-blue);
}
.primary-nav-btn.active {
  color: var(--primary-blue);
  background: #ffffff;
}
.primary-nav-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--primary-blue);
}
.nav-counter {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: #e2e8f0;
  color: #475569;
}
.primary-nav-btn.active .nav-counter {
  background: #dbeafe;
  color: #1e40af;
}

/* ==========================================================================
   3. 메인 레이아웃 및 2차 네비게이션 (CTML 수업 인지 단계)
   ========================================================================== */
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* 수업 인지 흐름 바 (Segmenting Principle) */
.flow-selector-card {
  background: #ffffff;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.flow-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stage-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: thin;
}
.stage-chip {
  background: #f1f5f9;
  border: 1.5px solid #e2e8f0;
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 13.5px;
  font-weight: 800;
  color: #334155;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 0.15s;
}
.stage-chip:hover {
  background: #e2e8f0;
  border-color: #cbd5e1;
}
.stage-chip.active {
  background: #0f172a;
  border-color: #0f172a;
  color: #ffffff;
}

/* 특정 인지 단계별 신호화(Signaling) 컬러 */
.stage-chip.stage-all.active { background: #0f172a; border-color: #0f172a; }
.stage-chip.stage-sim.active { background: #2563eb; border-color: #1d4ed8; }
.stage-chip.stage-ws.active { background: #059669; border-color: #047857; }
.stage-chip.stage-org.active { background: #0891b2; border-color: #0e7490; }
.stage-chip.stage-eval.active { background: #7c3aed; border-color: #6d28d9; }

/* 검색 및 대단원 칩 바 */
.filter-search-row {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.search-wrapper {
  flex: 1;
  min-width: 280px;
  background: #ffffff;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius-md);
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
}
.search-wrapper:focus-within {
  border-color: var(--primary-blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.search-input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  padding: 10px 0;
  font-size: 14.5px;
}
.unit-chips-container {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.unit-chip {
  background: #ffffff;
  border: 1px solid var(--line-strong);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-light);
  transition: all 0.15s;
}
.unit-chip:hover {
  border-color: var(--primary-blue);
  color: var(--primary-blue);
}
.unit-chip.active {
  background: #eff6ff;
  border-color: #3b82f6;
  color: #1d4ed8;
  font-weight: 800;
}

/* ==========================================================================
   4. 단원별 통합 모듈 카드 (Integrated Lesson Card)
   - Spatial Contiguity Principle: 가상실험+활동지+게임을 한 영역에 배치
   ========================================================================== */
.results-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
}
.results-info h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  color: #334155;
}

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
}
@media (max-width: 680px) {
  .lesson-grid { grid-template-columns: 1fr; }
}

.lesson-card {
  background: #ffffff;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.lesson-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: #cbd5e1;
}

/* 이중부호화 헤더 (시각적 앵커 + 언어적 앵커) */
.card-top {
  display: flex;
  gap: 14px;
  margin-bottom: 12px;
}
.visual-anchor {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: #f8fafc;
  border: 1.5px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 26px;
}

.title-area {
  flex: 1;
}
.meta-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.badge-grade {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #0f172a;
  color: #ffffff;
}
.badge-unit {
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #e2e8f0;
}
.lesson-card-title {
  margin: 0;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #0f172a;
  line-height: 1.35;
}

.btn-star {
  background: transparent;
  border: none;
  font-size: 20px;
  color: #cbd5e1;
  padding: 2px;
  line-height: 1;
  transition: transform 0.15s, color 0.15s;
}
.btn-star:hover { transform: scale(1.2); }
.btn-star.active { color: #f59f00; }

/* 인지적 개념 설명 및 발문 앵커 */
.concept-lead {
  font-size: 13.5px;
  color: #334155;
  line-height: 1.55;
  margin: 0 0 14px;
  background: #f8fafc;
  border-left: 3px solid #2563eb;
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
}

/* 키워드 태그 */
.concept-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.tag-kw {
  font-size: 11px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  color: #64748b;
  padding: 2px 6px;
  border-radius: 4px;
}

/* ==========================================================================
   5. 공간적 근접성 액션 버튼 매트릭스 (4단계 수업 도구 세트)
   ========================================================================== */
.card-tools-matrix {
  border-top: 1px dashed var(--line);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.matrix-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 4px;
}

.action-btn-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 6px;
}

.btn-action {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-align: center;
  transition: all 0.15s;
  border: 1.5px solid transparent;
}

/* 신호화 컬러 매핑 */
/* 1) 가상실험실 (Blue) */
.btn-sim {
  background: #eff6ff;
  border-color: #bfdbfe;
  color: #1d4ed8;
}
.btn-sim:hover {
  background: #2563eb;
  color: #ffffff;
  border-color: #2563eb;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
}

/* 2) 탐구 활동지 (Green) */
.btn-ws {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #047857;
}
.btn-ws:hover {
  background: #059669;
  color: #ffffff;
  border-color: #059669;
}

/* 3) 개념 정리 도구 (Teal/Cyan) */
.btn-org {
  background: #f0fdfa;
  border-color: #99f6e4;
  color: #0f766e;
}
.btn-org:hover {
  background: #0d9488;
  color: #ffffff;
  border-color: #0d9488;
}

/* 4) 형성평가 & 게임 (Purple) */
.btn-game {
  background: #faf5ff;
  border-color: #e9d5ff;
  color: #7e22ce;
}
.btn-game:hover {
  background: #7c3aed;
  color: #ffffff;
  border-color: #7c3aed;
}

.btn-snake {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #047857;
}
.btn-snake:hover {
  background: #10b981;
  color: #ffffff;
  border-color: #10b981;
}

.btn-shoot {
  background: #eef2ff;
  border-color: #c7d2fe;
  color: #3730a3;
}
.btn-shoot:hover {
  background: #4f46e5;
  color: #ffffff;
  border-color: #4f46e5;
}

/* 빈 화면 */
.empty-state {
  background: #ffffff;
  border: 2px dashed #cbd5e1;
  border-radius: var(--radius-lg);
  padding: 50px 20px;
  text-align: center;
  color: var(--muted);
  margin-top: 20px;
}
.group-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 12px 0 -2px; padding: 8px 14px; background: #0f172a; color: #fff; border-radius: 10px; font-weight: 800; font-size: 15px; }
.group-head .gh-sub { margin-left: auto; font-size: 12px; font-weight: 700; color: #cbd5e1; }

/* ===== 간소화: 한 줄 필터 바 + 접이식 목록 (주의집중 부담 최소화) ===== */
.header-inner{padding:8px 16px;gap:10px}

.fb-btn .fb-k{font-size:11.5px;font-weight:800;color:#64748b}

/* ===== 단원 연계 지도 (v2) ===== */

.unit-map .um-chip:hover{border-color:#2563eb;color:#1d4ed8}

.stp{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:50%;background:rgba(15,23,42,.85);color:#fff;font-size:10.5px;font-weight:900;margin-right:3px}

.unit-map .um-chip.mg-h{display:none}
</style>

function closePanels(){
  document.querySelectorAll(".fpanel.open").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".fb-btn[data-p]").forEach(b => { b.classList.remove("open"); b.setAttribute("aria-expanded","false"); });

function togglePanel(btn){
  const p = document.getElementById(btn.dataset.p);

  const units = Array.from(new Set(modules.map(m => m.unit))).sort((a, b) => { const x = _rank(a), y = _rank(b); return x[0] - y[0] || x[1] - y[1]; });

function flowItemHtml(e, m) {

function flowApply(m, html) {
  const st = flowState[m.id] || {}, hid = st.h || [], ext = st.x || [];
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  const items = [], shown = new Set();
  Array.prototype.slice.call(tmp.children).forEach(el => {

      const txt = (el.querySelector("span") ? el.querySelector("span").textContent : "").replace(/^[①-⑩]\s*/, "").trim();

        { /* ESCLAND_CW_1018 ESCLAND_1018 : 방탈출 · 땅따먹기 */

<script id="visitCounter">
/* 방문자 수 표시 (맨 아래 작게) — 무료 Abacus 카운터 사용, 개인정보·로그인 없음.
   · 같은 브라우저는 하루에 한 번만 센다 / 인터넷이 없거나 막혀 있으면 아무것도 표시하지 않는다 */
(function(){
  if(typeof fetch!=='function')return;
  try{
  var NS_OVERRIDE='';   /* 직접 지정하려면 영문·숫자로 입력 (예: 'my-science-lab'). 비워 두면 주소로 자동 생성 */
  var API='https://abacus.jasoncameron.dev';
  var h=location.hostname;
  if(!/^https?:$/.test(location.protocol)||/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(h))return;
  var seg=(location.pathname.split('/')[1]||'');if(/\.html?$/i.test(seg))seg='';
  var ns=(NS_OVERRIDE||('sci-'+h+(seg?'-'+seg:''))).replace(/[^A-Za-z0-9_.\-]/g,'-').slice(0,60);
  var d=new Date(),p=function(n){return(n<10?'0':'')+n;},day=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  var LS='vcDay_'+ns,seen='';try{seen=localStorage.getItem(LS)||'';}catch(e){}
  var first=(seen!==day);
  function call(kind,key){
    var url=API+'/'+kind+'/'+encodeURIComponent(ns)+'/'+encodeURIComponent(key);
    var ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();},5000);
    return fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(t);return r.ok?r.json():null;}).catch(function(){clearTimeout(t);return null;});
  }
  var kind=first?'hit':'get';
  Promise.all([call(kind,'total'),call(kind,'d'+day)]).then(function(r){
    var total=r[0]&&r[0].value,today=r[1]&&r[1].value;
    if(typeof total!=='number')return;
    if(first){try{localStorage.setItem(LS,day);}catch(e){}}
    var f=function(n){return typeof n==='number'?n.toLocaleString('ko-KR'):'-';};
    var el=document.createElement('div');el.id='vcBox';
    el.style.cssText='text-align:center;font-size:12px;line-height:1.4;color:#94a3b8;padding:14px 8px 18px;font-family:inherit;font-weight:600;letter-spacing:.01em;user-select:none;-webkit-user-select:none';
    el.setAttribute('aria-label','방문자 수');
    el.textContent='👀 방문자  오늘 '+f(today)+'  ·  전체 '+f(total);
    document.body.appendChild(el);
  });
  }catch(e){}
})();

var st=D.createElement('style');st.textContent='#kjsLqrOv{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif}#kjsLqrOv.on{display:flex}#kjsLqrOv .c{width:min(96vw,540px);max-height:96vh;overflow:auto;background:#101a2e;color:#f1f5f9;border:2px solid #26334d;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;box-sizing:border-box}#kjsLqrOv h2{font-size:21px;color:#7dd3fc;margin:0;text-align:center}#kjsLqrOv .sub{font-size:16px;font-weight:800;color:#fde68a;text-align:center}#kjsLqrOv .note{font-size:14px;line-height:1.5;color:#fde68a;background:#2a2410;border:1px solid #f59e0b;border-radius:10px;padding:8px 12px;margin:0}#kjsLqrOv input{width:100%;min-height:48px;border-radius:12px;border:2px solid #26334d;background:#0b1726;color:#fff;font:inherit;font-size:16px;padding:0 12px;box-sizing:border-box}#kjsLqrOv canvas{background:#fff;padding:10px;border-radius:12px;width:min(78vw,340px);height:auto;image-rendering:pixelated}#kjsLqrOv.big canvas{width:min(90vmin,760px)}#kjsLqrOv .cap{font-size:12px;color:#9fb2d0;word-break:break-all;text-align:center}#kjsLqrOv .hint{font-size:15px;color:#cbd5e1;text-align:center}#kjsLqrOv .er{color:#fca5a5;font-weight:700;min-height:1.2em;font-size:14px}#kjsLqrOv .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#kjsLqrOv button{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid #26334d;background:#16233f;color:#f1f5f9;font:800 16px/1 inherit;cursor:pointer}';
(D.head||D.documentElement).appendChild(st);
var ov=null,cur=null;
function paint(url){
  var c=ov.querySelector('canvas'),q=c.getContext('2d');ov.querySelector('.er').textContent='';
  try{QRLIB.stringToBytes=QRLIB.stringToBytesFuncs['UTF-8'];var m=QRLIB(0,'M');m.addData(url,'Byte');m.make();var n=m.getModuleCount(),b=4,cell=Math.max(4,Math.floor(640/(n+b*2))),sz=cell*(n+b*2);c.width=c.height=sz;q.fillStyle='#fff';q.fillRect(0,0,sz,sz);q.fillStyle='#000';
    for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(m.isDark(r,k))q.fillRect((k+b)*cell,(r+b)*cell,cell,cell);
    var cap=url;try{cap=decodeURI(url);}catch(e){}ov.querySelector('.cap').textContent=cap;c.style.display='';}
  catch(e){ov.querySelector('.er').textContent='QR을 만들 수 없어요.';}}
function open(o){
  cur=o||cur;
  if(!ov){ov=D.createElement('div');ov.id='kjsLqrOv';
    ov.innerHTML='<div class="c"><h2></h2><div class="sub"></div><p class="note" style="display:none">지금은 내 컴퓨터에서 열린 파일이라 학생 휴대폰에서는 열리지 않아요. GitHub에 올린 <b>인터넷 주소</b>(https://계정명.github.io/저장소명/아무_자료.html)를 한 번 붙여 넣으면 이 컴퓨터가 기억해요.</p><input type="url" placeholder="https://계정명.github.io/저장소명/아무_자료.html" autocomplete="off" spellcheck="false" style="display:none"><canvas width="300" height="300" style="display:none"></canvas><div class="hint">📱 카메라로 찍으면 <b>이 차시 게임이 바로 시작</b>돼요</div><div class="cap"></div><div class="er"></div><div class="row"><button class="mk" style="display:none">QR 만들기</button><button class="bg">⛶ 크게 보기</button><button class="cl">닫기</button></div></div>';
    D.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('on');});
    ov.querySelector('.cl').onclick=function(){ov.classList.remove('on');};
    ov.querySelector('.bg').onclick=function(){ov.classList.toggle('big');ov.querySelector('.bg').textContent=ov.classList.contains('big')?'⛶ 작게 보기':'⛶ 크게 보기';};
    ov.querySelector('.mk').onclick=function(){var u=normUrl(ov.querySelector('input').value);if(!u){ov.querySelector('.er').textContent='http:// 또는 https:// 로 시작하는 주소를 넣어 주세요.';return;}lsSet(LSK,u);open(cur);};
    ov.querySelector('input').addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')ov.querySelector('.mk').click();});
    D.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('on'))ov.classList.remove('on');});
  }
  ov.querySelector('h2').textContent='📱 학생 접속 QR · '+(cur.title||'');
  ov.querySelector('.sub').textContent=cur.sub||'';
  var url=lessonUrl(),isWeb=/^https?:$/.test(location.protocol);
  ov.querySelector('.note').style.display=(!isWeb)?'':'none';
  ov.querySelector('input').style.display=(!isWeb&&!url)?'':'none';ov.querySelector('.mk').style.display=(!isWeb&&!url)?'':'none';
  ov.querySelector('.bg').style.display=url?'':'none';ov.classList.add('on');
  if(url)paint(url);else{ov.querySelector('canvas').style.display='none';ov.querySelector('.cap').textContent='';}
}
window.kjsDrawerQr=open;
})();
</script>
<script id="qrstayDrawerJs">

document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.kv-qrchip');if(!b)return;
  e.preventDefault();e.stopPropagation();
  if(window.kjsDrawerQr)window.kjsDrawerQr({file:b.dataset.qf,query:b.dataset.qq,title:b.dataset.t,sub:b.dataset.s});
},true);
