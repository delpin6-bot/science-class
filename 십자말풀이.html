<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>십자말풀이 · 중1~중3 과학</title>
<style>
:root{
  --paper:#f6f3ec; --card:#fffdf8; --ink:#1d2a2c; --soft:#5f6d6f; --line:#dcd6c8;
  --accent:#2b6f8f; --accent-2:#e3eef3; --good:#2b8a3e; --good-2:#e6f4ea; --warn:#d9480f; --gold:#e8900c;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif; font-size:16px; line-height:1.45}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.wrap{max-width:1180px; margin:0 auto; padding:22px 18px 60px}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; border-bottom:2px solid var(--ink);
  padding-bottom:12px; padding-right:170px}
header h1{margin:0; font-size:30px; letter-spacing:-.02em}
header p{margin:4px 0 0; color:var(--soft); font-size:14px}
.hudbox{display:flex; gap:8px}
.hudbox div{border:1.5px solid var(--ink); background:var(--card); padding:6px 12px; min-width:76px; text-align:center}
.hudbox b{display:block; font-size:20px}
.hudbox span{font-size:11.5px; color:var(--soft)}
.hidden{display:none !important}

/* 선택 */
.picker{background:var(--card); border:1.5px solid var(--ink); border-radius:10px; padding:16px 18px; margin-top:16px}
.picker h2{margin:0 0 4px; font-size:18px}
.picker .sub{color:var(--soft); font-size:13.5px; margin-bottom:12px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1.5px solid var(--ink); background:var(--card); border-radius:999px; padding:6px 15px; font-weight:700; font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink); color:#fff}
.uchip{border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:6px 11px; font-weight:700; font-size:13.5px}
.uchip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.midbar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:16px 0 6px;
  padding-bottom:5px; border-bottom:1px solid var(--line); font-weight:800; font-size:14.5px}
.combo{border:1.5px solid var(--ink); background:var(--card); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700}
.grid3{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.sbtn{text-align:left; border:1.5px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 12px}
.sbtn:hover{border-color:var(--accent)}
.sbtn b{display:block; font-size:14.5px}
.sbtn span{font-size:12px; color:var(--soft)}
.pickbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:15px}

/* 게임 */
.play{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr); gap:18px; margin-top:16px; align-items:start}
@media (max-width:900px){ .play{grid-template-columns:1fr} }
.board{background:var(--card); border:1.5px solid var(--ink); border-radius:10px; padding:14px}
.ansbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--accent-2); border-radius:8px;
  padding:10px 12px; margin-bottom:12px; min-height:58px}
.ansbar .q{flex:1 1 260px; font-weight:700}
.ansbar .q small{display:inline-block; background:var(--accent); color:#fff; border-radius:6px; padding:1px 7px;
  margin-right:6px; font-size:12.5px}
.ansbar input{width:200px; border:1.5px solid var(--ink); border-radius:8px; padding:9px 11px; font-size:18px; background:#fff}
.ansbar input.bad{animation:shake .35s; border-color:var(--warn)}
.ansbar button{border:0; background:var(--ink); color:#fff; border-radius:8px; padding:10px 16px; font-weight:800}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.gridwrap{overflow:auto; display:flex; justify-content:center; padding:4px}
#grid{display:grid; gap:0}
.cell{width:var(--cs,46px); height:var(--cs,46px); position:relative; border:1.5px solid var(--ink); margin:-0.75px;
  background:#fff; display:grid; place-items:center; font-size:calc(var(--cs,46px) * .46); font-weight:800; cursor:pointer}
.cell.void{border:0; background:transparent; cursor:default}
.cell .n{position:absolute; top:1px; left:3px; font-size:10.5px; font-weight:700; color:var(--soft)}
.cell.sel{background:#fff4d6}
.cell.cur{background:#ffe08a}
.cell.ok{background:var(--good-2); color:var(--good)}
.cell.hint{color:#9aa4a6}
.tools{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
.tools button{border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:8px 12px; font-weight:700; font-size:14px}
.clues{background:var(--card); border:1.5px solid var(--ink); border-radius:10px; padding:12px 14px; max-height:78vh; overflow:auto}
.clues h3{margin:6px 0 6px; font-size:16px; display:flex; align-items:center; gap:8px}
.clues h3::after{content:""; flex:1; height:1px; background:var(--line)}
.clues ol{list-style:none; margin:0 0 8px; padding:0}
.clues li{display:flex; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:14.5px}
.clues li:hover{background:var(--paper)}
.clues li.on{background:#fff4d6}
.clues li.done{color:var(--soft); text-decoration:line-through}
.clues li b{flex:none; width:24px; text-align:right; color:var(--accent)}
.clues li em{font-style:normal; color:var(--soft); font-size:12px; white-space:nowrap}
.chohint{flex-basis:100%; font-size:14px; font-weight:800; color:#b45309; min-height:0}
.sheet{max-height:90vh; overflow-y:auto}
.note{font-size:12.5px; color:var(--soft); margin-top:8px}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:grid; place-items:center; z-index:50}
.sheet{background:var(--card); border-radius:16px; padding:26px 28px; text-align:center; max-width:420px; width:92%}
.sheet h2{margin:0 0 6px; font-size:26px}
.sheet .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0}
.sheet .stats div{background:var(--paper); border-radius:10px; padding:10px 4px}
.sheet .stats b{display:block; font-size:22px}
.sheet .stats span{font-size:12px; color:var(--soft)}
.sheet button{border:0; background:var(--ink); color:#fff; border-radius:10px; padding:12px 18px; font-weight:800; margin:4px}
.sheet button.sec{background:var(--paper); color:var(--ink); border:1px solid var(--line)}

/* 인쇄 */
.printhead{display:none}
@media print{
  @page{size:A4 portrait; margin:12mm}
  body{background:#fff}
  header,.picker,.ansbar,.tools,.overlay,#kjsNav,.note{display:none !important}
  .wrap{padding:0; max-width:none}
  .printhead{display:block; margin-bottom:8mm}
  .printhead h2{margin:0; font-size:18pt}
  .printhead p{margin:2mm 0 0; font-size:10pt}
  .play{display:block; margin:0}
  .board,.clues{border:0; padding:0; max-height:none; overflow:visible}
  .gridwrap{margin-bottom:6mm}
  .cell{--cs:34px}
  .cell.sel,.cell.cur{background:#fff}
  .clues{columns:2; column-gap:8mm}
  .clues li{padding:1mm 0; font-size:10pt; break-inside:avoid}
  .clues li.on{background:none}
  body:not(.printkey) .cell .ch{visibility:hidden}
  body:not(.printkey) .clues li.done{text-decoration:none; color:#000}
}
</style>
<script id="kjs-menu-lib">
/* 수업 게임 서랍 · 공통 메뉴 (학년 → 대단원 → 중단원·차시, 검색)
   KJSMenu.init({
     key, items:[{id, grade, unit, mid, title, sub, kind:'unit'|'mid'|'lesson', words:[], tags:[]}],
     extras:['내 세트'],            // 누르면 게임의 원래 선택 화면(내가 만든 목록)을 보여 줌
     mount: Element,                // 이 요소 앞에 메뉴를 넣음
     legacyCss: 'selector, ...',    // 메뉴가 켜져 있을 때 숨길 원래 선택 UI
     isVisible: () => bool,         // 선택 화면일 때만 메뉴 표시 (생략 가능)
     observe: Element,              // 화면이 바뀌는지 지켜볼 요소 (생략 가능)
     mode: 'start' | 'select',      // start: 누르면 바로 시작 / select: 고른 뒤 ▶ 시작
     onPick(item), onStart(item), startLabel
   })
*/
(function(){
  var ORDER = {
    "중1": ["과학과 인류의 지속가능한 삶","생물의 구성과 다양성","열","물질의 상태 변화","힘의 작용","기체의 성질","태양계"],
    "중2": ["물질의 특성","지권의 변화","빛과 파동","물질의 구성","식물과 에너지","동물과 에너지","전기와 자기","별과 우주"],
    "중3": ["화학 반응의 규칙과 에너지 변화","기권과 날씨","운동과 에너지","자극과 반응","생식과 유전","에너지 전환과 보존","별과 우주"]
  };
  var CSS = [
    ".km{background:#fff;color:#1b2b2a;border:1.5px solid #dfe3de;border-radius:16px;padding:0 14px 14px;margin:12px 0 16px;",
    " font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif;text-align:left;line-height:1.45}",
    ".km *{box-sizing:border-box}",
    ".km-nav{position:sticky;top:0;z-index:30;background:#fff;padding:12px 0 10px;border-bottom:1px solid #e6e9e4;border-radius:16px 16px 0 0}",
    ".km-search{display:flex;align-items:center;gap:8px;background:#f5f7f4;border:1.5px solid #dfe3de;border-radius:12px;padding:0 12px;margin-bottom:8px}",
    ".km-search:focus-within{border-color:#0CA678;background:#fff}",
    ".km-search input{flex:1;min-width:0;border:0!important;box-shadow:none!important;outline:0;background:transparent;font:inherit;font-size:16px;padding:10px 0;color:#1b2b2a}",
    ".km-search button{border:0;background:transparent;font-size:15px;cursor:pointer;color:#6b7672;padding:4px}",
    ".km-row{display:flex;align-items:flex-start;gap:10px;margin-top:6px}",
    ".km-row[hidden]{display:none!important}",
    ".km-lab{flex:none;width:58px;padding-top:7px;font-size:12.5px;font-weight:800;color:#6b7672}",
    ".km-chips{display:flex;gap:6px;flex-wrap:wrap}",
    ".km-row>.km-scroll,.km-row>.km-chips{min-width:0;flex:1 1 auto}",
    ".km-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}",
    ".km-chip{flex:none;border:1px solid #dfe3de;background:#fff;color:#1b2b2a;border-radius:9px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}",
    ".km-chip.g[aria-pressed=true]{background:#1b2b2a;color:#fff;border-color:#1b2b2a}",
    ".km-chip.u[aria-pressed=true]{background:#0CA678;color:#fff;border-color:#0CA678}",
    ".km-chip.j{font-size:12.5px;padding:5px 10px;border-radius:999px}",
    ".km-chip.j.m{border-color:#7048E8;color:#5f3dc4}.km-chip.j.un{border-color:#0CA678;color:#0b7a5a}",
    ".km-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:9px 12px;background:#fff8e1;border:1px solid #f3d27a;border-radius:10px;font-size:14px}",
    ".km-sel[hidden]{display:none!important}",
    ".km-sel b{font-weight:800}",
    ".km-go{border:0;background:#1b2b2a;color:#fff;border-radius:9px;padding:8px 16px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-left:auto}",
    ".km-body{padding-top:6px}",
    ".km-uh{font-size:14px;font-weight:800;color:#6b7672;margin:14px 0 8px;display:flex;align-items:center;gap:8px}",
    ".km-uh::after{content:'';flex:1;height:1px;background:#e6e9e4}",
    ".km-mh{font-size:13.5px;font-weight:800;margin:14px 0 8px 2px;scroll-margin-top:200px}",
    ".km-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}",
    ".km-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e1e5e0;border-radius:14px;padding:13px 15px;cursor:pointer;font:inherit;color:#1b2b2a;scroll-margin-top:200px;transition:border-color .12s,box-shadow .12s}",
    ".km-card:hover{border-color:#0CA678;box-shadow:0 4px 14px rgba(0,0,0,.06)}",
    ".km-card[aria-pressed=true]{border-color:#e8900c;box-shadow:0 0 0 3px #ffe8b0}",
    ".km-card .k{font-size:12px;font-weight:800;color:#e8900c}",
    ".km-card .w{font-size:12px;font-weight:800;color:#6b7672}",
    ".km-card .t{display:block;font-size:17px;font-weight:800;margin:2px 0 3px;letter-spacing:-.01em}",
    ".km-card .s{display:block;font-size:13px;color:#6b7672}",
    ".km-card .h{display:block;font-size:12.5px;color:#6b7672;margin-top:5px}",
    ".km-card.unit{background:linear-gradient(135deg,#eef6f2,#fff);border-color:#0CA678;grid-column:1/-1}",
    ".km-card.unit .k{color:#0b7a5a}",
    ".km-card.mid{background:linear-gradient(135deg,#f3f0fb,#fff);border-color:#7048E8;grid-column:1/-1}",
    ".km-card.mid .k{color:#5f3dc4}",
    ".km-hit{background:#fff3bf;border-radius:3px}",
    ".km-empty{color:#6b7672;padding:16px 4px}",
    ".km-note{font-size:13px;color:#6b7672;margin:8px 2px}",
    "@media (max-width:640px){.km{padding:0 10px 12px}.km-row{flex-direction:column;gap:4px}.km-lab{width:auto;padding-top:0}.km-grid{grid-template-columns:1fr}.km-mh,.km-card{scroll-margin-top:260px}}",
    "@media print{.km{display:none!important}}"
  ].join("\n");

  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function nrm(s){ return String(s || "").toLowerCase().replace(/\s+/g, ""); }
  function mark(text, q){
    var t = String(text), i = t.toLowerCase().indexOf(q.toLowerCase());
    if (!q || i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<span class="km-hit">' + esc(t.slice(i, i + q.length)) + "</span>" + esc(t.slice(i + q.length));
  }

  /* 차시 고유 코드: 학년|단원|제목 → 짧은 영문 코드 (QR 주소용, 파일이 바뀌어도 제목이 같으면 그대로) */
  function hcode(str){
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h.toString(36);
  }
  function itemKey(x){ return [x.grade || "", x.unit || "", x.mid || "", x.title || ""].join("|"); }

  function init(o){
    if (!document.getElementById("km-style")) { var st = el("style"); st.id = "km-style"; st.textContent = CSS; document.head.appendChild(st); }
    var items = o.items || [];
    var grades = ["중1","중2","중3"].filter(function(g){ return items.some(function(x){ return x.grade === g; }); });
    items.forEach(function(x){ if (["중1","중2","중3"].indexOf(x.grade) < 0 && grades.indexOf(x.grade) < 0) grades.push(x.grade); });
    (o.extras || []).forEach(function(g){ if (grades.indexOf(g) < 0) grades.push(g); });
    items.forEach(function(x){
      x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|"));
      x.th = nrm([x.unit, x.mid, x.title].join("|"));
    });
    items.forEach(function(x){ x.q = hcode(itemKey(x)); });
    window.KJSMenu._items = items.map(function(x){ return { q: x.q, grade: x.grade, unit: x.unit || "", mid: x.mid || "", title: x.title, kind: x.kind || "lesson" }; });
    var LS = "km-" + (o.key || location.pathname);
    var st = { g: grades[0], u: 0, q: "", sel: null };
    try { var sv = JSON.parse(localStorage.getItem(LS) || "{}"); if (grades.indexOf(sv.g) >= 0) st.g = sv.g; if (sv.u >= 0) st.u = sv.u; } catch(e) {}
    function save(){ try { localStorage.setItem(LS, JSON.stringify({ g: st.g, u: st.u })); } catch(e) {} }

    var root = el("section", "km"); root.setAttribute("aria-label", "학년 · 단원 · 차시 고르기");
    var nav = el("div", "km-nav");
    nav.innerHTML =
      '<label class="km-search"><span aria-hidden="true">🔍</span><input type="text" placeholder="단원·차시·낱말 검색 (예: 광합성, 보일, 뉴런)" autocomplete="off"><button type="button" hidden aria-label="검색어 지우기">✕</button></label>' +
      '<div class="km-row"><span class="km-lab">학년</span><div class="km-chips km-g"></div></div>' +
      '<div class="km-row km-urow"><span class="km-lab">대단원</span><div class="km-scroll km-u"></div></div>' +
      '<div class="km-row km-jrow"><span class="km-lab">바로가기</span><div class="km-scroll km-j"></div></div>' +
      '<div class="km-sel" hidden><span>선택: <b></b></span><button type="button" class="km-go"></button></div>';
    var body = el("div", "km-body");
    root.appendChild(nav); root.appendChild(body);
    var mountEl = typeof o.mount === "function" ? o.mount() : o.mount;
    mountEl.parentNode.insertBefore(root, mountEl);

    var qIn = nav.querySelector("input"), qX = nav.querySelector(".km-search button");
    var selBox = nav.querySelector(".km-sel"), goBtn = nav.querySelector(".km-go");
    goBtn.textContent = "▶ " + (o.startLabel || "시작하기");
    goBtn.onclick = function(){ if (st.sel && o.onStart) o.onStart(st.sel); };

    var legacyStyle = el("style"); document.head.appendChild(legacyStyle);
    function setLegacy(show){ var t = (!show && o.legacyCss) ? o.legacyCss + "{display:none!important}" : ""; if (legacyStyle.textContent !== t) legacyStyle.textContent = t; }

    function pick(x){
      window.KJSMenu._current = { q: x.q, grade: x.grade, unit: x.unit || "", title: x.title };
      if (o.mode === "select") {
        st.sel = x; if (o.onPick) o.onPick(x);
        selBox.hidden = false; selBox.querySelector("b").textContent = x.grade + " · " + (x.unit ? x.unit + " · " : "") + x.title;
        paintSel();
      } else if (o.onPick) o.onPick(x);
    }
    function paintSel(){
      body.querySelectorAll(".km-card").forEach(function(c){ c.setAttribute("aria-pressed", String(!!st.sel && c._item === st.sel)); });
    }
    function card(x, q){
      var c = el("button", "km-card " + (x.kind || "lesson"));
      c.type = "button"; c._item = x;
      var kind = x.kind === "unit" ? "🌳 대단원 종합" : x.kind === "mid" ? "🌿 중단원 종합" : (x.badge || "");
      c.innerHTML = (q ? '<span class="w">' + esc(x.grade + (x.unit ? " · " + x.unit : "")) + "</span> " : "") +
        (kind ? '<span class="k">' + esc(kind) + "</span>" : "") +
        '<span class="t">' + (q ? mark(x.title, q) : esc(x.title)) + "</span>" +
        (x.sub ? '<span class="s">' + esc(x.sub) + "</span>" : "");
      if (q) {
        var hits = (x.words || []).filter(function(w){ return String(w).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
        var u = []; hits.forEach(function(h){ if (u.indexOf(h) < 0) u.push(h); });
        if (u.length) c.appendChild(el("span", "h", "찾은 낱말: " + u.slice(0, 5).map(function(w){ return mark(String(w).slice(0, 40), q); }).join(", ") + (u.length > 5 ? " …" : "")));
      }
      c.onclick = function(){ pick(x); };
      return c;
    }
    function unitsOf(g){
      var list = [];
      items.forEach(function(x){ if (x.grade === g && x.unit && list.indexOf(x.unit) < 0) list.push(x.unit); });
      var ord = ORDER[g] || [];
      return list.sort(function(a, b){ var ia = ord.indexOf(a), ib = ord.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    }
    function render(){
      var gBox = nav.querySelector(".km-g"), uBox = nav.querySelector(".km-u"), jBox = nav.querySelector(".km-j");
      gBox.innerHTML = ""; uBox.innerHTML = ""; jBox.innerHTML = ""; body.innerHTML = "";
      grades.forEach(function(g){
        var b = el("button", "km-chip g"); b.type = "button"; b.textContent = g;
        b.setAttribute("aria-pressed", String(g === st.g && !st.q));
        b.onclick = function(){ st.g = g; st.u = 0; clearQ(); save(); render(); };
        gBox.appendChild(b);
      });
      var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
      setLegacy(isExtra && !st.q);
      var units = unitsOf(st.g);
      if (st.u >= units.length) st.u = 0;
      nav.querySelector(".km-urow").hidden = !units.length || !!st.q;
      units.forEach(function(u, i){
        var b = el("button", "km-chip u"); b.type = "button"; b.textContent = u;
        b.setAttribute("aria-pressed", String(i === st.u));
        b.onclick = function(){ st.u = i; save(); render(); };
        uBox.appendChild(b);
      });
      var cur = uBox.children[st.u]; if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: "nearest", block: "nearest" });

      if (st.q) {
        nav.querySelector(".km-jrow").hidden = true;
        var q = nrm(st.q);
        var res = items.filter(function(x){ return x.hay.indexOf(q) >= 0; }).sort(function(a, b){
          var ka = { unit: 0, mid: 1 }[a.kind]; var kb = { unit: 0, mid: 1 }[b.kind];
          return ((b.th.indexOf(q) >= 0) - (a.th.indexOf(q) >= 0)) || ((ka == null ? 2 : ka) - (kb == null ? 2 : kb));
        });
        body.appendChild(el("div", "km-uh", "‘" + esc(st.q) + "’ 검색 결과 " + res.length + "개"));
        if (!res.length) body.appendChild(el("p", "km-empty", "찾는 내용이 없습니다. 다른 낱말로 검색해 보세요."));
        var grid = el("div", "km-grid");
        res.slice(0, 60).forEach(function(x){ grid.appendChild(card(x, st.q.trim())); });
        body.appendChild(grid); paintSel(); return;
      }
      if (isExtra) {
        nav.querySelector(".km-jrow").hidden = true;
        if (o.onExtra) setTimeout(function(){ o.onExtra(st.g); }, 0);
        body.appendChild(el("p", "km-note", (o.extraNote || "아래에서 직접 만든 목록을 고르거나 새로 만들 수 있습니다.")));
        return;
      }
      var unit = units[st.u];
      var list = items.filter(function(x){ return x.grade === st.g && (unit ? x.unit === unit : !x.unit); });
      if (!unit) list = items.filter(function(x){ return x.grade === st.g; });
      if (unit) body.appendChild(el("div", "km-uh", esc(st.g + " · " + unit)));
      var groups = [], gmap = {};
      list.forEach(function(x){
        var key = x.kind === "unit" ? "__unit" : (x.mid || "");
        if (!gmap[key]) { gmap[key] = { name: key, list: [] }; groups.push(gmap[key]); }
        gmap[key].list.push(x);
      });
      var jumps = 0;
      groups.forEach(function(gr, gi){
        var sec = el("div", "km-sec");
        if (gr.name && gr.name !== "__unit") {
          var mh = el("div", "km-mh", esc(gr.name)); sec.appendChild(mh);
          var jb = el("button", "km-chip j m", "🌿 " + esc(gr.name)); jb.type = "button";
          jb.onclick = function(){ mh.scrollIntoView({ behavior: "smooth", block: "start" }); };
          jBox.appendChild(jb); jumps++;
        }
        var grid = el("div", "km-grid");
        gr.list.forEach(function(x){
          var c = card(x, "");
          grid.appendChild(c);
          if (x.kind === "unit") {
            var ub = el("button", "km-chip j un", "🌳 대단원"); ub.type = "button";
            ub.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "start" }); };
            jBox.insertBefore(ub, jBox.firstChild); jumps++;
          } else if (x.kind !== "mid") {
            var lb = el("button", "km-chip j", esc(x.short || x.title)); lb.type = "button";
            lb.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "center" }); };
            jBox.appendChild(lb); jumps++;
          }
        });
        sec.appendChild(grid); body.appendChild(sec);
      });
      nav.querySelector(".km-jrow").hidden = jumps < 2;
      paintSel();
    }
    function clearQ(){ st.q = ""; qIn.value = ""; qX.hidden = true; }
    qIn.addEventListener("input", function(){ st.q = qIn.value.trim(); qX.hidden = !st.q; render(); });
    qX.addEventListener("click", function(){ clearQ(); render(); qIn.focus(); });

    function sync(){
      if (typeof o.mount === "function") {
        var m = o.mount();
        if (m && m !== root && m.parentNode && root.nextSibling !== m) m.parentNode.insertBefore(root, m);
      }
      var vis = o.isVisible ? !!o.isVisible() : true;
      var want = vis ? "" : "none";
      if (root.style.display !== want) root.style.display = want;
      if (!vis) setLegacy(true); else {
        var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
        setLegacy(isExtra && !st.q);
      }
    }
    if (o.observe) {
      var busy = false;
      new MutationObserver(function(){
        if (busy) return; busy = true;
        requestAnimationFrame(function(){ try { sync(); } finally { busy = false; } });
      }).observe(o.observe, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
    }
    render(); sync();
    /* QR 딥링크: ?q=차시코드 → 그 학년·단원으로 이동해 바로 고르기(시작) */
    try {
      var qp = new URLSearchParams(location.search).get("q");
      var target = qp && items.filter(function(x){ return x.q === qp; })[0];
      if (target) {
        st.g = target.grade; var us = unitsOf(st.g); st.u = Math.max(0, us.indexOf(target.unit)); st.q = "";
        render(); sync();
        setTimeout(function(){
          pick(target);
          var qrMode = new URLSearchParams(location.search).get("qr") === "1";
          if (o.mode === "select" && qrMode && o.onStart) { setTimeout(function(){ o.onStart(target); }, 250); return; }
          if (o.mode === "select") {
            selBox.hidden = false;
            selBox.style.boxShadow = "0 0 0 3px #f59e0b";
            var note = selBox.querySelector(".km-qr-note");
            if (!note) { note = el("span", "km-qr-note", "📱 선생님이 고른 차시예요. 아래 설정을 확인하고 시작하세요."); note.style.cssText = "flex-basis:100%;font-size:12.5px;color:#92400e"; selBox.appendChild(note); }
            root.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 350);
      }
    } catch(e) {}
    return { refresh: function(newItems){ if (newItems) { items = newItems; items.forEach(function(x){ x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|")); x.th = nrm([x.unit, x.mid, x.title].join("|")); }); } render(); sync(); },
             root: root, select: function(x){ st.sel = x; paintSel(); } };
  }
  window.KJSMenu = { init: init, hcode: hcode };
})();

</script>

function layout(primary, extra, maxWords){
  const MAX_EXTRA = 3;

  for (let t = 0; t < 160; t++) {
    const pri = t === 0 ? primary.slice().sort((a,b) => b.a.length - a.a.length) : shuffle(primary);

      let cross = 0;
      for (let k = 0; k < w.a.length; k++) {
        const rr = r + dr * k, cc = c + dc * k, ex = get(rr, cc);
        if (ex) { if (ex.ch !== w.a[k] || ex[dir]) return -1; cross++; }

        const dir = p.dir === "A" ? "D" : "A";
        const r = dir === "D" ? p.r - i : p.r + j;
        const c = dir === "D" ? p.c + j : p.c - i;
        const cr = fits(w, r, c, dir);

      let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;
      cells.forEach((v, k) => { const [r,c] = k.split(",").map(Number); r0=Math.min(r0,r); r1=Math.max(r1,r); c0=Math.min(c0,c); c1=Math.max(c1,c); });

            const cr = fits(w, r, c, dir); if (cr < 0) continue;
            const r1 = dir === "D" ? r + L - 1 : r, c1 = dir === "A" ? c + L - 1 : c;
            const area = (Math.max(B.r1, r1) - Math.min(B.r0, r) + 1) * (Math.max(B.c1, c1) - Math.min(B.c0, c) + 1);
            const sc = area - cr * 40 + Math.random();
            if (!bestPos || sc < bestPos.sc) bestPos = { r, c, dir, cr, sc };
          }
      }
      if (bestPos) put(w, bestPos.r, bestPos.c, bestPos.dir, bestPos.cr);
    }
    const nPri = placed.filter(p => primary.includes(p)).length || placed.filter(p => primary.some(w => w.a === p.a)).length;
    const B = bounds(), area = (B.r1 - B.r0 + 1) * (B.c1 - B.c0 + 1);
    const ratio = Math.max(B.r1 - B.r0 + 1, B.c1 - B.c0 + 1) / Math.min(B.r1 - B.r0 + 1, B.c1 - B.c0 + 1);
    const score = nPri * 1000 + crosses * 60 - area * 2 - ratio * 15 - nExtra * 20;
    if (!best || score > best.score) best = { placed, score, nPri, crosses };
  }
  const P = best.placed;
  const r0 = Math.min(...P.map(p => p.r)), c0 = Math.min(...P.map(p => p.c));
  P.forEach(p => { p.r -= r0; p.c -= c0; });
  const starts = [...new Set(P.map(p => p.r + "," + p.c))]
    .map(s => s.split(",").map(Number)).sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  P.forEach(p => { p.no = starts.findIndex(s => s[0] === p.r && s[1] === p.c) + 1; });
  return best;
}

/* ───────── 상태 ───────── */
let Z = null, timer = null;
let curGrade = "중1", curUnit = 0;
try { const s = JSON.parse(localStorage.getItem("kjs-cross") || "{}"); if (s.g) curGrade = s.g; if (s.u != null) curUnit = s.u; } catch(e) {}
function saveSel(){ try { localStorage.setItem("kjs-cross", JSON.stringify({ g: curGrade, u: curUnit })); } catch(e) {} }

function words(list){ return list.map(p => ({ q: p[0], a: norm(p[1]) })); }
function midWords(m){ const seen = new Set(); return [].concat(...m.sets.map(s => words(s.w))).filter(w => !seen.has(w.a) && seen.add(w.a)); }

function renderPicker(){
  const gc = $("gchips"); gc.innerHTML = "";
  ["중1","중2","중3"].forEach(g => { const b = document.createElement("button"); b.className = "chip"; b.textContent = g;
    b.setAttribute("aria-pressed", String(g === curGrade)); b.onclick = () => { curGrade = g; curUnit = 0; saveSel(); renderPicker(); }; gc.appendChild(b); });
  const units = DATA.filter(u => u.g === curGrade); if (curUnit >= units.length) curUnit = 0;
  const uc = $("uchips"); uc.innerHTML = "";
  units.forEach((u, i) => { const b = document.createElement("button"); b.className = "uchip"; b.textContent = u.u;
    b.setAttribute("aria-pressed", String(i === curUnit)); b.onclick = () => { curUnit = i; saveSel(); renderPicker(); }; uc.appendChild(b); });
  const u = units[curUnit], box = $("picklist"); box.innerHTML = "";
  u.mids.forEach(m => {
    const bar = document.createElement("div"); bar.className = "midbar";
    const mw = midWords(m);
    bar.innerHTML = "<span>" + esc(m.m) + "</span>";
    const cb = document.createElement("button"); cb.className = "combo"; cb.textContent = "▶ 중단원 종합 (" + mw.length + "개 중)";
    cb.onclick = () => start(u, m.m + " 종합", mw, [], 16);
    bar.appendChild(cb); box.appendChild(bar);
    const grid = document.createElement("div"); grid.className = "grid3";
    m.sets.forEach(s => {
      const w = words(s.w), extra = mw.filter(x => !w.some(y => y.a === x.a));
      const b = document.createElement("button"); b.className = "sbtn";
      b.innerHTML = "<b>" + esc(s.t) + "</b><span>용어 " + w.length + "개" + "" + "</span>";
      b.onclick = () => start(u, s.t, w, extra, Math.max(10, w.length));
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
}

function start(u, title, primary, extra, maxWords){
  const L = layout(primary, extra, maxWords);
  const P = L.placed;
  Z = { u, title, primary, extra, maxWords, P, sel: null, solved: new Set(), hints: 0, revealedCells: new Set(),
        t0: Date.now(), done: false };
  window.KJSInsight && KJSInsight.begin({ game: "crossword", gameName: "십자말풀이", unit: u.u, lesson: title });
  const rows = Math.max(...P.map(p => p.dir === "D" ? p.r + p.a.length : p.r + 1));
  const cols = Math.max(...P.map(p => p.dir === "A" ? p.c + p.a.length : p.c + 1));
  Z.rows = rows; Z.cols = cols;
  $("pickFull").classList.add("hidden");
  const pb = $("pickbar"); pb.classList.remove("hidden");
  pb.innerHTML = "<span><b>" + u.g + " " + esc(u.u) + "</b> · " + esc(title) + "</span>";
  const back = document.createElement("button"); back.className = "chip"; back.textContent = "다른 차시 고르기";
  back.onclick = () => { stopTimer(); $("play").classList.add("hidden"); pb.classList.add("hidden"); $("pickFull").classList.remove("hidden"); };
  pb.appendChild(back);
  $("printhead").querySelector("h2").textContent = "십자말풀이 · " + u.g + " " + u.u + " · " + title;
  const extraUsed = P.filter(p => !primary.some(w => w.a === p.a)).length;
  const skipped = primary.length - L.nPri;
  $("note").textContent = "낱말 " + P.length + "개로 판을 만들었습니다." +
    (extraUsed ? " 판을 잇기 위해 같은 중단원 용어 " + extraUsed + "개를 보탰습니다." : "") +
    (skipped > 0 ? " 판이 너무 커져 " + skipped + "개는 빠졌습니다(🔀 다시 배치로 바꿀 수 있어요)." : "") +
    " 서로 겹치는 칸 " + L.crosses + "곳.";
  $("play").classList.remove("hidden");
  drawGrid(); drawClues(); updateHud();
  select(P.filter(p => p.dir === "A")[0] || P[0]);
  stopTimer(); timer = setInterval(updateHud, 1000);
  window.scrollTo({ top: $("pickbar").getBoundingClientRect().top + scrollY - 10, behavior: "smooth" });
}
function stopTimer(){ clearInterval(timer); }
function cellsOf(p){ const out = []; for (let k = 0; k < p.a.length; k++) out.push([p.r + (p.dir === "D" ? k : 0), p.c + (p.dir === "A" ? k : 0), p.a[k]]); return out; }
function drawGrid(){
  const g = $("grid");
  const cs = Math.max(30, Math.min(50, Math.floor(620 / Math.max(Z.cols, Z.rows))));
  g.style.setProperty("--cs", cs + "px");
  g.style.gridTemplateColumns = "repeat(" + Z.cols + ", var(--cs))";
  g.innerHTML = "";
  const map = {};
  Z.P.forEach(p => cellsOf(p).forEach(([r,c,ch]) => { map[r+","+c] = ch; }));
  const nums = {}; Z.P.forEach(p => { nums[p.r+","+p.c] = p.no; });
  for (let r = 0; r < Z.rows; r++) for (let c = 0; c < Z.cols; c++) {
    const d = document.createElement("div"), k = r + "," + c;
    if (!map[k]) { d.className = "cell void"; g.appendChild(d); continue; }
    d.className = "cell"; d.dataset.k = k;
    d.innerHTML = (nums[k] ? '<span class="n">' + nums[k] + '</span>' : '') + '<span class="ch"></span>';
    d.onclick = () => clickCell(r, c);
    g.appendChild(d);
  }
  paintCells();
}
function cellEl(r, c){ return $("grid").querySelector('[data-k="' + r + ',' + c + '"]'); }
function paintCells(){
  const solvedCells = new Set();
  Z.P.forEach((p, i) => { if (Z.solved.has(i)) cellsOf(p).forEach(([r,c]) => solvedCells.add(r+","+c)); });
  const selCells = Z.sel ? new Set(cellsOf(Z.sel).map(([r,c]) => r+","+c)) : new Set();
  Z.P.forEach(p => cellsOf(p).forEach(([r,c,ch]) => {
    const el = cellEl(r, c), k = r + "," + c; if (!el) return;
    const show = solvedCells.has(k) || Z.revealedCells.has(k);
    el.querySelector(".ch").textContent = show ? ch : "";
    el.classList.toggle("ok", solvedCells.has(k));
    el.classList.toggle("hint", !solvedCells.has(k) && Z.revealedCells.has(k));
    el.classList.toggle("sel", selCells.has(k));
  }));
  document.querySelectorAll(".cell.void").forEach(() => {});
}
function drawClues(){
  ["A","D"].forEach(dir => {
    const ol = $(dir === "A" ? "acrossList" : "downList"); ol.innerHTML = "";
    Z.P.map((p, i) => ({ p, i })).filter(x => x.p.dir === dir).sort((a,b) => a.p.no - b.p.no).forEach(({ p, i }) => {
      const li = document.createElement("li"); li.dataset.i = i;
      li.innerHTML = "<b>" + p.no + "</b><span>" + esc(p.q) + " <em>(" + p.a.length + "글자)</em></span>";
      li.onclick = () => select(p);
      ol.appendChild(li);
    });
  });
  paintClues();
}
function paintClues(){
  document.querySelectorAll(".clues li").forEach(li => {
    const i = +li.dataset.i;
    li.classList.toggle("done", Z.solved.has(i));
    li.classList.toggle("on", Z.sel === Z.P[i]);
  });
}
function clickCell(r, c){
  const here = Z.P.filter(p => cellsOf(p).some(([rr,cc]) => rr === r && cc === c));
  if (!here.length) return;
  const nxt = here.length > 1 && here.includes(Z.sel) ? here.find(p => p !== Z.sel) : (here.find(p => !Z.solved.has(Z.P.indexOf(p))) || here[0]);
  select(nxt);
}
function select(p){
  if (!p) return;
  Z.sel = p;
  const i = Z.P.indexOf(p), dirName = p.dir === "A" ? "가로" : "세로";
  const ch = document.getElementById("choHint"); if (ch) ch.textContent = "";
  $("ansQ").innerHTML = "<small>" + p.no + " " + dirName + " · " + p.a.length + "글자</small>" + esc(p.q) +
    (Z.solved.has(i) ? " ✅" : "");
  paintCells(); paintClues();
  const inp = $("ansInput"); inp.value = ""; inp.maxLength = 20;
  if (!Z.done) inp.focus();
}
$("ansForm").addEventListener("submit", e => {
  e.preventDefault();
  if (!Z || !Z.sel || Z.done) return;
  const i = Z.P.indexOf(Z.sel), inp = $("ansInput"), v = norm(inp.value);
  if (!v) return;
  if (Z.solved.has(i)) { nextOpen(); return; }
  if (v === Z.sel.a) {
    window.KJSInsight && KJSInsight.hit(Z.sel.a, Z.sel.q);
    Z.solved.add(i); window.KJS && KJS.ok(); paintCells(); paintClues(); updateHud();
    if (Z.solved.size === Z.P.length) return finish();
    nextOpen();
  } else {
    window.KJSInsight && KJSInsight.miss(Z.sel.a, Z.sel.q, v);
    Z.wrong = Z.wrong || {}; Z.wrong[i] = (Z.wrong[i] || 0) + 1;
    if (window.KJSInsight) {
      const hintEl = document.getElementById("choHint");
      hintEl.textContent = "💡 초성 힌트: " + KJSInsight.chosung(Z.sel.a) + (Z.wrong[i] >= 2 ? "  (첫 글자: " + Z.sel.a[0] + ")" : "");
    }
    window.KJS && KJS.no({ msg: "초성 힌트를 보고 다시 도전! 🙂" });
    inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad"); inp.select();
  }
});
function nextOpen(){
  const order = Z.P.map((p, i) => ({ p, i })).sort((a,b) => (a.p.dir === b.p.dir ? 0 : a.p.dir === "A" ? -1 : 1) || a.p.no - b.p.no);
  const cur = order.findIndex(x => x.p === Z.sel);
  for (let k = 1; k <= order.length; k++) { const x = order[(cur + k) % order.length]; if (!Z.solved.has(x.i)) return select(x.p); }
}
$("tHint").onclick = () => {
  if (!Z || !Z.sel || Z.done) return;
  const next = cellsOf(Z.sel).find(([r,c]) => !Z.revealedCells.has(r+","+c));
  if (!next) return;
  Z.revealedCells.add(next[0]+","+next[1]); Z.hints++; window.KJSInsight && KJSInsight.hint(Z.sel.a, Z.sel.q); paintCells(); updateHud(); $("ansInput").focus();
};
$("tShuffle").onclick = () => { if (Z) start(Z.u, Z.title, Z.primary, Z.extra, Z.maxWords); };
$("tReveal").onclick = () => {
  if (!Z || !confirm("정답을 모두 보여 줄까요?")) return;
  Z.P.forEach((p, i) => { if (!Z.solved.has(i) && window.KJSInsight) KJSInsight.miss(p.a, p.q, "놓침"); Z.solved.add(i); });
  Z.done = true; stopTimer(); paintCells(); paintClues(); updateHud();
  showInsight();
};
$("tPrint").onclick = () => { document.body.classList.remove("printkey"); window.print(); };
$("tPrintKey").onclick = () => { document.body.classList.add("printkey"); window.print(); setTimeout(() => document.body.classList.remove("printkey"), 500); };

function fmt(s){ return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function updateHud(){
  if (!Z) return;
  $("hSolved").textContent = Z.solved.size + "/" + Z.P.length;
  if (!Z.done) Z.sec = Math.floor((Date.now() - Z.t0) / 1000);
  $("hTime").textContent = fmt(Z.sec || 0);
  $("hHint").textContent = Z.hints;
}

function showInsight(){
  $("sheet").innerHTML = "<h2>정답 공개</h2><p>" + esc(Z.title) + "</p><div id='insBoxX'></div><button class='sec' id='closeS2'>판 보기</button>";
  $("overlay").classList.remove("hidden");
  window.KJSInsight && KJSInsight.report($("insBoxX"));
  $("closeS2").onclick = () => $("overlay").classList.add("hidden");
}
function finish(){
  Z.done = true; stopTimer(); updateHud();
  window.KJS && KJS.win({ msg: "🏆 십자말풀이 완성!" });
  $("sheet").innerHTML = "<h2>🎉 완성!</h2><p>" + esc(Z.title) + "</p><div class='stats'><div><b>" + Z.P.length +
    "</b><span>낱말</span></div><div><b>" + fmt(Z.sec) + "</b><span>시간</span></div><div><b>" + Z.hints +
    "</b><span>힌트</span></div></div><button id='again'>새 판 만들기</button><button class='sec' id='closeS'>판 보기</button>";
  $("overlay").classList.remove("hidden");
  const ib = document.createElement("div"); $("sheet").insertBefore(ib, $("again"));
  window.KJSInsight && KJSInsight.report(ib);
  $("again").onclick = () => { $("overlay").classList.add("hidden"); start(Z.u, Z.title, Z.primary, Z.extra, Z.maxWords); };
  $("closeS").onclick = () => $("overlay").classList.add("hidden");
}
renderPicker();
</script>
<script id="kjs-menu-adapter">
(function(){

function clickWhere(sel, test){ var els = document.querySelectorAll(sel); for (var i = 0; i < els.length; i++) { if (test(els[i])) { els[i].click(); return true; } } return false; }
function plain(t){ return String(t).replace(/^[①-⑳]\s*/, ""); }

var items = [];
DATA.forEach(function(u){ u.mids.forEach(function(m){
  var mw = midWords(m);
  items.push({ grade: u.g, unit: u.u, mid: m.m, kind: "mid", title: plain(m.m) + " 중단원 종합",
    sub: mw.length + "개 용어로 큰 판 만들기", words: [], ref: function(){ start(u, m.m + " 종합", mw, [], 16); } });
  m.sets.forEach(function(s){
    var w = words(s.w), extra = mw.filter(function(x){ return !w.some(function(y){ return y.a === x.a; }); });
    items.push({ grade: u.g, unit: u.u, mid: m.m, title: s.t, short: s.t.split(" · ")[0], sub: "용어 " + w.length + "개",
      words: s.w.map(function(p){ return p[1] + " " + p[0]; }),
      ref: function(){ start(u, s.t, w, extra, Math.max(10, w.length)); } });
  });
}); });
KJSMenu.init({ key: "crossword", items: items, mount: document.getElementById("gchips"),
  legacyCss: "#pickFull > h2, #pickFull > .sub, #gchips, #uchips, #picklist", mode: "start",
  onPick: function(x){ x.ref(); } });

})();
</script>
