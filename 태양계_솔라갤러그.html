<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>

.hud span{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:4px 12px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--ln);background:#000}
canvas{width:100%;display:block;aspect-ratio:3/2}

.btn.pri{background:linear-gradient(#fde047,#f59e0b);border-color:#fff3a0;color:#2b1700;font-size:1.15em}

.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px 14px}
#say{font-size:1.1em;min-height:3.2em}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}

.opts .btn{min-height:58px}
form{display:flex;gap:8px}
#ans{flex:1;min-width:0;font-size:18px;font-family:inherit;background:#0a0620;color:#fff;border:2px solid var(--ln);border-radius:12px;padding:10px 12px}

.m{background:#0a0620;border:1px solid var(--ln);border-radius:10px;padding:7px 10px;font-size:.95em;white-space:pre-wrap}
.m.ok{border-color:var(--ok)}.m.no{border-color:var(--no)}.m.sp{border-color:var(--ac)}

{nm:'지구형 행성 편대 접근',pool:['수성','금성','지구','화성'],n:4,boss:[{a:'금성',q:'위성이 없고, 온실효과로 표면 온도가 가장 높은 행성!'},{a:'수성',q:'위성이 없고, 태양에 가장 가까운 행성이야!'},{a:'화성',q:'붉은 표면에 극관이 있고, 위성이 2개뿐인 행성!'}]},

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,d,type,v){if(mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f1,a.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),a.currentTime+d);g.gain.setValueAtTime(v||.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}

const ST=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:.4+Math.random()*1.6}));
const F={enemy:null,ex:360,ey:60,mode:'idle',t:0,shake:0,flash:0,parts:[],ship:true,captured:false,beam:false,laser:null,dual:false};
function emoji(t,x,y,sz,a){c.globalAlpha=a==null?1:a;c.font=sz+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y);c.globalAlpha=1}
function boom(x,y,n){for(let i=0;i<(n||40);i++){const a=Math.random()*6.28,s=1+Math.random()*5;F.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:['#fde047','#fb923c','#f43f5e','#fff'][i%4]})}}
function frame(){const now=performance.now();F.t=now;
 c.save();if(F.shake>0){c.translate((Math.random()-.5)*F.shake,(Math.random()-.5)*F.shake);F.shake*=.9;if(F.shake<.5)F.shake=0}
 c.fillStyle='#04020e';c.fillRect(-10,-10,W+20,H+20);
 ST.forEach(s=>{s.y+=s.s*.8;if(s.y>H)s.y=0;c.fillStyle='rgba(255,255,255,'+(.3+s.s/3)+')';c.fillRect(s.x,s.y,s.s,s.s*2)});
 // 편대
 const n=Math.max(0,G.q.length-G.i-(F.enemy&&!G.boss?1:0));
 for(let k=0;k<n;k++){const x=W/2+(k-(n-1)/2)*70,y=46+Math.sin(now/400+k)*6;emoji('👾',x,y,38)}
 if(F.mode==='intro'){}
 // 적
 const e=F.enemy;
 if(e){let x=F.ex,y=F.ey;if(F.mode==='dive'){const t=Math.min(1,(now-F.t0)/900),k=1-Math.pow(1-t,3);x=F.sx+(W/2-F.sx)*k+Math.sin(t*9)*40*(1-t);y=F.sy+(190-F.sy)*k;if(t>=1)F.mode='hold'}
  else if(F.mode==='hold'){x=W/2+Math.sin(now/500)*70;y=190+Math.sin(now/260)*8}
  else if(F.mode==='crash'){const t=Math.min(1,(now-F.t0)/500);x=F.hx+(W/2-F.hx)*t;y=F.hy+(400-F.hy)*t*t;if(t>=1){F.enemy=null;F.mode='idle';F.shake=26;F.flash=1;boom(W/2,400,30);sfx.hit();F.shipBlink=now+900;if(F.onCrash)F.onCrash()}}
  F.ex=x;F.ey=y;if(e){emoji(G.boss?'🛸':'👾',x,y,G.boss?92:62);
   if(G.boss&&F.beam){const bw=Math.min(1,(now-F.t0)/700);c.save();c.globalAlpha=.35+.15*Math.sin(now/90);const g=c.createLinearGradient(0,y,0,H);g.addColorStop(0,'#7dd3fc');g.addColorStop(1,'rgba(125,211,252,.05)');c.fillStyle=g;c.beginPath();c.moveTo(x-18,y+34);c.lineTo(x+18,y+34);c.lineTo(W/2+70*bw,420);c.lineTo(W/2-70*bw,420);c.closePath();c.fill();c.restore()}}}
 // 레이저
 if(F.laser){const L=F.laser,t=(now-L.t0)/220;if(t<1){c.strokeStyle='#fde047';c.lineWidth=5;c.shadowColor='#fde047';c.shadowBlur=14;for(const sx of (G.dual?[W/2-22,W/2+22]:[W/2])){c.beginPath();c.moveTo(sx,396);c.lineTo(sx+(L.x-sx)*t,396+(L.y-396)*t);c.stroke()}c.shadowBlur=0}else{boom(L.x,L.y,F.mode==='bossdead'?80:45);sfx.boom();F.laser=null;F.enemy=null;F.mode='idle';if(L.cb)L.cb()}}
 // 아군
 const blink=F.shipBlink&&now<F.shipBlink&&((now/80|0)%2);
 if(F.ship&&!blink){if(G.dual||F.rescueT&&now<F.rescueT){emoji('🚀',W/2-24,412,46);emoji('🚀',W/2+24,412,46)}else emoji('🚀',W/2,412,50)}
 if(F.cap){const t=Math.min(1,(now-F.cap)/900);emoji('🚀',W/2,412-(412-F.ey)*t,50*(1-t*.5));if(t>=1){F.cap=0;F.ship=false;boom(W/2,F.ey,20);setTimeout(()=>{F.enemy=null;F.mode='idle';F.beam=false;F.ship=true;F.shipBlink=performance.now()+900;if(F.onCap)F.onCap()},300)}}
 // 파편
 F.parts=F.parts.filter(p=>p.l>0);F.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l-=.02;c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.fillRect(p.x,p.y,5,5)});c.globalAlpha=1;
 if(F.flash>0){c.fillStyle='rgba(244,63,94,'+F.flash*.35+')';c.fillRect(0,0,W,H);F.flash-=.04}
 c.restore();requestAnimationFrame(frame)}
/* ===== 진행 ===== */
function startGame(){G.w=0;G.score=0;G.lives=3;G.pend=false;G.dual=false;G.miss=[];$('log').innerHTML='';startWave()}
function startWave(){const W0=WV[G.w];G.mult=G.pend?2:1;G.dual=G.pend;G.pend=false;
 const pool=W0.n>=W0.pool.length?shuf(W0.pool):shuf(W0.pool).slice(0,W0.n);
 G.q=pool.map(a=>({a,clue:shuf(B[a].c)[0]}));G.i=0;G.cur=null;G.boss=false;hud();
 $('ov').hidden=true;
 log('🎵 <b>[Wave '+(G.w+1)+': '+W0.nm+']</b>'+(G.mult>1?'\n🚀🚀 쌍발기 모드! 이번 웨이브 점수 2배!':''),'sp');sfx.coin();
 say('🚨 <b>WARNING!</b> [Wave '+(G.w+1)+': '+W0.nm+'] 👾×'+G.q.length+' + 보스 🛸 접근 중!<br>첫 번째 적기가 급강하합니다…');
 $('opts').innerHTML='';$('next').hidden=true;$('f').style.display='none';
 setTimeout(nextEnemy,1400)}
function mkOpts(a){const W0=WV[G.w];let ch=[a];shuf(W0.pool.filter(x=>x!==a)).slice(0,3).forEach(x=>ch.push(x));ch=shuf(ch);$('opts').innerHTML=ch.map(x=>'<button class="btn" data-o="'+x+'">'+x+'</button>').join('');$('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>fire(b.dataset.o))}
function nextEnemy(){
 if(G.i<G.q.length){G.boss=false;const e=G.q[G.i];G.cur=e;G.phase='ask';F.enemy=e;F.mode='dive';F.t0=performance.now();F.sx=W/2+(Math.random()-.5)*300;F.sy=46;F.beam=false;
  say('👾 <b>적기 '+(G.i+1)+'/'+G.q.length+'</b> 급강하! 「'+e.clue+'」');mkOpts(e.a);$('f').style.display='flex';$('ans').value='';$('ans').focus({preventScroll:true})}
 else{G.boss=true;const bq=shuf(WV[G.w].boss)[0];G.cur={a:bq.a,clue:bq.q,boss:true};G.phase='ask';F.enemy=G.cur;F.mode='dive';F.t0=performance.now();F.sx=W/2;F.sy=46;F.beam=true;sfx.beam();
  say('🛸 <b>보스 갤러그 출현!</b> 트랙터 빔 발사! 「'+bq.q+'」<br><span style="color:var(--mu)">정답을 맞히면 납치된 기체를 구출해 쌍발기 🚀🚀!</span>');mkOpts(bq.a);$('f').style.display='flex';$('ans').value='';log('🛸 보스 등장! 트랙터 빔으로 당신의 기체를 납치하려 해요!','sp')}
 $('next').hidden=true}
function fire(txt){if(G.phase!=='ask'||!txt)return;const e=G.cur,ok=norm(txt)===norm(e.a)||(B[e.a].al||[]).some(x=>norm(x)===norm(txt));G.phase='anim';$('opts').querySelectorAll('button').forEach(b=>b.disabled=true);$('f').style.display='none';sfx.laser();
 if(ok){F.laser={t0:performance.now(),x:F.ex,y:F.ey,cb:()=>afterHit(e)};if(e.boss)F.mode='bossdead';say('🔫 <b>삐슝!</b> '+txt+' 발사!')}
 else{G.miss.push(e.a);say('❌ <b>'+txt+'</b>? 아쉽! 적기가 돌진해요!!');
  if(e.boss){F.cap=performance.now();F.onCap=()=>afterMiss(e)}else{F.mode='crash';F.t0=performance.now();F.hx=F.ex;F.hy=F.ey;F.onCrash=()=>afterMiss(e)}}}
function afterHit(e){const pts=(e.boss?300:100)*G.mult;G.score+=pts;if(e.boss){G.dual=true;G.pend=G.w<2;F.rescueT=performance.now()+1500}hud();
 log((e.boss?'🛸💥 <b>보스 격추! 아군 기체 구출 성공!</b> 🚀🚀 쌍발기 모드!\n':'💥 <b>격추 성공! 콰쾅!</b> ')+'+'+pts+'점'+(G.mult>1?' (×2)':'')+'\n✅ 정답 <b>'+e.a+'</b> — '+B[e.a].ex,'ok');sfx.win();
 say('💥 <b>격추 성공! +'+pts+'점</b> '+(e.boss?'🚀🚀 쌍발기 획득!':'')+'<br>'+B[e.a].ex);afterTurn(e)}
function afterMiss(e){G.lives--;hud();log('💔 <b>충돌! 생명 -1</b>'+(e.boss?' (기체가 납치당했어요!)':'')+'\n정답은 <b>'+e.a+'</b> — '+B[e.a].ex,'no');say('💔 <b>'+(e.boss?'기체 납치!':'충돌!')+' 생명 -1</b> 정답은 <b>'+e.a+'</b><br>'+B[e.a].ex);
 if(G.lives<=0){return setTimeout(over,1400)}afterTurn(e)}
function afterTurn(e){if(!e.boss)G.i++;$('next').hidden=false;$('next').textContent=e.boss?(G.w<2?'🏁 웨이브 클리어! ▶':'🏁 결과 보기 ▶'):'다음 적기 ▶';$('next').onclick=()=>{$('next').hidden=true;if(e.boss)waveDone();else nextEnemy()};G.phase='wait'}
function waveDone(){G.cur=null;F.enemy=null;if(G.w<2){const o=$('ov');o.hidden=false;o.innerHTML='<h2>WAVE '+(G.w+1)+' CLEAR! 🎉</h2><p>SCORE <b>'+G.score+'</b> · 생명 '+'❤️'.repeat(G.lives)+'</p><p>'+(G.pend?'🚀🚀 쌍발기 보너스! 다음 웨이브 점수 2배!':'다음 웨이브도 힘내요!')+'</p><button class="btn pri" id="nw">▶ NEXT WAVE</button>';sfx.win();$('nw').onclick=()=>{G.w++;startWave()}}else end()}
function over(){const o=$('ov');o.hidden=false;if(G.score>G.hi){G.hi=G.score;try{localStorage.setItem('sg1',G.hi)}catch(e){}}hud();const u=[...new Set(G.miss)];o.innerHTML='<h2>GAME OVER 💀</h2><p>SCORE <b>'+G.score+'</b></p><p>'+(u.length?'다시 살펴볼 천체: <b>'+u.join(', ')+'</b>':'')+'</p><button class="btn pri" id="rt">🔄 CONTINUE? (다시 도전)</button>';$('rt').onclick=startGame;say('GAME OVER')}
function end(){const o=$('ov');o.hidden=false;G.score+=G.lives*50;if(G.score>G.hi){G.hi=G.score;try{localStorage.setItem('sg1',G.hi)}catch(e){}}hud();const u=[...new Set(G.miss)];const rank=G.score>=2000?'🥇 갤럭시 마스터':G.score>=1200?'🥈 태양계 탐험가':'🥉 우주 훈련생';o.innerHTML='<h2>🏆 ALL CLEAR!</h2><p>최종 SCORE <b>'+G.score+'</b> <small>(남은 생명 보너스 포함)</small></p><p style="font-size:1.4em">'+rank+'</p><p>'+(u.length?'복습할 천체: <b>'+u.join(', ')+'</b>':'틀린 문제가 하나도 없어요! 완벽해요 ✨')+'</p><button class="btn pri" id="rt">🔄 다시 하기</button>';sfx.win();$('rt').onclick=startGame;say('ALL CLEAR! 축하해요 🎉')}
/* ===== 이벤트 ===== */
$('f').onsubmit=e=>{e.preventDefault();fire($('ans').value.trim())};
$('start').onclick=()=>{ac();if(!bgmOn){bgmOn=true;bgm()}startGame()};
$('snd').onclick=()=>{mute=!mute;$('snd').textContent=mute?'🔇 소리 꺼짐':'🔊 소리 켜짐'};
$('fs').onclick=()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}catch(e){}};
hud();say('INSERT COIN 버튼을 눌러 시작하세요! 🪙');$('f').style.display='none';
frame();
window.__g={G,B,WV,fire,nextEnemy};
})();
</script></body></html>
