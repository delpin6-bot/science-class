<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>솔라 갤러그 · 태양계 퀴즈 슈팅</title>
<style>
:root{--bg:#05030f;--pn:#120b2e;--pn2:#1e1450;--ln:#4c3a9a;--tx:#f3efff;--mu:#b6a9ec;--ok:#34d399;--no:#f87171;--ac:#fde047}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(16px,1.6vw,20px);line-height:1.55;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:6px clamp(8px,2vw,16px);background:#02010a;border-bottom:1px solid var(--ln);flex-wrap:wrap}
header h1{margin:0;font-size:clamp(16px,2.3vw,22px);flex:1;min-width:190px}
.hb{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
main{max-width:980px;margin:0 auto;padding:10px clamp(8px,2vw,16px);display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:900;font-size:1.05em;font-family:ui-monospace,Menlo,Consolas,monospace}
.hud span{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:4px 12px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--ln);background:#000}
canvas{width:100%;display:block;aspect-ratio:3/2}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(5,3,15,.88);text-align:center;padding:14px}
#ov[hidden]{display:none}
#ov h2{margin:0;font-size:clamp(22px,4vw,38px);color:var(--ac);text-shadow:0 0 12px #f0a}
#ov p{margin:0;max-width:640px}
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:900;cursor:pointer;font-family:inherit;font-size:1em}
.btn.pri{background:linear-gradient(#fde047,#f59e0b);border-color:#fff3a0;color:#2b1700;font-size:1.15em}
.btn:disabled{opacity:.45}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px 14px}
#say{font-size:1.1em;min-height:3.2em}
#say b{color:var(--ac)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
@media(min-width:700px){.opts{grid-template-columns:repeat(4,1fr)}}
.opts .btn{min-height:58px}
form{display:flex;gap:8px}
#ans{flex:1;min-width:0;font-size:18px;font-family:inherit;background:#0a0620;color:#fff;border:2px solid var(--ln);border-radius:12px;padding:10px 12px}
#log{max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{background:#0a0620;border:1px solid var(--ln);border-radius:10px;padding:7px 10px;font-size:.95em;white-space:pre-wrap}
.m.ok{border-color:var(--ok)}.m.no{border-color:var(--no)}.m.sp{border-color:var(--ac)}
</style></head><body>
<header><h1>🚀 솔라 갤러그 <span style="font-size:.7em;color:var(--ac)">태양계 퀴즈 슈팅 · 중1</span></h1>

<main>

<div class="stage"><canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><h2>👾 SOLAR GALAGA 👾</h2><p>🎵 <i>빠바바밤~ 삐뽀삐뽀~ 뿅뿅뿅♪ (8비트 오락실 BGM 두둥!)</i></p><p>외계 편대(👾)가 <b>태양계 퀴즈 폭탄</b>을 던져요!<br>특징을 보고 <b>천체 이름</b>을 발사(입력하거나 버튼 터치)해서 격추하세요.<br>오답이면 적기가 충돌 ❤️-1! 웨이브 끝 보스 🛸를 이기면 <b>쌍발기 🚀🚀 → 다음 웨이브 점수 2배</b>!</p><button class="btn pri" id="start">🪙 INSERT COIN · 게임 시작</button></div></div>
<div class="card"><div id="say">…</div>
 <div class="opts" id="opts"></div>
 <form id="f" autocomplete="off"><input id="ans" placeholder="천체 이름 입력 후 발사! (예: 화성)" enterkeyhint="send"><button class="btn pri" type="submit" id="fire">🔫 발사!</button></form>

</main>

<script>
(()=>{'use strict';
const PHM={수성:'mercury',금성:'venus',지구:'earth',화성:'mars',목성:'jupiter',토성:'saturn',천왕성:'uranus',해왕성:'neptune',소행성:'vesta'};
function ph(a){const k=PHM[a];if(!k||!window.SSIMG||!window.SSIMG[k])return '';return '<img src="'+window.SSIMG[k]+'" alt="'+a+' 사진" style="float:left;width:76px;height:76px;margin:0 10px 4px 0;border-radius:50%;box-shadow:0 0 12px #38bdf8">';}

const $=id=>document.getElementById(id);
/* ===== 데이터 ===== */
const B={ // 천체: 별칭, 해설, 단서들
수성:{al:[],ex:'수성은 태양에 가장 가까운 가장 작은 행성! 대기가 거의 없어 낮 약 430℃, 밤 약 −180℃로 온도 차가 커요.',c:['나는 태양에서 가장 가까운 행성이지! 내가 누구게 빔-!','대기가 거의 없어서 낮과 밤의 온도 차가 엄청나게 크단다! 누구게?','표면에 크레이터가 가득하고 위성도 없는 태양계에서 가장 작은 행성이야!']},
금성:{al:['샛별','개밥바라기'],ex:'금성은 두꺼운 이산화탄소 대기의 온실효과로 표면 온도가 약 460℃! 다른 행성과 반대로 자전해요.',c:['새벽엔 샛별, 저녁엔 개밥바라기! 지구 크기와 비슷한 나는 누구게?','두꺼운 이산화탄소 구름에 덮여 표면이 안 보이지롱! 누구게?','다른 행성들과 반대 방향으로 자전한다네! 삐리릭!']},
지구:{al:[],ex:'지구는 액체 물과 산소, 적당한 온도가 있어 생명체가 살 수 있는 유일한 행성이에요. 위성은 달 1개!',c:['표면의 약 70%가 바다로 덮인 푸른 행성! 내가 누구게?','액체 상태의 물과 산소가 있어서 생명체가 사는 행성이야!','위성이 단 1개(달)인 우리 모두의 고향 행성이지! 누구게?']},
화성:{al:[],ex:'화성은 산화철 때문에 표면이 붉고, 극관(드라이아이스·얼음)이 있어요. 위성은 포보스·데이모스 2개!',c:['삐리릭! 나는 표면이 붉고 극관이 존재하지! 내가 누구게 빔-!','태양계에서 가장 큰 화산 올림포스 산이 내 몸에 있다구!','위성이 포보스와 데이모스, 딱 2개뿐이야! 누구게?']},

(function(){
