<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100">
  <defs>
    <!-- 전기 발광 필터 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 받침대 -->
  <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- 가지돌기 (전기 방출선) -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <line x1="50" y1="50" x2="20" y2="24" />
    <line x1="20" y1="24" x2="12" y2="18" />
    <line x1="20" y1="24" x2="16" y2="34" />
    <line x1="50" y1="50" x2="80" y2="24" />
    <line x1="80" y1="24" x2="88" y2="18" />
    <line x1="80" y1="24" x2="84" y2="34" />
    <line x1="50" y1="50" x2="50" y2="82" />
    <line x1="50" y1="82" x2="38" y2="92" />
    <line x1="50" y1="82" x2="62" y2="92" />
  </g>

  <!-- 신경세포체 -->
  <circle cx="50" cy="50" r="18" fill="#0284c7" stroke="#bae6fd" stroke-width="2.5"/>

  <!-- 중심 핵 (발광 효과) -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" filter="url(#glow)"/>
</svg>
