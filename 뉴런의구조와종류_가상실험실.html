<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const D2R=Math.PI/180,R2D=180/Math.PI;
function fit(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  if(cv.width!==w*d||cv.height!==h*d){cv.width=w*d;cv.height=h*d}
  const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);return {g,w,h,d}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function toast(id,msg,ms){const el=$(id);el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms||2800)}

let AC=null;
function beep(f1,f2,d,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f1,AC.currentTime);o.frequency.linearRampToValueAtTime(f2,AC.currentTime+d);gn.gain.setValueAtTime(v||.12,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sOK=()=>{beep(520,880,.22);setTimeout(()=>beep(880,1180,.22),120)},sNO=()=>beep(300,160,.3),sTap=()=>beep(500,700,.08,.08),sBoom=()=>{beep(90,40,.6,.25);setTimeout(()=>beep(70,35,.8,.2),150)};
let mode=1;
function setMode(m){mode=m;[1,2,3].forEach(i=>{$('#m'+i).classList.toggle('on',i===m);$('#tab'+i).classList.toggle('on',i===m)});dirty1=dirty2=dirty3=true}

function confetti(em){em=em||['⭐','✨','🎉'];for(let i=0;i<22;i++){const e=document.createElement('div');e.className='cfx';e.textContent=em[i%em.length];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function hud(){const it=LAB.segs();$('#pbar').innerHTML=it.map(x=>`<div class="pseg${x[1]?' ok':''}">${x[0]}${x[1]?' ✔':''}</div>`).join('')+`<div class="pseg${QSC>=QZ.length?' ok':''}">퀴즈 ${QSC<0?'–':QSC+'/'+QZ.length}</div>`}
// 슬라이더 연결: sl(id, fmt, cb)
function sl(id,fmt,cb){const r=$('#'+id),o=$('#'+id+'o');const f=()=>{o.textContent=fmt(+r.value);cb&&cb(+r.value)};r.addEventListener('input',f);f();return r}
// 캔버스 논리 좌표
function view(cv,LW,LH){const{g,w,h}=fit(cv),sc=Math.min(w/LW,h/LH),ox=(w-LW*sc)/2,oy=(h-LH*sc)/2;g.save();g.translate(ox,oy);g.scale(sc,sc);return{g,sc,ox,oy,w,h}}
function toL(cv,e,LW,LH){const r=cv.getBoundingClientRect(),sc=Math.min(r.width/LW,r.height/LH),ox=(r.width-LW*sc)/2,oy=(r.height-LH*sc)/2;return[(e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc]}
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{QSC=Math.max(QSC,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};
function setPh(on,save){document.body.classList.toggle('ph',!!on);$('#btnPh').classList.toggle('on',!!on);$('#btnPh').textContent=on?'📱 스마트폰 모드 ON':'📱 스마트폰 모드';if(save){try{localStorage.setItem(LAB.key+'-ph',on?'1':'0')}catch(e){}}LAB.onPh&&LAB.onPh()}
$('#btnPh').onclick=()=>setPh(!document.body.classList.contains('ph'),true);

$('#btnReset').onclick=resetAll;

let _last=0;function _loop(now){const dt=Math.min(.05,(now-(_last||now))/1000);_last=now;try{LAB.frame&&LAB.frame(dt,mode)}catch(e){console.error(e)}requestAnimationFrame(_loop)}
function boot(){QZ=LAB.quiz;LAB.init&&LAB.init();resetAll();let p=null;try{p=localStorage.getItem(LAB.key+'-ph')}catch(e){}setPh(p==='1'||(p===null&&innerWidth<=760),false);requestAnimationFrame(_loop)}

const LW=800,LH=440;let TS=1;
const rnd=(a,b)=>a+Math.random()*(b-a);
function P(x,y,r,c){return{x,y,r,c,vx:0,vy:0,t:0,j:Math.random()*9}}
function walk(p,sp,dt,b){p.t-=dt;if(p.t<=0){const a=Math.random()*6.2832;p.vx=Math.cos(a);p.vy=Math.sin(a);p.t=rnd(.12,.32)}
 p.x+=p.vx*sp*dt;p.y+=p.vy*sp*dt;if(p.x<b[0]+p.r){p.x=b[0]+p.r;p.vx=Math.abs(p.vx)}if(p.x>b[2]-p.r){p.x=b[2]-p.r;p.vx=-Math.abs(p.vx)}if(p.y<b[1]+p.r){p.y=b[1]+p.r;p.vy=Math.abs(p.vy)}if(p.y>b[3]-p.r){p.y=b[3]-p.r;p.vy=-Math.abs(p.vy)}}
function dots(g,a,al){g.globalAlpha=al||1;a.forEach(p=>{g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.2832);g.fill()});g.globalAlpha=1}
const COL=['#64748b','#3b82f6','#f97316'],NM=['고체','액체','기체'];
document.querySelectorAll('.tsb').forEach(b=>b.onclick=()=>{TS=TS===1?3:1;document.querySelectorAll('.tsb').forEach(x=>{x.textContent='⏩ 빠르게 ×'+TS;x.classList.toggle('on2',TS>1)})});
// 상태 상자: 30개 입자. st 0/1/2, k=운동 속도 배율, hl=액체 높이, lat=고체 격자 열 수
function Box(x0,y0,x1,y1,o){o=o||{};const b={x0,y0,x1,y1,st:0,k:1,hl:o.hl||80,cols:o.cols||6,n:o.n||30,r:o.r||8,ps:[],vol:1};
 b.fill=function(){b.ps=[];for(let i=0;i<b.n;i++)b.ps.push(P(rnd(x0+10,x1-10),rnd(y1-80,y1-10),b.r,COL[b.st]))};
 b.set=function(s){b.st=s;b.ps.forEach(p=>p.c=COL[s])};
 b.step=function(dt){const cx=(b.x0+b.x1)/2,sp=b.st===0?0:(b.st===1?60:230)*b.k,sz=b.r*2.7;
  b.ps.forEach((p,i)=>{if(b.st===0){const tx=cx-(b.cols-1)*sz/2+(i%b.cols)*sz,ty=b.y1-b.r-4-Math.floor(i/b.cols)*sz;const q=Math.min(1,7*dt);p.x+=(tx-p.x)*q+Math.sin(performance.now()/90+p.j)*.3*b.k;p.y+=(ty-p.y)*q+Math.cos(performance.now()/80+p.j)*.3*b.k}
   else{const top=b.st===1?b.y1-b.hl:b.y0;if(p.y<top)p.y+=(top-p.y)*Math.min(1,5*dt)+1;walk(p,sp,dt,[b.x0,top,b.x1,b.y1])}});
  if(b.st===1){const a=b.ps,d0=b.r*2;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const dx=a[j].x-a[i].x,dy=a[j].y-a[i].y,d=Math.hypot(dx,dy)||.1;if(d<d0){const m=(d0-d)/2/d;a[i].x-=dx*m;a[i].y-=dy*m;a[j].x+=dx*m;a[j].y+=dy*m}}}};
 b.draw=function(g,tint){g.fillStyle='#fff';g.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);if(b.st===1){g.fillStyle=tint||'rgba(96,165,250,.3)';g.fillRect(b.x0,b.y1-b.hl,b.x1-b.x0,b.hl)}
  g.strokeStyle='#64748b';g.lineWidth=7;g.lineJoin='round';g.beginPath();g.moveTo(b.x0,b.y0);g.lineTo(b.x0,b.y1);g.lineTo(b.x1,b.y1);g.lineTo(b.x1,b.y0);g.stroke();dots(g,b.ps,.95)};
 b.fill();return b}
function bar(id,pc){$('#'+id).style.width=Math.max(0,Math.min(100,pc))+'%'}

function arrow(g,x1,y1,x2,y2,c,w,lab){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<3)return;const a=Math.atan2(dy,dx),h=Math.min(26,L*.5);w=w||8;g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.8,y2-Math.sin(a)*h*.8);g.stroke();g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-Math.cos(a-.45)*h,y2-Math.sin(a-.45)*h);g.lineTo(x2-Math.cos(a+.45)*h,y2-Math.sin(a+.45)*h);g.closePath();g.fill();
 if(lab){g.font='900 22px sans-serif';g.textAlign='center';g.fillStyle=c;g.fillText(lab,(x1+x2)/2-Math.sin(a)*26,(y1+y2)/2+Math.cos(a)*26+6)}}
function spring(g,x1,y1,x2,y2,n,w,c){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;g.strokeStyle=c||'#475569';g.lineWidth=5;g.lineJoin='round';g.beginPath();g.moveTo(x1,y1);const s=L*.1;g.lineTo(x1+ux*s,y1+uy*s);for(let i=0;i<=n*2;i++){const t=.1+.8*i/(n*2),o=(i%2?1:-1)*w;g.lineTo(x1+ux*L*t+px*o,y1+uy*L*t+py*o)}g.lineTo(x2-ux*s,y2-uy*s);g.lineTo(x2,y2);g.stroke()}
// 분류 도우미: Sorter(rootSel, items[[label,bin,exp]], sayId, done)
function Sorter(root,items,sayId,done){const R=$(root),st={ok:[],sel:-1};const it=R.querySelector('.items'),bins=[...R.querySelectorAll('.bin')];
 function r(){it.innerHTML='';items.forEach((x,i)=>{if(st.ok[i])return;const b=document.createElement('button');b.className='item'+(st.sel===i?' sel':'');b.textContent=x[0];b.onclick=()=>{st.sel=i;sTap();r()};it.appendChild(b)});bins.forEach(bn=>{const k=+bn.dataset.b;bn.querySelector('.bc').innerHTML=items.map((x,i)=>st.ok[i]&&x[1]===k?'<span class="chip">'+x[0]+'</span>':'').join('')})}
 bins.forEach(bn=>bn.onclick=()=>{if(st.sel<0){say('먼저 카드를 눌러요',1500);return}const k=+bn.dataset.b,x=items[st.sel];if(x[1]===k){st.ok[st.sel]=1;sOK();$('#'+sayId).className='say ok';$('#'+sayId).textContent='⭕ '+x[0]+(x[2]?' — '+x[2]:'');st.sel=-1;r();hud();if(st.ok.filter(Boolean).length===items.length){say(done||'분류 완료 🎉',3000);confetti(['✨','🎉'])}}else{sNO();bn.classList.add('shake');setTimeout(()=>bn.classList.remove('shake'),500);$('#'+sayId).className='say bad';$('#'+sayId).textContent='❌ 다시 생각해 보세요.'}});
 st.reset=()=>{st.ok=[];st.sel=-1;r()};st.done=()=>st.ok.filter(Boolean).length===items.length;st.solve=()=>{items.forEach((x,i)=>{st.sel=i;bins.find(b=>+b.dataset.b===x[1]).click()})};st.reset();return st}
// 객관식 연속: MCSeq(qId,oId,pId,sayId,list[[q,opts,ans,exp]],done)
function MCSeq(qId,oId,pId,sayId,list,done,onShow){const st={n:0};function show(){if(st.n>=list.length){$('#'+qId).textContent='🎉 모두 맞혔어요!';$('#'+oId).innerHTML='';return}const q=list[st.n];onShow&&onShow(st.n);$('#'+qId).textContent=(st.n+1)+'. '+q[0];$('#'+oId).innerHTML='';const od=q[1].map((_,i)=>i);for(let k=od.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[od[k],od[j]]=[od[j],od[k]]}od.forEach(i=>{const t=q[1][i];const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(i===q[2]){sOK();st.n++;$('#'+pId).textContent=st.n+' / '+list.length;$('#'+sayId).className='say ok';$('#'+sayId).textContent='⭕ '+q[3];hud();if(st.n>=list.length){say(done||'완료 🎉',3000);confetti(['✨','🎉'])}show()}else{sNO();b.classList.add('wrong','shake');$('#'+sayId).className='say bad';$('#'+sayId).textContent='❌ 다시 생각해 보세요.'}};$('#'+oId).appendChild(b)})}
 st.reset=()=>{st.n=0;$('#'+pId).textContent='0 / '+list.length;show()};st.done=()=>st.n>=list.length;st.solve=()=>{let g=0;while(st.n<list.length&&g++<500){const q=list[st.n];const b=[...$('#'+oId).children].find(x=>x.textContent===q[1][q[2]]);if(!b)break;b.click()}};return st}
function sorterHTML(id,title,bins){return `<div class="card" id="${id}"><div class="ct">${title}</div><div class="items"></div><div class="bins" style="grid-template-columns:repeat(${bins.length},minmax(0,1fr));margin-top:10px">${bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${b}</h3><div class="bc"></div></div>`).join('')}</div>`}
