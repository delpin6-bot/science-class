}
function mount(){

  var hb=D.querySelector('.hb');
  if(hb&&hb.parentNode&&hb.tagName==='BUTTON'||hb&&hb.parentNode){b.className='hb qrk-in';hb.parentNode.insertBefore(b,hb);}

}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',mount);else mount();
window.kjsOpenQr=open;
