<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>호흡 운동과 기체 교환 가상실험실</title>
<style>

html,body{height:100%}

.sp{flex:1}

main{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px}
.mode{display:none;height:100%}
.mode.on{display:grid;gap:10px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}

.btn.chip.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.btn.chip.done{background:#dcfce7;border-color:#22c55e}.btn.chip:disabled{opacity:.45}

.sm .btn{min-height:48px;font-size:clamp(12px,1.05vw,16px);padding:0 10px}

.hudc span{display:block;font-size:.78em;font-weight:800;color:var(--mut)}.hudc b{display:block;font-size:clamp(20px,2.1vw,32px);font-variant-numeric:tabular-nums}
.hudc .i{border-color:#3b82f6;background:#eff6ff}.hudc .i b{color:#1d4ed8}.hudc .r{border-color:#f97316;background:#fff7ed}.hudc .r b{color:#c2410c}.hudc .m{border-color:#94a3b8}.hudc .m b{color:#475569}
.pres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pres .btn{min-height:52px;padding:0}.pres .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}

.dt{width:100%;border-collapse:collapse;font-weight:800;text-align:center;font-size:clamp(12px,1.05vw,16px)}.dt th,.dt td{border:2px solid #cbd5e1;padding:6px 3px}.dt th{background:#dbeafe;color:#1e3a8a}.dt td.f{background:#fef9c3;color:#166534}.dt td.cur{outline:3px solid #f59e0b}

.stg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stg3 .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.stg3 .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.stg3 .btn.ok{background:#dcfce7;border-color:#22c55e}
.alert{border-radius:12px;padding:8px 12px;font-weight:900;line-height:1.45;background:#fef2f2;border:3px solid #ef4444;color:#7f1d1d;font-size:clamp(13px,1.1vw,17px)}
.cv{width:100%;border:2px solid #cbd5e1;border-radius:12px;background:#f8fafc;display:block}
input[type=range].big{accent-color:#0f766e}

.seg{display:grid;gap:6px}.seg .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.seg .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.seg .btn.ok{border-color:#22c55e}
.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd div{border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;font-size:clamp(12px,1.02vw,15px);background:#f8fafc}.spd i{display:block;height:9px;border-radius:5px;background:#38bdf8;margin-top:3px}
.hudc .g b{color:#15803d}.hudc .g{border-color:#22c55e;background:#f0fdf4}
.med{display:grid;grid-template-columns:1fr 1fr;gap:6px}.med .btn{min-height:58px;line-height:1.2;padding:3px 8px;text-align:left;font-size:clamp(12px,1.05vw,16px)}.med .btn.on{background:#fffbeb;border-color:#f59e0b}

.ban{border-radius:12px;padding:8px 12px;font-weight:900;background:#fef9c3;border:3px solid #facc15;color:#713f12;line-height:1.45;font-size:clamp(13px,1.1vw,17px)}.ban:empty{display:none}

.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:900;font-size:clamp(12px,1.05vw,16px);border:2px solid}
.b-d{background:#fef9c3;border-color:#eab308;color:#713f12}.b-r{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}.b-f{background:#dcfce7;border-color:#22c55e;color:#14532d}.b-n{background:#e5e7eb;border-color:#9ca3af;color:#374151}
.hi{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hi div{border:2px solid var(--line);border-radius:12px;padding:5px 9px;font-weight:800;background:#f8fafc;font-size:clamp(12px,1.05vw,16px);line-height:1.4}
.sortbox{position:absolute;inset:0;overflow:auto;padding:12px;display:none;flex-direction:column;gap:10px;background:#f1f5f9}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cardb{min-height:84px;border:3px solid #cbd5e1;border-radius:14px;background:#fff;font-weight:900;font-size:clamp(13px,1.2vw,18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;line-height:1.2;padding:4px}.cardb span{font-size:clamp(26px,3vw,42px)}.cardb.sel{border-color:#f59e0b;background:#fffbeb;transform:scale(1.04)}.cardb.shake{animation:shk .4s;border-color:#ef4444;background:#fef2f2}

.zone.src{border-color:#f59e0b}.zone.non{border-color:#64748b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#dcfce7;border:2px solid #22c55e;border-radius:10px;padding:3px 8px;font-size:clamp(12px,1.05vw,16px)}

function draw1(cv,now,dt){const{g,w,h}=fit(cv);const G=geo1(w,h),sc=G.sc,fs=clamp(sc*17,11,19);R1.t+=dt;

  const q=G.U(432,108);pill(g,'코',q[0],q[1],'#1e293b','#fff',fs);

  $('#ctl3').innerHTML='<div class="cr" style="gap:8px"><button class="btn" id="pl3" style="min-height:64px;flex:1">⏸ 일시 정지</button><button class="btn" data-s3="0.5" style="min-height:64px;flex:1">🐢 느리게</button><button class="btn on" data-s3="1" style="min-height:64px;flex:1">보통</button><button class="btn" data-s3="2" style="min-height:64px;flex:1">🐇 빠르게</button></div><div class="cr" style="margin-top:8px"><button class="btn on" id="br3" style="min-height:56px;flex:1">📊 농도 막대 보기</button><button class="btn" id="rs3" style="min-height:56px;flex:1">🔄 입자 다시 시작</button></div>';
  $('#info3').innerHTML='<div class="kv2">📋 기체 교환 정리 (농도가 높은 곳 → 낮은 곳으로 확산)</div><table class="cmpa" style="margin-top:6px"><tr><th></th><th>O₂ (산소)</th><th>CO₂ (이산화 탄소)</th><th>혈액 색</th></tr><tr><th>외호흡<br>허파꽈리</th><td>허파꽈리 → 혈액</td><td>혈액 → 허파꽈리</td><td style="color:#8e1b3d">암적색 → <span style="color:#e11d0c">선홍색</span></td></tr><tr><th>내호흡<br>조직세포</th><td>혈액 → 조직세포</td><td>조직세포 → 혈액</td><td style="color:#e11d0c">선홍색 → <span style="color:#8e1b3d">암적색</span></td></tr></table>';
  ui3()}
function ui3(){$$('[data-g3]').forEach(b=>b.classList.toggle('on',b.dataset.g3===GX.focus));$$('[data-s3]').forEach(b=>b.classList.toggle('on',+b.dataset.s3===GX.sp));const p=$('#pl3');if(p){p.textContent=GX.play?'⏸ 일시 정지':'▶ 재생';p.classList.toggle('on',!GX.play)}$('#br3')&&$('#br3').classList.toggle('on',GX.bars);
  $('#tip3').innerHTML=GX.focus==='L'?'🫁 <b>외호흡</b>: 허파꽈리 속 <b>O₂ 농도가 더 높아</b> 모세혈관으로 이동하고, 모세혈관의 <b>CO₂ 농도가 더 높아</b> 허파꽈리로 이동해요. 혈액은 <b>암적색 → 선홍색</b>!':GX.focus==='R'?'🧍 <b>내호흡</b>: 모세혈관의 <b>O₂ 농도가 더 높아</b> 조직세포로 이동하고, 조직세포의 <b>CO₂ 농도가 더 높아</b> 모세혈관으로 이동해요. 혈액은 <b>선홍색 → 암적색</b>!':'🔍 <b>🔍 돋보기</b>를 눌러 확산 원리를 확인하고, 입자가 <b>농도가 높은 곳에서 낮은 곳으로</b> 움직이는 모습을 관찰해 보세요.'}
function hit3(e){const cv=$('#a3'),r=cv.getBoundingClientRect(),w=r.width,h=r.height,sc=Math.min(w/1000,h/620),ox=(w-1000*sc)/2,oy=(h-620*sc)/2,x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc,rad=Math.max(36,32/sc);
  if(Math.hypot(x-455,y-98)<rad){sTick();toast('#toast3','🔍 외호흡: 허파꽈리는 O₂ 농도가 높고 모세혈관은 낮아 O₂가 혈액으로, 모세혈관은 CO₂ 농도가 높아 CO₂가 허파꽈리로 확산해요. (농도 높은 곳 → 낮은 곳)',4600);return}
  if(Math.hypot(x-955,y-98)<rad){sTick();toast('#toast3','🔍 내호흡: 모세혈관은 O₂ 농도가 높고 조직세포는 낮아 O₂가 조직세포로, 조직세포는 CO₂ 농도가 높아 CO₂가 모세혈관으로 확산해요. (농도 높은 곳 → 낮은 곳)',4600)}}
$('#a3').addEventListener('pointerdown',hit3);
document.addEventListener('click',e=>{let b;
  if(b=e.target.closest('[data-r]')){sel1(b.dataset.r);return}
  if(b=e.target.closest('[data-dir]')){R1.dir=+b.dataset.dir;$$('[data-dir]').forEach(x=>x.classList.toggle('on',x===b));sTap();return}
  if(e.target.closest('#fl1')){R1.flow=!R1.flow;$('#fl1').classList.toggle('on',R1.flow);sTap();return}
  if(b=e.target.closest('[data-b2]')){const m=b.dataset.b2;sTap();if(m==='auto'){B2.auto=!B2.auto;b.classList.toggle('on',B2.auto);if(B2.auto){B2.tg=B2.k>.5?0:1;B2.hold=0}else B2.tg=null}else{B2.auto=false;$('#au2').classList.remove('on');B2.tg=m==='in'?1:0}return}
  if(b=e.target.closest('[data-g3]')){GX.focus=b.dataset.g3;sTap();ui3();return}
  if(b=e.target.closest('[data-s3]')){GX.sp=+b.dataset.s3;sTap();ui3();return}
  if(e.target.closest('#pl3')){GX.play=!GX.play;sTap();ui3();return}
  if(e.target.closest('#br3')){GX.bars=!GX.bars;sTap();ui3();return}
  if(e.target.closest('#rs3')){initGX();sTap();return}});
function hud(){const el=$('#pbar');el.style.display='flex';el.style.gap='6px';
  const a=S.a,b=S.b,c=S.c;const it=[['🫁 호흡계 부위 '+Math.min(a.size,6)+'/6',a.size>=6],['🌬 들숨 관찰',b.has('in')],['💨 날숨 관찰',b.has('out')],['🔬 외호흡',c.has('ex')],['🧍 내호흡',c.has('in')]];
  el.innerHTML=it.map(x=>`<div class="pseg${x[1]?' ok':''}">${x[0]}${x[1]?' ✔':''}</div>`).join('')+`<div class="pseg${S.quiz>=QZ.length?' ok':''}">퀴즈 ${S.quiz<0?'–':S.quiz+'/'+QZ.length}</div>`}
const QZ=[
 {q:'숨을 들이쉴 때(들숨) 갈비뼈와 가로막의 움직임은?',o:['갈비뼈 올라가고, 가로막 내려간다','갈비뼈 내려가고, 가로막 올라간다','갈비뼈와 가로막 모두 올라간다','갈비뼈와 가로막 모두 내려간다'],a:0,e:'들숨에서는 갈비뼈가 올라가고 가로막이 내려가 흉강의 부피가 커져요.'},
 {q:'들숨 때 흉강의 부피와 허파 속 압력 변화는?',o:['부피 커짐, 압력 낮아짐','부피 커짐, 압력 높아짐','부피 작아짐, 압력 낮아짐','부피 작아짐, 압력 높아짐'],a:0,e:'부피가 커지면 허파 속 압력이 대기압보다 낮아져 공기가 들어와요.'},
 {q:'숨을 내쉴 때(날숨) 일어나는 현상으로 옳은 것은?',o:['갈비뼈 내려가고 가로막 올라가 흉강 부피가 작아진다','갈비뼈 올라가고 가로막 내려가 흉강 부피가 커진다','허파가 스스로 쪼그라든다','허파 속 압력이 대기압보다 낮아진다'],a:0,e:'날숨에서는 흉강 부피가 작아져 허파 속 압력이 높아지고 공기가 밖으로 나가요.'},
 {q:'호흡 운동 모형에서 고무막이 나타내는 것은?',o:['가로막','허파','숨관','갈비뼈'],a:0,e:'고무막=가로막, 고무풍선=허파, Y자관=숨관과 숨관가지, 플라스틱 컵=흉강이에요.'},
 {q:'허파가 스스로 커졌다 작아지지 못하는 까닭은?',o:['허파에는 근육이 없기 때문','허파가 너무 단단해서','허파에 공기가 없어서','허파가 갈비뼈에 붙어 있어서'],a:0,e:'허파에는 근육이 없어서 갈비뼈와 가로막의 움직임으로 흉강 부피가 바뀌어 공기가 드나들어요.'},
 {q:'기체 교환이 일어나는 곳은?',o:['허파꽈리','숨관','코','숨관가지의 바깥'],a:0,e:'허파꽈리와 모세혈관 사이에서 O₂와 CO₂가 교환돼요.'},
 {q:'허파꽈리에서 일어나는 기체 교환의 원리는?',o:['농도가 높은 곳에서 낮은 곳으로 확산','농도가 낮은 곳에서 높은 곳으로 능동 수송','압력 차에 의한 흡입','심장의 힘에 의한 이동'],a:0,e:'기체는 확산에 의해 농도가 높은 곳에서 낮은 곳으로 이동해요.'},
 {q:'허파꽈리에서 모세혈관으로 이동하는 기체와 혈액 색 변화는?',o:['O₂, 암적색 → 선홍색','CO₂, 암적색 → 선홍색','O₂, 선홍색 → 암적색','CO₂, 선홍색 → 암적색'],a:0,e:'허파꽈리의 O₂가 혈액으로 들어오면 혈액이 선홍색 동맥혈로 바뀌어요.'},
 {q:'조직세포에서 일어나는 기체 교환으로 옳은 것은?',o:['O₂는 모세혈관 → 조직세포, CO₂는 조직세포 → 모세혈관','O₂는 조직세포 → 모세혈관, CO₂는 모세혈관 → 조직세포','O₂와 CO₂ 모두 모세혈관 → 조직세포','O₂와 CO₂ 모두 조직세포 → 모세혈관'],a:0,e:'세포호흡에 O₂가 쓰이고 CO₂가 생기므로 O₂는 세포로, CO₂는 혈액으로 이동해요.'},
 {q:'허파가 기체 교환에 알맞은 까닭은?',o:['수많은 허파꽈리로 표면적이 넓고 모세혈관이 둘러싸고 있어서','허파꽈리 벽이 두꺼워서','허파꽈리가 크기가 커서','허파꽈리에 혈관이 없어서'],a:0,e:'허파꽈리는 수가 아주 많아 표면적이 넓고, 얇은 벽을 모세혈관이 둘러싸 기체 교환이 효율적이에요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{S.quiz=Math.max(S.quiz,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};
function resetAll(){S.a=new Set();S.b=new Set();S.c=new Set();S.quiz=-1;R1.sel=null;R1.dir=1;R1.flow=true;B2.k=0;B2.pk=0;B2.rate=0;B2.tg=null;B2.auto=false;GX.focus='all';GX.play=true;GX.sp=1;GX.bars=true;initGX();
  for(const k of [1,2,3]){const c=$('#cc'+k);c.style.display='none';c.innerHTML=''}
  ctl1();ctl2();ctl3();fbx('#fb1','🫁 호흡계의 각 부위를 눌러 이름과 기능을 확인해 보세요.');fbx('#fb2','🎚 슬라이더로 가로막을 움직여 들숨과 날숨을 관찰해 보세요.');fbx('#fb3','🔬 외호흡과 내호흡에서 기체가 확산하는 모습을 관찰해 보세요.');hud();setMode(1)}
$('#btnReset').onclick=resetAll;
let lastT=0;function loop(){try{const now=performance.now()/1000,dt=Math.min(.05,now-(lastT||now));lastT=now;if(mode===1)draw1($('#a1'),now,dt);else if(mode===2)draw2($('#a2'),now,dt);else draw3($('#a3'),now,dt)}catch(e){console.error(e)}requestAnimationFrame(loop)}
resetAll();requestAnimationFrame(loop);
</script>
