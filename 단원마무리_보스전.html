$('grid').innerHTML=U.map((x,k)=>`<button class="u" onclick="start(${k})"><b>${x.b} ${x.n}</b><small>보스: ${x.bn} · 최고 ${'⭐'.repeat(best(k))||'—'}</small></button>`).join('')+`<button class="u" onclick="start(-1)"><b>🌟 종합 보스</b><small>전 단원 12문제 · 최고 ${'⭐'.repeat(best('all'))||'—'}</small></button>`}
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(k){u=k<0?{n:'종합 보스',b:'👑',bn:'과학 대마왕',all:1}:U[k];u.k=k<0?'all':k;
qs=k<0?sh(U.flatMap(x=>x.q)).slice(0,12):sh(u.q);i=0;hp=0;hearts=3;sc=0;cb=0;hc=2;
$('menu').classList.add('hide');$('end').classList.add('hide');$('game').classList.remove('hide');$('boss').textContent=u.b;$('uname').textContent=u.n+' · '+u.bn;show()}
function show(){const q=qs[i];ans=q[2];const idx=sh([0,1,2,3]);lock=false;
$('hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(3-hearts);$('hp').style.width=100-hp/qs.length*100+'%';
$('info').textContent=`문제 ${i+1}/${qs.length}`;$('combo').textContent=cb>1?`🔥 ${cb}콤보`:'';$('score').textContent='점수 '+sc;$('hc').textContent=hc;$('hint').disabled=hc<1;
$('q').textContent=q[0];$('ex').classList.add('hide');$('nx').classList.add('hide');
$('opts').innerHTML=idx.map(k=>`<button class="o" data-k="${k}" onclick="pick(${k})">${'①②③④'[idx.indexOf(k)]} ${q[1][k]}</button>`).join('');
tl=T;clearInterval(tmr);tick();tmr=setInterval(()=>{tl-=.1;tick();if(tl<=0){clearInterval(tmr);pick(-1)}},100)}
function tick(){$('tm').style.width=Math.max(0,tl/T*100)+'%'}
function pick(k){if(lock)return;lock=true;clearInterval(tmr);const q=qs[i],ok=k===ans;
document.querySelectorAll('.o').forEach(b=>{const v=+b.dataset.k;if(v===ans)b.classList.add('ok');else if(v===k)b.classList.add('no')});
const b=$('boss');b.classList.remove('hit','atk');void b.offsetWidth;
if(ok){cb++;hp++;sc+=100+Math.round(tl*5)+cb*10;b.classList.add('hit')}else{cb=0;hearts--;b.classList.add('atk')}
$('hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(3-hearts);$('hp').style.width=100-hp/qs.length*100+'%';$('score').textContent='점수 '+sc;$('combo').textContent=cb>1?`🔥 ${cb}콤보`:'';
$('ex').innerHTML=(ok?'⚔️ 명중! ':k<0?'⏰ 시간 초과! ':'💥 반격당했다! ')+'정답: '+q[1][ans]+'<br>'+q[3];$('ex').classList.remove('hide');$('nx').classList.remove('hide');
$('nx').textContent=(hearts<=0||i>=qs.length-1)?'결과 보기 ▶':'다음 ▶ (Enter)'}
function hint(){if(lock||hc<1)return;hc--;$('hc').textContent=hc;$('hint').disabled=hc<1;
sh([...document.querySelectorAll('.o')].filter(b=>+b.dataset.k!==ans&&!b.classList.contains('gone'))).slice(0,2).forEach(b=>b.classList.add('gone'))}
function next(){if(!lock)return;if(hearts<=0||i>=qs.length-1)return fin();i++;show()}
function fin(){clearInterval(tmr);$('game').classList.add('hide');const win=hearts>0,st=!win?0:hearts>=3?3:hearts==2?2:1;
if(st>best(u.k)){try{localStorage.setItem('boss_'+u.k,st)}catch(e){}}
$('end').classList.remove('hide');$('end').innerHTML=`<div class="boss">${win?'🏆':'💀'}</div><h1>${win?u.bn+' 격파!':'패배… 다시 도전!'}</h1><div class="stars">${'⭐'.repeat(st)||'—'}</div><p style="font-size:22px">점수 ${sc} · 맞힌 문제 ${hp}/${qs.length}</p><button class="go" onclick="start(${u.k=='all'?-1:u.k})">🔁 다시 도전</button> <button class="go" onclick="menu()">📚 단원 선택</button>`}
document.addEventListener('keydown',e=>{if($('game').classList.contains('hide'))return;if('1234'.includes(e.key)&&!lock){const b=document.querySelectorAll('.o')[+e.key-1];if(b&&!b.classList.contains('gone'))b.click()}else if(e.key==='Enter')next()});
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
menu();
try{const _b=new URLSearchParams(location.search).get('b');if(_b!==null&&U[+_b])start(+_b)}catch(e){}

(function(){
