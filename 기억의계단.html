</style><script id="kjs-menu-lib">
/* 수업 게임 서랍 · 공통 메뉴 (학년 → 대단원 → 중단원·차시, 검색)
   KJSMenu.init({
     key, items:[{id, grade, unit, mid, title, sub, kind:'unit'|'mid'|'lesson', words:[], tags:[]}],
     extras:['내 세트'],            // 누르면 게임의 원래 선택 화면(내가 만든 목록)을 보여 줌
     mount: Element,                // 이 요소 앞에 메뉴를 넣음
     legacyCss: 'selector, ...',    // 메뉴가 켜져 있을 때 숨길 원래 선택 UI
     isVisible: () => bool,         // 선택 화면일 때만 메뉴 표시 (생략 가능)
     observe: Element,              // 화면이 바뀌는지 지켜볼 요소 (생략 가능)
     mode: 'start' | 'select',      // start: 누르면 바로 시작 / select: 고른 뒤 ▶ 시작
     onPick(item), onStart(item), startLabel
   })
*/
(function(){
  var ORDER = {
    "중1": ["과학과 인류의 지속가능한 삶","생물의 구성과 다양성","열","물질의 상태 변화","힘의 작용","기체의 성질","태양계"],
    "중2": ["물질의 특성","지권의 변화","빛과 파동","물질의 구성","식물과 에너지","동물과 에너지","전기와 자기","별과 우주"],
    "중3": ["화학 반응의 규칙과 에너지 변화","기권과 날씨","운동과 에너지","자극과 반응","생식과 유전","에너지 전환과 보존","별과 우주"]
  };
  var CSS = [
    ".km{background:#fff;color:#1b2b2a;border:1.5px solid #dfe3de;border-radius:16px;padding:0 14px 14px;margin:12px 0 16px;",
    " font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif;text-align:left;line-height:1.45}",
    ".km *{box-sizing:border-box}",
    ".km-nav{position:sticky;top:0;z-index:30;background:#fff;padding:12px 0 10px;border-bottom:1px solid #e6e9e4;border-radius:16px 16px 0 0}",
    ".km-search{display:flex;align-items:center;gap:8px;background:#f5f7f4;border:1.5px solid #dfe3de;border-radius:12px;padding:0 12px;margin-bottom:8px}",
    ".km-search:focus-within{border-color:#0CA678;background:#fff}",
    ".km-search input{flex:1;min-width:0;border:0!important;box-shadow:none!important;outline:0;background:transparent;font:inherit;font-size:16px;padding:10px 0;color:#1b2b2a}",
    ".km-search button{border:0;background:transparent;font-size:15px;cursor:pointer;color:#6b7672;padding:4px}",
    ".km-row{display:flex;align-items:flex-start;gap:10px;margin-top:6px}",
    ".km-row[hidden]{display:none!important}",
    ".km-lab{flex:none;width:58px;padding-top:7px;font-size:12.5px;font-weight:800;color:#6b7672}",
    ".km-chips{display:flex;gap:6px;flex-wrap:wrap}",
    ".km-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}",
    ".km-chip{flex:none;border:1px solid #dfe3de;background:#fff;color:#1b2b2a;border-radius:9px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}",
    ".km-chip.g[aria-pressed=true]{background:#1b2b2a;color:#fff;border-color:#1b2b2a}",
    ".km-chip.u[aria-pressed=true]{background:#0CA678;color:#fff;border-color:#0CA678}",
    ".km-chip.j{font-size:12.5px;padding:5px 10px;border-radius:999px}",
    ".km-chip.j.m{border-color:#7048E8;color:#5f3dc4}.km-chip.j.un{border-color:#0CA678;color:#0b7a5a}",
    ".km-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:9px 12px;background:#fff8e1;border:1px solid #f3d27a;border-radius:10px;font-size:14px}",
    ".km-sel[hidden]{display:none!important}",
    ".km-sel b{font-weight:800}",
    ".km-go{border:0;background:#1b2b2a;color:#fff;border-radius:9px;padding:8px 16px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-left:auto}",
    ".km-body{padding-top:6px}",
    ".km-uh{font-size:14px;font-weight:800;color:#6b7672;margin:14px 0 8px;display:flex;align-items:center;gap:8px}",
    ".km-uh::after{content:'';flex:1;height:1px;background:#e6e9e4}",
    ".km-mh{font-size:13.5px;font-weight:800;margin:14px 0 8px 2px;scroll-margin-top:200px}",
    ".km-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}",
    ".km-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e1e5e0;border-radius:14px;padding:13px 15px;cursor:pointer;font:inherit;color:#1b2b2a;scroll-margin-top:200px;transition:border-color .12s,box-shadow .12s}",
    ".km-card:hover{border-color:#0CA678;box-shadow:0 4px 14px rgba(0,0,0,.06)}",
    ".km-card[aria-pressed=true]{border-color:#e8900c;box-shadow:0 0 0 3px #ffe8b0}",
    ".km-card .k{font-size:12px;font-weight:800;color:#e8900c}",
    ".km-card .w{font-size:12px;font-weight:800;color:#6b7672}",
    ".km-card .t{display:block;font-size:17px;font-weight:800;margin:2px 0 3px;letter-spacing:-.01em}",
    ".km-card .s{display:block;font-size:13px;color:#6b7672}",
    ".km-card .h{display:block;font-size:12.5px;color:#6b7672;margin-top:5px}",
    ".km-card.unit{background:linear-gradient(135deg,#eef6f2,#fff);border-color:#0CA678;grid-column:1/-1}",
    ".km-card.unit .k{color:#0b7a5a}",
    ".km-card.mid{background:linear-gradient(135deg,#f3f0fb,#fff);border-color:#7048E8;grid-column:1/-1}",
    ".km-card.mid .k{color:#5f3dc4}",
    ".km-hit{background:#fff3bf;border-radius:3px}",
    ".km-empty{color:#6b7672;padding:16px 4px}",
    ".km-note{font-size:13px;color:#6b7672;margin:8px 2px}",
    "@media (max-width:640px){.km{padding:0 10px 12px}.km-row{flex-direction:column;gap:4px}.km-lab{width:auto;padding-top:0}.km-grid{grid-template-columns:1fr}.km-mh,.km-card{scroll-margin-top:260px}}",
    "@media print{.km{display:none!important}}"
  ].join("\n");

  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function nrm(s){ return String(s || "").toLowerCase().replace(/\s+/g, ""); }
  function mark(text, q){
    var t = String(text), i = t.toLowerCase().indexOf(q.toLowerCase());
    if (!q || i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<span class="km-hit">' + esc(t.slice(i, i + q.length)) + "</span>" + esc(t.slice(i + q.length));
  }

  function init(o){
    if (!document.getElementById("km-style")) { var st = el("style"); st.id = "km-style"; st.textContent = CSS; document.head.appendChild(st); }
    var items = o.items || [];
    var grades = ["중1","중2","중3"].filter(function(g){ return items.some(function(x){ return x.grade === g; }); });
    items.forEach(function(x){ if (["중1","중2","중3"].indexOf(x.grade) < 0 && grades.indexOf(x.grade) < 0) grades.push(x.grade); });
    (o.extras || []).forEach(function(g){ if (grades.indexOf(g) < 0) grades.push(g); });
    items.forEach(function(x){
      x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|"));
      x.th = nrm([x.unit, x.mid, x.title].join("|"));
    });
    var LS = "km-" + (o.key || location.pathname);
    var st = { g: grades[0], u: 0, q: "", sel: null };
    try { var sv = JSON.parse(localStorage.getItem(LS) || "{}"); if (grades.indexOf(sv.g) >= 0) st.g = sv.g; if (sv.u >= 0) st.u = sv.u; } catch(e) {}
    function save(){ try { localStorage.setItem(LS, JSON.stringify({ g: st.g, u: st.u })); } catch(e) {} }

    var root = el("section", "km"); root.setAttribute("aria-label", "학년 · 단원 · 차시 고르기");
    var nav = el("div", "km-nav");
    nav.innerHTML =
      '<label class="km-search"><span aria-hidden="true">🔍</span><input type="text" placeholder="단원·차시·낱말 검색 (예: 광합성, 보일, 뉴런)" autocomplete="off"><button type="button" hidden aria-label="검색어 지우기">✕</button></label>' +
      '<div class="km-row"><span class="km-lab">학년</span><div class="km-chips km-g"></div></div>' +
      '<div class="km-row km-urow"><span class="km-lab">대단원</span><div class="km-scroll km-u"></div></div>' +
      '<div class="km-row km-jrow"><span class="km-lab">바로가기</span><div class="km-scroll km-j"></div></div>' +
      '<div class="km-sel" hidden><span>선택: <b></b></span><button type="button" class="km-go"></button></div>';
    var body = el("div", "km-body");
    root.appendChild(nav); root.appendChild(body);
    var mountEl = typeof o.mount === "function" ? o.mount() : o.mount;
    mountEl.parentNode.insertBefore(root, mountEl);

    var qIn = nav.querySelector("input"), qX = nav.querySelector(".km-search button");
    var selBox = nav.querySelector(".km-sel"), goBtn = nav.querySelector(".km-go");
    goBtn.textContent = "▶ " + (o.startLabel || "시작하기");
    goBtn.onclick = function(){ if (st.sel && o.onStart) o.onStart(st.sel); };

    var legacyStyle = el("style"); document.head.appendChild(legacyStyle);
    function setLegacy(show){ var t = (!show && o.legacyCss) ? o.legacyCss + "{display:none!important}" : ""; if (legacyStyle.textContent !== t) legacyStyle.textContent = t; }

    function pick(x){
      if (o.mode === "select") {
        st.sel = x; if (o.onPick) o.onPick(x);
        selBox.hidden = false; selBox.querySelector("b").textContent = x.grade + " · " + (x.unit ? x.unit + " · " : "") + x.title;
        paintSel();
      } else if (o.onPick) o.onPick(x);
    }
    function paintSel(){
      body.querySelectorAll(".km-card").forEach(function(c){ c.setAttribute("aria-pressed", String(!!st.sel && c._item === st.sel)); });
    }
    function card(x, q){
      var c = el("button", "km-card " + (x.kind || "lesson"));
      c.type = "button"; c._item = x;
      var kind = x.kind === "unit" ? "🌳 대단원 종합" : x.kind === "mid" ? "🌿 중단원 종합" : (x.badge || "");
      c.innerHTML = (q ? '<span class="w">' + esc(x.grade + (x.unit ? " · " + x.unit : "")) + "</span> " : "") +
        (kind ? '<span class="k">' + esc(kind) + "</span>" : "") +
        '<span class="t">' + (q ? mark(x.title, q) : esc(x.title)) + "</span>" +
        (x.sub ? '<span class="s">' + esc(x.sub) + "</span>" : "");
      if (q) {
        var hits = (x.words || []).filter(function(w){ return String(w).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
        var u = []; hits.forEach(function(h){ if (u.indexOf(h) < 0) u.push(h); });
        if (u.length) c.appendChild(el("span", "h", "찾은 낱말: " + u.slice(0, 5).map(function(w){ return mark(String(w).slice(0, 40), q); }).join(", ") + (u.length > 5 ? " …" : "")));
      }
      c.onclick = function(){ pick(x); };
      return c;
    }
    function unitsOf(g){
      var list = [];
      items.forEach(function(x){ if (x.grade === g && x.unit && list.indexOf(x.unit) < 0) list.push(x.unit); });
      var ord = ORDER[g] || [];
      return list.sort(function(a, b){ var ia = ord.indexOf(a), ib = ord.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    }
    function render(){
      var gBox = nav.querySelector(".km-g"), uBox = nav.querySelector(".km-u"), jBox = nav.querySelector(".km-j");
      gBox.innerHTML = ""; uBox.innerHTML = ""; jBox.innerHTML = ""; body.innerHTML = "";
      grades.forEach(function(g){
        var b = el("button", "km-chip g"); b.type = "button"; b.textContent = g;
        b.setAttribute("aria-pressed", String(g === st.g && !st.q));
        b.onclick = function(){ st.g = g; st.u = 0; clearQ(); save(); render(); };
        gBox.appendChild(b);
      });
      var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
      setLegacy(isExtra && !st.q);
      var units = unitsOf(st.g);
      if (st.u >= units.length) st.u = 0;
      nav.querySelector(".km-urow").hidden = !units.length || !!st.q;
      units.forEach(function(u, i){
        var b = el("button", "km-chip u"); b.type = "button"; b.textContent = u;
        b.setAttribute("aria-pressed", String(i === st.u));
        b.onclick = function(){ st.u = i; save(); render(); };
        uBox.appendChild(b);
      });
      var cur = uBox.children[st.u]; if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: "nearest", block: "nearest" });

      if (st.q) {
        nav.querySelector(".km-jrow").hidden = true;
        var q = nrm(st.q);
        var res = items.filter(function(x){ return x.hay.indexOf(q) >= 0; }).sort(function(a, b){
          var ka = { unit: 0, mid: 1 }[a.kind]; var kb = { unit: 0, mid: 1 }[b.kind];
          return ((b.th.indexOf(q) >= 0) - (a.th.indexOf(q) >= 0)) || ((ka == null ? 2 : ka) - (kb == null ? 2 : kb));
        });
        body.appendChild(el("div", "km-uh", "‘" + esc(st.q) + "’ 검색 결과 " + res.length + "개"));
        if (!res.length) body.appendChild(el("p", "km-empty", "찾는 내용이 없습니다. 다른 낱말로 검색해 보세요."));
        var grid = el("div", "km-grid");
        res.slice(0, 60).forEach(function(x){ grid.appendChild(card(x, st.q.trim())); });
        body.appendChild(grid); paintSel(); return;
      }
      if (isExtra) {
        nav.querySelector(".km-jrow").hidden = true;
        if (o.onExtra) setTimeout(function(){ o.onExtra(st.g); }, 0);
        body.appendChild(el("p", "km-note", (o.extraNote || "아래에서 직접 만든 목록을 고르거나 새로 만들 수 있습니다.")));
        return;
      }
      var unit = units[st.u];
      var list = items.filter(function(x){ return x.grade === st.g && (unit ? x.unit === unit : !x.unit); });
      if (!unit) list = items.filter(function(x){ return x.grade === st.g; });
      if (unit) body.appendChild(el("div", "km-uh", esc(st.g + " · " + unit)));
      var groups = [], gmap = {};
      list.forEach(function(x){
        var key = x.kind === "unit" ? "__unit" : (x.mid || "");
        if (!gmap[key]) { gmap[key] = { name: key, list: [] }; groups.push(gmap[key]); }
        gmap[key].list.push(x);
      });
      var jumps = 0;
      groups.forEach(function(gr, gi){
        var sec = el("div", "km-sec");
        if (gr.name && gr.name !== "__unit") {
          var mh = el("div", "km-mh", esc(gr.name)); sec.appendChild(mh);
          var jb = el("button", "km-chip j m", "🌿 " + esc(gr.name)); jb.type = "button";
          jb.onclick = function(){ mh.scrollIntoView({ behavior: "smooth", block: "start" }); };
          jBox.appendChild(jb); jumps++;
        }
        var grid = el("div", "km-grid");
        gr.list.forEach(function(x){
          var c = card(x, "");
          grid.appendChild(c);
          if (x.kind === "unit") {
            var ub = el("button", "km-chip j un", "🌳 대단원"); ub.type = "button";
            ub.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "start" }); };
            jBox.insertBefore(ub, jBox.firstChild); jumps++;
          } else if (x.kind !== "mid") {
            var lb = el("button", "km-chip j", esc(x.short || x.title)); lb.type = "button";
            lb.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "center" }); };
            jBox.appendChild(lb); jumps++;
          }
        });
        sec.appendChild(grid); body.appendChild(sec);
      });
      nav.querySelector(".km-jrow").hidden = jumps < 2;
      paintSel();
    }
    function clearQ(){ st.q = ""; qIn.value = ""; qX.hidden = true; }
    qIn.addEventListener("input", function(){ st.q = qIn.value.trim(); qX.hidden = !st.q; render(); });
    qX.addEventListener("click", function(){ clearQ(); render(); qIn.focus(); });

    function sync(){
      if (typeof o.mount === "function") {
        var m = o.mount();
        if (m && m !== root && m.parentNode && root.nextSibling !== m) m.parentNode.insertBefore(root, m);
      }
      var vis = o.isVisible ? !!o.isVisible() : true;
      var want = vis ? "" : "none";
      if (root.style.display !== want) root.style.display = want;
      if (!vis) setLegacy(true); else {
        var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
        setLegacy(isExtra && !st.q);
      }
    }
    if (o.observe) {
      var busy = false;
      new MutationObserver(function(){
        if (busy) return; busy = true;
        requestAnimationFrame(function(){ try { sync(); } finally { busy = false; } });
      }).observe(o.observe, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
    }
    render(); sync();
    return { refresh: function(newItems){ if (newItems) { items = newItems; items.forEach(function(x){ x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|")); x.th = nrm([x.unit, x.mid, x.title].join("|")); }); } render(); sync(); },
             root: root, select: function(x){ st.sel = x; paintSel(); } };
  }
  window.KJSMenu = { init: init };
})();

</script>

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---------------- image handling ----------------
  function fileToCompressedDataUrl(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var maxDim = 220;
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#1e3138";
        ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = function(){ cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

    html += stairFilterHtml();
    var shownPre = PRESETS.filter(stairVisible);
    var shownCus = customTopics.filter(stairVisible);
    html += '<div class="topic-grid">';
    shownPre.forEach(function(t){ html += topicCardHtml(t); });
    shownCus.forEach(function(t){ html += topicCardHtml(t); });
    if (!shownPre.length && !shownCus.length) {
      html += '<p class="fnone">찾는 주제가 없습니다. 검색어를 지우거나 다른 학년을 눌러 보세요.</p>';
    }
    html += '<button class="add-card" id="addTopicBtn">' +
      '<span class="plus">+</span><span class="lbl">내 주제 만들기</span>' +
      '<span class="sub">단어 · 순서 · 이미지 직접 입력</span></button>';
    html += '</div>';

    html += '<div class="settings-row">' +
      '<div class="setting"><label>허용 오답</label><div class="seg" data-seg="miss">' +
        [3,5,7].map(function(n){ return '<button aria-pressed="' + (state.maxMiss===n) + '" data-val="' + n + '">' + n + '회</button>'; }).join("") +
      '</div></div>' +
      '<div class="setting"><label>외우는 시간</label><div class="seg" data-seg="memo">' +
        [8,12,18].map(function(n){ return '<button aria-pressed="' + (state.memoSec===n) + '" data-val="' + n + '">' + n + '초</button>'; }).join("") +
      '</div></div>' +
    '</div>';

    html += '<button class="start-btn" id="startBtn"' + (state.topicKey ? "" : " disabled") + '>시작하기</button>';

    stageEl.innerHTML = html;
    bindBanner();

    stageEl.querySelectorAll("[data-fg]").forEach(function(el){
      el.addEventListener("click", function(){ fGrade = el.getAttribute("data-fg"); fFocus = false; render(); });
    });
    var sb = document.getElementById("stairSearch");
    if (sb) {
      sb.addEventListener("input", function(e){ fQuery = e.target.value; fFocus = true; render(); });
      if (fFocus) { sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
    }

    stageEl.querySelectorAll(".topic-card").forEach(function(el){
      el.addEventListener("click", function(ev){
        if (ev.target.closest(".card-actions") || ev.target.closest(".confirm-del")) return;
        state.topicKey = el.getAttribute("data-topic");
        render();
      });
    });
    stageEl.querySelectorAll("[data-edit]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        openBuilder(getTopic(el.getAttribute("data-edit")));
      });
    });
    stageEl.querySelectorAll("[data-ask-del]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        state.confirmDeleteId = el.getAttribute("data-ask-del");
        render();
      });
    });
    stageEl.querySelectorAll("[data-del]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var id = el.getAttribute("data-del");
        customTopics = customTopics.filter(function(t){ return t.key !== id; });
        if (state.topicKey === id) state.topicKey = null;
        state.confirmDeleteId = null;
        persistCustom();
        render();
      });
    });
    stageEl.querySelectorAll("[data-cancel-del]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        state.confirmDeleteId = null;
        render();
      });
    });

    var addBtn = document.getElementById("addTopicBtn");
    if (addBtn) addBtn.addEventListener("click", function(){ openBuilder(null); });

    stageEl.querySelectorAll('[data-seg]').forEach(function(seg){
      var kind = seg.getAttribute("data-seg");
      seg.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){
          var v = parseInt(b.getAttribute("data-val"), 10);
          if (kind === "miss") state.maxMiss = v; else state.memoSec = v;
          render();
        });
      });
    });
    var startBtn = document.getElementById("startBtn");
    if (startBtn) startBtn.addEventListener("click", startMemorize);
  }

  function topicCardHtml(t){
    var sel = state.topicKey === t.key ? " selected" : "";
    var pathPreview = t.steps.map(function(s){ return s.label || "?"; }).join(" → ");
    var actions = "";
    if (!t.builtin){
      if (state.confirmDeleteId === t.key){
        actions = '<div class="confirm-del">' +
          '<span>이 주제를 삭제할까요?</span>' +
          '<div class="row">' +
            '<button class="btn primary" data-del="' + t.key + '" style="padding:7px 14px;font-size:12.5px;">삭제</button>' +
            '<button class="btn ghost" data-cancel-del="1" style="padding:7px 14px;font-size:12.5px;">취소</button>' +
          '</div></div>';
      } else {
        actions = '<div class="card-actions">' +
          '<button class="icon-btn" data-edit="' + t.key + '" title="수정">✎</button>' +
          '<button class="icon-btn" data-ask-del="' + t.key + '" title="삭제">🗑</button>' +
        '</div>';
      }
    }
    return '<button class="topic-card' + sel + '" style="--c:' + t.color + '" data-topic="' + t.key + '">' +
      '<span class="bar"></span>' +
      (t.builtin ? '' : '<span class="mine-tag">내 주제</span>') +
      '<span class="name">' + esc(t.name) + '</span>' +
      '<span class="en">' + esc(t.en || "CUSTOM") + ' · ' + t.steps.length + ' STEPS</span>' +
      '<span class="path">' + esc(pathPreview) + '</span>' +
      actions +
    '</button>';
  }

  // ---------------- builder ----------------
  function openBuilder(existing){
    if (existing){
      state.build = {
        editId: existing.key, name: existing.name, en: existing.en || "",
        color: existing.color,
        steps: existing.steps.map(function(s){ return {label:s.label, img:s.img}; })
      };
    } else {
      state.build = {
        editId: null, name: "", en: "", color: COLORS[Math.floor(Math.random()*COLORS.length)].v,
        steps: [0,1,2,3,4,5,6].map(function(){ return {label:"", img:null}; })
      };
    }
    state.phase = "build";
    render();
  }

  function renderBuild(){
    var b = state.build;
    var html = '<div class="build-title">' + (b.editId ? "주제 수정하기" : "내 주제 만들기") + '</div>';
    html += '<div class="build-sub">순서대로 외울 단어를 입력하세요. 이미지는 선택이에요.</div>';

    html += '<div class="field-row">' +
      '<div class="field"><label>주제 이름</label><input type="text" id="fName" value="' + esc(b.name) + '" placeholder="예: 별의 진화 단계" maxlength="40"></div>' +
      '<div class="field"><label>보조 라벨 (선택)</label><input type="text" id="fEn" value="' + esc(b.en) + '" placeholder="예: STAR LIFE CYCLE" maxlength="30"></div>' +
    '</div>';

    html += '<div class="field"><label>색상</label><div class="swatches">' +
      COLORS.map(function(c){
        return '<button class="swatch" style="--s:' + c.v + '" aria-pressed="' + (b.color===c.v) + '" data-color="' + c.v + '"></button>';
      }).join("") + '</div></div>';

    html += '<div class="field"><label>단계 (' + b.steps.length + '/' + MAX_STEPS + ')</label><div class="step-rows">';
    b.steps.forEach(function(s, i){
      html += '<div class="step-row">' +
        '<span class="num">' + (i+1) + '</span>' +
        '<div class="thumb-slot">' +
          (s.img ?
            ('<img src="' + s.img + '" alt=""><button class="thumb-remove" data-rmimg="' + i + '">×</button>')
            : ('<button class="thumb-btn" data-addimg="' + i + '" title="이미지 추가">＋</button>')
          ) +
          '<input type="file" accept="image/*" data-fileinput="' + i + '" style="display:none;">' +
        '</div>' +
        '<input type="text" data-steplabel="' + i + '" value="' + esc(s.label) + '" placeholder="단어를 입력하세요" maxlength="20">' +
        '<button class="row-del" data-rmstep="' + i + '"' + (b.steps.length<=MIN_STEPS?" disabled":"") + ' title="단계 삭제">✕</button>' +
      '</div>';
    });
    html += '</div>';
    html += '<div class="step-tools">' +
      '<button class="add-step-btn" id="addStepBtn"' + (b.steps.length>=MAX_STEPS?" disabled":"") + '>+ 단계 추가</button>' +
      '<span class="step-count">최소 ' + MIN_STEPS + '단계 · 최대 ' + MAX_STEPS + '단계</span>' +
    '</div>' +
    '<div class="hint">이미지는 이 브라우저에만 저장돼요(자동 축소). 다른 기기에서는 보이지 않아요.</div>' +
    '</div>';

    html += '<div class="build-actions">' +
      '<button class="btn primary" id="saveBuildBtn">저장하고 목록으로</button>' +
      '<button class="btn ghost" id="cancelBuildBtn">취소</button>' +
    '</div>';

    stageEl.innerHTML = html;

    document.getElementById("fName").addEventListener("input", function(e){ state.build.name = e.target.value; });
    document.getElementById("fEn").addEventListener("input", function(e){ state.build.en = e.target.value; });

    stageEl.querySelectorAll("[data-color]").forEach(function(el){
      el.addEventListener("click", function(){ state.build.color = el.getAttribute("data-color"); render(); });
    });
    stageEl.querySelectorAll("[data-steplabel]").forEach(function(el){
      el.addEventListener("input", function(){
        var i = parseInt(el.getAttribute("data-steplabel"), 10);
        state.build.steps[i].label = el.value;
      });
    });
    stageEl.querySelectorAll("[data-rmstep]").forEach(function(el){
      el.addEventListener("click", function(){
        var i = parseInt(el.getAttribute("data-rmstep"), 10);
        if (state.build.steps.length > MIN_STEPS){
          state.build.steps.splice(i, 1);
          render();
        }
      });
    });
    stageEl.querySelectorAll("[data-addimg]").forEach(function(el){
      el.addEventListener("click", function(){
        var i = el.getAttribute("data-addimg");
        var input = stageEl.querySelector('[data-fileinput="' + i + '"]');
        if (input) input.click();
      });
    });
    stageEl.querySelectorAll("[data-rmimg]").forEach(function(el){
      el.addEventListener("click", function(){
        var i = parseInt(el.getAttribute("data-rmimg"), 10);
        state.build.steps[i].img = null;
        render();
      });
    });
    stageEl.querySelectorAll("[data-fileinput]").forEach(function(el){
      el.addEventListener("change", function(){
        var i = parseInt(el.getAttribute("data-fileinput"), 10);
        var file = el.files && el.files[0];
        if (!file) return;
        fileToCompressedDataUrl(file, function(dataUrl){
          state.build.steps[i].img = dataUrl;
          render();
        });
      });
    });

    var addStepBtn = document.getElementById("addStepBtn");
    if (addStepBtn) addStepBtn.addEventListener("click", function(){
      if (state.build.steps.length < MAX_STEPS){
        state.build.steps.push({label:"", img:null});
        render();
      }
    });

    document.getElementById("cancelBuildBtn").addEventListener("click", function(){
      state.build = null;
      state.phase = "select";
      render();
    });
    document.getElementById("saveBuildBtn").addEventListener("click", saveBuild);
  }

  function saveBuild(){
    var b = state.build;
    var name = b.name.trim();
    var steps = b.steps.map(function(s){ return {label: s.label.trim(), img: s.img}; });
    var emptyIdx = -1;
    steps.forEach(function(s, i){ if (!s.label && emptyIdx === -1) emptyIdx = i; });

    if (!name){ state.banner = "주제 이름을 입력해 주세요."; render(); return; }
    if (emptyIdx !== -1){ state.banner = (emptyIdx+1) + "번 단계의 단어를 입력해 주세요."; render(); return; }
    if (steps.length < MIN_STEPS){ state.banner = "최소 " + MIN_STEPS + "단계 이상 입력해 주세요."; render(); return; }

    var key = b.editId || ("custom_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6));
    var topic = { key:key, name:name, en:b.en.trim(), color:b.color, builtin:false, steps:steps };

    if (b.editId){
      customTopics = customTopics.map(function(t){ return t.key === b.editId ? topic : t; });
    } else {
      customTopics.push(topic);
    }
    var ok = persistCustom();
    state.topicKey = key;
    state.build = null;
    state.phase = "select";
    state.banner = ok ? null : "이미지 저장 공간이 부족해 이번 주제는 브라우저를 새로고침하면 사라질 수 있어요.";
    render();
  }

  // ---------------- shared ----------------
  function specRow(){
    var t = getTopic(state.topicKey);
    return '<div class="spec-row">' +
      '<span class="tag"><span class="sys-dot" style="--c:' + t.color + '"></span>' + esc(t.name) + '</span>' +
      '<span class="tag">' + esc(t.en || "CUSTOM") + '</span>' +
      '<span class="tag">오답 허용 ' + state.maxMiss + '회</span>' +
      '<button class="change-topic" id="changeTopic">주제 바꾸기</button>' +
    '</div>';
  }
  function bindChangeTopic(){
    var b = document.getElementById("changeTopic");
    if (b) b.addEventListener("click", function(){
      clearMemoTimer();
      state.phase = "select";
      state.stepIndex = 0; state.mistakes = 0; state.result = null;
      render();
    });
  }

  function startMemorize(){
    state.phase = "memorize";
    state.timeLeft = state.memoSec;
    render();
    clearMemoTimer();
    memoTimerHandle = setInterval(function(){
      state.timeLeft -= 1;
      if (state.timeLeft <= 0){
        clearMemoTimer();
        startPlay();
      } else {
        updateTimerRing();
      }
    }, 1000);
  }
  function clearMemoTimer(){
    if (memoTimerHandle){ clearInterval(memoTimerHandle); memoTimerHandle = null; }
  }

  function renderMemorize(){
    var t = getTopic(state.topicKey);
    var r = 24, c = 2 * Math.PI * r;
    var html = specRow();
    html += '<div class="memorize-title">' + esc(t.name) + '을(를) 순서대로 외워보세요</div>';
    html += '<div class="memorize-sub">이 순서가 그대로 계단 문제로 나옵니다</div>';
    html += '<ol class="memo-list">' + t.steps.map(function(s,i){
      return '<li><span class="num">' + (i+1) + '</span>' +
        (s.img ? ('<img src="' + s.img + '" alt="">') : '') +
        '<span class="word">' + esc(s.label) + '</span></li>';
    }).join("") + '</ol>';
    html += '<div class="timer-ring"><svg viewBox="0 0 56 56">' +
      '<circle class="track" cx="28" cy="28" r="' + r + '"></circle>' +
      '<circle class="bar" id="ringBar" cx="28" cy="28" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="0"></circle>' +
      '<text x="28" y="33" text-anchor="middle" id="ringText">' + state.timeLeft + '</text>' +
    '</svg></div>';
    html += '<div class="skip-row"><button class="skip-btn" id="skipBtn">외우기 끝, 바로 시작</button></div>';
    stageEl.innerHTML = html;
    bindChangeTopic();
    var skip = document.getElementById("skipBtn");
    if (skip) skip.addEventListener("click", function(){ clearMemoTimer(); startPlay(); });
    updateTimerRing();
  }
  function updateTimerRing(){
    var bar = document.getElementById("ringBar");
    var txt = document.getElementById("ringText");
    if (!bar || !txt) return;
    var r = 24, c = 2 * Math.PI * r;
    var frac = Math.max(0, state.timeLeft / state.memoSec);
    bar.setAttribute("stroke-dashoffset", (c * (1 - frac)).toFixed(1));
    txt.textContent = Math.max(0, state.timeLeft);
  }

  function startPlay(){
    state.phase = "play";
    state.stepIndex = 0;
    state.mistakes = 0;
    state.lastMsg = "";
    state.lastMsgType = "";
    rollChoices();
    render();
  }

  function rollChoices(){
    var t = getTopic(state.topicKey);
    var correct = t.steps[state.stepIndex];
    var pool = t.steps.filter(function(s){ return s.label !== correct.label; });
    var distractors = shuffle(pool).slice(0, Math.min(3, pool.length));
    state.choiceOrder = shuffle([correct].concat(distractors));
  }

  function renderPlay(){
    var t = getTopic(state.topicKey);
    var html = specRow();

    html += '<div class="stair-outer"><div class="stair">';
    t.steps.forEach(function(s, i){
      var done = i < state.stepIndex;
      var current = i === state.stepIndex;
      var cls = "step" + (done ? " done" : "") + (current ? " current" : "");
      html += '<div class="' + cls + '" style="--i:' + i + '">' +
        '<div class="marker">🥾</div>' +
        '<div class="tread"><div class="idx">' + (i+1) + '</div>' +
          (done && s.img ? ('<img class="thumb" src="' + s.img + '" alt="">') : '') +
          '<div class="label">' + (done ? esc(s.label) : (current ? "?" : "")) + '</div>' +
        '</div></div>';
    });
    html += '</div></div>';

    html += '<div class="hud">' +
      '<div class="progress-text"><b>' + state.stepIndex + '</b> / ' + t.steps.length + ' 단계 완료</div>' +
      '<div class="lives">' + Array.from({length: state.maxMiss}).map(function(_, i){
        return '<span class="dot' + (i < state.mistakes ? " spent" : "") + '"></span>';
      }).join("") + '</div>' +
    '</div>';

    var promptCls = "prompt" + (state.lastMsgType === "right" ? " right-msg" : state.lastMsgType === "wrong" ? " wrong-msg" : "");
    var promptText = state.lastMsg || ('<b>' + (state.stepIndex + 1) + '번째</b> 순서는 무엇일까요?');
    html += '<div class="' + promptCls + '">' + promptText + '</div>';

    html += '<div class="choices">' + state.choiceOrder.map(function(s){
      return '<button class="choice" data-word="' + esc(s.label) + '">' +
        (s.img ? ('<img src="' + s.img + '" alt="">') : '') +
        '<span>' + esc(s.label) + '</span></button>';
    }).join("") + '</div>';

    stageEl.innerHTML = html;
    bindChangeTopic();

    stageEl.querySelectorAll(".choice").forEach(function(btn){
      btn.addEventListener("click", function(){ handleChoice(btn); });
    });
  }

  function handleChoice(btn){
    var t = getTopic(state.topicKey);
    var correct = t.steps[state.stepIndex].label;
    var word = btn.getAttribute("data-word");
    stageEl.querySelectorAll(".choice").forEach(function(b){ b.disabled = true; });

    if (word === correct){
      btn.classList.add("right"); window.KJS&&KJS.ok({toast:false});
      state.lastMsg = pick(RIGHT_MSGS);
      state.lastMsgType = "right";
      setTimeout(function(){
        state.stepIndex += 1;
        if (state.stepIndex >= t.steps.length){
          state.phase = "result";
          state.result = "success";
          render();
        } else {
          rollChoices();
          render();
          var justDone = stageEl.querySelectorAll(".step")[state.stepIndex - 1];
          if (justDone) justDone.classList.add("just-done");
        }
      }, 520);
    } else {
      btn.classList.add("wrong"); window.KJS&&KJS.no({toast:false});
      state.mistakes += 1;
      state.lastMsg = pick(WRONG_MSGS);
      state.lastMsgType = "wrong";
      if (state.mistakes >= state.maxMiss){
        setTimeout(function(){
          state.phase = "result";
          state.result = "fail";
          render();
        }, 650);
      } else {
        setTimeout(function(){ render(); }, 650);
      }
    }
  }

  function renderResult(){
    var t = getTopic(state.topicKey);
    var success = state.result === "success";
    var html = specRow();
    html += '<div class="result ' + (success ? "success" : "fail") + '">' +
      '<div class="badge">' + (success ? "🏁" : "🔍") + '</div>' +
      '<h2>' + (success ? esc(t.name) + " 완주!" : "이번엔 여기까지") + '</h2>' +
      '<p class="sub">' + (success ?
        ('오답 ' + state.mistakes + '회로 ' + t.steps.length + '단계를 모두 올랐어요.') :
        ('오답 ' + state.maxMiss + '회를 모두 사용했어요. 순서를 다시 확인해볼까요?')) +
      '</p>' +
      '<div class="answer-strip">' + t.steps.map(function(s, i){
        return (i>0 ? '<span class="arrow">→</span>' : '') +
          '<span class="chip">' + (s.img ? ('<img src="' + s.img + '" alt="">') : '') +
          '<span class="n">' + (i+1) + '</span>' + esc(s.label) + '</span>';
      }).join("") + '</div>' +
      '<div class="result-actions">' +
        '<button class="btn primary" id="retryBtn">같은 주제 다시</button>' +
        '<button class="btn ghost" id="otherBtn">다른 주제 선택</button>' +
      '</div>' +
    '</div>';
    stageEl.innerHTML = html;
    bindChangeTopic();
    document.getElementById("retryBtn").addEventListener("click", startMemorize);
    document.getElementById("otherBtn").addEventListener("click", function(){
      state.phase = "select";
      state.stepIndex = 0; state.mistakes = 0; state.result = null;
      render();
    });
  }

  // ---- resume across republish (best-effort) ----
  function saveSnapshot(){
    try{
      if (window.claude && window.claude.hot && window.claude.hot.snapshot){
        window.claude.hot.snapshot({
          phase: (state.phase === "build" ? "select" : state.phase),
          topicKey: state.topicKey, maxMiss: state.maxMiss,
          memoSec: state.memoSec, stepIndex: state.stepIndex, mistakes: state.mistakes
        });
      }
    }catch(e){}
  }

  function boot(saved){
    loadCustom();
    if (saved && saved.topicKey && getTopic(saved.topicKey)){
      state.topicKey = saved.topicKey;
      state.maxMiss = saved.maxMiss || 5;
      state.memoSec = saved.memoSec || 12;
    }
    state.phase = "select";
    render();
  }

  try{
    if (window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(function(){ boot(window.claude.hot.data || {}); });
    } else {
      boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
    }
  }catch(e){ boot({}); }
})();
</script>
