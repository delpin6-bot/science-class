<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별의 연주 시차 가상실험 (중3 · 별과 우주)</title>
<style>
:root{--bg:#0a0e17;--hd:#0a0e17;--pn:#101a2e;--ln:#26334d;--tx:#f1f5f9;--mut:#9fb2d0;--ok:#16a34a;--gold:#facc15;--hA:#f97316;--hB:#8b5cf6;--hC:#0d9488;--ink:#0f172a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,a{font-family:inherit}button{color:inherit;cursor:pointer;border:0;background:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
/* 초슬림 상단바 */
.hd{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--hd);border-bottom:2px solid var(--ln);flex-wrap:wrap;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#f97316,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.brand h1{font-size:max(22px,1.9vw);font-weight:900;white-space:nowrap}
.brand small{display:block;font-size:max(18px,1vw);color:var(--mut);font-weight:700}
.tabs{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{min-height:56px;padding:0 clamp(12px,1.6vw,26px);border-radius:14px;background:#101a2e;border:2px solid #26334d;font-weight:900;font-size:max(18px,1.45vw);white-space:nowrap}
.tab.on{background:#f59e0b;border-color:#fde68a;color:#1a1200}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tb{min-width:56px;min-height:56px;padding:0 14px;border-radius:14px;background:#101a2e;border:2px solid #26334d;font-weight:800;font-size:max(18px,1.1vw);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#f1f5f9;text-decoration:none;white-space:nowrap}
.tb:active{background:#2d4674}.tb.on{background:#16a34a;border-color:#bbf7d0}.tb.warn.on{background:#dc2626;border-color:#fecaca}
/* 메인 스테이지 */
#stage{position:relative;flex:1;min-height:0;background:#0a0e17;margin:6px 10px 0;border-radius:16px;overflow:hidden;border:2px solid var(--ln)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#note{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(10,14,23,.95);color:#fff;border:2px solid var(--gold);border-radius:14px;padding:10px 20px;font-weight:800;font-size:max(20px,1.4vw);opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%;text-align:center;z-index:3}
#note.on{opacity:1}
/* 안내 줄 + 컨트롤 바 */
.bottom{display:flex;gap:10px;align-items:stretch;padding:8px 10px 10px}
.msg{flex:1;min-width:0;padding:10px 18px;background:#0f1626;border:2px solid var(--ln);border-radius:16px;font-weight:800;font-size:max(20px,1.5vw);line-height:1.45;display:flex;align-items:center}
.msg b{color:var(--gold)}
.ctl{flex:0 0 min(52vw,860px);display:flex;gap:10px;padding:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;background:#0f1626;border:2px solid var(--ln);border-radius:16px}
.cb{min-height:56px;min-width:clamp(120px,10vw,200px);padding:0 16px;border-radius:14px;font-weight:900;font-size:max(18px,1.2vw);border:3px solid rgba(255,255,255,.55);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.cb:active{transform:scale(.97)}
.cb.hA{background:var(--hA)}.cb.hB{background:var(--hB)}.cb.hC{background:var(--hC)}
.cb.go{background:#dc2626}.cb.eat{background:#ea580c}.cb.run{background:#2563eb}
.cb:disabled{opacity:.45}
.cb.cold{background:#2563eb}.cb.hotb{background:#dc2626}.cb.mid{background:#475569}.cb.dia{background:#7f1d1d}.cb.dia.on{background:#dc2626;box-shadow:0 0 0 4px #fecaca}
.slw{display:flex;align-items:center;gap:10px;background:#101a2e;border:2px solid var(--ln);border-radius:14px;padding:0 14px;min-height:56px;font-weight:900;font-size:max(18px,1.1vw)}
.slw input{width:clamp(120px,12vw,220px);height:50px;accent-color:#f59e0b}.slw b{color:var(--gold);min-width:3.2em;text-align:right}
.cb.gr{background:#16a34a}.cb.bl{background:#2563eb}.cb.or{background:#ea580c}.cb.pu{background:#7c3aed}.cb.gy{background:#475569}.cb.on{box-shadow:0 0 0 4px #fde68a}
.ctl select,.ctl input[type=number]{min-height:56px;border-radius:14px;border:2px solid var(--ln);background:#101a2e;color:#fff;font:inherit;font-weight:800;font-size:max(18px,1.2vw);padding:0 12px}
.ctl input[type=number]{width:clamp(110px,10vw,160px);user-select:text;-webkit-user-select:text}
.fld{display:flex;align-items:center;gap:8px;font-weight:900;font-size:max(18px,1.1vw)}
.fld small{color:var(--mut);font-weight:700}
.fld.ok input{border-color:#22c55e;background:#052e16}.fld.no input{border-color:#ef4444;background:#450a0a}
.slw label{white-space:nowrap}
.ctl .hint{font-size:max(18px,1vw);color:var(--mut);font-weight:700}
/* 오버레이 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.on{display:flex}
.card{background:#0f1f33;border:2px solid var(--ln);border-radius:20px;width:100%;max-width:1100px;max-height:94vh;overflow:auto;padding:clamp(14px,2vw,26px)}
.card h2{font-size:clamp(20px,2.2vw,32px);color:#7dd3fc;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{min-width:54px;min-height:54px;border-radius:14px;background:#27406e;font-size:22px;font-weight:900;color:#fff}
.segs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.seg{min-height:50px;padding:0 18px;border-radius:12px;background:#1b2a47;border:2px solid #2d4674;font-weight:800;font-size:clamp(14px,1.4vw,20px)}
.seg.on{background:#f59e0b;color:#1a1200;border-color:#fde68a}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cc{background:#13233d;border:2px solid #2a4163;border-radius:16px;padding:14px 16px}
.cc h3{font-size:clamp(18px,1.9vw,28px);margin-bottom:6px}
.cc p{font-size:clamp(15px,1.5vw,22px);line-height:1.55;color:#dbe7f7;font-weight:600}
.cc p b{color:var(--gold)}
.cc .ex{margin-top:6px;font-size:max(18px,1vw);color:#93c5fd}
table.tt{width:100%;border-collapse:collapse;font-size:clamp(15px,1.5vw,22px)}
table.tt th,table.tt td{border:2px solid #2a4163;padding:8px 12px;text-align:left}
table.tt th{background:#16294a;color:#fde68a}
table.tt td:first-child{font-weight:900;color:#7dd3fc;white-space:nowrap}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(94vw,460px);background:#10203a;border-left:3px solid #f59e0b;transform:translateX(105%);transition:transform .25s;z-index:60;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dr.on{transform:none}
.dr h3{font-size:22px;color:#fde68a;display:flex;justify-content:space-between;align-items:center}
.dr section{background:#0e182c;border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dr h4{font-size:20px;color:#7dd3fc}
.chk{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 12px;background:#101a2e;border:1.5px solid var(--ln);border-radius:12px;font-weight:800;font-size:17px;cursor:pointer}
.chk input{width:26px;height:26px;accent-color:#f59e0b}
.dr input[type=range]{width:100%;height:44px;accent-color:#f59e0b}
.dr .row{display:flex;gap:8px;flex-wrap:wrap}
.dr small{color:var(--mut);font-size:18px;line-height:1.5}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}
#dim.on{opacity:1;pointer-events:auto}
.qrn{background:#2a2410;border:1px solid #f59e0b;color:#fde68a;border-radius:10px;padding:10px 14px;font-size:18px;line-height:1.5}
#qrUrl{width:100%;min-height:56px;border-radius:12px;border:2px solid var(--ln);background:#0b1726;color:#fff;font:inherit;font-size:18px;padding:0 12px;user-select:text;-webkit-user-select:text}
#qrCv{background:#fff;padding:12px;border-radius:12px;width:min(70vw,360px);height:auto;image-rendering:pixelated;align-self:center}
#qrMsg{color:#fca5a5;font-size:18px;font-weight:700;min-height:1.3em}
#qrCap{font-size:18px;color:var(--mut);word-break:break-all;text-align:center}
@media (max-width:1100px){.cg{grid-template-columns:1fr}.hd{gap:6px}.tools{width:100%;justify-content:center}.bottom{flex-direction:column}.ctl{flex:1 1 auto;justify-content:center}}
body.simple .hide-simple{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header class="hd">
    <div class="brand"><div class="ic">🔭</div><div><h1>별의 연주 시차 실험실</h1><small>중3 · 별과 우주 · 별까지의 거리</small></div></div>
    <nav class="tabs">
      <button class="tab on" data-m="1">👀 ① 시차란?</button>
      <button class="tab" data-m="2">🌍 ② 별의 연주 시차</button>
      <button class="tab" data-m="3">📏 ③ 별까지의 거리 구하기</button>
    </nav>
    <div class="tools">
      <button class="tb" id="bSimple" title="화면을 단순하게">👁 심플 보기</button>
      <button class="tb" id="bConcept">💡 개념</button>
      <button class="tb" id="bPause">⏸ 정지</button>
      <button class="tb" id="bReset">↺ 처음</button>
      <button class="tb" id="bQRtop" title="학생용 QR코드">📱 QR</button>
      <button class="tb" id="bFs" title="전체화면">⛶ 전체화면</button>
      <button class="tb" id="bSet" title="설정">⚙️</button>
    </div>
  </header>
  <div id="stage"><canvas id="cv"></canvas><div id="note"></div></div>
  <div class="bottom"><div class="msg" id="msg"></div><div class="ctl" id="ctl"></div></div>
</div>
<div id="dim"></div>
<aside class="dr" id="dr">
  <h3>⚙️ 설정 (교사용) <button class="x" id="drX">✕</button></h3>
  <section><h4>🐢 슬로모션 속도</h4><input type="range" id="slowK" min="0.1" max="0.5" step="0.05" value="0.25"><small>슬로모션 버튼을 켰을 때의 속도 배율 : <b id="slowV">×0.25</b></small></section>
  <section><h4>🐢 슬로모션</h4><button class="tb" id="bSlow">🐢 슬로모션 켜기/끄기</button></section>
  <section><h4>🌍 지구 공전 속도 (②·③번 화면)</h4><input type="range" id="orbK" min="0.5" max="3" step="0.25" value="1"><small>1년을 도는 시간 : <b id="orbV">약 24초</b></small></section>
  <section><h4>🔗 이동</h4>
    <div class="row"><a class="tb" href="./가상실험실_서랍.html">🔬 가상실험실</a><a class="tb" href="./통합_과학수업_서랍.html">📚 통합과학</a><a class="tb" href="./시작하기_수업게임서랍.html">🎮 수업게임</a></div></section>
  <section><h4>📱 학생 접속 QR</h4><button class="tb" id="bQR">📱 QR 코드 만들기</button></section>
</aside>
<div class="ov" id="ovC"><div class="card">
  <h2><span>💡 핵심 개념 한눈에 보기</span><button class="x" id="cX">✕</button></h2>
  <div class="segs"><button class="seg on" data-s="k">핵심 개념</button><button class="seg" data-s="f">교과서 그림 Ⅷ-2 읽기</button></div>
  <div id="cBody"></div>
</div></div>
<div class="ov" id="ovQ"><div class="card" style="max-width:520px">
  <h2><span>📱 학생 접속 QR코드</span><button class="x" id="qX">✕</button></h2>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="qrn">학생 휴대폰·태블릿 카메라로 찍으면 바로 열립니다. GitHub Pages 주소를 한 번 붙여 넣으면 이 컴퓨터에 저장돼요.</div>
    <input id="qrUrl" type="url" placeholder="https://계정명.github.io/저장소명/연주시차.html" autocomplete="off" spellcheck="false">
    <div id="qrMsg"></div><canvas id="qrCv" width="400" height="400"></canvas><div id="qrCap"></div>
  </div>
</div></div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

function rayHit(E,P,r){const dx=P.x-E.x,dy=P.y-E.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,fx=E.x-SUN.x,fy=E.y-SUN.y,B=fx*ux+fy*uy,C=fx*fx+fy*fy-r*r,t=-B+Math.sqrt(Math.max(0,B*B-C));return{x:E.x+ux*t,y:E.y+uy*t};}
function earthAt(m){const a=2*Math.PI*m/12;return{x:SUN.x+ORB*Math.cos(a),y:SUN.y-ORB*Math.sin(a)};}
function m2Reset(){M2.month=0;M2.play=true;M2.dS=2.6;M2.dT=12;M2.showT=false;M2.fixed=false;M2.ans=null;m2Sync();
  msg('지구가 태양 둘레를 돌면 <b>가까운 별 S</b>는 천구에서 <b>크게</b>, <b>더 먼 별 T</b>는 <b>조금만</b> 움직여 보여요. 그림에서 두 별의 <b>연주 시차</b>를 비교해 보세요!');}
function m2Sync(){const a=$('#sM'),s=$('#sS'),t=$('#sT');if(a){a.value=M2.month;$('#vM').textContent=M2.month.toFixed(1)+'개월';}
  if(s){s.value=Math.round(Math.log(M2.dS)/Math.log(60)*100);$('#vS').textContent=fmtD(M2.dS);}
  if(t){t.value=Math.round(Math.log(M2.dT)/Math.log(60)*100);$('#vT').textContent=fmtD(M2.dT);}
  const pb=$('#bPlay');if(pb){pb.textContent=M2.play?'⏸ 공전 멈춤':'▶ 공전 재생';pb.classList.toggle('on',M2.play);}
  const bt=$('#bShowT');if(bt){bt.textContent=M2.showT?'✔ 별 T의 연주 시차 표시 중':'✏️ 별 T의 연주 시차 표시';bt.classList.toggle('on',M2.showT);}
  const bf=$('#bFix');if(bf)bf.textContent=M2.fixed?'🔍 눈금 : 고정(1″=150칸)':'🔍 눈금 : 자동 확대';}
const fmtD=d=>(d<10?d.toFixed(1):Math.round(d))+' pc';
const fmtP=p=>p>=0.1?p.toFixed(2):p>=0.01?p.toFixed(3):p.toFixed(4);
function m2Update(sdt){if(M2.play){M2.month=(M2.month+sdt*S.orbK*0.5)%12;const sl=$('#sM');if(sl){sl.value=M2.month;$('#vM').textContent=M2.month.toFixed(1)+'개월';}}}
function arcBetween(P,Q1,Q2,r,col,w){const a1=Math.atan2(Q1.y-P.y,Q1.x-P.x),a2=Math.atan2(Q2.y-P.y,Q2.x-P.x);let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;g.strokeStyle=col;g.lineWidth=w||4;g.beginPath();g.arc(P.x,P.y,r,a1,a1+d,d<0);g.stroke();}
function drawSky(x,y,w,h,items,month,scale,opts){
  g.save();rr(x,y,w,h,14);g.clip();const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#0b1738');gr.addColorStop(1,'#1e3a8a');g.fillStyle=gr;g.fillRect(x,y,w,h);
  skyStars.forEach(s=>{g.fillStyle='rgba(255,255,255,'+(.35+.4*s.s/2)+')';g.beginPath();g.arc(x+s.x*w,y+s.y*h,s.s,0,7);g.fill();});
  // 눈금자
  const cy=y+h/2;g.strokeStyle='rgba(148,163,184,.35)';g.lineWidth=1;g.beginPath();g.moveTo(x,cy);g.lineTo(x+w,cy);g.stroke();
  items.forEach(it=>{
    const p=it.p,ph=2*Math.PI*month/12,dx=-p*Math.cos(ph)*scale,x0=it.cx;
    // 가능한 위치 범위(6개월 간격 두 끝)
    g.strokeStyle=it.col+'88';g.lineWidth=3;g.setLineDash([6,5]);g.beginPath();g.moveTo(x0-p*scale,cy);g.lineTo(x0+p*scale,cy);g.stroke();g.setLineDash([]);
    [[-1,it.n+'₁'],[1,it.n+'₂']].forEach(e=>{const ex=x0+e[0]*p*scale;g.strokeStyle=it.col;g.lineWidth=2.5;g.beginPath();g.arc(ex,cy,Math.max(5,it.r+4),0,7);g.stroke();tx(e[1],ex,cy-32,24,it.col,'center',900);});
    // 현재 위치
    g.shadowColor=it.col;g.shadowBlur=18;g.fillStyle=it.col;g.beginPath();g.arc(x0+dx,cy,it.r,0,7);g.fill();g.shadowBlur=0;
    g.fillStyle='#fff';g.beginPath();g.arc(x0+dx,cy,it.r*.4,0,7);g.fill();
    tx(it.label,x0,cy+62,24,it.col,'center',900);
    if(opts&&opts.showP){const bw=2*p*scale;g.strokeStyle='#fde68a';g.lineWidth=3;g.beginPath();g.moveTo(x0-p*scale,cy+88);g.lineTo(x0+p*scale,cy+88);g.moveTo(x0-p*scale,cy+80);g.lineTo(x0-p*scale,cy+96);g.moveTo(x0+p*scale,cy+80);g.lineTo(x0+p*scale,cy+96);g.stroke();tx('시차 2p = '+fmtP(2*p)+'″',x0,cy+114,22,'#fde68a','center',900);}
  });
  // 눈금 막대
  const bars=[.01,.02,.05,.1,.2,.5,1],tgt=w*.22/scale;let bs=bars[0];bars.forEach(v=>{if(v<=tgt)bs=v;});
  g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(x+20,y+30);g.lineTo(x+20+bs*scale,y+30);g.moveTo(x+20,y+22);g.lineTo(x+20,y+38);g.moveTo(x+20+bs*scale,y+22);g.lineTo(x+20+bs*scale,y+38);g.stroke();
  tx('눈금 '+bs+'″ (초)',x+20+bs*scale+12,y+30,22,'#fff','left',900);
  g.restore();g.strokeStyle='#475569';g.lineWidth=4;rr(x,y,w,h,14);g.stroke();
}

    tx('별 '+st.nm,st.P.x+(st.nm==='S'?-56:56),st.P.y,26,'#f1f5f9','center',900);});

/* ============================================================
   탭 3 : 연주 시차로 별까지의 거리 구하기 (d = 1/p)
   ============================================================ */
const STARS=[{nm:'프록시마 센타우리',p:0.77,col:'#fb7185'},{nm:'시리우스',p:0.38,col:'#bfdbfe'},{nm:'알타이르',p:0.19,col:'#e0f2fe'},{nm:'베가',p:0.13,col:'#c7d2fe'},{nm:'아크투루스',p:0.09,col:'#fdba74'},{nm:'북극성',p:0.0075,col:'#fef3c7'}];
const SC3=360,SKY={x:50,y:70,w:940,h:320,cx:520};
const M3={sel:1,month:0,target:0,r1:null,r2:null,dm:null,mystery:false,solved:false,tries:0,fl:{p:0,d:0,l:0}};
function m3Reset(keepSel){if(!keepSel)M3.sel=1;M3.month=0;M3.target=0;M3.r1=null;M3.r2=null;M3.dm=null;M3.solved=false;M3.tries=0;M3.fl={p:0,d:0,l:0};
  ['inP','inD','inL'].forEach(i=>{const e=$('#'+i);if(e){e.value='';e.parentElement.classList.remove('ok','no');}});
  const ss=$('#starSel');if(ss)ss.value=M3.sel;
  msg('① <b>첫 관측</b> → ② <b>6개월 뒤 관측</b>으로 별의 위치 변화를 재고, <b>p = 위치 변화 ÷ 2</b> → <b>d = 1 ÷ p</b> → <b>광년 = pc × 3.26</b> 순서로 계산해 보세요.');}
function curStar(){return STARS[M3.sel];}
const rdg=v=>Math.round(v*100)/100;
function t3Obs(which){
  if(S.paused){note('⏸ 정지 중이에요. 정지를 풀어 주세요.');return;}
  if(which===1){M3.target=0;M3.pend=1;}else{if(M3.r1==null){note('먼저 ① 첫 관측을 해 주세요.');return;}M3.target=6;M3.pend=2;}
}
function t3Update(sdt){
  const diff=M3.target-M3.month;
  if(Math.abs(diff)>0.001){M3.month+=Math.sign(diff)*Math.min(Math.abs(diff),sdt*S.orbK*4);}
  else if(M3.pend){
    const p=curStar().p,x=SKY.cx-p*SC3*Math.cos(2*Math.PI*M3.month/12),r0=SKY.cx-.9*SC3,r=rdg((x-r0)/SC3);
    if(M3.pend===1){M3.r1=r;M3.r2=null;M3.dm=null;msg('① 첫 관측 완료! 눈금 읽기 = <b>'+r.toFixed(2)+'″</b>. 이제 <b>② 6개월 뒤 관측</b>을 눌러 보세요.');}
    else{M3.r2=r;M3.dm=rdg(Math.abs(M3.r2-M3.r1));msg('② 관측 완료! 6개월간 위치 변화 Δ = <b>'+M3.dm.toFixed(2)+'″</b>. 연주 시차 p는 Δ의 절반이에요. 아래 칸에 계산해서 적어 보세요.');if(M3.dm<=0)msg('위치 변화가 눈금보다 작아 읽을 수 없어요. 다른 별로 해 보세요.');}
    M3.pend=0;
  }
}
function t3Check(){
  if(M3.dm==null||M3.dm<=0){note('먼저 ① ② 두 번 관측을 마쳐 주세요.');return;}
  const pA=M3.dm/2,dA=1/pA,lA=dA*3.26;
  const vp=parseFloat($('#inP').value),vd=parseFloat($('#inD').value),vl=parseFloat($('#inL').value);
  const near=(a,b,t)=>isFinite(a)&&Math.abs(a-b)<=Math.abs(b)*t;
  const okP=near(vp,pA,.04),okD=near(vd,dA,.06)||(isFinite(vp)&&vp>0&&near(vd,1/vp,.04)&&okP),okL=near(vl,lA,.07)||(isFinite(vd)&&near(vl,vd*3.26,.04)&&okD);
  M3.tries++;
  [['inP',okP],['inD',okD],['inL',okL]].forEach(a=>{const e=$('#'+a[0]).parentElement;e.classList.remove('ok','no');if($('#'+a[0]).value!=='')e.classList.add(a[1]?'ok':'no');});
  if(okP&&okD&&okL){M3.solved=true;const st=curStar();
    let extra='';if(st.p<0.01)extra=' 그런데 이 별은 연주 시차가 눈금(0.01″)보다 작아서 <b>오차가 커요</b>. 아주 먼 별은 연주 시차로 거리를 재기 어렵답니다.';
    msg('🎉 <b>정답!</b> '+(M3.mystery?'미지의 별의 정체는 <b>'+st.nm+'</b>! ':'')+'거리 d = 1 ÷ '+pA.toFixed(3)+' ≈ <b>'+dA.toFixed(dA<10?1:0)+' pc</b> ≈ <b>'+lA.toFixed(1)+' 광년</b>.'+extra);
  }else{
    const hint=!okP?'p = 위치 변화 Δ ÷ 2 로 구해 보세요.':!okD?'거리 d(pc) = 1 ÷ p(″) 이에요.':'1 pc ≈ 3.26 광년이에요. d × 3.26 을 계산해 보세요.';
    msg('다시 해 볼까요? 💡 <b>'+hint+'</b>');
  }
}

    $('#bFix').onclick=()=>{M2.fixed=!M2.fixed;m2Sync();note(M2.fixed?'고정 눈금 : 먼 별(T)의 위치 변화는 거의 보이지 않아요':'자동 확대 : 두 별의 위치 변화를 같은 배율로 키워서 보여 줘요');};

      const ok=who===far;msg(ok?'⭕ 정답! 더 멀리 있는 <b>별 '+far+'</b>의 연주 시차가 더 작아요. (거리가 멀수록 연주 시차는 작아져요)':'❌ 다시 생각해 봐요! 연주 시차는 별이 <b>가까울수록 커요</b>. 더 멀리 있는 별은 어느 쪽일까요?');note(ok?'정답입니다! 🎉':'아쉬워요. 그림의 각도를 다시 비교해 보세요.');};
    $('#qS').onclick=()=>q('S');$('#qT').onclick=()=>q('T');m2Sync();}
  if(m===3){m3Reset();

    $('#bMys').classList.toggle('on',M3.mystery);$('#starSel').disabled=M3.mystery;}

function resetCur(){if(S.mod===3){M3.mystery=false;}setMod(S.mod);note('↺ 처음 상태로 돌아왔어요.');}

function draw(){
  const w=cv.width/DPR,h=cv.height/DPR;
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,w,h);g.fillStyle='#0a0e17';g.fillRect(0,0,w,h);
  g.save();g.translate(OX,OY);g.scale(SC,SC);g.beginPath();g.rect(0,0,VW,VH);g.clip();
  if(S.mod===1)t1Draw();else if(S.mod===2)m2Draw();else m3Draw();

  g.restore();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const sdt=S.paused?0:dt*(S.slow?S.slowK:1);try{update(sdt);draw();}catch(e){console.error(e);}requestAnimationFrame(frame);}

$('#bFs').onclick=()=>{try{if(!isFsP())(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);else(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){note('이 브라우저는 전체화면을 지원하지 않아요. (F11 키)');}$('#bFs').blur();};
document.addEventListener('fullscreenchange',syncFsP);document.addEventListener('webkitfullscreenchange',syncFsP);
const dr=$('#dr'),dim=$('#dim');
function drawer(on){dr.classList.toggle('on',on);dim.classList.toggle('on',on);}
$('#bSet').onclick=()=>drawer(true);$('#drX').onclick=()=>drawer(false);dim.onclick=()=>drawer(false);
$('#slowK').oninput=e=>{S.slowK=+e.target.value;$('#slowV').textContent='×'+S.slowK.toFixed(2);};
$('#orbK').oninput=e=>{S.orbK=+e.target.value;$('#orbV').textContent='약 '+Math.round(24/S.orbK)+'초';};
/* 핵심 개념 모달 */
const CONCEPTS=`<div class="cg">
<div class="cc"><h3>👀 시차</h3><p>관측하는 <b>위치가 달라질 때</b> 같은 물체가 <b>보이는 방향(각도)</b>이 달라지는 정도예요. 물체가 <b>가까울수록 크고</b>, <b>멀수록 작아져요</b>.</p><div class="ex">예) 왼쪽 눈 · 오른쪽 눈으로 번갈아 손가락 보기</div></div>
<div class="cc"><h3>🌍 별의 연주 시차</h3><p>지구가 태양 둘레를 <b>공전</b>하기 때문에 <b>6개월 간격</b>으로 별을 보면 위치가 달라져 보여요. 이때 생기는 시차의 <b>절반</b>(별에서 지구–태양 거리를 본 각도)을 <b>연주 시차 p</b>라 해요. 단위는 초(″).</p></div>
<div class="cc"><h3>📏 연주 시차와 거리</h3><p>연주 시차 p(″)와 별까지의 거리 d(pc)는 <b>반비례</b>해요.<br><b>d(pc) = 1 ÷ p(″)</b><br>1 pc = 연주 시차가 1″인 별까지의 거리 ≈ <b>3.26 광년</b></p></div>
<div class="cc"><h3>🔭 연주 시차의 한계</h3><p>멀리 있는 별은 연주 시차가 <b>아주 작아서</b> 재기 어려워요. 그래서 연주 시차로는 <b>비교적 가까운 별</b>의 거리만 알아낼 수 있어요. 최근에는 인공위성으로 더 정밀하게 재고, 별의 <b>밝기</b>를 이용하는 방법도 써요.</p></div>
<div class="cc" style="grid-column:1/-1"><h3>🌐 연주 시차는 지구가 공전한다는 증거</h3><p>별의 위치가 6개월 간격으로 달라지는 것은 별이 움직이는 것이 아니라 <b>지구가 공전하기 때문</b>이에요.</p></div></div>`;
const FIG=`<div class="cc" style="margin-bottom:10px"><h3>그림 Ⅷ-2 별의 연주 시차 읽기</h3><p>• 지구가 <b>E₁ → E₂</b> (6개월)로 움직이면 별 S는 천구에서 <b>S₁ → S₂</b>, 별 T는 <b>T₁ → T₂</b>로 옮겨 보여요.<br>• <b>시차</b> = 두 지구 위치(E₁, E₂)에서 별을 바라본 방향의 차이 = 연주 시차의 <b>2배</b><br>• <b>연주 시차</b> = 태양–별과 지구–별이 이루는 각 (그림의 붉은 점선 기준)<br>• 지구로부터의 거리는 별 <b>T가 S보다 멀어서</b> 별 T의 연주 시차는 별 S의 연주 시차보다 <b>작아요</b>.</p></div>
<div class="cc"><h3>✏️ 스스로 해 보기</h3><p>②번 화면에서 <b>[별 T의 연주 시차 표시]</b>를 눌러 그림에 연주 시차를 표시하고, 거리 슬라이더로 T를 S보다 가깝게 옮기면 연주 시차의 크기 순서가 어떻게 바뀌는지 확인해 보세요.</p></div>`;
function cSeg(k){$$('.seg').forEach(b=>b.classList.toggle('on',b.dataset.s===k));$('#cBody').innerHTML=k==='k'?CONCEPTS:FIG;}
$$('.seg').forEach(b=>b.onclick=()=>cSeg(b.dataset.s));
$('#bConcept').onclick=()=>{cSeg('k');$('#ovC').classList.add('on');};
$('#cX').onclick=()=>$('#ovC').classList.remove('on');
$('#ovC').addEventListener('click',e=>{if(e.target.id==='ovC')$('#ovC').classList.remove('on');});
/* QR */
const QK='labQrBase';
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}},lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const normUrl=u=>{try{const x=new URL(u.trim());return/^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}};
function drawQR(){
  const raw=$('#qrUrl').value.trim(),c=$('#qrCv'),q=c.getContext('2d'),url=raw?normUrl(raw):'';$('#qrMsg').textContent='';
  if(!url){c.width=c.height=400;q.fillStyle='#fff';q.fillRect(0,0,400,400);q.fillStyle='#64748b';q.font='700 24px sans-serif';q.textAlign='center';q.fillText('주소를 입력하세요',200,205);$('#qrCap').textContent='';if(raw)$('#qrMsg').textContent='http:// 또는 https:// 로 시작하는 주소를 입력하세요.';return;}
  try{qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const m=qrcode(0,'M');m.addData(url,'Byte');m.make();const n=m.getModuleCount(),b=4,cell=Math.max(4,Math.floor(640/(n+b*2))),sz=cell*(n+b*2);
    c.width=c.height=sz;q.fillStyle='#fff';q.fillRect(0,0,sz,sz);q.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(m.isDark(r,k))q.fillRect((k+b)*cell,(r+b)*cell,cell,cell);
    let cap=url;try{cap=decodeURI(url);}catch(e){}$('#qrCap').textContent=cap;lsSet(QK,url);}catch(e){$('#qrMsg').textContent='주소가 너무 길어 QR을 만들 수 없습니다.';}
}
$('#bQR').onclick=()=>{drawer(false);const here=/^https?:$/.test(location.protocol)?location.href.split('#')[0].split('?')[0]:lsGet(QK);$('#qrUrl').value=here;$('#ovQ').classList.add('on');drawQR();if(!here)$('#qrMsg').textContent='GitHub Pages 주소를 붙여 넣으면 QR이 만들어집니다.';};
$('#qrUrl').addEventListener('input',drawQR);$('#qX').onclick=()=>$('#ovQ').classList.remove('on');
$('#ovQ').addEventListener('click',e=>{if(e.target.id==='ovQ')$('#ovQ').classList.remove('on');});
document.addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT')&&tg.type!=='checkbox'&&tg.type!=='range'){if(e.key==='Escape')$('#ovQ').classList.remove('on');if(e.key==='Enter'&&S.mod===3&&tg.type==='number')t3Check();return;}
  if(tg&&tg.type==='range'&&e.key.startsWith('Arrow'))return;
  if(e.key==='Escape'){$('#ovC').classList.remove('on');$('#ovQ').classList.remove('on');drawer(false);}
  else if(e.key===' '){e.preventDefault();$('#bPause').click();}
  else if(e.key==='r'||e.key==='R')resetCur();
  else if(e.key==='s'||e.key==='S')setSimple(!S.simple);
  else if(e.key==='f'||e.key==='F')$('#bFs').click();
  else if(e.key==='1'||e.key==='2'||e.key==='3')setMod(+e.key);
});
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('#stage'));
resize();setMod(1);
window.__p={S:S,T1:T1,M2:M2,M3:M3,STARS:STARS,update:update,draw:draw,setMod:setMod,t1Calc:t1Calc,earthAt:earthAt,t3Check:t3Check};
requestAnimationFrame(frame);
})();

</script>
<script id="qrbigScript">
/* 전자칠판용 QR 크게 보기 (오프라인 · 외부 의존 없음) */
(function(){
  var NAVY='#0a0e17';
  function openBig(cv){
    if(document.getElementById('qbOv'))return;
    var t=(document.getElementById('qrTitle')||{}).textContent||document.title||'학생 접속 QR코드';
    var cap=((document.getElementById('qrCap')||{}).textContent)||((document.getElementById('qrUrl')||{}).value)||'';
    var ov=document.createElement('div');ov.id='qbOv';
    ov.style.cssText='position:fixed;inset:0;z-index:2147483000;background:'+NAVY+';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:2vh 3vw;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;cursor:pointer;-webkit-user-select:none;user-select:none';
    var h=document.createElement('div');h.textContent='📱 휴대폰 카메라로 QR을 찍어 보세요';h.style.cssText='font-size:clamp(24px,3.4vh,44px);font-weight:900;text-align:center';
    var s=document.createElement('div');s.textContent=t;s.style.cssText='font-size:clamp(20px,2.6vh,34px);font-weight:800;color:#7dd3fc;text-align:center;max-width:90vw';
    var box=document.createElement('div');box.style.cssText='background:#fff;border-radius:28px;padding:clamp(18px,3vh,36px);box-shadow:0 0 0 6px #1e3a8a,0 20px 60px rgba(0,0,0,.6)';
    var im=new Image();im.src=cv.toDataURL('image/png');im.alt='QR 코드';im.style.cssText='display:block;width:min(64vh,76vw);height:min(64vh,76vw);image-rendering:pixelated';box.appendChild(im);
    var c=document.createElement('div');c.textContent=cap;c.style.cssText='font-size:clamp(18px,2.2vh,26px);color:#9fb2d0;font-weight:700;text-align:center;max-width:92vw;word-break:break-all';
    var k=document.createElement('div');k.textContent='화면을 누르거나 Esc 키를 누르면 닫혀요';k.style.cssText='font-size:clamp(18px,2.2vh,24px);color:#fde68a;font-weight:800';
    [h,s,box,c,k].forEach(function(e){if(e!==c||cap)ov.appendChild(e);});
    document.body.appendChild(ov);
    var usedFs=false;
    try{var r=ov.requestFullscreen||ov.webkitRequestFullscreen;if(r&&!document.fullscreenElement&&!document.webkitFullscreenElement){var p=r.call(ov);usedFs=true;if(p&&p.catch)p.catch(function(){});}}catch(e){}
    function close(){document.removeEventListener('keydown',key,true);if(ov.parentNode)ov.parentNode.removeChild(ov);
      try{if(usedFs&&(document.fullscreenElement||document.webkitFullscreenElement)){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}catch(e){}}
    function key(e){if(e.key==='Escape'){e.stopPropagation();close();}}
    ov.addEventListener('click',close);document.addEventListener('keydown',key,true);
    document.addEventListener('fullscreenchange',function f(){if(!document.fullscreenElement&&usedFs){document.removeEventListener('fullscreenchange',f);if(document.getElementById('qbOv'))close();}});
  }
  function attach(cv){
    if(cv.__qb)return;cv.__qb=1;
    var b=document.createElement('button');b.type='button';b.id=(cv.id||'qr')+'Big';b.textContent='⛶ 크게 보기 (전자칠판)';
    b.style.cssText='display:block;margin:10px auto 0;min-height:52px;padding:0 20px;border-radius:14px;border:2px solid #38bdf8;background:'+NAVY+';color:#fff;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;touch-action:manipulation';
    b.onclick=function(e){e.stopPropagation();openBig(cv);};
    cv.insertAdjacentElement('afterend',b);cv.style.cursor='zoom-in';cv.title='눌러서 크게 보기';
    cv.addEventListener('click',function(e){e.stopPropagation();openBig(cv);});
  }
  function scan(){var all=document.querySelectorAll('canvas');for(var i=0;i<all.length;i++){if(/qr/i.test(all[i].id))attach(all[i]);}}
  scan();document.addEventListener('DOMContentLoaded',scan);
  try{new MutationObserver(function(){scan();}).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
  window.__qrBig=openBig;
})();
</script>
