// ---------- 퀴즈 ----------
const QZ=[
 {q:'핵막이 없고 유전물질이 세포질에 퍼져 있는 생물은 어느 계일까?',o:['원핵생물계','원생생물계','균계','식물계'],a:0,e:'핵막이 없는 생물은 원핵생물계예요(대장균·젖산균 등).'},
 {q:'버섯과 곰팡이가 속한 계는?',o:['균계','식물계','원생생물계','동물계'],a:0,e:'버섯·곰팡이·효모는 균계예요. 광합성을 못 하고 세포벽이 있어요.'},
 {q:'버섯은 식물일까?',o:['아니다. 광합성을 못 하는 균계이다','그렇다. 땅에서 자라니까','그렇다. 세포벽이 있으니까','아니다. 동물계이다'],a:0,e:'땅에서 자란다고 식물은 아니에요. 버섯은 광합성을 못 하는 균계예요.'},
 {q:'다시마·미역은 광합성을 하는데 왜 식물계가 아닐까?',o:['뿌리·줄기·잎 같은 기관이 발달하지 않아서','바다에 살아서','크기가 작아서','세포벽이 없어서'],a:0,e:'다시마는 광합성을 하지만 기관이 발달하지 않아 원생생물계예요.'},
 {q:'효모는 단세포 생물인데 어느 계일까?',o:['균계','원핵생물계','원생생물계','동물계'],a:0,e:'효모는 핵막과 세포벽이 있고 광합성을 못 하는 단세포 균이에요.'},
 {q:'동물계의 특징으로 옳은 것은?',o:['세포벽이 없고 먹이를 섭취한다','세포벽이 있고 광합성을 한다','핵막이 없다','균사로 이루어져 있다'],a:0,e:'동물은 세포벽이 없고 먹이를 먹어 양분을 얻어요.'},
 {q:'남세균은 광합성을 하는데 어느 계일까?',o:['원핵생물계','식물계','원생생물계','균계'],a:0,e:'남세균은 광합성을 하지만 핵막이 없는 원핵생물이에요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{QSC=Math.max(QSC,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};
// ---------- 스마트폰 모드·초기화 ----------
function setPh(on,save){document.body.classList.toggle('ph',!!on);$('#btnPh').classList.toggle('on',!!on);$('#btnPh').textContent=on?'📱 스마트폰 모드 ON':'📱 스마트폰 모드';if(save){try{localStorage.setItem('kingdom-ph',on?'1':'0')}catch(e){}}}
$('#btnPh').onclick=()=>setPh(!document.body.classList.contains('ph'),true);
function resetAll(){initS();QSC=-1;render1();render2();render3();hud();setMode(1);$('#pop').classList.remove('on')}
$('#btnReset').onclick=resetAll;
const _sm=setMode;setMode=function(m){_sm(m);$('#pop').classList.remove('on');window.scrollTo(0,0)};
let phPref=null;try{phPref=localStorage.getItem('kingdom-ph')}catch(e){}
resetAll();setPh(phPref==='1'||(phPref===null&&innerWidth<=760),false);
</script></body></html>
