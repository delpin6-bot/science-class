<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script id="kjs-menu-lib">
/* 수업 게임 서랍 · 공통 메뉴 (학년 → 대단원 → 중단원·차시, 검색)
   KJSMenu.init({
     key, items:[{id, grade, unit, mid, title, sub, kind:'unit'|'mid'|'lesson', words:[], tags:[]}],
     extras:['내 세트'],            // 누르면 게임의 원래 선택 화면(내가 만든 목록)을 보여 줌
     mount: Element,                // 이 요소 앞에 메뉴를 넣음
     legacyCss: 'selector, ...',    // 메뉴가 켜져 있을 때 숨길 원래 선택 UI
     isVisible: () => bool,         // 선택 화면일 때만 메뉴 표시 (생략 가능)
     observe: Element,              // 화면이 바뀌는지 지켜볼 요소 (생략 가능)
     mode: 'start' | 'select',      // start: 누르면 바로 시작 / select: 고른 뒤 ▶ 시작
     onPick(item), onStart(item), startLabel
   })
*/
(function(){
  var ORDER = {
    "중1": ["과학과 인류의 지속가능한 삶","생물의 구성과 다양성","열","물질의 상태 변화","힘의 작용","기체의 성질","태양계"],
    "중2": ["물질의 특성","지권의 변화","빛과 파동","물질의 구성","식물과 에너지","동물과 에너지","전기와 자기","별과 우주"],
    "중3": ["화학 반응의 규칙과 에너지 변화","기권과 날씨","운동과 에너지","자극과 반응","생식과 유전","에너지 전환과 보존","별과 우주"]
  };
  var CSS = [
    ".km{background:#fff;color:#1b2b2a;border:1.5px solid #dfe3de;border-radius:16px;padding:0 14px 14px;margin:12px 0 16px;",
    " font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,sans-serif;text-align:left;line-height:1.45}",
    ".km *{box-sizing:border-box}",
    ".km-nav{position:sticky;top:0;z-index:30;background:#fff;padding:12px 0 10px;border-bottom:1px solid #e6e9e4;border-radius:16px 16px 0 0}",
    ".km-search{display:flex;align-items:center;gap:8px;background:#f5f7f4;border:1.5px solid #dfe3de;border-radius:12px;padding:0 12px;margin-bottom:8px}",
    ".km-search:focus-within{border-color:#0CA678;background:#fff}",
    ".km-search input{flex:1;min-width:0;border:0!important;box-shadow:none!important;outline:0;background:transparent;font:inherit;font-size:16px;padding:10px 0;color:#1b2b2a}",
    ".km-search button{border:0;background:transparent;font-size:15px;cursor:pointer;color:#6b7672;padding:4px}",
    ".km-row{display:flex;align-items:flex-start;gap:10px;margin-top:6px}",
    ".km-row[hidden]{display:none!important}",
    ".km-lab{flex:none;width:58px;padding-top:7px;font-size:12.5px;font-weight:800;color:#6b7672}",
    ".km-chips{display:flex;gap:6px;flex-wrap:wrap}",
    ".km-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}",
    ".km-chip{flex:none;border:1px solid #dfe3de;background:#fff;color:#1b2b2a;border-radius:9px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}",
    ".km-chip.g[aria-pressed=true]{background:#1b2b2a;color:#fff;border-color:#1b2b2a}",
    ".km-chip.u[aria-pressed=true]{background:#0CA678;color:#fff;border-color:#0CA678}",
    ".km-chip.j{font-size:12.5px;padding:5px 10px;border-radius:999px}",
    ".km-chip.j.m{border-color:#7048E8;color:#5f3dc4}.km-chip.j.un{border-color:#0CA678;color:#0b7a5a}",
    ".km-sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:9px 12px;background:#fff8e1;border:1px solid #f3d27a;border-radius:10px;font-size:14px}",
    ".km-sel[hidden]{display:none!important}",
    ".km-sel b{font-weight:800}",
    ".km-go{border:0;background:#1b2b2a;color:#fff;border-radius:9px;padding:8px 16px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-left:auto}",
    ".km-body{padding-top:6px}",
    ".km-uh{font-size:14px;font-weight:800;color:#6b7672;margin:14px 0 8px;display:flex;align-items:center;gap:8px}",
    ".km-uh::after{content:'';flex:1;height:1px;background:#e6e9e4}",
    ".km-mh{font-size:13.5px;font-weight:800;margin:14px 0 8px 2px;scroll-margin-top:200px}",
    ".km-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}",
    ".km-card{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e1e5e0;border-radius:14px;padding:13px 15px;cursor:pointer;font:inherit;color:#1b2b2a;scroll-margin-top:200px;transition:border-color .12s,box-shadow .12s}",
    ".km-card:hover{border-color:#0CA678;box-shadow:0 4px 14px rgba(0,0,0,.06)}",
    ".km-card[aria-pressed=true]{border-color:#e8900c;box-shadow:0 0 0 3px #ffe8b0}",
    ".km-card .k{font-size:12px;font-weight:800;color:#e8900c}",
    ".km-card .w{font-size:12px;font-weight:800;color:#6b7672}",
    ".km-card .t{display:block;font-size:17px;font-weight:800;margin:2px 0 3px;letter-spacing:-.01em}",
    ".km-card .s{display:block;font-size:13px;color:#6b7672}",
    ".km-card .h{display:block;font-size:12.5px;color:#6b7672;margin-top:5px}",
    ".km-card.unit{background:linear-gradient(135deg,#eef6f2,#fff);border-color:#0CA678;grid-column:1/-1}",
    ".km-card.unit .k{color:#0b7a5a}",
    ".km-card.mid{background:linear-gradient(135deg,#f3f0fb,#fff);border-color:#7048E8;grid-column:1/-1}",
    ".km-card.mid .k{color:#5f3dc4}",
    ".km-hit{background:#fff3bf;border-radius:3px}",
    ".km-empty{color:#6b7672;padding:16px 4px}",
    ".km-note{font-size:13px;color:#6b7672;margin:8px 2px}",
    "@media (max-width:640px){.km{padding:0 10px 12px}.km-row{flex-direction:column;gap:4px}.km-lab{width:auto;padding-top:0}.km-grid{grid-template-columns:1fr}.km-mh,.km-card{scroll-margin-top:260px}}",
    "@media print{.km{display:none!important}}"
  ].join("\n");

  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function nrm(s){ return String(s || "").toLowerCase().replace(/\s+/g, ""); }
  function mark(text, q){
    var t = String(text), i = t.toLowerCase().indexOf(q.toLowerCase());
    if (!q || i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<span class="km-hit">' + esc(t.slice(i, i + q.length)) + "</span>" + esc(t.slice(i + q.length));
  }

  function init(o){
    if (!document.getElementById("km-style")) { var st = el("style"); st.id = "km-style"; st.textContent = CSS; document.head.appendChild(st); }
    var items = o.items || [];
    var grades = ["중1","중2","중3"].filter(function(g){ return items.some(function(x){ return x.grade === g; }); });
    items.forEach(function(x){ if (["중1","중2","중3"].indexOf(x.grade) < 0 && grades.indexOf(x.grade) < 0) grades.push(x.grade); });
    (o.extras || []).forEach(function(g){ if (grades.indexOf(g) < 0) grades.push(g); });
    items.forEach(function(x){
      x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|"));
      x.th = nrm([x.unit, x.mid, x.title].join("|"));
    });
    var LS = "km-" + (o.key || location.pathname);
    var st = { g: grades[0], u: 0, q: "", sel: null };
    try { var sv = JSON.parse(localStorage.getItem(LS) || "{}"); if (grades.indexOf(sv.g) >= 0) st.g = sv.g; if (sv.u >= 0) st.u = sv.u; } catch(e) {}
    function save(){ try { localStorage.setItem(LS, JSON.stringify({ g: st.g, u: st.u })); } catch(e) {} }

    var root = el("section", "km"); root.setAttribute("aria-label", "학년 · 단원 · 차시 고르기");
    var nav = el("div", "km-nav");
    nav.innerHTML =
      '<label class="km-search"><span aria-hidden="true">🔍</span><input type="text" placeholder="단원·차시·낱말 검색 (예: 광합성, 보일, 뉴런)" autocomplete="off"><button type="button" hidden aria-label="검색어 지우기">✕</button></label>' +
      '<div class="km-row"><span class="km-lab">학년</span><div class="km-chips km-g"></div></div>' +
      '<div class="km-row km-urow"><span class="km-lab">대단원</span><div class="km-scroll km-u"></div></div>' +
      '<div class="km-row km-jrow"><span class="km-lab">바로가기</span><div class="km-scroll km-j"></div></div>' +
      '<div class="km-sel" hidden><span>선택: <b></b></span><button type="button" class="km-go"></button></div>';
    var body = el("div", "km-body");
    root.appendChild(nav); root.appendChild(body);
    var mountEl = typeof o.mount === "function" ? o.mount() : o.mount;
    mountEl.parentNode.insertBefore(root, mountEl);

    var qIn = nav.querySelector("input"), qX = nav.querySelector(".km-search button");
    var selBox = nav.querySelector(".km-sel"), goBtn = nav.querySelector(".km-go");
    goBtn.textContent = "▶ " + (o.startLabel || "시작하기");
    goBtn.onclick = function(){ if (st.sel && o.onStart) o.onStart(st.sel); };

    var legacyStyle = el("style"); document.head.appendChild(legacyStyle);
    function setLegacy(show){ var t = (!show && o.legacyCss) ? o.legacyCss + "{display:none!important}" : ""; if (legacyStyle.textContent !== t) legacyStyle.textContent = t; }

    function pick(x){
      if (o.mode === "select") {
        st.sel = x; if (o.onPick) o.onPick(x);
        selBox.hidden = false; selBox.querySelector("b").textContent = x.grade + " · " + (x.unit ? x.unit + " · " : "") + x.title;
        paintSel();
      } else if (o.onPick) o.onPick(x);
    }
    function paintSel(){
      body.querySelectorAll(".km-card").forEach(function(c){ c.setAttribute("aria-pressed", String(!!st.sel && c._item === st.sel)); });
    }
    function card(x, q){
      var c = el("button", "km-card " + (x.kind || "lesson"));
      c.type = "button"; c._item = x;
      var kind = x.kind === "unit" ? "🌳 대단원 종합" : x.kind === "mid" ? "🌿 중단원 종합" : (x.badge || "");
      c.innerHTML = (q ? '<span class="w">' + esc(x.grade + (x.unit ? " · " + x.unit : "")) + "</span> " : "") +
        (kind ? '<span class="k">' + esc(kind) + "</span>" : "") +
        '<span class="t">' + (q ? mark(x.title, q) : esc(x.title)) + "</span>" +
        (x.sub ? '<span class="s">' + esc(x.sub) + "</span>" : "");
      if (q) {
        var hits = (x.words || []).filter(function(w){ return String(w).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
        var u = []; hits.forEach(function(h){ if (u.indexOf(h) < 0) u.push(h); });
        if (u.length) c.appendChild(el("span", "h", "찾은 낱말: " + u.slice(0, 5).map(function(w){ return mark(String(w).slice(0, 40), q); }).join(", ") + (u.length > 5 ? " …" : "")));
      }
      c.onclick = function(){ pick(x); };
      return c;
    }
    function unitsOf(g){
      var list = [];
      items.forEach(function(x){ if (x.grade === g && x.unit && list.indexOf(x.unit) < 0) list.push(x.unit); });
      var ord = ORDER[g] || [];
      return list.sort(function(a, b){ var ia = ord.indexOf(a), ib = ord.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    }
    function render(){
      var gBox = nav.querySelector(".km-g"), uBox = nav.querySelector(".km-u"), jBox = nav.querySelector(".km-j");
      gBox.innerHTML = ""; uBox.innerHTML = ""; jBox.innerHTML = ""; body.innerHTML = "";
      grades.forEach(function(g){
        var b = el("button", "km-chip g"); b.type = "button"; b.textContent = g;
        b.setAttribute("aria-pressed", String(g === st.g && !st.q));
        b.onclick = function(){ st.g = g; st.u = 0; clearQ(); save(); render(); };
        gBox.appendChild(b);
      });
      var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
      setLegacy(isExtra && !st.q);
      var units = unitsOf(st.g);
      if (st.u >= units.length) st.u = 0;
      nav.querySelector(".km-urow").hidden = !units.length || !!st.q;
      units.forEach(function(u, i){
        var b = el("button", "km-chip u"); b.type = "button"; b.textContent = u;
        b.setAttribute("aria-pressed", String(i === st.u));
        b.onclick = function(){ st.u = i; save(); render(); };
        uBox.appendChild(b);
      });
      var cur = uBox.children[st.u]; if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: "nearest", block: "nearest" });

      if (st.q) {
        nav.querySelector(".km-jrow").hidden = true;
        var q = nrm(st.q);
        var res = items.filter(function(x){ return x.hay.indexOf(q) >= 0; }).sort(function(a, b){
          var ka = { unit: 0, mid: 1 }[a.kind]; var kb = { unit: 0, mid: 1 }[b.kind];
          return ((b.th.indexOf(q) >= 0) - (a.th.indexOf(q) >= 0)) || ((ka == null ? 2 : ka) - (kb == null ? 2 : kb));
        });
        body.appendChild(el("div", "km-uh", "‘" + esc(st.q) + "’ 검색 결과 " + res.length + "개"));
        if (!res.length) body.appendChild(el("p", "km-empty", "찾는 내용이 없습니다. 다른 낱말로 검색해 보세요."));
        var grid = el("div", "km-grid");
        res.slice(0, 60).forEach(function(x){ grid.appendChild(card(x, st.q.trim())); });
        body.appendChild(grid); paintSel(); return;
      }
      if (isExtra) {
        nav.querySelector(".km-jrow").hidden = true;
        if (o.onExtra) setTimeout(function(){ o.onExtra(st.g); }, 0);
        body.appendChild(el("p", "km-note", (o.extraNote || "아래에서 직접 만든 목록을 고르거나 새로 만들 수 있습니다.")));
        return;
      }
      var unit = units[st.u];
      var list = items.filter(function(x){ return x.grade === st.g && (unit ? x.unit === unit : !x.unit); });
      if (!unit) list = items.filter(function(x){ return x.grade === st.g; });
      if (unit) body.appendChild(el("div", "km-uh", esc(st.g + " · " + unit)));
      var groups = [], gmap = {};
      list.forEach(function(x){
        var key = x.kind === "unit" ? "__unit" : (x.mid || "");
        if (!gmap[key]) { gmap[key] = { name: key, list: [] }; groups.push(gmap[key]); }
        gmap[key].list.push(x);
      });
      var jumps = 0;
      groups.forEach(function(gr, gi){
        var sec = el("div", "km-sec");
        if (gr.name && gr.name !== "__unit") {
          var mh = el("div", "km-mh", esc(gr.name)); sec.appendChild(mh);
          var jb = el("button", "km-chip j m", "🌿 " + esc(gr.name)); jb.type = "button";
          jb.onclick = function(){ mh.scrollIntoView({ behavior: "smooth", block: "start" }); };
          jBox.appendChild(jb); jumps++;
        }
        var grid = el("div", "km-grid");
        gr.list.forEach(function(x){
          var c = card(x, "");
          grid.appendChild(c);
          if (x.kind === "unit") {
            var ub = el("button", "km-chip j un", "🌳 대단원"); ub.type = "button";
            ub.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "start" }); };
            jBox.insertBefore(ub, jBox.firstChild); jumps++;
          } else if (x.kind !== "mid") {
            var lb = el("button", "km-chip j", esc(x.short || x.title)); lb.type = "button";
            lb.onclick = function(){ c.scrollIntoView({ behavior: "smooth", block: "center" }); };
            jBox.appendChild(lb); jumps++;
          }
        });
        sec.appendChild(grid); body.appendChild(sec);
      });
      nav.querySelector(".km-jrow").hidden = jumps < 2;
      paintSel();
    }
    function clearQ(){ st.q = ""; qIn.value = ""; qX.hidden = true; }
    qIn.addEventListener("input", function(){ st.q = qIn.value.trim(); qX.hidden = !st.q; render(); });
    qX.addEventListener("click", function(){ clearQ(); render(); qIn.focus(); });

    function sync(){
      if (typeof o.mount === "function") {
        var m = o.mount();
        if (m && m !== root && m.parentNode && root.nextSibling !== m) m.parentNode.insertBefore(root, m);
      }
      var vis = o.isVisible ? !!o.isVisible() : true;
      var want = vis ? "" : "none";
      if (root.style.display !== want) root.style.display = want;
      if (!vis) setLegacy(true); else {
        var isExtra = (o.extras || []).indexOf(st.g) >= 0 && !items.some(function(x){ return x.grade === st.g; });
        setLegacy(isExtra && !st.q);
      }
    }
    if (o.observe) {
      var busy = false;
      new MutationObserver(function(){
        if (busy) return; busy = true;
        requestAnimationFrame(function(){ try { sync(); } finally { busy = false; } });
      }).observe(o.observe, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
    }
    render(); sync();
    return { refresh: function(newItems){ if (newItems) { items = newItems; items.forEach(function(x){ x.hay = nrm([x.grade, x.unit, x.mid, x.title, x.sub].concat(x.words || []).join("|")); x.th = nrm([x.unit, x.mid, x.title].join("|")); }); } render(); sync(); },
             root: root, select: function(x){ st.sel = x; paintSel(); } };
  }
  window.KJSMenu = { init: init };
})();

</script>

  display: flex !important;

  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

  // ---------------- custom bank storage ----------------
  var customBanks = [];
  function loadCustom(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      customBanks = raw ? JSON.parse(raw) : [];
    }catch(e){ customBanks = []; }
  }
  function persistCustom(){
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(customBanks)); return true; }
    catch(e){ return false; }
  }
  function allBanks(){ return PRESET_BANKS.concat(customBanks); }
  function getBank(key){
    var found=null;
    allBanks().forEach(function(b){ if (b.key===key) found=b; });
    return found;
  }

  // ---------------- state ----------------
  var state = {
    grade:GRADES[0],
    phase:"setup",         // setup | build | ready | play | roundEnd | final
    bankKey:"animal_energy",
    roundSeconds:60,
    passLimit:null,        // null = unlimited, else number
    teams:[{id:"t1",name:"1모둠",score:0,color:"var(--sys-digest)"},
           {id:"t2",name:"2모둠",score:0,color:"var(--sys-circu)"}],
    currentTeam:0,
    banner:null,
    confirmDeleteKey:null,
    build:null,             // {editKey,name,color,text}
    round:null              // {pool,used,current,timeLeft,timerHandle,correct,passed,passesLeft}
  };

  var stageEl = document.getElementById("stage");
  var teamColorSeq = 0;

  function render(){
    if (state.phase==="setup") renderSetup();
    else if (state.phase==="build") renderBuild();
    else if (state.phase==="ready") renderReady();
    else if (state.phase==="play") renderPlay();
    else if (state.phase==="roundEnd") renderRoundEnd();
    else if (state.phase==="final") renderFinal();
    saveSnapshot();
  }

  function bannerHtml(){
    if (!state.banner) return "";
    return '<div class="banner"><span>'+esc(state.banner)+'</span><button id="bannerClose">×</button></div>';
  }
  function bindBanner(){
    var b=document.getElementById("bannerClose");
    if (b) b.addEventListener("click", function(){ state.banner=null; render(); });
  }

  // ================= SETUP =================
  function renderSetup(){
    var html = bannerHtml();

    html += '<h2 class="section-title">단어 목록 고르기</h2><p class="section-sub">학년을 고른 뒤 오늘 수업할 차시를 누르세요.</p>';
    var lvl = (state.grade === "내 단어장") ? "내 단어장" : state.grade.slice(0, 2);
    html += '<div class="grade-tabs">' + ["중1","중2","중3","내 단어장"].map(function(L){
      return '<button class="level-tab" aria-pressed="'+(lvl===L)+'" data-level="'+L+'">'+L+'</button>';
    }).join("") + '</div>';
    if (lvl !== "내 단어장") {
      html += '<div class="grade-tabs unit-tabs">' + GRADES.filter(function(g){ return g.indexOf(lvl + " ") === 0; }).map(function(g){
        return '<button class="grade-tab" aria-pressed="'+(state.grade===g)+'" data-grade="'+g+'">'+esc(g.slice(lvl.length + 1))+'</button>';
      }).join("") + '</div>';
    }
    html += '<div class="bank-grid">';
    if (state.grade === "내 단어장"){
      customBanks.forEach(function(b){ html += bankCardHtml(b); });
      if (!customBanks.length) html += '<p class="section-sub" style="grid-column:1/-1">아직 만든 단어장이 없어요. 아래에서 새로 만들어 보세요.</p>';
    } else {
      PRESET_BANKS.forEach(function(b){ if (b.grade===state.grade) html += bankCardHtml(b); });
    }
    html += '<button class="add-card" id="addBankBtn"><span class="plus">+</span><span class="lbl">내 단어장 만들기</span><span class="sub">단어를 직접 입력</span></button>';
    html += '</div>';

    html += '<div class="settings-row">' +
      '<div class="setting"><label>라운드 시간</label><div class="seg" data-seg="time">' +
        [30,60,90].map(function(n){ return '<button aria-pressed="'+(state.roundSeconds===n)+'" data-val="'+n+'">'+n+'초</button>'; }).join("") +
      '</div></div>' +
      '<div class="setting"><label>패스 허용</label><div class="seg" data-seg="pass">' +
        [{v:"unlimited",l:"무제한"},{v:"3",l:"3회"},{v:"1",l:"1회"}].map(function(o){
          var pressed = (o.v==="unlimited" ? state.passLimit===null : state.passLimit===parseInt(o.v,10));
          return '<button aria-pressed="'+pressed+'" data-val="'+o.v+'">'+o.l+'</button>';
        }).join("") +
      '</div></div>' +
    '</div>';

    html += '<h2 class="section-title">팀 구성</h2><p class="section-sub">최소 2팀, 최대 6팀까지 만들 수 있어요.</p>';
    html += '<div class="team-list">' + state.teams.map(function(t,i){
      return '<div class="team-row"><span class="dot" style="--c:'+t.color+'"></span>' +
        '<input type="text" maxlength="12" value="'+esc(t.name)+'" data-teamname="'+i+'">' +
        '<span class="score">'+t.score+'점</span>' +
        '<button class="row-del" data-teamdel="'+i+'"'+(state.teams.length<=2?" disabled":"")+' title="팀 삭제">✕</button>' +
      '</div>';
    }).join("") + '</div>';
    html += '<button class="add-team-btn" id="addTeamBtn"'+(state.teams.length>=6?" disabled":"")+'>+ 팀 추가</button>';

    html += '<button class="start-btn" id="startBtn" style="margin-top:22px;">게임 시작</button>';

    stageEl.innerHTML = html;
    bindBanner();

    stageEl.querySelectorAll(".level-tab").forEach(function(el){
      el.addEventListener("click", function(){
        var L = el.getAttribute("data-level");
        state.grade = (L === "내 단어장") ? L : (GRADES.filter(function(g){ return g.indexOf(L + " ") === 0; })[0] || state.grade);
        var list = (state.grade==="내 단어장") ? customBanks
                 : PRESET_BANKS.filter(function(b){ return b.grade===state.grade; });
        if (list.length) state.bankKey = list[0].key;
        render();
      });
    });
    stageEl.querySelectorAll(".grade-tab").forEach(function(el){
      el.addEventListener("click", function(){
        state.grade = el.getAttribute("data-grade");
        var list = (state.grade==="내 단어장") ? customBanks
                 : PRESET_BANKS.filter(function(b){ return b.grade===state.grade; });
        if (list.length && !list.some(function(b){ return b.key===state.bankKey; })) state.bankKey = list[0].key;
        render();
      });
    });
    stageEl.querySelectorAll(".bank-card").forEach(function(el){
      el.addEventListener("click", function(ev){
        if (ev.target.closest(".card-actions")||ev.target.closest(".confirm-del")) return;
        state.bankKey = el.getAttribute("data-bank");
        render();
      });
    });
    stageEl.querySelectorAll("[data-edit]").forEach(function(el){
      el.addEventListener("click", function(ev){ ev.stopPropagation(); openBuilder(getBank(el.getAttribute("data-edit"))); });
    });
    stageEl.querySelectorAll("[data-ask-del]").forEach(function(el){
      el.addEventListener("click", function(ev){ ev.stopPropagation(); state.confirmDeleteKey = el.getAttribute("data-ask-del"); render(); });
    });
    stageEl.querySelectorAll("[data-del]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var k = el.getAttribute("data-del");
        customBanks = customBanks.filter(function(b){ return b.key!==k; });
        if (state.bankKey===k) state.bankKey = "animal_energy";
        state.confirmDeleteKey = null;
        persistCustom();
        render();
      });
    });
    stageEl.querySelectorAll("[data-cancel-del]").forEach(function(el){
      el.addEventListener("click", function(ev){ ev.stopPropagation(); state.confirmDeleteKey=null; render(); });
    });
    var addBankBtn = document.getElementById("addBankBtn");
    if (addBankBtn) addBankBtn.addEventListener("click", function(){ openBuilder(null); });

    stageEl.querySelectorAll('[data-seg]').forEach(function(seg){
      var kind = seg.getAttribute("data-seg");
      seg.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){
          var v = b.getAttribute("data-val");
          if (kind==="time") state.roundSeconds = parseInt(v,10);
          else state.passLimit = (v==="unlimited") ? null : parseInt(v,10);
          render();
        });
      });
    });

    stageEl.querySelectorAll("[data-teamname]").forEach(function(el){
      el.addEventListener("input", function(){
        state.teams[parseInt(el.getAttribute("data-teamname"),10)].name = el.value;
      });
    });
    stageEl.querySelectorAll("[data-teamdel]").forEach(function(el){
      el.addEventListener("click", function(){
        if (state.teams.length>2){
          state.teams.splice(parseInt(el.getAttribute("data-teamdel"),10),1);
          render();
        }
      });
    });
    var addTeamBtn = document.getElementById("addTeamBtn");
    if (addTeamBtn) addTeamBtn.addEventListener("click", function(){
      if (state.teams.length<6){
        teamColorSeq++;
        var c = COLORS[(state.teams.length+teamColorSeq)%COLORS.length].v;
        state.teams.push({id:"t"+Date.now(), name:(state.teams.length+1)+"모둠", score:0, color:c});
        render();
      }
    });
    document.getElementById("startBtn").addEventListener("click", function(){
      state.teams.forEach(function(t){ t.score = 0; });
      state.currentTeam = 0;
      state.phase = "ready";
      render();
    });
  }

  function bankCardHtml(b){
    var sel = state.bankKey===b.key ? " selected" : "";
    var preview = b.words.slice(0,6).join(", ") + (b.words.length>6 ? " …" : "");
    var actions = "";
    if (!b.builtin){
      if (state.confirmDeleteKey===b.key){
        actions = '<div class="confirm-del"><span>이 단어장을 삭제할까요?</span><div class="row">' +
          '<button class="btn primary" data-del="'+b.key+'" style="padding:7px 14px;font-size:12.5px;">삭제</button>' +
          '<button class="btn ghost" data-cancel-del="1" style="padding:7px 14px;font-size:12.5px;">취소</button>' +
        '</div></div>';
      } else {
        actions = '<div class="card-actions">' +
          '<button class="icon-btn" data-edit="'+b.key+'" title="수정">✎</button>' +
          '<button class="icon-btn" data-ask-del="'+b.key+'" title="삭제">🗑</button>' +
        '</div>';
      }
    }
    return '<button class="bank-card'+sel+'" style="--c:'+b.color+'" data-bank="'+b.key+'">' +
      '<span class="bar"></span>' +
      (b.builtin?'':'<span class="mine-tag">내 단어장</span>') +
      '<span class="name">'+esc(b.name)+'</span>' +
      '<span class="count">'+b.words.length+'개 단어</span>' +
      '<span class="preview">'+esc(preview)+'</span>' +
      actions +
    '</button>';
  }

  // ================= BUILDER =================
  function openBuilder(existing){
    if (existing){
      state.build = { editKey:existing.key, name:existing.name, color:existing.color, text:existing.words.join(", ") };
    } else {
      state.build = { editKey:null, name:"", color:COLORS[Math.floor(Math.random()*COLORS.length)].v, text:"" };
    }
    state.phase = "build";
    render();
  }

  function parseWords(text){
    return text.split(/[,\n]/).map(function(w){ return w.trim(); }).filter(function(w){ return w.length>0; });
  }

  function renderBuild(){
    var b = state.build;
    var words = parseWords(b.text);
    html_build(b, words);
  }
  function html_build(b, words){
    var html = '<h2 class="section-title">'+(b.editKey?"단어장 수정하기":"내 단어장 만들기")+'</h2>';
    html += '<p class="section-sub">쉼표(,) 또는 줄바꿈으로 단어를 구분해서 붙여넣으세요. 최소 8개를 권장해요.</p>';

    html += '<div class="field-row">' +
      '<div class="field" style="flex:1 1 240px;"><label>단어장 이름</label><input type="text" id="fName" value="'+esc(b.name)+'" placeholder="예: 물질의 상태 변화" maxlength="30"></div>' +
      '<div class="field"><label>색상</label><div class="swatches">' +
        COLORS.map(function(c){ return '<button class="swatch" style="--s:'+c.v+'" aria-pressed="'+(b.color===c.v)+'" data-color="'+c.v+'"></button>'; }).join("") +
      '</div></div>' +
    '</div>';

    html += '<div class="field"><label>단어 목록 ('+words.length+'개 인식됨)</label>' +
      '<textarea id="fWords" placeholder="예: 증발, 응결, 끓음, 승화, 융해, 응고, 확산, 압력, 부피, 온도">'+esc(b.text)+'</textarea>' +
      '<div class="word-preview">' + words.slice(0,40).map(function(w){
        return '<span class="chip'+(w.length>12?" bad":"")+'">'+esc(w)+'</span>';
      }).join("") + '</div>' +
      (words.some(function(w){return w.length>12;}) ? '<div class="hint">12자가 넘는 단어는 몸짓으로 표현하기 어려울 수 있어요.</div>' : '') +
    '</div>';

    html += '<div class="build-actions">' +
      '<button class="btn primary" id="saveBuildBtn">저장하고 목록으로</button>' +
      '<button class="btn ghost" id="cancelBuildBtn">취소</button>' +
    '</div>';

    stageEl.innerHTML = html;

    document.getElementById("fName").addEventListener("input", function(e){ state.build.name = e.target.value; });
    stageEl.querySelectorAll("[data-color]").forEach(function(el){
      el.addEventListener("click", function(){ state.build.color = el.getAttribute("data-color"); render(); });
    });
    var ta = document.getElementById("fWords");
    ta.addEventListener("input", function(e){ state.build.text = e.target.value; renderPreviewOnly(); });

    document.getElementById("cancelBuildBtn").addEventListener("click", function(){
      state.build = null; state.phase = "setup"; render();
    });
    document.getElementById("saveBuildBtn").addEventListener("click", saveBuild);
  }
  function renderPreviewOnly(){
    // light re-render without losing textarea focus: only update preview chips + count
    var words = parseWords(state.build.text);
    var label = stageEl.querySelector('label[for=""]');
    var fieldLabel = stageEl.querySelectorAll(".field label")[1];
    if (fieldLabel) fieldLabel.textContent = "단어 목록 (" + words.length + "개 인식됨)";
    var preview = stageEl.querySelector(".word-preview");
    if (preview){
      preview.innerHTML = words.slice(0,40).map(function(w){
        return '<span class="chip'+(w.length>12?" bad":"")+'">'+esc(w)+'</span>';
      }).join("");
    }
  }

  function saveBuild(){
    var b = state.build;
    var name = b.name.trim();
    var words = parseWords(b.text);
    if (!name){ state.banner="단어장 이름을 입력해 주세요."; render(); return; }
    if (words.length < 8){ state.banner="단어를 최소 8개 이상 입력해 주세요. (현재 "+words.length+"개)"; render(); return; }

    var key = b.editKey || ("custom_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    var bank = { key:key, name:name, color:b.color, builtin:false, words:words };
    if (b.editKey){
      customBanks = customBanks.map(function(x){ return x.key===b.editKey ? bank : x; });
    } else {
      customBanks.push(bank);
    }
    var ok = persistCustom();
    state.bankKey = key;
    state.build = null;
    state.phase = "setup";
    state.banner = ok ? null : "저장 공간이 부족해 이 단어장은 새로고침하면 사라질 수 있어요.";
    render();
  }

  // ================= SCOREBOARD =================
  function scoreboardHtml(){
    var sorted = state.teams.map(function(t,i){ return {t:t,i:i}; });
    return '<div class="scoreboard">' + state.teams.map(function(t,i){
      return '<div class="score-chip'+(i===state.currentTeam?" active":"")+'"><span class="dot" style="--c:'+t.color+'"></span>'+esc(t.name)+' <b>'+t.score+'</b></div>';
    }).join("") + '</div>';
  }

  // ================= READY =================
  function renderReady(){
    var team = state.teams[state.currentTeam];
    var html = scoreboardHtml();
    html += '<div class="ready">' +
      '<div class="turn-tag">이번 차례</div>' +
      '<h2 style="color:'+team.color+';">'+esc(team.name)+'</h2>' +
      '<div class="ready-meta">라운드 '+state.roundSeconds+'초 · 패스 '+(state.passLimit===null?"무제한":state.passLimit+'회')+' · '+esc(getBank(state.bankKey).name)+'</div>' +
      '<div class="warn">📱 이 화면은 <b>연기자 한 명만</b> 보세요. 다른 팀원은 화면을 보지 말고 연기자만 쳐다보세요!</div><br>' +
      '<button class="start-btn" id="goPlayBtn" style="max-width:280px;">라운드 시작!</button>' +
    '</div>';
    stageEl.innerHTML = html;
    document.getElementById("goPlayBtn").addEventListener("click", startRound);
  }

  // ================= PLAY =================
  function startRound(){
    var bank = getBank(state.bankKey);
    state.round = {
      pool: shuffle(bank.words),
      used: [],           // {word, correct:bool}
      current: null,
      timeLeft: state.roundSeconds,
      correct: 0,
      passesLeft: state.passLimit
    };
    nextWord();
    state.phase = "play";
    render();
    tickTimer();
  }
  function nextWord(){
    var r = state.round;
    if (r.pool.length === 0){
      // reshuffle used words back into the pool so the round can keep going
      r.pool = shuffle(r.used.map(function(u){ return u.word; }));
      if (r.pool.length === 0) { r.current = null; return; }
    }
    r.current = r.pool.pop();
  }
  var timerHandle = null;
  function tickTimer(){
    clearTimer();
    timerHandle = setInterval(function(){
      state.round.timeLeft -= 1;
      if (state.round.timeLeft <= 0){
        clearTimer();
        endRound();
      } else {
        updatePlayHud();
      }
    }, 1000);
  }
  function clearTimer(){ if (timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

  function renderPlay(){
    var r = state.round;
    var team = state.teams[state.currentTeam];
    var low = r.timeLeft <= 10;
    var html = '<div class="play-top">' +
      '<span class="team-tag"><span class="dot" style="--c:'+team.color+'"></span>'+esc(team.name)+'</span>' +
      '<span class="timer-big'+(low?" low":"")+'" id="timerText">'+r.timeLeft+'초</span>' +
    '</div>';
    html += '<div class="play-sub"><span>맞힌 단어 <b style="color:var(--ink);">'+r.correct+'</b>개</span>' +
      '<span>남은 패스 '+(r.passesLeft===null?"무제한":r.passesLeft+"회")+'</span></div>';

    html += '<div class="word-card"><span class="corner">연기자만 보세요</span><div class="word">'+(r.current?esc(r.current):"단어가 없어요")+'</div></div>';

    html += '<div class="play-actions">' +
      '<button class="act-btn pass" id="passBtn"'+((r.passesLeft!==null && r.passesLeft<=0)?" disabled":"")+'>🙈 패스</button>' +
      '<button class="act-btn correct" id="correctBtn">✅ 정답!</button>' +
    '</div>';
    html += '<div class="end-round-row"><button id="endEarlyBtn">라운드 일찍 끝내기</button></div>';

    stageEl.innerHTML = html;
    document.getElementById("correctBtn").addEventListener("click", function(){ markWord(true); });
    var passBtn = document.getElementById("passBtn");
    if (passBtn) passBtn.addEventListener("click", function(){ markWord(false); });
    document.getElementById("endEarlyBtn").addEventListener("click", function(){ clearTimer(); endRound(); });
  }
  function updatePlayHud(){
    var r = state.round;
    var txt = document.getElementById("timerText");
    if (txt){
      txt.textContent = r.timeLeft + "초";
      txt.classList.toggle("low", r.timeLeft<=10);
    }
  }

  function markWord(isCorrect){
    var r = state.round;
    if (!r.current) return;
    r.used.push({word:r.current, correct:isCorrect});
    if (isCorrect) { r.correct += 1; window.KJS&&KJS.ok(); }
    else { window.KJS&&KJS.no({msg:'다음 단어로 다시 도전! 💪'}); if (r.passesLeft !== null) r.passesLeft -= 1; }
    nextWord();
    render();
  }

  function endRound(){
    clearTimer();
    var team = state.teams[state.currentTeam];
    team.score += state.round.correct;
    state.phase = "roundEnd";
    render();
  }

  function renderRoundEnd(){
    var team = state.teams[state.currentTeam];
    var r = state.round;
    var html = scoreboardHtml();
    html += '<div class="result">' +
      '<div class="badge">🎉</div>' +
      '<h2>'+esc(team.name)+', '+r.correct+'개 맞혔어요!</h2>' +
      '<p class="sub">점수판에 '+r.correct+'점을 더했어요.</p>' +
      '<div class="answer-strip">' + r.used.map(function(u){
        return '<span class="chip'+(u.correct?"":" passed")+'">'+esc(u.word)+'</span>';
      }).join("") + '</div>' +
      '<div class="result-actions">' +
        '<button class="btn primary" id="nextTeamBtn">다음 팀</button>' +
        '<button class="btn ghost" id="finishBtn">게임 종료하고 결과 보기</button>' +
      '</div>' +
    '</div>';
    stageEl.innerHTML = html;
    document.getElementById("nextTeamBtn").addEventListener("click", function(){
      state.currentTeam = (state.currentTeam+1) % state.teams.length;
      state.phase = "ready";
      render();
    });
    document.getElementById("finishBtn").addEventListener("click", function(){
      state.phase = "final";
      render();
    });
  }

  // ================= FINAL =================
  function renderFinal(){
    var ranked = state.teams.slice().sort(function(a,b){ return b.score-a.score; });
    var topScore = ranked.length ? ranked[0].score : 0;
    var html = '<div class="result">' +
      '<div class="badge">🏆</div>' +
      '<h2>게임 결과</h2>' +
      '<p class="sub">'+(ranked.length && topScore>0 ? esc(ranked[0].name)+' 팀이 1등이에요!' : '수고하셨어요!')+'</p>' +
      '<div class="final-board">' + ranked.map(function(t,i){
        return '<div class="final-row'+(i===0 && topScore>0 ? " win":"")+'"><span class="rank">'+(i+1)+'</span>' +
          '<span class="dot" style="--c:'+t.color+'"></span><span class="nm">'+esc(t.name)+'</span><span class="sc">'+t.score+'점</span></div>';
      }).join("") + '</div>' +
      '<div id="scoreBoxCharades" style="max-width:380px;margin:12px auto 0;text-align:left;"></div>' +
      '<div class="result-actions">' +
        '<button class="btn primary" id="newGameBtn">새 게임 시작</button>' +
      '</div>' +
    '</div>';
    stageEl.innerHTML = html;
    (function(){
      var bank = (state.grade === "내 단어장" ? customBanks : PRESET_BANKS).filter(function(b){ return b.key === state.bankKey; })[0];
      var unit = bank ? bank.grade.slice(3) : "";
      var lesson = bank ? bank.name : "";
      window.KJSScore && KJSScore.finishTeams({
        game: "charades", unit: unit, lesson: lesson,
        teams: state.teams.map(function(t){ return { name: t.name, score: t.score }; }),
        container: document.getElementById("scoreBoxCharades")
      });
    })();
    document.getElementById("newGameBtn").addEventListener("click", function(){
      state.teams.forEach(function(t){ t.score=0; });
      state.currentTeam = 0;
      state.phase = "setup";
      render();
    });
  }

  // ---- resume across republish (best-effort) ----
  function saveSnapshot(){
    try{
      if (window.claude && window.claude.hot && window.claude.hot.snapshot){
        window.claude.hot.snapshot({
          phase: (state.phase==="build"||state.phase==="play" ? "setup" : state.phase),
          bankKey: state.bankKey, roundSeconds: state.roundSeconds, passLimit: state.passLimit,
          teams: state.teams, currentTeam: state.currentTeam
        });
      }
    }catch(e){}
  }

  function boot(saved){
    loadCustom();
    if (saved && saved.teams && saved.teams.length>=2){
      state.teams = saved.teams;
      state.currentTeam = saved.currentTeam || 0;
      state.bankKey = getBank(saved.bankKey) ? saved.bankKey : "animal_energy";
      state.roundSeconds = saved.roundSeconds || 60;
      state.passLimit = (typeof saved.passLimit === "number") ? saved.passLimit : null;
    }
    state.phase = "setup";
    render();
  }

  try{
    if (window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(function(){ boot(window.claude.hot.data || {}); });
    } else {
      boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
    }
  }catch(e){ boot({}); }
})();
</script>
