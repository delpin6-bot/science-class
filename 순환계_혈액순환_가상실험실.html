<head>

<style>

function pathPos(pts,d){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);L+=l}d=((d%L)+L)%L;for(let i=0;i<seg.length;i++){if(d<=seg[i]){const t=d/seg[i];return [lerp(pts[i][0],pts[i+1][0],t),lerp(pts[i][1],pts[i+1][1],t)]}d-=seg[i]}return pts[pts.length-1]}
function geo1(w,h){const top=40,sc=Math.min(w*.96/IW,(h-top-4)/IH);const ox=(w-IW*sc)/2,oy=top+(h-top-4-IH*sc)/2;return{sc,ox,oy,U:(x,y)=>[ox+x*sc,oy+y*sc]}}
function draw1(cv,now,dt){const{g,w,h}=fit(cv);const G=geo1(w,h);H.t+=dt;const T=60/H.bpm;H.ph=(H.t%T)/T;const p=H.ph;
  const at=bump(p,0,.2),vt=bump(p,.2,.55);

  const fs=clamp(w/34,11,19),sel=H.sel,sc=G.sc;
  g.save();const cx=G.U(210,330);g.translate(cx[0],cx[1]);const pul=1+.022*vt;g.scale(pul,pul);g.translate(-cx[0],-cx[1]);
  if(HIMG.complete&&HIMG.naturalWidth)g.drawImage(HIMG,G.ox,G.oy,IW*sc,IH*sc);
  // 수축 표시(방·실 붉게 번쩍)
  const flash=(k,a)=>{if(a<.05)return;HIT[k].forEach(e=>{const q=G.U(e[0],e[1]);g.save();g.translate(q[0],q[1]);g.scale(1,e[3]/e[2]);const gr=g.createRadialGradient(0,0,0,0,0,e[2]*sc);gr.addColorStop(0,'rgba(255,255,255,'+(.55*a)+')');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,e[2]*sc,0,6.2832);g.fill();g.restore()})};

  // 혈류 입자
  if(H.flow){const sp=H.bpm/70*95,keys=['R','R2','L'];if(!H.P.length){keys.forEach(k=>{for(let i=0;i<9;i++)H.P.push({r:k,d:i*52+(k==='R2'?20:0),u:0})})}
    H.P.forEach(q=>{q.d+=dt*sp*(.7+.6*bump(p,.1,.6));const pts=HP[q.r];let Ln=0;for(let i=1;i<pts.length;i++)Ln+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);const dd=q.d%Ln,u=dd/Ln;const ps=pathPos(pts,dd),c=G.U(ps[0],ps[1]);g.globalAlpha=clamp(Math.min(u,1-u)*10,0,1);g.fillStyle=q.r==='L'?OX:DE;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(c[0],c[1],clamp(sc*8,4,8),0,6.2832);g.fill();g.stroke();g.globalAlpha=1})}
  g.restore();
  // 판막 표시(흰 고리)
  ['VR','VL','VP','VA'].forEach(k=>{const e=HIT[k][0],q=G.U(e[0],e[1]),r=(e[2]*.55+3*Math.sin(H.t*5))*sc;g.beginPath();g.arc(q[0],q[1],Math.max(8,r),0,6.2832);g.strokeStyle=sel===k?'#facc15':'#fff';g.lineWidth=sel===k?5:3;g.stroke()});

  lab('우심방',95,300,'#fff','#7f1d1d');lab('우심실',160,440,'#fff','#7f1d1d');lab('좌심방',275,240,'#fff','#7f1d1d');lab('좌심실',335,440,'#fff','#7f1d1d');

function geo2(w,h){return{yc:h*.31,hh:h*.19,r:Math.min(w*.2,h*.17),panel:{x:w*.03,y:h*.62,w:w*.94,h:h*.36}}}

  B2.cells=[];const rs=clamp(w*.016,7,13);for(let i=0;i<30;i++)B2.cells.push({k:'rbc',x:Math.random()*w,y:G.yc+rnd(-.8,.8)*G.hh,v:rnd(.8,1.1),rot:rnd(0,3),rs});

  for(let i=0;i<14;i++)B2.cells.push({k:'plt',x:Math.random()*w,y:G.yc+rnd(-.85,.85)*G.hh,v:rnd(.9,1.2),rot:rnd(0,6),rs:rs*.55})}
function drawCell(g,c,t){g.save();g.translate(c.x,c.y);g.rotate(c.rot+Math.sin(t*1.5+c.x*.02)*.3);
  if(c.k==='rbc'){g.fillStyle='#dc2626';g.strokeStyle='#7f1d1d';g.lineWidth=2;g.beginPath();g.ellipse(0,0,c.rs,c.rs*.78,0,0,6.28);g.fill();g.stroke();g.fillStyle='#b91c1c';g.beginPath();g.ellipse(0,0,c.rs*.45,c.rs*.35,0,0,6.28);g.fill()}
  else if(c.k==='wbc'){g.fillStyle='rgba(226,232,240,.92)';g.strokeStyle='#6d28d9';g.lineWidth=3;g.beginPath();for(let i=0;i<14;i++){const a=i/14*6.28,r=c.rs*(.85+.18*Math.sin(i*2.3+t));g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.stroke();g.fillStyle='#7c3aed';[[-.35,-.1,.4],[.2,.2,.38],[.25,-.3,.3]].forEach(a=>{g.beginPath();g.arc(a[0]*c.rs,a[1]*c.rs,a[2]*c.rs,0,6.28);g.fill()})}

function draw2(cv,now,dt){const{g,w,h}=fit(cv);if(B2.w!==w||B2.h!==h){const f=B2.w?w/B2.w:1;if(!B2.w)init2(w,h);else{init2(w,h)}}B2.t+=dt;const G=geo2(w,h),fs=clamp(w/34,11,19);
  g.fillStyle='#fff7f7';g.fillRect(0,0,w,h);

  g.fillStyle='rgba(250,204,21,.35)';for(let i=0;i<10;i++){g.beginPath();g.arc(L.x-G.r+((i*61+B2.t*50)%(G.r*2)),top+((i*37)%100)/100*G.hh*2,9,0,6.28);g.fill()}
  g.save();g.translate(L.x,L.y);g.scale(1.35,1.35);g.translate(-L.x,-L.y);for(const c of B2.cells)if(Math.abs(c.x-L.x)<G.r*1.1)drawCell(g,c,B2.t);g.restore();g.restore();

  pill(g,'🔍 돋보기를 끌어서 혈액 속을 들여다보세요',w*.5,top-fs*1.6,'#fff','rgba(127,29,29,.9)',fs);

function demo2(g,P,fs,dt){B2.dt+=dt;const k=B2.demo,t=B2.dt,cx=P.x+P.w/2,cy=P.y+P.h/2,rs=Math.min(P.h*.2,P.w*.07);
  if(k==='rbc'){const T=6,ph=(t%T)/T;const lx=P.x+P.w*.14,rx=P.x+P.w*.86;g.font=(rs*1.8)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('🫁',lx-rs*.5,cy-rs*.4);

    pill(g,'🫁 허파(산소 받음)',lx+rs*.5,P.y+fs*1.3,'#075985','#e0f2fe',fs-1);pill(g,'조직세포(산소 공급)',rx,P.y+fs*1.3,'#9d174d','#fce7f3',fs-1);pill(g,'적혈구: 산소 운반 작용',cx,P.y+P.h-fs*1.4,'#fff','#b91c1c',fs+2)}

    for(let i=0;i<3;i++){const q=((ph*1.4+i*.33)%1.0);const bx=lerp(P.x+P.w*.9,cx+rs*1.2,q),by=cy+(i-1)*rs*1.6*(1-q);const sz=q>.85?(1-q)/.15:1;if(sz>0){g.save();g.translate(bx,by);g.rotate(.6*i);g.scale(sz,sz);g.fillStyle='#16a34a';g.strokeStyle='#14532d';g.lineWidth=2;rr(g,-rs*.6,-rs*.22,rs*1.2,rs*.44,rs*.22);g.fill();g.stroke();g.restore()}}
    pill(g,'세균',P.x+P.w*.88,P.y+fs*1.5,'#14532d','#dcfce7',fs-1);pill(g,'백혈구: 세균을 잡아먹어 제거 (식균 작용)',cx,P.y+P.h-fs*1.4,'#fff','#6d28d9',fs+2)}
  else{const T=8,ph=Math.min(1,(t%T)/(T*.8));const wy=P.y+P.h*.72,gx=cx;g.fillStyle='#fecaca';g.fillRect(P.x+10,wy,gx-P.x-10-rs*1.4,P.h*.2);g.fillRect(gx+rs*1.4,wy,P.x+P.w-gx-rs*1.4-10,P.h*.2);g.fillStyle='#b91c1c';g.fillRect(P.x+10,P.y+P.h*.22,P.w-20,wy-P.y-P.h*.22);
    const n=Math.floor(ph*14);for(let i=0;i<n;i++){const a=i*2.4,rr0=rs*(.3+(i%5)*.28);const px=gx+Math.cos(a)*rr0*1.6,py=wy-rs*.1-Math.abs(Math.sin(a))*rr0*.9;drawCell(g,{k:'plt',x:px,y:py,rot:i,rs:rs*.7},t)}

    if(ph<.4){for(let i=0;i<3;i++){const q=(t*1.2+i*.3)%1;g.fillStyle='#b91c1c';g.beginPath();g.arc(gx+(i-1)*rs*.4,wy+q*P.h*.18,rs*.2,0,6.28);g.fill()}}

function drawTube(g,w,h,fs){const tx=w*.3,tw=Math.min(w*.2,100),ty=h*.1,th=h*.8;g.fillStyle='#f8fafc';g.fillRect(0,0,w,h);

  S.b.add('tube');hud()}
function demoStart(k){B2.demo=k;B2.dt=0;B2.view='vessel';S.b.add(k);hud();sTick();$$('[data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===k));ui2();

  $('#tip3').innerHTML=Q3.focus==='p'?'🫁 <b>허파순환</b>: 우심실 → 폐동맥 → 허파 모세혈관 → 폐정맥 → 좌심방. 허파에서 이산화 탄소를 내보내고 산소를 얻어 <b>정맥혈(암적색)이 동맥혈(선홍색)로</b> 바뀌어요.':Q3.focus==='s'?'🧍 <b>온몸순환</b>: 좌심실 → 대동맥 → 온몸 모세혈관 → 대정맥 → 우심방. 조직세포에 산소와 영양소를 주고 이산화 탄소와 노폐물을 받아 <b>동맥혈(선홍색)이 정맥혈(암적색)로</b> 바뀌어요.':'🔄 혈액은 <b>8자 모양</b>으로 순환해요. <b>허파순환</b>과 <b>온몸순환</b>을 하나씩 골라 관찰해 보세요!'}
function ctl3(){$('#selh3').textContent='🔄 순환 경로를 골라 관찰하세요';
  $('#sel3').innerHTML='<div class="big3"><button class="btn on" data-f3="all" style="min-height:64px"><span>8️⃣</span>전체 순환</button><button class="btn" data-f3="p" style="min-height:64px"><span>🫁</span>허파순환</button><button class="btn" data-f3="s" style="min-height:64px"><span>🧍</span>온몸순환</button></div>';
  $('#ctl3').innerHTML='<div class="cr" style="gap:8px"><button class="btn" id="pl3" style="min-height:64px;flex:1">⏸ 일시 정지</button><button class="btn" data-sp="slow" style="min-height:64px;flex:1">🐢 느리게</button><button class="btn on" data-sp="norm" style="min-height:64px;flex:1">보통</button><button class="btn" data-sp="fast" style="min-height:64px;flex:1">🐇 빠르게</button></div>';
  $('#info3').innerHTML='<div class="kv2">📋 순환 경로 (지금 흐르는 곳이 표시돼요)</div><div class="kv2" style="margin-top:6px;line-height:2;font-size:clamp(13px,1.2vw,19px)"><b>허파순환</b>: <span class="st" data-s="우심실">우심실</span> → <span class="st" data-s="폐동맥">폐동맥</span> → <span class="st" data-s="허파 모세혈관">허파 모세혈관</span> → <span class="st" data-s="폐정맥">폐정맥</span> → 좌심방<br><b>온몸순환</b>: <span class="st" data-s="좌심실">좌심실</span> → <span class="st" data-s="대동맥">대동맥</span> → <span class="st" data-s="온몸 모세혈관">온몸 모세혈관</span> → <span class="st" data-s="대정맥">대정맥</span> → 우심방</div>';ui3()}
document.addEventListener('click',e=>{let b;
  if(b=e.target.closest('[data-h]')){sel1(b.dataset.h);return}
  if(b=e.target.closest('[data-bp]')){H.bpm=+b.dataset.bp;$$('[data-bp]').forEach(x=>x.classList.toggle('on',x===b));sTap();return}
  if(e.target.closest('#fl1')){H.flow=!H.flow;$('#fl1').classList.toggle('on',H.flow);sTap();return}
  if(b=e.target.closest('[data-d]')){demoStart(b.dataset.d);return}
  if(b=e.target.closest('[data-v]')){B2.view=b.dataset.v;sTap();ui2();return}
  if(b=e.target.closest('[data-f3]')){Q3.focus=b.dataset.f3;S[Q3.focus==='p'?'b':'b'];if(Q3.focus!=='all'){S.c.add('f'+Q3.focus);hud()}sTap();ui3();return}
  if(b=e.target.closest('[data-sp]')){Q3.sp={slow:.035,norm:.07,fast:.13}[b.dataset.sp];$$('[data-sp]').forEach(x=>x.classList.toggle('on',x===b));sTap();return}
  if(e.target.closest('#pl3')){Q3.play=!Q3.play;sTap();ui3();return}});
$('#a3').addEventListener('pointerdown',e=>{const r=$('#a3').getBoundingClientRect(),G=geo3(r.width,r.height),x=e.clientX-r.left,y=e.clientY-r.top;
  const tgt=[['폐동맥: 우심실에서 허파로 가는 혈관 (암적색 혈액)',550,230],['허파 모세혈관: 이산화 탄소를 내보내고 산소를 얻어요',715,165],['폐정맥: 허파에서 좌심방으로 오는 혈관 (선홍색 혈액)',845,255],['대동맥: 좌심실에서 온몸으로 나가는 혈관 (선홍색)',748,470],['온몸 모세혈관: 산소·영양소를 주고 이산화 탄소·노폐물을 받아요',150,760],['대정맥: 온몸에서 우심방으로 오는 혈관 (암적색)',400,525],['심장: 우심방·우심실(암적색), 좌심방·좌심실(선홍색)',610,440]];
  let b=null,bd=1e9;tgt.forEach(t=>{const q=G.U(t[1],t[2]),d=Math.hypot(x-q[0],y-q[1]);if(d<Math.max(46,60*G.sc)&&d<bd){bd=d;b=t}});if(b){sTick();toast('#toast3',b[0],3200)}});
function hud(){const el=$('#pbar');el.style.display='flex';el.style.gap='6px';
  const a=S.a,b=S.b,c=S.c;const it=[['🫀 심장 부위 '+Math.min(a.size,6)+'/6',a.size>=6],['🔴 적혈구',b.has('rbc')],['⚪ 백혈구',b.has('wbc')],['🟠 혈소판',b.has('plt')],['🫁 허파순환',c.has('fp')],['🧍 온몸순환',c.has('fs')]];
  el.innerHTML=it.map(x=>`<div class="pseg${x[1]?' ok':''}">${x[0]}${x[1]?' ✔':''}</div>`).join('')+`<div class="pseg${S.quiz>=QZ.length?' ok':''}">퀴즈 ${S.quiz<0?'–':S.quiz+'/'+QZ.length}</div>`}
const QZ=[
 {q:'우심실에서 나온 혈액이 가는 곳은?',o:['폐동맥을 지나 허파','대동맥을 지나 온몸','폐정맥을 지나 좌심방','대정맥을 지나 우심방'],a:0,e:'우심실이 수축하면 혈액이 폐동맥을 통해 허파로 가요(허파순환).'},
 {q:'좌심실의 벽이 가장 두꺼운 까닭은?',o:['혈액을 온몸으로 보내기 위해 강하게 수축해야 하므로','혈액을 저장하기 위해','산소를 만들기 위해','판막을 보호하기 위해'],a:0,e:'좌심실은 대동맥을 통해 혈액을 온몸으로 내보내야 하므로 가장 강한 힘이 필요해요.'},
 {q:'심장의 판막이 하는 일은?',o:['혈액이 거꾸로 흐르는 것을 막는다','혈액에 산소를 공급한다','혈액을 만든다','심장을 뛰게 한다'],a:0,e:'판막은 혈액이 한쪽 방향으로만 흐르도록 역류를 막아 줘요.'},
 {q:'산소를 운반하는 혈구는?',o:['적혈구','백혈구','혈소판','혈장'],a:0,e:'적혈구의 헤모글로빈이 산소를 운반해요.'},
 {q:'몸속에 침입한 세균을 잡아먹어 제거하는 혈구는?',o:['백혈구','적혈구','혈소판','혈장'],a:0,e:'백혈구는 식균 작용 등으로 몸을 보호해요.'},
 {q:'상처가 났을 때 혈액을 굳게 하여 출혈을 막는 것은?',o:['혈소판','적혈구','백혈구','혈장'],a:0,e:'혈소판은 혈액 응고 작용을 해요.'},
 {q:'허파순환에서 혈액의 변화로 옳은 것은?',o:['암적색 정맥혈이 선홍색 동맥혈로 변한다','선홍색 동맥혈이 암적색 정맥혈로 변한다','색이 변하지 않는다','산소가 줄어든다'],a:0,e:'허파에서 이산화 탄소를 내보내고 산소를 얻어 정맥혈이 동맥혈로 바뀌어요.'},
 {q:'온몸순환의 경로로 옳은 것은?',o:['좌심실 → 대동맥 → 온몸 모세혈관 → 대정맥 → 우심방','우심실 → 폐동맥 → 허파 → 폐정맥 → 좌심방','좌심방 → 대정맥 → 온몸 → 대동맥 → 우심실','우심방 → 폐동맥 → 온몸 → 폐정맥 → 좌심실'],a:0,e:'온몸순환은 좌심실에서 시작해 우심방으로 돌아와요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{S.quiz=Math.max(S.quiz,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};

function resetAll(){S.a=new Set();S.b=new Set();S.c=new Set();S.quiz=-1;H.sel=null;H.bpm=70;H.flow=true;B2.view='vessel';B2.demo=null;B2.lens.init=false;B2.w=0;Q3.focus='all';Q3.play=true;Q3.t=0;
  for(const k of [1,2,3]){const c=$('#cc'+k);c.style.display='none';c.innerHTML=''}
  ctl1();ctl2();ctl3();fbx('#fb1','🫀 심장의 각 부위를 눌러 이름과 기능을 확인해 보세요.');fbx('#fb2','🔍 돋보기를 끌어 혈액 속을 들여다보고 혈구를 눌러 보세요.');fbx('#fb3','▶ 허파순환과 온몸순환을 하나씩 선택해 혈액의 색 변화를 관찰해 보세요.');hud();setMode(1)}
$('#btnReset').onclick=resetAll;
let lastT=0;function loop(){try{const now=performance.now()/1000,dt=Math.min(.05,now-(lastT||now));lastT=now;if(mode===1)draw1($('#a1'),now,dt);else if(mode===2)draw2($('#a2'),now,dt);else draw3($('#a3'),now,dt)}catch(e){console.error(e)}requestAnimationFrame(loop)}
resetAll();requestAnimationFrame(loop);
</script>
