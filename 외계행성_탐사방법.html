<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>외계 행성 탐사 방법 : 다른 별의 행성을 찾는 시뮬레이션</title>
<style>
:root{--bg:#02040c;--pn:#0b1226;--ln:#2a3a66;--tx:#f1f5f9;--mu:#94a3b8;--gold:#fde68a;--cy:#7dd3fc;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:24px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;min-height:56px;border-radius:14px;border:3px solid var(--ln);background:#111b3a;padding:0 14px;font-weight:800}
button:active{transform:scale(.97)}button.on{border-color:var(--gold);background:#2a2a10;color:var(--gold)}button:disabled{opacity:.45;cursor:default}
header{height:76px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:3px solid var(--ln);background:#050a1c}
header h1{font-size:25px;margin:0;white-space:nowrap}header h1 small{display:block;font-size:19px;color:var(--mu);font-weight:600}
.tabs{display:flex;gap:6px;margin-left:auto}.tabs button{min-height:60px;font-size:22px;padding:0 12px;white-space:nowrap}
#app{height:calc(100% - 76px);display:grid;grid-template-columns:1fr 480px}
#stage{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hero{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0b1636,#02040c 75%)}
#hw{position:relative}#himg{width:100%;height:100%;display:block;border-radius:12px;border:3px solid var(--ln);object-fit:fill;user-select:none;-webkit-user-drag:none}
#hsp{position:absolute;inset:0;z-index:2}#hcap{position:absolute;z-index:3;left:12px;top:10px;max-width:80%;background:rgba(3,7,18,.88);border:2px solid var(--ln);border-radius:12px;padding:6px 14px;font-size:24px;font-weight:900;color:var(--gold)}
.hs{position:absolute;width:56px;height:56px;min-height:56px;border-radius:50%;transform:translate(-50%,-50%);padding:0;font-size:26px;font-weight:900;border:4px solid #fff;background:rgba(220,38,38,.92);color:#fff;animation:pl 1.8s infinite}
.hs.fd{background:rgba(5,150,105,.95);animation:none}.hs.sel{border-color:var(--gold);box-shadow:0 0 0 8px rgba(253,230,138,.4);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}70%{box-shadow:0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hl{position:absolute;transform:translate(-50%,0);margin-top:34px;background:rgba(3,7,18,.92);border:2px solid var(--gold);color:var(--gold);padding:2px 10px;border-radius:10px;font-size:22px;font-weight:900;white-space:nowrap;pointer-events:none}
#panel{background:var(--pn);border-left:3px solid var(--ln);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#0f1a3a;border:3px solid var(--ln);border-radius:18px;padding:12px 14px}.card h3{margin:0 0 8px;font-size:26px;color:var(--cy)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips.c3{grid-template-columns:1fr 1fr 1fr}.chips button{font-size:22px;text-align:left;line-height:1.2;padding:6px 10px;min-height:60px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1e2b55}.row b{color:var(--gold);text-align:right}
.note{font-size:22px;color:var(--mu)}.big{font-size:30px;font-weight:900;color:var(--gold)}
.go{background:linear-gradient(#f59e0b,#ea580c);border-color:#fde68a;color:#111;font-size:26px;width:100%}
.prog{height:16px;border-radius:8px;background:#1e2b55;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#fde68a)}
.hi h4{margin:0 0 4px;font-size:28px;color:var(--gold)}.hi p{margin:0;font-weight:600}
.lab{font-size:21px;color:var(--mu);margin:8px 0 6px;font-weight:800}
input[type=range]{width:100%;height:56px;accent-color:#fbbf24}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar span{width:150px;font-size:21px;font-weight:800}.bar i{display:block;height:26px;border-radius:8px}.bar b{font-size:21px;color:var(--gold)}
.q p{margin:4px 0 10px;font-weight:800;color:var(--gold)}.q .o{display:block;width:100%;text-align:left;margin-bottom:10px;min-height:60px;padding:8px 14px;line-height:1.3}
.q .o.ok{border-color:var(--ok);background:#06301f}.q .o.no{border-color:var(--bad);background:#3a0b16}
.fb{padding:8px 12px;border-radius:12px;background:#0b2a22;border:2px solid var(--ok);margin-top:4px}.fb.no{background:#32101b;border-color:var(--bad)}
@media (max-width:980px){html,body{overflow:auto}header{height:auto;flex-wrap:wrap;padding:8px 12px}header h1{font-size:23px}.tabs{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tabs button{font-size:20px;padding:0 2px;min-width:0}
 #app{display:block;height:auto}#stage{height:64vh;min-height:430px}#panel{border-left:0;border-top:3px solid var(--ln);overflow:visible}
 .hs{width:44px;height:44px;min-height:44px;font-size:22px;border-width:3px}.hl{font-size:20px;margin-top:26px}#hcap{font-size:20px}}
</style>
</head>

이 여러 개 보일 수 있어요."], [28.0, 83.3, "행성 표면 상상도", "지구에서 약 23광년 떨어진 적색 왜성의 생명 가능 지대에 있는 행성을 상상해 그렸어요."]]}, {"k": "trap", "cap": "트라피스트-1 (p.166)", "hs": [[55.0, 16.2, "트라피스트-1 (적색 왜성)", "태양보다 훨씬 작고 차가운 별이에요. 지구에서 약 40광년 떨어져 있어요."], [19.7, 38.7, "암석 행성", "지구만 한 암석 행성 7개가 이 별을 돌아요. 2017년에 7개 모두 발표되었어요."], [72.5, 84.5, "7개 행성 비교", "이 가운데 e, f, g 행성이 생명 가능 지대 안에 있는 것으로 알려져 있어요."]]}];</script>

 {img:'cover',t:'행성 대기를 통과한 별빛을 분석하면 무엇을 알 수 있을까요?',o:['대기 속 기체의 종류','행성의 나이','행성의 위성 수'],a:0,w:'기체마다 흡수하는 파장이 달라 대기 성분을 알아낼 수 있어요.'},
 {img:'trap',t:'생명 가능 지대에 대한 설명으로 옳은 것은?',o:['별이 새로 태어나는 곳','행성 표면에 액체 물이 있을 수 있는 거리 범위','행성이 하나도 없는 곳'],a:1,w:'너무 뜨겁지도 차갑지도 않아 액체 물이 있을 수 있는 영역이에요.'},
 {img:'trap',t:'트라피스트-1은 어떤 별일까요?',o:['태양보다 작고 차가운 적색 왜성','태양보다 큰 청색 거성','블랙홀'],a:0,w:'트라피스트-1은 약 40광년 떨어진 작은 적색 왜성이고, 지구만 한 행성 7개가 돌아요.'},

 const Q=S.qz,score=Object.keys(Q.qa).filter(k=>Q.qa[k]===QZ[k].a).length;
 if(Q.done){$('#panel').innerHTML=`<div class="card hi"><h4>🏁 퀴즈 결과</h4><p class="big">${score} / ${QZ.length}</p><p>${score>=9?'외계 행성 탐사대장! 🚀':score>=6?'훌륭해요! 틀린 문제의 시뮬레이션을 다시 해 봐요.':'앞의 시뮬레이션 탭을 다시 해 보고 도전해요!'}</p></div><button class="go" id="re">🔁 다시 풀기</button>`;$('#re').onclick=()=>{Q.qi=0;Q.qa={};Q.done=false;heroQ();panel6();};return;}

 $$('[data-o]').forEach(b=>b.onclick=()=>{Q.qa[Q.qi]=+b.dataset.o;panel6();});

function setTab(t){S.tab=t;$$('.tabs button').forEach((b,i)=>b.classList.toggle('on',i+1===t));const photo=t>=5;$('#hero').style.display=photo?'flex':'none';cv.style.display=photo?'none':'block';
 if(t===5)drawHero(true,SCN[S.ph.sc].k,SCN[S.ph.sc].cap);if(t===6)heroQ();
 [null,panel1,panel2,panel3,panel4,panel5,panel6][t]();$('#panel').scrollTop=0;resize();}

window.addEventListener('resize',resize);
let last=0,acc=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;S.tm+=dt;
 if(S.tab<=4){cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#02040c';cx.fillRect(0,0,W,H);
  if(S.tab===1){TRS=trStep(dt);draw1();acc+=dt;if(acc>.5){acc=0;const r2=$('#r2');if(r2&&S.tr.minF<1&&TINC[S.tr.inc][1]<1+trK())r2.textContent='지구의 약 '+fmt(TST[S.tr.st][1]*Math.sqrt(1-S.tr.minF),1)+' 배';}}
  else if(S.tab===2){dpStep(dt);draw2();}else if(S.tab===3)draw3();else draw4();}
 requestAnimationFrame(loop);}
setTab(1);requestAnimationFrame(loop);
window.__ex={S,setTab};
})();
