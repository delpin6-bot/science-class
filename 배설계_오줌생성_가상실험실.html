<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>배설계와 오줌 생성 가상실험실</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;overflow:hidden}

.sp{flex:1}

main{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px}
.mode{display:none;height:100%}
.mode.on{display:grid;gap:10px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}

.btn:active{transform:scale(.95)}

.legend{position:absolute;right:10px;top:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-weight:800;font-size:clamp(12px,1vw,16px);background:rgba(255,255,255,.9);border-radius:10px;padding:4px 8px;max-width:70%}

#top{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:6px 12px;background:#e2e8f0;flex-wrap:wrap}

.badge{min-height:42px;padding:0 12px;border-radius:12px;border:2px dashed #94a3b8;background:#f8fafc;color:#94a3b8;font-weight:900;font-size:clamp(12px,1.05vw,16px);display:inline-flex;align-items:center}
.badge.on{border-style:solid;color:#fff}

.slot b{font-size:1.6em;color:#94a3b8}.slot.hot{border-style:solid;border-color:#f59e0b;background:#fffbeb}.slot.ok{border-style:solid;border-color:#22c55e;background:#f0fdf4}

.btn.chip.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.btn.chip.done{background:#dcfce7;border-color:#22c55e}.btn.chip:disabled{opacity:.45}

.sm .btn{min-height:48px;font-size:clamp(12px,1.05vw,16px);padding:0 10px}

.hudc span{display:block;font-size:.78em;font-weight:800;color:var(--mut)}.hudc b{display:block;font-size:clamp(20px,2.1vw,32px);font-variant-numeric:tabular-nums}
.hudc .i{border-color:#3b82f6;background:#eff6ff}.hudc .i b{color:#1d4ed8}.hudc .r{border-color:#f97316;background:#fff7ed}.hudc .r b{color:#c2410c}.hudc .m{border-color:#94a3b8}.hudc .m b{color:#475569}
.pres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pres .btn{min-height:52px;padding:0}.pres .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}

.dt{width:100%;border-collapse:collapse;font-weight:800;text-align:center;font-size:clamp(12px,1.05vw,16px)}.dt th,.dt td{border:2px solid #cbd5e1;padding:6px 3px}.dt th{background:#dbeafe;color:#1e3a8a}.dt td.f{background:#fef9c3;color:#166534}.dt td.cur{outline:3px solid #f59e0b}

.stg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stg3 .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.stg3 .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.stg3 .btn.ok{background:#dcfce7;border-color:#22c55e}
.alert{border-radius:12px;padding:8px 12px;font-weight:900;line-height:1.45;background:#fef2f2;border:3px solid #ef4444;color:#7f1d1d;font-size:clamp(13px,1.1vw,17px)}
.cv{width:100%;border:2px solid #cbd5e1;border-radius:12px;background:#f8fafc;display:block}
input[type=range].big{accent-color:#0f766e}

.seg{display:grid;gap:6px}.seg .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.seg .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.seg .btn.ok{border-color:#22c55e}
.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd div{border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;font-size:clamp(12px,1.02vw,15px);background:#f8fafc}.spd i{display:block;height:9px;border-radius:5px;background:#38bdf8;margin-top:3px}
.hudc .g b{color:#15803d}.hudc .g{border-color:#22c55e;background:#f0fdf4}
.med{display:grid;grid-template-columns:1fr 1fr;gap:6px}.med .btn{min-height:58px;line-height:1.2;padding:3px 8px;text-align:left;font-size:clamp(12px,1.05vw,16px)}.med .btn.on{background:#fffbeb;border-color:#f59e0b}

.ban{border-radius:12px;padding:8px 12px;font-weight:900;background:#fef9c3;border:3px solid #facc15;color:#713f12;line-height:1.45;font-size:clamp(13px,1.1vw,17px)}.ban:empty{display:none}

.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:900;font-size:clamp(12px,1.05vw,16px);border:2px solid}
.b-d{background:#fef9c3;border-color:#eab308;color:#713f12}.b-r{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}.b-f{background:#dcfce7;border-color:#22c55e;color:#14532d}.b-n{background:#e5e7eb;border-color:#9ca3af;color:#374151}
.hi{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hi div{border:2px solid var(--line);border-radius:12px;padding:5px 9px;font-weight:800;background:#f8fafc;font-size:clamp(12px,1.05vw,16px);line-height:1.4}
.sortbox{position:absolute;inset:0;overflow:auto;padding:12px;display:none;flex-direction:column;gap:10px;background:#f1f5f9}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cardb{min-height:84px;border:3px solid #cbd5e1;border-radius:14px;background:#fff;font-weight:900;font-size:clamp(13px,1.2vw,18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;line-height:1.2;padding:4px}.cardb span{font-size:clamp(26px,3vw,42px)}.cardb.sel{border-color:#f59e0b;background:#fffbeb;transform:scale(1.04)}.cardb.shake{animation:shk .4s;border-color:#ef4444;background:#fef2f2}

.zone.src{border-color:#f59e0b}.zone.non{border-color:#64748b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#dcfce7;border:2px solid #22c55e;border-radius:10px;padding:3px 8px;font-size:clamp(12px,1.05vw,16px)}

const X3={sub:null,guess:null,run:null,res:null,t:0,doneT:0};
function runner(rt){const s=rt.s;let ofs=[],tot=0;s.forEach(g=>{ofs.push(tot);tot+=plen(g.p)});return{rt,ofs,tot,d:0,delay:0,done:false,seg:0,x:s[0].p[0][0],y:s[0].p[0][1]}}
function startRun(){const rs=ROUTES[X3.sub].map(runner);rs.forEach((r,i)=>r.delay=i*.7);X3.run=rs;X3.res=null;X3.doneT=0;sOK&&0}
function upd3(dt){if(!X3.run)return;let all=true;X3.run.forEach(r=>{if(r.done)return;all=false;if(r.delay>0){r.delay-=dt;return}
  r.d+=95*dt;if(r.d>=r.tot){r.d=r.tot;r.done=true}
  let k=r.ofs.length-1;while(k>0&&r.d<r.ofs[k])k--;r.seg=k;const g=r.rt.s[k],pp=pathPos(g.p,Math.min(r.d-r.ofs[k],plen(g.p)-.01));r.x=pp[0];r.y=pp[1]});
  if(all&&!X3.res)finish3()}
function dest3(){const d=new Set(X3.run.map(r=>r.rt.d));return d.size>1?'both':[...d][0]}
function finish3(){const d=dest3(),ok=X3.guess===ANS3[X3.sub];X3.res={d,ok};
  const nm={vein:'콩팥정맥으로 돌아가요',urine:'오줌관으로 빠져나가요',both:'일부는 콩팥정맥으로, 나머지는 오줌으로 가요'}[d];
  const fb=$('#fb3');fb.className='fb '+(ok?'ok':'no');fb.innerHTML=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+'<b>'+SUBN[X3.sub]+'</b>은(는) '+nm+'.<br>'+TIPS3[X3.sub];ok?sOK():sNO();
  S.c.add('t'+X3.sub);hud();info3();
  if([...S.c].filter(x=>x[0]==='t').length>=6&&!S.c.has('tall')){S.c.add('tall');const c=$('#cc3');c.style.display='';c.innerHTML='🎉 <b>결론</b><br>혈구·단백질은 <b>여과되지 않고</b>, 포도당·아미노산은 <b>100% 재흡수</b>되며, 무기염류는 <b>일부만 재흡수</b>되고, 요소는 <b>대부분 오줌</b>으로 나간다. → 오줌에는 포도당·단백질·혈구가 없다.'}}
function draw3(cv,now,dt){const{g,w,h}=fit(cv);X3.t+=dt;upd3(dt);const G=geoI(w,h,IW3,IH3),sc=G.sc;
  g.fillStyle='#fff';g.fillRect(0,0,w,h);g.imageSmoothingQuality='high';
  if(IMG3.complete&&IMG3.naturalWidth)g.drawImage(IMG3,G.ox,G.oy,IW3*sc,IH3*sc);
  const fs=clamp(w/44,10,17);
  [[665,77,'콩팥정맥으로','#dc2626'],[665,162,'오줌관(콩팥깔때기)으로','#b45309']].forEach(a=>{const q=G.U(a[0]-8,a[1]+(a[1]<100?-22:20));if(X3.sub)pill(g,a[2],clamp(q[0],70,w-70),q[1],a[3],'rgba(255,255,255,.92)',clamp(sc*12,9,15))});
  const sz=clamp(sc*10,6,11);
  if(X3.run)X3.run.forEach(r=>{if(r.delay>0)return;const c=G.U(r.x,r.y);g.save();g.shadowColor='#fde047';g.shadowBlur=14;shape(g,X3.sub,c[0],c[1],sz);g.restore();
    if(!r.done){const l=r.rt.s[r.seg].l;pill(g,l,clamp(c[0],110,w-110),clamp(c[1]-26,40,h-10),'#f59e0b','rgba(15,23,42,.9)',clamp(sc*12,10,14))}});
  const t=!X3.sub?'🎯 추적할 물질을 고르세요':!X3.guess&&!X3.run?'🤔 '+SUBN[X3.sub]+'은(는) 어디로 갈까요? 예상을 골라 보세요':X3.run&&!X3.res?'🔎 '+SUBN[X3.sub]+' 추적 중…':'✅ 추적 완료';
  pill(g,t,w*.5,18,'#fff','rgba(30,58,138,.92)',fs)}
function ctl3(){$('#selh3').textContent='🎯 1단계: 추적할 물질을 고르세요';

  const gs=[['vein','🩸 콩팥정맥으로'],['urine','🚽 오줌관으로'],['both','↔ 일부는 둘 다']];

  $('#tip3').innerHTML=X3.sub?'🔎 <b>'+SUBN[X3.sub]+'</b>: 토리에서 여과될까? → 재흡수될까? → 분비될까? 를 생각해 보세요.':'💡 물질을 고르고, 콩팥정맥으로 갈지 오줌으로 나갈지 예상한 뒤 추적해 보세요.';info3()}
function info3(){const done=[...S.c].filter(x=>x[0]==='t'&&x!=='tall').length;
  const rows=Object.keys(SUBN).map(k=>{const d=S.c.has('t'+k);const a=ANS3[k];return `<tr><th>${SUBN[k]}</th><td>${d?'✔ '+(a==='vein'?'콩팥정맥':a==='urine'?'오줌':'둘 다'):'—'}</td></tr>`}).join('');

  el.innerHTML=it.map(x=>`<div class="pseg${x[1]?' ok':''}">${x[0]}${x[1]?' ✔':''}</div>`).join('')+`<div class="pseg${S.quiz>=QZ.length?' ok':''}">퀴즈 ${S.quiz<0?'–':S.quiz+'/'+QZ.length}</div>`}
const QZ=[
 {q:'혈액 속 노폐물을 걸러 오줌을 만드는 기관은?',o:['콩팥','방광','오줌관','요도'],a:0,e:'콩팥에서 오줌이 만들어지고, 방광은 오줌을 잠시 저장해요.'},
 {q:'오줌이 몸 밖으로 나가는 순서로 옳은 것은?',o:['콩팥 → 오줌관 → 방광 → 요도','콩팥 → 방광 → 오줌관 → 요도','방광 → 콩팥 → 오줌관 → 요도','콩팥 → 요도 → 방광 → 오줌관'],a:0,e:'콩팥(오줌 생성) → 오줌관 → 방광(저장) → 요도 → 몸 밖이에요.'},
 {q:'콩팥단위(네프론)를 구성하는 것으로 옳은 것은?',o:['토리, 보먼주머니, 세뇨관','토리, 방광, 요도','보먼주머니, 오줌관, 방광','세뇨관, 심방, 심실'],a:0,e:'콩팥단위는 토리(모세혈관 뭉치), 보먼주머니, 세뇨관으로 이루어져요.'},
 {q:'토리에서 보먼주머니로 물질이 이동하는 과정은?',o:['여과','재흡수','분비','확산 없음'],a:0,e:'혈압에 의해 크기가 작은 물질이 토리 → 보먼주머니로 걸러지는 것이 여과예요.'},
 {q:'여과되지 않고 혈관에 그대로 남는 물질은?',o:['혈구와 단백질','포도당과 아미노산','요소와 물','무기염류와 물'],a:0,e:'혈구와 단백질은 크기가 커서 여과되지 못해요.'},
 {q:'세뇨관에서 모세혈관으로 필요한 물질이 되돌아가는 과정은?',o:['재흡수','여과','분비','배설'],a:0,e:'우리 몸에 필요한 물질이 세뇨관 → 모세혈관으로 되돌아가는 것이 재흡수예요.'},
 {q:'정상인의 오줌에 거의 없는 물질은?',o:['포도당','요소','물','무기염류'],a:0,e:'포도당은 여과된 뒤 100% 재흡수되어 정상인의 오줌에는 없어요.'},
 {q:'분비에 대한 설명으로 옳은 것은?',o:['모세혈관에 남은 노폐물이 세뇨관으로 이동한다','세뇨관의 포도당이 모세혈관으로 이동한다','토리의 물질이 보먼주머니로 이동한다','오줌이 방광에 모인다'],a:0,e:'분비는 모세혈관에 남은 요소 등 노폐물이 세뇨관으로 이동하는 과정이에요.'},
 {q:'오줌이 만들어지는 과정의 순서는?',o:['여과 → 재흡수 → 분비','재흡수 → 여과 → 분비','분비 → 여과 → 재흡수','여과 → 분비 → 흡수 안 됨'],a:0,e:'토리에서 여과, 세뇨관에서 재흡수와 분비가 일어나 오줌이 만들어져요.'},
 {q:'오줌에서 단백질이나 혈구가 발견된다면?',o:['콩팥에 이상이 있을 수 있다','정상이다','포도당이 많아서이다','방광이 커서이다'],a:0,e:'정상이라면 여과되지 않는 물질이므로, 발견되면 콩팥의 여과 기능 이상을 의심해 볼 수 있어요.'}];
