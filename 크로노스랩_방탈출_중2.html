 const tag=q.v?'🔐 금고 탈출 암호':q.g?'👥 모둠 미션 · 토의 후 선택':'📋 제어 터미널 미션';
 const body=q.k=='mc'?`<div class="choices">${q.c.map((c,i)=>`<button class="ch" id="c${i}" onclick="pick(${i})"><i>${i+1}</i><span>${esc(c)}</span></button>`).join('')}</div>`:`<div class="sa"><input id="ans" autocomplete="off" autocapitalize="off" placeholder="정답 입력" onkeydown="if(event.key==='Enter')submit()"><button class="btn" id="sb" onclick="submit()">제출</button></div>`;
 render(hud()+`<div class="main"><div class="qhead"><span class="tag ${q.v?'gold':''}">${tag}</span><span class="qn">${S.qi+1} / ${s.qs.length}</span></div><div class="qtext">${esc(q.q)}</div>${body}<div id="hints"></div><div id="fb"></div><div class="acts"><button class="btn ghost" id="hb" onclick="hint()">💡 힌트 (−10%)</button></div></div>`);
 if(q.k=='sa')setTimeout(()=>{const e=$('#ans');e&&e.focus()},60)}
function pick(i){if(S.busy)return;const q=Q(),st=stat(di(),S.qi);st.att++;if(i+1==q.a)good();else{st.wrong++;st.ch[i]=(st.ch[i]||0)+1;const b=$('#c'+i);b.classList.add('bad');b.disabled=true;bad()}}
function submit(){if(S.busy)return;const q=Q(),st=stat(di(),S.qi),v=$('#ans').value.trim();if(!v)return;st.att++;if(q.a.map(norm).includes(norm(v)))good();else{st.wrong++;st.tx[v]=(st.tx[v]||0)+1;$('#ans').value='';bad()}}
function bad(){sfx.bad();S.wrong++;document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),500);
 S.energy=Math.max(0,S.energy-15);upd();if(S.energy==0){emerg();return}
 const q=Q();S.busy=true;let t=3;$('#fb').innerHTML=`<div class="fb bad">🚨 경고! 에너지 −15% <span><b>오개념 저격</b> · ${esc(q.m)}</span><div class="cd" id="cd">재도전까지 <b>${t}</b>초</div></div>`;
 const iv=setInterval(()=>{t--;const c=$('#cd');if(!c){clearInterval(iv);return}if(t<=0){clearInterval(iv);S.busy=false;c.textContent='🔁 다시 도전!';const a=$('#ans');a&&a.focus()}else c.innerHTML='재도전까지 <b>'+t+'</b>초'},1000)}
function hint(){if(S.busy||S.lv>=3)return;const q=Q(),st=stat(di(),S.qi);S.lv++;S.hints++;st.hints=(st.hints||0)+1;S.energy=Math.max(0,S.energy-10);upd();
 let t='';if(S.lv==1){if(q.k=='mc'){const c=[...document.querySelectorAll('.ch')].filter(b=>!b.disabled&&(+b.id.slice(1)+1)!=q.a);if(c.length>1){const b=c[0];b.disabled=true;b.classList.add('gone');t='오답 보기 하나를 지웠어요.'}else t='보기를 차근차근 다시 읽어 봐요.'}else{const a=q.a[0];t=/[가-힣]/.test(a)?'초성: '+cho(a):'정답은 '+a.length+'글자(자리)예요.'}}
 else if(S.lv==2)t=q.h;else t=q.n;
 $('#hints').insertAdjacentHTML('beforeend',`<div class="hint">💡 힌트 ${S.lv}/3 · ${esc(t)}</div>`);
 if(S.lv>=3)$('#hb').disabled=true;if(S.energy==0)emerg()}

 const iv=setInterval(()=>{t--;const e=$('#et');if(e)e.textContent=t;if(t<=0){clearInterval(iv);closeOv();S.energy=30;upd();S.busy=false;S.lv=3;const q=Q(),h=$('#hints'),f=$('#fb');if(f)f.innerHTML='';if(h)h.innerHTML=`<div class="hint">💡 무료 힌트 · ${esc(q.h)}</div><div class="hint">💡 무료 힌트 · ${esc(q.n)}</div>`;const b=$('#hb');b&&(b.disabled=true)}},1000)}

  return `<div class="card"><div class="rk">${i+1}</div><div><b>${sc.ic} ${sc.unit}</b> · ${esc(q.q.length>70?q.q.slice(0,70)+'…':q.q)}<br>오답률 <b>${Math.round(r.rate*100)}%</b> (${r.s.wrong}회 오답 / ${r.s.att}회 시도) · 힌트 ${r.s.hints||0}회<br>가장 많이 고른 오답: ${esc(top)}<br>📌 해설: ${esc(q.fb)}<br>🎯 오개념: ${esc(q.m)}<br>🗣 교사 발문: ${esc(sc.tq)}</div></div>`};
 overlay(`<div class="modal"><h2>📊 교사용 대시보드 · 오답률 TOP 3</h2>${rows.length?rows.map(card).join(''):'<p>아직 오답이 없어요. 모든 문항을 한 번에 맞혔어요! 👏</p>'}<p class="sm">총 오답 ${S.wrong}회 · 힌트 ${S.hints}회 · 남은 에너지 ${S.energy}%</p><button class="btn big" onclick="closeOv()">닫기</button></div>`)}
function drawer(){if(!S)return;overlay(`<div class="modal sm2"><h2>⚙️ 교사용 메뉴</h2><div class="tog"><span>🔊 효과음</span><button class="btn sm" onclick="snd=!snd;this.textContent=snd?'켜짐':'꺼짐'">${snd?'켜짐':'꺼짐'}</button></div><button class="btn sm ghost" onclick="fs()">⛶ 전체 화면</button><button class="btn sm ghost" onclick="closeOv();dash()">📊 교사용 대시보드</button><button class="btn sm ghost" onclick="if(confirm('처음 화면으로 돌아갈까요?')){closeOv();startScreen()}">🔁 처음으로</button><button class="btn sm" onclick="closeOv()">닫기</button></div>`)}
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
startScreen();
</script></body></html>
