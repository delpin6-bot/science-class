function setRg(){const R=RG[cur];$$('.rgtab').forEach((b,i)=>b.classList.toggle('on',i===cur));document.documentElement.style.setProperty('--rg',R.base);
  $('#ctl1').innerHTML=`<div class="rgcard"><div class="rgt"><div class="nm">🧪 ${R.tab}</div>🔎 검출 영양소: <b style="color:#b91c1c">${R.nut}</b><br>🎨 반응 색: <b style="color:#1d4ed8">${R.posn}</b>${R.heat?'<br>🔥 <b>가열</b>해야 반응해요':''}</div><div class="dpw"><div class="dp" id="dp"><div class="bulb"></div><div class="stem"><i></i></div></div>스포이트<br>끌어서 놓기</div></div>
  <div class="cr" style="margin-top:8px;gap:8px">${R.heat?'<button class="btn" id="heatb" style="min-height:64px;flex:1;background:#fee2e2;border-color:#ef4444">🔥 가열하기</button>':''}<button class="btn" id="rsb" style="min-height:64px;flex:1">🧼 시험관 새로 채우기</button></div>`;
  $('#tip1').innerHTML='💡 <b>'+R.sh+' 용액</b>은 <b>'+R.nut+'</b>을(를) 검출해요. 어떤 음식물에 '+R.nut+'이(가) 들어 있을까요? 시험관마다 떨어뜨려 확인하세요!'+(R.heat?' (반응 후 반드시 <b>🔥 가열하기</b>)':'');
  renderTubes();renderMx()}
function renderMx(){const R=RG[cur];$('#info1').innerHTML='<div class="kv2">📋 실험 결과 기록표 (자동 기록)</div><table class="cmpa mtx" style="margin-top:6px"><tr><th></th>'+FD.map(f=>`<th>${f.e}<br><small>${f.nm}</small></th>`).join('')+'</tr>'+RG.map((r,ri)=>`<tr class="${ri===cur?'cur':''}"><th>${r.sh}</th>`+FD.map((f,fi)=>{const m=MX[ri][fi];return m?`<td><span class="dot" style="background:${m.col}"></span><small>${m.t}</small></td>`:'<td>–</td>'}).join('')+'</tr>').join('')+'</table>'}
function msg(R,f,pos){if(f.id==='water')return '💧 증류수에는 영양소가 없어요. 시약 본래의 색만 비칠 뿐 색이 변하지 않았어요. 이처럼 <b>비교하는 기준(대조군)</b>이 되어요.';
  if(pos)return '✅ <b>'+R.sh+' 용액과 반응하여 '+R.posn+'으로 변했으므로 '+R.nut.replace('(포도당)','')+(R.id==='ben'?'이(가)':'이(가)')+' 들어 있습니다.</b>';
  return '▫️ '+f.nm+'은(는) '+R.sh+' 용액과 반응하지 않았어요. (색 변화 없음) → '+R.nut.replace('(포도당)','')+'이(가) 들어 있지 않거나 매우 적어요.'}
function finish(i,pos){const R=RG[cur],f=FD[i],s=ST[cur][i];s.state='done';s.res=pos?'pos':'neg';
  MX[cur][i]={col:pos?R.pos:R.neg,t:pos?R.posn:'변화 없음'};if(f.id==='water')S.ctrl=true;
  if(pos){S.found.add(R.id);sOK()}else sTap();
  $('#tip1').innerHTML=msg(R,f,pos);fbx('#fb1',msg(R,f,pos),pos?'ok':'');
  const t=$('#tc'+i);if(t)t.textContent=pos?R.posn:'변화 없음';renderMx();hud();
  if(pos&&R.heat){const tb=$('.tb[data-i="'+i+'"]');tb&&tb.classList.add('ok')}
  if(S.found.size>=4&&S.ctrl&&!$('#cc1').innerHTML){const c=$('#cc1');c.style.display='';c.innerHTML='🎉 <b>결론</b><br>아이오딘 용액 → <b>녹말</b>(청람색), 베네딕트 용액 → <b>당분</b>(가열, 황적색), 뷰렛 용액 → <b>단백질</b>(보라색), 수단 Ⅲ 용액 → <b>지방</b>(선홍색). 증류수는 색 변화의 기준이 되는 대조군이다.'}}
function dropIn(i){const R=RG[cur],f=FD[i],s=ST[cur][i];
  if(s.state==='done'&&R.heat){toast('#toast1','이미 가열했어요. [시험관 새로 채우기]로 다시 해 보세요.',2200);return}
  const gl=$('#gl'+i);if(!gl)return;const d=document.createElement('div');d.className='dropf';d.style.background=R.base;gl.appendChild(d);sTick();
  setTimeout(()=>{d.remove();s.drops++;const pos=f.id===R.pf;
    if(R.heat){s.state='mixed';s.col=R.neg;$('#lq'+i).style.background=R.neg;const t=$('#tc'+i);t.textContent='(가열 전)';
      const m=MX[cur][i];if(!m||m.t==='가열 필요')MX[cur][i]={col:R.neg,t:'가열 필요'};renderMx();
      $('#tip1').innerHTML=f.id==='water'?msg(R,f,0).replace('색이 변하지 않았어요','아직 파란색 그대로예요')+' 🔥 가열해도 변하지 않는지 확인해 보세요.':'⏳ <b>베네딕트 용액</b>을 떨어뜨렸어요. 반응하려면 반드시 <b>🔥 가열하기</b>를 눌러야 해요!';return}
    const col=pos?R.pos:(f.id==='oil'||R.id!=='sud'?R.neg:R.neg);s.col=pos?R.pos:(R.id==='sud'?R.neg:R.neg);
    // 반응 시약 색에 음식 본래 색 섞음(비반응): 약간만 감돌게
    $('#lq'+i).style.background=s.col;setTimeout(()=>finish(i,pos),pos?1300:500)},520)}
function heat(){const R=RG[cur];if(!R.heat)return;const idx=FD.map((f,i)=>i).filter(i=>ST[cur][i].drops>0&&ST[cur][i].state==='mixed');
  if(!idx.length){sNO();toast('#toast1','먼저 시험관에 베네딕트 용액을 떨어뜨리세요!',2400);$('#tip1').innerHTML='💡 먼저 <b>베네딕트 용액</b>을 시험관에 떨어뜨린 뒤 가열해요.';return}
  S.heat=true;hud();sTap();
  idx.forEach(i=>{const tb=$('.tb[data-i="'+i+'"]');tb.classList.add('heating');const gl=$('#gl'+i);for(let k=0;k<4;k++){const b=document.createElement('div');b.className='bub';b.style.left=(15+k*20)+'%';b.style.animationDelay=(k*.25)+'s';gl.appendChild(b)}const fi=document.createElement('div');fi.className='fire';fi.textContent='🔥';tb.appendChild(fi);fi.style.top='30%';fi.style.opacity=.9;
    const pos=FD[i].id===R.pf;
    setTimeout(()=>{if(pos)$('#lq'+i).style.background='#6fbf5a'},900);
    setTimeout(()=>{if(pos)$('#lq'+i).style.background='#e8b21e'},1700);
    setTimeout(()=>{tb.classList.remove('heating');fi.remove();gl.querySelectorAll('.bub').forEach(b=>b.remove());ST[cur][i].col=pos?R.pos:R.neg;$('#lq'+i).style.background=pos?R.pos:R.neg;finish(i,pos)},2500)})}
let dg=null;
document.addEventListener('pointerdown',e=>{const d=e.target.closest('#dp');if(!d)return;dg={x:e.clientX,y:e.clientY,mv:false,gh:null};d.setPointerCapture&&d.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!dg)return;if(!dg.mv&&Math.hypot(e.clientX-dg.x,e.clientY-dg.y)>8){dg.mv=true;dg.gh=$('#dp').cloneNode(true);dg.gh.removeAttribute('id');dg.gh.classList.add('ghost');document.body.appendChild(dg.gh)}
  if(dg.mv){dg.gh.style.left=e.clientX+'px';dg.gh.style.top=e.clientY+'px';$$('.tb').forEach(t=>t.classList.remove('hov'));const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest('.tb');if(t)t.classList.add('hov')}});
const upd=e=>{if(!dg)return;const o=dg;dg=null;if(o.gh)o.gh.remove();const hv=$('.tb.hov');$$('.tb').forEach(t=>t.classList.remove('hov'));
  if(o.mv){if(hv)dropIn(+hv.dataset.i)}else toast('#toast1','스포이트를 시험관 위로 끌어다 놓거나, 시험관을 눌러도 돼요!',2400)};
document.addEventListener('pointerup',upd);document.addEventListener('pointercancel',upd);
document.addEventListener('click',e=>{let b;
  if(b=e.target.closest('.tb')){dropIn(+b.dataset.i);return}
  if(b=e.target.closest('.rgtab')){cur=+b.id.slice(2);sTap();setRg();return}
  if(e.target.closest('#heatb')){heat();return}
  if(e.target.closest('#rsb')){ST[cur]=FD.map(()=>({drops:0,col:null,state:'idle',res:null}));MX[cur]=FD.map(()=>null);RG[cur].id&&S.found.delete(RG[cur].id);sTap();setRg();fbx('#fb1','🧼 시험관을 새로 채웠어요. 다시 실험해 보세요.');return}});
function hud(){const el=$('#pbar');el.style.display='flex';el.style.gap='6px';
  const it=[['녹말 '+(S.found.has('iod')?'✔':''),S.found.has('iod')],['당분(가열) '+(S.found.has('ben')?'✔':''),S.found.has('ben')],['단백질 '+(S.found.has('biu')?'✔':''),S.found.has('biu')],['지방 '+(S.found.has('sud')?'✔':''),S.found.has('sud')],['🔥 가열',S.heat],['💧 대조군',S.ctrl]];
  el.innerHTML=it.map(x=>`<div class="pseg${x[1]?' ok':''}">${x[0]}</div>`).join('')+`<div class="pseg${S.quiz>=QZ.length?' ok':''}">퀴즈 ${S.quiz<0?'–':S.quiz+'/'+QZ.length}</div>`}
const QZ=[
 {q:'밥물에 아이오딘-아이오딘화 칼륨 용액을 떨어뜨리면 청람색으로 변한다. 이로써 알 수 있는 것은?',o:['밥물에 녹말이 들어 있다','밥물에 단백질이 들어 있다','밥물에 지방이 들어 있다','밥물에 아무 영양소도 없다'],a:0,e:'아이오딘-아이오딘화 칼륨 용액은 녹말을 만나면 청람색으로 변해요.'},
 {q:'양파즙에 베네딕트 용액만 넣고 가열하지 않으면?',o:['파란색 그대로 변하지 않는다','바로 황적색이 된다','보라색이 된다','선홍색이 된다'],a:0,e:'베네딕트 반응은 반드시 가열해야 일어나요. 가열하면 당분이 있을 때 황적색으로 변해요.'},
 {q:'뷰렛 용액이 보라색으로 변했다면 들어 있는 영양소는?',o:['단백질','녹말','지방','당분'],a:0,e:'뷰렛 용액은 단백질을 만나면 보라색으로 변해요. (예: 달걀흰자액)'},
 {q:'수단 Ⅲ 용액이 선홍색으로 변했다면 들어 있는 영양소는?',o:['지방','녹말','단백질','비타민'],a:0,e:'수단 Ⅲ 용액은 지방을 만나면 선홍색으로 변해요. (예: 식용유)'},
 {q:'실험에서 증류수를 함께 실험한 까닭은?',o:['색 변화가 영양소 때문인지 비교할 기준(대조군)으로 삼으려고','물이 많이 필요해서','시험관 수를 맞추려고','시약을 희석하려고'],a:0,e:'영양소가 없는 증류수와 비교하면 다른 용액의 색 변화가 영양소 때문이라는 것을 확인할 수 있어요.'},
 {q:'식용유에 아이오딘 용액을 떨어뜨렸을 때 청람색으로 변하지 않는 까닭은?',o:['식용유에는 녹말이 없기 때문이다','아이오딘 용액이 상했기 때문이다','가열하지 않았기 때문이다','식용유가 투명하기 때문이다'],a:0,e:'아이오딘 용액은 녹말에만 청람색으로 반응해요. 식용유는 지방이라 시약 본래의 색만 보여요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{S.quiz=Math.max(S.quiz,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};

function resetAll(){S.found=new Set();S.ctrl=false;S.heat=false;S.quiz=-1;cur=0;freshST();MX=RG.map(()=>FD.map(()=>null));
  const c=$('#cc1');c.style.display='none';c.innerHTML='';setRg();hud();fbx('#fb1','🧪 시약을 고르고 스포이트(또는 시험관 터치)로 음식물 용액에 떨어뜨려 색 변화를 관찰해 보세요.')}
$('#btnReset').onclick=resetAll;resetAll();
</script>
</body>
</html>
