const COL=['#64748b','#3b82f6','#f97316'],NM=['고체','액체','기체'];

// 상태 상자: 30개 입자. st 0/1/2, k=운동 속도 배율, hl=액체 높이, lat=고체 격자 열 수
function Box(x0,y0,x1,y1,o){o=o||{};const b={x0,y0,x1,y1,st:0,k:1,hl:o.hl||80,cols:o.cols||6,n:o.n||30,r:o.r||8,ps:[],vol:1};
 b.fill=function(){b.ps=[];for(let i=0;i<b.n;i++)b.ps.push(P(rnd(x0+10,x1-10),rnd(y1-80,y1-10),b.r,COL[b.st]))};
 b.set=function(s){b.st=s;b.ps.forEach(p=>p.c=COL[s])};
 b.step=function(dt){const cx=(b.x0+b.x1)/2,sp=b.st===0?0:(b.st===1?60:230)*b.k,sz=b.r*2.7;
  b.ps.forEach((p,i)=>{if(b.st===0){const tx=cx-(b.cols-1)*sz/2+(i%b.cols)*sz,ty=b.y1-b.r-4-Math.floor(i/b.cols)*sz;const q=Math.min(1,7*dt);p.x+=(tx-p.x)*q+Math.sin(performance.now()/90+p.j)*.3*b.k;p.y+=(ty-p.y)*q+Math.cos(performance.now()/80+p.j)*.3*b.k}
   else{const top=b.st===1?b.y1-b.hl:b.y0;if(p.y<top)p.y+=(top-p.y)*Math.min(1,5*dt)+1;walk(p,sp,dt,[b.x0,top,b.x1,b.y1])}});
  if(b.st===1){const a=b.ps,d0=b.r*2;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const dx=a[j].x-a[i].x,dy=a[j].y-a[i].y,d=Math.hypot(dx,dy)||.1;if(d<d0){const m=(d0-d)/2/d;a[i].x-=dx*m;a[i].y-=dy*m;a[j].x+=dx*m;a[j].y+=dy*m}}}};
 b.draw=function(g,tint){g.fillStyle='#fff';g.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);if(b.st===1){g.fillStyle=tint||'rgba(96,165,250,.3)';g.fillRect(b.x0,b.y1-b.hl,b.x1-b.x0,b.hl)}
  g.strokeStyle='#64748b';g.lineWidth=7;g.lineJoin='round';g.beginPath();g.moveTo(b.x0,b.y0);g.lineTo(b.x0,b.y1);g.lineTo(b.x1,b.y1);g.lineTo(b.x1,b.y0);g.stroke();dots(g,b.ps,.95)};
 b.fill();return b}

 if(lab){g.font='900 22px sans-serif';g.textAlign='center';g.fillStyle=c;g.fillText(lab,(x1+x2)/2-Math.sin(a)*26,(y1+y2)/2+Math.cos(a)*26+6)}}
function spring(g,x1,y1,x2,y2,n,w,c){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;g.strokeStyle=c||'#475569';g.lineWidth=5;g.lineJoin='round';g.beginPath();g.moveTo(x1,y1);const s=L*.1;g.lineTo(x1+ux*s,y1+uy*s);for(let i=0;i<=n*2;i++){const t=.1+.8*i/(n*2),o=(i%2?1:-1)*w;g.lineTo(x1+ux*L*t+px*o,y1+uy*L*t+py*o)}g.lineTo(x2-ux*s,y2-uy*s);g.lineTo(x2,y2);g.stroke()}
// 분류 도우미: Sorter(rootSel, items[[label,bin,exp]], sayId, done)
function Sorter(root,items,sayId,done){const R=$(root),st={ok:[],sel:-1};const it=R.querySelector('.items'),bins=[...R.querySelectorAll('.bin')];
 function r(){it.innerHTML='';items.forEach((x,i)=>{if(st.ok[i])return;const b=document.createElement('button');b.className='item'+(st.sel===i?' sel':'');b.textContent=x[0];b.onclick=()=>{st.sel=i;sTap();r()};it.appendChild(b)});bins.forEach(bn=>{const k=+bn.dataset.b;bn.querySelector('.bc').innerHTML=items.map((x,i)=>st.ok[i]&&x[1]===k?'<span class="chip">'+x[0]+'</span>':'').join('')})}

// 객관식 연속: MCSeq(qId,oId,pId,sayId,list[[q,opts,ans,exp]],done)
function MCSeq(qId,oId,pId,sayId,list,done,onShow){const st={n:0};function show(){if(st.n>=list.length){$('#'+qId).textContent='🎉 모두 맞혔어요!';$('#'+oId).innerHTML='';return}const q=list[st.n];onShow&&onShow(st.n);$('#'+qId).textContent=(st.n+1)+'. '+q[0];$('#'+oId).innerHTML='';const od=q[1].map((_,i)=>i);for(let k=od.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[od[k],od[j]]=[od[j],od[k]]}od.forEach(i=>{const t=q[1][i];const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(i===q[2]){sOK();st.n++;$('#'+pId).textContent=st.n+' / '+list.length;$('#'+sayId).className='say ok';$('#'+sayId).textContent='⭕ '+q[3];hud();if(st.n>=list.length){say(done||'완료 🎉',3000);confetti(['✨','🎉'])}show()}else{sNO();b.classList.add('wrong','shake');$('#'+sayId).className='say bad';$('#'+sayId).textContent='❌ 다시 생각해 보세요.'}};$('#'+oId).appendChild(b)})}
 st.reset=()=>{st.n=0;$('#'+pId).textContent='0 / '+list.length;show()};st.done=()=>st.n>=list.length;st.solve=()=>{let g=0;while(st.n<list.length&&g++<500){const q=list[st.n];const b=[...$('#'+oId).children].find(x=>x.textContent===q[1][q[2]]);if(!b)break;b.click()}};return st}

  if(n===3&&!LAB._c1){LAB._c1=1;$('#s1').textContent='🎉 에너지는 한 형태에서 여러 가지 다른 형태로 전환돼요. 미끄럼틀·전기 자동차·선풍기 모두 처음 에너지가 운동·소리·열·빛 에너지 등으로 전환!';say('에너지 전환 완료 🎉',3000);confetti(['♻️','⚡'])}hud()}else{sNO();$('#s1').className='say bad';$('#s1').textContent='❌ 다시 생각해 보세요. 화살표가 어떤 현상을 가리키는지 보세요.'}}
function draw1(){const{g}=view($('#c1'),LW,LH);g.fillStyle='#f7f0e6';g.fillRect(0,0,LW,LH);const M=pic(g,'cv',0,0,800,440);CM=M;BK.forEach((b,i)=>{const p=M(b.u,b.v);const on=i===bk&&!fill[i];g.fillStyle=fill[i]?'#dcfce7':on?'#fef08a':'#fff';g.strokeStyle=fill[i]?'#16a34a':on?'#dc2626':'#f59e0b';g.lineWidth=on?4:3;g.fillRect(p[0]-26,p[1]-14,52,28);g.strokeRect(p[0]-26,p[1]-14,52,28);g.fillStyle='#0f172a';g.font='900 16px sans-serif';g.textAlign='center';g.fillText(fill[i]||'❓',p[0],p[1]+6)});g.restore()}
const DV=[{n:'🛝 미끄럼틀',src:[.05,.05,.38,.95],in:'위치',o:[['운동',60,'#c084fc'],['열',35,'#ef4444'],['소리',5,'#10b981']]},{n:'🚗 전기 자동차',src:[.47,.08,.38,.47],in:'전기',o:[['운동',70,'#c084fc'],['열',20,'#ef4444'],['소리',5,'#10b981'],['빛',5,'#facc15']]},{n:'🌀 선풍기',src:[.58,.5,.42,.5],in:'전기',o:[['운동',80,'#c084fc'],['열',15,'#ef4444'],['소리',5,'#10b981']]}];let dv=-1,seen2={};
function rdv(){$('#dv2').innerHTML='';DV.forEach((d,i)=>{const b=document.createElement('button');b.className='btn'+(i===dv?' on2':'');b.textContent=d.n+(seen2[i]?' ✔':'');b.onclick=()=>pick2(i);$('#dv2').appendChild(b)})}
function pick2(i){dv=i;seen2[i]=1;const d=DV[i];$('#sm2').textContent=d.o.map(x=>x[1]).join(' + ')+' = 100 J';$('#tg2').textContent=d.n+': '+d.in+' 에너지 100 J';const n=Object.keys(seen2).length;$('#p2').textContent=n+' / 3';rdv();sTap();
 if(n===3&&!LAB._c2){LAB._c2=1;sOK();$('#s2').className='say ok';$('#s2').textContent='🎉 에너지가 전환될 때 새로 생기거나 사라지지 않고 총량이 일정하게 보존돼요(에너지 보존 법칙). 다만 열에너지처럼 다시 쓰기 어려운 형태로 일부가 전환돼요.';say('에너지 보존 확인 🎉',3000);confetti(['⚖','♻️'])}hud()}
function draw2(){const{g}=view($('#c2'),LW,LH);g.fillStyle='#f7f0e6';g.fillRect(0,0,LW,LH);if(dv<0){pic(g,'cv',0,0,800,440);g.restore();return}const d=DV[dv];pic(g,'cv',0,40,300,360,d.src);
 g.fillStyle='#3b82f6';const x0=330,top=80,H=270;g.fillRect(x0,top,60,H);g.fillStyle='#fff';g.font='900 18px sans-serif';g.textAlign='center';g.save();g.translate(x0+30,top+H/2);g.rotate(-Math.PI/2);g.fillText(d.in+' 에너지 100 J',0,6);g.restore();
 let y=top;d.o.forEach(o=>{const h=H*o[1]/100;g.fillStyle=o[2]+'99';g.beginPath();g.moveTo(x0+60,y);g.bezierCurveTo(x0+150,y,x0+190,y+(o===d.o[0]?0:(d.o.indexOf(o))*18),x0+260,y+d.o.indexOf(o)*18);g.lineTo(x0+260,y+h+d.o.indexOf(o)*18);g.bezierCurveTo(x0+190,y+h+d.o.indexOf(o)*18,x0+150,y+h,x0+60,y+h);g.fill();g.fillStyle=o[2];g.fillRect(x0+260,y+d.o.indexOf(o)*18,40,h);g.fillStyle='#0f172a';g.textAlign='left';g.font='900 '+(h>18?20:15)+'px sans-serif';g.fillText(o[0]+' '+o[1]+' J',x0+310,y+d.o.indexOf(o)*18+h/2+7);y+=h});
 g.fillStyle='#16a34a';g.font='900 24px sans-serif';g.textAlign='center';g.fillText('합계 100 J (보존!)',560,60);g.restore()}
let MC3,q3=0;const Q3=[['광합성','빛에너지 → 화학 에너지'],['건전지','화학 에너지 → 전기 에너지'],['태양 전지','빛에너지 → 전기 에너지'],['전기다리미','전기 에너지 → 열에너지'],['스피커','전기 에너지 → 소리 에너지']];
function draw3(){const{g}=view($('#c3'),LW,LH);g.fillStyle='#f8fafc';g.fillRect(0,0,LW,LH);g.textAlign='left';Q3.forEach((q,i)=>{const y=30+i*80,done=i<q3;g.fillStyle=i===q3?'#fef3c7':'#fff';g.strokeStyle=i===q3?'#f59e0b':'#cbd5e1';g.lineWidth=3;g.fillRect(40,y,720,66);g.strokeRect(40,y,720,66);g.font='44px serif';g.fillText(['🌿','🔋','☀️','👕','🔊'][i],56,y+50);g.fillStyle='#0f172a';g.font='900 26px sans-serif';g.fillText(q[0],120,y+43);g.fillStyle=done?'#16a34a':'#94a3b8';g.font='800 24px sans-serif';g.fillText(done?q[1]:'? → ?',330,y+43)});g.restore()}

 {q:'미끄럼틀을 내려올 때 위치 에너지는 어떤 에너지로 전환될까?',o:['운동·열·소리 에너지','전기 에너지만','화학 에너지'],a:0,e:'여러 에너지로'},
 {q:'선풍기의 주된 에너지 전환은?',o:['전기 에너지 → 운동 에너지','운동 → 전기','빛 → 열'],a:0,e:'날개 회전'},
 {q:'광합성에서의 에너지 전환은?',o:['빛에너지 → 화학 에너지','화학 → 빛','열 → 전기'],a:0,e:'양분 생성'},
 {q:'전기 에너지 100 J이 빛 10 J로 전환되었다면 나머지 90 J은?',o:['주로 열에너지로 전환되었다','사라졌다','다시 전기로'],a:0,e:'보존'},
 {q:'에너지 총량이 보존되는데 에너지를 절약해야 하는 까닭은?',o:['다시 사용하기 어려운 열에너지 등으로 전환되기 때문','에너지가 사라지기 때문','법으로 정해져서'],a:0,e:'쓸모 있는 에너지 감소'},
 {q:'소리 에너지란?',o:['물체가 진동할 때 공기의 진동으로 전달되는 에너지','빛이 가진 에너지','온도 차이로 이동하는 에너지'],a:0,e:'진동'}],
 segs:()=>[['에너지 전환 빈칸',!!LAB._c1],['에너지 보존',!!LAB._c2],['생활 속 전환',MC3&&MC3.done()]],
 reset(){LAB._c1=0;LAB._c2=0;fill={};bk=0;rop();$('#p1').textContent='0 / 3';dv=-1;seen2={};rdv();$('#sm2').textContent='-';$('#p2').textContent='0 / 3';MC3.reset();['#s1','#s2','#s3'].forEach(s=>$(s).className='say')},
 init(){rop();rdv();tapPick($('#c1'),()=>CM&&mode===1?BK.map(b=>CM(b.u,b.v)):[],i=>{bk=i;rop();sTap()});
  MC3=MCSeq('q3q','q3o','p3','s3',Q3.map((q,i)=>[q[0]+'에서 일어나는 에너지 전환은?',[q[1],Q3[(i+1)%5][1],Q3[(i+3)%5][1]],0,q[0]+': '+q[1]]),'생활 속 에너지 전환 완료 🎉',n=>{q3=n;$('#tg3').textContent=n<5?Q3[n][0]:'정리'})},
