<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올인원 사이언스 마블 (All-in-One Science Marble)</title>
<style>
:root {
  --bg: #070b14;
  --panel-bg: rgba(15, 23, 42, 0.9);
  --board-bg: #050811;
  --cell-bg: #0f172a;
  --cell-border: #1e293b;
  --cyan: #06b6d4;
  --yellow: #facc15;
  --red: #ef4444;
  --blue: #3b82f6;
  --green: #10b981;
  --purple: #a855f7;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #070b14 70%, #020408 100%);
  color: var(--text-main);
  font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  padding: 8px 12px 24px;
}

/* 통일 네비게이션 헤더 */
header.unified-game-header {
  width: 100%;
  max-width: 1400px;
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(6, 182, 212, 0.3);
  border-radius: 16px;
  padding: 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 8px;
  box-shadow: 0 4px 25px rgba(6, 182, 212, 0.15);
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.game-badge {
  background: linear-gradient(135deg, #06b6d4, #a855f7);
  color: #fff;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 10px rgba(6, 182, 212, 0.4);
}
.game-title {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
  background: linear-gradient(90deg, #67e8f9, #facc15, #f43f5e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.unified-nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-unified-nav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-unified-nav:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  transform: translateY(-2px);
  border-color: rgba(6, 182, 212, 0.5);
  box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
}

/* 단원 선택 바 (Unit Selector Bar) */
.unit-selector-bar {
  width: 100%;
  max-width: 1400px;
  background: rgba(30, 41, 59, 0.85);
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 10px;
}
.selector-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.selector-label {
  font-size: 14px;
  font-weight: 800;
  color: #facc15;
  display: flex;
  align-items: center;
  gap: 6px;
}
.unit-select-box {
  background: #0f172a;
  color: #fff;
  border: 1.5px solid #475569;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 14px;
  font-weight: 700;
  outline: none;
  cursor: pointer;
}
.unit-select-box:focus {
  border-color: #06b6d4;
  box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
}
.btn-apply-unit {
  background: linear-gradient(135deg, #06b6d4, #2563eb);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 7px 16px;
  font-size: 13.5px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-apply-unit:hover {
  transform: scale(1.04);
  box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
}

/* 대시보드 (모둠 전광판) */
.team-dashboard {
  width: 100%;
  max-width: 1400px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.team-card {
  background: rgba(15, 23, 42, 0.8);
  border: 2px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.team-card.active-turn {
  transform: scale(1.03);
  box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
  border-color: #06b6d4;
  background: rgba(15, 23, 42, 0.95);
}
.team-card.active-turn::after {
  content: "현재 턴!";
  position: absolute;
  top: 6px;
  right: 8px;
  background: #06b6d4;
  color: #000;
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from { opacity: 0.7; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1.05); }
}
.team-avatar {
  font-size: 30px;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
  border: 2px solid;
}
.team-1 .team-avatar { border-color: var(--red); color: var(--red); }
.team-2 .team-avatar { border-color: var(--blue); color: var(--blue); }
.team-3 .team-avatar { border-color: var(--green); color: var(--green); }
.team-4 .team-avatar { border-color: var(--yellow); color: var(--yellow); }

.team-info { flex: 1; min-width: 0; }
.team-name { font-size: 14.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.team-pts { font-size: 19px; font-weight: 900; color: #facc15; font-variant-numeric: tabular-nums; }
.team-stats { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; margin-top: 2px; }

/* 메인 게임 영역 */
.game-container {
  width: 100%;
  max-width: 1400px;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}


/* 참가자 및 모둠 설정 전용 스타일 */
.pill-group {
  display: inline-flex;
  background: #090e1a;
  border: 1.5px solid #334155;
  border-radius: 9px;
  padding: 2px;
  gap: 2px;
}
.pill-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.pill-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}
.pill-btn.active {
  background: linear-gradient(135deg, #06b6d4, #2563eb);
  color: #fff;
  box-shadow: 0 1px 6px rgba(6, 182, 212, 0.4);
}
.btn-player-modal-trigger {
  background: rgba(245, 158, 11, 0.15);
  border: 1.5px solid #f59e0b;
  color: #fbbf24;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
}
.btn-player-modal-trigger:hover {
  background: #f59e0b;
  color: #000;
  transform: translateY(-1px);
}
.btn-player-card {
  background: #090e1a;
  border: 2px solid #334155;
  border-radius: 14px;
  padding: 14px 10px;
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
  text-align: center;
}
.btn-player-card:hover {
  border-color: #06b6d4;
  background: #131c31;
}
.btn-player-card.active {
  border-color: #06b6d4;
  background: rgba(6, 182, 212, 0.18);
  box-shadow: 0 0 18px rgba(6, 182, 212, 0.35);
}
.btn-preset-tab {
  flex: 1;
  background: #090e1a;
  border: 1.5px solid #334155;
  border-radius: 10px;
  padding: 10px 14px;
  color: #cbd5e1;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-preset-tab:hover {
  border-color: #facc15;
  color: #fff;
}
.btn-preset-tab.active {
  background: rgba(250, 204, 21, 0.15);
  border-color: #facc15;
  color: #fde047;
}
.player-input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #0f172a;
  border: 1.5px solid #334155;
  border-radius: 10px;
  padding: 8px 12px;
}
.player-color-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
}
.player-name-input {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 14.5px;
  font-weight: 700;
  outline: none;
  width: 100%;
}

/* 7x7 사각 그리드 보드판 */
.board-wrapper {
  position: relative;
  width: 100%;
  max-width: 1020px;
  aspect-ratio: 1 / 1;
  background: var(--board-bg);
  border: 4px solid #1e293b;
  border-radius: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px rgba(6, 182, 212, 0.15);
  display: grid;
  grid-template-columns: 1.4fr repeat(5, 1fr) 1.4fr;
  grid-template-rows: 1.4fr repeat(5, 1fr) 1.4fr;
  gap: 5px;
  padding: 6px;
}

/* 타일 스타일 */
.tile {
  background: #0f172a;
  border: 1.5px solid #1e293b;
  border-radius: 10px;
  padding: 4px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.2s ease;
  font-size: 11px;
}
.tile:hover {
  border-color: #06b6d4;
  transform: scale(1.02);
  z-index: 10;
  box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
}
.tile-corner {
  background: linear-gradient(135deg, #1e1b4b, #0f172a);
  border: 2px solid #6366f1;
}
.tile-header {
  width: 100%;
  font-size: 10px;
  font-weight: 700;
  padding: 2px;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cat-sec0 { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }
.cat-sec1 { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }
.cat-sec2 { background: rgba(16, 185, 129, 0.25); color: #86efac; }
.cat-sec3 { background: rgba(245, 158, 11, 0.25); color: #fde047; }
.cat-chance { background: rgba(168, 85, 247, 0.25); color: #d8b4fe; }
.cat-corner { background: rgba(6, 182, 212, 0.25); color: #a5f3fc; }

.tile-icon { font-size: clamp(16px, 2.2vw, 26px); margin: 2px 0; }
.tile-title { font-size: clamp(10px, 1.1vw, 13px); font-weight: 800; line-height: 1.15; word-break: keep-all; }
.tile-price { font-size: 10.5px; font-weight: 700; color: #facc15; }

/* 소유자 표시 깃발 & 기지 레벨 */
.tile-owner-badge {
  position: absolute;
  top: 3px;
  left: 3px;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 800;
  color: #fff;
  z-index: 5;
}
.tile-level {
  position: absolute;
  bottom: 3px;
  right: 3px;
  font-size: 10px;
  font-weight: 800;
  display: flex;
  gap: 1px;
}

/* 말 (Player Tokens) */
.tokens-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 3px;
  pointer-events: none;
  z-index: 20;
}
.p-token {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 8px currentColor;
  border: 2px solid #fff;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  animation: bounceToken 0.5s ease;
}
@keyframes bounceToken {
  0% { transform: scale(0) translateY(-20px); }
  70% { transform: scale(1.2) translateY(5px); }
  100% { transform: scale(1) translateY(0); }
}

/* 보드판 중앙 광장 */
.board-center {
  grid-column: 2 / 7;
  grid-row: 2 / 7;
  background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
  border: 2px dashed rgba(6, 182, 212, 0.25);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  position: relative;
  overflow: hidden;
}

.broadcast-panel {
  width: 100%;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(6, 182, 212, 0.2);
  border-radius: 12px;
  padding: 10px 16px;
  text-align: center;
}
.round-badge {
  font-size: 13px;
  font-weight: 800;
  color: var(--cyan);
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.broadcast-msg {
  font-size: clamp(14px, 1.8vw, 20px);
  font-weight: 800;
  line-height: 1.3;
}

/* 주사위 인터랙션 */
.dice-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin: 10px 0;
}
.dice-pair {
  display: flex;
  gap: 20px;
}
.dice-box {
  width: 72px;
  height: 72px;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: inset 0 -4px 0 #cbd5e1, 0 8px 25px rgba(0,0,0,0.6), 0 0 15px rgba(6, 182, 212, 0.3);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 8px;
  transform: rotate(0deg);
  transition: transform 0.4s ease;
}
.dice-pip {
  width: 12px;
  height: 12px;
  background: #0f172a;
  border-radius: 50%;
  justify-self: center;
  align-self: center;
  visibility: hidden;
}
.dice-box.rolling {
  animation: roll3D 0.6s infinite linear;
}
@keyframes roll3D {
  0% { transform: rotate(0deg) scale(0.9); }
  50% { transform: rotate(180deg) scale(1.1); }
  100% { transform: rotate(360deg) scale(0.9); }
}

.btn-roll {
  background: linear-gradient(135deg, #06b6d4, #2563eb);
  color: #fff;
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 900;
  padding: 14px 36px;
  border-radius: 999px;
  border: 3px solid #67e8f9;
  box-shadow: 0 8px 25px rgba(6, 182, 212, 0.5), inset 0 2px 0 rgba(255,255,255,0.6);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-roll:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 12px 30px rgba(6, 182, 212, 0.7);
}
.btn-roll:active:not(:disabled) {
  transform: translateY(1px) scale(0.98);
}
.btn-roll:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  filter: grayscale(1);
}

.center-tools {
  display: flex;
  gap: 8px;
}
.btn-tool {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #e2e8f0;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-tool:hover {
  background: rgba(255, 255, 255, 0.25);
  color: #fff;
}

/* 대형 모달 (전자칠판 퀴즈 & 배틀 & 찬스) */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.active {
  display: flex;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.quiz-modal-box {
  background: #090e1a;
  border: 3px solid #06b6d4;
  border-radius: 24px;
  max-width: 840px;
  width: 100%;
  padding: 28px;
  box-shadow: 0 15px 50px rgba(6, 182, 212, 0.3);
  text-align: center;
  position: relative;
  animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popUp {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);

/* ==========================================================================
   1. 오디오 효과음 시스템 (Web Audio API)
   ========================================================================== */
class SoundFx {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type = 'sine', duration = 0.15, vol = 0.1) {
    if (!this.enabled) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  }
  diceRoll() {
    for (let i = 0; i < 6; i++) {
      setTimeout(() => this.playTone(200 + Math.random() * 250, 'square', 0.04, 0.08), i * 70);
    }
  }
  step() {
    this.playTone(500, 'triangle', 0.05, 0.08);
  }
  correct() {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.18, 0.12), i * 85);
    });
  }
  wrong() {
    [260, 200, 150].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.16, 0.1), i * 100);
    });
  }
  upgrade() {
    [440, 554, 659, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'square', 0.18, 0.1), i * 90);
    });
  }
  fanfare() {
    const notes = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.50];
    const times = [0, 120, 240, 360, 480, 700];
    notes.forEach((f, idx) => {
      setTimeout(() => this.playTone(f, 'triangle', 0.35, 0.15), times[idx]);
    });
  }
}

// 범용 단원 타일 생성기 (DB에 없는 단원도 완벽 16문항 생성)
function generateGenericUnitTiles(unitName) {
  const icons = ["🔬", "⚗️", "🧪", "🔭", "📐", "💡", "⚡", "🌡️", "💎", "🌋", "🌪️", "🪐", "🧬", "🌿", "🐾", "🏆"];
  const subtopics = ["핵심 탐구", "원리와 법칙", "자료 해석", "실생활 응용"];
  const questions = [
    { q: `[${unitName}] 탐구 과정에서 가설을 검증하기 위해 가장 적절한 방법은?`, opts: ["통제된 조건에서 실험 수행", "주관적 직관에 의존", "오차를 임의로 조작", "한 번의 관찰로 일반화"], ans: 0, exp: "과학 탐구는 변인을 통제하고 반복 가능한 객관적 실험을 통해 가설을 검증합니다." },
    { q: `[${unitName}] 관련 현상에서 측정값의 정확도를 높이기 위한 방법은?`, opts: ["여러 번 측정하여 평균값 계산", "가장 마음에 드는 값만 선택", "측정 도구를 임의로 변경", "첫 번째 측정값만 사용"], ans: 0, exp: "반복 측정 후 평균을 구하면 우연 오차를 줄이고 신뢰도를 높일 수 있습니다." },
    { q: `[${unitName}] 실험 시 실험군과 대조군을 설정하는 주된 목적은?`, opts: ["조작 변인의 효과를 비교 확인하기 위해", "실험 시간을 2배 늘리기 위해", "실험 기구를 다 쓰기 위해", "우연한 결과를 유도하기 위해"], ans: 0, exp: "대조군을 두어야 조작 변인에 따른 결과 차이를 명확히 비교할 수 있습니다." },
    { q: `[${unitName}] 단원의 기본 원리가 실생활에 적용된 대표적 사례는?`, opts: ["안전 장치 및 첨단 기술 응용", "원시 채집 생활", "무동력 자연 방치", "단순 폐기물 매립"], ans: 0, exp: "과학적 원리는 생활 속 편리와 안전을 증진하는 다양한 기술로 응용됩니다." }
  ];

  const tiles = [];
  for (let i = 0; i < 16; i++) {
    const qObj = questions[i % 4];
    tiles.push({
      name: `${unitName} 연구소 ${i + 1}`,
      icon: icons[i % icons.length],
      unit: subtopics[Math.floor(i / 4)],
      q: qObj.q,
      opts: qObj.opts,
      ans: qObj.ans,
      exp: qObj.exp,
      price: 1000 + i * 200
    });
  }
  return tiles;
}

// 단원 타일 반환 함수
function getUnitTiles(grade, unitName) {
  const key = `${grade}_${unitName}`;
  if (DETAILED_UNITS[key]) return DETAILED_UNITS[key];
  return generateGenericUnitTiles(unitName);
}

function getGridPosition(index) {
  if (index >= 0 && index <= 6) return { row: 7, col: index + 1 };
  else if (index >= 7 && index <= 12) return { row: 7 - (index - 6), col: 7 };
  else if (index >= 13 && index <= 18) return { row: 1, col: 7 - (index - 12) };
  else return { row: index - 18 + 1, col: 1 };
}

      el.style.gridRow = pos.row;
      el.style.gridColumn = pos.col;

      let headerClass = `cat-${tile.cat}`;
      let headerText = tile.unit || (tile.cat === 'corner' ? 'SPECIAL' : 'CHANCE');
      let subInfo = "";

      if (tile.type === "prop") {
        subInfo = `<div class="tile-price">${tile.price.toLocaleString()} pt</div>`;
      } else if (tile.type === "start") {
        subInfo = `<div class="tile-price" style="color:#67e8f9;">+3,000 pt</div>`;
      } else if (tile.id === 12) {
        subInfo = `<div class="tile-price" style="color:#f472b6;">기금 수령</div>`;
      }

      el.innerHTML = `
        <div class="tile-header ${headerClass}">${headerText}</div>
        <div class="tile-icon">${tile.icon}</div>
        <div class="tile-title">${tile.name}</div>
        ${subInfo}
        <div class="tokens-container" id="tokens-${idx}"></div>
      `;

      if (tile.type === "prop") {
        el.onclick = () => this.onTileClick(idx);
        el.style.cursor = "pointer";
      }

      board.appendChild(el);
    });

    this.updateTokens();
  },

  updateTokens() {
    this.tiles.forEach((_, idx) => {
      const container = document.getElementById(`tokens-${idx}`);
      if (container) container.innerHTML = "";
    });

    this.getActiveTeams().forEach(team => {
      const container = document.getElementById(`tokens-${team.pos}`);
      if (container) {
        const token = document.createElement("div");
        token.className = "p-token";
        token.style.background = team.color;
        token.style.color = "#fff";
        token.textContent = team.symbol;
        token.title = team.name;
        container.appendChild(token);
      }
    });
  },

  renderDice(v1, v2) {
    const pipsConfig = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };
    [ { el: document.getElementById("dice1"), val: v1 },
      { el: document.getElementById("dice2"), val: v2 } ].forEach(({ el, val }) => {
      el.innerHTML = "";
      for (let i = 0; i < 9; i++) {
        const pip = document.createElement("div");
        pip.className = "dice-pip";
        if (pipsConfig[val].includes(i)) {
          pip.style.visibility = "visible";
        }
        el.appendChild(pip);
      }
    });
  },

  updateBroadcast(msg) {
    const rEl = document.getElementById("roundInfo");
    const mEl = document.getElementById("broadcastMsg");
    const curTeam = TEAMS[this.currentTeamIdx];
    rEl.textContent = `ROUND ${this.round} / ${this.maxRound} 턴`;
    if (msg) {
      mEl.innerHTML = msg;
    } else {
      mEl.innerHTML = `<b style="color:${curTeam.color};">${curTeam.name}</b>의 차례입니다! 주사위를 굴려주세요! 🎲`;
    }
  },

  rollDice() {
    if (this.isRolling) return;
    const curTeam = TEAMS[this.currentTeamIdx];

    if (curTeam.skipTurn > 0) {
      curTeam.skipTurn--;
      sfx.wrong();
      this.promptEscapeQuiz(curTeam);
      return;
    }

    this.isRolling = true;
    document.getElementById("btnRollDice").disabled = true;
    sfx.diceRoll();

    const d1 = document.getElementById("dice1");
    const d2 = document.getElementById("dice2");
    d1.classList.add("rolling");
    d2.classList.add("rolling");

    let rollCount = 0;
    const interval = setInterval(() => {
      this.renderDice(Math.floor(Math.random() * 6) + 1, Math.floor(Math.random() * 6) + 1);
      rollCount++;
      if (rollCount > 8) {
        clearInterval(interval);
        d1.classList.remove("rolling");
        d2.classList.remove("rolling");

        const val1 = Math.floor(Math.random() * 6) + 1;
        const val2 = Math.floor(Math.random() * 6) + 1;
        this.renderDice(val1, val2);

        const steps = val1 + val2;
        const isDouble = (val1 === val2);

        let doubleMsg = isDouble ? " <span style='color:#facc15;'>[더블! 주사위 한 번 더!]</span>" : "";
        this.updateBroadcast(`<b style="color:${curTeam.color}">${curTeam.name}</b> 주사위 합: <b>${steps}</b> (${val1} + ${val2})! 이동합니다...${doubleMsg}`);

        this.movePlayerAnimated(curTeam, steps, isDouble);
      }
    }, 60);
  },

  movePlayerAnimated(team, steps, isDouble) {
    let remain = steps;
    const stepInterval = setInterval(() => {
      team.pos = (team.pos + 1) % 24;
      sfx.step();
      this.updateTokens();

      if (team.pos === 0) {
        team.pts += 3000;
        sfx.fanfare();
        this.updateBroadcast(`🏁 <b>출발점 통과!</b> <b style="color:${team.color}">${team.name}</b> 기초 연구비 +3,000 pt 획득!`);
        this.updateTeamsUI();
      }

      remain--;
      if (remain <= 0) {
        clearInterval(stepInterval);
        this.isRolling = false;
        document.getElementById("btnRollDice").disabled = false;
        this.handleTileLanding(team, isDouble);
      }
    }, 140);
  },

  handleTileLanding(team, isDouble) {
    const tile = this.tiles[team.pos];

    if (tile.id === 6) {
      team.skipTurn = 1;
      sfx.wrong();
      this.updateBroadcast(`⚠️ <b style="color:${team.color}">${team.name}</b>이(가) <b>오차 분석실</b>에 진입했습니다! 오차 원인 분석으로 1턴 대기.`);
      this.finishTurn(isDouble);
      return;
    }

    if (tile.id === 12) {
      if (this.centerFund > 0) {
        team.pts += this.centerFund;
        sfx.fanfare();
        this.updateBroadcast(`🏛️ <b>과학 나눔 재단 수령!</b> <b style="color:${team.color}">${team.name}</b>이(가) 누적 연구기금 <b>+${this.centerFund.toLocaleString()} pt</b>를 전액 수령합니다!`);
        this.centerFund = 0;
        this.updateTeamsUI();
      } else {
        this.updateBroadcast(`🏛️ 과학 나눔 재단에 모인 기금이 현재 비어 있습니다.`);
      }
      this.finishTurn(isDouble);
      return;
    }

    if (tile.id === 18) {
      sfx.upgrade();
      this.warpActive = true;
      this.updateBroadcast(`🚀 <b>초공간 워프 스테이션!</b> <b style="color:${team.color}">${team.name}</b>님, 이동하고 싶은 보드판 타일을 클릭하세요!`);
      return;
    }

    if (tile.type === "chance") {
      this.triggerChanceCard(team, isDouble);
      return;
    }

    if (tile.type === "prop") {
      this.handlePropertyLanding(team, tile, isDouble);
      return;
    }

    this.finishTurn(isDouble);
  },

  handlePropertyLanding(team, tile, isDouble) {
    if (tile.owner === undefined) {
      this.openQuizModal({
        type: "buy",
        title: `🟢 기초 관측소 건립 퀴즈! [${tile.name}]`,
        sub: `문제 정답을 맞히면 연구 기지(건립비: ${tile.price.toLocaleString()} pt)를 획득합니다!`,
        q: tile.q,
        opts: tile.opts,
        ans: tile.ans,
        exp: tile.exp,
        team: team,
        tile: tile,
        isDouble: isDouble
      });
      return;
    }

    if (tile.owner === team.id) {
      const curLevel = tile.level || 1;
      if (curLevel < 3) {
        const upgradeCost = Math.floor(tile.price * 0.8);
        this.openQuizModal({
          type: "upgrade",
          title: `🔵 기지 증축 퀴즈! [${tile.name}]`,
          sub: `현재 ${curLevel}단계 ➔ ${curLevel + 1}단계 증축 (비용: ${upgradeCost.toLocaleString()} pt)`,
          q: tile.q,
          opts: tile.opts,
          ans: tile.ans,
          exp: tile.exp,
          team: team,
          tile: tile,
          isDouble: isDouble
        });
      } else {
        this.updateBroadcast(`🏆 <b style="color:${team.color}">${team.name}</b>의 <b>최고 단계 종합 연구소</b>입니다! 편안히 재충전합니다.`);
        this.finishTurn(isDouble);
      }
      return;
    }

    const ownerTeam = TEAMS[tile.owner];
    const curLevel = tile.level || 1;
    const toll = tile.toll[curLevel - 1];

    if (team.shield) {
      team.shield = false;
      sfx.correct();
      this.updateBroadcast(`🛡️ <b>연구 쉴드 발동!</b> <b style="color:${team.color}">${team.name}</b>이(가) 통행료(${toll.toLocaleString()} pt)를 100% 무료 방어했습니다!`);
      this.updateTeamsUI();
      this.finishTurn(isDouble);
      return;
    }

    this.openQuizModal({
      type: "battle",
      title: `⚡ 학술 방어 퀴즈 (통행료 면제 배틀)!`,
      sub: `<b style="color:${ownerTeam.color}">${ownerTeam.name}</b>의 기지 방문 (청구 통행료: ${toll.toLocaleString()} pt) - 정답 맞히면 통행료 0 pt 면제!`,
      q: tile.q,
      opts: tile.opts,
      ans: tile.ans,
      exp: tile.exp,
      team: team,
      ownerTeam: ownerTeam,
      tile: tile,
      toll: toll,
      isDouble: isDouble
    });
  },

  openQuizModal(data) {
    this.activeQuiz = data;
    document.getElementById("modalTypeBadge").textContent = data.title;
    document.getElementById("modalTargetInfo").innerHTML = data.sub;
    document.getElementById("modalQuestion").textContent = data.q;

    const optContainer = document.getElementById("modalOptions");
    optContainer.innerHTML = "";
    data.opts.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn-quiz-opt";
      btn.innerHTML = `<span class="opt-num">${idx + 1}</span> <span>${opt}</span>`;
      btn.onclick = () => this.solveQuiz(idx);
      optContainer.appendChild(btn);
    });

    const expEl = document.getElementById("modalExplanation");
    expEl.style.display = "none";
    expEl.className = "quiz-explanation";
    document.getElementById("btnModalNext").style.display = "none";

    document.getElementById("quizModal").classList.add("active");
  },

  solveQuiz(selectedIdx) {
    const q = this.activeQuiz;
    const isCorrect = (selectedIdx === q.ans);
    const expEl = document.getElementById("modalExplanation");
    const nextBtn = document.getElementById("btnModalNext");

    document.querySelectorAll(".btn-quiz-opt").forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.ans) {
        btn.style.borderColor = "#10b981";
        btn.style.background = "rgba(16, 185, 129, 0.25)";
      } else if (idx === selectedIdx && !isCorrect) {
        btn.style.borderColor = "#ef4444";
        btn.style.background = "rgba(239, 68, 68, 0.25)";
      }
    });

    expEl.style.display = "block";

    if (isCorrect) {
      sfx.correct();
      expEl.className = "quiz-explanation";
      expEl.innerHTML = `🎉 <b>정답입니다!</b><br>${q.exp}`;

      if (q.type === "buy") {
        if (q.team.pts >= q.tile.price) {
          q.team.pts -= q.tile.price;
          q.tile.owner = q.team.id;
          q.tile.level = 1;
          q.team.bases++;
          sfx.upgrade();
          this.updateBroadcast(`🟢 <b style="color:${q.team.color}">${q.team.name}</b>이(가) [${q.tile.name}]에 기초 관측소를 건립했습니다!`);
        } else {
          this.updateBroadcast(`⚠️ 연구비가 부족하여 관측소를 매입하지 못했습니다.`);
        }
      } else if (q.type === "upgrade") {
        const upgradeCost = Math.floor(q.tile.price * 0.8);
        if (q.team.pts >= upgradeCost) {
          q.team.pts -= upgradeCost;
          q.tile.level = (q.tile.level || 1) + 1;
          sfx.upgrade();
          this.updateBroadcast(`🔵 <b style="color:${q.team.color}">${q.team.name}</b>이(가) [${q.tile.name}] 기지를 ${q.tile.level}단계로 증축 성공!`);
        }
      } else if (q.type === "battle") {
        this.updateBroadcast(`🎉 <b>학술 방어 성공!</b> <b style="color:${q.team.color}">${q.team.name}</b>이(가) 개념 퀴즈를 맞혀 통행료를 전액 면제받았습니다! (0 pt 지불)`);
      } else if (q.type === "escape") {
        q.team.skipTurn = 0;
        this.updateBroadcast(`🔓 <b>오차 원인 규명 성공!</b> 다음 턴 정상적으로 출발할 수 있습니다.`);
      }
    } else {
      sfx.wrong();
      expEl.className = "quiz-explanation wrong";
      expEl.innerHTML = `❌ <b>아쉽습니다! 오답입니다.</b><br>정답: <b>${q.opts[q.ans]}</b><br>${q.exp}`;

      if (q.type === "battle") {
        const actualToll = Math.min(q.team.pts, q.toll);
        q.team.pts -= actualToll;
        q.ownerTeam.pts += actualToll;
        this.updateBroadcast(`💸 <b>방어 실패!</b> <b style="color:${q.team.color}">${q.team.name}</b>이(가) <b style="color:${q.ownerTeam.color}">${q.ownerTeam.name}</b>에게 통행료 <b>${actualToll.toLocaleString()} pt</b>를 송금했습니다.`);
      } else if (q.type === "buy" || q.type === "upgrade") {
        this.updateBroadcast(`💡 퀴즈 오답으로 기지 인수가 보류되었습니다.`);
      }
    }

    this.updateTeamsUI();
    this.renderBoard();

    nextBtn.style.display = "block";
    nextBtn.onclick = () => {
      document.getElementById("quizModal").classList.remove("active");
      this.finishTurn(q.isDouble);
    };
  },

  promptEscapeQuiz(team) {
    this.openQuizModal({
      type: "escape",
      title: `🔓 오차 분석실 탈출 퀴즈!`,
      sub: `실험실 안전 및 오차 관련 질문에 올바르게 답하면 다음 턴 즉시 탈출합니다!`,
      q: "실험 도중 시험관의 액체를 가열할 때 시험관 입구가 향해야 하는 안전한 방향은?",
      opts: ["자신의 얼굴 방향", "친구가 있는 방향", "사람이 없는 빈 공간", "창문 바로 앞"],
      ans: 2,
      exp: "가열 중 액체가 갑자기 튀어 화상을 입을 수 있으므로 항상 사람이 없는 쪽을 향해야 합니다.",
      team: team,
      isDouble: false
    });
  },

  triggerChanceCard(team, isDouble) {
    const card = CHANCE_CARDS[Math.floor(Math.random() * CHANCE_CARDS.length)];
    sfx.fanfare();
    document.getElementById("chanceIcon").textContent = card.icon;
    document.getElementById("chanceTitle").textContent = card.title;
    document.getElementById("chanceDesc").textContent = card.desc;

    document.getElementById("btnChanceConfirm").onclick = () => {
      card.action(team);
      document.getElementById("chanceModal").classList.remove("active");
      this.updateTeamsUI();
      this.updateBroadcast(`⚡ 찬스 카드 발동: <b>[${card.title}]</b> (${team.name})`);
      this.finishTurn(isDouble);
    };

    document.getElementById("chanceModal").classList.add("active");
  },

  onTileClick(tileIdx) {
    if (!this.warpActive) return;
    this.warpActive = false;
    const curTeam = TEAMS[this.currentTeamIdx];
    curTeam.pos = tileIdx;
    sfx.fanfare();
    this.updateTokens();
    this.updateBroadcast(`🛸 <b>초공간 워프 완료!</b> <b style="color:${curTeam.color}">${curTeam.name}</b>이(가) [${this.tiles[tileIdx].name}] 칸으로 순간이동했습니다!`);
    this.handleTileLanding(curTeam, false);
  },

  finishTurn(isDouble) {
    if (isDouble) {
      sfx.upgrade();
      this.updateBroadcast(`🔥 <b>더블 탐구 보너스!</b> <b style="color:${TEAMS[this.currentTeamIdx].color}">${TEAMS[this.currentTeamIdx].name}</b> 주사위를 한 번 더 던집니다! 🎲`);
      return;
    }

    this.currentTeamIdx = (this.currentTeamIdx + 1) % this.playerCount;
    if (this.currentTeamIdx === 0) {
      this.round++;
      if (this.round > this.maxRound) {
        this.endGame();
        return;
      }
    }

    this.updateBroadcast();
    this.updateTeamsUI();
  },

  endGame() {
    sfx.fanfare();
    const ranked = [...this.getActiveTeams()].sort((a, b) => {
      const valA = a.pts + a.bases * 2000;
      const valB = b.pts + b.bases * 2000;
      return valB - valA;
    });

    const podium = document.getElementById("podiumArea");
    if (this.playerCount === 2) {
      podium.innerHTML = `
        <div class="podium-place p-2" style="height:170px;">
          <span style="font-size:36px;">🥈 2위</span>

        <div class="podium-place p-1" style="height:210px;">
          <span style="font-size:46px;">👑 1위</span>

          <span style="color:#facc15; font-size:22px; font-weight:900;">${(ranked[0].pts + ranked[0].bases * 2000).toLocaleString()} pt</span>
          <span style="font-size:14px; color:#fde047;">기지 ${ranked[0].bases}곳 (사이언스 마스터)</span>
        </div>
      `;
    } else if (this.playerCount === 3) {
      podium.innerHTML = `
        <div class="podium-place p-2">
          <span style="font-size:32px;">🥈 2위</span>
          <b style="color:${ranked[1].color}; font-size:18px; margin:4px 0;">${ranked[1].name}</b>
          <span style="color:#06b6d4; font-weight:800;">${(ranked[1].pts + ranked[1].bases * 2000).toLocaleString()} pt</span>
          <span style="font-size:12px; color:#94a3b8;">기지 ${ranked[1].bases}곳</span>
        </div>
        <div class="podium-place p-1">
          <span style="font-size:42px;">👑 1위</span>
          <b style="color:${ranked[0].color}; font-size:22px; margin:6px 0;">${ranked[0].name}</b>
          <span style="color:#facc15; font-size:20px; font-weight:900;">${(ranked[0].pts + ranked[0].bases * 2000).toLocaleString()} pt</span>
          <span style="font-size:13px; color:#fde047;">기지 ${ranked[0].bases}곳 (사이언스 마스터)</span>
        </div>
        <div class="podium-place p-3">
          <span style="font-size:28px;">🥉 3위</span>

          <span style="color:#06b6d4; font-weight:800;">${(ranked[2].pts + ranked[2].bases * 2000).toLocaleString()} pt</span>
          <span style="font-size:12px; color:#94a3b8;">기지 ${ranked[2].bases}곳</span>
        </div>
      `;
    } else {
      podium.innerHTML = `
        <div class="podium-place p-2">
          <span style="font-size:32px;">🥈 2위</span>
          <b style="color:${ranked[1].color}; font-size:18px; margin:4px 0;">${ranked[1].name}</b>
          <span style="color:#06b6d4; font-weight:800;">${(ranked[1].pts + ranked[1].bases * 2000).toLocaleString()} pt</span>
          <span style="font-size:12px; color:#94a3b8;">기지 ${ranked[1].bases}곳</span>
        </div>
        <div class="podium-place p-1">
          <span style="font-size:42px;">👑 1위</span>
          <b style="color:${ranked[0].color}; font-size:22px; margin:6px 0;">${ranked[0].name}</b>
          <span style="color:#facc15; font-size:20px; font-weight:900;">${(ranked[0].pts + ranked[0].bases * 2000).toLocaleString()} pt</span>
          <span style="font-size:13px; color:#fde047;">기지 ${ranked[0].bases}곳 (사이언스 마스터)</span>
        </div>
        <div class="podium-place p-3">
          <span style="font-size:28px;">🥉 3위</span>
          <b style="color:${ranked[2].color}; font-size:16px; margin:4px 0;">${ranked[2].name}</b>
          <span style="color:#06b6d4; font-weight:800;">${(ranked[2].pts + ranked[2].bases * 2000).toLocaleString()} pt</span>
          <span style="font-size:12px; color:#94a3b8;">기지 ${ranked[2].bases}곳</span>
        </div>
      `;
      if (ranked[3]) {
        const p4 = document.createElement("div");
        p4.style.marginTop = "14px";

        p4.innerHTML = `4위: <b style="color:${ranked[3].color}">${ranked[3].name}</b> (${(ranked[3].pts + ranked[3].bases * 2000).toLocaleString()} pt / 기지 ${ranked[3].bases}곳)`;
        podium.parentElement.insertBefore(p4, document.getElementById("btnPlayAgain"));
      }
    }

    document.getElementById("victoryModal").classList.add("active");
  },

  renderGuide() {
    const list = document.getElementById("guideList");
    const title = document.getElementById("guideModalTitle");
    title.textContent = `📖 [${this.curGrade} · ${this.curUnit}] 탐구 도감`;
    list.innerHTML = "";
    this.tiles.filter(t => t.type === 'prop').forEach(t => {
      const item = document.createElement("div");
      item.style.padding = "8px";
      item.style.background = "#0f172a";
      item.style.borderRadius = "8px";
      item.style.border = "1px solid #1e293b";
      item.innerHTML = `<b>${t.icon} ${t.name}</b> <span style="color:#06b6d4;">[${t.unit}]</span><br><span style="color:#94a3b8; font-size:12px;">${t.exp}</span>`;
      list.appendChild(item);
    });
  },

  bindEvents() {
    document.getElementById("btnRollDice").onclick = () => this.rollDice();
    document.getElementById("btnRestart").onclick = () => {
      if (confirm("새 게임을 시작하시겠습니까?")) location.reload();
    };
    document.getElementById("btnSound").onclick = (e) => {
      sfx.enabled = !sfx.enabled;
      e.target.textContent = sfx.enabled ? "🔊 효과음 On" : "🔇 효과음 Off";
    };
    document.getElementById("btnGuide").onclick = () => {
      document.getElementById("guideModal").classList.add("active");
    };
    document.getElementById("btnPlayAgain").onclick = () => {
      document.getElementById("victoryModal").classList.remove("active");
      this.resetGame();
    };

    [10, 15, 20].forEach(n => {
      const btn = document.getElementById(`btnMaxTurn${n}`);
      if (btn) btn.onclick = () => this.setMaxTurn(n);
    });

    const selG = document.getElementById("selGrade");
    const selU = document.getElementById("selUnit");
    selG.onchange = () => {
      this.curGrade = selG.value;
      selU.innerHTML = "";
      CURRICULUM_MAP[this.curGrade].forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        selU.appendChild(opt);
      });
    };

    document.getElementById("btnApplyUnit").onclick = () => {
      this.curGrade = selG.value;
      this.curUnit = selU.value;
      this.resetGame();
      this.updateBroadcast(`🎯 <b>[${this.curGrade} · ${this.curUnit}]</b> 단원으로 보드판이 갱신되었습니다!`);
    };

    const btnPSet = document.getElementById("btnPlayerSettings");
    if (btnPSet) btnPSet.onclick = () => this.openPlayerModal();
  },

  resetGame() {
    this.round = 1;
    this.currentTeamIdx = 0;
    this.centerFund = 2000;
    this.getActiveTeams().forEach(t => {
      t.pts = this.startPts;
      t.pos = 0;
      t.skipTurn = 0;
      t.bases = 0;
      t.shield = false;
    });
    this.tiles.forEach(tile => {
      if (tile.owner !== undefined) {
        delete tile.owner;
        delete tile.level;
      }
    });
    this.buildTiles();
    this.renderTeams();
    this.renderBoard();
    this.updateBroadcast(`🎲 <b>[${this.curGrade} · ${this.curUnit}]</b> (${this.playerCount}${this.gameMode === 'team' ? '모둠' : '인'}) 게임이 준비되었습니다!`);
  },

  setMaxTurn(val) {
    this.maxRound = val;
    [10, 15, 20].forEach(n => {
      const btn = document.getElementById(`btnMaxTurn${n}`);
      if (n === val) {
        btn.style.borderColor = "#06b6d4";
        btn.style.color = "#06b6d4";
      } else {
        btn.style.borderColor = "rgba(255,255,255,0.2)";
        btn.style.color = "#e2e8f0";
      }
    });
    this.updateBroadcast();
  }
};

window.addEventListener("DOMContentLoaded", () => {
  game.init();
});
</script>
