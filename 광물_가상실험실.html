<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>광물 가상실험실 – 광물의 5대 특성 탐구</title>
<style>
:root{
  --bg:#efece0;--ink:#1f2933;--line:#d4cdb8;--navy:#17324d;
  --accent:#1d6fb8;--good:#2b8a3e;--bad:#c92a2a;
  --fs:clamp(15px,1.25vw,26px);
  --hdr:max(60px,7vh);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);font-size:var(--fs);
  user-select:none;-webkit-user-select:none;overflow:hidden;
  display:flex;flex-direction:column;
}
button,select{font-family:inherit;font-size:1em;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0}

/* ===== 슬림 헤더 ===== */
header{
  display:flex;align-items:center;gap:10px;padding:6px 12px;
  background:var(--navy);color:#fff;min-height:var(--hdr);flex-wrap:wrap;
}
.brand{font-weight:900;font-size:1.1em;white-space:nowrap;margin-right:6px}
.tabs{display:flex;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.tab{
  min-height:52px;padding:0 18px;border-radius:14px;background:#2c4b6b;color:#cfe0f1;
  font-weight:800;font-size:.95em;
}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 2px 0 #9db6cf}
.tools{display:flex;gap:8px}
.tbtn{min-width:52px;min-height:52px;padding:0 14px;border-radius:14px;background:#2c4b6b;color:#fff;font-weight:700;font-size:.9em}
.tbtn:active,.tab:active{transform:scale(.97)}

/* ===== 본문 ===== */
main{flex:1;min-height:0;display:flex;gap:10px;padding:8px 10px}
#stageCol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
#stage{
  position:relative;aspect-ratio:1200/720;
  width:min(100%,calc((100vh - var(--hdr) - 60px - 40px)*1.6667));
  background:#efece0;border-radius:14px;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
#cv{width:100%;height:100%;display:block;touch-action:none}
#toast{
  position:absolute;left:50%;top:10px;transform:translate(-50%,-20px);
  background:#fff8e1;border:3px solid #f08c00;border-radius:16px;padding:12px 18px;
  font-weight:800;font-size:.95em;max-width:92%;text-align:center;
  opacity:0;pointer-events:none;transition:.25s;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)
}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{margin-left:10px;min-height:48px;padding:0 14px;border-radius:12px;background:#f08c00;color:#fff;font-weight:800}
.bar{display:flex;gap:12px;min-height:56px}
.act{min-height:56px;padding:0 22px;border-radius:16px;background:#7048e8;color:#fff;font-weight:900;box-shadow:0 3px 0 #4a2fb0}
.act.sub{background:#fff;color:#444;border:2px solid #bdb7a3;box-shadow:0 3px 0 #bdb7a3}
.act:active{transform:translateY(2px);box-shadow:none}

/* ===== 우측 패널 (HUD / 관찰표) ===== */
#panel{
  width:clamp(340px,32vw,620px);overflow:auto;background:#fff;border-radius:14px;
  padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.12);
}
#panel h2{margin:0 0 6px;font-size:1.15em}
.note{color:#555;font-size:.82em;margin:0 0 8px;line-height:1.4}
.sel{
  background:#e7f5ff;border:2px solid #74c0fc;border-radius:12px;padding:8px 12px;margin:6px 0 10px;
  font-weight:800;min-height:52px;display:flex;align-items:center
}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:.9em;table-layout:fixed}
.t th{background:#17324d;color:#fff;padding:8px 2px;font-size:.82em;line-height:1.2}
.t th:first-child{border-radius:10px 0 0 0}.t th:last-child{border-radius:0 10px 0 0}
.t td{border-bottom:1px solid var(--line);padding:4px 2px;text-align:center;height:52px;font-weight:700;line-height:1.2;vertical-align:middle;word-break:keep-all}
.t td.nm{background:#f6f3e8;font-weight:900}
.t tr.cur td{background:#fff3bf}
.q{color:#adb5bd;font-weight:900}
.o{color:#1971c2;font-weight:900;font-size:1.25em}
.x{color:#868e96;font-weight:900;font-size:1.25em}
.hot{color:#d6336c;font-weight:900}
.cell{
  width:100%;min-height:52px;border-radius:10px;background:#f1f3f5;border:2px dashed #ced4da;
  font-weight:800;font-size:.85em;padding:2px;line-height:1.15;word-break:keep-all
}
.cell.f{background:#e7f5ff;border:2px solid #74c0fc;color:#0b5394}
.cell.w{border:3px solid var(--bad);background:#fff5f5}
.sbox{width:100%;min-height:52px;border-radius:10px;border:2px solid #74c0fc;background:#fff;font-weight:800;padding:0 2px}
.sbox.w{border:3px solid var(--bad)}
.stamp{
  display:inline-block;border:3px solid #d6336c;color:#d6336c;border-radius:50%;
  width:2.6em;height:2.6em;line-height:1.05;font-weight:900;font-size:.62em;transform:rotate(-12deg);
  padding-top:.45em;background:#fff0f6
}
.pbtn{
  min-height:56px;padding:0 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;margin:10px 8px 0 0
}
.pbtn.alt{background:#fff;color:#333;border:2px solid #adb5bd}
.msg{margin-top:10px;font-weight:800;line-height:1.5;color:#364fc7}
.prog{height:14px;background:#e9ecef;border-radius:8px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#51cf66,#2f9e44);width:0;transition:.3s}

/* ===== 퀴즈 모달 ===== */
#modal{position:fixed;inset:0;background:rgba(10,20,35,.62);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.on{display:flex}
.mcard{background:#fff;border-radius:22px;width:min(900px,100%);max-height:94vh;overflow:auto;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mcard h3{margin:0 0 4px;color:var(--accent)}
.mq{font-weight:900;font-size:1.2em;line-height:1.45;margin:8px 0 12px}
.opt{
  display:block;width:100%;text-align:left;min-height:60px;padding:10px 16px;margin:8px 0;border-radius:14px;
  background:#f1f3f5;border:3px solid #dee2e6;font-weight:700;line-height:1.4
}
.opt.sel2{border-color:#4c6ef5;background:#edf2ff}
.opt.ok{border-color:var(--good);background:#ebfbee}
.opt.no{border-color:var(--bad);background:#fff5f5}
.ex{margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff9db;border:2px solid #fcc419;font-weight:700;line-height:1.55;display:none}
.mfoot{display:flex;gap:10px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.mfoot button{min-height:56px;padding:0 20px;border-radius:14px;font-weight:900;background:var(--accent);color:#fff}
.mfoot button.g{background:#fff;color:#333;border:2px solid #adb5bd}
.mfoot button[disabled]{opacity:.4}

@media (max-width:1000px){
  body{overflow:auto}
  main{flex-direction:column}
  #panel{width:auto;overflow:visible}
  #stage{width:100%}
  .brand{width:100%}
}
a.tbtn{display:inline-flex;align-items:center;justify-content:center;background:#2c4b6b;color:#fff;text-decoration:none;border-radius:14px;font-weight:800;white-space:nowrap}
</style>
<style id="phoneLabCss">/* PHONELAB_1018 : 스마트폰 전용 레이아웃 (전자칠판 화면은 그대로) */
@media (max-width:600px){
html header h1,html .title-group h1,html .title-block h1{font-size:16px!important;line-height:1.25!important;margin:0!important}
html header p,html .title-group p,html .title-block p{font-size:10.5px!important;line-height:1.35!important;margin:2px 0 0!important}
html .wrap>h1,html #home>h1{font-size:17px!important;line-height:1.25!important}
html .lead{font-size:11.5px!important;line-height:1.45!important}
html .unified-nav-actions,html .header-actions{display:flex!important;flex-wrap:nowrap!important;gap:4px!important;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:0!important;margin:4px 0!important}
html .unified-nav-actions::-webkit-scrollbar,html .header-actions::-webkit-scrollbar{display:none}
html .btn-top.btn-top,html .btn-help.btn-help,html a.back.back{flex:0 0 auto;min-height:30px!important;height:30px;padding:0 9px!important;font-size:11px!important;border-radius:9px!important;white-space:nowrap;display:inline-flex;align-items:center;box-sizing:border-box}
html .btn-unified-nav.btn-unified-nav:is(#kjsHome,.btn-hub-main,.btn-hub-sim,.btn-hub-game,.btn-hub-mod,#kjsQrBtn,.kjs-qr-btn,#btnRestart,#btnSound,a[href*="게임서랍"]):not(.kjs-seg *),html #btnFullscreen.btn-top{width:34px;height:32px;min-height:0!important;padding:0!important;justify-content:center;font-size:0!important}
html .btn-unified-nav:is(#kjsHome,.btn-hub-main,.btn-hub-sim,.btn-hub-game,.btn-hub-mod,#kjsQrBtn,.kjs-qr-btn,#btnRestart,#btnSound,a[href*="게임서랍"]):not(.kjs-seg *)>span{font-size:0!important}
html .btn-unified-nav:is(#kjsHome,.btn-hub-main,.btn-hub-sim,.btn-hub-game,.btn-hub-mod,#kjsQrBtn,.kjs-qr-btn,#btnRestart,#btnSound,a[href*="게임서랍"]):not(.kjs-seg *)::before,html #btnFullscreen::before{font-size:15px;line-height:1}
html .kjs-seg a{font-size:11px!important;padding:0 6px!important}
html [class*="kjs-"][class*="qr"]:not(.kjs-seg *)::before{content:"📱"}
html #kjsHome:not(.kjs-seg *)::before{content:"↺"}
html .btn-hub-main:not(.kjs-seg *)::before{content:"📚"}
html .btn-hub-sim:not(.kjs-seg *)::before{content:"🔬"}
html .btn-hub-game:not(.kjs-seg *)::before{content:"🎮"}
html .btn-hub-mod:not(.kjs-seg *)::before{content:"⚡"}
html #btnFullscreen::before{content:"⛶"}
html #kjsQrBtn::before{content:"📱"}
html #btnRestart.btn-unified-nav::before{content:"🔄"}
html #btnSound.btn-unified-nav::before{content:"🔊"}
html a.btn-unified-nav[href*="게임서랍"]:not(.btn-hub-game):not(.kjs-seg *)::before{content:"🎮"}
html #kjsImmBtn{right:8px!important;bottom:8px!important;width:36px;height:36px;min-height:0!important;padding:0!important;border-radius:11px!important;font-size:0!important;border-width:1.5px!important;opacity:.85}
html #kjsImmBtn::before{content:"⛶";font-size:17px;line-height:1}
html h2{font-size:14px!important}
html h3{font-size:13px!important}
html .stat-card{padding:7px 9px!important}
html .stat-val{font-size:15px!important}
html .stat-lbl,html .stat-desc{font-size:10px!important}
}
</style>

<body>

<header>
  <div class="brand">🔬 광물 가상실험실</div>
  <nav class="tabs">
    <button class="tab on" data-mode="1">① 광물 종합 감정 랩</button>
    <button class="tab" data-mode="2">② 미지의 광물 퀘스트</button>
  </nav>
  <div class="tools">
    <a class="tbtn" href="./가상실험실_서랍.html">🔬 서랍</a>
    <a class="tbtn" href="./index.html">🏠 처음</a>
    <button class="tbtn" id="bQuiz">❓ 오개념 퀴즈</button>
    <button class="tbtn" id="bSnd" aria-label="소리 켜기/끄기">🔊</button>
    <button class="tbtn" id="bFs" aria-label="전체화면">⛶</button>
  </div>
</header>

<main>
  <section id="stageCol">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toast"></div>
    </div>
    <div class="bar">
      <button class="act" id="bScratch">⛏ 긁어보기 (③ 서로 긁기)</button>
      <button class="act sub" id="bClear">🧽 실험대 정리</button>
    </div>
  </section>
  <aside id="panel"></aside>
</main>

<div id="modal"><div class="mcard" id="mcard"></div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const W=1200,H=720;
const cv=$('cv'),ctx=cv.getContext('2d');

/* ================= 광물 데이터 ================= */
const MIN={
  quartz:   {name:'석영',  f:'SiO₂', h:7,   color:'무색투명',    sw:'none', st:'없음 (조흔판이 긁힘)', clip:0, acid:0},
  feldspar: {name:'장석',  f:'',     h:6,   color:'분홍색·흰색', sw:'white',st:'흰색',   clip:0, acid:0},
  biotite:  {name:'흑운모',f:'',     h:2.5, color:'검은색',      sw:'white',st:'흰색',   clip:0, acid:0},
  calcite:  {name:'방해석',f:'CaCO₃',h:3,   color:'무색·흰색',   sw:'white',st:'흰색',   clip:0, acid:1},
  magnetite:{name:'자철석',f:'Fe₃O₄',h:5.8, color:'검은색',      sw:'black',st:'검은색', clip:1, acid:0},
  pyrite:   {name:'황철석',f:'FeS₂', h:6.3, color:'노란색(황동색)',sw:'black',st:'검은색',clip:0, acid:0},
  hematite: {name:'적철석',f:'Fe₂O₃',h:5.8, color:'검은색',      sw:'red',  st:'적갈색', clip:0, acid:0}
};
const STREAK={quartz:null,feldspar:'#ffffff',biotite:'#fdfdfd',calcite:'#f8f8f4',magnetite:'#1b1b1b',pyrite:'#23261f',hematite:'#8a3b24'};
const PLATE_H=6.5;
const ALL7=['quartz','feldspar','biotite','calcite','magnetite','pyrite','hematite'];
const FIVE=['quartz','feldspar','biotite','calcite','magnetite'];
const KEYS=['color','streak','scratch','clip','acid'];

/* ================= 상태 ================= */
let mode=1,toks=[],clips=[],streaks=[],floats=[],parts=[],bubbles=[];
let drag=null,Z=1,selId=null,sndOn=true,lastWarn=-9999;
const stMsg=['','','','',''];
let acid={dropping:false,y:0,target:0,react:0,tok:null,bead:0,beadTok:null,spawn:0};
let scr=null;
let showAll=false;
let obs=[],stamps=[],wrong=[],qmsg='';

/* ================= 유틸 ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rng(seed){let t=seed;return()=>{t=(t+0x6D2B79F5)|0;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function lbl(t){return mode===1?MIN[t.id].name:'표본 '+t.letter}
function wrap(c,str,x,y,maxW,lh,maxLines){
  const lines=[];let line='';
  for(const ch of str){
    const test=line+ch;
    if(c.measureText(test).width>maxW&&line){lines.push(line);line=ch.trim()?ch:''}else line=test;
  }
  if(line)lines.push(line);
  lines.slice(0,maxLines||3).forEach((l,i)=>c.fillText(l,x,y+i*lh));
}

/* ================= 사운드 ================= */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f0,f1,dur,type,vol){
  if(!sndOn)return;const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,a.currentTime);o.frequency.linearRampToValueAtTime(f1,a.currentTime+dur);
    g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
function noise(dur,vol,hp){
  if(!sndOn)return;const a=ac();if(!a)return;
  try{
    const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource();s.buffer=b;
    const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
    const g=a.createGain();g.gain.value=vol;
    s.connect(f).connect(g).connect(a.destination);s.start();
  }catch(e){}
}
const sfx={
  click(){tone(660,880,.08,'sine',.15)},
  squeak(){tone(1100,520,.35,'sawtooth',.12);noise(.25,.15,3000)},
  rub(){noise(.12,.1,2500)},
  fizz(){noise(1.6,.18,2500)},
  snap(){tone(400,900,.07,'square',.08)},
  ok(){tone(523,784,.25,'triangle',.2);setTimeout(()=>tone(784,1046,.3,'triangle',.2),180)},
  no(){tone(300,200,.25,'square',.1)}
};

/* ================= 광물 일러스트 (Canvas 절차 생성) ================= */
const SPK={};
ALL7.forEach((id,k)=>{const r=rng(1234+k*77),a=[];for(let i=0;i<34;i++){const ang=r()*6.283,d=Math.sqrt(r())*.62;a.push([Math.cos(ang)*d,Math.sin(ang)*d*.9,.012+r()*.03,.25+r()*.5])}SPK[id]=a});
const SPKC={quartz:null,feldspar:'#ffffff',biotite:'#8a6a50',calcite:null,magnetite:'#a0a8b2',pyrite:'#fff2a0',hematite:'#a24c3b'};
function poly(c,x,y,s,pts,fill,stroke,lw){
  c.beginPath();pts.forEach((p,i)=>{const px=x+p[0]*s,py=y+p[1]*s;i?c.lineTo(px,py):c.moveTo(px,py)});c.closePath();
  if(fill){c.fillStyle=fill;c.fill()}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.lineJoin='round';c.stroke()}
}
function lg(c,x0,y0,x1,y1,a,b){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function line(c,x,y,s,a,b,col,w){c.beginPath();c.moveTo(x+a[0]*s,y+a[1]*s);c.lineTo(x+b[0]*s,y+b[1]*s);c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke()}

function drawMineral(c,id,x,y,s){
  c.save();
  switch(id){
  case 'quartz':{
    c.beginPath();c.ellipse(x,y+.72*s,.95*s,.2*s,0,0,6.283);c.fillStyle='#eadfe3';c.fill();
    const P=[[-.45,.2,.24,.95,-.12],[.42,.3,.22,.8,.18],[.0,.4,.3,1.2,.04]];
    P.forEach(([cx,_,hw,h,tl])=>{
      const by=.72;
      poly(c,x,y,s,[[cx-hw,by],[cx-hw+tl*.3,by-h*.72],[cx+tl,by-h],[cx+hw+tl*.3,by-h*.72],[cx+hw,by]],
        lg(c,x+(cx-hw)*s,y,x+(cx+hw)*s,y,'#f6fbff','#c5d9e6'),'#8fa9bb',Math.max(1.5,s*.04));
      line(c,x,y,s,[cx+tl,by-h],[cx-hw*.1,by],'rgba(110,140,160,.55)',Math.max(1,s*.025));
      line(c,x,y,s,[cx-hw+tl*.3,by-h*.72],[cx+hw+tl*.3,by-h*.72],'rgba(110,140,160,.45)',Math.max(1,s*.02));
      line(c,x,y,s,[cx-hw*.55,by-h*.3],[cx-hw*.5+tl*.2,by-h*.8],'rgba(255,255,255,.95)',Math.max(1.5,s*.04));
    });
    break}
  case 'feldspar':{
    poly(c,x,y,s,[[-.8,-.2],[-.6,-.65],[.1,-.75],[.75,-.55],[.85,.2],[.6,.7],[-.3,.75],[-.78,.5]],
      lg(c,x-s,y-s,x+s,y+s,'#f7b9ab','#e3806d'),'#b45a4a',Math.max(1.5,s*.04));
    line(c,x,y,s,[-.6,-.3],[.5,-.45],'rgba(255,255,255,.6)',s*.05);
    line(c,x,y,s,[-.7,.2],[.7,.05],'rgba(255,255,255,.5)',s*.04);
    line(c,x,y,s,[-.2,-.7],[-.3,.7],'rgba(255,235,230,.55)',s*.035);
    break}
  case 'biotite':{
    for(let k=0;k<4;k++){
      const ox=k*.07-.1,oy=-k*.1+.15;

    if(Math.random()<.5)streaks.push({x1:a.x+(Math.random()*8-4),y1:a.y+(Math.random()*8-4),x2:b.x,y2:b.y,c:col,w:5});
    if(t.sl>70){mark(t,'streak');stMsg[1]=lbl(t)+'의 조흔색: '+MIN[t.id].st}
    if(Math.random()<.25)sfx.rub();
  }else{
    streaks.push({x1:a.x,y1:a.y,x2:b.x,y2:b.y,c:'rgba(70,64,54,.65)',w:2.5,g:1});
    streaks.push({x1:a.x+3,y1:a.y+2,x2:b.x+3,y2:b.y+2,c:'rgba(255,255,255,.9)',w:1.5,g:1});
    if(t.sl>40){mark(t,'streak');stMsg[1]=lbl(t)+': 가루가 안 묻고 조흔판에 흠집!'}
    const now=performance.now();
    if(now-lastWarn>4500){
      lastWarn=now;sfx.squeak();floatTxt(b.x,b.y-30,'끼익-','#c92a2a',34);
      toast('⚠ 앗! 이 광물이 조흔판(굳기 약 6.5)보다 더 단단해서 조흔판이 긁혀요!<button onclick="window.__quiz(0)">왜 그럴까? 퀴즈 ①</button>',7000);
    }
  }
  if(streaks.length>2600)streaks.splice(0,300);
}

function doScratch(){

  scr={A,B,t:0,done:false};stMsg[2]='';
}
function addMarks(t){
  const r=Math.random;
  for(let i=0;i<6;i++){const x=-.5+r()*.8,y=-.4+r()*.8;t.marks.push([x,y,x+.25+r()*.2,y+(r()*.3-.15)])}
  if(t.marks.length>24)t.marks.splice(0,6);
}
function finishScratch(){
  const{A,B}=scr,d=MIN[A.id].h-MIN[B.id].h;
  mark(A,'scratch');mark(B,'scratch');
  if(d>0.4){addMarks(B);stMsg[2]=lbl(B)+'에 흰 흠집이 생겼어요! ('+lbl(A)+'이(가) 더 단단해요)'}

/* ================= 업데이트 ================= */
function update(dt){
  const k=1-Math.exp(-dt*14);
  for(const t of toks){
    const dr=drag&&drag.tok===t;
    const ts=dr?52:(t.dock?46:40);t.s+=(ts-t.s)*k;
    if(dr)continue;
    let tx,ty;
    if(t.dock){if(t.dock.st===1){tx=t.x;ty=t.y}else[tx,ty]=dockPos(t)}else{tx=t.hx;ty=t.hy}
    t.x+=(tx-t.x)*k;t.y+=(ty-t.y)*k;
  }
  /* 긁기 애니메이션 */
  if(scr){
    scr.t+=dt;const t=scr.t,A=scr.A;
    if(t<1.8){
      const ap=Math.min(t/.35,1),ret=t>1.5?Math.max(0,1-(t-1.5)/.3):1;
      const rub=t>.35&&t<1.5?Math.sin((t-.35)*22)*20:0;
      A.off={x:rub*ret,y:92*ap*ret};
      if(t>.35&&t<1.5){
        if(Math.random()<.7)parts.push({x:S3P[1].x+(Math.random()*50-25),y:S3P[1].y-40,vx:Math.random()*60-30,vy:Math.random()*-30,life:.6,c:'#fff',r:2+Math.random()*2});
        if(Math.random()<.12)sfx.rub();
      }
    }else{
      A.off={x:0,y:0};
      if(!scr.done)finishScratch();
      if(t>2.2)scr=null;
    }
  }
  /* 클립(자성) */
  for(const t of toks){
    const dr=drag&&drag.tok===t;
    const near=Math.hypot(t.x-DISH.x,t.y-DISH.y)<215;
    if(MIN[t.id].clip){
      if(near){
        t.attT+=dt;
        const n=Math.min(5,Math.floor(t.attT/.09)+1);
        let any=false;
        for(let i=0;i<n;i++){const c=clips[i];if(!c.att){c.att=t;any=true}}
        if(any){mark(t,'clip');sfx.click()}
      }else if(!clips.some(c=>c.att===t))t.attT=0;
    }else if(near&&(t.dock&&t.dock.st===3||dr)){
      t.clipT+=dt;if(t.clipT>.7)mark(t,'clip');
    }else if(!near)t.clipT=0;
  }
  clips.forEach((c,i)=>{
    const kk=1-Math.exp(-dt*12);
    let tx=c.hx,ty=c.hy,ta=c.ha;
    if(c.att){tx=c.att.x+c.att.off.x+OFFS[i][0];ty=c.att.y+c.att.off.y+OFFS[i][1];ta=(i-2)*.35}
    c.x+=(tx-c.x)*kk;c.y+=(ty-c.y)*kk;c.a+=(ta-c.a)*kk;
  });
  /* 염산 */
  if(acid.dropping){
    acid.y+=480*dt;
    if(acid.y>=acid.target){
      acid.dropping=false;
      const t=occ(4);
      if(t&&t===acid.tok){
        mark(t,'acid');
        if(MIN[t.id].acid){acid.react=3.8;acid.tok=t;stMsg[4]=lbl(t)+': 치익— 거품(CO₂)이 부글부글! → 반응 O';sfx.fizz();floatTxt(S5P.x,S5P.y-80,'치익-','#d6336c',34)}
        else{acid.bead=3;acid.beadTok=t;stMsg[4]=lbl(t)+': 아무 변화가 없어요 → 반응 X';sfx.no()}
      }else stMsg[4]='표본을 접시 위에 올려 주세요'
    }
  }
  if(acid.react>0){
    const t=acid.tok;
    if(!t||!t.dock||t.dock.st!==4)acid.react=0;
    else{
      acid.react-=dt;acid.spawn+=dt*55;
      while(acid.spawn>1){acid.spawn--;bubbles.push({x:t.x+(Math.random()*1.3-.65)*t.s,y:t.y+(Math.random()*.9-.2)*t.s,r:3+Math.random()*7,vy:-(40+Math.random()*60),life:0,max:.7+Math.random()*.9})}
    }
  }
  if(acid.bead>0)acid.bead-=dt;
  bubbles.forEach(b=>{b.life+=dt;b.y+=b.vy*dt;b.x+=Math.sin(b.life*9+b.r)*14*dt});
  bubbles=bubbles.filter(b=>b.life<b.max);
  parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt});
  parts=parts.filter(p=>p.life>0);
  floats.forEach(f=>{f.life-=dt;f.y-=36*dt});
  floats=floats.filter(f=>f.life>0);
}

/* ================= 그리기 ================= */
function pill(c,text,x,y,color){
  c.font='800 22px sans-serif';const w=c.measureText(text).width+24;
  rr(c,x-w/2,y-16,w,32,16);c.fillStyle='rgba(255,255,255,.95)';c.fill();
  c.strokeStyle=color||'#17324d';c.lineWidth=2.5;c.stroke();
  c.fillStyle='#17324d';c.textAlign='center';c.textBaseline='middle';c.fillText(text,x,y+1);c.textBaseline='alphabetic';
}
function drawTok(c,t){
  const x=t.x+t.off.x,y=t.y+t.off.y,s=t.s,dr=drag&&drag.tok===t;
  c.save();
  c.beginPath();c.ellipse(x+3,y+s*.78,s*.8,s*.17,0,0,6.283);c.fillStyle='rgba(0,0,0,.18)';c.fill();
  if(dr){c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=18}
  if(mode===1)drawMineral(c,t.id,x,y,s);else drawBlind(c,x,y,s,t.letter);
  c.shadowBlur=0;
  drawMarks(c,t,x,y,s);
  c.restore();
  const tray=!t.dock&&!dr&&Math.abs(t.y-t.hy)<30;
  if(tray){
    pill(c,lbl(t),x,y+58,'#17324d');
    for(let i=0;i<5;i++){

const OPT={
  color:['','무색투명','흰색','분홍색','검은색','노란색'],
  streak:['','없음(긁힘)','흰색','검은색'],
  scratch:['','O','X'],clip:['','O','X'],acid:['','O','X']
};
const ACCEPT={quartz:['무색투명'],feldspar:['분홍색','흰색'],biotite:['검은색'],calcite:['흰색','무색투명'],magnetite:['검은색']};
function truth(id,k){
  if(k==='color')return ACCEPT[id];
  if(k==='streak')return[{none:'없음(긁힘)',white:'흰색',black:'검은색'}[MIN[id].sw]];
  if(k==='scratch')return[id==='quartz'?'X':'O'];
  if(k==='clip')return[MIN[id].clip?'O':'X'];
  return[MIN[id].acid?'O':'X'];
}
function hudText(id,k){
  const m=MIN[id];
  if(k==='color')return'<span class="hot">'+m.color+'</span>';
  if(k==='streak')return'<span class="hot">'+m.st+'</span>';
  if(k==='scratch')return id==='quartz'?'<span class="x">X</span><br><small>가장 단단</small>':'<span class="o">O</span>';
  if(k==='clip')return m.clip?'<span class="o">O</span><br><small>자성!</small>':'<span class="x">X</span>';
  return m.acid?'<span class="o">O</span><br><small>거품!</small>':'<span class="x">X</span>';
}

$('panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;

  else if(a==='newq'){resetMode()}

  else if(b.dataset.k){
    const i=+b.dataset.r,k=b.dataset.k,o=OPT[k];

$('panel').addEventListener('change',e=>{
  const s=e.target.closest('select');if(!s)return;
  const i=+s.dataset.r;obs[i].name=s.value;wrong[i]=(wrong[i]||[]).filter(x=>x!=='name');renderPanel();
});
function checkQuest(){
  let bad=0,newStamp=0,blank=0;
  toks.forEach((t,i)=>{
    const w=[];
    KEYS.forEach(k=>{
      const v=obs[i][k];
      if(!v){blank++;w.push(k)}else if(!truth(t.id,k).includes(v)){bad++;w.push(k)}
    });
    const ok=obs[i].name===MIN[t.id].name;
    if(!obs[i].name){w.push('name')}
    else if(!ok){w.push('name');bad++}
    else if(!stamps[i]){stamps[i]=true;newStamp++}
    wrong[i]=ok?w.filter(x=>x!=='name'):w;
  });
  const n=stamps.filter(Boolean).length;
  if(n===5&&!bad&&!blank){qmsg='🏅 축하해요! 5개 광물을 모두 정확히 감정했어요. 광물 감정사 인증!';sfx.ok();toast('🏅 광물 감정사 인증 완료!',4000)}
  else{
    qmsg=(newStamp?'⭐ 새 스탬프 '+newStamp+'개 획득! ':'')+
      (blank?'비어 있는 칸이 '+blank+'개 있어요. ':'')+
      (bad?'빨간 칸은 결과가 달라요. 해당 검사대에서 다시 확인해 보세요.':'')+
      (!newStamp&&!bad&&!blank?'이름을 선택해 주세요.':'');
    newStamp?sfx.ok():sfx.no();
  }
  renderPanel();
}

   o:['돋보기로 색을 더 자세히 본다.','조흔판에 긁어 본다.','묽은 염산을 떨어뜨려 본다.','클립을 가까이 대어 본다.'],
   a:[1],m:0,
   ex:'조흔판에 긁어 본다! 금은 겉과 속이 모두 노란색 조흔색을 띠지만, 황철석은 검은색 조흔색을 띤다!'},
  {q:'Q3. 무색투명하여 겉모습이 매우 비슷한 석영과 방해석을 단번에 구별할 수 있는 2가지 방법은? (2개 선택)',
   o:['묽은 염산을 떨어뜨려 거품이 나는지 본다.','서로 긁어 보아 흠집이 나는지 본다.','클립을 가까이 대어 본다.','겉보기 색을 더 오래 관찰한다.'],
   a:[0,1],m:1,
   ex:'① 묽은 염산을 떨어뜨려 거품이 나는지 본다(방해석만 거품 발생), ② 서로 긁어 보아 흠집이 나는지 본다(방해석에만 흠집 발생)!'}
];
let qi=0,qsel=[],qdone=false,qscore=[null,null,null];
function openQuiz(i){qi=i||0;qsel=[];qdone=false;$('modal').classList.add('on');renderQuiz()}
window.__quiz=openQuiz;
function renderQuiz(){
  const q=QZ[qi];
  const opts=q.o.map((t,i)=>{
    let cls='opt';
    if(qdone){if(q.a.includes(i))cls+=' ok';else if(qsel.includes(i))cls+=' no'}
    else if(qsel.includes(i))cls+=' sel2';
    return'<button class="'+cls+'" data-i="'+i+'">'+(q.m?(qsel.includes(i)?'☑ ':'☐ '):'')+t+'</button>';
  }).join('');
  const sc=qscore.filter(v=>v).length;
  $('mcard').innerHTML=
    '<h3>❓ 오개념 교정 퀴즈 ('+(qi+1)+'/3) <small style="color:#666">맞힌 문제 '+sc+'개</small></h3>'+
    '<div class="mq">'+q.q+'</div>'+opts+
    '<div class="ex" id="ex" style="display:'+(qdone?'block':'none')+'">'+(qdone?(qscore[qi]?'⭕ 정답! ':'❌ 아쉬워요. ')+q.ex:'')+'</div>'+
    '<div class="mfoot"><div>'+
      '<button class="g" data-q="prev" '+(qi===0?'disabled':'')+'>◀ 이전</button> '+
      (q.m&&!qdone?'<button data-q="ok" '+(qsel.length===q.a.length?'':'disabled')+'>확인</button> ':'')+
      '<button data-q="next" '+(qi===2?'disabled':'')+'>다음 ▶</button></div>'+
      '<button class="g" data-q="close">닫기 ✕</button></div>';
}
$('mcard').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const q=QZ[qi];
  if(b.dataset.q){
    const a=b.dataset.q;
    if(a==='close')$('modal').classList.remove('on');
    else if(a==='prev'&&qi>0){qi--;qsel=[];qdone=false;renderQuiz()}
    else if(a==='next'&&qi<2){qi++;qsel=[];qdone=false;renderQuiz()}
    else if(a==='ok')judge();
    return;
  }
  if(qdone)return;
  const i=+b.dataset.i;
  if(q.m){const k=qsel.indexOf(i);k>=0?qsel.splice(k,1):qsel.push(i);if(qsel.length>q.a.length)qsel.shift();renderQuiz()}
  else{qsel=[i];judge()}
});
function judge(){
  const q=QZ[qi];
  const ok=qsel.length===q.a.length&&q.a.every(x=>qsel.includes(x));
  qscore[qi]=ok;qdone=true;ok?sfx.ok():sfx.no();renderQuiz();
}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('on')});

/* ================= 상단 버튼 ================= */
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  mode=+b.dataset.mode;sfx.click();resetMode();
  $('bScratch').textContent='⛏ 긁어보기 (③ 서로 긁기)';
}));
$('bQuiz').onclick=()=>openQuiz(0);
$('bSnd').onclick=()=>{sndOn=!sndOn;$('bSnd').textContent=sndOn?'🔊':'🔇';if(sndOn)sfx.click()};
$('bFs').onclick=()=>{
  const d=document,el=d.documentElement;
  if(!d.fullscreenElement&&!d.webkitFullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el)}
  else{(d.exitFullscreen||d.webkitExitFullscreen||(()=>{})).call(d)}
};
$('bScratch').onclick=()=>{ac();doScratch()};
$('bClear').onclick=()=>{
  sfx.click();
  const keep=true;clearBench(keep);
};

/* ================= 캔버스 크기 / 루프 ================= */
function fit(){
  const r=cv.parentElement.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(300,Math.round(r.width*dpr));
  cv.height=Math.round(cv.width*H/W);
}
if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));
window.addEventListener('resize',fit);
fit();

resetMode();
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  try{update(dt);draw()}catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
