<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>에너지 스케이트 파크 · 역학적 에너지 보존 게임</title>
<style>
:root{--bg:#0a1020;--pn:#111a33;--pn2:#18244a;--ln:#2b3d70;--tx:#e9eefc;--mu:#9fb2dc;--ac:#22d3ee;--ok:#34d399;--no:#f87171;--wa:#fbbf24;--ep:#22c55e;--ek:#3b82f6;--eth:#f97316;--tot:#eab308}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(14px,1.45vw,17px);line-height:1.5;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:6px clamp(8px,2vw,16px);background:#060b18;border-bottom:1px solid var(--ln);flex-wrap:wrap;position:sticky;top:0;z-index:30}
header h1{margin:0;font-size:clamp(14px,2.2vw,20px);white-space:nowrap}
.hb{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px clamp(8px,1.6vw,14px);font-weight:800;font-size:clamp(11px,1.6vw,14px);text-decoration:none;cursor:pointer;white-space:nowrap;font-family:inherit}
.tabs{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.tab{min-height:42px;padding:0 12px;border-radius:12px;border:2px solid var(--ln);background:var(--pn2);color:var(--mu);font-weight:800;font-size:.92em;cursor:pointer;font-family:inherit}
.tab.on{background:#fff;color:#0a1020;border-color:#fff}
main{padding:10px clamp(8px,2vw,16px);display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:10px;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
@media(max-width:760px){header{position:static}header h1{flex:1 0 100%}.tabs{order:5;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto}.tab{flex:0 0 auto;white-space:nowrap;padding:0 10px}}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.card h2{margin:0 0 6px;font-size:1.02em}
.stagebox{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--ln)}
#cv{width:100%;aspect-ratio:960/560;display:block;touch-action:none;background:#9ad1f5}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:#0b1430;border-top:1px solid var(--ln)}
.btn{min-height:42px;padding:0 14px;border-radius:12px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:800;cursor:pointer;font-family:inherit;font-size:.95em}
.btn.pri{background:linear-gradient(#22d3ee,#0891b2);border-color:#67e8f9;color:#052e38}
.btn.ok{background:linear-gradient(#34d399,#059669);border-color:#6ee7b7;color:#022c22}
.btn.on{border-color:#fff;background:#25356b}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rd{display:flex;gap:10px;align-items:center;font-weight:700}
.rd label{display:flex;gap:4px;align-items:center;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;min-height:34px;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px}
.side{display:flex;flex-direction:column;gap:10px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:8px 0}
.sl input[type=range]{grid-column:1/3;width:100%;height:28px}
.sl b{color:#fff}
select{background:#0b1430;color:var(--tx);border:2px solid var(--ln);border-radius:8px;padding:6px;font-family:inherit;font-size:1em}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.av button{font-size:1.5em;padding:3px 0;border-radius:10px;border:2px solid var(--ln);background:#0b1430;cursor:pointer}
.av button.on{border-color:#fff;background:#25356b}
.pre{display:flex;gap:6px;flex-wrap:wrap}.pre .btn{flex:1;min-width:56px;padding:0 6px;font-size:.88em}
.sw{font-size:1.5em;font-weight:900;text-align:center;background:#0b1430;border:2px solid var(--ln);border-radius:10px;padding:2px 8px;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{min-height:40px;min-width:40px;border-radius:999px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:900;cursor:pointer;font-family:inherit}
.pill.on{background:#fff;color:#0a1020}.pill.done{border-color:var(--ok)}.pill:disabled{opacity:.35}
.goal{background:#0b1430;border-left:4px solid var(--ac);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.94em}
.in{display:grid;grid-template-columns:1fr 92px;gap:6px 8px;align-items:center;margin:6px 0}
.in input[type=number]{width:100%;background:#0b1430;color:#fff;border:2px solid var(--ln);border-radius:8px;padding:6px;font-size:1em;font-family:inherit}
.in input[type=range]{grid-column:1/3;width:100%}
#log{max-height:min(46vh,420px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{background:#0b1430;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;font-size:.93em;white-space:pre-wrap;line-height:1.55}
.msg.ok{border-color:var(--ok)}.msg.no{border-color:var(--no)}.msg.wa{border-color:var(--wa)}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;display:block;margin-top:4px;line-height:1.45}
.mu{color:var(--mu)}.small{font-size:.88em}
#ov{position:absolute;left:8px;top:8px;pointer-events:none}
#ctab{background:#4b3d86e6;border-radius:6px;padding:4px 8px;color:#fff;font-size:clamp(10px,1.4vw,14px);display:none}
#ctab td{padding:1px 6px;border:0}#ctab td:last-child{text-align:right;background:#fff;color:#111;font-weight:800;border-radius:4px;min-width:74px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1}
</style></head><body>
<header><h1>🛹 에너지 스케이트 파크</h1><div class="tabs" id="tabs"></div>
<a class="hb" href="./시작하기_수업게임서랍.html">🎮 게임 서랍</a><button class="hb" id="fs">⛶ 전체화면</button></header>
<main>
<div><div class="stagebox"><canvas id="cv" width="960" height="560"></canvas><div id="ov"><table id="ctab"></table></div></div><div class="bar" id="bar"></div></div>
<div class="side" id="side"></div>
</main><div id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PX=45,OX=20,GY=500,CW=960,CH=560,DS=0.02;
const wx=x=>OX+x*PX,wy=y=>GY-y*PX;
const COL={ep:'#22c55e',ek:'#3b82f6',eth:'#f97316',tot:'#eab308'};
/* ===== 트랙 ===== */
function hermite(P,n){n=n||40;const out=[];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],dx=b.x-a.x;for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;out.push([a.x+dx*t,(2*t3-3*t2+1)*a.y+(t3-2*t2+t)*dx*a.m+(-2*t3+3*t2)*b.y+(t3-t2)*dx*b.m])}}const l=P[P.length-1];out.push([l.x,l.y]);return out}
function crom(P,n){n=n||36;const out=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(i-1,0)],p1=P[i],p2=P[i+1],p3=P[Math.min(i+2,P.length-1)];for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t,f=(a,b,c,d)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])])}}out.push(P[P.length-1].slice());return out}
function loopPoly(cx,r,d){const out=[],N=Math.ceil(2*Math.PI*r/0.05);for(let i=0;i<=N;i++){const f=-Math.PI/2+2*Math.PI*i/N;let u=0;if(f>Math.PI){const z=Math.min(1,(f-Math.PI)/(Math.PI/2));u=z*z*(3-2*z)}out.push([cx+r*Math.cos(f)+d*u,r+r*Math.sin(f)])}return out}
function polyLen(pts,i1){let L=0;for(let i=1;i<=i1&&i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L}
function makeTrack(raw,loopIdx){
 const pts=[raw[0]];for(let i=1;i<raw.length;i++){const a=pts[pts.length-1],b=raw[i];if(Math.hypot(b[0]-a[0],b[1]-a[1])>1e-6)pts.push(b)}
 const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
 const total=L[L.length-1],n=Math.max(4,Math.round(total/DS)),ds=total/n,xs=new Float64Array(n+1),ys=new Float64Array(n+1);let j=0;
 for(let k=0;k<=n;k++){const s=k*ds;while(j<pts.length-2&&L[j+1]<s)j++;const f=Math.min(1,Math.max(0,(s-L[j])/Math.max(1e-9,L[j+1]-L[j])));xs[k]=pts[j][0]+(pts[j+1][0]-pts[j][0])*f;ys[k]=pts[j][1]+(pts[j+1][1]-pts[j][1])*f}
 const th=new Float64Array(n+1);let pv=0;for(let k=0;k<=n;k++){const i0=Math.max(0,k-2),i1=Math.min(n,k+2);let a=Math.atan2(ys[i1]-ys[i0],xs[i1]-xs[i0]);while(a-pv>Math.PI)a-=2*Math.PI;while(a-pv<-Math.PI)a+=2*Math.PI;th[k]=a;pv=a}
 const kap=new Float64Array(n+1),w=6;for(let k=0;k<=n;k++){const i0=Math.max(0,k-w),i1=Math.min(n,k+w);kap[k]=(th[i1]-th[i0])/((i1-i0)*ds)}
 const T={n,ds,total,xs,ys,th,kap,loop:null,
  at(s,q){let u=s/ds;if(u<0)u=0;if(u>n-1e-9)u=n-1e-9;const i=Math.floor(u),f=u-i;q.x=xs[i]+(xs[i+1]-xs[i])*f;q.y=ys[i]+(ys[i+1]-ys[i])*f;q.th=th[i]+(th[i+1]-th[i])*f;q.k=kap[i]+(kap[i+1]-kap[i])*f;return q},
  near(x,y){let bd=1e9,bk=0;for(let k=0;k<=n;k++){const dx=xs[k]-x,dy=ys[k]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;bk=k}}return{s:bk*ds,d:Math.sqrt(bd)}}};
 if(loopIdx)T.loop=[polyLen(raw,loopIdx[0]),polyLen(raw,loopIdx[1])];
 return T}
/* ===== 물리 ===== */
function newSim(tr){return{track:tr,mode:'track',s:0,v:0,x:0,y:0,vx:0,vy:0,Eabs:0,Eth:0,t:0,airT:0,g:9.8,m:60,mu:0,stick:true,rest:false,det:null,end:null,noRe:false,landed:0,q:{x:0,y:0,th:0,k:0}}}
function place(o,s,v){o.track.at(s,o.q);o.mode='track';o.s=s;o.v=v||0;o.x=o.q.x;o.y=o.q.y;o.Eth=0;o.rest=false;o.det=null;o.end=null;o.noRe=false;o.vx=o.v*Math.cos(o.q.th);o.vy=o.v*Math.sin(o.q.th);o.Eabs=.5*o.m*o.v*o.v+o.m*o.g*o.y}
function ekOf(o){return o.mode==='track'?.5*o.m*o.v*o.v:.5*o.m*(o.vx*o.vx+o.vy*o.vy)}
function resetE(o){o.Eabs=ekOf(o)+o.m*o.g*o.y+o.Eth}
function step(o,dt){o.t+=dt;if(o.mode==='track')stepTrack(o,dt);else if(o.mode==='air')stepAir(o,dt)}
function leave(o){const q=o.q;o.track.at(o.s,q);o.mode='air';o.airT=0;o.vx=o.v*Math.cos(q.th);o.vy=o.v*Math.sin(q.th);o.x=q.x;o.y=q.y}
function stepTrack(o,dt){
 const tr=o.track,q=o.q,g=o.g;tr.at(o.s,q);const sn=Math.sin(q.th),cs=Math.cos(q.th),Nm=o.v*o.v*q.k+g*cs;
 if(!o.stick&&Nm<-0.3&&(!tr.zoneOnly||(tr.loop&&o.s>=tr.loop[0]&&o.s<=tr.loop[1]))){o.det={s:o.s,v:o.v,x:q.x,y:q.y,th:q.th,Nm,k:q.k,t:o.t};o.mode='air';o.airT=0;o.vx=o.v*Math.cos(q.th);o.vy=o.v*Math.sin(q.th);o.x=q.x;o.y=q.y;return}
 const a=-g*sn,fr=o.mu>0?o.mu*Math.max(0,Nm):0;
 if(fr>0&&Math.abs(o.v)<0.004&&Math.abs(a)<=fr){o.v=0;o.rest=true;return}
 let v2;if(fr>0){if(Math.abs(o.v)>1e-9){v2=o.v+(a-Math.sign(o.v)*fr)*dt;if(v2*o.v<0)v2=0}else v2=(a-Math.sign(a)*fr)*dt}else v2=o.v+a*dt;
 const ds=(o.v+v2)/2*dt;o.s+=ds;o.v=v2;o.rest=false;o.Eth+=o.m*fr*Math.abs(ds);
 if(o.s>=tr.total){o.s=tr.total;o.end='right';leave(o);return}
 if(o.s<=0){o.s=0;o.end='left';leave(o);return}
 tr.at(o.s,q);o.x=q.x;o.y=q.y;
 const ekT=o.Eabs-o.m*g*o.y-o.Eth,sg=Math.sign(o.v)||Math.sign(a)||1;o.v=ekT>0?sg*Math.sqrt(2*ekT/o.m):0}
function stepAir(o,dt){
 o.airT+=dt;const g=o.g;o.vy-=g*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
 const ekT=o.Eabs-o.m*g*o.y-o.Eth,ek=.5*o.m*(o.vx*o.vx+o.vy*o.vy);if(ek>1e-9&&ekT>0){const f=Math.sqrt(ekT/ek);o.vx*=f;o.vy*=f}
 if(o.y<=0){o.y=0;o.mode='ground';o.vx=o.vy=0;o.Eth=o.Eabs;o.crash=true;return}
 if(o.airT>0.06&&!o.noRe){const tr=o.track;let bd=1e9,bk=0;for(let k=0;k<=tr.n;k+=2){const dx=tr.xs[k]-o.x,dy=tr.ys[k]-o.y,d=dx*dx+dy*dy;if(d<bd){bd=d;bk=k}}
  if(bd<0.0144){const th=tr.th[bk],nx=-Math.sin(th),ny=Math.cos(th),side=(o.x-tr.xs[bk])*nx+(o.y-tr.ys[bk])*ny,vn=o.vx*nx+o.vy*ny;
   if(vn<0&&side>-0.2){const ekb=ek,v=o.vx*Math.cos(th)+o.vy*Math.sin(th);o.s=bk*tr.ds;o.v=v;o.mode='track';o.x=tr.xs[bk];o.y=tr.ys[bk];o.Eth+=ekb-.5*o.m*v*v;o.landed++;o.end=null;
    const ekT2=o.Eabs-o.m*g*o.y-o.Eth;if(ekT2>0)o.v=Math.sign(v||1)*Math.sqrt(2*ekT2/o.m);}}}}
function En(o,href){const ek=ekOf(o),ep=o.m*o.g*(o.y-(href||0));return{ep,ek,eth:o.Eth,tot:ep+ek+o.Eth}}
/* ===== 미션 트랙 ===== */
const m0=(A,B,w)=>-1.5*(A-B)/w;
const T_TARGET=4.5;
const BLD={
 1:p=>{const h=hermite([{x:0,y:p.A,m:m0(p.A,p.B,5)},{x:5,y:p.B,m:0},{x:11,y:p.C,m:0},{x:15.5,y:0,m:0}]);h.push([18.5,0]);return{raw:h}},
 2:p=>{const h=hermite([{x:0,y:p.A,m:m0(p.A,0,4)},{x:4,y:0,m:0},{x:8,y:4,m:0},{x:12,y:0,m:0},{x:16,y:p.C,m:0},{x:19.3,y:0,m:0}]);h.push([20.4,0]);return{raw:h}},
 3:p=>{const h=hermite([{x:0,y:p.A,m:m0(p.A,0,6)},{x:6,y:0,m:0}]);h.push([8,0]);const i0=h.length-1,d=.8*p.r+.6,lp=loopPoly(8,p.r,d);lp.shift();h.push(...lp);const i1=h.length-1;h.push([8+d+5,0]);return{raw:h,loopIdx:[i0,i1],r:p.r}},
 4:p=>{const h=hermite([{x:0,y:p.A,m:m0(p.A,0,5)},{x:5,y:0,m:0},{x:14,y:9.8,m:0}]);h.push([16.5,9.8]);return{raw:h}},
 5:p=>{const h=hermite([{x:0,y:p.A,m:m0(p.A,0,5)},{x:5,y:0,m:0}]);h.push([7,0]);const i0=h.length-1,d=.8*p.r+.6,lp=loopPoly(7,p.r,d);lp.shift();h.push(...lp);const i1=h.length-1,xe=7+d;h.push([xe+2,0]);const hh=hermite([{x:xe+2,y:0,m:0},{x:xe+5.5,y:3,m:0},{x:xe+8.5,y:0,m:0}]);hh.shift();h.push(...hh);h.push([xe+9.3,0]);return{raw:h,loopIdx:[i0,i1],r:p.r}}
};
function buildStage(id,p){const b=BLD[id](p);const tr=makeTrack(b.raw,b.loopIdx);tr.r=b.r||0;tr.zoneOnly=true;return tr}
function runHeadless(tr,mu,p){
 const o=newSim(tr);o.mu=mu;o.stick=false;place(o,0,0);const E0=o.Eabs,smp=[],evs=[];const dt=1/480;
 const sm=()=>smp.push({t:o.t,x:o.x,y:o.y,th:o.mode==='track'?(tr.at(o.s,o.q),o.q.th):Math.atan2(o.vy,o.vx),v:o.mode==='track'?o.v:Math.hypot(o.vx,o.vy),ep:o.m*o.g*o.y,ek:ekOf(o),eth:o.Eth,mode:o.mode,s:o.s});
 sm();let k=0,fatal=false,out=null,dirPos=false,tbEnd=null,apex=null,lastMode='track',tEnd=null;
 while(o.t<90){
  const wm=o.mode;step(o,dt);k++;
  if(wm==='track'&&o.mode==='air'&&!o.end){const inLoop=tr.loop&&o.det&&o.det.s>=tr.loop[0]&&o.det.s<=tr.loop[1];if(inLoop){fatal=true;o.noRe=true}evs.push({t:o.t,i:smp.length,type:inLoop?'loopdet':'detach',d:o.det})}
  if(wm==='air'&&o.mode==='track')evs.push({t:o.t,i:smp.length,type:'land'});
  if(k%8===0)sm();
  if(o.end==='right'&&o.mode==='air'&&o.airT<0.01){out='finish';sm();break}
  if(o.mode==='ground'){out=fatal?'loopfall':'crash';sm();break}
  if(o.mode==='track'&&o.rest){out='rest';sm();break}
  if(o.mode==='track'){if(o.v>0.05)dirPos=true;if(dirPos&&o.v<-0.0005&&tbEnd===null){apex={y:o.y,x:o.x,i:smp.length,s:o.s,t:o.t};evs.push({t:o.t,i:smp.length,type:'turnback',d:apex});tbEnd=o.t+1.4}}
  if(tbEnd!==null&&o.t>=tbEnd){out='turnback';sm();break}
 }
 if(!out){out='timeout';sm()}
 return{o,E0,smp,evs,out,apex,fatal}}
/* ===== 중계 텍스트 ===== */
const f0=x=>Math.round(x).toLocaleString('ko-KR'),f1=x=>(Math.round(x*10)/10).toFixed(1),f2=x=>(Math.round(x*100)/100).toFixed(2);
function bars(s,E0){const row=(nm,v,c)=>{const n=Math.max(0,Math.min(10,Math.round(10*v/Math.max(E0,1))));return nm+' '+c.repeat(n)+'⬜'.repeat(10-n)+' '+f0(v)+' J'};
 return '[위치(Ep) 🟩 | 운동(Ek) 🟦 | 열(Eth) 🟧 | 총합(Total) 🟨]\n'+row('위치(Ep)  ',s.ep,'🟩')+'\n'+row('운동(Ek)  ',s.ek,'🟦')+'\n'+row('열(Eth)   ',s.eth,'🟧')+'\n'+row('총합(Total)',s.ep+s.ek+s.eth,'🟨')}
window.SK={hermite,crom,loopPoly,makeTrack,newSim,place,step,resetE,ekOf,En,buildStage,runHeadless,bars,f0,f1,f2,T_TARGET,wx,wy,PX,OX,GY,CW,CH,COL,$,$$};
})();
</script>
<script>
(()=>{'use strict';
