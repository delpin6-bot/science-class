<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도입 퀴즈 · 내 무게는 얼마죠? (힘과 운동)</title>
<style>
:root{--bg:#0f1830;--pn:#18264a;--pn2:#223562;--ln:#3d5aa8;--tx:#f4f7ff;--mu:#aebfe8;--a:#ff8a5c;--b:#4cc9f0;--ok:#34d399;--ac:#ffe45e}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 50% -10%,#233a78,var(--bg) 60%);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(17px,1.9vw,24px);line-height:1.5;min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px clamp(10px,2vw,20px);background:#0a1126;border-bottom:2px solid var(--ln);flex-wrap:wrap}
header h1{margin:0;font-size:clamp(17px,2.2vw,24px);flex:1;min-width:200px}
.hb{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
main{max-width:1000px;margin:0 auto;padding:12px clamp(10px,2vw,20px) 40px}
.prog{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.prog button{flex:1;min-width:46px;min-height:40px;border-radius:10px;border:2px solid var(--ln);background:var(--pn);color:var(--mu);font-weight:900;font-family:inherit;cursor:pointer;font-size:.8em}
.prog button.on{background:var(--ac);color:#2a1d00;border-color:#fff}.prog button.done{border-color:var(--ok);color:var(--ok)}
.card{background:var(--pn);border:2px solid var(--ln);border-radius:20px;padding:clamp(14px,2.5vw,28px)}
.tag{display:inline-block;background:#ffe45e;color:#2a1d00;border-radius:999px;padding:2px 12px;font-weight:900;font-size:.62em;margin-bottom:6px}
.scene{font-size:clamp(46px,9vw,92px);text-align:center;letter-spacing:.1em;margin:4px 0;min-height:1.3em}
h2{margin:4px 0 6px;font-size:clamp(20px,3.2vw,34px);line-height:1.35}
.q{font-size:clamp(19px,2.7vw,30px);font-weight:800;margin:6px 0 14px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
.opt{position:relative;text-align:left;border-radius:18px;border:3px solid;padding:14px 16px 16px;cursor:pointer;font-family:inherit;color:var(--tx);font-size:1em;font-weight:700;min-height:120px;touch-action:manipulation}
.opt.A{background:linear-gradient(#4a2a22,#33201c);border-color:var(--a)}.opt.B{background:linear-gradient(#143a52,#10283a);border-color:var(--b)}
.opt b.l{display:inline-block;font-size:1.5em;margin-right:8px}.opt.A b.l{color:var(--a)}.opt.B b.l{color:var(--b)}
.opt .n{position:absolute;right:12px;top:8px;font-size:.8em;color:var(--mu)}
.opt.win{box-shadow:0 0 0 4px var(--ok),0 0 28px #34d39988}.opt.lose{opacity:.55}
.bar{height:16px;border-radius:8px;background:#0b1430;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:width .8s}
.A .bar i{background:var(--a)}.B .bar i{background:var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:900;cursor:pointer;font-family:inherit;font-size:.9em;text-decoration:none;display:inline-flex;align-items:center;touch-action:manipulation}
.btn.pri{background:linear-gradient(#ffe45e,#ff9d2e);border-color:#fff3a0;color:#3b1600}
.btn:disabled{opacity:.4}
.rev{margin-top:14px;border:3px solid var(--ok);background:#0c2a22;border-radius:18px;padding:14px 18px;display:none}
.rev.show{display:block;animation:pop .5s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.rev h3{margin:0 0 6px;color:var(--ok);font-size:1.15em}
.rev p{margin:6px 0}
.why{background:#1a2250;border-radius:12px;padding:8px 12px;font-size:.85em;color:var(--mu)}
.bridge{margin-top:12px;border:2px dashed var(--ac);border-radius:16px;padding:12px 16px;display:none}.bridge.show{display:block}
.bridge .bm{font-weight:800;color:var(--ac)}
.note{font-size:.72em;color:#ffcf8a;margin-top:6px}
.sum{display:none;text-align:center}.sum.show{display:block}
.tip{font-size:.72em;color:var(--mu);margin-top:10px}
</style></head><body>
<header><h1>⚖️ 도입 퀴즈 · 내 무게는 얼마죠? <span style="font-size:.62em;color:var(--ac)">A/B 투표 → 반전 공개 → 시뮬레이션 연결</span></h1><a class="hb" href="./시작하기_수업게임서랍.html">🎮 게임 서랍</a><button class="hb" id="fs">⛶ 전체화면</button></header>
<main>
<div class="prog" id="prog"></div>
<div class="card" id="card"></div>
<div class="tip">진행 방법: ① 질문을 읽어 주고 ② 손든 학생 수만큼 <b>A/B 카드를 눌러 집계</b>(키보드 1·2) ③ <b>반전 공개</b>(Enter) ④ 시뮬레이션·본시 연결 → 다음 문제(→). 1번 문제가 메인 도입(3분), 2~5번은 5분 미니 도입이에요.</div>
</main>
<script>
const Q=[
{tag:'메인 도입 · 오개념 저격수',unit:'중1 힘과 운동 / 중3 운동과 에너지',scene:'🧍‍♂️⚖️',title:'체중계 위의 나, 눈금은 가만히 있을까?',
 q:'체중계 위에서 숨도 안 쉬고 가만히 서 있다. 눈금은 어떻게 될까? 그리고 내려오려고 무릎을 굽히는 순간에는?',
 A:'눈금은 딱 멈춰 있고, 내려오는 순간에도 몸무게는 그대로다.',B:'심장이 뛸 때마다 눈금이 조금씩 흔들리고, 무릎을 굽히는 순간엔 눈금이 잠깐 줄어든다.',ans:'B',
 head:'정답 B! 몸무게는 고정값이 아니에요',
 fact:['정밀한 저울은 가만히 서 있어도 심장 박동 주기로 계속 진동해요. 체중 75kg이면 진폭이 약 28g(우유 한 모금)!','심장이 피를 뿜을 때 혈액의 무게 중심이 위아래로 움직이기 때문이에요.','무릎을 굽혀 몸이 아래로 가속되는 순간에는 저울이 몸을 덜 떠받쳐도 돼서 눈금이 줄어요.'],
 why:'왜 A를 고를까? ① 무게를 내 고유한 숫자로 여기고 질량과 구별하지 못함 ② 체중계가 재는 것이 바닥이 나를 떠받치는 힘(수직항력)임을 놓침 ③ 몸 안의 움직임은 영향이 없다고 생각함',
 bridge:'오늘은 질량(변하지 않는 양)과 무게(중력의 크기)의 차이, 엘리베이터에서 몸이 무겁거나 가벼워지는 이유, 힘이 평형일 때와 아닐 때의 운동을 알아봐요!',
 sim:'자바실험실에서 "무게" "질량" "엘리베이터" 등으로 검색해 연계 시뮬레이션을 열어 보세요.',chk:false},
{tag:'미니 도입 · 밸런스 게임',unit:'중1 힘 / 중3 운동량',scene:'⏳⚖️',title:'저울 위의 모래시계',
 q:'아주 정밀한 저울 위에 모래시계를 올려놓았다. 모래시계를 뒤집으면, 모래가 떨어지는 동안 눈금은 어떻게 될까?',
 A:'모래가 떨어지는 중이라 눈금이 줄어든다(가벼워진다).',B:'거의 변하지 않는다.',ans:'B',
 head:'정답 B! 낙하하는 모래와 충격이 서로 상쇄돼요',
 fact:['낙하하는 모래알은 자유 낙하라 저울을 누르지 않지만, 바닥 모래에 부딪히는 충격이 그 부족분을 채워 줘요.','뒤집은 직후와 모래가 거의 끝날 때만 눈금이 미세하게 달라져요.'],
 why:'왜 A를 고를까? "공중에 떠 있는 모래는 저울을 누르지 않는다"는 부분만 보고 충돌의 힘을 빼먹어요.',
 bridge:'물체가 받는 힘이 그 물체의 운동(가속)을 만든다는 걸 배우면 이유가 보여요!',sim:'자바실험실 힘·운동량 관련 시뮬레이션과 연결하세요.',chk:true},
{tag:'미니 도입 · 오개념 저격수',unit:'중3 운동과 힘 (뉴턴 법칙)',scene:'🐒🍌',title:'원숭이와 바나나',
 q:'도르래에 건 줄 한쪽 끝에는 바나나, 반대쪽에는 바나나와 질량이 같은 원숭이가 매달려 있다. (줄과 도르래는 이상적) 원숭이가 줄을 타고 올라가면 바나나는?',
 A:'원숭이만 올라가고 바나나는 그대로이거나 내려간다.',B:'바나나도 같이 올라간다.',ans:'B',
 head:'정답 B! 둘은 같이 올라가요',
 fact:['줄의 장력은 양쪽이 같아서 원숭이와 바나나가 받는 알짜힘이 같아요. 질량도 같으니 가속도도 같아요.','원숭이가 줄을 당기는 만큼 줄이 원숭이를 올려 줘요. 줄을 잡은 채 올라가는 순간 바나나도 같은 가속도로 올라가요.'],
 why:'왜 A를 고를까? "원숭이가 움직이는 쪽만 움직인다"는 직관과 줄이 양쪽을 연결해 같은 장력을 전달한다는 점을 놓쳐요.',
 bridge:'힘과 질량이 가속도를 결정한다는 뉴턴 제2법칙으로 풀 수 있어요!',sim:'자바실험실 "도르래" "뉴턴 법칙" 관련 시뮬레이션과 연결하세요.',chk:true},
{tag:'미니 도입 · 밸런스 게임',unit:'중1 힘의 합성과 평형',scene:'🪝⚖️',title:'용수철 저울 45kg + 27kg',
 q:'용수철 저울을 천장에 매달고 저울 아래 줄을 당겨 눈금이 45kg이 되게 한 뒤 바닥에 단단히 고정했다. 이제 저울 고리에 27kg 물체를 매달면 눈금은?',
 A:'45 + 27 = 72kg',B:'45kg 그대로 (줄이 늘어나지 않는 이상적인 경우)',ans:'B',
 head:'정답 B! 눈금은 저울이 늘어난 길이로 정해져요',
 fact:['줄이 늘어나지 않고 바닥에 고정돼 있으면 저울의 길이가 그대로라서 눈금도 45kg 그대로예요.','대신 물체의 무게 27kg을 저울과 줄이 나눠 받아서 아래 줄의 장력이 45 - 27 = 18kg으로 줄어요.'],
 why:'왜 A를 고를까? 무게를 더하면 눈금도 더해진다는 단순 덧셈 직관 때문이에요. 힘의 평형 그림을 그려 보면 달라져요.',
 bridge:'힘의 합성과 평형(위로 당기는 힘 = 아래로 당기는 힘)을 그림으로 그려 풀어 봐요!',sim:'자바실험실 "힘의 합성" "용수철" 관련 시뮬레이션과 연결하세요.',chk:true,note:'⚠ 원문 해설과 대조해 확인하세요. (이상적인 줄·바닥 고정 가정)'},
{tag:'미니 도입 · 오개념 저격수',unit:'중1 힘, 도르래',scene:'🧒🪢🌳',title:'슈퍼우먼 — 줄로 나를 들어올리기',
 q:'나뭇가지에 건 도르래에 줄을 걸고, 의자에 앉은 여학생이 줄을 아래로 당긴다. 이 여학생은 자신과 의자를 들어올릴 수 있을까?',
 A:'자기 힘으로 자기 자신을 들 수는 없다.',B:'들어올릴 수 있다.',ans:'B',
 head:'정답 B! 도르래가 위에서 받쳐 주기 때문이에요',
 fact:['줄이 도르래를 거쳐 의자와 사람을 위로 당기고, 도르래는 나뭇가지가 지탱해요. 즉 외부(나뭇가지)에서 위로 받치는 힘이 있어요.','줄 양쪽이 모두 사람·의자를 당겨 필요한 당기는 힘이 전체 무게의 절반 정도로 줄어요.'],
 why:'왜 A를 고를까? "자기 몸을 스스로 끌어올릴 수 없다"(허리띠 들기)와 헷갈려, 도르래 지지대라는 외부의 힘을 놓쳐요.',
 bridge:'움직도르래·고정도르래와 힘의 크기 변화를 알아봐요!',sim:'자바실험실 "도르래" 관련 시뮬레이션과 연결하세요.',chk:true,note:'⚠ 원문 해설과 대조해 확인하세요. (그림의 도르래 위치 기준)'}
];
const J='https://javalab.org';
let cur=0;const V=Q.map(()=>({A:0,B:0,rev:false}));
const $=id=>document.getElementById(id);
function prog(){$('prog').innerHTML='';Q.forEach((q,i)=>{const b=document.createElement('button');b.textContent=(i===0?'메인':i+'번');b.className=(i===cur?'on ':'')+(V[i].rev?'done':'');b.onclick=()=>{cur=i;draw()};$('prog').appendChild(b)})}
function draw(){const q=Q[cur],v=V[cur],tot=v.A+v.B;prog();
 const pa=tot?Math.round(v.A/tot*100):0,pb=tot?100-pa:0;
 $('card').innerHTML=
 '<span class="tag">'+q.tag+'</span> <span class="tag" style="background:#4cc9f0">'+q.unit+'</span>'+
 '<div class="scene">'+q.scene+'</div><h2>'+q.title+'</h2><div class="q">'+q.q+'</div>'+
 '<div class="opts">'+['A','B'].map(k=>'<button class="opt '+k+(v.rev?(q.ans===k?' win':' lose'):'')+'" data-k="'+k+'"><span class="n">'+v[k]+'명'+(tot&&v.rev?' ('+(k==='A'?pa:pb)+'%)':'')+'</span><b class="l">'+k+'</b>'+q[k]+'<div class="bar"><i style="width:'+(v.rev&&tot?(k==='A'?pa:pb):0)+'%"></i></div></button>').join('')+'</div>'+
 '<div class="row"><button class="btn" id="un">↩ 집계 하나 취소</button><button class="btn" id="rs">🔄 집계 초기화</button><button class="btn pri" id="rv">💥 반전 공개 (Enter)</button><span style="color:var(--mu);font-size:.8em">총 '+tot+'명 투표</span></div>'+
 '<div class="rev'+(v.rev?' show':'')+'" id="rev"><h3>'+q.head+'</h3>'+q.fact.map(f=>'<p>'+f+'</p>').join('')+'<div class="why">'+q.why+'</div>'+(q.note?'<div class="note">'+q.note+'</div>':'')+'</div>'+
 '<div class="bridge'+(v.rev?' show':'')+'" id="br"><div class="bm">🌉 본시 연결</div><p>'+q.bridge+'</p><p style="font-size:.85em;color:var(--mu)">🔬 '+q.sim+'</p><div class="row" style="margin-top:6px"><a class="btn" href="'+J+'" target="_blank" rel="noopener">🔬 자바실험실 열기</a><button class="btn pri" id="nx">'+(cur<Q.length-1?'다음 문제 →':'🏁 마무리')+'</button></div></div>'+
 '<div class="sum" id="sm"></div>';
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>vote(b.dataset.k));
 $('un').onclick=()=>{const v=V[cur];if(v.B>0&&v.A===0)v.B--;else if(v.A>0&&v.B===0)v.A--;else if(v.B>=v.A&&v.B>0)v.B--;else if(v.A>0)v.A--;draw()};
 $('rs').onclick=()=>{V[cur].A=V[cur].B=0;V[cur].rev=false;draw()};
 $('rv').onclick=reveal;$('nx').onclick=next}
function vote(k){if(V[cur].rev)return;V[cur][k]++;draw()}
function reveal(){const v=V[cur];if(v.rev)return;v.rev=true;draw();const q=Q[cur];const tot=v.A+v.B;if(tot){const wr=q.ans==='A'?v.A:v.B;const t=document.createElement('div');t.style.cssText='margin-top:8px;font-weight:800;color:var(--ac)';t.textContent='우리 반 정답률 '+Math.round(wr/tot*100)+'% ('+wr+'/'+tot+'명)';$('rev').prepend(t)}$('rev').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(cur<Q.length-1){cur++;draw();scrollTo(0,0)}else{$('sm').className='sum show';let tw=0,tt=0;V.forEach((v,i)=>{if(v.A+v.B){tt+=v.A+v.B;tw+=Q[i].ans==='A'?v.A:v.B}});$('sm').innerHTML='<h2>🏁 오늘의 도입 끝!</h2><p>'+(tt?'전체 정답률 <b>'+Math.round(tw/tt*100)+'%</b> — 직관이 얼마나 자주 속았는지 확인했어요.':'수고했어요!')+'</p><p><b>"왜 그렇게 생각했을까?"</b> 우리의 직관이 놓친 것을 오늘 수업에서 찾아봐요.</p>';$('sm').scrollIntoView({behavior:'smooth'})}}
addEventListener('keydown',e=>{if(e.key==='1')vote('A');else if(e.key==='2')vote('B');else if(e.key==='Enter'){reveal()}else if(e.key==='ArrowRight'&&cur<Q.length-1){cur++;draw()}else if(e.key==='ArrowLeft'&&cur>0){cur--;draw()}});
$('fs').onclick=()=>{const d=document;if(!d.fullscreenElement)d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();else d.exitFullscreen()};
draw();
</script></body></html>
