<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1020" width="100%" height="100%" style="background-color: #f7faf6; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;">
  <defs>
    <!-- 그림자 필터 -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="pea-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
    <filter id="glow-highlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 둥근 완두 그라디언트 (윤기 나는 황금빛 완두콩) -->
    <radialGradient id="roundPeaGrad" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>

    <!-- 주름진 완두 그라디언트 (요철과 굴곡이 있는 황토색 완두콩) -->
    <radialGradient id="wrinkledPeaGrad" cx="42%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- 생식세포 원형 그라디언트 -->
    <radialGradient id="gameteGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- 화살표 마커 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>

    <!-- 완두콩 재사용 심볼 (둥근 완두) -->
    <g id="round-pea">
      <ellipse cx="0" cy="0" rx="38" ry="34" fill="url(#roundPeaGrad)" filter="url(#pea-shadow)"/>
      <!-- 하이라이트 반사광 -->
      <ellipse cx="-12" cy="-10" rx="14" ry="8" fill="#ffffff" opacity="0.38" transform="rotate(-18, -12, -10)"/>
    </g>

    <!-- 완두콩 재사용 심볼 (주름진 완두) -->
    <g id="wrinkled-pea">
      <!-- 굴곡진 주름 완두 패스 -->
      <path d="M -30,-18 C -36,-10 -38,4 -32,16 C -26,26 -12,32 4,31 C 18,30 32,24 35,12 C 38,-2 32,-16 22,-24 C 10,-32 -4,-30 -16,-26 C -24,-24 -28,-22 -30,-18 Z" 
            fill="url(#wrinkledPeaGrad)" filter="url(#pea-shadow)"/>
      <!-- 주름 골짜기 음영선 -->
      <path d="M -18,-8 C -10,-2 -4,8 -6,18" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M 6,-18 C 10,-6 6,4 16,14" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.4"/>
      <path d="M -8,-20 C -2,-14 12,-12 18,-4" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.35"/>
      <!-- 주름 능선 하이라이트 -->
      <path d="M -16,-14 C -12,-20 0,-22 8,-18" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M -4,2 C 2,12 8,20 18,22" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>

    <!-- 생식세포 심볼 -->
    <g id="gamete-circle">
      <circle cx="0" cy="0" r="23" fill="url(#gameteGrad)" stroke="#475569" stroke-width="1.8" filter="url(#drop-shadow)"/>
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- 1. 배경 프레임 & 장식 식물 줄기                  -->
  <!-- ========================================== -->
  <rect x="15" y="15" width="770" height="990" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#drop-shadow)"/>

  <!-- ========================================== -->
  <!-- 2. 세대 구분 좌측 뱃지                       -->
  <!-- ========================================== -->
  <!-- [어버이] 뱃지 -->
  <g transform="translate(45, 110)">
    <rect x="0" y="-18" width="76" height="36" rx="8" fill="#94a3b8" filter="url(#drop-shadow)"/>
    <text x="38" y="5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">어버이</text>
    <!-- 수평 점선 연결 -->
    <line x1="84" y1="0" x2="310" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,4"/>
  </g>

  <!-- [잡종 1대] 뱃지 -->
  <g transform="translate(45, 345)">
    <rect x="0" y="-18" width="88" height="36" rx="8" fill="#94a3b8" filter="url(#drop-shadow)"/>
    <text x="44" y="5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">잡종 1대</text>
    <!-- 수평 점선 연결 -->
    <line x1="96" y1="0" x2="390" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,4"/>
  </g>

  <!-- [잡종 2대] 뱃지 -->
  <g transform="translate(45, 620)">
    <rect x="0" y="-18" width="88" height="36" rx="8" fill="#94a3b8" filter="url(#drop-shadow)"/>
    <text x="44" y="5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">잡종 2대</text>
    <!-- 수평 점선 연결 -->
    <line x1="96" y1="0" x2="300" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,4"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. 어버이 세대 (P)                          -->
  <!-- ========================================== -->
  <!-- 순종의 둥근 완두 (좌측) -->
  <g transform="translate(370, 110)">
    <text x="0" y="-62" font-size="19" font-weight="800" fill="#0284c7" text-anchor="middle">순종의 둥근 완두</text>
    <use href="#round-pea" x="0" y="0"/>
    <text x="0" y="6" font-size="21" font-weight="800" fill="#1e293b" text-anchor="middle">RR</text>
  </g>

  <!-- 순종의 주름진 완두 (우측) -->
  <g transform="translate(590, 110)">
    <text x="0" y="-62" font-size="19" font-weight="800" fill="#0284c7" text-anchor="middle">순종의 주름진 완두</text>
    <use href="#wrinkled-pea" x="0" y="0"/>
    <text x="0" y="6" font-size="21" font-weight="800" fill="#1e293b" text-anchor="middle">rr</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. 생식세포 형성 (P -> 생식세포)                -->
  <!-- ========================================== -->
  <!-- 어버이 -> 생식세포 수직선 -->
  <line x1="370" y1="148" x2="370" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <line x1="590" y1="148" x2="590" y2="215" stroke="#94a3b8" stroke-width="2"/>

  <!-- 생식세포 R & r -->
  <g transform="translate(370, 240)">
    <use href="#gamete-circle"/>
    <text x="0" y="7" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">R</text>
  </g>

  <g transform="translate(590, 240)">
    <use href="#gamete-circle"/>
    <text x="0" y="7" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">r</text>
  </g>

  <!-- 중앙 [생식세포] 라벨 및 점선 -->
  <g transform="translate(480, 240)">
    <line x1="-80" y1="0" x2="-44" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="0" y="5" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">생식세포</text>
    <line x1="44" y1="0" x2="80" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- ========================================== -->
  <!-- 5. 잡종 1대 (F1)                           -->
  <!-- ========================================== -->
  <!-- 생식세포 -> 잡종 1대 합류 화살표 -->
  <line x1="395" y1="265" x2="436" y2="310" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="565" y1="265" x2="524" y2="310" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 잡종 1대 완두 (Rr) -->
  <g transform="translate(480, 345)">
    <use href="#round-pea" x="0" y="0"/>
    <text x="0" y="7" font-size="22" font-weight="800" fill="#1e293b" text-anchor="middle">Rr</text>
    <text x="56" y="7" font-size="20" font-weight="800" fill="#0284c7" text-anchor="start">둥근 완두</text>
  </g>

  <!-- ========================================== -->
  <!-- 6. 자가 수분 및 F1 생식세포 (4개 배우자)           -->
  <!-- ========================================== -->
  <!-- 자가 수분 텍스트 -->
  <text x="480" y="416" font-size="17" font-weight="800" fill="#1e293b" text-anchor="middle">자가 수분</text>

  <!-- 좌측 분기선 (잡종 1대 생식세포) -->
  <!-- F1 완두에서 좌측으로 내려가는 선 -->
  <path d="M 440,365 L 270,490" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <text x="350" y="405" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">잡종 1대</text>
  <text x="350" y="425" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">생식세포</text>

  <!-- 우측 분기선 (잡종 1대 생식세포) -->
  <!-- F1 완두에서 우측으로 내려가는 선 -->
  <path d="M 520,365 L 690,490" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <text x="610" y="405" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">잡종 1대</text>
  <text x="610" y="425" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">생식세포</text>

  <!-- 좌측 배우자 (R, r) -->
  <!-- 안쪽 R -->
  <g transform="translate(390, 465)">
    <use href="#gamete-circle"/>
    <text x="0" y="7" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">R</text>
  </g>
  <!-- 바깥쪽 r -->
  <g transform="translate(305, 525)">
    <use href="#gamete-circle"/>
    <text x="0" y="7" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">r</text>
  </g>

  <!-- 우측 배우자 (R, r) -->
  <!-- 안쪽 R -->
  <g transform="translate(570, 465)">
    <use href="#gamete-circle"/>
    <text x="0" y="7" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">R</text>
  </g>
  <!-- 바깥쪽 r -->
  <g transform="translate(655, 525)">
    <use href="#gamete-circle"/>
    <text x="0" y="7" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle">r</text>
  </g>

  <!-- 생식세포 -> 잡종 2대 퍼넷 마름모 칸 진입 화살표 -->
  <!-- 좌측 R -> 상단 칸 -->
  <line x1="412" y1="482" x2="442" y2="508" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 우측 R -> 상단 칸 -->
  <line x1="548" y1="482" x2="518" y2="508" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 좌측 r -> 좌측 칸 -->
  <line x1="326" y1="542" x2="352" y2="568" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 우측 r -> 우측 칸 -->
  <line x1="634" y1="542" x2="608" y2="568" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- 7. 잡종 2대 (F2) - 45도 회전 마름모 퍼넷 사각형     -->
  <!-- 중심: (480, 620), 대각선 반경: 140             -->
  <!-- ========================================== -->
  <g id="punnett-diamond" transform="translate(480, 625)">
    <!-- 전체 마름모 배경 (연보라/라벤더 파스텔) -->
    <path d="M 0,-150 L 150,0 L 0,150 L -150,0 Z" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="2.5" filter="url(#drop-shadow)"/>
    
    <!-- 4분할 내부 흰색 격자선 -->
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#ffffff" stroke-width="3"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#ffffff" stroke-width="3"/>

    <!-- [상단 칸] RR (둥근 완두) : (0, -75) -->
    <g transform="translate(0, -72)">
      <use href="#round-pea" x="0" y="0" transform="scale(0.88)"/>
      <text x="0" y="6" font-size="18" font-weight="800" fill="#1e293b" text-anchor="middle">RR</text>
      <text x="0" y="44" font-size="17" font-weight="800" fill="#0284c7" text-anchor="middle">둥근 완두</text>
    </g>

    <!-- [좌측 칸] Rr (둥근 완두) : (-75, 0) -->
    <g transform="translate(-75, 2)">
      <use href="#round-pea" x="0" y="0" transform="scale(0.88)"/>
      <text x="0" y="6" font-size="18" font-weight="800" fill="#1e293b" text-anchor="middle">Rr</text>
      <text x="0" y="44" font-size="17" font-weight="800" fill="#0284c7" text-anchor="middle">둥근 완두</text>
    </g>

    <!-- [우측 칸] (Rr) (둥근 완두) : (75, 0) - 교과서 빈칸(핑크색) -->
    <g transform="translate(75, 2)">
      <use href="#round-pea" x="0" y="0" transform="scale(0.88)"/>
      <text x="0" y="6" font-size="19" font-weight="800" fill="#db2777" text-anchor="middle">( Rr )</text>
      <text x="0" y="44" font-size="17" font-weight="800" fill="#0284c7" text-anchor="middle">둥근 완두</text>
    </g>

    <!-- [하단 칸] (rr) (주름진 완두) : (0, 75) - 교과서 빈칸(핑크색) -->
    <g transform="translate(0, 76)">
      <use href="#wrinkled-pea" x="0" y="0" transform="scale(0.88)"/>
      <text x="0" y="6" font-size="19" font-weight="800" fill="#db2777" text-anchor="middle">( rr )</text>
      <text x="0" y="44" font-size="17" font-weight="800" fill="#0284c7" text-anchor="middle">주름진 완두</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 8. 잡종 2대 유전자형 및 표현형 분리비 요약       -->
  <!-- ========================================== -->
  <g transform="translate(45, 685)">
    <!-- 유전자형 분리비 -->
    <circle cx="6" cy="-4" r="3" fill="#0284c7"/>
    <text x="18" y="0" font-size="18" font-weight="800" fill="#0284c7">잡종 2대의 유전자형</text>
    <text x="18" y="28" font-size="19" font-weight="800" fill="#0284c7">➔ RR : Rr : rr = 1 : 2 : 1</text>

    <!-- 표현형 분리비 -->
    <circle cx="6" cy="56" r="3" fill="#0284c7"/>
    <text x="18" y="60" font-size="18" font-weight="800" fill="#0284c7">잡종 2대의 표현형</text>
    <text x="18" y="88" font-size="19" font-weight="800" fill="#0284c7">➔ 둥근 완두 : 주름진 완두 = 3 : 1</text>
  </g>

  <!-- ========================================== -->
  <!-- 9. 하단 캡션 (그림 12 한 쌍의 대립 형질의 유전)   -->
  <!-- ========================================== -->
  <g transform="translate(45, 875)">
    <!-- 녹색 원형 상향 화살표 기호 -->
    <circle cx="16" cy="-6" r="14" fill="#65a30d"/>
    <path d="M 16,-13 L 21,-5 L 18,-5 L 18,1 L 14,1 L 14,-5 L 11,-5 Z" fill="#ffffff"/>
    
    <text x="38" y="0" font-size="22" font-weight="800" fill="#713f12">그림 12</text>
    <text x="116" y="0" font-size="22" font-weight="800" fill="#0f172a">한 쌍의 대립 형질의 유전</text>
  </g>

  <!-- ========================================== -->
  <!-- 10. 우측 하단 탐구 [물음] 말풍선                  -->
  <!-- ========================================== -->
  <g transform="translate(460, 835)">
    <!-- 말풍선 본체 (점선 테두리) -->
    <rect x="0" y="0" width="300" height="120" rx="28" fill="#fdfbf7" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,5" filter="url(#drop-shadow)"/>
    <!-- 말풍선 꼬리 (위쪽 퍼넷 사각형을 향함) -->
    <path d="M 140,0 L 155,-25 L 165,0 Z" fill="#fdfbf7" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,5"/>
    <path d="M 139,2 L 166,2" stroke="#fdfbf7" stroke-width="4"/> <!-- 연결부 테두리 지우기 -->

    <!-- ? 아이콘 -->
    <g transform="translate(36, 32)">
      <circle cx="0" cy="0" r="14" fill="#f59e0b"/>
      <text x="0" y="5" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">?</text>
    </g>

    <!-- [물음] 타이틀 -->
    <text x="58" y="38" font-size="20" font-weight="900" fill="#c2410c">물음</text>
    <!-- 본문 내용 -->
    <text x="108" y="38" font-size="19" font-weight="800" fill="#ea580c">잡종 2대에서</text>
    <text x="36" y="68" font-size="18" font-weight="700" fill="#c2410c">빈칸에 들어갈 유전자형을</text>
    <text x="36" y="96" font-size="18" font-weight="700" fill="#c2410c">각각 써 보자.</text>
  </g>

</svg>
