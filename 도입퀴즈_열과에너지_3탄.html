<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도입 퀴즈 · 열과 에너지 3탄</title>
<style>
:root{--bg:#0f1830;--pn:#18264a;--pn2:#223562;--ln:#3d5aa8;--tx:#f4f7ff;--mu:#aebfe8;--a:#ff8a5c;--b:#4cc9f0;--ok:#34d399;--ac:#ffe45e}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 50% -10%,#233a78,var(--bg) 60%);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(17px,1.9vw,24px);line-height:1.5;min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px clamp(10px,2vw,20px);background:#0a1126;border-bottom:2px solid var(--ln);flex-wrap:wrap}
header h1{margin:0;font-size:clamp(17px,2.2vw,24px);flex:1;min-width:200px}
.hb{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
main{max-width:1000px;margin:0 auto;padding:12px clamp(10px,2vw,20px) 40px}
.prog{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.prog button{flex:1;min-width:46px;min-height:40px;border-radius:10px;border:2px solid var(--ln);background:var(--pn);color:var(--mu);font-weight:900;font-family:inherit;cursor:pointer;font-size:.8em}
.prog button.on{background:var(--ac);color:#2a1d00;border-color:#fff}.prog button.done{border-color:var(--ok);color:var(--ok)}
.card{background:var(--pn);border:2px solid var(--ln);border-radius:20px;padding:clamp(14px,2.5vw,28px)}
.tag{display:inline-block;background:#ffe45e;color:#2a1d00;border-radius:999px;padding:2px 12px;font-weight:900;font-size:.62em;margin-bottom:6px}
.scene{font-size:clamp(46px,9vw,92px);text-align:center;letter-spacing:.1em;margin:4px 0;min-height:1.3em}
h2{margin:4px 0 6px;font-size:clamp(20px,3.2vw,34px);line-height:1.35}
.q{font-size:clamp(19px,2.7vw,30px);font-weight:800;margin:6px 0 14px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt.C{background:linear-gradient(#2c3a1c,#1f2a15);border-color:#9be15d}.opt.C b.l{color:#9be15d}.opt.D{background:linear-gradient(#3a1f4a,#291536);border-color:#c78bff}.opt.D b.l{color:#c78bff}.C .bar i{background:#9be15d}.D .bar i{background:#c78bff}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
.opt{position:relative;text-align:left;border-radius:18px;border:3px solid;padding:14px 16px 16px;cursor:pointer;font-family:inherit;color:var(--tx);font-size:1em;font-weight:700;min-height:120px;touch-action:manipulation}
.opt.A{background:linear-gradient(#4a2a22,#33201c);border-color:var(--a)}.opt.B{background:linear-gradient(#143a52,#10283a);border-color:var(--b)}
.opt b.l{display:inline-block;font-size:1.5em;margin-right:8px}.opt.A b.l{color:var(--a)}.opt.B b.l{color:var(--b)}
.opt .n{position:absolute;right:12px;top:8px;font-size:.8em;color:var(--mu)}
.opt.win{box-shadow:0 0 0 4px var(--ok),0 0 28px #34d39988}.opt.lose{opacity:.55}
.bar{height:16px;border-radius:8px;background:#0b1430;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:width .8s}
.A .bar i{background:var(--a)}.B .bar i{background:var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:900;cursor:pointer;font-family:inherit;font-size:.9em;text-decoration:none;display:inline-flex;align-items:center;touch-action:manipulation}
.btn.pri{background:linear-gradient(#ffe45e,#ff9d2e);border-color:#fff3a0;color:#3b1600}
.btn:disabled{opacity:.4}
.rev{margin-top:14px;border:3px solid var(--ok);background:#0c2a22;border-radius:18px;padding:14px 18px;display:none}
.rev.show{display:block;animation:pop .5s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.rev h3{margin:0 0 6px;color:var(--ok);font-size:1.15em}
.rev p{margin:6px 0}
.why{background:#1a2250;border-radius:12px;padding:8px 12px;font-size:.85em;color:var(--mu)}
.bridge{margin-top:12px;border:2px dashed var(--ac);border-radius:16px;padding:12px 16px;display:none}.bridge.show{display:block}
.bridge .bm{font-weight:800;color:var(--ac)}
.note{font-size:.72em;color:#ffcf8a;margin-top:6px}
.sum{display:none;text-align:center}.sum.show{display:block}
.tip{font-size:.72em;color:var(--mu);margin-top:10px}
</style></head><body>
<header><h1>🌡️ 도입 퀴즈 · 열과 에너지 3탄 <span style="font-size:.62em;color:var(--ac)">A/B 투표 → 반전 공개 → 시뮬레이션 연결</span></h1><a class="hb" href="./시작하기_수업게임서랍.html">🎮 게임 서랍</a><button class="hb" id="fs">⛶ 전체화면</button></header>
<main>
<div class="prog" id="prog"></div>
<div class="card" id="card"></div>
<div class="tip">진행 방법: ① 질문을 읽어 주고 ② 손든 학생 수만큼 <b>보기 카드를 눌러 집계</b>(키보드 1~4) ③ <b>반전 공개</b>(Enter) ④ 시뮬레이션·본시 연결 → 다음 문제(→). 1번이 메인 도입(3분), 나머지는 5분 미니 도입이에요.</div>
</main>
<script>
const Q=[{"tag": "메인 도입 · What-If", "unit": "온도와 열", "scene": "🌌🥶", "title": "우주 공간은 몇 도일까?", "q": "별빛도 없는 깜깜한 우주 빈 공간에 맨몸으로 떠 있다고 하자. 그곳의 온도는 대략 얼마일까?", "opts": ["절대영도 0K (-273℃)", "약 3K (약 -270℃)", "약 -100℃"], "ans": 1, "head": "정답 B! 우주도 완전한 0K는 아니에요", "fact": ["우주 전체에는 빅뱅의 흔적인 우주배경복사가 가득해서, 빈 공간의 온도는 약 2.7K(약 -270.5℃)예요.", "절대영도(0K)는 이론적 한계로, 자연에서는 도달하지 못해요. 참고로 지구에서 관측된 가장 낮은 기온은 남극의 약 -89℃예요."], "why": "왜 A를 고를까? \"아무것도 없다 = 완전히 차갑다 = 0\"이라고 생각하기 때문이에요.", "bridge": "온도의 뜻, 절대온도와 섭씨온도의 관계를 알아봐요!", "sim": "자바실험실 \"온도\" \"분자 운동\" 관련 시뮬레이션과 연결하세요.", "note": "⚠ 수치는 일반적으로 알려진 값이에요. 수업 전 확인하세요."}, {"tag": "미니 도입 · 밸런스 게임", "unit": "온도", "scene": "🌡️🧊", "title": "섭씨와 화씨가 같은 온도가 있을까?", "q": "섭씨(℃)와 화씨(℉) 눈금이 똑같은 숫자를 가리키는 온도가 있다. 그 온도는?", "opts": ["0도", "100도", "-40도", "그런 온도는 없다."], "ans": 2, "head": "정답 C! -40℃ = -40℉", "fact": ["화씨 = 섭씨 × 9/5 + 32 이므로, 같은 값일 때 x = 1.8x + 32, 즉 x = -40이에요.", "-40도는 아주 추운 온도예요. 이때만 두 눈금이 만나요."], "why": "왜 A를 고를까? 가장 익숙한 기준점 0을 먼저 떠올리기 때문이에요. 두 눈금은 0점과 간격이 모두 달라요.", "bridge": "온도계의 눈금은 어떻게 정해질까? 온도의 측정을 알아봐요!", "sim": "자바실험실 \"온도계\" 관련 시뮬레이션과 연결하세요."}, {"tag": "미니 도입 · 사이언스 CSI", "unit": "열의 이동 (대류)", "scene": "🇬🇧🌊🌡️", "title": "영국은 왜 그렇게 춥지 않을까?", "q": "영국은 캐나다 북동부의 래브라도와 위도가 비슷한데, 겨울에 훨씬 따뜻하다. 가장 큰 이유는?", "opts": ["영국이 태양에 더 가깝기 때문이다.", "따뜻한 바닷물(멕시코 만류)이 열을 실어 나르기 때문이다."], "ans": 1, "head": "정답 B! 바닷물이 열을 옮겨요", "fact": ["멕시코 만류는 열대의 따뜻한 바닷물을 북쪽으로 실어 날라, 유럽 서쪽 해안에 열을 전달해요.", "물은 비열이 커서 많은 열을 저장했다가 옮길 수 있어요."], "why": "왜 A를 고를까? 위도가 같으면 태양과의 거리도 같다는 점을 놓치고, 바닷물의 이동을 떠올리지 못해요.", "bridge": "열의 이동 방법(전도·대류·복사)과 비열을 알아봐요!", "sim": "자바실험실 \"대류\" \"비열\" 관련 시뮬레이션과 연결하세요."}, {"tag": "미니 도입 · 오개념 저격수", "unit": "에너지 전환", "scene": "⚽🛑", "title": "멈춘 공의 에너지는 어디로?", "q": "바닥을 굴러가던 공이 점점 느려지다가 멈췄다. 공의 운동에너지는 어떻게 되었을까?", "opts": ["그냥 사라졌다.", "주로 마찰열로 바뀌어 바닥과 공기로 퍼졌다."], "ans": 1, "head": "정답 B! 에너지는 사라지지 않고 열로 바뀌어요", "fact": ["마찰 때문에 운동에너지가 열에너지로 바뀌어요. 바닥과 공이 아주 조금 따뜻해지고, 그 열이 주위로 흩어져요.", "에너지는 사라지거나 새로 생기지 않고 형태만 바뀌어요(에너지 보존). 다만 흩어진 열은 다시 모으기 어려워요."], "why": "왜 A를 고를까? 눈에 보이는 움직임이 멈추니 에너지도 없어졌다고 느끼기 때문이에요.", "bridge": "에너지의 전환과 보존, 열이 되어 흩어지는 에너지를 알아봐요!", "sim": "자바실험실 \"에너지 전환\" \"마찰\" 관련 시뮬레이션과 연결하세요."}, {"tag": "미니 도입 · 밸런스 게임", "unit": "압력", "scene": "👠🐘", "title": "하이힐 vs 코끼리", "q": "60kg 사람이 신은 뾰족한 하이힐 굽 한 개가 바닥을 누르는 압력과, 5톤 코끼리의 발 한 개가 누르는 압력 중 어느 쪽이 클까? (굽 한 개의 면적 약 1cm², 코끼리 발 한 개 약 1000cm²라고 하자)", "opts": ["코끼리 (훨씬 무거우니까)", "하이힐 (면적이 아주 작으니까)", "둘 다 비슷하다."], "ans": 1, "head": "정답 B! 압력은 힘 ÷ 면적이에요", "fact": ["한쪽 굽에 몸무게 전부가 실린다고 보면 약 60kgf/cm², 코끼리는 발 하나에 대략 1250kgf가 실려 약 1.3kgf/cm² 정도예요.", "그래서 하이힐이 훨씬 큰 압력으로 바닥을 눌러요. 같은 힘이라도 면적이 좁으면 압력이 커져요."], "why": "왜 A를 고를까? \"무거울수록 압력이 크다\"고만 생각하고 면적을 놓치기 때문이에요.", "bridge": "압력 = 힘 ÷ 면적! 눈신발과 칼날 이야기를 풀어 봐요.", "sim": "자바실험실 \"압력\" 관련 시뮬레이션과 연결하세요.", "note": "⚠ 가정한 수치로 계산한 어림값이에요."}, {"tag": "미니 도입 · 사이언스 CSI", "unit": "소리와 빛", "scene": "⚡🔊", "title": "번개가 치고 6초 뒤 천둥이!", "q": "번쩍하는 번개를 본 뒤 6초 후에 천둥소리가 들렸다. 번개까지의 거리는 대략 얼마일까? (소리 속력 약 340m/s)", "opts": ["약 600m", "약 2km", "약 6km", "약 100km"], "ans": 1, "head": "정답 B! 6초 × 340m/s ≈ 2km", "fact": ["빛은 거의 순간적으로 도착하지만(약 30만 km/s) 소리는 초속 약 340m로 느려서 시간차가 생겨요.", "번쩍 후 3초마다 약 1km라고 어림할 수 있어요."], "why": "왜 C를 고를까? 초 단위 숫자를 거리 단위(km)와 그대로 연결하기 때문이에요.", "bridge": "소리와 빛의 속력 차이, 속력 = 거리 ÷ 시간을 알아봐요!", "sim": "자바실험실 \"소리의 속력\" \"파동\" 관련 시뮬레이션과 연결하세요."}, {"tag": "미니 도입 · What-If", "unit": "물질의 상태 변화", "scene": "🧊🧂", "title": "얼음에 소금을 뿌리면?", "q": "얼음 위에 소금을 뿌렸다. 얼음 속 온도(녹는 얼음 물의 온도)는 어떻게 될까?", "opts": ["0℃ 그대로다.", "0℃보다 내려간다.", "0℃보다 올라간다."], "ans": 1, "head": "정답 B! 소금물은 0℃보다 낮은 온도에서 얼어요", "fact": ["소금이 녹은 물은 어는점이 낮아져서, 얼음이 녹으면서 열을 흡수해 온도가 0℃ 아래로 내려가요.", "그래서 얼음과 소금을 섞으면 약 -20℃ 가까이 내려갈 수 있어서 아이스크림을 얼릴 때 쓰고, 겨울 도로의 눈을 녹일 때도 소금(염화칼슘)을 뿌려요."], "why": "왜 C를 고를까? \"소금 = 녹인다 = 따뜻하다\"라고 생각하기 때문이에요. 녹으면서 열을 빼앗아요.", "bridge": "어는점·끓는점과 상태 변화 시 열의 출입을 알아봐요!", "sim": "자바실험실 \"상태 변화\" \"어는점 내림\" 관련 시뮬레이션과 연결하세요.", "note": "⚠ 도달 온도는 소금 양에 따라 달라요(최저 약 -21℃)."}];
const L=['A','B','C','D'];
const J='https://javalab.org';
let cur=0;const V=Q.map(q=>({c:q.opts.map(()=>0),rev:false}));
const $=id=>document.getElementById(id);
function prog(){$('prog').innerHTML='';Q.forEach((q,i)=>{const b=document.createElement('button');b.textContent=(i===0?'메인':i+1);b.className=(i===cur?'on ':'')+(V[i].rev?'done':'');b.onclick=()=>{cur=i;draw()};$('prog').appendChild(b)})}
function tot(v){return v.c.reduce((a,b)=>a+b,0)}
function draw(){const q=Q[cur],v=V[cur],t=tot(v);prog();
 $('card').innerHTML=
 '<span class="tag">'+q.tag+'</span> <span class="tag" style="background:#4cc9f0">'+q.unit+'</span>'+
 '<div class="scene">'+q.scene+'</div><h2>'+q.title+'</h2><div class="q">'+q.q+'</div>'+
 '<div class="opts">'+q.opts.map((o,i)=>{const k=L[i],p=t?Math.round(v.c[i]/t*100):0;return '<button class="opt '+k+(v.rev?(q.ans===i?' win':' lose'):'')+'" data-i="'+i+'"><span class="n">'+v.c[i]+'명'+(t&&v.rev?' ('+p+'%)':'')+'</span><b class="l">'+k+'</b>'+o+'<div class="bar"><i style="width:'+(v.rev&&t?p:0)+'%"></i></div></button>'}).join('')+'</div>'+
 '<div class="row"><button class="btn" id="un">↩ 집계 하나 취소</button><button class="btn" id="rs">🔄 집계 초기화</button><button class="btn pri" id="rv">💥 반전 공개 (Enter)</button><span style="color:var(--mu);font-size:.8em">총 '+t+'명 투표</span></div>'+
 '<div class="rev'+(v.rev?' show':'')+'" id="rev"><h3>'+q.head+'</h3>'+q.fact.map(f=>'<p>'+f+'</p>').join('')+'<div class="why">'+q.why+'</div>'+(q.note?'<div class="note">'+q.note+'</div>':'')+'<div class="note">출처: 열 퍼즐 문제집의 주제와 일반 물리 설명을 바탕으로 정리 (원문과 대조해 사용하세요)</div></div>'+
 '<div class="bridge'+(v.rev?' show':'')+'" id="br"><div class="bm">🌉 본시 연결</div><p>'+q.bridge+'</p><p style="font-size:.85em;color:var(--mu)">🔬 '+q.sim+'</p><div class="row" style="margin-top:6px"><a class="btn" href="'+J+'" target="_blank" rel="noopener">🔬 자바실험실 열기</a><button class="btn pri" id="nx">'+(cur<Q.length-1?'다음 문제 →':'🏁 마무리')+'</button></div></div>'+
 '<div class="sum" id="sm"></div>';
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>vote(+b.dataset.i));
 $('un').onclick=()=>{let m=0;v.c.forEach((x,i)=>{if(x>v.c[m])m=i});if(v.c[m]>0)v.c[m]--;draw()};
 $('rs').onclick=()=>{v.c=v.c.map(()=>0);v.rev=false;draw()};
 $('rv').onclick=reveal;$('nx').onclick=next}
function vote(i){if(V[cur].rev||i>=Q[cur].opts.length)return;V[cur].c[i]++;draw()}
function reveal(){const v=V[cur];if(v.rev)return;v.rev=true;draw();const q=Q[cur],t=tot(v);if(t){const w=v.c[q.ans];const d=document.createElement('div');d.style.cssText='margin-top:8px;font-weight:800;color:var(--ac)';d.textContent='우리 반 정답률 '+Math.round(w/t*100)+'% ('+w+'/'+t+'명)';$('rev').prepend(d)}$('rev').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(cur<Q.length-1){cur++;draw();scrollTo(0,0)}else{$('sm').className='sum show';let w=0,t=0;V.forEach((v,i)=>{const s=tot(v);t+=s;w+=v.c[Q[i].ans]});$('sm').innerHTML='<h2>🏁 오늘의 도입 끝!</h2><p>'+(t?'전체 정답률 <b>'+Math.round(w/t*100)+'%</b> — 직관이 얼마나 자주 속았는지 확인했어요.':'수고했어요!')+'</p><p><b>"왜 그렇게 생각했을까?"</b> 우리의 직관이 놓친 것을 오늘 수업에서 찾아봐요.</p>';$('sm').scrollIntoView({behavior:'smooth'})}}
addEventListener('keydown',e=>{if(/^[1-4]$/.test(e.key))vote(+e.key-1);else if(e.key==='Enter')reveal();else if(e.key==='ArrowRight'&&cur<Q.length-1){cur++;draw()}else if(e.key==='ArrowLeft'&&cur>0){cur--;draw()}});
$('fs').onclick=()=>{const d=document;if(!d.fullscreenElement)d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();else d.exitFullscreen()};
draw();
</script></body></html>
