<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우주 프로그램 · 로켓 설계와 궤도 비행 게임</title>
<style>
:root{--bg:#070b16;--pn:#101830;--pn2:#17213f;--ln:#2a3a6a;--tx:#e8eefc;--mu:#9db0da;--ac:#fb923c;--ac2:#22d3ee;--ok:#34d399;--no:#f87171;--wa:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(14px,1.45vw,17px);line-height:1.5;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:8px clamp(8px,2vw,16px);background:#04070f;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:30}
header h1{margin:0;font-size:clamp(14px,2.4vw,21px);flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px clamp(8px,1.6vw,14px);font-weight:800;font-size:clamp(11px,1.6vw,14px);text-decoration:none;cursor:pointer;white-space:nowrap}
.pill{font-size:clamp(11px,1.5vw,14px);font-weight:900;color:#fed7aa;background:#3b1d0a;border:1px solid #7c3a12;padding:5px 10px;border-radius:999px;white-space:nowrap}
section{display:none;padding:12px clamp(8px,2vw,16px) 28px;max-width:1280px;margin:0 auto}
section.on{display:block}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:1.08em}
.btn{background:var(--pn2);color:var(--tx);border:2px solid var(--ln);border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:.95em}
.btn.on{border-color:var(--ac);background:#3b1d0a;box-shadow:0 0 0 3px #fb923c33}
.btn small{display:block;font-weight:600;color:var(--mu);font-size:.78em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.go{width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:linear-gradient(180deg,#fb923c,#ea580c);color:#2b0f02;font-weight:900;font-size:1.1em;cursor:pointer;box-shadow:0 4px 0 #9a3412}
.go.g2{background:linear-gradient(180deg,#34d399,#10b981);color:#04210f;box-shadow:0 4px 0 #0a7a57}
.go:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 90px}
.lab{font-size:.85em;color:var(--mu);font-weight:800;margin:10px 0 5px}
/* intro */
#sIntro{padding:0;max-width:none}
.radio{position:relative;min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#02040a}
#noise{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.radio .box{position:relative;z-index:2;max-width:760px;width:calc(100% - 24px);background:#061022e6;border:2px solid #1e3a6e;border-radius:18px;padding:18px 20px;box-shadow:0 0 40px #22d3ee22}
.radio .tt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(14px,2.1vw,19px);color:#9ff0ff;min-height:12em}
.radio .tt p{margin:0 0 .6em;opacity:0;animation:fi .5s forwards}
@keyframes fi{to{opacity:1}}
.radio .tt .st{color:#6b7fa8}
.radio .who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.astro{width:64px;height:64px;flex:none}
.tag{font-size:.8em;color:#7dd3fc;letter-spacing:.1em}
/* menu */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.mc{background:var(--pn);border:2px solid var(--ln);border-radius:16px;padding:14px;cursor:pointer;position:relative}
.mc:hover{border-color:var(--ac)}
.mc.lock{opacity:.5;cursor:not-allowed}
.mc h3{margin:0 0 4px;font-size:1.05em}
.mc .n{position:absolute;right:12px;top:8px;font-size:2em;font-weight:900;color:#ffffff14}
.mc p{margin:4px 0;color:var(--mu);font-size:.9em}
.stars{font-size:1.3em;letter-spacing:2px;color:#fbbf24}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.74em;background:#16254a;color:#bfd3ff;border:1px solid #2c4a8a;border-radius:999px;padding:2px 8px;font-weight:700}
/* brief */
.bgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media(max-width:860px){.bgrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kv div{background:var(--pn2);border-radius:12px;padding:8px 6px;text-align:center}
.kv b{display:block;font-size:1.2em;color:#fed7aa}.kv span{font-size:.78em;color:var(--mu)}
.talk{display:flex;gap:10px;align-items:flex-start}
.bubble{background:#0b1630;border:1px solid #28407a;border-radius:14px;padding:10px 12px;flex:1;font-size:.95em}
.bubble b{color:#fed7aa}
/* VAB */
.vab{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:940px){.vab{grid-template-columns:1fr}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.stg{border:1px solid var(--ln);border-radius:14px;padding:8px 10px;margin-top:8px;background:#0c1430}
.stg h4{margin:0 0 6px;font-size:.95em;display:flex;justify-content:space-between;gap:6px}
.stg h4 span{color:var(--mu);font-weight:600;font-size:.85em}
.stp{display:flex;align-items:center;gap:8px;background:var(--pn2);border-radius:12px;padding:5px 8px;margin-top:6px}
.stp span{flex:1;font-weight:800;font-size:.9em}.stp b{min-width:2em;text-align:center;font-size:1.2em}
.stp button{width:2.3em;height:2.3em;border-radius:10px;border:1px solid var(--ln);background:#22305a;color:#fff;font-weight:900;cursor:pointer}
#rsvg{width:100%;height:clamp(230px,38vh,420px);background:linear-gradient(#0a1530,#142a52);border-radius:12px;display:block}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.stat div{background:var(--pn2);border-radius:12px;padding:7px 8px}
.stat b{font-size:1.15em}.stat span{display:block;font-size:.76em;color:var(--mu)}
.good{color:#6ee7b7}.warn{color:#fcd34d}.bad{color:#fca5a5}
.bar{height:12px;background:#0a1128;border-radius:8px;overflow:hidden;margin-top:4px;position:relative}.bar i{display:block;height:100%;background:linear-gradient(90deg,#fb923c,#fbbf24);width:0;transition:width .25s}
.bar.ok i{background:linear-gradient(90deg,#22d3ee,#34d399)}.bar.over i{background:#ef4444}
.dvrow{display:flex;gap:6px;align-items:center;font-size:.85em;margin-top:3px}
.dvrow .b{flex:1;height:10px;background:#0a1128;border-radius:6px;overflow:hidden}.dvrow .b i{display:block;height:100%}
#tips{margin:8px 0 0;padding:0;list-style:none}
#tips li{background:#101e3f;border-left:4px solid var(--wa);border-radius:8px;padding:6px 9px;margin-top:5px;font-size:.88em}
#tips li.r{border-color:var(--no)}#tips li.g{border-color:var(--ok)}
/* flight */
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin-bottom:8px}
.hud div{background:#0b1630;border:1px solid #1f3262;border-radius:10px;padding:4px 8px;text-align:center}
.hud b{display:block;font-size:clamp(14px,1.9vw,19px);font-variant-numeric:tabular-nums;color:#e0f2fe}
.hud span{font-size:.7em;color:var(--mu)}
.fl{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:10px}
@media(max-width:860px){.fl{grid-template-columns:1fr}#modal{position:fixed;inset:0;border-radius:0;z-index:60;padding:10px}#modal .m{max-height:92vh}}
.cvw{position:relative}
canvas{width:100%;display:block;aspect-ratio:16/9;border-radius:12px;background:#0a1530}
#modal{position:absolute;inset:0;display:none;background:#020510d9;border-radius:12px;align-items:center;justify-content:center;padding:8px;overflow:auto;z-index:5}
#modal.on{display:flex}
#modal .m{background:var(--pn);border:2px solid var(--ac);border-radius:16px;padding:12px 14px;width:min(100%,640px);max-height:100%;overflow:auto}
#modal h3{margin:0 0 4px;font-size:1.1em;color:#fed7aa}
#modal .ctx{font-size:.88em;color:var(--mu);margin-bottom:8px}
#modal .ctx b{color:#e0f2fe}
.ch{display:block;width:100%;text-align:left;margin-top:6px;background:var(--pn2);color:var(--tx);border:2px solid var(--ln);border-radius:12px;padding:8px 10px;font-weight:800;cursor:pointer;font-size:.95em}
.ch:hover{border-color:var(--ac)}.ch small{display:block;font-weight:600;color:var(--mu);font-size:.82em;margin-top:2px}
.sidebar .card{padding:8px 10px;margin-bottom:8px}
.fuel{margin:6px 0}.fuel div{display:flex;justify-content:space-between;font-size:.82em}
#log{background:#060b1a;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;max-height:9em;overflow:auto;font-size:.85em;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace}
#log p{margin:0 0 3px}
.warp{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.warp button{flex:1 1 40px;padding:5px;font-size:.82em}
/* result */
#sResult .big{font-size:clamp(34px,7vw,64px);line-height:1}
.rbox{border:2px solid var(--ln);border-radius:16px;padding:14px;background:var(--pn)}
.rbox.ok{border-color:var(--ok);background:#0a2a22}.rbox.no{border-color:var(--no);background:#2a1214}
.rbox h2{margin:6px 0}
.rbox ul{margin:6px 0;padding-left:1.2em}
.rbox li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:.9em;margin:6px 0}td{padding:3px 6px;border-bottom:1px solid #ffffff1a}td:last-child{text-align:right;font-weight:800}
.law{background:#0b1630;border-left:4px solid var(--ac2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.92em}
</style></head><body>
<header><h1>🚀 우주 프로그램 · 로켓 설계와 궤도 비행</h1><span class="pill" id="hMis" style="display:none"></span><a class="hb" href="./시작하기_수업게임서랍.html">🎮 게임 서랍</a><button class="hb" id="fs">⛶ 전체화면</button></header>

<section id="sIntro" class="on"><div class="radio"><canvas id="noise"></canvas>
<div class="box"><div class="who"><svg class="astro" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><circle cx="32" cy="32" r="21" fill="#4ade80"/><ellipse cx="25" cy="29" rx="5.5" ry="7" fill="#fff"/><ellipse cx="39" cy="29" rx="5.5" ry="7" fill="#fff"/><circle cx="26" cy="30" r="2.6" fill="#0f172a"/><circle cx="38" cy="30" r="2.6" fill="#0f172a"/><path d="M24 41q8 6 16 0" stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M8 24q24-26 48 0" stroke="#e2e8f0" stroke-width="4" fill="none" opacity=".6"/></svg><div><div class="tag">KSC 비행 통제 센터 · 교신 채널 7</div><b style="font-size:1.1em">제바다이아 (초록 우주비행사)</b></div></div>
<div class="tt" id="tt"></div>
<button class="go" id="bStart" style="display:none">📻 교신 연결 · 임무 선택 ▶</button></div></div></section>

<section id="sMenu"><div class="card"><h2>🗺️ 미션 선택 <span style="font-size:.8em;color:var(--mu);font-weight:600">· 앞 미션을 완수하면 다음이 열려요</span></h2>
<div class="mgrid" id="mgrid"></div>
<label style="display:flex;gap:6px;align-items:center;margin-top:12px;font-size:.85em;color:var(--mu)"><input type="checkbox" id="unl"> 교사용: 모든 미션 열기</label></div></section>

<section id="sBrief"><div class="bgrid"><div class="card"><h2 id="bTitle"></h2><div class="kv" id="bKv"></div><div id="bText"></div><div class="chips" id="bChips"></div></div>
<div class="card"><div class="talk"><svg class="astro" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><circle cx="32" cy="32" r="21" fill="#4ade80"/><ellipse cx="25" cy="29" rx="5.5" ry="7" fill="#fff"/><ellipse cx="39" cy="29" rx="5.5" ry="7" fill="#fff"/><circle cx="26" cy="30" r="2.6" fill="#0f172a"/><circle cx="38" cy="30" r="2.6" fill="#0f172a"/><path d="M24 41q8 6 16 0" stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg><div class="bubble" id="bBub"></div></div>
<h2 style="margin-top:12px">📚 오늘 쓰는 물리</h2><div id="bLaw"></div>
<button class="go" id="bGo">🏗️ 로켓 조립 건물(VAB)로 이동 ▶</button><button class="btn" id="bBack" style="width:100%;margin-top:8px">◀ 미션 목록</button></div></div></section>

<section id="sVab"><div class="vab"><div>
<div class="card" id="vPay"></div>
<div class="card" style="margin-top:10px"><h2>🧱 단(스테이지) 구성 <span style="font-size:.78em;color:var(--mu);font-weight:600">· 아래 1단부터 점화, 빈 탱크는 분리</span></h2>
<div class="opts" id="vNst"></div><div id="vStages"></div><div id="vBoost"></div></div>
<div class="card" style="margin-top:10px"><h2>🌬️ 공기역학 부품</h2><div class="opts" id="vAero"></div></div></div>
<div><div class="card"><h2>📐 설계 도면 &amp; 분석</h2><svg id="rsvg" viewBox="0 0 320 420" preserveAspectRatio="xMidYMax meet"></svg>
<div class="stat" id="vStat"></div><div id="vDv"></div><ul id="tips"></ul>
<div class="row" style="margin-top:8px"><button class="btn" id="pre1">① 힘으로 밀어붙이기<small>거대 SRB 1단</small></button><button class="btn" id="pre2">② 정석 다단 로켓<small>추천 설계</small></button><button class="btn" id="pre0">③ 처음부터<small>자유 설계</small></button></div>
<button class="btn" id="pre3" style="width:100%;margin-top:8px">🧪 컴퓨터 모의 비행 (기본 결정으로 시험)<small>실제 발사 전에 설계가 날 수 있는지 계산해 봐요</small></button><div id="simRes" style="margin-top:6px;font-size:.88em"></div><button class="go" id="vGo">🚀 발사대로 이동 ▶</button><button class="btn" id="vBack" style="width:100%;margin-top:8px">◀ 브리핑</button></div></div></div></section>

<section id="sFlight"><div class="hud" id="hud"></div>
<div class="fl"><div><div class="cvw"><canvas id="cv" width="960" height="540"></canvas><div id="modal"><div class="m" id="mb"></div></div></div><div id="log" aria-live="polite"></div></div>
<div class="sidebar"><div class="card"><b>🛢️ 연료 · 단 상태</b><div id="fuel"></div></div>
<div class="card"><b>⏩ 시간 가속</b><div class="warp" id="warp"></div></div>
<div class="card"><b>🧭 비행 단계</b><div id="phase" style="font-size:.9em;color:var(--mu);margin-top:4px"></div></div></div></div></section>

<section id="sResult"><div class="rbox" id="rb"></div></section>

<script>
/* ===== 로켓 물리 엔진 (2D, 지구 실제 상수) ===== */
const G0=9.80665, RE=6371000, MU=3.986004418e14;
const rho=h=>h>140000?0:1.225*Math.exp(-Math.max(h,0)/8400);
const pRatio=h=>h>140000?0:Math.exp(-Math.max(h,0)/7800);

/* ---- 부품 도감 (질량 kg, 추력 N, Isp s, 비용 M$) ---- */
const TANKS={S:{p:8000,n:'S'},M:{p:20000,n:'M'},L:{p:50000,n:'L'},XL:{p:120000,n:'XL'}};
const tankDry=p=>0.065*p+250;
const TANKCOST=p=>p/1000*0.30;
const ENG={
  lrA:{name:'대기용 액체엔진',m:1800,Fsl:900e3,Fv:990e3,Is:285,Iv:310,thr:true,cost:9,col:'#38bdf8'},
  lrV:{name:'진공용 액체엔진',m:1100,Fsl:25e3,Fv:200e3,Is:120,Iv:455,thr:true,cost:14,col:'#a78bfa'},
};
const SRB={
  S:{prop:6000,dry:700,F:180e3,Fv:195e3,Is:235,Iv:255,cost:2.4},
  M:{prop:18000,dry:1900,F:540e3,Fv:585e3,Is:235,Iv:255,cost:7.0},
  L:{prop:40000,dry:4200,F:1200e3,Fv:1300e3,Is:235,Iv:255,cost:15.0},
};
const PAY={
  capsule:{name:'유인 캡슐',m:3000,lim:28e3,cda:1.0,cost:35},
  probe:{name:'무인 탐사 프로브',m:350,lim:12e3,cda:0.3,cost:10},
  module:{name:'우주정거장 모듈(화물)',m:9000,lim:30e3,cda:1.3,cost:60},
};
const EXTRA={solar:{m:60,cost:2},shield:{m:450,cost:4},chute:{m:180,cost:1}};
const FAIR={m:900,cost:3}, FIN={m:250,cost:1};

const DEC_M=250, ASP_ENG='lrA', ASP_TANK=20000;

/* ---- 설계 → 기체 ---- */
function buildVehicle(d){
  const V={stages:[],boost:[],pay:PAY[d.pay],payM:0,fair:!!d.fair,fin:!!d.fin,extras:d.extra||{}};
  V.payM=V.pay.m+(d.extra.solar?EXTRA.solar.m:0)+(d.extra.shield?EXTRA.shield.m:0)+(d.extra.chute?EXTRA.chute.m:0);
  let cost=V.pay.cost+(d.extra.solar?2:0)+(d.extra.shield?4:0)+(d.extra.chute?1:0)+(d.fin?1:0);
  d.stages.forEach((s,i)=>{
    let st={eng:s.eng,n:s.n};
    if(s.eng==='srb'){
      const q=SRB[s.tank];
      st.prop=q.prop*s.n;st.dry=q.dry*s.n+DEC_M;st.F=q.F*s.n;st.Fv=q.Fv*s.n;st.Is=q.Is;st.Iv=q.Iv;st.thr=false;st.col='#f97316';
      cost+=q.cost*s.n+0.5;
    }else{
      const e=ENG[s.eng],p=TANKS[s.tank].p;
      st.prop=p;st.dry=tankDry(p)+e.m*s.n+DEC_M;st.F=e.Fsl*s.n;st.Fv=e.Fv*s.n;st.Is=e.Is;st.Iv=e.Iv;st.thr=true;st.col=e.col;
      cost+=e.cost*s.n+TANKCOST(p)+0.5;
    }
    st.prop0=st.prop;V.stages.push(st);
  });
  const b=d.boost||{type:'none',n:0};
  if(b.type==='srb'&&b.n>0){
    const q=SRB[b.size||'M'];
    for(let i=0;i<b.n;i++)V.boost.push({kind:'srb',prop:q.prop,prop0:q.prop,dry:q.dry,F:q.F,Fv:q.Fv,Is:q.Is,Iv:q.Iv,pair:0});
    cost+=q.cost*b.n;
  }else if(b.type==='asp'&&b.n>0){
    const e=ENG[ASP_ENG];
    for(let k=0;k<b.n;k++){
      const dry=2*(tankDry(ASP_TANK)+e.m+150);
      V.boost.push({kind:'asp',prop:2*ASP_TANK,prop0:2*ASP_TANK,dry,F:2*e.Fsl,Fv:2*e.Fv,Is:e.Is,Iv:e.Iv,pair:k+1});
      cost+=2*(e.cost+TANKCOST(ASP_TANK))+1;
    }
  }
  V.cost=cost+(d.fair?3:0);
  // 공기저항 면적 CdA (m²)
  let cda=1.8;
  const s0=d.stages[0];
  if(s0&&s0.eng!=='srb'){const p=TANKS[s0.tank].p;cda+=({S:0,M:0.3,L:0.7,XL:1.1})[s0.tank]+(s0.n>2?0.3:0);}
  else if(s0){cda+=0.3+0.2*s0.n;}
  cda+=0.15*(d.stages.length-1);
  V.boost.forEach(b=>{cda+=(b.kind==='srb'?0.45:0.8);});
  V.cdaBody=cda;
  V.cdaPay=V.pay.cda; // 페어링 없을 때 노출 추가
  return V;
}

/* 단별 델타V·추력비 정적 분석 (진공, 무중력 시뮬) */
function analyze(d){
  const V=buildVehicle(d);
  const F=new Flight(V,{target:100000,id:0},{}, {noGrav:true});
  const out={cost:V.cost,stageDv:V.stages.map(()=>0)};
  out.m0=F.mass();
  out.twr=F.thrustNow(0)/(out.m0*G0);
  out.twrVac=F.thrustNow(1e9)/(out.m0*G0);
  out.dvSL=0;
  const dt=0.25;let guard=0;
  while(guard++<200000){
    const i=F.cur;
    if(i>=F.V.stages.length)break;
    const m=F.mass();
    const r=F.burnStep(dt,1e9,1);
    if(!r.F)break;
    out.stageDv[Math.min(i,F.V.stages.length-1)]+=r.F/m*dt;
  }
  out.dv=out.stageDv.reduce((a,b)=>a+b,0);
  out.mpay=V.payM+(V.fair?FAIR.m:0)+(V.fin?FIN.m:0);
  // 필요 델타V는 미션이 정함
  // 해수면 발사 추력비 보강: 1단 TWR
  return out;
}

/* ---- 비행 시뮬레이터 ---- */
class Flight{
  constructor(V,mission,dec,opt){
    this.V=V;this.M=mission;this.dec=dec||{};this.opt=opt||{};
    this.cur=0;this.t=0;this.alive=true;this.fairOn=V.fair;this.fairGone=false;
    this.x=0;this.y=RE;this.vx=0;this.vy=0; // 발사대: 정지, +x 방향이 '동쪽'
    this.phase='pad';this.log=[];this.thrOn=false;this.thrNow=0;
    this.maxQ=0;this.maxG=0;this.alpha=0;this.pitch=90;this.kickT=null;this.kickDone=false;
    this.pending=null;this.result=null;this.burnT=0;this.apoCut=false;this.heat=0;this.maxHeat=0;
    this.trail=[];this.reent=null;this.chute=false;this.chuteOK=null;this.dvUsed=0;
    this.stageEvents=[];this.pendingStage=null;
    this.cutAlt=0;this.cutWhy='';
  }
  get r(){return Math.hypot(this.x,this.y)}
  get h(){return this.r-RE}
  get v(){return Math.hypot(this.vx,this.vy)}
  get vr(){return (this.x*this.vx+this.y*this.vy)/this.r}
  get vt(){return (-this.y*this.vx+this.x*this.vy)/this.r}
  mass(){
    if(this.capOnly)return this.V.payM;
    const V=this.V;let m=V.payM+(this.fairOn?FAIR.m:0)+(V.fin?FIN.m:0);
    for(let i=this.cur;i<V.stages.length;i++){m+=V.stages[i].dry+V.stages[i].prop}
    V.boost.forEach(b=>{if(!b.gone)m+=b.dry+b.prop});
    if(this.opt.retro)m+=0;
    return m;
  }
  /* 현재 엔진 집합의 추력(N) */
  thrustNow(h,thrCmd){
    const V=this.V;if(this.cur>=V.stages.length)return 0;
    const pr=h>1e8?0:pRatio(h),s=V.stages[this.cur];
    const th=(thrCmd===undefined?1:thrCmd);
    let F=0;
    const mix=(Fv,Fs,t)=>(Fv-(Fv-Fs)*pr)*t;
    // 심 불꽃: 코어
    if(s.prop>0)F+=mix(s.Fv,s.F,s.thr?th:1);
    V.boost.forEach(b=>{if(!b.gone&&b.prop>0){F+=(b.kind==='srb')?mix(b.Fv,b.F,1):mix(b.Fv,b.F,th)}});
    return F;
  }
  /* 한 스텝 연소: 질량 소모·단 분리. 반환 {F,Isp} */
  burnStep(dt,h,th){
    const V=this.V;if(this.cur>=V.stages.length)return {F:0};
    const pr=h>1e8?0:pRatio(h);
    let Ftot=0,mdot=0;
    const s=V.stages[this.cur];
    const coreEmpty=s.prop<=0;
    const mixF=(Fv,Fs,t)=>(Fv-(Fv-Fs)*pr)*t;
    const mixI=(Iv,Is)=>Iv-(Iv-Is)*pr;
    // 비동기 연소: 점화 중인 엔진 목록
    const feed=[]; // 크로스피드 연료원 순서
    const asps=V.boost.filter(b=>b.kind==='asp'&&!b.gone).sort((a,b)=>a.pair-b.pair);
    let any=false;
    // SRB 부스터: 독립 연소
    V.boost.forEach(b=>{
      if(b.kind==='srb'&&!b.gone&&b.prop>0){
        const f=mixF(b.Fv,b.F,1),is=mixI(b.Iv,b.Is);
        let md=f/(is*G0)*dt;if(md>b.prop){const k=b.prop/md;md=b.prop;Ftot+=f*k}else Ftot+=f;
        b.prop-=md;mdot+=md;any=true;
      }
    });
    // 코어 엔진
    if(!coreEmpty){
      const t=s.thr?th:1;
      const f=mixF(s.Fv,s.F,t),is=mixI(s.Iv,s.Is);
      let md=f/(is*G0)*dt;
      // 연료: 먼저 아시파라거스 쌍(바깥쪽부터), 다음 코어
      Ftot+=f;mdot+=md;any=true;
      let rem=md;
      for(const a of asps){if(rem<=0)break;const u=Math.min(a.prop,rem);a.prop-=u;rem-=u}
      if(rem>0){s.prop=Math.max(0,s.prop-rem)}
    }
    // 아시파라거스 엔진: 코어와 같이 연료 공급을 받음 (코어 살아 있을 때만)
    if(!coreEmpty){
      for(const a of asps){
        if(a.prop<=0&&!a.dropNow)continue;
        const t=th;const f=mixF(a.Fv,a.F,t),is=mixI(a.Iv,a.Is);
        let md=f/(is*G0)*dt;Ftot+=f;mdot+=md;
        let rem=md;for(const b of asps){if(rem<=0)break;const u=Math.min(b.prop,rem);b.prop-=u;rem-=u}
        if(rem>0){s.prop=Math.max(0,s.prop-rem)}
        any=true;
      }
    }
    // 분리 처리
    const ev=[];
    V.boost.forEach(b=>{if(!b.gone&&b.prop<=1e-6){b.gone=true;ev.push(b.kind==='srb'?'SRB 부스터 분리':'아시파라거스 '+b.pair+'번 쌍 분리')}});
    if(s.prop<=1e-6&&!s.dropped){
      // 코어 연료 소진 → 다음 단
      let boostLeft=V.boost.some(b=>!b.gone&&b.kind==='asp');
      s.dropped=true;this.cur++;ev.push((this.cur)+'단 분리');
      V.boost.forEach(b=>{if(b.kind==='asp'&&!b.gone){b.gone=true}});
    }
    this.stageEvents.push(...ev);
    return {F:any?Ftot:0,mdot};
  }
}

/* ---- 궤도 요소 ---- */
function orbit(f){
  const r=f.r,v2=f.vx*f.vx+f.vy*f.vy;
  const eps=v2/2-MU/r;
  const dot=f.x*f.vx+f.y*f.vy;
  const ex=(v2-MU/r)*f.x/MU-dot*f.vx/MU;
  const ey=(v2-MU/r)*f.y/MU-dot*f.vy/MU;
  const e=Math.hypot(ex,ey);
  const hh=f.x*f.vy-f.y*f.vx;
  const p=hh*hh/MU;
  if(eps>=0)return {esc:true,eps,e,peri:p/(1+e)-RE,apo:Infinity,a:Infinity};
  const a=-MU/(2*eps);
  return {esc:false,eps,e,a,peri:a*(1-e)-RE,apo:a*(1+e)-RE,T:2*Math.PI*Math.sqrt(a*a*a/MU)};
}


const DVR={weak:4,good:90};
const PROG={std:[70000,0.7],k:1.0,cl:7};
Flight.prototype.accel=function(x,y,vx,vy,m,F,dx,dy,cda){
  const r=Math.hypot(x,y),g=MU/(r*r);
  let ax=-g*x/r,ay=-g*y/r;
  if(F>0){ax+=F*dx/m;ay+=F*dy/m}
  const rh=rho(r-RE);
  if(rh>0&&cda>0){const v=Math.hypot(vx,vy);if(v>0){const D=0.5*rh*v*cda;ax-=D/m*vx;ay-=D/m*vy}}
  return [ax,ay];
};
Flight.prototype.vacPitch=function(vrc){
  const m=this.mass();const F=this.thrustNow(this.h,1);const aT=Math.max(F/m,0.1);
  const g=MU/(this.r*this.r),cf=this.vt*this.vt/this.r;
  let s=(g-cf)/aT;s=Math.max(-0.7,Math.min(0.98,s));
  let p=Math.asin(s)*180/Math.PI+(vrc-this.vr)*0.05;
  return Math.max(-25,Math.min(65,p));
};
Flight.prototype.qLim=function(){
  let lim=50e3;if(!this.fairOn)lim=Math.min(lim,this.V.pay.lim);return lim;
};
Flight.prototype.dropFair=function(){
  this.fairOn=false;this.fairGone=true;this.fairQ=0.5*rho(this.h)*this.v*this.v;
  this.note('페어링 분리 (고도 '+(this.h/1000).toFixed(0)+' km, 동압 '+(this.fairQ/1000).toFixed(1)+' kPa)');
};
Flight.prototype.note=function(s){this.log.push('T+'+Math.round(this.t)+'s '+s)};
Flight.prototype.fail=function(code,msg){if(!this.alive)return;this.alive=false;this.phase='failed';this.result={ok:false,code,msg};};
Flight.prototype.win=function(extra){this.alive=false;this.phase='done';this.result=Object.assign({ok:true},extra||{});};
Flight.prototype.dvLeftCalc=function(){
  const V=this.V;let dv=0,m=this.mass();
  for(let i=this.cur;i<V.stages.length;i++){const s=V.stages[i];if(s.prop>0)dv+=s.Iv*G0*Math.log(m/(m-s.prop));m=m-s.prop-s.dry}
  return dv;
};
Flight.prototype.dvLeftSim=function(){
  const V=JSON.parse(JSON.stringify(this.V));
  const g=new Flight(V,this.M,{});g.cur=this.cur;g.fairOn=this.fairOn;
  let dv=0,n=0;
  while(g.cur<V.stages.length&&n++<4000){const m=g.mass();const r=g.burnStep(0.5,1e9,1);if(!r.F)break;dv+=r.F/m*0.5}
  return dv;
};
Flight.prototype.thrustOn=function(){return this.cur<this.V.stages.length};

/* 궤도 도달 판정 */
Flight.prototype.judgeOrbit=function(){
  const O=orbit(this),T=this.M.target;this.orb=O;
  this.dvLeft=this.dvLeftSim();
  if(O.esc){this.fail('esc_early','🚀 이미 탈출 속도를 넘겼습니다! 이번 미션은 원궤도가 목표예요.');return false}
  if(O.peri<0){this.fail('suborb','💥 수평 속도 부족! 근지점 '+(O.peri/1000).toFixed(0)+' km (지면 아래) — 높이만 올라갔다가 지구 중력에 끌려 포물선으로 추락했습니다. 궤도를 돌려면 수평으로 약 7.8 km/s가 필요해요!');return false}
  if(O.peri<80000){this.fail('decay','🔥 근지점 '+(O.peri/1000).toFixed(0)+' km — 아직 대기권 안! 몇 바퀴 못 돌고 공기 저항에 속도를 잃고 불덩이가 됩니다.');return false}
  if(O.peri<T-4000){this.fail('low','🛰️ 근지점 '+(O.peri/1000).toFixed(0)+' km — 목표 '+(T/1000)+' km에 못 미칩니다. 연료가 바닥났어요!');return false}
  if(O.apo>T*1.35+30000){this.fail('ecc','🛰️ 궤도가 너무 찌그러졌어요 (원지점 '+(O.apo/1000).toFixed(0)+' km). 안정적인 원형 궤도가 아닙니다.');return false}
  this.note('원궤도 완성: 근지점 '+(O.peri/1000).toFixed(0)+' km × 원지점 '+(O.apo/1000).toFixed(0)+' km');
  return true;
};
Flight.prototype.afterOrbit=function(){
  const M=this.M,V=this.V,D=this.dec;
  if(M.solar&&!V.extras.solar){this.fail('power','☀️ 태양전지판이 없어요! 배터리 3시간 후 방전 — 프로브가 우주 미아(우주 쓰레기)가 되었습니다. 우주에선 전력이 곧 생명!');return}
  if(M.reentry){this.phase='orbit_ok';return}
  if(M.escape){this.phase='orbit_ok';return}
  this.win({orb:this.orb});
};
Flight.prototype.step=function(dt){
  if(!this.alive||this.pending)return;
  const V=this.V,M=this.M,D=this.dec;
  let h=this.h,r=this.r;
  const rhat=[this.x/r,this.y/r],that=[-this.y/r,this.x/r];
  const vv=this.v;
  const O=orbit(this);
  let thr=0,pitch=this.pitch;
  const gamma=vv>1?Math.atan2(this.vr,this.vt)*180/Math.PI:90;
  const alive=this.thrustOn();
  // ----- 발사대 -----
  if(this.phase==='pad'){
    if(!D.thr){this.pending='thr';return}
    const F0=this.thrustNow(0,1);
    if(F0/(this.mass()*G0)<1.0){this.fail('pad','🔥 TWR '+(F0/(this.mass()*G0)).toFixed(2)+' < 1! 엔진은 포효하는데 로켓은 꿈쩍도 안 합니다. 추력이 무게(질량×중력)보다 커야 떠요!');return}
    this.phase='ascent';this.note('이륙!');
  }
  // ----- 상승 -----
  if(this.phase==='ascent'){
    if(!D.pitch&&this.v>=45){this.pending='pitch';return}
    if(V.fair&&this.fairOn&&!D.fair&&h>=12000){this.pending='fair';return}
    if(!D.circ&&(h>=45000)){this.pending='circ';return}
    if(this.fairOn){
      if(D.fair==='early'&&h>=12000)this.dropFair();
      else if(D.fair==='late'&&h>=80000)this.dropFair();
    }
    const dp=D.pitch||'std';
    const prog=(hend,hs,ex)=>Math.max(0,90*(1-Math.pow(Math.max(0,h-hs)/(hend-hs),ex)));
    if(vv<45)pitch=90;
    else if(h>=50000){pitch=this.vacPitch(Math.max(-30,Math.min(150,(M.target*1.03-h)/40)))}
    else if(dp==='std'){const gt=prog(PROG.std[0],0,PROG.std[1]);const gg=Math.min(gamma,90);pitch=gg-Math.max(-PROG.cl,Math.min(PROG.cl,PROG.k*(gg-gt)))}
    else if(dp==='late'){pitch=h<20000?90:75}
    else{pitch=h<400?90:(h<7000?32:prog(22000,7000,0.8))}
    pitch=Math.max(pitch,-25);
    thr=1;
    const q=0.5*rho(h)*vv*vv;
    if(D.thr==='maxq'&&q>18e3)thr=Math.max(0.3,1-(q-18e3)/16e3);
    if(D.circ!=='direct'&&O.apo>=M.target*1.03&&!O.esc){
      if(h>=70000){this.phase='coast';this.tCoast=this.t;this.note('엔진 컷오프 (고도 '+(h/1000).toFixed(0)+' km, 원지점 '+(O.apo/1000).toFixed(0)+' km)')}
      thr=0;
    }
    if(D.circ==='direct'&&O.peri>=M.target&&!O.esc&&h>70000){thr=0;if(this.judgeOrbit())this.afterOrbit();return}
  }
  else if(this.phase==='coast'){
    if(D.circ==='skip'){if(this.vr<=0&&this.t>this.tCoast+2){if(this.judgeOrbit())this.afterOrbit();return}}
    else if(this.vr<=0&&this.t>this.tCoast+2){this.phase='circ';this.note('정점 도달 – 원궤도화 연소 점화')}
  }
  if(this.phase==='circ'){
    if(O.peri>=M.target&&!O.esc){thr=0;if(this.judgeOrbit())this.afterOrbit();return}
    thr=1;pitch=this.vacPitch(0);
  }
  if(this.phase==='esc'){
    thr=1;pitch=0;
    if(O.esc&&O.eps>2e6){this.win({orb:O,esc:true});return}
  }
  // 연료가 다 떨어졌는가
  if((this.phase==='ascent'||this.phase==='circ'||this.phase==='esc')&&!alive){
    this.note('연료 소진');
    if(this.phase==='esc'){const o=orbit(this);this.fail('esc_low','🛰️ 지구 중력권 탈출 실패! 연료가 바닥나 타원궤도(원지점 '+(o.apo/1000).toFixed(0)+' km)에 갇혔습니다. 탈출에는 약 11.2 km/s(제2우주속도)가 필요해요.');return}
    if(h>70000&&O.peri>=80000){if(this.judgeOrbit())this.afterOrbit();return}
    this.phase='doomed';
  }
  if(this.phase==='doomed'||this.phase==='coast'||this.phase==='orbit_ok'||this.phase==='reentry'||this.phase==='descent'){if(this.phase!=='coast')thr=0}
  // ----- 물리 적분 -----
  const th=Math.max(0,Math.min(1,thr));
  let Fx=0,dir=[0,0],mdot=0;
  const m0=this.mass();
  if(th>0&&alive&&(this.phase==='ascent'||this.phase==='circ'||this.phase==='esc')){
    const pr=pitch*Math.PI/180;
    dir=[Math.cos(pr)*that[0]+Math.sin(pr)*rhat[0],Math.cos(pr)*that[1]+Math.sin(pr)*rhat[1]];
    const b=this.burnStep(dt,h,th);Fx=b.F;this.thrOn=Fx>0;this.thrNow=Fx;this.pitch=pitch;
    if(this.stageEvents.length){this.stageEvents.forEach(e=>this.note(e));this.stageEvents=[]}
  }else{this.thrOn=false;this.thrNow=0}
  let cda=V.cdaBody+(V.fair&&this.fairOn?0:V.cdaPay);
  if(this.phase==='reentry'||this.phase==='descent')cda=this.reCda;
  if(this.chute)cda=this.reCda+(this.chuteCda-this.reCda)*Math.pow(Math.min(1,(this.t-this.tChute)/14),2);
  const vhat=vv>1?[this.vx/vv,this.vy/vv]:dir;
  let al=0;
  if(Fx>0&&vv>5){al=Math.acos(Math.max(-1,Math.min(1,dir[0]*vhat[0]+dir[1]*vhat[1])))*180/Math.PI}
  this.alpha=al;
  if(this.phase==='ascent')cda*=1+8*Math.pow(Math.sin(al*Math.PI/180),2);
  const m=m0;
  const fA=(x,y,vx,vy)=>this.accel(x,y,vx,vy,m,Fx,dir[0],dir[1],cda);
  const x0=this.x,y0=this.y,u0=this.vx,w0=this.vy;
  const k1=fA(x0,y0,u0,w0);
  const k2=fA(x0+u0*dt/2,y0+w0*dt/2,u0+k1[0]*dt/2,w0+k1[1]*dt/2);
  const k3=fA(x0+(u0+k1[0]*dt/2)*dt/2,y0+(w0+k1[1]*dt/2)*dt/2,u0+k2[0]*dt/2,w0+k2[1]*dt/2);
  const k4=fA(x0+(u0+k2[0]*dt/2)*dt,y0+(w0+k2[1]*dt/2)*dt,u0+k3[0]*dt,w0+k3[1]*dt);
  this.x=x0+dt*(u0+(u0+k1[0]*dt/2)*2+(u0+k2[0]*dt/2)*2+(u0+k3[0]*dt))/6;
  this.y=y0+dt*(w0+(w0+k1[1]*dt/2)*2+(w0+k2[1]*dt/2)*2+(w0+k3[1]*dt))/6;
  this.vx=u0+dt*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6;
  this.vy=w0+dt*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6;
  this.t+=dt;
  if(this.phase==='reentry'||this.phase==='descent'){
    const rh=rho(this.h),vq=this.v;
    const flux=1.74e-4*Math.sqrt(rh)*vq*vq*vq;
    this.flux=flux;if(flux>this.maxFlux)this.maxFlux=flux;
    const lim=V.extras.shield?4.5e6:0.9e6;
    const gl=Math.abs(0.5*rh*vq*vq*(this.chute?this.reCda+(this.chuteCda-this.reCda)*Math.pow(Math.min(1,(this.t-this.tChute)/14),2):this.reCda)/this.V.payM)/G0;
    this.gNow=gl;if(gl>this.maxG)this.maxG=gl;
    if(flux>lim){this.fail('burn','🔥 '+(V.extras.shield?'방열판 한계 초과! ':'방열판이 없어요! ')+'대기권 재진입 가열 '+(flux/1e6).toFixed(1)+' MW/m² (한계 '+(lim/1e6).toFixed(1)+') — 캡슐이 유성처럼 불타 사라졌습니다.');return}
    if(gl>11&&V.pay.name.indexOf('유인')>=0){this.fail('gforce','💥 감속 중력가속도 '+gl.toFixed(0)+' g! 너무 가파르게 진입해 승무원이 버틸 수 없습니다 (한계 약 11 g).');return}

Flight.prototype.dtFor=function(){
  if(this.phase==='coast'||this.phase==='doomed'||this.phase==='orbit_ok'){
    if(this.h<90000)return 0.5;return 2;
  }
  if(this.phase==='descent')return 0.05;
  if(this.phase==='reentry')return this.h<130000?0.2:1;
  return 0.1;
};

/* ---- 자동 조종 실행 (테스트·검증용) ---- */
function runFlight(d,mission,dec,maxT){
  const V=buildVehicle(d);
  const f=new Flight(V,mission,Object.assign({},dec));
  let g=0;
  while(f.alive&&g++<400000){
    if(f.pending){f.dec[f.pending]=dec[f.pending]||'x';f.pending=null}
    if(f.phase==='orbit_ok'){break}
    f.step(f.dtFor());
    if(f.t>(maxT||9000))break;
  }
  return f;
}

 }
 // 단
 D.stages.forEach((s,i)=>{
  const h=hOf(s)*sc,col=s.eng==='srb'?'#f97316':s.eng==='lrA'?'#38bdf8':'#a78bfa';

 });

 else{o+=`<path d="M${cx-18} ${y} l0 ${-ph} q18 -28 36 0 l0 ${ph}z" fill="${pc}" stroke="#0007"/>`}

 if(!D.fair)o+=solar;
 o+=`<text x="${cx}" y="${y-ph-(D.fair?44:26)}" fill="#fed7aa" font-size="12" font-weight="800" text-anchor="middle">${PAYN[D.pay][1]}</text>`;
