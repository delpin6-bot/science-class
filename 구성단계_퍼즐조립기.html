<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>생물의 구성 단계 퍼즐 조립기</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--line:#cbd5e1;--ink:#0f172a;--mut:#475569;--blue:#2563eb;--fs:clamp(15px,1.25vw,20px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#0f172a;color:#fff;flex-wrap:wrap}
header h1{font-size:clamp(16px,1.6vw,24px);font-weight:900;white-space:nowrap}
header h1 small{font-size:.6em;font-weight:600;opacity:.7;margin-left:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:48px;padding:0 14px;border-radius:12px;border:2px solid #334155;background:#1e293b;color:#e2e8f0;font-weight:900;font-size:clamp(14px,1.2vw,19px)}
.tab.on{background:#fde68a;border-color:#fde68a;color:#1f2937}
.sp{flex:1}
.hb{min-height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:2px solid #334155;background:#1e293b;color:#e2e8f0;font-weight:800;font-size:clamp(13px,1.1vw,17px);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hb.quiz{background:#7c3aed;border-color:#7c3aed;color:#fff}.hb.life{background:#0d9488;border-color:#0d9488;color:#fff}
main{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px}
.mode{display:none;height:100%}
.mode.on{display:grid;gap:10px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.stagewrap{flex:1;min-height:250px;position:relative;padding:0;overflow:hidden;background:linear-gradient(#f8fafc,#e2e8f0)}
.graphwrap{flex:1;min-height:240px;position:relative;padding:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:14px;font-weight:900;font-size:clamp(16px,1.5vw,24px);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:92%}
.toast.show{opacity:1}
.ctl{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font-weight:900;color:var(--mut);min-width:4.2em}
.btn{min-height:52px;min-width:52px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#f8fafc;color:var(--ink);font-weight:900;font-size:clamp(14px,1.25vw,20px)}
.btn:active{transform:scale(.95)}
.btn.on{background:#dbeafe;border-color:var(--blue);color:#1d4ed8}
.btn.go{background:#16a34a;border-color:#16a34a;color:#fff}.btn.go.pause{background:#f59e0b;border-color:#f59e0b}
.btn.dng{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
.btn.pre{background:#fffbeb;border-color:#fcd34d;color:#92400e}
.btn.hold{background:#e0f2fe;border-color:#38bdf8;color:#075985}
input[type=range]{flex:1;min-width:140px;height:44px;accent-color:#2563eb}
.tval{font-weight:900;font-size:clamp(18px,1.8vw,28px);min-width:4.2em;text-align:right;font-variant-numeric:tabular-nums}
.hudtop{display:flex;gap:8px;flex-wrap:wrap}
.hc{flex:1;min-width:110px;background:#f8fafc;border:2px solid var(--line);border-radius:12px;padding:5px 8px;text-align:center}
.hc span{display:block;font-size:.78em;font-weight:800;color:var(--mut)}
.hc b{display:block;font-size:clamp(19px,1.9vw,30px);font-weight:900;font-variant-numeric:tabular-nums}
.runs{display:flex;flex-direction:column;gap:6px}
.rr{display:flex;align-items:center;gap:8px;background:#f8fafc;border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:800;flex-wrap:wrap}
.rr i{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.rr .n{min-width:6.4em;font-weight:900}.rr .t{min-width:3.9em;font-weight:900;font-size:1.15em;font-variant-numeric:tabular-nums}
.rr .s{color:var(--mut);min-width:6.4em}.rr .a{flex:1;min-width:8em;font-size:.92em}
.rr.hit{border-color:#f59e0b;background:#fffbeb}
.sum{background:#eff6ff;border:2px solid #93c5fd;border-radius:14px;padding:8px 12px;font-weight:800;font-size:clamp(14px,1.25vw,20px);line-height:1.5;min-height:3.2em}
.sum.idle{background:#f8fafc;border-color:var(--line);color:var(--mut);font-weight:700}
.sum.key{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
.legend{position:absolute;right:10px;top:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-weight:800;font-size:clamp(12px,1vw,16px);background:rgba(255,255,255,.9);border-radius:10px;padding:4px 8px;max-width:70%}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:3px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.qbox{background:#fff;border-radius:22px;width:min(860px,100%);max-height:94vh;overflow:auto;padding:18px 20px}
.qbox h2{font-size:clamp(18px,1.8vw,28px);margin-bottom:6px}
.qprog{color:var(--mut);font-weight:800;margin-bottom:8px}
.qq{font-size:clamp(18px,1.9vw,30px);font-weight:900;line-height:1.45;margin:6px 0 12px}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{min-height:60px;text-align:left;padding:10px 16px;border-radius:14px;border:3px solid var(--line);background:#f8fafc;font-weight:800;font-size:clamp(16px,1.5vw,24px)}
.qopt.right{background:#dcfce7;border-color:#22c55e}.qopt.wrong{background:#fee2e2;border-color:#ef4444}
.qexp{margin-top:12px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:2px solid #93c5fd;font-weight:800;font-size:clamp(15px,1.4vw,22px);line-height:1.5;display:none}
.qexp.on{display:block}
.qfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}
.lc{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#f8fafc}
.lc .big{font-size:clamp(22px,2.4vw,34px);font-weight:900;color:#0f766e}
.lc b{display:block;font-size:1.1em;margin:2px 0}
.lc small{display:block;color:var(--mut);font-weight:700;line-height:1.4}
@media (max-width:980px){body{overflow:auto}main{overflow:visible}.mode.on{display:flex;flex-direction:column;height:auto}.stagewrap{min-height:300px}.graphwrap{min-height:280px}}
#top{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:6px 12px;background:#e2e8f0;flex-wrap:wrap}
#pbar{flex:1;min-width:260px;display:flex;gap:6px}
.pseg{flex:1;min-height:42px;border:2px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:clamp(12px,1.05vw,16px);padding:2px 8px;text-align:center;line-height:1.2}
.pseg.ok{background:#dcfce7;border-color:#22c55e;color:#166534}
.badge{min-height:42px;padding:0 12px;border-radius:12px;border:2px dashed #94a3b8;background:#f8fafc;color:#94a3b8;font-weight:900;font-size:clamp(12px,1.05vw,16px);display:inline-flex;align-items:center}
.badge.on{border-style:solid;color:#fff}
.badge.b1.on{background:#2563eb;border-color:#1d4ed8}.badge.b2.on{background:#dc2626;border-color:#b91c1c}.badge.b3.on{background:#7c3aed;border-color:#6d28d9}
.mode.on.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pc2{border:3px solid var(--line);border-radius:16px;background:#fff;padding:8px 12px;font-weight:800;cursor:pointer;min-height:96px;line-height:1.5;font-size:clamp(13px,1.15vw,18px)}
.pc2 h3{font-size:1.25em}.pc2 .hid{color:#94a3b8}.pc2.open{border-color:#f59e0b;background:#fffbeb}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:clamp(84px,12vh,120px);border:4px dashed #94a3b8;border-radius:16px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;padding:4px;font-size:clamp(12px,1.1vw,17px);line-height:1.3}
.slot b{font-size:1.6em;color:#94a3b8}.slot.hot{border-style:solid;border-color:#f59e0b;background:#fffbeb}.slot.ok{border-style:solid;border-color:#22c55e;background:#f0fdf4}
.blk{min-height:64px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:6px 12px;font-weight:900;display:flex;align-items:center;gap:8px;touch-action:none;cursor:grab;box-shadow:0 3px 0 #cbd5e1;font-size:clamp(14px,1.25vw,20px);line-height:1.3}
.blk.sel{border-color:#f59e0b;background:#fffbeb;box-shadow:0 0 0 4px #fde68a}
.blk.drag{position:fixed;z-index:60;pointer-events:none;transform:scale(1.06) rotate(-3deg);box-shadow:0 14px 26px rgba(0,0,0,.3)}
.blk.shake{animation:shk .45s;border-color:#ef4444;background:#fee2e2}

@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.pool{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fb{border-radius:14px;padding:10px 14px;font-weight:800;line-height:1.5;border:3px solid #fcd34d;background:#fffbeb;font-size:clamp(14px,1.25vw,20px);min-height:3.4em}
.fb.bad{border-color:#f87171;background:#fef2f2;color:#991b1b}.fb.good{border-color:#4ade80;background:#f0fdf4;color:#166534}
.chk2{display:flex;gap:6px;flex-wrap:wrap}
.btn.chip.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.btn.chip.done{background:#dcfce7;border-color:#22c55e}.btn.chip:disabled{opacity:.45}
.btn.next{animation:pls2 1s infinite}
@keyframes pls2{50%{box-shadow:0 0 0 7px rgba(250,204,21,.6)}}
.lgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:8px}
#top{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:6px 12px;background:#e2e8f0;flex-wrap:nowrap}
.pseg{flex:0 0 auto;white-space:nowrap;min-height:42px;border:2px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:clamp(12px,1.05vw,16px);padding:2px 10px}
.pseg.ok{background:#dcfce7;border-color:#22c55e;color:#166534}
#pbar{overflow-x:auto}
.mode.on{display:block}
main{padding:10px 12px 18px}
.bld{display:flex;flex-direction:column;gap:10px;max-width:1280px;margin:0 auto}
.trk{display:flex;gap:6px}
.chip{flex:1 1 0;min-width:0;min-height:56px;border-radius:14px;border:3px solid #cbd5e1;background:#fff;font-weight:900;font-size:clamp(15px,1.5vw,24px);padding:4px 6px;color:#64748b}
.chip.ok{background:#dcfce7;border-color:#22c55e;color:#166534}
.chip.cur{border-color:#f59e0b;background:#fffbeb;color:#92400e;animation:cur 1.3s infinite}

.wsc{padding:12px 14px}
.wh{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.wt{font-weight:900;font-size:clamp(20px,2.1vw,32px)}
.wg{font-weight:800;color:#334155;font-size:clamp(16px,1.6vw,26px)}
.wh2{font-weight:900;color:#b45309;margin:6px 0 10px;font-size:clamp(15px,1.45vw,23px);min-height:1.4em}
.slots{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(clamp(150px,17vw,230px),1fr))}
.slots.n1{grid-template-columns:minmax(0,560px);justify-content:center}

.slot{border:4px dashed #94a3b8;border-radius:22px;background:#f8fafc;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s;min-width:0}
.slot.hot{border-color:#f59e0b;background:#fffbeb;transform:scale(1.03)}
.slot.done{border-style:solid;border-color:#22c55e;background:#f0fdf4}
.slot.merging{border-color:#a855f7;background:#faf5ff;animation:mrg .85s}
@keyframes mrg{30%{transform:scale(1.07)}60%{transform:scale(.94)}100%{transform:scale(1)}}
.slot.shake{animation:shk .45s;border-color:#ef4444;background:#fef2f2}

.sh{font-weight:900;font-size:clamp(15px,1.5vw,24px);text-align:center}
.sn{font-weight:800;color:#475569;text-align:center;line-height:1.3;font-size:clamp(13px,1.2vw,19px)}
.sbody{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:clamp(86px,10vw,130px)}

.slot.merging .pc.on{animation:squeeze .85s forwards}

.res{width:clamp(96px,11vw,150px)}
.pop1{animation:popr .6s}

.sv{display:block;width:100%;height:100%}
.sv.big{width:100%;height:auto}
.palc{padding:10px 12px}
.pt{font-weight:900;color:#475569;margin-bottom:8px;font-size:clamp(14px,1.35vw,21px)}
.pits{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px}

function tryPlace(m,k,sid){const M=MODES[m],S=ST[m];if(S.view!==S.cur)return false;const st=M.stages[S.cur],ss=S.stg[S.cur],sl=st.slots.find(x=>x.id===sid),sd=ss.slots[sid];

  if(!v){$('#cinfo').innerHTML=`<div class="ci1"><b>✅ 공통점</b> 하나의 개체를 구성할 때 <b style="color:#2563eb">세포</b> → <b style="color:#16a34a">조직</b> → <b style="color:#ea580c">기관</b> → <b style="color:#7c3aed">개체</b>의 단계를 거쳐 유기적으로 구성돼요.</div><div class="ci1"><b>🔍 차이점</b> 식물은 몇 개의 조직이 모여 <b style="color:#d97706">조직계</b>를 이루지만 동물은 조직계 단계가 없어요. 동물은 여러 기관이 모여 <b style="color:#d97706">기관계</b>를 이루지만 식물에는 기관계 단계가 없어요.</div><div class="ci1 sm">👆 그림 속 칸을 눌러 자세히 알아보세요.</div>`;return}
  const[p,l,k]=v.split('|');S2.add(v);if(S2.size>=4){CMPD=true;hud()}
  const sp=l==='조직계'||l==='기관계';
  $('#cinfo').innerHTML=`<div class="ci2"><div class="ci2i">${svg(k)}</div><div><div class="ci1"><b style="color:${LVC[l]}">${p} · ${l}</b> — ${IT[k].n}</div><div class="ci1">${IT[k].d}</div><div class="ci1 sm">📌 ${NOTE[l]}${sp?'':(l==='기관'?` (${p==='식물'?'식물은 조직계가 모여':'동물은 조직이 모여'} 기관이 돼요)`:'')}</div></div></div>`}
let S2=null,CMPD=false;
function drawLinks(){const g=$('#cgr'),sv=$('#cl');if(!g||!sv)return;const gr=g.getBoundingClientRect();if(!gr.width)return;sv.setAttribute('viewBox',`0 0 ${gr.width} ${gr.height}`);sv.setAttribute('width',gr.width);sv.setAttribute('height',gr.height);
  const ns=[...g.querySelectorAll('.cn')];const pos=n=>{const r=n.getBoundingClientRect();return{l:r.left-gr.left,r:r.right-gr.left,y:r.top-gr.top+r.height/2}};
  const f=(a,b,col)=>{const A=pos(a),B=pos(b);return `<path d="M${A.r} ${A.y} C${A.r+30} ${A.y} ${B.l-30} ${B.y} ${B.l} ${B.y}" stroke="${col}" stroke-width="6" fill="none" stroke-linecap="round" opacity=".75"/>`};
  const P=ns.filter((_,i)=>i%2===0),A=ns.filter((_,i)=>i%2===1);
  sv.innerHTML=f(P[0],A[0],LVC['세포'])+f(P[1],A[1],LVC['조직'])+f(P[3],A[2],LVC['기관'])+f(P[4],A[4],LVC['개체'])}
window.addEventListener('resize',()=>setTimeout(drawLinks,80));
// ---------- HUD / 퀴즈 ----------
function hud(){const el=$('#pbar');el.style.display='flex';el.style.gap='6px';const P=ST.plant,A=ST.animal;
  const ok=(m,n)=>ST[m].stg[n]&&Object.values(ST[m].stg[n].slots).every(x=>x.done);
  const it=[['🌿 조직',ok('plant',0)],['🌿 조직계',ok('plant',1)],['🌿 잎',ok('plant',2)],['🌿 식물 완성',P.fin],['🐱 조직',ok('animal',0)],['🐱 위',ok('animal',1)],['🐱 소화계',ok('animal',2)],['🐱 사람 완성',A.fin],['🔍 비교',CMPD]];
  el.innerHTML=it.map(x=>`<div class="pseg${x[1]?' ok':''}">${x[0]}${x[1]?' ✔':''}</div>`).join('')+`<div class="pseg${QSC>=QZ.length?' ok':''}">퀴즈 ${QSC<0?'–':QSC+'/'+QZ.length}</div>`}
let QSC=-1;
const QZ=[
 {q:'식물에는 있지만 동물에는 없는 구성 단계는?',o:['조직계','기관계','조직','기관'],a:0,e:'식물은 조직이 모여 조직계를 이루지만, 동물에는 조직계 단계가 없어요.'},
 {q:'동물에는 있지만 식물에는 없는 구성 단계는?',o:['기관계','조직계','기관','개체'],a:0,e:'동물은 여러 기관이 모여 기관계(예: 소화계)를 이루지만, 식물에는 기관계 단계가 없어요.'},
 {q:'식물의 구성 단계를 순서대로 나열한 것은?',o:['세포 → 조직 → 조직계 → 기관 → 개체','세포 → 조직 → 기관 → 기관계 → 개체','세포 → 기관 → 조직 → 개체','세포 → 조직계 → 조직 → 개체'],a:0,e:'식물: 세포 → 조직 → 조직계 → 기관 → 개체'},
 {q:'동물의 구성 단계를 순서대로 나열한 것은?',o:['세포 → 조직 → 기관 → 기관계 → 개체','세포 → 조직 → 조직계 → 기관 → 개체','세포 → 기관 → 조직 → 기관계 → 개체','조직 → 세포 → 기관 → 개체'],a:0,e:'동물: 세포 → 조직 → 기관 → 기관계 → 개체'},
 {q:'모양과 기능이 비슷한 세포들의 모임을 무엇이라 할까?',o:['조직','기관','기관계','개체'],a:0,e:'모양과 기능이 비슷한 세포가 모여 조직을 이뤄요.'},
 {q:'울타리조직과 해면조직이 모여 이루는 것은?',o:['기본조직계','표피조직계','관다발조직계','기관'],a:0,e:'울타리조직·해면조직 등은 기본조직계를 이뤄요.'},
 {q:'위(胃)는 구성 단계 중 어디에 속할까?',o:['기관','조직','기관계','개체'],a:0,e:'위는 상피조직·근육조직 등이 모여 이루어진 기관이에요.'},
 {q:'소화계에 속하지 않는 것은?',o:['허파','위','간','작은창자'],a:0,e:'허파는 호흡계에 속해요. 소화계는 식도·위·간·이자·작은창자·큰창자 등으로 이뤄져요.'},
 {q:'식물의 잎은 구성 단계에서 무엇일까?',o:['기관','조직','조직계','개체'],a:0,e:'잎은 여러 조직계가 모여 광합성 등을 하는 기관이에요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{QSC=Math.max(QSC,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};

$('#btnPh').onclick=()=>setPh(!document.body.classList.contains('ph'),true);
