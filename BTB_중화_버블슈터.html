<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BTB 중화 버블 슈터</title>
<style>
:root{--bg:#0a0e1a;--gold:#ffd54a;--ink:#f3f6fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#hud{flex:0 0 auto;height:max(38px,6vh);display:flex;align-items:center;justify-content:space-between;
  padding:0 max(10px,1.2vw);background:#05070f;border-bottom:1px solid #1b2440;font-size:clamp(15px,2.8vh,28px);font-weight:800}
#hud .grp{display:flex;align-items:center;gap:clamp(14px,2.4vw,40px)}
#hud .lbl{color:#8a97b5;font-weight:600;margin-right:.4em}
#hud .num{font-variant-numeric:tabular-nums;min-width:2ch;display:inline-block;text-align:right}
#hShots{color:#9fd0ff}#hWater{color:#5fe39a}
#hWater.pulse{animation:pu .5s}
@keyframes pu{0%{transform:scale(1)}40%{transform:scale(1.5);color:#fff}100%{transform:scale(1)}}
.ib{width:max(34px,4.8vh);height:max(34px,4.8vh);border-radius:9px;border:1px solid #2a3558;background:#101830;color:var(--ink);
  font-size:clamp(14px,2.5vh,24px);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;touch-action:manipulation}
.ib:active{background:#1d2850}.ib.warn{border-color:var(--gold);color:var(--gold)}
#stage{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;background:var(--bg);touch-action:none}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,5,12,.74);z-index:5}
#modal.on{display:flex}
.card{width:min(900px,93%);max-height:95%;overflow:auto;background:#0f1630;border:2px solid #2d3b70;border-radius:22px;word-break:keep-all;
  padding:clamp(16px,3vh,36px) clamp(18px,3.2vw,44px);box-shadow:0 20px 70px #000a}
.card h1{margin:0 0 .25em;font-size:clamp(24px,4.6vh,48px);line-height:1.15}
.card h2{margin:.2em 0 .4em;font-size:clamp(15px,2.4vh,24px);color:var(--gold)}
.card .sub{color:#aebbdd;font-size:clamp(15px,2.4vh,24px);margin:0 0 .7em}
.card ul{margin:0 0 .9em;padding:0;list-style:none;font-size:clamp(16px,2.8vh,29px);line-height:1.5}
.card li{margin:.4em 0;padding-left:1.7em;position:relative}
.card li b.n{position:absolute;left:0;top:0;color:var(--gold)}
.eq{display:flex;align-items:center;justify-content:center;gap:.5em;font-size:clamp(24px,5.4vh,56px);font-weight:900;margin:.2em 0 .5em;flex-wrap:wrap}
.ion{display:inline-block;padding:.05em .55em;border-radius:999px;border:4px solid;line-height:1.25}
.ion.h{background:#ffd23f;border-color:#b88400;color:#3a2800}
.ion.oh{background:#3b8cff;border-color:#123f9c;color:#fff}
.ion.w{background:#3ed17a;border-color:#0c7a3b;color:#06301a}
table.btb{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:clamp(15px,2.7vh,28px);font-weight:800}
table.btb td{padding:.35em .7em;text-align:center}
table.btb td:first-child{border-radius:12px 0 0 12px}table.btb td:last-child{border-radius:0 12px 12px 0}
.row-a td{background:#ffd23f;color:#3a2800}.row-n td{background:#3ed17a;color:#06301a}.row-b td{background:#3b8cff;color:#fff}
.row-i td{background:#ff6b4a;color:#2a0a00}.row-s td{background:#e9c46a;color:#2a2000}.row-m td{background:#a58bff;color:#1a0a40}
.btn{display:block;width:100%;min-height:max(60px,9vh);margin-top:.5em;border:0;border-radius:16px;font-size:clamp(19px,3.2vh,32px);font-weight:800;
  color:#08101f;background:linear-gradient(180deg,#ffe27a,#ffbf2e);cursor:pointer;touch-action:manipulation}
.btn.alt{background:linear-gradient(180deg,#8fe6c0,#3ed17a)}
.btn:active{filter:brightness(.9)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="grp">
      <span><span class="lbl">남은 발사</span><span class="num" id="hShots">0</span></span>
      <span><span class="lbl" id="hLbl2">💧 H₂O</span><span class="num" id="hWater">0</span></span>
      <span><span class="lbl">STAGE</span><span id="hStage">1/3</span></span>
    </div>
    <div class="grp" style="gap:8px">
      <button class="ib" id="bPause" title="일시정지 (P)">❚❚</button>
      <button class="ib" id="bRestart" title="다시 시작 (두 번 누르기)">↻</button>
      <button class="ib" id="bMute" title="소리">♪</button>
      <button class="ib" id="bFull" title="전체화면 (F)">⛶</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="modal"><div class="card" id="card"></div></div>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ===================== 상수 ===================== */
const W=1280,H=720,R=26,RH=45,COLS=18,FX0=(W-COLS*2*R)/2,FX1=FX0+COLS*2*R;
const CEIL=26,DEAD=585,MAXROW=12,GRID_ROWS=16,LX=W/2,LY=650,SPEED=16;
const SWAP={x:LX+190,y:LY,r:48};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stageEl=$('stage'),modal=$('modal'),card=$('card');

/* ===================== 버블 종류 ===================== */
const TYPES={
  H:{fill:'#ffd23f',hi:'#fff2a8',stroke:'#b88400',text:'#3a2800',kind:'chem'},
  OH:{fill:'#3b8cff',hi:'#9fcbff',stroke:'#123f9c',text:'#ffffff',kind:'chem'},
  W:{fill:'#3ed17a',hi:'#b8f5d2',stroke:'#0c7a3b',text:'#06301a',kind:'chem'},
  bas:{fill:'#ff6b4a',hi:'#ffb8a6',stroke:'#8a2410',text:'#ffffff',g:0,label:'현무'},
  gra:{fill:'#ff9a6a',hi:'#ffd2bd',stroke:'#8a3a10',text:'#2a0a00',g:0,label:'화강'},
  san:{fill:'#e9c46a',hi:'#fbe9b0',stroke:'#8a6a10',text:'#2a2000',g:1,label:'사암'},
  she:{fill:'#c9a24a',hi:'#eed9a0',stroke:'#6a4f10',text:'#201800',g:1,label:'셰일'},
  sch:{fill:'#a58bff',hi:'#d6c9ff',stroke:'#4a2ea0',text:'#ffffff',g:2,label:'편암'},
  gne:{fill:'#7f63e8',hi:'#c3b4ff',stroke:'#34208a',text:'#ffffff',g:2,label:'편마'}
};
const GROUPS=[{name:'화성암',color:'#ff6b4a',members:'현무암 · 화강암'},{name:'퇴적암',color:'#e9c46a',members:'사암 · 셰일'},{name:'변성암',color:'#a58bff',members:'편암 · 편마암'}];

const MODES={
  chem:{title:'BTB 중화 슈터',unit:'💧 H₂O',
    stages:[{rows:5,K:9,shots:30,mix:.5,types:['H','OH','H','OH','H','OH','W']},{rows:6,K:8,shots:28,mix:.45,types:['H','OH','H','OH','H','OH','W']},{rows:7,K:7,shots:26,mix:.4,types:['H','OH','H','OH','H','OH','H','OH','W','W']}]},
  rock:{title:'암석 패밀리 슈터',unit:'🪨 풍화',
    stages:[{rows:4,K:10,shots:40,mix:.55,types:['bas','san','sch']},{rows:4,K:10,shots:40,mix:.5,types:['bas','gra','san','sch']},{rows:5,K:9,shots:40,mix:.45,types:['bas','gra','san','she','sch','gne']}]}
};

/* ===================== 사운드 ===================== */
let AC=null,muted=false,noiseBuf=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',v=.14,to=null,delay=0){
  if(muted)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.15,hp=1500,delay=0){
  if(muted)return;const a=ac();if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const b=noiseBuf.getChannelData(0);for(let i=0;i<b.length;i++)b[i]=Math.random()*2-1;}
  const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.02);
}
const SFX={
  shoot(){tone(360,.14,'sine',.14,820);},
  wall(){tone(300,.06,'triangle',.1,240);},
  stick(){tone(200,.08,'sine',.12,150);},
  pop(n){const k=Math.min(n,8);tone(520+k*50,.1,'triangle',.14,900+k*60);tone(780+k*60,.12,'sine',.08,1300,.05);noise(.05,.08,3000);},
  neutral(){noise(.18,.1,4000);tone(480,.12,'sine',.16,1100);tone(1500,.1,'sine',.1,800,.12);tone(1100,.1,'sine',.08,600,.2);}, // 상쾌한 중화 팝 + 물방울
  rock(){noise(.22,.16,600);tone(150,.18,'triangle',.12,90);},
  fall(){tone(500,.3,'sine',.07,160);},
  drop(){tone(110,.28,'sine',.18,60);noise(.12,.1,300);},
  lose(){tone(400,.6,'sawtooth',.12,70);},
  clear(){[523,659,784,1046].forEach((f,i)=>tone(f,.28,'triangle',.13,null,i*.11));}
};

/* ===================== 상태 ===================== */
let mode='chem',stageIdx=0;
let grid=[],par=0;
let cur=null,nxt=null;
let shot=null;
let shotsLeft=0,sinceDrop=0,water=0;
let state='menu';
let aim=Math.PI/2,aiming=false,aimVisible=false;
let dropOff=0,shake=0,ceilN=0;
let parts=[],rings=[],merges=[],falls=[];
let beaker={r:62,g:209,b:122};
let tNow=0;

const odd=r=>((r+par)&1)===1;
const rowLen=r=>odd(r)?COLS-1:COLS;
const cellX=(r,c)=>FX0+R+c*2*R+(odd(r)?R:0);
const cy0=()=>CEIL+ceilN*RH;
const cellY=r=>cy0()+R+r*RH;
function cellFromPos(x,y){
  const r=Math.max(0,Math.min(GRID_ROWS-1,Math.round((y-cy0()-R)/RH)));
  const c=Math.max(0,Math.min(rowLen(r)-1,Math.round((x-FX0-R-(odd(r)?R:0))/(2*R))));
  return [r,c];
}
function neighbors(r,c){
  const out=[];
  const add=(rr,cc)=>{if(rr>=0&&rr<GRID_ROWS&&cc>=0&&cc<rowLen(rr))out.push([rr,cc]);};
  add(r,c-1);add(r,c+1);
  for(const dr of[-1,1]){
    if(odd(r)){add(r+dr,c);add(r+dr,c+1);}else{add(r+dr,c-1);add(r+dr,c);}
  }
  return out;
}
const keyOf=t=>mode==='rock'?TYPES[t].g:t;
const isOpp=(a,b)=>mode==='chem'&&((a==='H'&&b==='OH')||(a==='OH'&&b==='H'));
const cfg=()=>MODES[mode].stages[stageIdx];

function emptyGrid(){grid=[];for(let r=0;r<GRID_ROWS;r++)grid.push(new Array(COLS).fill(null));par=0;}
function genRow(len,types,mix,prev){
  const row=new Array(COLS).fill(null);let t=prev||types[Math.floor(Math.random()*types.length)];
  for(let c=0;c<len;c++){
    if(Math.random()>mix||c===0&&!prev){t=types[Math.floor(Math.random()*types.length)];}
    row[c]=t;
  }
  return row;
}
/* 화학 모드: H⁺ / OH⁻ 가 번갈아 뭉치도록(균형) 생성, 물방울(H₂O)은 가끔 섞임 */
function genRowChem(len,types){
  const pW=types.filter(t=>t==='W').length/types.length;
  const row=new Array(COLS).fill(null);let t=Math.random()<.5?'H':'OH',run=0;
  for(let c=0;c<len;c++){
    if(run<=0){t=t==='H'?'OH':'H';run=1+Math.floor(Math.random()*3);}
    run--;row[c]=Math.random()<pW?'W':t;
  }
  return row;
}
function buildStage(){
  emptyGrid();const S=cfg();
  for(let r=0;r<S.rows;r++){
    // 위 줄과 비슷한 성질이 이어지도록(군집) 생성
    let row;
    if(mode==='chem')row=genRowChem(rowLen(r),S.types);
    else{
      row=genRow(rowLen(r),S.types,S.mix);
      if(r>0)for(let c=0;c<rowLen(r);c++){if(Math.random()<.45&&grid[r-1][Math.min(c,rowLen(r-1)-1)])row[c]=grid[r-1][Math.min(c,rowLen(r-1)-1)];}
    }
    grid[r]=row;
  }
  shotsLeft=S.shots;sinceDrop=0;water=0;ceilN=0;shot=null;parts=[];rings=[];merges=[];falls=[];dropOff=0;
  cur=pickType();nxt=pickType();updateHUD();
}
function presentTypes(){
  const set=new Set();
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++)if(grid[r][c])set.add(grid[r][c]);
  return[...set];
}
function pickType(){
  if(mode==='chem'){            // 남아 있는 이온이 많은 쪽의 반대 이온이 더 자주 나옴(중화가 잘 일어나도록)
    let h=0,o=0;for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++){if(grid[r][c]==='H')h++;else if(grid[r][c]==='OH')o++;}
    const pOH=.5+.38*(h-o)/(h+o+2);return Math.random()<pOH?'OH':'H';
  }
  const cnt={};
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++){const t=grid[r][c];if(t){const k=keyOf(t);cnt[k]=(cnt[k]||0)+1;}}
  const p=presentTypes();const pool=p.length?p:cfg().types;
  const few=pool.filter(t=>cnt[keyOf(t)]<=2);              // 낱개로 남은 성인을 마무리할 수 있게 가끔 우선 제공
  const src=(few.length&&Math.random()<.75)?few:pool;
  return src[Math.floor(Math.random()*src.length)];
}
function countBubbles(){let n=0;for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++)if(grid[r][c])n++;return n;}
/* 클리어 조건: 이온(H⁺, OH⁻)이나 암석이 모두 사라지면 (남은 물방울은 증발) */
function countTargets(){let n=0;for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++)if(grid[r][c]&&grid[r][c]!=='W')n++;return n;}
function evaporateRest(){
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++)if(grid[r][c]==='W'){steam(cellX(r,c),cellY(r)+dropOff);grid[r][c]=null;}
}

/* ===================== 조준 궤적 / 충돌 ===================== */
function collide(x,y){
  const [rr]=cellFromPos(x,y);
  for(let r=Math.max(0,rr-2);r<=Math.min(GRID_ROWS-1,rr+2);r++){
    for(let c=0;c<rowLen(r);c++){
      if(!grid[r][c])continue;
      const dx=cellX(r,c)-x,dy=cellY(r)-y;
      if(dx*dx+dy*dy<(2*R-7)*(2*R-7))return[r,c];
    }
  }
  return null;
}
function trace(angle,wantPts){
  let x=LX,y=LY,dx=Math.cos(angle),dy=-Math.sin(angle);const pts=[];let hit=null,ceil=false;
  for(let i=0;i<1200;i++){
    x+=dx*4;y+=dy*4;
    if(x<FX0+R){x=FX0+R;dx=-dx;if(wantPts)pts.push({x,y,b:1});}
    else if(x>FX1-R){x=FX1-R;dx=-dx;if(wantPts)pts.push({x,y,b:1});}
    if(y<=cy0()+R){ceil=true;break;}
    hit=collide(x,y);if(hit)break;
    if(wantPts&&i%3===0)pts.push({x,y});
  }
  return{x,y,hit,ceil,pts};
}
/* 착지 셀 결정 */
function landCell(x,y,hit){
  let best=null,bd=1e9;
  const cand=[];
  if(hit){for(const[r,c]of neighbors(hit[0],hit[1]))if(!grid[r][c])cand.push([r,c]);}
  if(!cand.length||!hit){
    const[rr,cc]=cellFromPos(x,y);
    for(let r=Math.max(0,rr-1);r<=Math.min(GRID_ROWS-1,rr+1);r++)for(let c=0;c<rowLen(r);c++)if(!grid[r][c])cand.push([r,c]);
  }
  for(const[r,c]of cand){
    if(!hit&&r!==0)continue;
    const d=(cellX(r,c)-x)**2+(cellY(r)-y)**2;
    if(d<bd){bd=d;best=[r,c];}
  }
  if(!best){const[rr,cc]=cellFromPos(x,y);best=[rr,cc];}
  return best;
}

/* ===================== 이펙트 ===================== */
function burst(x,y,colors,n,sp=4,life=34,g=.12){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.4+Math.random())*sp;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g,life:life*(.6+Math.random()*.6),max:life,c:colors[i%colors.length],s:2.5+Math.random()*4});}
}
function steam(x,y){
  for(let i=0;i<14;i++)parts.push({x:x+(Math.random()-.5)*36,y:y+(Math.random()-.5)*20,vx:(Math.random()-.5)*.8,vy:-.8-Math.random()*1.4,g:-.01,life:44+Math.random()*20,max:60,c:'rgba(235,250,255,.9)',s:8+Math.random()*10,grow:.25});
  for(let i=0;i<12;i++){const a=Math.random()*6.283,v=1.5+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.18,life:36,max:36,c:['#6fe8ff','#3ed17a','#b8f5d2'][i%3],s:3+Math.random()*3});}
}
function ring(x,y,color,max=70,life=22){rings.push({x,y,r:6,max,life,t:life,c:color});}

/* ===================== 규칙: 발사 · 착지 · 제거 ===================== */
function fire(){
  if(state!=='play'||shot||shotsLeft<=0||!cur)return;
  shotsLeft--;updateHUD();
  shot={x:LX,y:LY,dx:Math.cos(aim),dy:-Math.sin(aim),type:cur};
  cur=nxt;nxt=pickType();SFX.shoot();
}
function swapBubbles(){
  if(state!=='play'||shot)return;
  const t=cur;cur=nxt;nxt=t;tone(640,.08,'square',.06,880);ring(LX,LY,'#ffffff',50,14);
}
function updateShot(){
  if(!shot)return;
  for(let k=0;k<4&&shot;k++){
    shot.x+=shot.dx*SPEED/4;shot.y+=shot.dy*SPEED/4;
    if(shot.x<FX0+R){shot.x=FX0+R;shot.dx=-shot.dx;SFX.wall();}
    else if(shot.x>FX1-R){shot.x=FX1-R;shot.dx=-shot.dx;SFX.wall();}
    let hit=null;
    if(shot.y<=cy0()+R)hit=false;else hit=collide(shot.x,shot.y);
    if(hit!==null&&hit!==undefined&&(hit===false||hit)){
      const s=shot;shot=null;settle(s,hit||null);
    }
  }
}
function settle(s,hit){
  // 1) 중화: 반대 이온과 정면 충돌 → 1:1 결합, 물(H₂O) 생성
  if(hit&&isOpp(s.type,grid[hit[0]][hit[1]])){
    const[r,c]=hit,bx=cellX(r,c),by=cellY(r)+dropOff,t0=grid[r][c];
    grid[r][c]=null;water++;pulse();evaporateAround([[r,c]]);
    merges.push({ax:s.x,ay:s.y,bx,by,ta:s.type,tb:t0,t:0});
    SFX.neutral();G_after(removeFloating());
    return;
  }
  // 2) 착지 (동종/다른 종류는 그대로 붙음)
  const[r,c]=landCell(s.x,s.y,hit);
  grid[r][c]=s.type;SFX.stick();
  const cl=cluster(r,c);
  if(cl.length>=3){
    popCells(cl);
  }
  G_after(removeFloating());
}
function G_after(fl){
  // 승리/패배/천장 하강 판정
  sinceDrop++;
  if(countTargets()===0){evaporateRest();setTimeout(stageClear,750);state='modal';return;}
  if(sinceDrop>=cfg().K){sinceDrop=0;ceilingDrop();}
  if(deadlineReached()){state='modal';setTimeout(gameOver,500);return;}
  if(shotsLeft<=0&&!shot){state='modal';setTimeout(()=>{if(countTargets()>0)gameOver();},900);}
  updateHUD();
}
function cluster(r0,c0){
  const k=keyOf(grid[r0][c0]),seen=new Set([r0*100+c0]),q=[[r0,c0]],out=[];
  while(q.length){
    const[r,c]=q.pop();out.push([r,c]);
    for(const[rr,cc]of neighbors(r,c)){
      const id=rr*100+cc;if(seen.has(id))continue;
      if(grid[rr][cc]&&keyOf(grid[rr][cc])===k){seen.add(id);q.push([rr,cc]);}
    }
  }
  return out;
}
function popCells(list){
  for(const[r,c]of list){
    const t=grid[r][c],x=cellX(r,c),y=cellY(r)+dropOff;grid[r][c]=null;
    if(mode==='rock'){
      burst(x,y,['#c8a878','#8a6a4a','#e8d8b8',TYPES[t].fill],9,3.5,40,.2);ring(x,y,'#e8d8b8',44,16);water++;
    }else{
      burst(x,y,[TYPES[t].fill,TYPES[t].hi,'#fff'],10,4.5,30);ring(x,y,TYPES[t].fill,50,16);
    }
  }
  if(mode==='chem')evaporateAround(list);
  mode==='rock'?SFX.rock():SFX.pop(list.length);
  if(mode==='rock')pulse();
}
function removeFloating(){
  const seen=new Set(),q=[];
  for(let c=0;c<rowLen(0);c++)if(grid[0][c]){seen.add(c);q.push([0,c]);}
  while(q.length){
    const[r,c]=q.pop();
    for(const[rr,cc]of neighbors(r,c)){const id=rr*100+cc;if(!seen.has(id)&&grid[rr][cc]){seen.add(id);q.push([rr,cc]);}}
  }
  let n=0;
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++){
    if(grid[r][c]&&!seen.has(r*100+c)){
      falls.push({x:cellX(r,c),y:cellY(r)+dropOff,vx:(Math.random()-.5)*2.5,vy:-2-Math.random()*2,type:grid[r][c],rot:0});
      grid[r][c]=null;n++;
    }
  }
  if(n)SFX.fall();
  return n;
}
function ceilingDrop(){
  // 천장이 한 줄 내려옴(새 버블은 추가되지 않고 놀이 공간이 줄어듦)
  ceilN++;dropOff=-RH;shake=10;SFX.drop();
}
function deadlineReached(){
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++)if(grid[r][c]&&cellY(r)+R>=DEAD)return true;
  return false;
}
/* 제거된 자리 주변의 물방울(H₂O)은 함께 증발 */
function evaporateAround(cells){
  for(const[r,c]of cells)for(const[rr,cc]of neighbors(r,c)){
    if(grid[rr][cc]==='W'){steam(cellX(rr,cc),cellY(rr)+dropOff);grid[rr][cc]=null;}
  }
}
function pulse(){const e=$('hWater');e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse');updateHUD();}

/* ===================== 갱신 ===================== */
function step(){
  tNow++;
  if(dropOff<0)dropOff=Math.min(0,dropOff+4);
  if(shake>0)shake--;
  updateShot();
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;if(p.grow)p.s+=p.grow;}
  parts=parts.filter(p=>p.life>0);
  for(const o of rings){o.t--;o.r=o.max*(1-o.t/o.life);}
  rings=rings.filter(o=>o.t>0);
  for(const m of merges){
    m.t++;
    if(m.t===18){steam((m.ax+m.bx)/2,(m.ay+m.by)/2);}
  }
  merges=merges.filter(m=>m.t<46);
  for(const f of falls){f.x+=f.vx;f.y+=f.vy;f.vy+=.5;f.rot+=.1;}
  falls=falls.filter(f=>f.y<H+60);
  // BTB 용액 색 (H⁺가 많으면 노랑, 균형이면 초록, OH⁻가 많으면 파랑)
  let h=0,o=0;
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++){if(grid[r][c]==='H')h++;else if(grid[r][c]==='OH')o++;}
  const tt=(h+o)?(o-h)/(h+o):0;
  const tg=tt<0?lerpC([62,209,122],[255,210,63],-tt):lerpC([62,209,122],[59,140,255],tt);
  beaker.r+=(tg[0]-beaker.r)*.08;beaker.g+=(tg[1]-beaker.g)*.08;beaker.b+=(tg[2]-beaker.b)*.08;beaker.t=tt;
}
const lerpC=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

/* ===================== 그리기 ===================== */
let scale=1;
function resize(){
  const bw=stageEl.clientWidth,bh=stageEl.clientHeight;
  const s=Math.min(bw/W,bh/H),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);scale=cv.width/W;
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function label(ctxx,t,x,y,fill,stroke){
  ctxx.save();ctxx.textAlign='center';ctxx.textBaseline='middle';ctxx.lineJoin='round';
  const seg=(s,dx,dy,size)=>{ctxx.font='900 '+size+'px "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
    ctxx.lineWidth=size>16?4:3;ctxx.strokeStyle=stroke;ctxx.strokeText(s,x+dx,y+dy);ctxx.fillStyle=fill;ctxx.fillText(s,x+dx,y+dy);};
  if(t==='H'){seg('H',-6,1,25);seg('+',11,-9,17);}
  else if(t==='OH'){seg('OH',-5,1,21);seg('−',15,-9,17);}
  else if(t==='W'){seg('H',-13,0,20);seg('2',-2,7,13);seg('O',10,0,20);}
  else seg(TYPES[t].label,0,1,19);
  ctxx.restore();
}
function drawBubble(x,y,type,sc=1,alpha=1,col){
  const T=TYPES[type],fill=col||T.fill;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(sc,sc);
  const g=ctx.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R);g.addColorStop(0,col?'#ffffff':T.hi);g.addColorStop(1,fill);
  ctx.fillStyle=g;ctx.strokeStyle=col?'#0c7a3b':T.stroke;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,R-2,0,6.283);ctx.fill();ctx.stroke();
  ctx.restore();
  ctx.save();ctx.globalAlpha=alpha;label(ctx,type,x,y,T.text,col?'#ffffff':(T.text==='#ffffff'?T.stroke:'#ffffff'));ctx.restore();
}
function drawField(){
  // 벽, 천장 바
  ctx.fillStyle='rgba(20,30,60,.55)';ctx.fillRect(FX0,0,FX1-FX0,H);
  ctx.strokeStyle='#3a4c8a';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(FX0,0);ctx.lineTo(FX0,H);ctx.moveTo(FX1,0);ctx.lineTo(FX1,H);ctx.stroke();
  // 천장 하강 게이지(남은 칸이 줄어듦)
  const K=cfg().K,pw=(FX1-FX0-40)/K;
  const cb=cy0()+dropOff-4;
  const cg=ctx.createLinearGradient(0,0,0,cb);cg.addColorStop(0,'#1a2550');cg.addColorStop(1,'#26356e');
  ctx.fillStyle=cg;ctx.fillRect(FX0,0,FX1-FX0,cb);
  ctx.fillStyle='#5a6fc0';ctx.fillRect(FX0,cb-4,FX1-FX0,4);
  for(let i=0;i<K;i++){
    const lit=i<sinceDrop,danger=sinceDrop>=K-1;
    ctx.fillStyle=lit?(danger?'#ff5d6c':'#ffb84a'):'#26305a';
    rr(FX0+20+i*pw+3,6,pw-6,12,6);ctx.fill();
  }
  // 데드라인
  ctx.save();ctx.strokeStyle='rgba(255,93,108,.7)';ctx.lineWidth=3;ctx.setLineDash([14,10]);
  ctx.beginPath();ctx.moveTo(FX0,DEAD);ctx.lineTo(FX1,DEAD);ctx.stroke();ctx.restore();
}
function drawSidePanels(){
  if(mode==='chem'){
    // BTB 용액 비커: 남은 이온 비율에 따라 노랑↔초록↔파랑
    const bx=86,top=190,bot=520,wTop=104,wBot=78;
    ctx.save();
    ctx.fillStyle=`rgb(${beaker.r|0},${beaker.g|0},${beaker.b|0})`;
    const lv=.78;const ly=bot-(bot-top)*lv;
    ctx.beginPath();ctx.moveTo(bx-wTop/2+((bot-ly)/(bot-top))*0,ly);ctx.lineTo(bx+wTop/2,ly);ctx.lineTo(bx+wBot/2,bot);ctx.lineTo(bx-wBot/2,bot);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#cfe0ff';ctx.lineWidth=6;ctx.lineJoin='round';ctx.beginPath();
    ctx.moveTo(bx-wTop/2-8,top);ctx.lineTo(bx-wBot/2,bot);ctx.lineTo(bx+wBot/2,bot);ctx.lineTo(bx+wTop/2+8,top);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(bx-wTop/2+4,ly+8,10,(bot-ly)-24);
    ctx.fillStyle='#e6efff';ctx.font='800 22px "Apple SD Gothic Neo","Noto Sans KR",system-ui';ctx.textAlign='center';
    ctx.fillText('BTB 용액',bx,bot+34);
    // 지시약 색 눈금
    ctx.font='800 18px "Apple SD Gothic Neo","Noto Sans KR",system-ui';
    const sc=[['#ffd23f','산성'],['#3ed17a','중성'],['#3b8cff','염기성']];
    sc.forEach((s,i)=>{const y=bot+72+i*30;ctx.fillStyle=s[0];ctx.beginPath();ctx.arc(bx-40,y,9,0,6.283);ctx.fill();ctx.fillStyle='#e6efff';ctx.textAlign='left';ctx.fillText(s[1],bx-22,y+1);});
    ctx.restore();
  }else{
    ctx.save();ctx.textAlign='center';
    GROUPS.forEach((g,i)=>{
      const y=210+i*130,x=86;
      ctx.fillStyle=g.color;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;rr(x-70,y-42,140,100,16);ctx.fill();ctx.stroke();
      ctx.fillStyle='#1a1008';ctx.font='900 28px "Apple SD Gothic Neo","Noto Sans KR",system-ui';ctx.fillText(g.name,x,y-8);
      ctx.font='700 15px "Apple SD Gothic Neo","Noto Sans KR",system-ui';ctx.fillText(g.members,x,y+24);
    });
    ctx.restore();
  }
  // 우측: 반응식 힌트 (정적 · 작게)
  ctx.save();ctx.textAlign='center';
  if(mode==='chem'){
    const x=1194,y=260;
    ctx.globalAlpha=.9;
    drawMini(x,y,'H');ctx.fillStyle='#e6efff';ctx.font='900 30px system-ui';ctx.fillText('+',x,y+52);
    drawMini(x,y+104,'OH');ctx.fillText('↓',x,y+156);
    drawMini(x,y+208,'W');
  }
  ctx.restore();
}
function drawMini(x,y,t){drawBubble(x,y,t,1.05);}
function drawLauncher(){
  // 발사대
  ctx.save();ctx.translate(LX,LY);ctx.rotate(Math.PI/2-aim);
  const g=ctx.createLinearGradient(-16,0,16,0);g.addColorStop(0,'#5a6aa8');g.addColorStop(.5,'#dfe8ff');g.addColorStop(1,'#5a6aa8');
  ctx.fillStyle=g;rr(-15,-72,30,72,10);ctx.fill();ctx.restore();
  ctx.fillStyle='#2a3566';ctx.strokeStyle='#8fa4ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(LX,LY+4,40,0,6.283);ctx.fill();ctx.stroke();
  if(cur&&!shot)drawBubble(LX,LY,cur);
  // 교체 버튼: 다음 버블 미리보기 + 화살표
  ctx.save();ctx.fillStyle='#16204a';ctx.strokeStyle=state==='play'&&!shot?'#9fb4ff':'#4a5a90';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(SWAP.x,SWAP.y,SWAP.r,0,6.283);ctx.fill();ctx.stroke();ctx.restore();
  if(nxt)drawBubble(SWAP.x,SWAP.y,nxt,.86);
  ctx.save();ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.lineCap='round';
  const ax=SWAP.x,ay=SWAP.y-SWAP.r-4;
  ctx.beginPath();ctx.arc(ax,ay+34,24,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ax+20,ay+4);ctx.lineTo(ax+22,ay+16);ctx.lineTo(ax+9,ay+14);ctx.stroke();ctx.restore();
}
function drawAim(){
  if(!(aiming||aimVisible)||state!=='play'||shot)return;
  const tr=trace(aim,true);
  ctx.save();
  for(let i=0;i<tr.pts.length;i+=2){
    const p=tr.pts[i];ctx.globalAlpha=Math.max(.25,1-i/tr.pts.length*.6);
    ctx.fillStyle=p.b?'#ffffff':(cur?TYPES[cur].fill:'#fff');
    ctx.beginPath();ctx.arc(p.x,p.y,p.b?6:4,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=.45;ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.setLineDash([5,5]);
  let ex=tr.x,ey=tr.y;
  if(tr.hit||tr.ceil){const[r,c]=landCell(tr.x,tr.y,tr.hit);ex=cellX(r,c);ey=cellY(r);
    if(tr.hit&&cur&&isOpp(cur,grid[tr.hit[0]][tr.hit[1]])){ex=cellX(tr.hit[0],tr.hit[1]);ey=cellY(tr.hit[0]);}}
  ctx.beginPath();ctx.arc(ex,ey,R-3,0,6.283);ctx.stroke();ctx.restore();
}
function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle='#0a0e1a';ctx.fillRect(0,0,W,H);
  if(state==='menu')return;
  ctx.save();
  if(shake>0)ctx.translate(0,Math.sin(shake*1.8)*3);
  drawField();
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<rowLen(r);c++){const t=grid[r][c];if(t)drawBubble(cellX(r,c),cellY(r)+dropOff,t);}
  ctx.restore();
  drawSidePanels();
  // 중화 결합 연출: 두 이온이 다가와 → 초록(물)으로 색이 변하고 → 증기와 함께 팝
  for(const m of merges){
    const k=Math.min(1,m.t/18),mx=(m.ax+m.bx)/2,my=(m.ay+m.by)/2;
    if(m.t<18){
      const e=k*k;drawBubble(m.ax+(mx-m.ax)*e,m.ay+(my-m.ay)*e,m.ta,1);drawBubble(m.bx+(mx-m.bx)*e,m.by+(my-m.by)*e,m.tb,1);
    }else{
      const q=(m.t-18)/28,sc=q<.35?1+q*1.2:Math.max(0,1.42-(q-.35)*2.3);
      drawBubble(mx,my,'W',sc,Math.max(0,1-Math.max(0,q-.6)*2.5));
    }
  }
  for(const f of falls){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);drawBubble(0,0,f.type,.9,.85);ctx.restore();}
  for(const o of rings){ctx.save();ctx.globalAlpha=o.t/o.life;ctx.strokeStyle=o.c;ctx.lineWidth=5;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.283);ctx.stroke();ctx.restore();}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  drawAim();
  if(shot)drawBubble(shot.x,shot.y,shot.type);
  drawLauncher();
  if(state==='paused'){
    ctx.fillStyle='rgba(3,5,12,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 72px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('❚❚ 일시정지',W/2,H/2-10);ctx.font='600 28px system-ui';ctx.fillStyle='#aebbdd';ctx.fillText('화면을 탭하면 계속',W/2,H/2+50);
  }
}

  showModal(`<h1>아쉬워요!</h1><p class="sub">${shotsLeft<=0?'발사 횟수를 모두 사용했어요.':'버블이 아래 선에 닿았어요.'} 이온을 짝지어 중화하거나 같은 종류 3개를 모아 보세요.</p>
    <button class="btn" id="mRetry">이 스테이지 다시 도전 ▶</button>`);
  if(mode==='rock')$('card').querySelector('.sub').textContent=(shotsLeft<=0?'발사 횟수를 모두 사용했어요.':'버블이 아래 선에 닿았어요.')+' 같은 종류(성인)의 암석 3개를 모아 보세요.';
  $('mRetry').onclick=()=>{ac();beginStage();};
}

/* ===================== 입력 ===================== */
const toX=cx=>{const r=cv.getBoundingClientRect();return(cx-r.left)/r.width*W;};
const toY=cy=>{const r=cv.getBoundingClientRect();return(cy-r.top)/r.height*H;};
function setAim(x,y){
  const dx=x-LX,dy=LY-y;let a=Math.atan2(dy,dx);
  if(dy<=0)a=dx>=0?.21:Math.PI-.21;
  aim=Math.max(.21,Math.min(Math.PI-.21,a));
}
let ptr=null;
cv.addEventListener('pointerdown',e=>{
  ac();const x=toX(e.clientX),y=toY(e.clientY);
  if(state==='paused'){togglePause();return;}
  if(state!=='play')return;
  cv.setPointerCapture(e.pointerId);
  if(Math.hypot(x-SWAP.x,y-SWAP.y)<=SWAP.r+10){swapBubbles();ptr={id:e.pointerId,swap:true};return;}
  ptr={id:e.pointerId,type:e.pointerType};aiming=true;setAim(x,y);
});
cv.addEventListener('pointermove',e=>{
  const x=toX(e.clientX),y=toY(e.clientY);
  if(ptr&&ptr.id===e.pointerId&&!ptr.swap)setAim(x,y);
  else if(e.pointerType==='mouse'&&state==='play'){aimVisible=true;setAim(x,y);}
});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')aimVisible=false;});
function endPtr(e,cancel){
  if(!ptr||ptr.id!==e.pointerId)return;
  const y=toY(e.clientY);
  if(!ptr.swap&&aiming&&!cancel&&y<LY-45)fire();
  aiming=false;ptr=null;
}
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
['touchmove','touchstart'].forEach(n=>document.addEventListener(n,e=>{if(e.target.closest('.card')===null)e.preventDefault();},{passive:false}));
['gesturestart','gesturechange','contextmenu','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
const keys={};
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();ac();if(!e.repeat)fire();}
  else if(e.code==='KeyS'||e.code==='KeyX')swapBubbles();
  else if(e.code==='KeyP'||e.code==='Escape')togglePause();
  else if(e.code==='KeyF')toggleFull();
  else keys[e.code]=true;
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
setInterval(()=>{
  if(state==='play'){const d=(keys.ArrowLeft||keys.KeyA?1:0)-(keys.ArrowRight||keys.KeyD?1:0);
    if(d){aim=Math.max(.21,Math.min(Math.PI-.21,aim+d*.03));aimVisible=true;}}
},16);
function togglePause(){
  if(state==='play'){state='paused';$('bPause').textContent='▶';}
  else if(state==='paused'){state='play';$('bPause').textContent='❚❚';}
}
$('bPause').onclick=togglePause;
let rsT=0;
$('bRestart').onclick=()=>{
  const b=$('bRestart');
  if(b.classList.contains('warn')){clearTimeout(rsT);b.classList.remove('warn');ac();showStart();$('bPause').textContent='❚❚';}
  else{b.classList.add('warn');rsT=setTimeout(()=>b.classList.remove('warn'),2200);}
};
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'✕':'♪';$('bMute').style.opacity=muted?.5:1;};
function toggleFull(){
  const d=document,el=d.documentElement;
  try{if(!(d.fullscreenElement||d.webkitFullscreenElement)){(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);}
      else{(d.exitFullscreen||d.webkitExitFullscreen||(()=>{})).call(d);}}catch(err){}
}
$('bFull').onclick=toggleFull;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
window.addEventListener('resize',resize);
document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(resize,60));

/* ===================== 루프 ===================== */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(100,now-last);last=now;
  if(state!=='paused'&&state!=='menu'){acc+=dt;let n=0;while(acc>=16.667&&n<5){step();acc-=16.667;n++;}if(n>=5)acc=0;}else acc=0;
  draw();requestAnimationFrame(frame);
}
window.__bs={get state(){return state},get mode(){return mode},get stage(){return stageIdx},get shotsLeft(){return shotsLeft},get water(){return water},
  step,startMode,beginStage,trace,fire,swap:swapBubbles,countBubbles,countTargets,
  setAimAngle:a=>{aim=a},get cur(){return cur},get nxt(){return nxt},grid:()=>grid,isOpp,landCell,cluster,keyOf,
  nextStage:()=>{stageIdx++;beginStage();},get par(){return par},cellX,cellY,rowLen,neighbors,deadline:deadlineReached};
resize();updateHUD();showStart();requestAnimationFrame(frame);
})();
</script>
