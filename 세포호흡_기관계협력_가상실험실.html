<html lang="ko">
<head>

<style>

.mode.on{display:grid;gap:10px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

.hudc .i{border-color:#3b82f6;background:#eff6ff}.hudc .i b{color:#1d4ed8}.hudc .r{border-color:#f97316;background:#fff7ed}.hudc .r b{color:#c2410c}.hudc .m{border-color:#94a3b8}.hudc .m b{color:#475569}

.stg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stg3 .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.stg3 .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.stg3 .btn.ok{background:#dcfce7;border-color:#22c55e}

.cv{width:100%;border:2px solid #cbd5e1;border-radius:12px;background:#f8fafc;display:block}

.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd div{border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;font-size:clamp(12px,1.02vw,15px);background:#f8fafc}.spd i{display:block;height:9px;border-radius:5px;background:#38bdf8;margin-top:3px}

.med{display:grid;grid-template-columns:1fr 1fr;gap:6px}.med .btn{min-height:58px;line-height:1.2;padding:3px 8px;text-align:left;font-size:clamp(12px,1.05vw,16px)}.med .btn.on{background:#fffbeb;border-color:#f59e0b}

.b-d{background:#fef9c3;border-color:#eab308;color:#713f12}.b-r{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}.b-f{background:#dcfce7;border-color:#22c55e;color:#14532d}.b-n{background:#e5e7eb;border-color:#9ca3af;color:#374151}

.zone.src{border-color:#f59e0b}.zone.non{border-color:#64748b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#dcfce7;border:2px solid #22c55e;border-radius:10px;padding:3px 8px;font-size:clamp(12px,1.05vw,16px)}

 {q:'영양소를 조직세포까지 운반하는 기관계는?',o:['순환계','소화계','호흡계','배설계'],a:0,e:'소화계에서 흡수한 영양소는 순환계(혈액)를 따라 온몸의 조직세포로 운반돼요.'},
 {q:'산소를 몸 안으로 받아들이는 기관계는?',o:['호흡계','소화계','배설계','순환계'],a:0,e:'호흡계(허파)에서 산소를 받아들이고 이산화 탄소를 내보내요.'},
 {q:'세포호흡이 일어나는 장소는?',o:['조직세포(마이토콘드리아)','허파','콩팥','작은창자'],a:0,e:'세포호흡은 조직세포 속 마이토콘드리아에서 주로 일어나요.'},
 {q:'세포호흡에 필요한 물질로 알맞게 짝지은 것은?',o:['영양소(포도당)와 산소','물과 이산화 탄소','요소와 산소','포도당과 이산화 탄소'],a:0,e:'영양소를 산소로 분해해 에너지를 얻는 과정이 세포호흡이에요.'},
 {q:'세포호흡의 결과로 생기는 것이 아닌 것은?',o:['산소','에너지','물','이산화 탄소'],a:0,e:'산소는 세포호흡에 쓰이는 재료예요. 결과로는 물, 이산화 탄소, 에너지가 생겨요.'},
 {q:'세포호흡으로 얻은 에너지의 쓰임이 아닌 것은?',o:['이산화 탄소를 만드는 재료로 쓰임','체온 유지','근육 운동','정신 활동'],a:0,e:'에너지는 체온 유지, 성장, 근육 운동, 정신 활동, 소리 내기 등에 쓰여요.'},
 {q:'세포호흡으로 생긴 이산화 탄소가 몸 밖으로 나가는 길은?',o:['순환계 → 호흡계 → 날숨','순환계 → 배설계 → 오줌','소화계 → 대변','호흡계 → 소화계'],a:0,e:'이산화 탄소는 혈액을 타고 허파로 이동해 날숨으로 나가요.'},
 {q:'물과 요소가 몸 밖으로 나가는 길은?',o:['순환계 → 배설계(콩팥) → 오줌','순환계 → 호흡계 → 날숨','소화계 → 대변','순환계 → 소화계 → 대변'],a:0,e:'물과 요소는 혈액을 따라 콩팥으로 가서 오줌으로 나가요.'},
 {q:'요소는 어떻게 만들어질까?',o:['단백질이 분해될 때 생긴 암모니아가 간에서 요소로 바뀐다','탄수화물이 분해될 때 바로 만들어진다','허파에서 만들어진다','마이토콘드리아에서 산소로 만들어진다'],a:0,e:'단백질 분해 → 암모니아(독성 큼) → 간에서 요소(독성 작음) → 콩팥 → 오줌이에요.'},
 {q:'소화계·순환계·호흡계·배설계의 관계로 옳은 것은?',o:['서로 협력해 조직세포에 필요한 물질을 공급하고 노폐물을 내보낸다','각각 독립적으로 일한다','순환계만 필요하다','조직세포는 기관계와 관계없다'],a:0,e:'여러 기관계가 연결되어 작용해야 세포호흡이 일어나고 노폐물이 배출돼요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{S.quiz=Math.max(S.quiz,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};
document.addEventListener('click',e=>{let b;
  if(b=e.target.closest('[data-o1]')){C1.sel=b.dataset.o1;sTick();ctl1();return}
  if(b=e.target.closest('[data-sp]')){sp1(b.dataset.sp);return}
  if(e.target.closest('#rs1')){C1.P=[];C1.nA=0;C1.oA=0;C1.ready=false;S.a=new Set();hud();sTap();ctl1();return}
  if(e.target.closest('#go2')){setMode(2);sTap();return}
  if(e.target.closest('#pl2')){C2.run=!C2.run;C2.ever=true;sTap();ui2();return}
  if(b=e.target.closest('[data-s2]')){C2.sp=+b.dataset.s2;sTap();ui2();return}
  if(e.target.closest('#rs2')){reset2();S.b=new Set();$('#cc2').style.display='none';hud();sTap();info2();return}
  if(b=e.target.closest('[data-w3]')){sp3(b.dataset.w3);return}
  if(e.target.closest('#ur3')){C3.ure=!C3.ure;sTap();ctl3();return}
  if(e.target.closest('#rs3')){C3.P=[];C3.n={co2:0,wat:0,ure:0};S.c=new Set();$('#cc3').style.display='none';hud();sTap();ctl3();return}});
function resetAll(){S.a=new Set();S.b=new Set();S.c=new Set();S.quiz=-1;C1.sel=null;C1.P=[];C1.nA=0;C1.oA=0;C1.ready=false;reset2();C2.run=false;C2.sel=null;C2.sp=1;C2.ever=false;C3.P=[];C3.n={co2:0,wat:0,ure:0};C3.ure=false;
  for(const k of [1,2,3]){const c=$('#cc'+k);c.style.display='none';c.innerHTML=''}
  ctl1();ctl2();ctl3();fbx('#fb1','🍔 물질을 혈관으로 보내고 기관계의 협력을 관찰해 보세요.');fbx('#fb2','🔥 영양소와 산소가 반응해 에너지가 만들어져요.');fbx('#fb3','🚮 노폐물이 어떤 길로 나가는지 확인해 보세요.');hud();setMode(1)}
$('#btnReset').onclick=resetAll;
let lastT=0,lastMode=1;function loop(){try{const now=performance.now()/1000,dt=Math.min(.05,now-(lastT||now));lastT=now;
  if(mode!==lastMode){lastMode=mode;if(mode===2&&C1.ready&&!C2.ever){C2.run=true;C2.ever=true;ui2()}}
  if(mode===1)draw1($('#a1'),now,dt);else if(mode===2)draw2($('#a2'),now,dt);else draw3($('#a3'),now,dt)}catch(e){console.error(e)}requestAnimationFrame(loop)}
resetAll();requestAnimationFrame(loop);
</script>
