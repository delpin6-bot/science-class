<script id="qr-focus-js">
(function(){try{
  var p=new URLSearchParams(location.search), on=p.get("qr")==="1"||p.get("mode")==="focus"||p.has("q"), lock=p.has("q");
  if(!on) return;
  var add=function(el){ if(!el) return; el.classList.add("qr-focus-mode"); if(lock) el.classList.add("qr-lesson-lock"); };
  add(document.documentElement);
  function ui(){
    add(document.body);
    var nav=document.querySelector(".unified-nav-actions")||document.querySelector(".m-right");
    var b=document.createElement("span"); b.className="qr-focus-badge"; b.textContent="📱 학생 집중 모드";
    if(nav) nav.insertBefore(b, nav.firstChild); else { b.className+=" float"; document.body.appendChild(b); }
    var home=document.getElementById("kjsHome");
    if(home) home.textContent="↺ 다시하기";
    else if(nav){ var r=document.createElement("button"); r.type="button"; r.className="qr-reset"; r.textContent="↺ 다시하기";
      r.onclick=function(){ if(confirm("처음부터 다시 할까요?")) location.reload(); }; nav.appendChild(r); }
    var tries=0, t=setInterval(function(){                      /* 단원·차시명 표시 */
      var c=(window.KJSMenu&&window.KJSMenu._current)||window.__kjsCurrent;
      if(c&&c.title){ b.textContent="📱 "+[c.unit,c.title].filter(Boolean).join(" · "); b.title="학생 집중 모드"; clearInterval(t); }
      else if(++tries>20) clearInterval(t);
    },300);
  }
  if(document.body) ui(); else document.addEventListener("DOMContentLoaded",ui);
  document.addEventListener("click",function(e){                /* 집중 모드 유지 */
    var a=e.target.closest&&e.target.closest("a[href]"); if(!a) return;
    var u; try{ u=new URL(a.getAttribute("href"),location.href); }catch(_){ return; }
    if(u.origin!==location.origin||!/\.html$/.test(u.pathname)) return;
    if(u.searchParams.get("qr")!=="1"){ u.searchParams.set("qr","1"); a.setAttribute("href",u.pathname.split("/").pop()+u.search+u.hash); }
  },true);
}catch(e){}})();
</script>

<title>스타 골든벨</title>
<style>
  :root{
    --bg:#16242a;
    --surface:#1e3138;
    --surface-2:#24414b;
    --surface-3:#2c4e59;
    --ink:#f2ebda;
    --ink-dim:#9fb3b9;
    --ink-faint:#6e8288;
    --accent:#e3a857;
    --accent-strong:#f0be73;
    --accent-ink:#1b1206;
    --line:rgba(242,235,218,.14);
    --line-strong:rgba(242,235,218,.26);
    --danger:#c1493f;
    --success:#7c9a5b;
    --sys-digest:#d08b3f;
    --sys-circu:#c1493f;
    --sys-respir:#4c8fa3;
    --sys-excrete:#7c9a5b;
    --sys-plum:#8a5a7c;
    --sys-slate:#5b6f96;
    --serif:"Batang","바탕","AppleMyungjo",ui-serif,"Nanum Myeongjo",Georgia,serif;
    --body:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Apple SD Gothic Neo",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(227,168,87,.10), transparent 60%),
      radial-gradient(ellipse 120% 90% at 50% 110%, rgba(0,0,0,.35), transparent 60%),
      var(--bg);
    color:var(--ink);font-family:var(--body);
    padding:32px 18px 48px;min-height:100vh;display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:920px;display:flex;flex-direction:column;gap:18px;}

  header.top{display:flex;flex-direction:column;gap:4px;text-align:center;}
  header.top .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;}
  header.top h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5.4vw,42px);margin:2px 0 0;color:var(--ink);text-wrap:balance;}
  header.top p{margin:4px 0 0;color:var(--ink-dim);font-size:14px;}

  .stage{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:clamp(18px,4vw,34px);box-shadow:0 40px 90px -40px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.03);
    position:relative;overflow:hidden;
  }
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%);}

  .banner{display:flex;gap:10px;align-items:flex-start;background:rgba(193,73,63,.14);border:1px solid rgba(193,73,63,.4);color:#f0c9c4;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;white-space:pre-line;}
  .banner button{margin-left:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:16px;line-height:1;flex:none;}

  h2.section-title{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 4px;}
  p.section-sub{color:var(--ink-dim);font-size:13px;margin:0 0 16px;}

  /* ---------- quiz set grid ---------- */
  .bank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px;}
  .bank-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;cursor:pointer;color:var(--ink);font-family:var(--body);position:relative;}
  .bank-card:hover,.bank-card:focus-visible{border-color:var(--line-strong);transform:translateY(-1px);}
  .bank-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .bank-card .bar{width:30px;height:5px;border-radius:3px;background:var(--c);}
  .bank-card .name{font-size:16.5px;font-weight:700;padding-right:44px;}
  .bank-card .count{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;}
  .bank-card .preview{font-size:12px;color:var(--ink-dim);line-height:1.5;}
  .bank-card.selected{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset;}
  .bank-card .mine-tag{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-faint);background:var(--surface-3);border-radius:5px;padding:2px 6px;}
  .card-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px;}
  .icon-btn{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;}
  .icon-btn:hover{color:var(--ink);border-color:var(--line-strong);}
  .confirm-del{position:absolute;inset:0;background:rgba(22,36,42,.94);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;}
  .confirm-del span{font-size:13px;color:var(--ink);}
  .confirm-del .row{display:flex;gap:8px;}

  .add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:transparent;border:1.5px dashed var(--line-strong);border-radius:14px;color:var(--ink-dim);cursor:pointer;min-height:112px;font-family:var(--body);}
  .add-card:hover{color:var(--ink);border-color:var(--accent);}
  .add-card .plus{font-size:22px;color:var(--accent);}
  .add-card .lbl{font-size:13.5px;font-weight:700;}
  .add-card .sub{font-size:11px;color:var(--ink-faint);}

  .settings-row{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 22px;padding:16px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);}
  .setting{display:flex;flex-direction:column;gap:6px;}
  .setting label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{background:transparent;border:none;color:var(--ink-dim);font-family:var(--mono);font-size:13px;padding:6px 12px;cursor:pointer;}
  .seg button + button{border-left:1px solid var(--line);}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700;}
  .toggle-row{display:flex;align-items:center;gap:8px;}
  .toggle-row input{width:16px;height:16px;accent-color:var(--accent);}
  .toggle-row label{font-family:var(--body);font-size:13px;color:var(--ink-dim);text-transform:none;letter-spacing:0;}

  .start-btn{margin-top:6px;width:100%;padding:15px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-ink);font-family:var(--body);font-size:17px;font-weight:700;cursor:pointer;}
  .start-btn:disabled{background:var(--surface-3);color:var(--ink-faint);cursor:not-allowed;}
  .start-btn:not(:disabled):hover{background:var(--accent-strong);}

  /* ---------- builder ---------- */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;}
  .field input[type=text],.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:var(--body);font-size:15px;padding:10px 12px;}
  .field textarea{min-height:260px;resize:vertical;line-height:1.6;font-family:var(--mono);font-size:13.5px;}
  .field input[type=text]:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent;}
  .field-row{display:flex;gap:14px;flex-wrap:wrap;}
  .field-row .field{flex:1 1 200px;}
  .swatches{display:flex;gap:8px;}
  .swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--s);}
  .swatch[aria-pressed="true"]{border-color:var(--ink);}
  .format-guide{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-dim);margin-bottom:14px;line-height:1.7;}
  .format-guide b{color:var(--ink);}
  .format-guide code{font-family:var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:4px;}

  .qpreview{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .qpreview .qitem{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;}
  .qpreview .qitem.bad{border-color:var(--danger);}
  .qpreview .qitem .qn{font-family:var(--mono);color:var(--ink-faint);margin-right:6px;}
  .qpreview .qitem .qtype{font-family:var(--mono);font-size:10px;background:var(--surface-3);color:var(--ink-dim);border-radius:5px;padding:1px 6px;margin-left:8px;}
  .qpreview .qitem .opts{color:var(--ink-dim);margin-top:3px;}
  .qpreview .qitem .opts b{color:var(--success);}
  .qpreview .qitem .err{color:#f0c9c4;margin-top:3px;}

  .build-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;}

  .btn{font-family:var(--body);font-size:14.5px;font-weight:700;border-radius:11px;padding:12px 20px;cursor:pointer;border:1px solid var(--line);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border:none;}
  .btn.primary:hover{background:var(--accent-strong);}
  .btn.primary:disabled{background:var(--surface-3);color:var(--ink-faint);cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink-dim);}
  .btn.ghost:hover{color:var(--ink);border-color:var(--line-strong);}

  /* ---------- play ---------- */
  .play-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .set-tag{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ink-dim);}
  .set-tag .dot{width:9px;height:9px;border-radius:50%;background:var(--c);}
  .progress-track{flex:1;min-width:120px;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin:0 14px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
  .q-count{font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);}

  .timer-line{display:flex;justify-content:center;margin-bottom:10px;}
  .timer-chip{font-family:var(--mono);font-size:14px;color:var(--ink-dim);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:5px 14px;}
  .timer-chip.low{color:var(--danger);border-color:var(--danger);}

  .q-card{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:18px;padding:28px 24px;margin-bottom:18px;text-align:center;}
  .q-card .qtype-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:8px;}
  .q-card .qtext{font-family:var(--serif);font-size:clamp(20px,4vw,28px);color:var(--ink);text-wrap:balance;line-height:1.4;}

  .opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
  @media (max-width:480px){.opt-grid{grid-template-columns:1fr;}}
  .opt{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px 14px;font-family:var(--body);font-size:16px;font-weight:700;color:var(--ink);text-align:center;transition:background .25s,border-color .25s,color .25s;}
  .opt.revealed-correct{background:var(--success);border-color:var(--success);color:#0f1a0c;}

  .reveal-row{display:flex;gap:12px;justify-content:center;}

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "goldenbell_custom_sets_v1";
  var COLORS = [
    {v:"var(--sys-digest)"},{v:"var(--sys-circu)"},{v:"var(--sys-respir)"},
    {v:"var(--sys-excrete)"},{v:"var(--sys-plum)"},{v:"var(--sys-slate)"}
  ];

  var PRESET_SETS = [
    { key:"animal_energy_check", name:"동물과 에너지 형성평가", builtin:true, color:"var(--sys-digest)",
      questions:[
        {text:"다음 중 3대 영양소가 아닌 것은?", options:[
          {label:"탄수화물",correct:false},{label:"단백질",correct:false},
          {label:"무기염류",correct:true},{label:"지방",correct:false}]},
        {text:"단백질을 분해하는 소화효소를 모두 고르시오.", options:[
          {label:"펩신",correct:true},{label:"트립신",correct:true},
          {label:"아밀레이스",correct:false},{label:"라이페이스",correct:false}]},
        {text:"소화효소가 들어있지 않은 것은?", options:[
          {label:"위액",correct:false},{label:"이자액",correct:false},
          {label:"쓸개즙",correct:true},{label:"침",correct:false}]},
        {text:"정맥에는 판막이 있어 혈액의 역류를 막는다.", options:[
          {label:"O",correct:true},{label:"X",correct:false}]},
        {text:"폐포에서 일어나는 기체 교환으로 옳은 것은?", options:[
          {label:"산소가 혈액으로 이동한다",correct:true},{label:"이산화탄소만 흡수된다",correct:false},
          {label:"질소가 흡수된다",correct:false},{label:"수증기만 이동한다",correct:false}]},
        {text:"오줌을 만드는 기본 단위를 무엇이라 하는가?", options:[
          {label:"뉴런",correct:false},{label:"네프론",correct:true},
          {label:"폐포",correct:false},{label:"융털",correct:false}]},
        {text:"요소는 지방이 분해될 때 생기는 노폐물이다.", options:[
          {label:"O",correct:false},{label:"X",correct:true}]},
        {text:"다음 중 순환계에 속하는 것을 모두 고르시오.", options:[
          {label:"심장",correct:true},{label:"동맥",correct:true},
          {label:"콩팥",correct:false},{label:"위",correct:false},{label:"정맥",correct:true}]}
      ]}
  ];

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
  function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  // ---------------- custom set storage ----------------
  var customSets = [];
  function loadCustom(){
    try{ var raw = window.localStorage.getItem(STORAGE_KEY); customSets = raw ? JSON.parse(raw) : []; }
    catch(e){ customSets = []; }
  }
  function persistCustom(){
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(customSets)); return true; }
    catch(e){ return false; }
  }
  function allSets(){ return PRESET_SETS.concat(customSets); }
  function getSet(key){ var f=null; allSets().forEach(function(s){ if(s.key===key) f=s; }); return f; }

  // ---------------- parsing ----------------
  function questionsToText(questions){
    return questions.map(function(q){
      return q.text + "\n" + q.options.map(function(o){ return o.label + (o.correct ? " *" : ""); }).join("\n");
    }).join("\n\n");
  }
  function parseQuizText(text){
    var blocks = text.split(/\n\s*\n+/).map(function(b){ return b.trim(); }).filter(function(b){ return b.length>0; });
    return blocks.map(function(block){
      var lines = block.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length>0; });
      if (lines.length < 3){
        return { error:"문항 1줄 + 보기 2줄 이상이 필요해요", raw:block };
      }
      var qtext = lines[0];
      var options = lines.slice(1).map(function(l){
        var correct = /\*\s*$/.test(l);
        var label = l.replace(/\*\s*$/,"").trim();
        return {label:label, correct:correct};
      });
      var correctCount = options.filter(function(o){return o.correct;}).length;
      if (options.some(function(o){return !o.label;})){
        return { error:"빈 보기가 있어요", raw:block };
      }
      if (correctCount === 0){
        return { error:"정답 표시(*)가 없어요 — 정답 보기 끝에 * 를 붙여주세요", raw:block };
      }
      return { text:qtext, options:options, type:(correctCount>1?"multi":(options.length===2 && /^(o|x)$/i.test(options[0].label)?"ox":"single")) };
    });
  }

  // ---------------- state ----------------
  var state = {
    phase:"select",        // select | build | play | finish
    setKey:"animal_energy_check",
    perQSeconds:null,       // null | 10 | 20 | 30
    shuffleQ:false,
    banner:null,
    confirmDeleteKey:null,
    build:null,             // {editKey,name,color,text}
    play:null               // {order:[idx...], pos, revealed, timeLeft, timerHandle}
  };

  var stageEl = document.getElementById("stage");
  var timerHandle = null;

  function render(){
    if (state.phase==="select") renderSelect();
    else if (state.phase==="build") renderBuild();
    else if (state.phase==="play") renderPlay();
    else if (state.phase==="finish") renderFinish();
    saveSnapshot();
  }
  function bannerHtml(){
    if (!state.banner) return "";
    return '<div class="banner"><span>'+esc(state.banner)+'</span><button id="bannerClose">×</button></div>';
  }
  function bindBanner(){
    var b=document.getElementById("bannerClose");
    if (b) b.addEventListener("click", function(){ state.banner=null; render(); });
  }

  // ================= SELECT =================
  function renderSelect(){
    var html = bannerHtml();
    html += '<h2 class="section-title">문제 세트 고르기</h2><p class="section-sub">차시 마무리에 낼 형성평가 문제 모음이에요.</p>';
    html += '<div class="bank-grid">';
    PRESET_SETS.forEach(function(s){ html += setCardHtml(s); });
    customSets.forEach(function(s){ html += setCardHtml(s); });
    html += '<button class="add-card" id="addSetBtn"><span class="plus">+</span><span class="lbl">내 문제 만들기</span><span class="sub">문항을 직접 입력</span></button>';
    html += '</div>';

    html += '<div class="settings-row">' +
      '<div class="setting"><label>문제당 생각 시간</label><div class="seg" data-seg="time">' +
        [{v:"none",l:"제한없음"},{v:"10",l:"10초"},{v:"20",l:"20초"},{v:"30",l:"30초"}].map(function(o){
          var pressed = (o.v==="none" ? state.perQSeconds===null : state.perQSeconds===parseInt(o.v,10));
          return '<button aria-pressed="'+pressed+'" data-val="'+o.v+'">'+o.l+'</button>';
        }).join("") +
      '</div></div>' +
      '<div class="setting"><label>&nbsp;</label><div class="toggle-row">' +
        '<input type="checkbox" id="shuffleChk"'+(state.shuffleQ?" checked":"")+'><label for="shuffleChk">문제 순서 섞기</label>' +
      '</div></div>' +
    '</div>';

    html += '<button class="start-btn" id="startBtn"'+(getSet(state.setKey)?"":" disabled")+'>시작하기</button>';

    stageEl.innerHTML = html;
    bindBanner();

    stageEl.querySelectorAll(".bank-card").forEach(function(el){
      el.addEventListener("click", function(ev){
        if (ev.target.closest(".card-actions")||ev.target.closest(".confirm-del")) return;
        state.setKey = el.getAttribute("data-set");
        render();
      });
    });
    stageEl.querySelectorAll("[data-edit]").forEach(function(el){
      el.addEventListener("click", function(ev){ ev.stopPropagation(); openBuilder(getSet(el.getAttribute("data-edit"))); });
    });
    stageEl.querySelectorAll("[data-ask-del]").forEach(function(el){
      el.addEventListener("click", function(ev){ ev.stopPropagation(); state.confirmDeleteKey = el.getAttribute("data-ask-del"); render(); });
    });
    stageEl.querySelectorAll("[data-del]").forEach(function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var k = el.getAttribute("data-del");
        customSets = customSets.filter(function(s){ return s.key!==k; });
        if (state.setKey===k) state.setKey = "animal_energy_check";
        state.confirmDeleteKey = null;
        persistCustom();
        render();
      });
    });
    stageEl.querySelectorAll("[data-cancel-del]").forEach(function(el){
      el.addEventListener("click", function(ev){ ev.stopPropagation(); state.confirmDeleteKey=null; render(); });
    });
    var addSetBtn = document.getElementById("addSetBtn");
    if (addSetBtn) addSetBtn.addEventListener("click", function(){ openBuilder(null); });

    stageEl.querySelectorAll('[data-seg]').forEach(function(seg){
      seg.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){
          var v = b.getAttribute("data-val");
          state.perQSeconds = (v==="none") ? null : parseInt(v,10);
          render();
        });
      });
    });
    var shuffleChk = document.getElementById("shuffleChk");
    if (shuffleChk) shuffleChk.addEventListener("change", function(e){ state.shuffleQ = e.target.checked; });

    document.getElementById("startBtn").addEventListener("click", startQuiz);
  }

  function setCardHtml(s){
    var sel = state.setKey===s.key ? " selected" : "";
    var preview = s.questions.slice(0,2).map(function(q){ return q.text; }).join(" / ");
    var actions = "";
    if (!s.builtin){
      if (state.confirmDeleteKey===s.key){
        actions = '<div class="confirm-del"><span>이 문제 세트를 삭제할까요?</span><div class="row">' +
          '<button class="btn primary" data-del="'+s.key+'" style="padding:7px 14px;font-size:12.5px;">삭제</button>' +
          '<button class="btn ghost" data-cancel-del="1" style="padding:7px 14px;font-size:12.5px;">취소</button>' +
        '</div></div>';
      } else {
        actions = '<div class="card-actions">' +
          '<button class="icon-btn" data-edit="'+s.key+'" title="수정">✎</button>' +
          '<button class="icon-btn" data-ask-del="'+s.key+'" title="삭제">🗑</button>' +
        '</div>';
      }
    }
    return '<button class="bank-card'+sel+'" style="--c:'+s.color+'" data-set="'+s.key+'">' +
      '<span class="bar"></span>' +
      (s.builtin?'':'<span class="mine-tag">내 문제</span>') +
      '<span class="name">'+esc(s.name)+'</span>' +
      '<span class="count">'+s.questions.length+'문항</span>' +
      '<span class="preview">'+esc(preview)+'</span>' +
      actions +
    '</button>';
  }

  // ================= BUILDER =================
  function openBuilder(existing){
    if (existing){
      state.build = { editKey:existing.key, name:existing.name, color:existing.color, text:questionsToText(existing.questions) };
    } else {
      state.build = { editKey:null, name:"", color:COLORS[Math.floor(Math.random()*COLORS.length)].v,
        text:"다음 중 상태 변화의 예로 옳은 것은?\n얼음이 녹는다 *\n종이가 탄다\n소금이 물에 녹는다\n철이 녹슨다\n\n증발은 표면에서 액체가 기체로 변하는 현상이다.\nO *\nX" };
    }
    state.phase = "build";
    render();
  }

  function renderBuild(){
    var b = state.build;
    var parsed = parseQuizText(b.text);
    var html = '<h2 class="section-title">'+(b.editKey?"문제 세트 수정하기":"내 문제 만들기")+'</h2>';
    html += '<p class="section-sub">문항마다 빈 줄로 구분해서 입력하세요. 첫 줄은 문제, 다음 줄부터 보기이며 정답 보기 끝에 <code>*</code>를 붙입니다.</p>';

    html += '<div class="field-row">' +
      '<div class="field" style="flex:1 1 240px;"><label>문제 세트 이름</label><input type="text" id="fName" value="'+esc(b.name)+'" placeholder="예: 물질의 상태 변화 형성평가" maxlength="40"></div>' +
      '<div class="field"><label>색상</label><div class="swatches">' +
        COLORS.map(function(c){ return '<button class="swatch" style="--s:'+c.v+'" aria-pressed="'+(b.color===c.v)+'" data-color="'+c.v+'"></button>'; }).join("") +
      '</div></div>' +
    '</div>';

    html += '<div class="format-guide">' +
      '<b>입력 형식</b><br>' +
      '1줄: 문제 &nbsp;·&nbsp; 2번째 줄부터: 보기 (정답 보기 끝에 <code>*</code>)<br>' +
      '보기가 2개면 OX문제, 정답이 1개면 4지선다, 정답이 2개 이상이면 모두 고르기 문제로 자동 인식돼요.<br>' +
      '문항 사이는 <b>빈 줄</b>로 구분하세요.' +
    '</div>';

    html += '<div class="field"><label>문제 입력</label><textarea id="fText">'+esc(b.text)+'</textarea></div>';

    html += '<div class="qpreview" id="qpreview">' + parsed.map(function(q,i){
      if (q.error) return '<div class="qitem bad"><span class="qn">'+(i+1)+'.</span>'+esc(q.raw.split("\n")[0]||"(빈 문항)")+'<div class="err">⚠ '+esc(q.error)+'</div></div>';
      var typeLabel = q.type==="ox"?"OX":(q.type==="multi"?"모두 고르기":"객관식");
      var correctLabels = q.options.filter(function(o){return o.correct;}).map(function(o){return o.label;}).join(", ");
      return '<div class="qitem"><span class="qn">'+(i+1)+'.</span>'+esc(q.text)+'<span class="qtype">'+typeLabel+'</span>' +
        '<div class="opts">보기 '+q.options.length+'개 · 정답: <b>'+esc(correctLabels)+'</b></div></div>';
    }).join("") + '</div>';

    html += '<div class="build-actions">' +
      '<button class="btn primary" id="saveBuildBtn">저장하고 목록으로</button>' +
      '<button class="btn ghost" id="cancelBuildBtn">취소</button>' +
    '</div>';

    stageEl.innerHTML = html;

    document.getElementById("fName").addEventListener("input", function(e){ state.build.name = e.target.value; });
    stageEl.querySelectorAll("[data-color]").forEach(function(el){
      el.addEventListener("click", function(){ state.build.color = el.getAttribute("data-color"); render(); });
    });
    var ta = document.getElementById("fText");
    ta.addEventListener("input", function(e){
      state.build.text = e.target.value;
      var p = parseQuizText(state.build.text);
      var prev = document.getElementById("qpreview");
      prev.innerHTML = p.map(function(q,i){
        if (q.error) return '<div class="qitem bad"><span class="qn">'+(i+1)+'.</span>'+esc(q.raw.split("\n")[0]||"(빈 문항)")+'<div class="err">⚠ '+esc(q.error)+'</div></div>';
        var typeLabel = q.type==="ox"?"OX":(q.type==="multi"?"모두 고르기":"객관식");
        var correctLabels = q.options.filter(function(o){return o.correct;}).map(function(o){return o.label;}).join(", ");
        return '<div class="qitem"><span class="qn">'+(i+1)+'.</span>'+esc(q.text)+'<span class="qtype">'+typeLabel+'</span>' +
          '<div class="opts">보기 '+q.options.length+'개 · 정답: <b>'+esc(correctLabels)+'</b></div></div>';
      }).join("");
    });

    document.getElementById("cancelBuildBtn").addEventListener("click", function(){ state.build=null; state.phase="select"; render(); });
    document.getElementById("saveBuildBtn").addEventListener("click", saveBuild);
  }

  function saveBuild(){
    var b = state.build;
    var name = b.name.trim();
    var parsed = parseQuizText(b.text);
    var valid = parsed.filter(function(q){ return !q.error; });
    var badCount = parsed.length - valid.length;

    if (!name){ state.banner="문제 세트 이름을 입력해 주세요."; render(); return; }
    if (valid.length < 3){ state.banner="정상적으로 인식된 문항이 최소 3개 이상이어야 해요. (현재 "+valid.length+"개)"; render(); return; }

    var key = b.editKey || ("custom_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    var set = { key:key, name:name, color:b.color, builtin:false,
      questions: valid.map(function(q){ return {text:q.text, options:q.options}; }) };

    if (b.editKey) customSets = customSets.map(function(x){ return x.key===b.editKey ? set : x; });
    else customSets.push(set);

    var ok = persistCustom();
    state.setKey = key;
    state.build = null;
    state.phase = "select";
    state.banner = badCount>0
      ? ("일부 문항("+badCount+"개)은 형식 오류로 제외하고 "+valid.length+"문항을 저장했어요.")
      : (ok ? null : "저장 공간이 부족해 이 문제 세트는 새로고침하면 사라질 수 있어요.");
    render();
  }

  // ================= PLAY =================
  function startQuiz(){
    var set = getSet(state.setKey);
    var order = set.questions.map(function(_,i){ return i; });
    if (state.shuffleQ) order = shuffle(order);
    state.play = { order:order, pos:0, revealed:false, timeLeft:state.perQSeconds };
    state.phase = "play";
    render();
    if (state.perQSeconds !== null) tickTimer();
  }
  function currentQuestion(){
    var set = getSet(state.setKey);
    return set.questions[state.play.order[state.play.pos]];
  }
  function tickTimer(){
    clearTimer();
    timerHandle = setInterval(function(){
      state.play.timeLeft -= 1;
      if (state.play.timeLeft <= 0){
        clearTimer();
        state.play.timeLeft = 0;
        updateTimerHud();
        enableReveal();
      } else {
        updateTimerHud();
      }
    }, 1000);
  }
  function clearTimer(){ if (timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
  function updateTimerHud(){
    var chip = document.getElementById("timerChip");
    if (chip){
      chip.textContent = "⏱ " + state.play.timeLeft + "초";
      chip.classList.toggle("low", state.play.timeLeft<=5);
    }
    var revealBtn = document.getElementById("revealBtn");
    if (revealBtn && state.play.timeLeft<=0) revealBtn.disabled = false;
  }
  function enableReveal(){
    var revealBtn = document.getElementById("revealBtn");
    if (revealBtn) revealBtn.disabled = false;
  }

  function renderPlay(){
    var set = getSet(state.setKey);
    var q = currentQuestion();
    var p = state.play;
    var total = p.order.length;
    var typeLabel = q.options.length===2 && /^(o|x)$/i.test(q.options[0].label) ? "OX 문제" :
      (q.options.filter(function(o){return o.correct;}).length>1 ? "모두 고르기" : "객관식");

    var html = '<div class="play-top">' +
      '<span class="set-tag"><span class="dot" style="--c:'+set.color+'"></span>'+esc(set.name)+'</span>' +
      '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round(((p.pos)/(total))*100)+'%"></div></div>' +
      '<span class="q-count">'+(p.pos+1)+' / '+total+'</span>' +
    '</div>';

    if (state.perQSeconds !== null && !p.revealed){
      html += '<div class="timer-line"><span class="timer-chip'+(p.timeLeft<=5?" low":"")+'" id="timerChip">⏱ '+p.timeLeft+'초</span></div>';
    }

    html += '<div class="q-card"><div class="qtype-tag">'+typeLabel+'</div><div class="qtext">'+esc(q.text)+'</div></div>';

    html += '<div class="opt-grid">' + q.options.map(function(o){
      var cls = "opt";
      if (p.revealed) cls += o.correct ? " revealed-correct" : " revealed-wrong";
      return '<div class="'+cls+'">'+esc(o.label)+'</div>';
    }).join("") + '</div>';

    if (!p.revealed){
      var revealDisabled = (state.perQSeconds !== null && p.timeLeft > 0);
      html += '<div class="reveal-row"><button class="reveal-btn" id="revealBtn"'+(revealDisabled?" disabled":"")+'>⭐ 정답 공개</button></div>';
    } else {
      var isLast = (p.pos >= total-1);
      html += '<div class="reveal-row"><button class="next-btn" id="nextBtn">'+(isLast?"결과 보기":"다음 문제 →")+'</button></div>';
    }

    html += '<div class="nav-row">' +
      '<button id="prevBtn"'+(p.pos<=0?" disabled":"")+'>← 이전 문제</button>' +
      '<button id="quitBtn">문제 세트 목록으로</button>' +
    '</div>';

    stageEl.innerHTML = html;

    var revealBtn = document.getElementById("revealBtn");
    if (revealBtn) revealBtn.addEventListener("click", function(){
      clearTimer(); window.KJS&&KJS.ok({msg:'정답 공개! 맞힌 친구 박수 👏'});
      state.play.revealed = true;
      render();
    });
    var nextBtn = document.getElementById("nextBtn");
    if (nextBtn) nextBtn.addEventListener("click", function(){
      if (state.play.pos >= total-1){
        state.phase = "finish";
        render();
      } else {
        state.play.pos += 1;
        state.play.revealed = false;
        state.play.timeLeft = state.perQSeconds;
        render();
        if (state.perQSeconds !== null) tickTimer();
      }
    });
    document.getElementById("prevBtn").addEventListener("click", function(){
      if (state.play.pos>0){
        clearTimer();
        state.play.pos -= 1;
        state.play.revealed = false;
        state.play.timeLeft = state.perQSeconds;
        render();
        if (state.perQSeconds !== null) tickTimer();
      }
    });
    document.getElementById("quitBtn").addEventListener("click", function(){
      clearTimer();
      state.phase = "select";
      render();
    });
  }

  // ================= FINISH =================
  function renderFinish(){
    var set = getSet(state.setKey);
    var html = '<div class="result">' +
      '<div class="badge">⭐</div>' +
      '<h2>오늘의 형성평가 완료!</h2>' +
      '<p class="sub">'+esc(set.name)+' · 총 '+set.questions.length+'문항을 모두 확인했어요.</p>' +
      '<div class="recap-list">' + set.questions.map(function(q,i){
        var correctLabels = q.options.filter(function(o){return o.correct;}).map(function(o){return o.label;}).join(", ");
        return '<div class="recap-item"><div class="rq">'+(i+1)+'. '+esc(q.text)+'</div><div class="ra">정답: '+esc(correctLabels)+'</div></div>';
      }).join("") + '</div>' +
      '<div class="result-actions">' +
        '<button class="btn primary" id="againBtn">다시 풀기</button>' +
        '<button class="btn ghost" id="backBtn">다른 문제 세트 선택</button>' +
      '</div>' +
    '</div>';
    stageEl.innerHTML = html;
    document.getElementById("againBtn").addEventListener("click", startQuiz);
    document.getElementById("backBtn").addEventListener("click", function(){ state.phase="select"; render(); });
  }

  // ---- resume across republish (best-effort) ----
  function saveSnapshot(){
    try{
      if (window.claude && window.claude.hot && window.claude.hot.snapshot){
        window.claude.hot.snapshot({
          phase:(state.phase==="build"||state.phase==="play" ? "select" : state.phase),
          setKey: state.setKey, perQSeconds: state.perQSeconds, shuffleQ: state.shuffleQ
        });
      }
    }catch(e){}
  }
  function boot(saved){
    loadCustom();
    if (saved && saved.setKey && getSet(saved.setKey)){
      state.setKey = saved.setKey;
      state.perQSeconds = (typeof saved.perQSeconds==="number") ? saved.perQSeconds : null;
      state.shuffleQ = !!saved.shuffleQ;
    }
    state.phase = "select";
    render();
  }
  try{
    if (window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(function(){ boot(window.claude.hot.data || {}); });
    } else {
      boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
    }
  }catch(e){ boot({}); }
})();
</script>
