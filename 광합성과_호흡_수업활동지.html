<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광합성과 호흡 - 학생 활동지</title>
<style>
:root{--g:#16a34a;--gd:#15803d;--gl:#dcfce7;--b:#2563eb;--bl:#dbeafe;--o:#ea580c;--ol:#ffedd5;--r:#dc2626;--rl:#fee2e2;--ink:#0f172a;--mut:#64748b;--bd:#cbd5e1;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.nav{background:#0f172a;color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.nav b{font-size:15px}
.tabs{display:flex;gap:6px}.tb{background:#1e293b;color:#cbd5e1;border:1px solid #334155;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:800;cursor:pointer}.tb.on{background:var(--g);color:#fff;border-color:var(--g)}
.acts{display:flex;gap:6px;flex-wrap:wrap}.lk{display:inline-flex;align-items:center;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;border:1px solid #cbd5e1;background:#fff;color:#1e293b}
.lk.sim{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.lk.hub{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.lk.j{background:#fffbeb;border-color:#fde68a;color:#b45309}.lk.gm{background:#faf5ff;border-color:#e9d5ff;color:#7e22ce}
.pr{background:var(--b);color:#fff;border:0;padding:7px 16px;border-radius:6px;font-weight:800;font-size:13px;cursor:pointer}
.wrap{max-width:920px;margin:22px auto 60px;padding:0 14px}
.ws{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:26px 30px;box-shadow:0 4px 20px rgba(0,0,0,.04);margin-bottom:22px}
.hd{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.tr{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.tr h1{margin:0;font-size:23px;font-weight:800}
.badge{background:var(--gl);color:var(--gd);font-size:12px;font-weight:800;padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:6px}
.si{display:flex;gap:12px;font-size:13.5px;font-weight:700}.fld{display:inline-block;border-bottom:1.5px solid var(--ink);min-width:60px;text-align:center;padding:2px 6px}
.zb{border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:14px;background:#fff}
.zt{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:800}.t1{background:#fef3c7;color:#92400e}.t2{background:var(--bl);color:var(--b)}.t3{background:var(--rl);color:var(--r)}.t4{background:var(--gl);color:var(--gd)}
.how{font-size:13px;color:#334155;background:#f1f5f9;border-radius:6px;padding:7px 10px;margin:4px 0 8px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center;margin:6px 0}
table.t th,table.t td{border:1px solid var(--bd);padding:6px 3px}table.t th{background:#f1f5f9;font-weight:800;color:#334155}
table.t td.in{height:30px}
td.ans{background:#fef9c3;color:#14532d;font-weight:800}
.q{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:9px 13px;margin-top:8px;font-size:13.5px}
.q p{margin:0 0 6px;font-weight:700;color:#1e293b}
.fi{border:0;border-bottom:1.5px solid var(--g);background:transparent;padding:2px 6px;font-size:13.5px;font-weight:700;color:var(--gd);outline:0;text-align:center;width:120px;font-family:inherit}
.ta{width:100%;border:1.5px dashed #94a3b8;border-radius:6px;padding:8px;font-size:13.5px;font-family:inherit;min-height:56px;resize:vertical;background:#fff}
.opt{display:inline-flex;gap:5px;margin:0 3px}.opt label{border:1.5px solid var(--bd);border-radius:14px;padding:1px 10px;cursor:pointer;font-size:13px;font-weight:700}.opt input{display:none}.opt input:checked+span{color:var(--b)}.opt label:has(input:checked){border-color:var(--b);background:var(--bl)}
.gwrap{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0}
.gwrap svg{width:100%;max-width:400px;margin:0 auto;display:block;height:auto;background:#fff;border:1px solid var(--bd);border-radius:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hide{display:none!important}
.key{border:2px solid #f59e0b;background:#fffbeb;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13.5px}
.key b{color:#b45309}
.brk{page-break-before:always}
@media (max-width:640px){.row2{grid-template-columns:1fr}.ws{padding:16px}}
@media print{body{background:#fff!important}.nav{display:none!important}.wrap{max-width:100%!important;margin:0!important;padding:0!important}.ws{border:0!important;box-shadow:0!important;padding:3mm 5mm!important;margin:0!important}.zb{border:1px solid #000!important;page-break-inside:avoid;margin-bottom:6px!important}.q{border:1px dashed #666!important;background:#fff!important}.ta{border:1px dashed #666!important}@page{size:A4;margin:9mm 11mm}.brk{page-break-before:always}}
</style>
</head>
<body>
<div class="nav">
  <b>🌱 광합성과 호흡 (중2 과학)</b>
  <div class="tabs"><button class="tb on" id="tbS" onclick="sw('S')">📄 학생 활동지</button><button class="tb" id="tbT" onclick="sw('T')">✅ 교사용 정답</button></div>
  <div class="acts">
    <a class="lk sim" href="./광합성과_호흡_가상실험실.html">🌿 가상실험</a>
    <a class="lk hub" href="./통합_과학수업_서랍.html">📚 통합과학</a>
    <a class="lk j" href="./자바실험실_서랍.html">🔬 자바실험</a>
    <a class="lk gm" href="./시작하기_수업게임서랍.html">🎮 수업게임</a>
    <button class="pr" onclick="window.print()">🖨️ 인쇄 (A4/PDF)</button>
  </div>
</div>
<div class="wrap">
<div id="pgS" class="ws"></div>
<div id="pgT" class="ws hide"></div>
</div>
<script>
function sw(t){document.getElementById('pgS').classList.toggle('hide',t!=='S');document.getElementById('pgT').classList.toggle('hide',t!=='T');document.getElementById('tbS').classList.toggle('on',t==='S');document.getElementById('tbT').classList.toggle('on',t==='T');window.scrollTo(0,0)}
const OPT=(n,a,b,c)=>`<span class="opt">${[a,b,c].filter(Boolean).map(t=>`<label><input type="radio" name="${n}"><span>${t}</span></label>`).join('')}</span>`;
function build(ans){
 const A=(t)=>ans?`<b style="color:#b45309">${t}</b>`:'';
 const fi=(w,v)=>ans?`<span class="fi" style="display:inline-block;width:${w}px;color:#b45309;border-bottom-color:#f59e0b">${v}</span>`:`<input class="fi" style="width:${w}px">`;
 const ta=(v)=>ans?`<div class="key">${v}</div>`:`<textarea class="ta" placeholder="여기에 써 보세요"></textarea>`;
 const c=(v)=>ans?`<td class="ans">${v}</td>`:`<td class="in"></td>`;
 return `
 <div class="hd"><div class="tr"><div><span class="badge">중2 과학 · Ⅴ. 식물과 에너지</span><h1>${ans?'[교사용 정답] ':'[활동지] '}광합성과 호흡</h1></div>
 <div class="si"><span>2학년 <span class="fld"></span>반</span><span><span class="fld"></span>번</span><span>이름: <span class="fld" style="min-width:90px"></span></span></div></div></div>
 <div class="how">🧪 <b>활동 방법</b>: 가상실험실에서 <b>[낮]/[밤]</b> 버튼을 눌러 기체의 이동 방향을 관찰하고, <b>[세포 내 물질과 에너지 순환]</b> 탭에서 엽록체와 마이토콘드리아의 물질 이동을 관찰해 빈칸을 채워 보세요.</div>

 <div class="zb"><div class="zt"><span>🌞🌙 활동 1. 낮과 밤의 기체 출입</span><span class="tag t1">탭 ①</span></div>
  <table class="t"><tr><th style="width:90px">구분</th><th>광합성</th><th>호흡</th><th>이산화 탄소(CO₂)</th><th>산소(O₂)</th></tr>
   <tr><th>🌞 낮</th>${c('많이 일어남')}${c('일어남')}${c('들어감')}${c('나옴')}</tr>
   <tr><th>🌙 밤</th>${c('일어나지 않음')}${c('일어남')}${c('나옴')}${c('들어감')}</tr></table>
  <div class="q"><p>(1) 낮에는 광합성량이 호흡량보다 ${ans?A('많아서'):OPT('a1','많아서','적어서','같아서')} 식물이 이산화 탄소를 ${ans?A('흡수'):OPT('a2','흡수','방출')}하고 산소를 ${ans?A('방출'):OPT('a3','흡수','방출')}하는 것처럼 보인다.</p>
  <p>(2) 밤에는 ${fi(60,'호흡')}만 일어나므로 ${fi(50,'산소')}를 흡수하고 ${fi(90,'이산화 탄소')}를 방출한다.</p>
  <p>(3) 광합성은 주로 ${fi(40,'낮')}에 일어나지만, 호흡은 ${fi(110,'낮과 밤 관계없이 항상')} 일어난다.</p>
  <p>(4) 다음 설명이 맞으면 ○, 틀리면 ×: "식물은 낮에는 호흡을 하지 않는다." ${ans?A('× (낮에도 호흡은 일어난다)'):OPT('a4','○','×')}</p></div></div>

 <div class="zb"><div class="zt"><span>🔬 활동 2. 엽록체와 마이토콘드리아</span><span class="tag t2">탭 ②</span></div>
  <table class="t"><tr><th style="width:90px">구분</th><th>엽록체</th><th>마이토콘드리아</th></tr>
   <tr><th>일어나는 과정</th>${c('광합성')}${c('호흡')}</tr>
   <tr><th>들어가는 물질</th>${c('이산화 탄소, 물 (+ 빛에너지)')}${c('포도당, 산소')}</tr>
   <tr><th>나오는 물질</th>${c('포도당, 산소')}${c('이산화 탄소, 물 (+ 에너지)')}</tr>
   <tr><th>에너지</th>${c('빛에너지를 흡수해 포도당에 저장')}${c('포도당을 분해해 생명활동 에너지 방출')}</tr></table>
  <div class="q"><p>(1) 광합성의 식:  이산화 탄소 + ${fi(40,'물')} —(${fi(70,'빛에너지')})→ ${fi(50,'포도당')} + ${fi(40,'산소')}</p>
  <p>(2) 호흡의 식:  ${fi(50,'포도당')} + ${fi(40,'산소')} → ${fi(90,'이산화 탄소')} + ${fi(40,'물')} + ${fi(70,'에너지')}</p></div></div>

 <div class="zb brk"><div class="zt"><span>🔄 활동 3. 물질과 에너지의 순환</span><span class="tag t3">탭 ② · 🔄 순환 연결</span></div>
  <div class="q"><p>(1) 광합성으로 만들어진 ${fi(50,'포도당')}과 ${fi(40,'산소')}는 마이토콘드리아에서 ${fi(40,'호흡')}의 재료가 된다.</p>
  <p>(2) 호흡으로 생긴 ${fi(90,'이산화 탄소')}와 ${fi(40,'물')}은 다시 엽록체에서 ${fi(40,'광합성')}의 재료로 쓰인다.</p>
  <p>(3) 빛 버튼을 껐을 때 엽록체와 마이토콘드리아에서 각각 어떤 변화가 있었는지 써 보자.</p>${ta('엽록체에서는 광합성이 멈추고, 마이토콘드리아에서는 호흡이 계속 일어나 생명활동에 필요한 에너지를 낸다.')}
  <p>(4) 광합성과 호흡의 관계를 "물질"과 "에너지"의 관점에서 비교해 써 보자.</p>${ta('광합성은 빛에너지를 이용해 포도당을 만들고 에너지를 저장하며, 호흡은 포도당을 분해해 생명활동에 필요한 에너지를 얻는다. 각 과정의 산물은 서로의 재료가 되어 물질이 순환한다.')}</div></div>

 <div class="zb"><div class="zt"><span>📝 활동 4. 정리하기</span><span class="tag t4">종합</span></div>
  <div class="q"><p>(1) 광합성과 호흡을 비교해 보자.</p>
  <table class="t"><tr><th>구분</th><th>광합성</th><th>호흡</th></tr>
   <tr><th>장소</th>${c('엽록체')}${c('마이토콘드리아')}</tr>
   <tr><th>시간</th>${c('빛이 있을 때(주로 낮)')}${c('항상(낮과 밤)')}</tr>
   <tr><th>에너지</th>${c('빛에너지 → 저장')}${c('저장된 에너지 → 방출')}</tr></table>
  <p>(2) 오늘 알게 된 점을 한 문장으로 써 보자.</p>${ta('광합성은 엽록체에서 낮에 빛에너지로 포도당을 만드는 과정이고, 호흡은 마이토콘드리아에서 항상 포도당을 분해해 에너지를 얻는 과정이며, 두 과정에서 물질이 순환한다.')}</div></div>`}
document.getElementById('pgS').innerHTML=build(false);
document.getElementById('pgT').innerHTML=build(true);
</script>
<style id="rsp1017">
@media (pointer:coarse) and (hover:none){
 button,.btn,.opt,select,[role=button],input[type=button],input[type=submit],.lk,.ctrl-btn,.btn-top,.btn-unified-nav,.km-chip,.unit-chip,.tab{min-height:44px}
 input[type=radio],input[type=checkbox]{width:24px;height:24px;min-width:24px;accent-color:#2563eb}
 input[type=range]{min-height:32px}
 .btn-star{min-width:44px;min-height:44px}
}
@media (max-width:640px){
 img,video{max-width:100%;height:auto}
 .km-scroll,.unitchips,.jumpchips,.unit-chips-row,nav.dh-seg,nav.tabs,#tabs,.tabs{overflow-x:auto!important;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
 .km-row>*,.navrow>*,.unit-nav-bar>*{min-width:0}
 header,.header-inner,.header-utils,.header-actions,.unified-nav-actions,.nav-actions,.tools,.panel-header,#hud,#bottom,.grp,.dh-r,.dh-t1,.row2{flex-wrap:wrap!important;row-gap:6px}
 #hud{height:auto!important;min-height:38px;padding-top:4px!important;padding-bottom:4px!important}
 .dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .dashboard-grid>*,.hud-card{min-width:0}
 .hud-val{white-space:normal!important;overflow-wrap:anywhere}
 .lesson-grid{grid-template-columns:minmax(0,1fr)!important}
 .lesson-card{min-width:0!important;max-width:100%!important}
 .control-grid,.hud-stats{grid-template-columns:minmax(0,1fr)!important}
 .panel-card{min-width:0;max-width:100%}
}

@media (max-width:640px){table{display:block;overflow-x:auto;max-width:100%}}
</style>
</body>
</html>
