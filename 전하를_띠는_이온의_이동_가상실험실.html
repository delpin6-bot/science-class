  $('#ctl1').innerHTML='<div class="cr"><span class="lb2">⚡ 전원 장치</span>'+[6,9,12].map(v=>`<button class="btn" data-vv="${v}" style="min-width:64px;min-height:64px">${v} V</button>`).join('')+'</div><button class="sw2" id="pw1" style="min-height:68px;margin-top:6px">⏻ 전원 켜기</button><button class="sw2" id="inv1" style="min-height:64px;margin-top:6px">👁 보이지 않는 이온 보기</button>';
  vvUI()}
function vvUI(){$$('[data-vv]').forEach(b=>b.classList.toggle('on',+b.dataset.vv===E.V));const p=$('#pw1');if(p){p.classList.toggle('on',E.pw);p.textContent=E.pw?'⏻ 전원 끄기 (ON)':'⏻ 전원 켜기 (OFF)'}const i=$('#inv1');if(i){i.classList.toggle('on',E.inv);i.textContent=E.inv?'👁 보이지 않는 이온 숨기기':'👁 보이지 않는 이온 보기'}}
function ctl2(){
  $('#selh2').textContent='🧪 확대해서 볼 수용액';
  $('#sel2').innerHTML='<button class="btn" data-r2="cu"><span>🔵</span>황산 구리(Ⅱ)<br>CuSO₄ 수용액</button><button class="btn" data-r2="mn"><span>🟣</span>과망가니즈산 칼륨<br>KMnO₄ 수용액</button><button class="btn" id="shuf2"><span>🔀</span>입자 다시<br>섞기</button>';
  $('#ctl2').innerHTML='<div class="cr"><span class="lb2">⚡ 전압 12 V</span></div><button class="sw2" id="pw2" style="min-height:68px;margin-top:6px">⏻ 전원 켜기</button><button class="sw2" id="bg2" style="min-height:60px;margin-top:6px">🧂 거름종이 속 K⁺·NO₃⁻ 보기</button>';
  mUI();info2()}
function mUI(){$$('[data-r2]').forEach(b=>{b.classList.toggle('on',b.dataset.r2===M2.r);b.classList.toggle('seen',S.mic.has(b.dataset.r2))});const p=$('#pw2');if(p){p.classList.toggle('on',M2.pw);p.textContent=M2.pw?'⏻ 전원 끄기 (ON)':'⏻ 전원 켜기 (OFF)'}const b=$('#bg2');if(b){b.classList.toggle('on',M2.bg)}}
function info2(){
  $('#info2').innerHTML=M2.r==='cu'?'<div class="kv2">🔵 황산 구리(Ⅱ)는 물에 녹아 이온으로 나뉘어요</div><div class="kv2" style="margin-top:4px">CuSO₄ → <b style="color:#2f7de1">Cu²⁺</b>(파란색, +) + SO₄²⁻(색 없음, −)</div>':'<div class="kv2">🟣 과망가니즈산 칼륨은 물에 녹아 이온으로 나뉘어요</div><div class="kv2" style="margin-top:4px">KMnO₄ → <b style="color:#8e24aa">MnO₄⁻</b>(보라색, −) + K⁺(색 없음, +)</div>';
  $('#tip2').innerHTML=M2.pw?'👀 (+)이온은 <b>(−)극</b>으로, (−)이온은 <b>(+)극</b>으로 이동해요. 이온을 눌러 보세요!':'💡 이온을 눌러 이름과 전하를 확인하고, 전원을 켜서 이동 방향을 관찰해 보세요.'}
function ctl3(){
  $('#selh3').textContent='🧪 이동 방향을 예측할 이온을 고르세요';
  $('#sel3').className='ins5';$('#sel3').innerHTML=I3.map((o,i)=>`<button class="btn" data-i3="${i}"><b>${o.lab}</b><br><small>${o.sub}</small></button>`).join('');
  $('#ctl3').innerHTML='<div class="kv2">👉 전류를 흘리면 이 이온은 어느 쪽으로 이동할까요?</div><div class="big3" style="grid-template-columns:1fr 1fr;margin-top:6px"><button class="btn" data-pd="-1" style="background:#dbeafe;border-color:#1d4ed8">◀ (−)극으로<br>이동</button><button class="btn" data-pd="1" style="background:#fee2e2;border-color:#dc2626">(+)극으로 ▶<br>이동</button></div>';
  i3UI();info3()}
function i3UI(){$$('[data-i3]').forEach(b=>{const i=+b.dataset.i3;b.classList.toggle('on',i===P3.sel);b.classList.toggle('ok',!!P3.res[I3[i].k])})}
function info3(){
  $('#info3').innerHTML='<table class="cmpa"><tr><th>이온</th><th>전하</th><th>색</th><th>이동 방향</th></tr>'+I3.map((o,i)=>{const d=P3.res[o.k];return `<tr class="${i===P3.sel?'cur':''}"><th>${o.lab}</th><td>${d?(SP[o.k].q==='+'?'(+) 양이온':'(−) 음이온'):'?'}</td><td>${o.sub}</td><td>${d?(o.ans<0?'(−)극':'(+)극'):'?'}</td></tr>`}).join('')+'</table>';
  const all=I3.every(o=>P3.res[o.k]);const c=$('#cc3');c.style.display=all?'':'none';if(all)c.innerHTML='🎉 <b>결론</b><br>'+CONCL}
function tip3(){$('#tip3').innerHTML='💡 <b>힌트</b>: 양이온(+)은 (−)극이, 음이온(−)은 (+)극이 끌어당겨요. 색이 없는 이온도 마찬가지예요!'}
// ---- 이벤트 ----
document.addEventListener('click',e=>{let b;
  if(b=e.target.closest('[data-rg]')){const k=b.dataset.rg;sTap();
    if(k==='new'){E.paper={cu:0,mn:0};E.p=[];bgSpawn();E.done={cu:0,mn:0};E.prog={cu:0,mn:0};E.drops={};E.dp=null;E.invT=0;$('#cc1').style.display='none';fbx('#fb1','🧻 새 거름종이로 바꿨어요. 시약을 골라 다시 떨어뜨려 보세요.');$$('#sel1 [data-rg]').forEach(x=>x.classList.remove('on'));info1();return}
    if(E.dp&&E.t-E.dp.t0<1.7){return}
    if(E.paper[k]){toast('#toast1','이미 떨어뜨렸어요. "새 거름종이로 교체"를 누르면 다시 할 수 있어요.',2600);return}
    E.dp={k,t0:E.t,sp:0};b.classList.add('on');fbx('#fb1','💧 스포이트로 '+(k==='cu'?'황산 구리(Ⅱ) 수용액':'과망가니즈산 칼륨 수용액')+'을 거름종이 중앙에 떨어뜨리는 중…');return}
  if(b=e.target.closest('[data-vv]')){E.V=+b.dataset.vv;sTap();vvUI();toast('#toast1','전압 '+E.V+' V — 전압이 클수록 이온이 더 빨리 이동해요.',2400);return}
  if(e.target.closest('#pw1')){E.pw=!E.pw;E.pw?sOK():sTap();vvUI();if(E.pw&&!E.paper.cu&&!E.paper.mn)toast('#toast1','먼저 시약을 떨어뜨려 보세요. (전원만 켜도 보이지 않는 이온은 움직여요)',3000);return}
  if(e.target.closest('#inv1')){E.inv=!E.inv;sTap();vvUI();tip1();info1();return}
  if(b=e.target.closest('[data-r2]')){M2.r=b.dataset.r2;M2.pw=false;initMic();sTap();mUI();info2();fbx('#fb2','🔬 이온을 눌러 보고, 전원을 켜서 이동을 관찰하세요.');return}
  if(e.target.closest('#shuf2')){initMic();sTap();return}
  if(e.target.closest('#pw2')){M2.pw=!M2.pw;sTap();mUI();info2();return}
  if(e.target.closest('#bg2')){M2.bg=!M2.bg;sTap();mUI();return}
  if(b=e.target.closest('[data-i3]')){P3.sel=+b.dataset.i3;P3.x=.5;P3.tx=P3.res[I3[P3.sel].k]?(I3[P3.sel].ans<0?.08:.92):.5;sTap();i3UI();info3();fbx('#fb3','🤔 '+I3[P3.sel].lab+'는 어느 극으로 이동할까요?');return}
  if(b=e.target.closest('[data-pd]')){if(P3.sel<0){toast('#toast3','먼저 이온을 골라 주세요.',2200);return}const I=I3[P3.sel],d=+b.dataset.pd;
    if(d===I.ans){P3.res[I.k]=1;P3.tx=d<0?.08:.92;S.pred.add(I.k);sOK();fbx('#fb3','⭕ 정답! '+I.why,'ok');hud();i3UI();info3()}
    else{P3.shake=1;sNO();fbx('#fb3','❌ 다시 생각해 봐요. '+I.lab+'의 전하를 떠올려 보세요. 힌트: 반대 전하끼리 끌어당겨요.','no')}return}
});
function pickAt(cv,list,e,tf){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=1e9;for(const o of list){const d=Math.hypot(o[0]-x,o[1]-y);if(d<bd&&d<Math.max(18,(o[2]||9)+8)){bd=d;best=o}}return best}
$('#a1').addEventListener('pointerdown',e=>{const o=pickAt($('#a1'),E.ghosts||[],e);if(!o){return}const s=SP[o[2]];sTick();
  toast('#toast1',s.n+' ('+s.kn+'): '+(s.q==='+'?'(+)전하 → (−)극':'(−)전하 → (+)극')+' 으로 이동해요. 색이 없어서 눈에는 보이지 않아요!',3200)});
$('#a2').addEventListener('pointerdown',e=>{const o=pickAt($('#a2'),M2.hit||[],e);if(!o){return}const s=SP[o[3]];sTick();
  toast('#toast2',s.n+' ('+s.kn+'): '+(s.q==='+'?'(+)전하를 띤 양이온':'(−)전하를 띤 음이온')+' · '+s.cn+' → '+(s.q==='+'?'(−)극':'(+)극')+' 쪽으로 이동',3200)});
function hud(){const el=$('#pbar');el.style.display='flex';el.style.gap='6px';
  const it=[['① 이온 이동 실험',S.exp.size,3],['② 이온 확대',S.mic.size,2],['③ 예측',S.pred.size,5]];
  el.innerHTML=it.map(a=>{const ok=a[1]>=a[2];return `<div class="pseg${ok?' ok':''}">${a[0]} ${a[1]}/${a[2]}${ok?' ✔':''}</div>`}).join('')+`<div class="pseg${S.quiz>=QZ.length?' ok':''}">퀴즈 ${S.quiz<0?'–':S.quiz+'/'+QZ.length}</div>`}
const QZ=[
 {q:'황산 구리(Ⅱ) 수용액의 파란색 이온이 (−)극 쪽으로 이동했다. 이로부터 알 수 있는 사실은?',o:['파란색 구리 이온은 (+)전하를 띠고 있다','파란색 구리 이온은 (−)전하를 띠고 있다','구리 이온은 전하가 없다','(−)극이 파란색을 만들어 낸다'],a:0,e:'(+)전하를 띤 양이온은 (−)극으로 끌려가요. 구리 이온(Cu²⁺)이 (−)극으로 이동했으니 (+)전하를 띤다는 것을 알 수 있어요.'},
 {q:'보라색 과망가니즈산 이온(MnO₄⁻)은 전류를 흘리면 어느 쪽으로 이동할까?',o:['(+)극','(−)극','이동하지 않는다','양쪽으로 똑같이 퍼진다'],a:0,e:'MnO₄⁻는 (−)전하를 띤 음이온이라서 (+)극 쪽으로 이동해요.'},
 {q:'색이 없는 황산 이온(SO₄²⁻)과 칼륨 이온(K⁺)은 어떻게 될까?',o:['눈에 보이지 않지만 각각 (+)극, (−)극으로 이동한다','색이 없으니 움직이지 않는다','둘 다 (−)극으로 이동한다','둘 다 (+)극으로 이동한다'],a:0,e:'색이 없어 보이지 않을 뿐, SO₄²⁻(−)는 (+)극으로, K⁺(+)는 (−)극으로 이동해요.'},
 {q:'거름종이를 질산 칼륨 수용액으로 적시는 까닭으로 알맞은 것은?',o:['이온이 들어 있어 전류가 흐를 수 있게 하려고','거름종이를 파랗게 물들이려고','이온이 이동하지 못하게 막으려고','전원 장치의 전압을 높이려고'],a:0,e:'질산 칼륨 수용액에는 K⁺와 NO₃⁻ 이온이 있어서 거름종이에 전류가 흐를 수 있어요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{S.quiz=Math.max(S.quiz,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};

function resetAll(){S.exp=new Set();S.mic=new Set();S.pred=new Set();S.quiz=-1;
  E.pw=false;E.V=12;E.inv=false;E.paper={cu:0,mn:0};E.p=[];E.dp=null;E.t=0;E.invT=0;E.prog={cu:0,mn:0};E.done={cu:0,mn:0};E.drops={};bgSpawn();
  M2.r='cu';M2.pw=false;M2.bg=true;initMic();P3.sel=-1;P3.x=P3.tx=.5;P3.res={};
  $('#cc1').style.display='none';
  ctl1();ctl2();ctl3();tip1();info1();tip3();hud();
  fbx('#fb1','🧪 시약 버튼을 눌러 스포이트로 거름종이에 떨어뜨린 뒤, 전원을 켜서 색 이온의 이동을 관찰하세요.');
  fbx('#fb2','🔬 이온을 눌러 이름과 전하를 확인하고, 전원을 켜서 이동 방향을 관찰하세요.');
  fbx('#fb3','🤔 이온을 하나 고르고, 이동할 극을 예측해 보세요.');setMode(1)}
$('#btnReset').onclick=resetAll;
let lastT=0,infT=0;
function loop(){try{const now=performance.now()/1000,dt=Math.min(.05,now-(lastT||now));lastT=now;
    step(dt);
    if(E.dp){const q=E.t-E.dp.t0;if(q>=.55&&!E.dp.sp){E.dp.sp=1;spawnDrop(E.dp.k);sTick();fbx('#fb1','💧 '+(E.dp.k==='cu'?'황산 구리(Ⅱ) 수용액':'과망가니즈산 칼륨 수용액')+'을 떨어뜨렸어요. 이제 전원을 켜 보세요!');info1()}if(q>=1.7)E.dp=null}
    infT+=dt;if(infT>.3){infT=0;info1();vvUI()}
    if(mode===1)draw1($('#a1'),now);else if(mode===2)draw2($('#a2'),now,dt);else draw3($('#a3'),now,dt)}catch(e){console.error(e)}requestAnimationFrame(loop)}
resetAll();requestAnimationFrame(loop);
</script>
