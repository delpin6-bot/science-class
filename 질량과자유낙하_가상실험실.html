function MCSeq(qId,oId,pId,sayId,list,done,onShow){const st={n:0};function show(){if(st.n>=list.length){$('#'+qId).textContent='🎉 모두 맞혔어요!';$('#'+oId).innerHTML='';return}const q=list[st.n];onShow&&onShow(st.n);$('#'+qId).textContent=(st.n+1)+'. '+q[0];$('#'+oId).innerHTML='';const od=q[1].map((_,i)=>i);for(let k=od.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[od[k],od[j]]=[od[j],od[k]]}od.forEach(i=>{const t=q[1][i];const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(i===q[2]){sOK();st.n++;$('#'+pId).textContent=st.n+' / '+list.length;$('#'+sayId).className='say ok';$('#'+sayId).textContent='⭕ '+q[3];hud();if(st.n>=list.length){say(done||'완료 🎉',3000);confetti(['✨','🎉'])}show()}else{sNO();b.classList.add('wrong','shake');$('#'+sayId).className='say bad';$('#'+sayId).textContent='❌ 다시 생각해 보세요.'}};$('#'+oId).appendChild(b)})}
 st.reset=()=>{st.n=0;$('#'+pId).textContent='0 / '+list.length;show()};st.done=()=>st.n>=list.length;st.solve=()=>{let g=0;while(st.n<list.length&&g++<500){const q=list[st.n];const b=[...$('#'+oId).children].find(x=>x.textContent===q[1][q[2]]);if(!b)break;b.click()}};return st}
function sorterHTML(id,title,bins){return `<div class="card" id="${id}"><div class="ct">${title}</div><div class="items"></div><div class="bins" style="grid-template-columns:repeat(${bins.length},minmax(0,1fr));margin-top:10px">${bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${b}</h3><div class="bc"></div></div>`).join('')}</div>`}

function GPH(g,o){const{x,y,w,h,xm,ym}=o;g.fillStyle='#fff';g.fillRect(x,y,w,h);g.strokeStyle='#e2e8f0';g.lineWidth=1;const nx=o.nx||5,ny=o.ny||4;for(let i=1;i<=nx;i++){const X=x+w*i/nx;g.beginPath();g.moveTo(X,y);g.lineTo(X,y+h);g.stroke()}for(let i=1;i<=ny;i++){const Y=y+h-h*i/ny;g.beginPath();g.moveTo(x,Y);g.lineTo(x+w,Y);g.stroke()}
 g.strokeStyle='#0f172a';g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+h);g.lineTo(x+w,y+h);g.stroke();g.fillStyle='#334155';g.font='700 16px sans-serif';g.textAlign='center';for(let i=0;i<=nx;i++)g.fillText(+(xm*i/nx).toFixed(2),x+w*i/nx,y+h+18);g.textAlign='right';for(let i=1;i<=ny;i++)g.fillText(+(ym*i/ny).toFixed(2),x-6,y+h-h*i/ny+6);
 g.font='800 17px sans-serif';g.textAlign='right';g.fillText(o.xl||'',x+w,y+h+38);g.textAlign='left';g.fillText(o.yl||'',x+4,y-8);return{X:v=>x+w*v/xm,Y:v=>y+h-h*v/ym}}
function GLINE(g,G,pts,c,w){if(!pts.length)return;g.strokeStyle=c;g.lineWidth=w||4;g.beginPath();pts.forEach((p,i)=>{const X=G.X(p[0]),Y=G.Y(p[1]);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()}
function GDOT(g,G,pts,c,r){g.fillStyle=c;pts.forEach(p=>{g.beginPath();g.arc(G.X(p[0]),G.Y(p[1]),r||7,0,6.3);g.fill()})}

let air=0,t1=-1,f1=[0,0];
function ra(){document.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('on2',+b.dataset.a===air));$('#tg1').textContent=air?'진공 상태':'공기 있음'}
function yF(t){return air?4.9*t*t:Math.min(4.9*t*t,1.2*t)}// feather terminal speed 1.2 m/s in air
function yB(t){return 4.9*t*t}
function step1(dt){if(t1<0)return;t1+=dt*.6;const H=2;const fb=yB(t1)>=H,ff=yF(t1)>=H;if(fb&&ff||(!air&&fb)){const done=t1;t1=-2;$('#r1').textContent=air?'동시에 도착!':'🔩 쇠구슬이 먼저';if(!f1[air]){f1[air]=1;sOK()}$('#f1').textContent=(f1[0]?'✔':'☐')+' 공기 중 '+(f1[1]?'✔':'☐')+' 진공';$('#s1').className='say ok';$('#s1').textContent=air?'🫙 진공에서는 깃털과 쇠구슬이 동시에 떨어져요! 공기 저항이 없으면 질량과 관계없이 같은 빠르기로 떨어져요.':'💨 공기 중에서는 깃털이 공기 저항을 크게 받아 늦게 떨어져요.';if(f1[0]&&f1[1]&&!LAB._c1){LAB._c1=1;say('공기 저항의 비밀 발견 🎉',3000);confetti(['🪶','🔩'])}hud()}}
function draw1(){const{g}=view($('#c1'),LW,LH);g.fillStyle='#f8fafc';g.fillRect(0,0,LW,LH);const x0=300,y0=50,Hp=340;g.fillStyle=air?'rgba(186,230,253,.4)':'rgba(226,232,240,.5)';g.fillRect(x0,y0,200,Hp+20);g.strokeStyle='#334155';g.lineWidth=4;g.strokeRect(x0,y0,200,Hp+20);
 if(air){g.fillStyle='#0369a1';g.font='800 18px sans-serif';g.textAlign='center';g.fillText('진공 펌프로 공기 제거',400,y0-12)}else{g.fillStyle='#64748b';for(let i=0;i<40;i++){g.beginPath();g.arc(x0+10+(i*37)%180,y0+10+(i*53)%Hp,3,0,6.3);g.fill()}}
 const t=t1===-2?9:Math.max(0,t1);const H=2,s=Hp/H;const yb=Math.min(H,yB(t))*s,yf=Math.min(H,yF(t))*s;g.font='40px serif';g.textAlign='center';g.fillText('🔩',360,y0+20+yb);g.fillText('🪶',440,y0+20+yf);g.restore()}
const MS=[1,2,5];let m2=0,t2=-1,done2={};
function rms(){$('#ms2').innerHTML='';MS.forEach((m,i)=>{const b=document.createElement('button');b.className='btn'+(i===m2?' on2':'');b.textContent='⚫ '+m+' kg'+(done2[m]?' ✔':'');b.onclick=()=>{m2=i;t2=-1;rms();sTap()};$('#ms2').appendChild(b)})}
function step2(dt){if(t2<0)return;t2=Math.min(1,t2+dt*.6);if(t2>=1){const m=MS[m2];t2=-3;if(!done2[m]){done2[m]=1;const tr=document.createElement('tr');tr.innerHTML=`<td>${m} kg</td><td>${(9.8*m).toFixed(1)} N</td><td>1.0 s</td><td>9.8 m/s</td>`;$('#tb2 tbody').appendChild(tr);sTick()}rms();const n=Object.keys(done2).length;$('#s2').className='say';$('#s2').textContent='⏱ '+m+' kg: 무게 '+(9.8*m).toFixed(1)+' N, 낙하 시간 1.0 s';if(n===3&&!LAB._c2){LAB._c2=1;sOK();$('#s2').className='say ok';$('#s2').textContent='🎉 질량이 클수록 무게(중력)는 커지지만 관성도 커서, 속력 변화는 9.8 m/s²로 모두 같아요 → 동시에 떨어져요!';say('질량과 낙하 완료 🎉',3000);confetti(['⚖','⚫'])}hud()}}
function draw2(){const{g}=view($('#c2'),LW,LH);g.fillStyle='#f8fafc';g.fillRect(0,0,LW,LH);g.fillStyle='rgba(186,230,253,.35)';g.fillRect(120,30,560,380);g.strokeStyle='#334155';g.lineWidth=3;g.strokeRect(120,30,560,380);
 const t=t2===-3?1:Math.max(0,t2),y=60+4.9*t*t/4.9*320;MS.forEach((m,i)=>{const x=230+i*170,r=12+m*3;const show=i===m2||done2[m];g.globalAlpha=show?1:.3;g.fillStyle='#334155';g.beginPath();g.arc(x,i===m2?y:(done2[m]?380:60),r,0,6.3);g.fill();g.globalAlpha=1;g.fillStyle='#0f172a';g.font='800 18px sans-serif';g.textAlign='center';g.fillText(m+' kg',x,30+0-6+420)});g.restore()}
let MC3;
function draw3(){const{g}=view($('#c3'),LW,LH);g.fillStyle='#0f172a';g.fillRect(0,0,LW,LH);g.fillStyle='#94a3b8';g.fillRect(0,360,LW,80);g.font='70px serif';g.textAlign='center';g.fillText('🧑‍🚀',300,340);g.font='40px serif';const k=(performance.now()/1000)%3/3;const y=180+Math.min(1,k*1.4)**2*160;g.fillText('🔨',250,y);g.fillText('🪶',350,y);g.fillStyle='#fde68a';g.font='800 22px sans-serif';g.fillText('달(공기 없음): 망치와 깃털이 동시에 떨어져요',400,60);g.font='60px serif';g.fillText('🌍',700,120);g.restore()}
const LAB={key:'massfall',
 quiz:[
 {q:'공기 중에서 깃털이 늦게 떨어지는 까닭은?',o:['공기 저항을 크게 받아서','질량이 작아서 중력이 없어서','지구가 당기지 않아서'],a:0,e:'공기 저항 때문이에요.'},
 {q:'진공에서 깃털과 쇠구슬을 떨어뜨리면?',o:['동시에 떨어진다','쇠구슬이 먼저','깃털이 먼저'],a:0,e:'공기 저항이 없어요.'},
 {q:'질량이 2배인 물체의 무게는?',o:['2배','같다','절반'],a:0,e:'무게 = 9.8 × 질량'},
 {q:'질량이 달라도 자유 낙하 속력 변화가 같은 까닭은?',o:['질량이 큰 만큼 중력도 커서','중력이 같아서','공기 때문'],a:0,e:'관성과 중력이 함께 커져요.'},
 {q:'자유 낙하하는 물체의 속력 변화량은?',o:['질량과 관계없이 1초에 9.8 m/s','질량에 비례','질량에 반비례'],a:0,e:'모두 같아요.'},
 {q:'달에서 망치와 깃털을 떨어뜨리면?',o:['동시에 떨어진다','망치가 먼저','깃털은 떠 있다'],a:0,e:'달에는 공기가 없어요.'},
 {q:'질량 5 kg인 물체의 무게는?',o:['49 N','5 N','98 N'],a:0,e:'9.8 × 5'}],
 segs:()=>[['공기 중 vs 진공',!!LAB._c1],['질량이 다른 구슬',!!LAB._c2],['달 실험 정리',MC3&&MC3.done()]],
 reset(){LAB._c1=0;LAB._c2=0;f1=[0,0];t1=-1;air=0;ra();$('#r1').textContent='-';$('#f1').textContent='☐ 공기 중 ☐ 진공';done2={};m2=0;t2=-1;rms();$('#tb2 tbody').innerHTML='';MC3.reset();['#s1','#s2','#s3'].forEach(s=>$(s).className='say')},
 init(){ra();rms();document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{air=+b.dataset.a;t1=-1;ra();sTap()});$('#go1').onclick=()=>{t1=0;sTap()};$('#go2').onclick=()=>{t2=0;sTap()};
  MC3=MCSeq('q3q','q3o','p3','s3',[['달에서 망치와 깃털이 동시에 떨어진 까닭은?',['공기 저항이 없어서','중력이 없어서','망치가 가벼워서'],0,'공기가 없어요.'],['무거운 돌과 가벼운 돌을 끈으로 묶어 떨어뜨리는 갈릴레이의 생각 실험이 알려 주는 것은?',['무게에 따라 낙하 빠르기가 다르다는 주장은 모순','무거울수록 빠르다','가벼울수록 빠르다'],0,'질량과 관계없이 같아요.'],['진공에서 1 kg, 5 kg 쇠구슬의 1초 후 속력은?',['둘 다 9.8 m/s','5 kg가 5배 빠름','1 kg가 더 빠름'],0,'같아요.'],['공기 중에서 낙하산이 천천히 내려오는 까닭은?',['공기 저항이 크기 때문','중력이 없어서','질량이 0이라서'],0,'면적이 넓어요.']],'달 실험 정리 완료 🎉')},
