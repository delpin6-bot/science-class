let M1=1,V1=1,ph1=0,cx=0,bx=0,rec=[];const FR1=1;// block friction 1 N
function Ek(m,v){return .5*m*v*v}
function step1(dt){if(ph1===1){cx+=dt*V1*1.2;if(cx>=2.5){cx=2.5;ph1=2}}else if(ph1===2){const D=Ek(M1,V1)/FR1*.3;bx=Math.min(D,bx+dt*1.2);if(bx>=D){ph1=3;if(!rec.some(r=>r.m===M1&&r.v===V1)){rec.push({m:M1,v:V1,e:Ek(M1,V1),d:D});const tr=document.createElement('tr');tr.innerHTML=`<td>${M1} kg</td><td>${V1} m/s</td><td>${Ek(M1,V1)} J</td><td>${(D*100).toFixed(0)} cm</td>`;$('#tb1 tbody').appendChild(tr);sTick()}
 const ms=new Set(rec.map(r=>r.m)),vs=new Set(rec.map(r=>r.v));if(rec.length>=4&&ms.size>=2&&vs.size>=2&&!LAB._c1){LAB._c1=1;sOK();$('#s1').className='say ok';$('#s1').textContent='🎉 질량이 2배 → 이동 거리 2배, 속력이 2배 → 이동 거리 4배! 운동 에너지 = ½ × 질량 × 속력²';say('운동 에너지 법칙 발견 🎉',3000);confetti(['🛒','⚡'])}else{$('#s1').className='say';$('#s1').textContent='📏 '+M1+' kg, '+V1+' m/s → 도막 '+(D*100).toFixed(0)+' cm. 질량과 속력을 각각 바꿔 보세요.'}hud()}}}
function draw1(){const{g}=view($('#c1'),LW,LH);g.fillStyle='#f8fafc';g.fillRect(0,0,LW,LH);g.fillStyle='#cbd5e1';g.fillRect(0,250,LW,12);const sc=110,X=20+Math.min(cx,3)*sc-((ph1>=2)?0:0);const w=50+M1*15;
 g.fillStyle='#f97316';g.fillRect(X+70-w,200,w,50);g.fillStyle='#1e293b';g.beginPath();g.arc(X+70-w+12,252,8,0,6.3);g.arc(X+58,252,8,0,6.3);g.fill();g.fillStyle='#fff';g.font='800 16px sans-serif';g.textAlign='center';g.fillText(M1+'kg',X+70-w/2,231);
 const SB=80,B0=20+2.5*sc+70,BX=B0+bx*SB;g.fillStyle='#a16207';g.fillRect(BX,215,60,35);g.fillStyle='#334155';g.font='700 14px sans-serif';for(let i=0;i<=8;i++){g.fillRect(B0+i*SB/2-1,262,2,i%2?6:12);if(i%2===0)g.fillText(i*50+' cm',B0+i*SB/2,290)}if(ph1>=1&&ph1<2)arrow(g,X+80,190,X+80+V1*30,190,'#2563eb',6,'');const e=ph1<=1?(ph1===1?Ek(M1,V1):0):Math.max(0,Ek(M1,V1)-FR1*bx/.3);g.fillStyle='#e2e8f0';g.fillRect(700,30,60,160);g.fillStyle='#2563eb';const hh=e/13.5*160;g.fillRect(700,190-hh,60,hh);g.fillStyle='#0f172a';g.font='800 15px sans-serif';g.fillText('운동 에너지',730,210);g.fillText(e.toFixed(1)+' J',730,22);g.restore()}
let gr=0,MC2,MC3;
function rgr(){document.querySelectorAll('[data-gr]').forEach(b=>b.classList.toggle('on2',+b.dataset.gr===gr));$('#tg2').textContent=['운동 에너지 – 질량 (속력 2 m/s)','운동 에너지 – 속력 (질량 2 kg)','운동 에너지 – 속력² (질량 2 kg)'][gr]}
function draw2(){const{g}=view($('#c2'),LW,LH);g.fillStyle='#f8fafc';g.fillRect(0,0,LW,LH);let G,pts=[];if(gr===0){G=GPH(g,{x:100,y:50,w:600,h:300,xm:4,ym:8,xl:'질량(kg)',yl:'운동 에너지(J)',nx:4,ny:4});for(let m=0;m<=4;m++)pts.push([m,Ek(m,2)])}else if(gr===1){G=GPH(g,{x:100,y:50,w:600,h:300,xm:4,ym:16,xl:'속력(m/s)',yl:'운동 에너지(J)',nx:4,ny:4});for(let v=0;v<=4;v+=.1)pts.push([v,Ek(2,v)])}else{G=GPH(g,{x:100,y:50,w:600,h:300,xm:16,ym:16,xl:'속력²(m²/s²)',yl:'운동 에너지(J)',nx:4,ny:4});for(let q=0;q<=16;q+=4)pts.push([q,q])}
 GLINE(g,G,pts,'#2563eb',5);g.fillStyle='#16a34a';g.font='900 24px sans-serif';g.textAlign='left';g.fillText(['정비례 (직선)','포물선 (속력²에 비례)','정비례 (직선)'][gr],130,90);g.restore()}
let V3=30,t3=-1;
function draw3(dt){const{g}=view($('#c3'),LW,LH);g.fillStyle='#e0f2fe';g.fillRect(0,0,LW,LH);g.fillStyle='#475569';g.fillRect(0,250,LW,100);g.fillStyle='#fff';for(let i=0;i<10;i++)g.fillRect(i*90,296,50,6);const D=(V3/30)**2*6;// m
 const sc=11,x0=120;if(t3>=0)t3=Math.min(1,t3+dt*.7);const p=t3<0?0:1-(1-t3)**2;g.fillStyle='#dc2626';g.fillRect(x0-2,200,4,60);g.font='700 16px sans-serif';g.fillStyle='#0f172a';g.textAlign='center';g.fillText('브레이크',x0,190);
 g.font='54px serif';g.save();g.translate(x0+p*D*sc,262);g.scale(-1,1);g.fillText('🚗',0,0);g.restore();if(t3>=1){g.strokeStyle='#16a34a';g.lineWidth=3;g.beginPath();g.moveTo(x0,370);g.lineTo(x0+D*sc,370);g.stroke();g.fillStyle='#16a34a';g.font='900 22px sans-serif';g.fillText('제동 거리 약 '+D.toFixed(0)+' m',x0+D*sc/2,400)}
 [30,60,90].forEach((v,i)=>{const d=(v/30)**2*6;g.fillStyle=v===V3?'#2563eb':'#94a3b8';g.fillRect(x0,40+i*40,d*8,26);g.fillStyle='#0f172a';g.textAlign='left';g.font='800 16px sans-serif';g.fillText(v+' km/h → '+d+' m',x0+d*8+8,60+i*40)});g.restore()}
const LAB={key:'kinetic',
 quiz:[
 {q:'운동 에너지란?',o:['운동하는 물체가 가진 에너지','높은 곳의 물체가 가진 에너지','빛 에너지'],a:0,e:'움직이는 물체'},
 {q:'운동 에너지 식은?',o:['½ × 질량 × 속력²','9.8 × 질량 × 높이','질량 × 속력'],a:0,e:'Ek = ½mv²'},
 {q:'속력이 2배가 되면 운동 에너지는?',o:['4배','2배','같다'],a:0,e:'속력의 제곱'},
 {q:'질량이 3배가 되면 운동 에너지는?',o:['3배','9배','같다'],a:0,e:'질량에 비례'},
 {q:'2 kg 물체가 3 m/s로 움직일 때 운동 에너지는?',o:['9 J','6 J','18 J'],a:0,e:'½ × 2 × 9'},
 {q:'자동차 속력이 2배가 되면 제동 거리는?',o:['약 4배','2배','같다'],a:0,e:'운동 에너지 4배'},
 {q:'운동 에너지-속력 그래프의 모양은?',o:['포물선','수평선','원점을 지나는 직선'],a:0,e:'속력²에 비례'}],
 segs:()=>[['수레 충돌 실험',!!LAB._c1],['운동 에너지 그래프',MC2&&MC2.done()],['제동 거리',MC3&&MC3.done()]],
 reset(){LAB._c1=0;rec=[];ph1=0;cx=0;bx=0;$('#tb1 tbody').innerHTML='';gr=0;rgr();t3=-1;MC2.reset();MC3.reset();['#s1','#s2','#s3'].forEach(s=>$(s).className='say')},
 init(){sl('r1m',v=>v+' kg',v=>{M1=v;ph1=0;cx=0;bx=0});sl('r1v',v=>v+' m/s',v=>{V1=v;ph1=0;cx=0;bx=0;$('#tg1').textContent='운동 에너지 = ½ × '+M1+' × '+V1+'²'});$('#go1').onclick=()=>{ph1=1;cx=0;bx=0;$('#tg1').textContent='운동 에너지 = ½ × '+M1+' × '+V1+'² = '+Ek(M1,V1)+' J';sTap()};
  document.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{gr=+b.dataset.gr;rgr();sTap()});rgr();sl('r3',v=>v+' km/h',v=>{V3=v;t3=-1;$('#tg3').textContent='속력 '+v+' km/h'});$('#go3').onclick=()=>{t3=0;sTap()};
  MC2=MCSeq('q2q','q2o','p2','s2',[['운동 에너지–질량 그래프의 모양은?',['원점을 지나는 직선(비례)','포물선','수평선'],0,'질량에 비례'],['운동 에너지–속력 그래프가 포물선인 까닭은?',['운동 에너지가 속력의 제곱에 비례해서','속력에 반비례해서','질량 때문'],0,'v²'],['질량 2 kg, 속력 4 m/s일 때 운동 에너지는?',['16 J','8 J','32 J'],0,'½ × 2 × 16']],'그래프 해석 완료 🎉');
  MC3=MCSeq('q3q','q3o','p3','s3',[['30 km/h에서 제동 거리가 6 m라면 60 km/h에서는?',['약 24 m','12 m','6 m'],0,'속력 2배 → 4배'],['어린이 보호 구역에서 속도를 줄여야 하는 까닭은?',['운동 에너지와 제동 거리가 크게 줄어서','연료 절약만','소음 때문'],0,'안전'],['같은 속력이라면 제동 거리가 더 긴 것은?',['짐을 가득 실은 트럭','빈 승용차','자전거'],0,'질량이 커서 운동 에너지가 커요']],'제동 거리 완료 🎉')},
 frame(dt){step1(dt);if(mode===1)draw1();else if(mode===2)draw2();else if(mode===3)draw3(dt)},
 auto(){[[1,1],[2,1],[1,2],[3,3]].forEach(a=>{M1=a[0];V1=a[1];ph1=1;cx=0;bx=0;for(let i=0;i<200&&ph1<3;i++)step1(.1)});MC2.solve();MC3.solve();hud();return{c1:LAB._c1,n:rec.length}}};

boot();
</script></body></html>
