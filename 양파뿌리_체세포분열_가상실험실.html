<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>양파 뿌리 체세포 분열 관찰 가상실험실</title>
<style>
:root{--bg:#0f172a;--pn:#16213a;--pn2:#1e2c4d;--ln:#34456f;--tx:#e8eefc;--mu:#a5b4d6;--ac:#f472b6;--ac2:#38bdf8;--ok:#34d399;--no:#f87171;--wa:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(14px,1.3vw,19px);line-height:1.5}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#0a1226;border-bottom:1px solid var(--ln);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:900;font-size:clamp(14px,1.6vw,20px);white-space:nowrap}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap;min-width:0}
.tab{min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--ln);background:var(--pn2);color:var(--mu);font-weight:800;font-size:.92em}
.tab.on{background:#fff;color:#0f172a;border-color:#fff}.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .ck{color:var(--ok)}
.hb{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:2px solid #334155;background:#1e293b;color:#e2e8f0;font-weight:800;font-size:.9em;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
main{padding:10px clamp(8px,1.6vw,18px) 28px;max-width:1400px;margin:0 auto}
.stg{display:none}.stg.on{display:block}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.card h2{margin:0 0 6px;font-size:1.1em}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
@media(max-width:760px){.tabs{order:5;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto}.tab{flex:0 0 auto;white-space:nowrap;padding:0 10px}.brand{flex:1 0 100%;font-size:.95em}header{position:static}}
.btn{background:var(--pn2);color:var(--tx);border:2px solid var(--ln);border-radius:12px;padding:8px 14px;font-weight:800;font-size:.95em;min-height:44px}
.btn.pri{background:linear-gradient(180deg,#f472b6,#db2777);border-color:#9d174d;color:#fff}
.btn.ok{background:linear-gradient(180deg,#34d399,#059669);border-color:#047857;color:#052e1b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mu{color:var(--mu)}.small{font-size:.85em}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:10px;margin-bottom:5px;background:var(--pn2);border:1px solid var(--ln);font-size:.92em}
.steps li.cur{border-color:var(--ac);background:#3a1a35}.steps li.done{opacity:.7}
.steps .n{min-width:1.7em;height:1.7em;border-radius:50%;background:#334155;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.85em}
.steps li.done .n{background:var(--ok);color:#052e1b}.steps li.cur .n{background:var(--ac);color:#fff}
#bench{position:relative;min-height:clamp(300px,50vh,520px);background:linear-gradient(#1b2a4d,#101a33);border-radius:14px;border:1px solid var(--ln);overflow:hidden;padding:10px;touch-action:none}
.bt{position:absolute;left:12px;top:8px;font-weight:900;color:#fbcfe8}
.dr{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:.85em;font-weight:800;text-align:center}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.1)}
.dz{border:3px dashed #64748b;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:90px;color:var(--mu);font-weight:800;transition:.15s;position:relative}
.dz.over{border-color:var(--ac);background:#f472b622}
.bk{width:100px;height:130px;border:4px solid #cbd5e1;border-top:0;border-radius:0 0 18px 18px;position:relative;background:#ffffff10;overflow:hidden}
.bk .lq{position:absolute;left:0;right:0;bottom:0;transition:height .5s,background .5s}
.bk.wide{width:130px}
.lbl{font-weight:900;text-align:center;margin-top:4px;font-size:.88em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:center}
.pg{height:12px;background:#0a1226;border-radius:8px;overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f472b6,#fbbf24);transition:width .2s}
.note{margin-top:8px;padding:8px 10px;background:#0b1630;border-left:4px solid var(--ac2);border-radius:8px;font-size:.92em}
.note.w{border-color:var(--wa)}.note.r{border-color:var(--no)}.note.g{border-color:var(--ok)}
#modal{position:fixed;inset:0;z-index:100;background:#020617cc;display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}#modal .m{background:#1b2540;border:3px solid var(--wa);border-radius:18px;padding:16px 18px;max-width:520px;width:100%}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);z-index:120;background:#fff8e1;color:#1f2933;border:3px solid #f08c00;border-radius:14px;padding:10px 16px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* microscope */
.mic{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
@media(max-width:900px){.mic{grid-template-columns:1fr}}
#mcv{width:100%;aspect-ratio:16/9;display:block;border-radius:14px;background:#000;touch-action:none;cursor:grab}
.mag{display:flex;gap:6px;flex-wrap:wrap}.mag .btn{flex:1;min-width:64px}.mag .btn.on{border-color:var(--ac);background:#3a1a35}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;margin-top:6px}
.th{position:relative;border:2px solid var(--ln);border-radius:10px;overflow:hidden;background:#000}
.th img,.th canvas{width:100%;display:block}.th .x{position:absolute;right:2px;top:2px;background:#000a;color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-weight:900}
.th .no{position:absolute;left:3px;top:2px;font-size:.7em;font-weight:900;background:#000a;border-radius:6px;padding:0 5px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:700px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{display:flex;flex-direction:column;gap:4px}.slot .dz{aspect-ratio:1;padding:3px;min-height:0}.slot .dz img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.slot .nm{text-align:center;font-weight:900;font-size:.92em}
.slot.good .dz{border-color:var(--ok);border-style:solid}.slot.bad .dz{border-color:var(--no);border-style:solid}
.mk{text-align:center;font-size:.85em;min-height:1.4em}
textarea,input[type=text]{width:100%;background:#0b1630;color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:8px;font-family:inherit;font-size:1em}
.q{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.q b.n{color:#fbcfe8}.q label{display:block;padding:5px 8px;border-radius:8px;margin-top:3px;cursor:pointer;border:2px solid transparent}
.q label:hover{background:#ffffff0f}.q input[type=radio]{margin-right:6px}
.q.ok{border-color:var(--ok)}.q.no{border-color:var(--no)}.q .ex{margin-top:6px;font-size:.9em;color:#bbf7d0}
.q select{background:#0b1630;color:var(--tx);border:2px solid var(--ln);border-radius:8px;padding:4px;font-family:inherit}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid #ffffff1c;text-align:left}td:last-child,th:last-child{text-align:right;font-weight:800}
.big{font-size:clamp(34px,6vw,60px);font-weight:900;line-height:1}
</style></head><body>
<header><span class="brand">🧅 양파 뿌리 체세포 분열 관찰 가상실험</span>
<div class="tabs" id="tabs"></div>
<a class="hb" href="./가상실험실_서랍.html">🔬 서랍</a><a class="hb" href="./index.html">🏠 처음</a><button class="hb" id="btnFs">⛶ 전체화면</button></header>
<main>
<section class="stg on" id="s1"></section>
<section class="stg" id="s2"></section>
<section class="stg" id="s3"></section>
<section class="stg" id="s4"></section>
<section class="stg" id="s5"></section>
</main>
<div id="modal"><div class="m" id="mm"></div></div><div id="toast"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ST=['inter','pro','meta','ana','telo'],SN={inter:'분열하기 전',pro:'전기',meta:'중기',ana:'후기',telo:'말기'};
const S={tab:1,prep:{step:0,done:false},caps:[],slots:{},rep:{a1:'',a2:'',a3:'',graded:false},quiz:{done:false,ans:{},sc:null,tries:0},name:''};
function save(){try{localStorage.setItem('onionMitosis',JSON.stringify({name:S.name,prep:S.prep.done,rep:S.rep,q:S.quiz.sc}))}catch(e){}}
let tt=0;function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||2400)}
function modal(h){$('#mm').innerHTML=h;$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}
$('#btnFs').onclick=()=>{const e=document.documentElement;document.fullscreenElement?document.exitFullscreen():e.requestFullscreen&&e.requestFullscreen()};
/* ---------- 탭 ---------- */
function tabs(){
 const T=[[1,'① 표본 제작',S.prep.done],[2,'② 현미경 관찰',S.caps.length>0],[3,'③ 보고서',repScore().pts>=20],[4,'④ 응용문제',S.quiz.sc!==null],[5,'⑤ 결과',false]];
 $('#tabs').innerHTML='';
 T.forEach(([n,l,ck])=>{const b=document.createElement('button');b.className='tab'+(S.tab===n?' on':'');b.innerHTML=l+(ck?' <span class="ck">✔</span>':'');b.disabled=(n>1&&n<5&&!S.prep.done);b.onclick=()=>go(n);$('#tabs').appendChild(b)});
}
function go(n){S.tab=n;$$('.stg').forEach((e,i)=>e.classList.toggle('on',i+1===n));tabs();if(n===1)renderPrep();if(n===2)micShow();if(n===3)renderRep();if(n===4)renderQuiz();if(n===5)renderRes();window.scrollTo(0,0)}
/* ---------- 드래그 ---------- */
function dragify(el,onDrop,onStart){
 el.style.touchAction='none';
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();if(onStart&&onStart()===false)return;
  const g=el.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);
  const mv=(x,y)=>{g.style.left=x+'px';g.style.top=y+'px';const z=dzAt(x,y);$$('.dz.over').forEach(d=>d!==z&&d.classList.remove('over'));if(z)z.classList.add('over')};
  mv(e.clientX,e.clientY);el.style.opacity='.35';
  const m=ev=>mv(ev.clientX,ev.clientY);
  const u=ev=>{window.removeEventListener('pointermove',m);window.removeEventListener('pointerup',u);window.removeEventListener('pointercancel',u);g.remove();el.style.opacity='';const z=dzAt(ev.clientX,ev.clientY);$$('.dz.over').forEach(d=>d.classList.remove('over'));onDrop(z,ev)};
  window.addEventListener('pointermove',m);window.addEventListener('pointerup',u);window.addEventListener('pointercancel',u);
 });
}
function dzAt(x,y){return document.elementsFromPoint(x,y).find(n=>n.classList&&n.classList.contains('dz'))||null}
/* ---------- 도구 그림 ---------- */
const rootSVG=(c='#f5f0dc',tip='#e8dcae')=>`<svg width="46" height="64" viewBox="0 0 46 64"><path d="M14 4h18v40q0 12-9 16q-9-4-9-16z" fill="${c}" stroke="#b8a77a" stroke-width="2"/><path d="M14 44q0 12 9 16q9-4 9-16z" fill="${tip}" stroke="#b8a77a" stroke-width="1"/><path d="M18 16v20M23 12v28M28 16v20" stroke="#cbbf92" stroke-width="1.5"/></svg>`;
function beaker(id,label,color,lv,wide){return `<div><div class="bk dz ${wide?'wide':''}" id="${id}" style="min-height:130px;border-style:solid"><div class="lq" style="height:${lv}%;background:${color}"></div></div><div class="lbl">${label}</div></div>`}
/* ============ 1단계: 표본 제작 ============ */
const PS=[
 ['고정','에탄올:아세트산 = 3:1 용액에 뿌리 조각(1 cm)을 담근다 → 세포 분열을 멈추고 상태를 그대로 보존'],
 ['해리','50~60 °C 묽은 염산에 8분 → 세포벽 사이를 연하게 하여 세포가 잘 떨어지게 함'],
 ['세척','증류수로 씻어 염산을 제거한다'],
 ['염색','뿌리 끝에 아세트올세인 1~2방울 → 염색체(핵)가 붉게 염색'],
 ['분리','해부침으로 뿌리 끝을 잘게 찢어 세포를 흩뜨린다'],
 ['압착','덮개유리 → 연필 두드리기 → 거름종이 + 엄지로 지그시 누르기']
];
const P={eth:0,ace:0,sub:0,temp:40,tmin:5,tleft:0,hcl:false,run:false,drops:0,dropper:false,shred:0,cover:false,taps:0,paper:false,hold:0,safe:false,fixing:false};
function renderPrep(){
 const s=S.prep.step,el=$('#s1');
 el.innerHTML=`<div class="grid2"><div class="card"><h2>🧪 실험대 <span class="mu small">— 도구를 끌어다 놓거나(드래그) 눌러서 조작하세요</span></h2><div id="bench"></div><div id="pnote"></div></div>
 <div class="card"><h2>📋 표본 제작 순서</h2><ul class="steps">${PS.map((p,i)=>`<li class="${i<s?'done':i===s?'cur':''}"><span class="n">${i<s?'✔':i+1}</span><span><b>${p[0]}</b><br><span class="mu small">${p[1]}</span></span></li>`).join('')}</ul>
 ${S.prep.done?`<div class="note g">✅ 프레파라트 완성! 현미경으로 이동하세요.</div><button class="btn pri" style="width:100%;margin-top:8px" id="toMic">🔬 현미경 관찰하러 가기 ▶</button>`:''}
 <button class="btn" style="width:100%;margin-top:8px" id="rePrep">↺ 처음부터 다시 제작</button></div></div>`;
 $('#rePrep').onclick=()=>{Object.assign(P,{eth:0,ace:0,sub:0,temp:40,tmin:5,tleft:0,hcl:false,run:false,drops:0,dropper:false,shred:0,cover:false,taps:0,paper:false,hold:0,fixing:false});S.prep={step:0,done:false};tabs();renderPrep()};
 if($('#toMic'))$('#toMic').onclick=()=>go(2);
 if(S.prep.done){$('#bench').innerHTML=`<div class="bt">✅ 완성된 프레파라트</div><div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:300px">${slideSVG(1,true)}</div>`;return}
 [step0,step1,step2,step3,step4,step5][s]();
}
function pn(m,c){$('#pnote').innerHTML=m?`<div class="note ${c||''}">${m}</div>`:''}
function adv(){S.prep.step++;if(S.prep.step>=6){S.prep.done=true;save()}tabs();renderPrep()}
function step0(){
 const b=$('#bench');
 b.innerHTML=`<div class="bt">① 고정</div><div class="row" style="padding-top:34px">
 <div style="text-align:center"><div class="dr" id="bEth" style="background:#164e63;border:2px solid #22d3ee;border-radius:12px;padding:8px 14px;color:#cffafe">🧴 에탄올<br><span class="small">누르면 1 부피</span></div></div>
 <div style="text-align:center"><div class="dr" id="bAce" style="background:#713f12;border:2px solid #fbbf24;border-radius:12px;padding:8px 14px;color:#fef3c7">🧴 아세트산<br><span class="small">누르면 1 부피</span></div></div>
 ${beaker('bkFix','고정액 (에탄올 <span id="e1">0</span> : 아세트산 <span id="a1">0</span>)','#67e8f9aa',P.eth*18+P.ace*6)}
 <div class="dr" id="rt">${rootSVG()}<span>양파 뿌리 조각 (1 cm)</span></div></div>
 <div style="text-align:center;margin-top:10px"><button class="btn" id="bClr">🗑 용액 비우기</button></div>`;
 const upd=()=>{$('#e1').textContent=P.eth;$('#a1').textContent=P.ace;const lq=$('#bkFix .lq');lq.style.height=Math.min(100,(P.eth+P.ace)*20)+'%';lq.style.background=P.ace?'#fde68acc':'#67e8f9aa'};
 $('#bEth').onclick=()=>{if(P.eth<3){P.eth++;upd()}};$('#bAce').onclick=()=>{if(P.ace<1){P.ace++;upd()}};
 $('#bClr').onclick=()=>{P.eth=P.ace=0;upd()};
 pn('에탄올 <b>3</b>, 아세트산 <b>1</b>의 비율로 섞은 뒤, 뿌리 조각을 비커에 끌어다 놓으세요.');
 dragify($('#rt'),z=>{
  if(!z||z.id!=='bkFix')return;
  if(P.eth!==3||P.ace!==1){pn('⚠️ 고정액 비율이 맞지 않아요! 에탄올 3 : 아세트산 1이어야 해요.','r');return}
  $('#rt').style.visibility='hidden';
  pn('🧪 뿌리 조각을 고정액에 담갔어요… 세포 분열이 멈추고 세포가 살아있던 모습 그대로 보존되고 있어요.','g');
  const lq=$('#bkFix .lq');lq.style.background='#fde68a';
  setTimeout(()=>{pn('✅ 고정 완료! (고정액: 세포의 활동을 멈추고 구조를 그대로 유지)','g');setTimeout(adv,1400)},2200);
 });
}
function step1(){
 const b=$('#bench');
 b.innerHTML=`<div class="bt">② 해리</div><div class="row" style="padding-top:34px">
  <div style="text-align:center">${beaker('bkHcl','묽은 염산(HCl)','#fda4af99',P.hcl?60:60)}<div style="font-size:1.4em">🔥 가열 장치</div>
   <div class="mu small" style="margin-top:4px">온도 <b id="tv">${P.temp}</b> °C <span id="tw"></span></div><input type="range" min="20" max="80" value="${P.temp}" id="tr" style="width:150px"></div>
  <div class="dr" id="rt">${rootSVG()}<span>뿌리 조각</span></div>
  <div style="text-align:center;background:#0b1630;border:2px solid var(--ln);border-radius:14px;padding:10px 14px"><div class="lbl">⏱ 타이머</div><div style="font-size:1.8em;font-weight:900" id="tm">${P.tmin}:00</div>
   <div><button class="btn" id="tm1">−1분</button> <button class="btn" id="tp1">+1분</button></div><div style="margin-top:6px"><button class="btn pri" id="tgo">▶ 시작</button></div></div></div>
  <div class="pg"><i id="pgi"></i></div>`;
 const tw=()=>{const t=P.temp;$('#tv').textContent=t;$('#tw').textContent=t>=50&&t<=60?'✔ 알맞은 온도':t<50?'(너무 낮음)':'(너무 높음)';$('#tw').style.color=t>=50&&t<=60?'#34d399':'#fbbf24'};tw();
 $('#tr').oninput=e=>{P.temp=+e.target.value;tw()};
 $('#tm1').onclick=()=>{if(P.tmin>1){P.tmin--;$('#tm').textContent=P.tmin+':00'}};$('#tp1').onclick=()=>{if(P.tmin<15){P.tmin++;$('#tm').textContent=P.tmin+':00'}};
 pn('① 뿌리 조각을 염산 비커에 담그고 ② 온도를 <b>50~60 °C</b>로 맞춘 뒤 ③ 타이머를 <b>8분</b>으로 설정하고 ▶ 시작하세요.');
 dragify($('#rt'),z=>{
  if(!z||z.id!=='bkHcl')return;

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const WW=3200,WH=1800,CW=90,CH=80,COLS=36,ROWS=22;
const world=(()=>{const r=rng(20261021),cs=[];
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const u=r();let st='inter';if(u>.76)st=u<.84?'pro':u<.90?'meta':u<.94?'ana':'telo';
  cs.push({x:60+i*CW+(r()-.5)*10,y:50+j*CH*.92+(r()-.5)*8,st,ang:(r()-.5)*1.2+(r()<.5?0:Math.PI/2),seed:Math.floor(r()*1e9)})}
 ST.forEach(s=>{if(s==='inter')return;let n=cs.filter(c=>c.st===s).length,tries=0;while(n<7&&tries++<200){const c=cs[Math.floor(r()*cs.length)];if(c.st==='inter'){c.st=s;n++}}});
 return cs})();
const M={on:false,mag:40,vx:WW/2,vy:WH/2,f:20,best:55,op:false,cid:1};

function drawCell(g,c,sx,sy,k){
 const w=CW*.86*k,h=CH*.86*k;if(sx<-w||sy<-h||sx>960+w||sy>540+h)return;
 g.save();g.translate(sx,sy);
 g.fillStyle='rgba(252,222,232,.78)';g.strokeStyle='rgba(205,120,150,.8)';g.lineWidth=Math.max(1,2.2*k);
 const rr=Math.min(w,h)*.12;g.beginPath();g.roundRect(-w/2,-h/2,w,h,rr);g.fill();g.stroke();
 const R=rng(c.seed),n=Math.min(w,h);
 const dark='#7a1747',mid='#b83274';
 if(c.st==='inter'){g.fillStyle='rgba(224,122,170,.78)';g.beginPath();g.arc(0,0,n*.30,0,7);g.fill();g.strokeStyle='rgba(150,40,95,.7)';g.lineWidth=Math.max(1,1.4*k);g.stroke();
  g.fillStyle='rgba(120,20,75,.75)';g.beginPath();g.arc(n*.06,-n*.04,n*.07,0,7);g.fill()}
 else{
  g.rotate(c.ang);g.lineCap='round';g.strokeStyle=dark;
  if(c.st==='pro'){g.strokeStyle='rgba(150,40,95,.5)';g.lineWidth=Math.max(1,1.2*k);g.beginPath();g.arc(0,0,n*.33,0,7);g.stroke();
   g.strokeStyle=dark;g.lineWidth=Math.max(1,3.4*k);for(let i=0;i<9;i++){const a=R()*6.28,d=R()*n*.2,x=Math.cos(a)*d,y=Math.sin(a)*d,l=n*.2;g.beginPath();g.moveTo(x-l/2,y-l*.2);g.quadraticCurveTo(x+(R()-.5)*l,y+(R()-.5)*l,x+l/2,y+l*.2);g.stroke()}}
  else if(c.st==='meta'){g.lineWidth=Math.max(1.5,6*k);for(let i=0;i<8;i++){const x=(i-3.5)*n*.085;g.beginPath();g.moveTo(x,-n*.075+(R()-.5)*n*.02);g.lineTo(x,n*.075+(R()-.5)*n*.02);g.stroke()}
   g.strokeStyle='rgba(120,120,140,.35)';g.lineWidth=Math.max(1,1*k);g.beginPath();g.moveTo(-n*.02,-h/2*.9);g.lineTo(0,0);g.lineTo(n*.02,h/2*.9);g.stroke()}
  else if(c.st==='ana'){g.lineWidth=Math.max(1.5,5*k);[-1,1].forEach(sgn=>{for(let i=0;i<8;i++){const x=(i-3.5)*n*.085,y=sgn*n*.24;g.beginPath();g.moveTo(x,y+sgn*n*.06);g.lineTo(x+n*.015,y-sgn*n*.02);g.stroke()}})}
  else{[-1,1].forEach(sgn=>{g.fillStyle='rgba(122,23,71,.85)';g.beginPath();g.ellipse(0,sgn*n*.27,n*.3,n*.12,0,0,7);g.fill()});
   g.strokeStyle='rgba(205,120,150,.9)';g.lineWidth=Math.max(1,2.2*k);g.beginPath();g.moveTo(-w/2,0);g.lineTo(w/2,0);g.stroke()}
 }
 g.restore();
}

const RQ=[

];
function chk(q,t){return !!t&&q[2].test(t)&&q[3].test(t)}
function repEval(){
 let correct=0,wrong=0,placed=0;
 ST.forEach(s=>{const id=S.slots[s];if(id==null)return;placed++;const c=S.caps.find(c=>c.id===id);if(c&&c.stage===s)correct++;else wrong++});
 const uniq=new Set(S.caps.map(c=>c.stage)).size;
 const c1=uniq>0&&wrong===0&&correct>=Math.min(4,uniq);
 const qs=RQ.map(q=>chk(q,S.rep[q[0]])),kc=qs.filter(Boolean).length;
 return{correct,wrong,placed,c1,qs,kc,c2:kc>=2}}
function repScore(){if(!S.rep.graded)return{c1:false,c2:false,pts:0};const e=repEval();return{c1:e.c1,c2:e.c2,pts:e.c1&&e.c2?20:(e.c1||e.c2)?15:10}}

  const pool=$('#pool');S.caps.forEach((c,i)=>{if(Object.values(S.slots).includes(c.id))return;const d=document.createElement('div');d.className='th';d.innerHTML=`<img src="${c.url}" alt="사진 ${i+1}"><span class="no">#${i+1}</span>`;pool.appendChild(d);

  $$('.slot .dz').forEach(d=>d.onclick=()=>{if(S.slots[d.dataset.slot]!=null){delete S.slots[d.dataset.slot];S.rep.graded=false;renderRep();tabs()}});

 {t:'sa',q:'뿌리 끝을 해부침으로 찢고 덮개유리를 덮어 눌러 퍼뜨리는 까닭을 쓰세요. (세포가 어떻게 되도록?)',k:/겹|한\s*겹|얇|펴|퍼/,k2:/않|없|안|한\s*겹|얇|펴|퍼/,ans:'세포가 겹치지 않고 한 겹으로 얇게 퍼지게 하려고',ex:'세포가 겹치면 염색체가 잘 보이지 않으므로 한 겹으로 얇게 펴야 합니다.'},

function shuf(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
