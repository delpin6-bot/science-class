 st.reset=()=>{st.ok=[];st.sel=-1;r()};st.done=()=>st.ok.filter(Boolean).length===items.length;st.solve=()=>{items.forEach((x,i)=>{st.sel=i;bins.find(b=>+b.dataset.b===x[1]).click()})};st.reset();return st}

function MCSeq(qId,oId,pId,sayId,list,done,onShow){const st={n:0};function show(){if(st.n>=list.length){$('#'+qId).textContent='🎉 모두 맞혔어요!';$('#'+oId).innerHTML='';return}const q=list[st.n];onShow&&onShow(st.n);$('#'+qId).textContent=(st.n+1)+'. '+q[0];$('#'+oId).innerHTML='';const od=q[1].map((_,i)=>i);for(let k=od.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[od[k],od[j]]=[od[j],od[k]]}od.forEach(i=>{const t=q[1][i];const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(i===q[2]){sOK();st.n++;$('#'+pId).textContent=st.n+' / '+list.length;$('#'+sayId).className='say ok';$('#'+sayId).textContent='⭕ '+q[3];hud();if(st.n>=list.length){say(done||'완료 🎉',3000);confetti(['✨','🎉'])}show()}else{sNO();b.classList.add('wrong','shake');$('#'+sayId).className='say bad';$('#'+sayId).textContent='❌ 다시 생각해 보세요.'}};$('#'+oId).appendChild(b)})}
 st.reset=()=>{st.n=0;$('#'+pId).textContent='0 / '+list.length;show()};st.done=()=>st.n>=list.length;st.solve=()=>{let g=0;while(st.n<list.length&&g++<500){const q=list[st.n];const b=[...$('#'+oId).children].find(x=>x.textContent===q[1][q[2]]);if(!b)break;b.click()}};return st}
function sorterHTML(id,title,bins){return `<div class="card" id="${id}"><div class="ct">${title}</div><div class="items"></div><div class="bins" style="grid-template-columns:repeat(${bins.length},minmax(0,1fr));margin-top:10px">${bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${b}</h3><div class="bc"></div></div>`).join('')}</div>`}

function GPH(g,o){const{x,y,w,h,xm,ym}=o;g.fillStyle='#fff';g.fillRect(x,y,w,h);g.strokeStyle='#e2e8f0';g.lineWidth=1;const nx=o.nx||5,ny=o.ny||4;for(let i=1;i<=nx;i++){const X=x+w*i/nx;g.beginPath();g.moveTo(X,y);g.lineTo(X,y+h);g.stroke()}for(let i=1;i<=ny;i++){const Y=y+h-h*i/ny;g.beginPath();g.moveTo(x,Y);g.lineTo(x+w,Y);g.stroke()}
 g.strokeStyle='#0f172a';g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+h);g.lineTo(x+w,y+h);g.stroke();g.fillStyle='#334155';g.font='700 16px sans-serif';g.textAlign='center';for(let i=0;i<=nx;i++)g.fillText(+(xm*i/nx).toFixed(2),x+w*i/nx,y+h+18);g.textAlign='right';for(let i=1;i<=ny;i++)g.fillText(+(ym*i/ny).toFixed(2),x-6,y+h-h*i/ny+6);
 g.font='800 17px sans-serif';g.textAlign='right';g.fillText(o.xl||'',x+w,y+h+38);g.textAlign='left';g.fillText(o.yl||'',x+4,y-8);return{X:v=>x+w*v/xm,Y:v=>y+h-h*v/ym}}
function GLINE(g,G,pts,c,w){if(!pts.length)return;g.strokeStyle=c;g.lineWidth=w||4;g.beginPath();pts.forEach((p,i)=>{const X=G.X(p[0]),Y=G.Y(p[1]);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()}
function GDOT(g,G,pts,c,r){g.fillStyle=c;pts.forEach(p=>{g.beginPath();g.arc(G.X(p[0]),G.Y(p[1]),r||7,0,6.3);g.fill()})}

let F1=20,S1=2,x1=0,run1=false,cmb={};
function step1(dt){if(!run1)return;x1=Math.min(S1,x1+dt*1.5);if(x1>=S1){run1=false;const W=F1*S1;$('#w1').textContent=F1+' N × '+S1+' m = '+W+' J';cmb[F1+'_'+S1]=1;const n=Object.keys(cmb).length;$('#p1').textContent=Math.min(3,n)+' / 3';sTick();$('#s1').className='say';$('#s1').textContent='💪 '+F1+' N의 힘으로 '+S1+' m 이동 → 일 '+W+' J. 힘-이동 거리 그래프 아래 넓이와 같아요.';if(n>=3&&!LAB._c1){LAB._c1=1;sOK();$('#s1').className='say ok';$('#s1').textContent='🎉 일(J) = 힘(N) × 힘의 방향으로 이동한 거리(m). 힘이나 거리가 2배면 일도 2배!';say('일의 정의 완료 🎉',3000);confetti(['📦','💪'])}hud()}}
function draw1(){const{g}=view($('#c1'),LW,LH);g.fillStyle='#f8fafc';g.fillRect(0,0,LW,LH);g.fillStyle='#cbd5e1';g.fillRect(0,170,LW,12);const sc=110,X=100+x1*sc;
 g.fillStyle='#334155';g.font='700 14px sans-serif';g.textAlign='center';for(let m=0;m<=5;m++){g.fillRect(100+m*sc-1,182,2,10);g.fillText(m+' m',100+m*sc,208)}
 g.fillStyle='#b45309';g.fillRect(X,100,120,70);g.fillStyle='#fff';g.font='800 20px sans-serif';g.fillText('📦',X+60,142);arrow(g,X-10-F1*1.6,135,X-6,135,'#dc2626',8+F1/8,'');g.fillStyle='#dc2626';g.font='800 18px sans-serif';g.fillText(F1+' N',X-40,118);
 const G=GPH(g,{x:120,y:250,w:560,h:140,xm:5,ym:50,xl:'이동 거리(m)',yl:'힘(N)',nx:5,ny:5});g.fillStyle='rgba(34,197,94,.35)';g.fillRect(G.X(0),G.Y(F1),G.X(x1)-G.X(0),G.Y(0)-G.Y(F1));GLINE(g,G,[[0,F1],[5,F1]],'#dc2626',3);
 if(x1>0){g.fillStyle='#166534';g.font='900 20px sans-serif';g.textAlign='center';g.fillText((F1*x1).toFixed(0)+' J',G.X(x1/2),G.Y(F1/2)+8)}g.restore()}
let M3=2,H3=1,MC3,SR2;
function draw3(){const{g}=view($('#c3'),LW,LH);g.fillStyle='#f8fafc';g.fillRect(0,0,LW,LH);g.fillStyle='#94a3b8';g.fillRect(0,400,LW,40);const sc=150,Y=400-H3*sc,s=30+M3*4;
 g.strokeStyle='#64748b';g.setLineDash([6,6]);g.beginPath();g.moveTo(330,400);g.lineTo(330,Y);g.stroke();g.setLineDash([]);g.fillStyle='#0f172a';g.font='800 18px sans-serif';g.textAlign='right';g.fillText(H3+' m',320,(400+Y)/2);
 g.fillStyle='#475569';g.fillRect(400-s/2,Y-s,s,s);g.fillStyle='#fff';g.textAlign='center';g.fillText(M3+' kg',400,Y-s/2+6);arrow(g,400,Y-s-10,400,Y-s-70,'#16a34a',9,'');arrow(g,460,Y-s/2,460,Y-s/2+60,'#dc2626',9,'');
 g.fillStyle='#16a34a';g.textAlign='left';g.fillText('드는 힘 '+(9.8*M3).toFixed(1)+' N',420,Y-s-50);g.fillStyle='#dc2626';g.fillText('중력 '+(9.8*M3).toFixed(1)+' N',480,Y-s/2+50);g.restore()}
function upd3(){const W=9.8*M3*H3;$('#w3').textContent='9.8 × '+M3+' × '+H3+' = '+W.toFixed(1)+' J';$('#tg3').textContent=M3+' kg을 '+H3+' m 들어 올림'}
const LAB={key:'work',
 quiz:[
 {q:'과학에서 일이란?',o:['물체에 힘을 작용하여 힘의 방향으로 이동시키는 것','힘든 활동 모두','생각하는 것'],a:0,e:'힘 + 힘 방향의 이동'},
 {q:'일의 단위는?',o:['J(줄)','N(뉴턴)','m/s'],a:0,e:'1 J = 1 N × 1 m'},
 {q:'10 N의 힘으로 3 m 밀었을 때 한 일은?',o:['30 J','13 J','3.3 J'],a:0,e:'10 × 3'},
 {q:'벽을 힘껏 밀었지만 움직이지 않았다. 한 일은?',o:['0 J','아주 큰 일','힘의 크기만큼'],a:0,e:'이동 거리 0'},
 {q:'가방을 들고 수평으로 걸어갈 때 가방에 한 일은?',o:['0 J','가방 무게 × 거리','무한대'],a:0,e:'힘과 이동 방향이 수직'},
 {q:'질량 2 kg 물체를 1 m 들어 올리는 일은?',o:['19.6 J','2 J','9.8 J'],a:0,e:'9.8 × 2 × 1'},
 {q:'힘-이동 거리 그래프 아래 넓이는?',o:['한 일','속력','무게'],a:0,e:'힘 × 거리'}],
 segs:()=>[['일 = 힘 × 거리',!!LAB._c1],['일을 했을까?',SR2&&SR2.done()],['들어 올리는 일',MC3&&MC3.done()]],
 reset(){LAB._c1=0;cmb={};x1=0;run1=false;$('#p1').textContent='0 / 3';$('#w1').textContent='-';SR2.reset();MC3.reset();['#s1','#s2','#s3'].forEach(s=>$(s).className='say')},
 init(){sl('r1f',v=>v+' N',v=>{F1=v;x1=0;run1=false});sl('r1s',v=>v+' m',v=>{S1=v;x1=0;run1=false});$('#go1').onclick=()=>{x1=0;run1=true;sTap()};sl('r3m',v=>v+' kg',v=>{M3=v;upd3()});sl('r3h',v=>v+' m',v=>{H3=v;upd3()});$('#tg1').textContent='힘의 방향 = 이동 방향';
  SR2=Sorter('#srt2',[['수레를 밀어 앞으로 이동시켰다',0,'힘 방향으로 이동'],['역기를 머리 위로 들어 올렸다',0,'위로 힘, 위로 이동'],['책을 책상에서 선반 위로 옮겼다',0,'들어 올림'],['문을 당겨서 열었다',0,'힘 방향으로 이동'],['벽을 힘껏 밀었지만 움직이지 않았다',1,'이동 거리 0'],['가방을 들고 복도를 수평으로 걸어갔다',1,'힘과 이동이 수직'],['얼음판 위에서 저절로 미끄러지는 퍽',1,'힘을 주지 않음'],['무거운 역기를 머리 위로 들고 서 있다',1,'이동 거리 0'],['시험공부를 열심히 했다',1,'과학의 일이 아님']],'s2','일 분류 완료 🎉');
  MC3=MCSeq('q3q','q3o','p3','s3',[['물체를 일정한 속력으로 들어 올리는 데 필요한 힘은?',['물체의 무게와 같은 크기','무게보다 훨씬 작다','0'],0,'중력과 같은 크기'],['5 kg 물체를 2 m 들어 올리는 일은?',['98 J','10 J','49 J'],0,'9.8 × 5 × 2'],['같은 물체를 2배 높이 들어 올리면 일은?',['2배','4배','같다'],0,'높이에 비례']],'들어 올리는 일 완료 🎉')},
 frame(dt){step1(dt);if(mode===1)draw1();else if(mode===3)draw3()},
 auto(){[[20,2],[40,2],[20,4]].forEach(a=>{F1=a[0];S1=a[1];x1=0;run1=true;step1(9)});SR2.solve();MC3.solve();hud();return{c1:LAB._c1}}};

boot();
