 p.x+=p.vx*sp*dt;p.y+=p.vy*sp*dt;if(p.x<b[0]+p.r){p.x=b[0]+p.r;p.vx=Math.abs(p.vx)}if(p.x>b[2]-p.r){p.x=b[2]-p.r;p.vx=-Math.abs(p.vx)}if(p.y<b[1]+p.r){p.y=b[1]+p.r;p.vy=Math.abs(p.vy)}if(p.y>b[3]-p.r){p.y=b[3]-p.r;p.vy=-Math.abs(p.vy)}}

const COL=['#64748b','#3b82f6','#f97316'],NM=['고체','액체','기체'];

// 상태 상자: 30개 입자. st 0/1/2, k=운동 속도 배율, hl=액체 높이, lat=고체 격자 열 수
function Box(x0,y0,x1,y1,o){o=o||{};const b={x0,y0,x1,y1,st:0,k:1,hl:o.hl||80,cols:o.cols||6,n:o.n||30,r:o.r||8,ps:[],vol:1};
 b.fill=function(){b.ps=[];for(let i=0;i<b.n;i++)b.ps.push(P(rnd(x0+10,x1-10),rnd(y1-80,y1-10),b.r,COL[b.st]))};
 b.set=function(s){b.st=s;b.ps.forEach(p=>p.c=COL[s])};
 b.step=function(dt){const cx=(b.x0+b.x1)/2,sp=b.st===0?0:(b.st===1?60:230)*b.k,sz=b.r*2.7;
  b.ps.forEach((p,i)=>{if(b.st===0){const tx=cx-(b.cols-1)*sz/2+(i%b.cols)*sz,ty=b.y1-b.r-4-Math.floor(i/b.cols)*sz;const q=Math.min(1,7*dt);p.x+=(tx-p.x)*q+Math.sin(performance.now()/90+p.j)*.3*b.k;p.y+=(ty-p.y)*q+Math.cos(performance.now()/80+p.j)*.3*b.k}
   else{const top=b.st===1?b.y1-b.hl:b.y0;if(p.y<top)p.y+=(top-p.y)*Math.min(1,5*dt)+1;walk(p,sp,dt,[b.x0,top,b.x1,b.y1])}});
  if(b.st===1){const a=b.ps,d0=b.r*2;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const dx=a[j].x-a[i].x,dy=a[j].y-a[i].y,d=Math.hypot(dx,dy)||.1;if(d<d0){const m=(d0-d)/2/d;a[i].x-=dx*m;a[i].y-=dy*m;a[j].x+=dx*m;a[j].y+=dy*m}}}};
 b.draw=function(g,tint){g.fillStyle='#fff';g.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);if(b.st===1){g.fillStyle=tint||'rgba(96,165,250,.3)';g.fillRect(b.x0,b.y1-b.hl,b.x1-b.x0,b.hl)}
  g.strokeStyle='#64748b';g.lineWidth=7;g.lineJoin='round';g.beginPath();g.moveTo(b.x0,b.y0);g.lineTo(b.x0,b.y1);g.lineTo(b.x1,b.y1);g.lineTo(b.x1,b.y0);g.stroke();dots(g,b.ps,.95)};
 b.fill();return b}

function arrow(g,x1,y1,x2,y2,c,w,lab){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<3)return;const a=Math.atan2(dy,dx),h=Math.min(26,L*.5);w=w||8;g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.8,y2-Math.sin(a)*h*.8);g.stroke();g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-Math.cos(a-.45)*h,y2-Math.sin(a-.45)*h);g.lineTo(x2-Math.cos(a+.45)*h,y2-Math.sin(a+.45)*h);g.closePath();g.fill();
 if(lab){g.font='900 22px sans-serif';g.textAlign='center';g.fillStyle=c;g.fillText(lab,(x1+x2)/2-Math.sin(a)*26,(y1+y2)/2+Math.cos(a)*26+6)}}
function spring(g,x1,y1,x2,y2,n,w,c){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;g.strokeStyle=c||'#475569';g.lineWidth=5;g.lineJoin='round';g.beginPath();g.moveTo(x1,y1);const s=L*.1;g.lineTo(x1+ux*s,y1+uy*s);for(let i=0;i<=n*2;i++){const t=.1+.8*i/(n*2),o=(i%2?1:-1)*w;g.lineTo(x1+ux*L*t+px*o,y1+uy*L*t+py*o)}g.lineTo(x2-ux*s,y2-uy*s);g.lineTo(x2,y2);g.stroke()}
// 분류 도우미: Sorter(rootSel, items[[label,bin,exp]], sayId, done)
function Sorter(root,items,sayId,done){const R=$(root),st={ok:[],sel:-1};const it=R.querySelector('.items'),bins=[...R.querySelectorAll('.bin')];
 function r(){it.innerHTML='';items.forEach((x,i)=>{if(st.ok[i])return;const b=document.createElement('button');b.className='item'+(st.sel===i?' sel':'');b.textContent=x[0];b.onclick=()=>{st.sel=i;sTap();r()};it.appendChild(b)});bins.forEach(bn=>{const k=+bn.dataset.b;bn.querySelector('.bc').innerHTML=items.map((x,i)=>st.ok[i]&&x[1]===k?'<span class="chip">'+x[0]+'</span>':'').join('')})}
 bins.forEach(bn=>bn.onclick=()=>{if(st.sel<0){say('먼저 카드를 눌러요',1500);return}const k=+bn.dataset.b,x=items[st.sel];if(x[1]===k){st.ok[st.sel]=1;sOK();$('#'+sayId).className='say ok';$('#'+sayId).textContent='⭕ '+x[0]+(x[2]?' — '+x[2]:'');st.sel=-1;r();hud();if(st.ok.filter(Boolean).length===items.length){say(done||'분류 완료 🎉',3000);confetti(['✨','🎉'])}}else{sNO();bn.classList.add('shake');setTimeout(()=>bn.classList.remove('shake'),500);$('#'+sayId).className='say bad';$('#'+sayId).textContent='❌ 다시 생각해 보세요.'}});

// 객관식 연속: MCSeq(qId,oId,pId,sayId,list[[q,opts,ans,exp]],done)
function MCSeq(qId,oId,pId,sayId,list,done,onShow){const st={n:0};function show(){if(st.n>=list.length){$('#'+qId).textContent='🎉 모두 맞혔어요!';$('#'+oId).innerHTML='';return}const q=list[st.n];onShow&&onShow(st.n);$('#'+qId).textContent=(st.n+1)+'. '+q[0];$('#'+oId).innerHTML='';const od=q[1].map((_,i)=>i);for(let k=od.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[od[k],od[j]]=[od[j],od[k]]}od.forEach(i=>{const t=q[1][i];const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(i===q[2]){sOK();st.n++;$('#'+pId).textContent=st.n+' / '+list.length;$('#'+sayId).className='say ok';$('#'+sayId).textContent='⭕ '+q[3];hud();if(st.n>=list.length){say(done||'완료 🎉',3000);confetti(['✨','🎉'])}show()}else{sNO();b.classList.add('wrong','shake');$('#'+sayId).className='say bad';$('#'+sayId).textContent='❌ 다시 생각해 보세요.'}};$('#'+oId).appendChild(b)})}
 st.reset=()=>{st.n=0;$('#'+pId).textContent='0 / '+list.length;show()};st.done=()=>st.n>=list.length;st.solve=()=>{let g=0;while(st.n<list.length&&g++<500){const q=list[st.n];const b=[...$('#'+oId).children].find(x=>x.textContent===q[1][q[2]]);if(!b)break;b.click()}};return st}

 if(lab){g.font='900 20px sans-serif';const w=g.measureText(lab).width+16;let x=p[0]-w/2,y=p[1]-48;x=Math.max(2,Math.min(LW-w-2,x));if(y<2)y=p[1]+22;g.fillStyle=col;g.beginPath();g.roundRect?g.roundRect(x,y,w,28,8):g.rect(x,y,w,28);g.fill();g.fillStyle='#fff';g.textAlign='left';g.fillText(lab,x+8,y+21)}}
function tapPick(cv,pts,cb){cv.addEventListener('pointerdown',e=>{const[x,y]=toL(cv,e,LW,LH);let b=-1,bd=60;pts().forEach((p,i)=>{if(!p)return;const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;b=i}});if(b>=0)cb(b)})}
function infoBox(g,x,y,w,h,title,body){g.fillStyle='#fff';g.strokeStyle='#cbd5e1';g.lineWidth=2;g.beginPath();g.roundRect?g.roundRect(x,y,w,h,14):g.rect(x,y,w,h);g.fill();g.stroke();g.fillStyle='#be123c';g.font='900 28px sans-serif';g.textAlign='left';g.fillText(title,x+16,y+42);g.fillStyle='#0f172a';g.font='700 21px sans-serif';let line='',yy=y+80;for(const ch of body){const tl=line+ch;if(g.measureText(tl).width>w-32){g.fillText(line,x+16,yy);line=ch;yy+=30}else line=tl}g.fillText(line,x+16,yy)}

const SP=[{n:'귓바퀴',f:'소리를 모아 외이도로 전달해요.',u:.08,v:.42},{n:'외이도',f:'소리가 이동하는 통로예요.',u:.33,v:.55},{n:'고막',f:'소리에 의해 진동하는 얇은 막이에요.',u:.56,v:.57},{n:'귓속뼈',f:'고막의 진동을 증폭해요.',u:.58,v:.47},{n:'달팽이관',f:'소리 자극을 받아들이는 청각 세포가 분포해요.',u:.81,v:.48},{n:'청각 신경',f:'청각 세포에서 받아들인 자극을 뇌로 전달해요.',u:.93,v:.36},{n:'대뇌',f:'소리를 느껴요(청각 성립).',u:-1,v:0}];
let t1=-1;
function step1(dt){if(t1<0)return;t1+=dt*.8;const k=Math.min(SP.length-1,Math.floor(t1));$('#at1').textContent=SP[k].n;$('#fn1').textContent=SP[k].f;$('#tg1').textContent=(k+1)+' / 7 '+SP[k].n;if(t1>=SP.length){t1=-2;if(!LAB._c1){LAB._c1=1;sOK();$('#s1').className='say ok';$('#s1').textContent='🎉 소리 → 귓바퀴 → 외이도 → 고막 → 귓속뼈 → 달팽이관(청각 세포) → 청각 신경 → 대뇌';say('청각 경로 완료 🎉',3000);confetti(['🔊','👂'])}hud()}}
let EM=null;
function earPic(g,x){EM=pic(g,'ear',x,0,600,440);return EM}
function draw1(){const{g}=view($('#c1'),LW,LH);g.fillStyle='#fff';g.fillRect(0,0,LW,LH);const M=earPic(g,0);g.font='64px serif';g.textAlign='center';g.fillText('🧠',710,110);const pos=i=>SP[i].u<0?[710,130]:M(SP[i].u,SP[i].v);
 const k=t1<0?(t1===-2?SP.length-1:-1):Math.min(SP.length-1,Math.floor(t1));if(k>=0){g.strokeStyle='#2563eb';g.lineWidth=6;g.lineCap='round';g.beginPath();const p0=M(0,.42);g.moveTo(p0[0],p0[1]);for(let i=0;i<=k;i++){const p=pos(i);g.lineTo(p[0],p[1])}g.stroke()}
 SP.forEach((s,i)=>hot(g,pos(i),i<=k?s.n:'',i===k,i<=k?'#2563eb':'#94a3b8'));if(k>=0)infoBox(g,605,180,190,250,SP[k].n,SP[k].f);g.restore()}
const SC=[{n:'🎠 회전목마를 탄다',o:'반고리관',s:'회전 감각',h:0},{n:'🛗 엘리베이터가 출발한다',o:'전정 기관',s:'몸의 기울어짐·움직임',h:1},{n:'🤸 몸이 기울어졌다',o:'전정 기관',s:'몸의 기울어짐',h:1},{n:'🌀 제자리에서 빙글빙글 돈다',o:'반고리관',s:'회전 감각',h:0}];let sc=-1,seen2={};
function rsc(){$('#sc2').innerHTML='';SC.forEach((s,i)=>{const b=document.createElement('button');b.className='btn'+(i===sc?' on2':'');b.textContent=s.n+(seen2[i]?' ✔':'');b.onclick=()=>pick2(i);$('#sc2').appendChild(b)})}
function pick2(i){sc=i;seen2[i]=1;$('#or2').textContent=SC[i].o;$('#se2').textContent=SC[i].s;$('#tg2').textContent=SC[i].n;const n=Object.keys(seen2).length;$('#p2').textContent=n+' / 4';rsc();sTap();if(n===4&&!LAB._c2){LAB._c2=1;sOK();$('#s2').className='say ok';$('#s2').textContent='🎉 반고리관은 몸의 회전을, 전정 기관은 몸의 기울어짐(위치 변화)을 느껴요.';say('평형 감각 완료 🎉',3000);confetti(['🎢','🌀'])}hud()}
function draw2(){const{g}=view($('#c2'),LW,LH);g.fillStyle='#fff';g.fillRect(0,0,LW,LH);const M=earPic(g,0);const t=performance.now()/1000;
 hot(g,M(.65,.25),sc>=0&&SC[sc].h===0?'반고리관':'',sc>=0&&SC[sc].h===0,'#16a34a');hot(g,M(.66,.48),sc>=0&&SC[sc].h===1?'전정 기관':'',sc>=0&&SC[sc].h===1,'#7c3aed');
 if(sc>=0){const h=SC[sc].h;g.font='90px serif';g.textAlign='center';g.save();g.translate(705,250);if(h===0)g.rotate(t*2);else g.rotate(Math.sin(t*2)*.4);g.fillText(SC[sc].n.split(' ')[0],0,30);g.restore();g.fillStyle='#0f172a';g.font='900 18px sans-serif';g.fillText(SC[sc].s,700,380)}g.restore()}
let SR3;
const LAB={key:'ear',
 quiz:[
 {q:'청각 세포가 있는 곳은?',o:['달팽이관','고막','귓바퀴'],a:0,e:'달팽이관'},
 {q:'고막의 진동을 증폭하는 구조는?',o:['귓속뼈','외이도','반고리관'],a:0,e:'세 개의 작은 뼈'},
 {q:'몸의 회전을 느끼는 구조는?',o:['반고리관','전정 기관','달팽이관'],a:0,e:'반고리관'},
 {q:'몸의 기울어짐을 느끼는 구조는?',o:['전정 기관','반고리관','귓바퀴'],a:0,e:'전정 기관'},
 {q:'비행기가 이륙할 때 귀가 먹먹한 것을 해결하는 구조는?',o:['귀인두관','달팽이관','청각 신경'],a:0,e:'고막 안팎 압력 조절'},
 {q:'청각이 성립하는 곳은?',o:['대뇌','고막','달팽이관'],a:0,e:'대뇌에서 느껴요.'},
 {q:'소리가 고막 다음으로 전달되는 구조는?',o:['귓속뼈','달팽이관','외이도'],a:0,e:'고막 → 귓속뼈'}],
 segs:()=>[['청각 경로',!!LAB._c1],['평형 감각',!!LAB._c2],['구조 분류',SR3&&SR3.done()]],
 reset(){LAB._c1=0;LAB._c2=0;t1=-1;seen2={};sc=-1;rsc();$('#p2').textContent='0 / 4';SR3.reset();['#s1','#s2','#s3'].forEach(s=>$(s).className='say')},
 init(){rsc();$('#go1').onclick=()=>{t1=0;sTap()};
  SR3=Sorter('#srt3',[['귓바퀴: 소리를 모은다',0,'청각'],['고막: 진동한다',0,'청각'],['귓속뼈: 진동 증폭',0,'청각'],['달팽이관: 청각 세포',0,'청각'],['반고리관: 회전 감지',1,'평형'],['전정 기관: 기울어짐 감지',1,'평형'],['귀인두관: 고막 안팎 압력 조절',2,'압력'],['높은 산에서 침을 삼키면 귀가 뚫린다',2,'귀인두관']],'s3','귀 구조 분류 완료 🎉')},
 frame(dt){step1(dt);if(mode===1)draw1();else if(mode===2)draw2()},
 auto(){t1=0;for(let i=0;i<20&&t1>=0;i++)step1(.6);SC.forEach((s,i)=>pick2(i));SR3.solve();hud();return{c1:LAB._c1,c2:LAB._c2}}};
