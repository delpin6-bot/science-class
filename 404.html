<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 · 과학수업 서랍</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:20px}
a{display:inline-block;margin:6px;padding:12px 18px;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;text-decoration:none}</style></head>
<body><div><p style="font-size:40px;margin:0">🔍</p><h1 style="font-size:22px">찾는 페이지가 없어요</h1>
<p>주소가 바뀌었거나 QR 코드가 오래되었을 수 있어요.</p><p id="links"></p></div>
<script>
/* GitHub Pages 프로젝트 사이트(아이디.github.io/저장소/)에서도 저장소 첫 화면으로 돌아가도록 */
var seg = location.pathname.split("/").filter(Boolean);
var root = (location.hostname.endsWith("github.io") && seg.length) ? "/" + seg[0] + "/" : "/";
document.getElementById("links").innerHTML =
  '<a href="' + root + '통합_과학수업_서랍.html">📚 통합 서랍</a>' +
  '<a href="' + root + '45분_모듈러_수업서랍.html">⚡ 45분 모듈러</a>' +
  '<a href="' + root + '시작하기_수업게임서랍.html">🎮 수업 게임</a>' +
  '<a href="' + root + '자바실험실_서랍.html">🔬 자바실험실</a>';
</script></body></html>
