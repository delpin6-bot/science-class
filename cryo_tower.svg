<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100">
  <defs>
    <!-- 냉기 서리 발광 필터 -->
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 육각 얼음 받침대 -->
  <polygon points="50,10 88,32 88,76 50,98 12,76 12,32" fill="#083344" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>

  <!-- 눈꽃 결정 가지 -->
  <g stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round" filter="url(#iceGlow)">
    <line x1="50" y1="22" x2="50" y2="78"/>
    <line x1="22" y1="50" x2="78" y2="50"/>
    <line x1="30" y1="30" x2="70" y2="70"/>
    <line x1="30" y1="70" x2="70" y2="30"/>
    <!-- 결정 디테일 -->
    <polygon points="50,30 46,38 54,38" fill="#cffafe"/>
    <polygon points="50,70 46,62 54,62" fill="#cffafe"/>
    <polygon points="30,50 38,46 38,54" fill="#cffafe"/>
    <polygon points="70,50 62,46 62,54" fill="#cffafe"/>
  </g>

  <!-- 냉각 코어 -->
  <circle cx="50" cy="50" r="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2" filter="url(#iceGlow)"/>
</svg>
