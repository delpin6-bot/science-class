<html lang="ko">
<head>

<style>

html,body{height:100%}

.mode.on{display:grid;gap:10px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

.cv{width:100%;border:2px solid #cbd5e1;border-radius:12px;background:#f8fafc;display:block}

.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd div{border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;font-size:clamp(12px,1.02vw,15px);background:#f8fafc}.spd i{display:block;height:9px;border-radius:5px;background:#38bdf8;margin-top:3px}

.med{display:grid;grid-template-columns:1fr 1fr;gap:6px}.med .btn{min-height:58px;line-height:1.2;padding:3px 8px;text-align:left;font-size:clamp(12px,1.05vw,16px)}.med .btn.on{background:#fffbeb;border-color:#f59e0b}

.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:900;font-size:clamp(12px,1.05vw,16px);border:2px solid}
.b-d{background:#fef9c3;border-color:#eab308;color:#713f12}.b-r{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}.b-f{background:#dcfce7;border-color:#22c55e;color:#14532d}.b-n{background:#e5e7eb;border-color:#9ca3af;color:#374151}

.zone.src{border-color:#f59e0b}.zone.non{border-color:#64748b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#dcfce7;border:2px solid #22c55e;border-radius:10px;padding:3px 8px;font-size:clamp(12px,1.05vw,16px)}

  for(let y=4;y<H;y+=8)for(let x=4;x<W;x+=8){const px=x+(rnd()-.5)*3,py=y+(rnd()-.5)*3,c=pickPal(pic(px/W,py/H),rnd);g.fillStyle=rgbS(c);g.beginPath();g.arc(px,py,4.3+rnd()*.5,0,6.2832);g.fill()}
  DOTS=[m0];for(let k=1;k<=3;k++){const p=DOTS[k-1],c=mk(W>>k,H>>k),q=c.getContext('2d');q.imageSmoothingEnabled=true;q.imageSmoothingQuality='high';q.drawImage(p,0,0,c.width,c.height);DOTS.push(c)}}
function sceneDot(g,w,h,t){if(!DOTS)buildDots();g.fillStyle='#1e293b';g.fillRect(0,0,w,h);const Wn=Math.min(w*.9,(h-60)*1.6),Wd=lerp(Wn,Wn*.2,M4.dist/100),Hd=Wd*.625,x=(w-Wd)/2,y=(h-Hd)/2+8,lv=clamp(Math.log2(640/Wd),0,3),l0=Math.floor(lv),fr=lv-l0;
  g.fillStyle='#8b6b2c';g.fillRect(x-7,y-7,Wd+14,Hd+14);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(DOTS[l0],x,y,Wd,Hd);if(fr>0&&l0<3){g.globalAlpha=fr;g.drawImage(DOTS[l0+1],x,y,Wd,Hd);g.globalAlpha=1}
  const m=(1+M4.dist*.09).toFixed(1);outText(g,'👀 감상 거리 약 '+m+' m',w/2,20,clamp(w*.018,13,18),'#fde68a');
  const iw=Math.min(w*.2,170),ih=iw*.62,ix=w-iw-14,iy=h-ih-14;g.imageSmoothingEnabled=false;g.fillStyle='#fff';g.fillRect(ix-3,iy-3,iw+6,ih+6);g.drawImage(DOTS[0],150,60,100,62,ix,iy,iw,ih);g.imageSmoothingEnabled=true;pill(g,'🔍 확대하면 색 점들',ix+iw/2,iy-16,'#fde68a');
  if(Wd>Wn*.6)pill(g,'가까이: 서로 다른 색의 점이 보여요',w/2,h-18,'#fde68a');else if(Wd<Wn*.3)pill(g,'멀리서: 점의 색이 눈에서 합쳐져요',w/2,h-18,'#86efac');
  trackF('dot')}
function scene4(dt,t){const {g,w,h}=fit($('#c4'));if(M4.card==='stage'){if(M4.auto){M4.spr=50+50*Math.sin(t*.9);$('#spr').value=M4.spr}sceneStage(g,w,h,t)}else if(M4.card==='led')sceneLED(g,w,h,t);else sceneDot(g,w,h,t)}

const QZ=[
 {q:'빨간색 조명만 비추는 방에서 초록색 잎은 어떤 색으로 보일까?',o:['초록색','검은색','빨간색','노란색'],a:1,e:'초록 잎은 초록 빛만 반사하고 빨간 빛은 흡수해요. 빨간 조명에는 초록 빛이 없어서 반사되는 빛이 없고, 그래서 검게 보여요.'},
 {q:'빨강 빛과 초록 빛을 같은 곳에 비추면 어떤 색으로 보일까? (물감을 섞을 때와 달라요!)',o:['갈색','노랑','주황','검정'],a:1,e:'빛은 합칠수록 밝아지는 “빛의 합성”이에요. 빨강+초록=노랑, 초록+파랑=청록, 빨강+파랑=자홍, 셋을 모두 합치면 흰색이에요.'},
 {q:'노란색을 보여 주는 스마트폰 화면을 아주 크게 확대하면 어떤 화소가 켜져 있을까?',o:['노란 화소가 켜져 있다','빨간 화소와 초록 화소가 켜져 있다','파란 화소만 켜져 있다','모든 화소가 꺼져 있다'],a:1,e:'화면의 화소는 빨강·초록·파랑 세 종류뿐이에요. 빨강과 초록이 함께 켜지면 눈에는 노랑으로 보이고, 파란 화소는 꺼져 있어요.'},
 {q:'점묘화나 대형 LED 전광판을 멀리서 보면 점들이 하나의 색으로 보이는 까닭은?',o:['점들이 실제로 섞여 버려서','눈이 이웃한 여러 색의 빛을 합쳐서 하나의 색으로 보기 때문에','물감이 마르면서 색이 변해서','멀리 있으면 빛이 사라져서'],a:1,e:'점 하나하나는 그대로이지만, 멀리서는 이웃한 점들의 빛이 눈에서 합쳐져 하나의 색으로 느껴져요. 이것도 빛의 합성이에요.'}];

function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
