<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스페이스엔진 우주 탐사 시뮬레이터 · 별과 우주</title>
<style>
:root{--bg:#04060f;--pn:#0c1226;--pn2:#141d3d;--ln:#26346a;--tx:#e8eeff;--mu:#9aa9d6;--ac:#5eead4;--ok:#34d399;--no:#f87171;--wa:#fbbf24;--bl:#60a5fa}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(14px,1.45vw,17px);line-height:1.5;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:6px clamp(8px,2vw,16px);background:#02040a;border-bottom:1px solid var(--ln);flex-wrap:wrap;position:sticky;top:0;z-index:30}
header h1{margin:0;font-size:clamp(14px,2.2vw,20px);white-space:nowrap}
.hb{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px clamp(8px,1.6vw,14px);font-weight:800;font-size:clamp(11px,1.6vw,14px);text-decoration:none;cursor:pointer;white-space:nowrap;font-family:inherit}
.tabs{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.tab{min-height:42px;padding:0 12px;border-radius:12px;border:2px solid var(--ln);background:var(--pn2);color:var(--mu);font-weight:800;font-size:.92em;cursor:pointer;font-family:inherit}
.tab.on{background:#fff;color:#04060f;border-color:#fff}
main{padding:10px clamp(8px,2vw,16px);display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
@media(max-width:760px){header{position:static}header h1{flex:1 0 100%}.tabs{order:5;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto}.tab{flex:0 0 auto;white-space:nowrap;padding:0 10px}}
.pane{display:flex;flex-direction:column;gap:10px;min-width:0}.pane[hidden]{display:none}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;min-width:0}
.card h2{margin:0 0 6px;font-size:1.02em}
.stagebox{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--ln)}
canvas{width:100%;display:block;touch-action:none;background:#02030a}
#cv,#cg{aspect-ratio:960/540}#ch{aspect-ratio:960/620}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:42px;padding:0 14px;border-radius:12px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:800;cursor:pointer;font-family:inherit;font-size:.95em}
.btn.pri{background:linear-gradient(#5eead4,#0d9488);border-color:#99f6e4;color:#022c26}
.btn.wr{background:linear-gradient(#fbbf24,#d97706);border-color:#fde68a;color:#2b1700}
.btn.on{border-color:#fff;background:#2c3d7e}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 10px;font-size:.85em}
#hud{margin:0;font-family:ui-monospace,Menlo,Consolas,"Noto Sans KR",monospace;font-size:.9em;white-space:pre-wrap;line-height:1.55;color:#c9f7ee}
#log{max-height:min(48vh,440px);overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.msg{background:#080e20;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;font-size:.93em;white-space:pre-wrap;line-height:1.55}
.msg.ok{border-color:var(--ok)}.msg.no{border-color:var(--no)}.msg.wa{border-color:var(--wa)}.msg.hud{border-color:#0d9488;background:#041a1a;font-family:ui-monospace,Menlo,Consolas,"Noto Sans KR",monospace;font-size:.88em;color:#c9f7ee}
.msg b{color:#fff}.msg .k{color:var(--ac)}
.msg .nw{display:block;margin-top:6px;padding:6px 8px;border-left:3px solid var(--bl);background:#0b1636;border-radius:6px;font-size:.92em}
form#cmd{display:flex;gap:6px}
#ci{flex:1;min-width:0;background:#080e20;color:#fff;border:2px solid var(--ln);border-radius:10px;padding:8px 10px;font-size:16px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);font-size:.84em;font-weight:700;cursor:pointer;font-family:inherit}
.mu{color:var(--mu)}.small{font-size:.88em}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{min-height:40px;min-width:40px;border-radius:999px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:900;cursor:pointer;font-family:inherit}
.pill.on{background:#fff;color:#04060f}.pill.done{border-color:var(--ok)}
.goal{background:#080e20;border-left:4px solid var(--ac);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.93em}
.chk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.93em;margin:2px 0}
.in{display:grid;grid-template-columns:1fr 100px;gap:6px 8px;align-items:center;margin:6px 0}
.in input,.in select,select{background:#080e20;color:#fff;border:2px solid var(--ln);border-radius:8px;padding:6px;font-size:16px;font-family:inherit;width:100%}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:6px 0}.sl input{grid-column:1/3;width:100%;height:28px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:800;font-size:.85em}
.b-ok{background:#064e3b;color:#6ee7b7}.b-bad{background:#78350f;color:#fcd34d}.b-dead{background:#7f1d1d;color:#fca5a5}
table.t{width:100%;border-collapse:collapse;font-size:.88em}table.t td,table.t th{border-bottom:1px solid var(--ln);padding:4px 6px;text-align:left}
.ro{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;font-size:.88em}.ro div{background:#080e20;border:1px solid var(--ln);border-radius:8px;padding:5px 8px}.ro b{display:block;font-size:1.05em}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
#catl{max-height:62vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1}
</style></head><body>
<header><h1>🚀 스페이스엔진 우주 탐사</h1><div class="tabs" id="tabs"></div>
<a class="hb" href="./시작하기_수업게임서랍.html">🎮 게임 서랍</a><button class="hb" id="fs">⛶ 전체화면</button></header>
<main>
<section style="display:contents">
<div style="min-width:0">
 <div class="pane" id="p-bridge">
  <div class="stagebox"><canvas id="cv" width="960" height="540"></canvas></div>
  <div class="bar" id="sbar"></div>
  <div class="card" id="apr" hidden></div>
  <div class="card"><h2>🖥 현재 HUD</h2><pre id="hud"></pre></div>
  <div class="card"><h2>💬 함선 항법 AI "아스트라"</h2><div id="log"></div>
   <form id="cmd" autocomplete="off"><input id="ci" placeholder="예) 도약 시리우스 · HIP 27989 · M31 · 센서 적외선 · 분석 · 도움말"><button class="btn pri" type="submit">전송</button></form>
   <div class="chips" id="chips"></div></div>
 </div>
 <div class="pane" id="p-gal" hidden>
  <div class="bar" id="gbar"></div>
  <div class="stagebox"><canvas id="cg" width="960" height="540"></canvas></div>
  <div class="card" id="gfact"></div>
 </div>
 <div class="pane" id="p-hr" hidden>
  <div class="stagebox"><canvas id="ch" width="960" height="620"></canvas></div>
  <div class="card" id="hrinfo"></div>
 </div>
 <div class="pane" id="p-cat" hidden>
  <div class="card"><div class="bar"><select id="catf" style="width:auto"><option value="all">전체</option><option value="star">항성</option><option value="ns">극한(펄서·블랙홀)</option><option value="neb">성운</option><option value="cl">성단</option><option value="gal">외부 은하</option></select><span class="mu small" id="catn"></span></div><div id="catl"></div></div>
 </div>
</div>
<aside class="side"><div class="card" id="mis"></div></aside>
</section>
</main>
<div id="toast"></div>
