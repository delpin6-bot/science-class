<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>영화와 과학 · 인터스텔라 2차시 · 특수 상대성 이론 (시간 지연 · 길이 수축 · 쌍둥이 역설)</title>
<style>
:root{--bg:#050a18;--pn:#0b1226;--ln:#2a3a66;--tx:#f1f5f9;--mu:#94a3b8;--gold:#fde68a;--cy:#7dd3fc;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:24px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;min-height:56px;border-radius:14px;border:3px solid var(--ln);background:#111b3a;padding:0 14px;font-weight:800}
button:active{transform:scale(.97)}button.on{border-color:var(--gold);background:#2a2a10;color:var(--gold)}button:disabled{opacity:.45;cursor:default}
header{height:76px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:3px solid var(--ln);background:#060c20}
header h1{font-size:24px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header h1 small{display:block;font-size:18px;color:var(--mu);font-weight:600}
.tabs{display:flex;gap:6px;margin-left:auto;flex-shrink:0}.tabs button{min-height:60px;font-size:21px;padding:0 12px;white-space:nowrap}
#app{height:calc(100% - 76px);display:grid;grid-template-columns:1fr 470px}
#stage{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hero{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#101a3a,#050a18 75%)}
#hw{position:relative}#himg{width:100%;height:100%;display:block;border-radius:12px;border:3px solid var(--ln);background:#fff;user-select:none;-webkit-user-drag:none}
#hcap{position:absolute;left:12px;top:10px;max-width:80%;background:rgba(3,7,18,.9);border:2px solid var(--ln);border-radius:12px;padding:6px 14px;font-size:22px;font-weight:900;color:var(--gold)}
#panel{background:var(--pn);border-left:3px solid var(--ln);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#0f1a3a;border:3px solid var(--ln);border-radius:18px;padding:12px 14px}.card h3{margin:0 0 8px;font-size:25px;color:var(--cy)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips.c3{grid-template-columns:1fr 1fr 1fr}.chips.c1{grid-template-columns:1fr}.chips button{font-size:21px;text-align:left;line-height:1.2;padding:6px 10px;min-height:58px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1e2b55}.row b{color:var(--gold);text-align:right}
.note{font-size:21px;color:var(--mu)}.big{font-size:30px;font-weight:900;color:var(--gold)}
.go{background:linear-gradient(#f59e0b,#ea580c);border-color:#fde68a;color:#111;font-size:25px;width:100%}
.prog{height:16px;border-radius:8px;background:#1e2b55;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#fde68a)}
.hi h4{margin:0 0 4px;font-size:27px;color:var(--gold)}.hi p{margin:0;font-weight:600}
.lab{font-size:20px;color:var(--mu);margin:8px 0 6px;font-weight:800}
input[type=range]{width:100%;height:56px;accent-color:#fbbf24}
.jung{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #2a3a66}.jung i{font-style:normal;flex-shrink:0;background:#1d4ed8;color:#fff;border-radius:10px;padding:2px 10px;font-size:20px;font-weight:900}.jung span{font-size:21px}
.q p{margin:4px 0 10px;font-weight:800;color:var(--gold)}.q .o{display:block;width:100%;text-align:left;margin-bottom:10px;min-height:60px;padding:8px 14px;line-height:1.3}
.q .o.ok{border-color:var(--ok);background:#06301f}.q .o.no{border-color:var(--bad);background:#3a0b16}
.fb{padding:8px 12px;border-radius:12px;background:#0b2a22;border:2px solid var(--ok);margin-top:6px}.fb.no{background:#32101b;border-color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:20px}table.t td,table.t th{border:1px solid #2a3a66;padding:4px 6px;text-align:center}table.t th{background:#16224a;color:var(--cy)}
@media (max-width:980px){html,body{overflow:auto}header{height:auto;flex-wrap:wrap;padding:8px 12px}header h1{font-size:21px;white-space:normal}.tabs{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(var(--nt,4),1fr)}.tabs button{font-size:18px;padding:0 2px;min-width:0}
 #app{display:block;height:auto}#stage{height:62vh;min-height:430px}#panel{border-left:0;border-top:3px solid var(--ln);overflow:visible}#hcap{font-size:18px}}

body{display:flex;flex-direction:column}header{flex:0 0 auto;min-height:76px;height:auto;padding:6px 16px}header h1{flex:1 1 0}.tabs{flex:0 1 auto;max-width:calc(100% - 250px);flex-wrap:wrap;justify-content:flex-end;padding:4px 0}.tabs button{font-size:20px;padding:0 11px}
@media (max-width:980px){.tabs{max-width:none;grid-template-columns:repeat(3,1fr)}.tabs button{font-size:17px;padding:2px 4px;white-space:normal;line-height:1.15;min-height:56px}}
#app{flex:1 1 auto;height:auto;min-height:0}
#ig,#lb{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#ig{background:radial-gradient(ellipse at 20% 0%,#2a1146 0%,#0b1430 45%,#050a18 100%);padding:18px}
.igw{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ig-top{display:flex;gap:16px;align-items:center}.ig-badge{flex:0 0 auto;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a855f7,#6b21a8);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:21px;padding:10px;line-height:1.15;box-shadow:0 0 0 4px rgba(192,132,252,.35)}
.ig-top h2{margin:0;font-size:34px;line-height:1.2;color:#fff}.ig-top p{margin:6px 0 0;font-size:23px;color:#cbd5e1}
.ig-main{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.ig-fig{margin:0;background:#050a18;border:3px solid #3b4a7a;border-radius:18px;overflow:hidden;cursor:zoom-in}.ig-fig img{width:100%;display:block;max-height:56vh;object-fit:contain}.ig-fig figcaption{padding:8px 14px;font-size:21px;color:var(--gold);font-weight:800;background:#0b1430}
.ig-side{display:flex;flex-direction:column;gap:12px}
.ig-key{background:linear-gradient(135deg,#4c1d95,#86198f);border:3px solid #e879f9;border-radius:18px;padding:12px 14px;text-align:center}.ig-key b{display:block;font-size:34px;line-height:1.2;color:#fde047;font-family:Georgia,"Times New Roman",serif}.ig-key span{display:block;font-size:21px;margin-top:4px;color:#fae8ff}
.ig-step{display:flex;gap:12px;align-items:center;background:#0f1a3a;border:2px solid #2a3a66;border-radius:14px;padding:8px 12px;position:relative}.ig-step em{font-style:normal;flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:#f59e0b;color:#111;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:22px}.ig-step i{font-style:normal;font-size:34px;flex:0 0 auto}.ig-step b{color:#7dd3fc;font-size:22px;display:block;line-height:1.2}.ig-step span{font-size:20px;color:#e2e8f0;display:block;line-height:1.3}
.ig-step+.ig-step::before{content:'▼';position:absolute;top:-17px;left:22px;font-size:14px;color:#f59e0b}
.ig-h{font-size:24px;font-weight:900;color:#7dd3fc;margin:4px 0 -4px}
.ig-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ig-card{background:#0f1a3a;border:3px solid #2a3a66;border-radius:16px;overflow:hidden}.ig-card.z{cursor:zoom-in}.ig-card img{width:100%;height:170px;object-fit:cover;display:block;background:#000}.ig-card .ico{height:96px;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(#16224a,#0f1a3a)}.ig-card .tx{padding:8px 12px 10px}.ig-card b{color:var(--gold);font-size:22px;display:block;line-height:1.25}.ig-card span{font-size:20px;line-height:1.3;display:block;margin-top:2px}
.ig-film{border-left:8px solid #f59e0b;background:rgba(245,158,11,.12);padding:10px 14px;border-radius:12px;font-size:22px}
.ig-bars{background:#0f1a3a;border:3px solid #2a3a66;border-radius:18px;padding:12px 14px}.ig-bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:20px}.ig-bar s{text-decoration:none;display:block;height:30px;border-radius:8px;background:linear-gradient(90deg,#38bdf8,#a855f7)}.ig-bar b{color:var(--gold);text-align:right}
.ig-tlw{overflow-x:auto;padding-bottom:6px}.ig-tl{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(118px,1fr));gap:6px;min-width:calc(var(--n) * 124px)}.ig-tl::before{content:'';position:absolute;left:0;right:0;top:44px;height:6px;background:linear-gradient(90deg,#7e3a8f,#c084fc);border-radius:3px}
.ig-tl div{position:relative;text-align:center}.ig-tl b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:25px;color:#e9d5ff;height:36px;white-space:nowrap}.ig-tl i{display:block;width:20px;height:20px;margin:1px auto 6px;border-radius:50%;background:#fff;border:4px solid #a855f7;position:relative;z-index:1}.ig-tl div.on i{background:#fde047;transform:scale(1.35)}.ig-tl span{font-size:19px;color:#e2e8f0;display:block;line-height:1.25}
#lb{background:rgba(2,6,18,.96);z-index:5;cursor:zoom-out;align-items:center;justify-content:center;flex-direction:column;padding:12px}#lb img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain;border-radius:12px;border:3px solid #3b4a7a}#lb div{color:var(--gold);font-size:22px;font-weight:900;margin-top:8px;text-align:center}
.card.fig{padding:8px;cursor:zoom-in}.card.fig img{width:100%;max-height:230px;object-fit:contain;display:block;border-radius:12px;background:#000}.card.fig div{font-size:21px;font-weight:800;color:var(--gold);margin-top:6px;line-height:1.3}.card.fig small{display:block;font-size:18px;color:var(--mu);font-weight:600}
@media (max-width:980px){body{display:block}.ig-main{grid-template-columns:1fr}.ig-top h2{font-size:27px}.ig-badge{width:84px;height:84px;font-size:17px}#ig{padding:12px}.ig-bar{grid-template-columns:110px 1fr 60px;font-size:18px}}
</style>
</head>

cards:[{img:'rocket',t:'뉴턴 vs 아인슈타인',d:'뉴턴: 30 − 24 = 6만 km/s? 실제: 언제나 30만 km/s'},{img:'einstein',t:'1905 기적의 해',d:'광양자 가설 · 브라운 운동 · 특수 상대성 이론 · E=mc²'},{ico:'⚛️',t:'뮤온의 증거',d:'수명이 짧은 뮤온이 지표까지 날아오는 것은 시간 지연 때문'},{ico:'✈️',t:'비행기 원자시계 실험',d:'1971년, 비행기에 실은 원자시계가 실제로 다르게 갔다'}],
film:'〈인터스텔라〉에서 쿠퍼와 딸의 나이가 뒤바뀌는 장면 — 시간이 사람마다 다르게 흐를 수 있다는 상대성 이론의 상상이에요.',
tl:[['1887','마이컬슨-몰리 실험'],['1904','로런츠 변환'],['1905','특수 상대성 이론',1],['1908','민코프스키 4차원 시공간'],['1971','원자시계 비행 실험']]};
LAB.figs=[['clock_p','A가 본 B의 시계는 느리게 간다 (시간 지연)'],['clock_p','A가 본 로켓은 운동 방향으로 짧아진다 (길이 수축)'],['einstein','아인슈타인: 움직이는 사람의 시간은 느리게 흐른다']];

</script>
<script>
(function(){
const IMG=window.IMGS.img||{},CAP=window.IMGS.cap||{};
(LAB.figs||[]).forEach((f,i)=>{if(f&&LAB.tabs[i])LAB.tabs[i]._fig=f;});
const T=(LAB.ig?[{nm:'🧭 한눈에 보기',ig:true}]:[]).concat(LAB.tabs,[{nm:'📖 자료',hero:true},{nm:'❓ 퀴즈',quiz:true}]);
const OFS=LAB.ig?1:0;
function lb(k,c){const e=$('#lb');e.innerHTML=`<img src="${IMG[k]}" alt=""><div>${c||CAP[k]||''}</div>`;e.style.display='flex';e.onclick=()=>{e.style.display='none';};}
window.__lb=lb;
function figHTML(k,c){return `<figure class="ig-fig" data-z="${k}"><img src="${IMG[k]}" alt=""><figcaption>🔍 ${c||CAP[k]||''}</figcaption></figure>`;}
function igHTML(g){const tl=g.tl||[];let h=`<div class="igw"><div class="ig-top"><div class="ig-badge">${g.badge}</div><div><h2>${g.head}</h2><p>${g.lead}</p></div></div>`;
 const side=(g.key?`<div class="ig-key"><b>${g.key[0]}</b><span>${g.key[1]}</span></div>`:'')+(g.steps?`<div class="ig-h">${g.stepsH||'🧩 원리 따라가기'}</div>`+g.steps.map((s,i)=>`<div class="ig-step"><em>${i+1}</em><i>${s[0]}</i><div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join(''):'');
 const main=g.hero?figHTML(g.hero[0],g.hero[1]):g.bars?`<div class="ig-bars"><div class="ig-h" style="margin:0 0 6px">${g.bars.t}</div>${g.bars.rows.map(r=>`<div class="ig-bar"><span>${r[0]}</span><s style="width:${Math.max(1.5,r[1])}%"></s><b>${r[2]}</b></div>`).join('')}<div class="note">${g.bars.n||''}</div></div>`:'';
 h+=`<div class="ig-main">${main}<div class="ig-side">${side}</div></div>`;
 if(g.cards)h+=`<div class="ig-h">${g.cardsH||'🖼️ 그림으로 더 알아보기'}</div><div class="ig-cards">${g.cards.map(c=>`<div class="ig-card ${c.img?'z':''}" ${c.img?`data-z="${c.img}"`:''}>${c.img?`<img src="${IMG[c.img]}" alt="">`:`<div class="ico">${c.ico}</div>`}<div class="tx"><b>${c.t}</b><span>${c.d}</span></div></div>`).join('')}</div>`;
 if(g.film)h+=`<div class="ig-film">🎬 ${g.film}</div>`;
 if(tl.length)h+=`<div class="ig-h">🕰️ 과학사 타임라인</div><div class="ig-tlw"><div class="ig-tl" style="--n:${tl.length}">${tl.map(t=>`<div class="${t[2]?'on':''}"><b>${t[0]}</b><i></i><span>${t[1]}</span></div>`).join('')}</div></div>`;
 return h+'</div>';}
function igPanel(){const g=LAB.ig;$('#panel').innerHTML=hi('🧭 한눈에 보기',g.tip||'그림과 순서도로 이번 차시의 핵심을 먼저 살펴보고, 아래 실험으로 직접 확인해요. 그림을 누르면 크게 볼 수 있어요.')
 +card('🔬 실험하러 가기',chips(LAB.tabs.map(t=>'▶ '+t.nm),-1,'gt','c1'))
 +card('📌 이번 차시 핵심',LAB.sum.map(s=>`<div class="row" style="justify-content:flex-start"><span>✔ ${s}</span></div>`).join(''));
 on('gt',i=>setTab(i+OFS));}
function figWrap(t){return ()=>{t.panel();const f=t._fig;if(!f||!IMG[f[0]])return;const p=$('#panel');const d=document.createElement('div');d.className='card fig';d.innerHTML=`<img src="${IMG[f[0]]}" alt=""><div>🖼️ ${f[1]}<small>그림을 누르면 크게 보여요 · 자료: ${CAP[f[0]]||''}</small></div>`;d.onclick=()=>lb(f[0],f[1]);p.appendChild(d);};}
$('#ig').addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(z)lb(z.dataset.z);});
const st={tab:0,img:0,qi:0,qa:{},done:false};
$('#ttl').innerHTML=LAB.title+'<small>'+LAB.sub+'</small>';
document.documentElement.style.setProperty('--nt',Math.min(T.length,4));
$('#tabs').innerHTML=T.map((t,i)=>`<button data-t="${i}">${t.nm}</button>`).join('');
$$('#tabs button').forEach(b=>b.onclick=()=>setTab(+b.dataset.t));
function fitHero(){if($('#hero').style.display!=='flex')return;const im=$('#himg');const nw=im.naturalWidth||4,nh=im.naturalHeight||3;const r=$('#stage').getBoundingClientRect(),pad=14;const k=Math.min((r.width-pad*2)/nw,(r.height-pad*2)/nh);$('#hw').style.width=nw*k+'px';$('#hw').style.height=nh*k+'px';}
function showImg(k){const im=$('#himg');im.onload=fitHero;im.src=IMG[k];if(im.complete)fitHero();$('#hcap').textContent='자료: '+(CAP[k]||'');}
function bookPanel(){const ks=LAB.imgs||[];
 $('#panel').innerHTML=(ks.length?card('🖼️ 자료 그림 (영화 포스터 · Newton Special 드라마틱 물리)',chips(ks.map(k=>CAP[k]),st.img,'im','c1')):'')
 +card('🔗 중학교에서 배운 내용과 연결',LAB.jung.map(j=>`<div class="jung"><i>${j[0]}</i><span><b style="color:#fde68a">${j[1]}</b><br>${j[2]}</span></div>`).join(''))
 +card('📌 이번 차시 핵심 정리',LAB.sum.map(s=>`<div class="row" style="justify-content:flex-start"><span>✔ ${s}</span></div>`).join(''))
 +(LAB.next?card('➡️ 다음 차시',`<div class="note" style="color:#e2e8f0">${LAB.next}</div>`):'');
 on('im',i=>{st.img=i;showImg(ks[i]);bookPanel();});}
function quizPanel(){const Q=LAB.quiz,s=st;
 if(s.done){const sc=Q.filter((q,i)=>s.qa[i]===q.a).length;$('#panel').innerHTML=hi('🏁 결과',`<span class="big">${sc} / ${Q.length}</span><br>${sc===Q.length?'완벽해요! 🎉':sc>=Q.length*.6?'잘했어요! 틀린 문제의 실험을 다시 해 봐요.':'실험 탭을 다시 해 보고 도전해요!'}`)+'<button class="go" id="re">🔁 다시 풀기</button>';$('#re').onclick=()=>{s.qi=0;s.qa={};s.done=false;quizPanel();};return;}
 const q=Q[s.qi],ans=s.qa[s.qi];
 $('#panel').innerHTML=card(`❓ ${s.qi+1} / ${Q.length}`,`<div class="prog"><i style="width:${s.qi/Q.length*100}%"></i></div>`)+`<div class="card q"><p>${q.t}</p>${q.o.map((o,i)=>`<button class="o ${ans!=null?(i===q.a?'ok':(i===ans?'no':'')):''}" data-o="${i}" ${ans!=null?'disabled':''}>${'①②③④'[i]} ${o}</button>`).join('')}${ans!=null?`<div class="fb ${ans===q.a?'':'no'}">${ans===q.a?'⭕ 정답!':'❌ 아쉬워요.'} ${q.w}</div><button class="go" id="nq" style="margin-top:10px">${s.qi<Q.length-1?'다음 문제 ▶':'결과 보기 🏁'}</button>`:''}</div>`;
 on('o',i=>{s.qa[s.qi]=i;quizPanel();});const n=$('#nq');if(n)n.onclick=()=>{if(s.qi<Q.length-1)s.qi++;else s.done=true;quizPanel();$('#panel').scrollTop=0;};}
function resize(){const r=$('#stage').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(300,r.width);H=Math.max(300,r.height);cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);fitHero();const t=T[st.tab];if(t&&t.resize)t.resize();}
function setTab(i){st.tab=i;const t=T[i];$$('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));const h=t.hero||t.quiz;$('#hero').style.display=h?'flex':'none';cv.style.display=(h||t.ig)?'none':'block';
 $('#lb').style.display='none';const ig=$('#ig');if(t.ig){if(!ig.dataset.ok){ig.innerHTML=igHTML(LAB.ig);ig.dataset.ok=1;}ig.style.display='block';ig.scrollTop=0;}else ig.style.display='none';
 RUN.panel=t.ig?igPanel:t.hero?bookPanel:t.quiz?quizPanel:(t._fig?figWrap(t):t.panel);resize();
 if(t.hero||t.quiz){const ks=LAB.imgs||[];if(ks.length)showImg(ks[t.hero?st.img:0]);}
 if(t.enter)t.enter();RUN.panel();$('#panel').scrollTop=0;}
RUN.go=setTab;
window.addEventListener('resize',resize);
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
let drag=false;
cv.addEventListener('pointerdown',e=>{const t=T[st.tab];if(!t.down)return;drag=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}t.down(...pos(e));});
cv.addEventListener('pointermove',e=>{const t=T[st.tab];if(t.move)t.move(...pos(e),drag);});
cv.addEventListener('pointerup',e=>{drag=false;const t=T[st.tab];if(t.up)t.up(...pos(e));});
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;TM+=dt;const t=T[st.tab];
 if(t.draw){cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle=t.bg||'#050a18';cx.fillRect(0,0,W,H);t.draw(dt);}
 requestAnimationFrame(loop);}
if(LAB.init)LAB.init();setTab(0);requestAnimationFrame(loop);
window.__lab={st,setTab,LAB};
})();
</script>
</body>
</html>
