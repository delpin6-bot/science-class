<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:clamp(16px,1.6vw,20px);line-height:1.55;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:6px clamp(8px,2vw,16px);background:#02040c;border-bottom:1px solid var(--ln);flex-wrap:wrap}
header h1{margin:0;font-size:clamp(16px,2.3vw,22px);flex:1;min-width:200px}
.hb{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}

.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;min-width:0}
.card h2{margin:0 0 8px;font-size:1.1em}
canvas{width:100%;aspect-ratio:16/10;display:block;border-radius:14px;background:#01020a;border:1px solid var(--ln)}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:50px;padding:0 16px;border-radius:14px;border:2px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:800;cursor:pointer;font-family:inherit;font-size:1em}
.btn.on{background:#fff;color:#050816;border-color:#fff}
.btn.pri{background:linear-gradient(#5eead4,#0d9488);color:#022c26;border-color:#99f6e4}
.btn.wr{background:linear-gradient(#fbbf24,#d97706);color:#2b1700;border-color:#fde68a}
.grp{margin:4px 0 2px;color:var(--mu);font-weight:800;font-size:.9em}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.dest .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;min-height:72px;font-size:.95em;line-height:1.25}
.dest .btn i{font-style:normal;font-size:1.6em}.dest .btn.vis{border-color:var(--ok)}
#hud{margin:0;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,"Noto Sans KR",monospace;font-size:.88em;color:#c9f7ee;line-height:1.6}
.fact{display:flex;gap:10px;align-items:flex-start;background:#0a1230;border-radius:12px;padding:8px 10px;margin:6px 0}
.fact b{color:#fff}.fact i{font-style:normal;font-size:1.5em}
.tbar{height:22px;border-radius:11px;background:linear-gradient(90deg,#8fb4ff,#e0ecff 28%,#fff6c8 50%,#ffc66e 72%,#ff6a4a);position:relative;margin:14px 6px 4px}
.tbar span{position:absolute;top:-8px;width:6px;height:38px;background:#fff;border:2px solid #000;border-radius:3px;transform:translateX(-3px)}
.tl{display:flex;justify-content:space-between;font-size:.8em;color:var(--mu)}
#log{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.msg{background:#0a1230;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;font-size:.95em;white-space:pre-wrap}
.msg.ok{border-color:var(--ok)}.msg.no{border-color:var(--no)}.msg.wa{border-color:var(--wa)}
.q{background:#0a1230;border-left:5px solid var(--ac);border-radius:10px;padding:10px 12px;margin:8px 0}
.q .opts{display:grid;gap:8px;margin-top:8px}
.stars{font-size:1.4em;letter-spacing:2px}
.chk{margin:3px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs .btn{flex:1;min-height:44px;padding:0 6px;font-size:.92em}
.gauge{height:26px;border-radius:13px;background:linear-gradient(90deg,#34d399 0 50%,#fbbf24 50% 75%,#f87171 75%);position:relative;margin:10px 0}
.gauge b{position:absolute;top:-6px;width:8px;height:38px;background:#fff;border:2px solid #000;border-radius:4px;transform:translateX(-4px)}
input[type=range]{width:100%;height:34px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1}
</style></head><body>
<header><h1>🚀 스페이스엔진 우주 탐사 <span style="font-size:.7em;color:var(--ac)">쉬운 판 · 중1</span></h1>

 <div class="card"><canvas id="cv" width="960" height="600"></canvas>

 <div class="card"><h2>💬 항법 AI 아스트라</h2><div id="log"></div></div>
</div>
</main><div id="toast"></div>

(()=>{'use strict';

 const g=c.createRadialGradient(x,y,r*.1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.6,rgb(col));g.addColorStop(1,rgb(col.map(v=>v*.7)));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();

 c.strokeStyle=rgb(col,.5);c.lineWidth=2;for(let k=0;k<4;k++){const a=k*Math.PI/2+.4;c.beginPath();c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);c.lineTo(x+Math.cos(a)*r*3.4,y+Math.sin(a)*r*3.4);c.stroke()}}

 if(o.id==='m42'){for(let i=0;i<40;i++){const a=R()*6.28,d=Math.pow(R(),.7)*250;glow(x+Math.cos(a)*d*1.3,y+Math.sin(a)*d*.8,60+R()*110,R()<.7?[235,70,110]:[90,170,230],.2+R()*.15)}glow(x,y,90,[255,210,235],.6);for(let i=0;i<4;i++){c.fillStyle='#fff';c.beginPath();c.arc(x+(R()-.5)*26,y+(R()-.5)*18,3,0,7);c.fill()}txt('👶 새로 태어난 아기별들',x,y-46,22,'#ffd0e4')}
