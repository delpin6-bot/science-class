  $$('#pres1 .btn').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.d-d)<.01))}
function drawView1(){const cv=$('#c1v'),{g,w,h}=fit(cv);g.fillStyle='#f1f5f9';g.fillRect(0,0,w,h);const H=h-44,gyv=h-16,d=M1.d,r=(M1.h/d)/(4/5),hpL=Math.min(H,H*.7*r),cc=H/6.5;
