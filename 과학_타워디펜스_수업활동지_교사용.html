  var out=new Uint8Array(32); for(i=0;i<8;i++){ out[i*4]=H[i]>>>24; out[i*4+1]=(H[i]>>>16)&255; out[i*4+2]=(H[i]>>>8)&255; out[i*4+3]=H[i]&255; } return out;
}
var enc=new TextEncoder();
function cat(a,b){ var r=new Uint8Array(a.length+b.length); r.set(a); r.set(b,a.length); return r; }
function kdf(pw){ var s=enc.encode(SALT), h=sha256(enc.encode(SALT+pw)); for(var i=0;i<ITER;i++) h=sha256(cat(h,s)); return h; }
function decrypt(pw){
  var key=kdf(pw), bin=atob(DATA), ct=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) ct[i]=bin.charCodeAt(i);
  var pt=new Uint8Array(ct.length), c=0, j=0;
  while(j<ct.length){ var blk=sha256(cat(key,new Uint8Array([c>>>24,(c>>>16)&255,(c>>>8)&255,c&255]))); for(var k=0;k<32&&j<ct.length;k++,j++) pt[j]=ct[j]^blk[k]; c++; }
  var txt=new TextDecoder().decode(pt);
  return txt.indexOf(MAGIC)===0 ? txt.slice(MAGIC.length) : null;
}
function open(pw, remember){
  var html=decrypt(pw);
  if(!html){ document.getElementById("err").textContent="암호가 맞지 않아요."; return false; }
  try{ sessionStorage.setItem(LS,pw); if(remember) localStorage.setItem(LS,pw); }catch(e){}
  document.open(); document.write(html); document.close(); return true;
}
document.getElementById("f").onsubmit=function(e){ e.preventDefault(); open(document.getElementById("pw").value, document.getElementById("rem").checked); };
(function(){ var saved=null; try{ saved=sessionStorage.getItem(LS)||localStorage.getItem(LS); }catch(e){} if(saved && !open(saved,false)){ try{ localStorage.removeItem(LS); }catch(e){} document.getElementById("err").textContent=""; } })();
