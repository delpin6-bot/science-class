<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>별자리와 하루의 길이 가상실험</title>
<style>
:root{--bg:#030712;--pn:#0b1226;--ln:#2a3a66;--tx:#f1f5f9;--mu:#94a3b8;--gold:#fde68a;--cy:#7dd3fc;--ok:#34d399;--bad:#fb7185;--w:#7dd3fc;--e:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:24px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;min-height:56px;border-radius:14px;border:3px solid var(--ln);background:#111b3a;padding:0 14px;font-weight:800}
button:active{transform:scale(.97)}button.on{border-color:var(--gold);background:#2a2a10;color:var(--gold)}button:disabled{opacity:.45;cursor:default}
header{height:76px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:3px solid var(--ln);background:#050a1c}
header h1{font-size:29px;margin:0;white-space:nowrap}header h1 small{display:block;font-size:20px;color:var(--mu);font-weight:600}
.tabs{display:flex;gap:8px;margin-left:auto}.tabs button{min-height:60px;font-size:23px;padding:0 16px;white-space:nowrap}
#app{height:calc(100% - 76px);display:grid;grid-template-columns:1fr 480px}
#stage{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#panel{background:var(--pn);border-left:3px solid var(--ln);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#0f1a3a;border:3px solid var(--ln);border-radius:18px;padding:12px 14px}.card h3{margin:0 0 8px;font-size:26px;color:var(--cy)}
.card.w{border-color:#2b6f93}.card.w h3{color:var(--w)}.card.e{border-color:#8a6a12}.card.e h3{color:var(--e)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips.c3{grid-template-columns:1fr 1fr 1fr}.chips button{font-size:23px;line-height:1.2;padding:6px 10px;min-height:60px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1e2b55}.row b{color:var(--gold);text-align:right}
.note{font-size:22px;color:var(--mu)}.big{font-size:30px;font-weight:900;color:var(--gold)}
.go{background:linear-gradient(#f59e0b,#ea580c);border-color:#fde68a;color:#111;font-size:26px;width:100%}
input[type=range]{width:100%;height:56px;accent-color:#f59e0b}
.q p{margin:4px 0 10px;font-weight:800;color:var(--gold)}.q .o{display:block;width:100%;text-align:left;margin-bottom:10px;min-height:60px;padding:8px 14px;line-height:1.3}
.q .o.ok{border-color:var(--ok);background:#06301f}.q .o.no{border-color:var(--bad);background:#3a0b16}
.fb{padding:8px 12px;border-radius:12px;background:#0b2a22;border:2px solid var(--ok);margin-top:4px}.fb.no{background:#32101b;border-color:var(--bad)}
.prog{height:16px;border-radius:8px;background:#1e2b55;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#fde68a)}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-weight:800;margin:2px 4px 2px 0;font-size:22px}
.tag.w{background:#0c3a52;color:var(--w)}.tag.e{background:#4a3708;color:var(--e)}
#modal{position:fixed;inset:0;background:rgba(2,6,18,.96);z-index:50;display:none;flex-direction:column;padding:12px;gap:10px}
#modal .mt{display:flex;gap:8px;flex-wrap:wrap}#modal img{max-width:100%;max-height:calc(100% - 140px);object-fit:contain;margin:auto;border:3px solid var(--ln);border-radius:12px}
#modal .cap{font-size:24px;color:var(--gold);font-weight:800}
@media (max-width:980px){html,body{overflow:auto}header{height:auto;flex-wrap:wrap;padding:8px 12px}header h1{font-size:25px}.tabs{margin-left:0;width:100%}.tabs button{flex:1;font-size:20px;padding:0 2px;min-width:0}
 #app{display:block;height:auto}#stage{height:62vh;min-height:400px}#panel{border-left:0;border-top:3px solid var(--ln);overflow:visible}}
</style>
</head>
<body>
<header>
 <h1>🌌 별자리와 하루의 길이<small>중학교 1학년 · 별자리 · 황도 12궁 · 항성일과 태양일</small></h1>

</header>
