<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차시 연속 수업 코스</title>
<style>
:root{--ink:#1e1b4b;--mut:#64748b;--line:#e2e8f0;--pur:#7c3aed;--pur2:#ede9fe;--amb:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f8fafc;color:#0f172a;font:500 15px/1.55 -apple-system,"Pretendard","Malgun Gothic","맑은 고딕",sans-serif;-webkit-text-size-adjust:100%}
header.kc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.header-brand{display:flex;align-items:center;gap:10px}
.game-badge{font:800 12px/1 inherit;background:#f1f5f9;color:#475569;border-radius:8px;padding:5px 9px}
.game-title{font-weight:900;font-size:19px}
.unified-nav-actions{display:flex;align-items:center;gap:8px}
.btn-home{border:1px solid var(--line);background:#fff;border-radius:10px;height:32px;padding:0 12px;font:800 12.5px/1 inherit;cursor:pointer;color:#0f172a}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
h2{margin:0 0 10px;font-size:15px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:800 13.5px/1 inherit;cursor:pointer;color:#334155}
.chip[aria-pressed=true]{background:var(--pur);border-color:var(--pur);color:#fff}
select{width:100%;margin:10px 0;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:700 14px/1.2 inherit;background:#fff;color:#0f172a}
.list{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto;padding-right:2px}
.les{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;cursor:pointer;font:700 14px/1.35 inherit;color:#0f172a}
.les small{display:block;color:var(--mut);font-weight:700;font-size:12px}
.les[aria-pressed=true]{border-color:var(--pur);background:var(--pur2)}
.kicker{color:var(--mut);font-weight:800;font-size:13px}
h1{margin:2px 0 10px;font-size:26px;line-height:1.25;color:var(--ink)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.terms span{background:var(--pur2);color:#5b21b6;border-radius:8px;padding:4px 9px;font-weight:800;font-size:13px}
.go{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 14px}
.big{display:inline-block;background:var(--amb);color:#1f2937;text-decoration:none;font-weight:900;font-size:17px;border-radius:13px;padding:13px 22px;box-shadow:0 3px 0 #d97706}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 #d97706}
.note{color:var(--mut);font-size:13px}
.flow{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;background:#fff}
.step .ic{font-size:26px}
.step b{font-size:15.5px}
.step p{margin:0;color:var(--mut);font-size:13px}
.min{font-weight:900;color:#5b21b6;background:var(--pur2);border-radius:8px;padding:3px 8px;font-size:12.5px;margin-left:6px}
.step a.b{display:inline-block;background:var(--pur);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:9px 14px;white-space:nowrap}
.step.aux{background:#f8fafc;border-style:dashed}
.step.aux a.b{background:#fff;color:#5b21b6;border:1.5px solid #c4b5fd}
.same{margin-top:12px;background:#f0fdf4;border:1.5px solid #bbf7d0;color:#166534;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13.5px}
@media (max-width:860px){main{grid-template-columns:1fr}.list{max-height:34vh}h1{font-size:22px}.step{grid-template-columns:auto 1fr}.step .act{grid-column:1/-1}.step a.b{display:block;text-align:center}header.kc-head{padding:8px 12px}}
</style>
<style id="kjs-seg-style">
/* 서랍 전환 탭 — 4대 서랍 머리글과 같은 모양 */
.kjs-seg{display:inline-flex;align-items:center;gap:2px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:11px;padding:3px;flex:none}
.kjs-seg a{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:8px;text-decoration:none!important;color:#334155!important;
  font:800 12.5px/1 -apple-system,"Pretendard","Malgun Gothic","맑은 고딕",sans-serif;white-space:nowrap;background:transparent;border:0;box-shadow:none}
.kjs-seg a:hover{background:#fff}
.kjs-seg a.on{background:var(--c);color:#fff!important;box-shadow:0 1px 4px rgba(15,23,42,.18)}
@media (max-width:760px){.kjs-seg a .t{display:none}.kjs-seg a{padding:0 8px}}
:is(html,body).qr-focus-mode .kjs-seg{display:none!important}
@media print{.kjs-seg{display:none!important}}
</style>
</head>
<body>
<header class="kc-head">
  <div class="header-brand"><span class="game-badge">수업 게임</span><span class="game-title">차시 연속 수업 코스</span></div>
  <div class="header-actions unified-nav-actions">
    <nav class="kjs-seg" aria-label="서랍 이동"><a href="./통합_과학수업_서랍.html" class="btn-hub-main" style="--c:#4f46e5" title="과학수업 서랍">📚<span class="t"> 과학수업</span></a><a href="./45분_모듈러_수업서랍.html" class="btn-hub-mod" style="--c:#059669" title="45분 모듈러 서랍">⚡<span class="t"> 45분 모듈러</span></a><a href="./자바실험실_서랍.html" class="btn-hub-sim" style="--c:#2563eb" title="가상실험 서랍">🔬<span class="t"> 가상실험</span></a><a href="./시작하기_수업게임서랍.html" class="on" class="btn-hub-game on" style="--c:#7c3aed" title="수업게임 서랍" aria-current="page">🎮<span class="t"> 수업게임</span></a></nav>
  </div>
</header>
<main>
  <section class="card" aria-label="차시 고르기">
    <h2>① 오늘 수업할 차시 고르기</h2>
    <div class="chips" id="gr" role="group" aria-label="학년"></div>
    <select id="un" aria-label="대단원"></select>
    <div class="list" id="ls" role="list"></div>
  </section>
  <section class="card" id="dt" aria-live="polite"></section>
</main>
<script src="./sounds/kjs-lessons.js"></script>
<script src="./sounds/kjs-chain.js"></script>
<script>
(function(){
  "use strict";
  var LS = window.KJS_LESSONS || [], C = window.KJSChain, $ = function(i){ return document.getElementById(i); };
  var st = { g: "중1", u: "", id: "" };
  try { var sv = JSON.parse(localStorage.getItem("kc-course") || "{}"); if (sv.g) st.g = sv.g; if (sv.id) st.id = sv.id; } catch (e) {}
  var qid = new URLSearchParams(location.search).get("lc"); if (qid && C.find(qid)) st.id = qid;
  var cur = st.id && C.find(st.id); if (cur) { st.g = cur[1]; st.u = cur[2]; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function save(){ try { localStorage.setItem("kc-course", JSON.stringify({ g: st.g, id: st.id })); } catch (e) {} }
  function units(){ var o = []; LS.forEach(function(L){ if (L[1] === st.g && o.indexOf(L[2]) < 0) o.push(L[2]); }); return o; }
  function drawGrade(){
    var h = ""; ["중1","중2","중3"].forEach(function(g){ h += '<button class="chip" data-g="' + g + '" aria-pressed="' + (g === st.g) + '">' + g + '</button>'; });
    $("gr").innerHTML = h;
  }
  function drawUnit(){
    var us = units(); if (us.indexOf(st.u) < 0) st.u = us[0];
    $("un").innerHTML = us.map(function(u){ return '<option' + (u === st.u ? " selected" : "") + '>' + esc(u) + '</option>'; }).join("");
  }
  function lessons(){ return LS.filter(function(L){ return L[1] === st.g && L[2] === st.u; }); }
  function drawList(){
    var ls = lessons(); if (!ls.some(function(L){ return L[0] === st.id; })) st.id = ls[0][0];
    $("ls").innerHTML = ls.map(function(L){
      return '<button class="les" role="listitem" data-id="' + L[0] + '" aria-pressed="' + (L[0] === st.id) + '"><small>' + esc(L[3]) + '</small>' + esc(L[4]) + ' · ' + esc(L[5]) + '</button>';
    }).join("");
  }
  function drawDetail(){
    var L = C.find(st.id); if (!L) return;
    var h = '<div class="kicker">' + esc(L[1]) + ' · ' + esc(L[2]) + ' · ' + esc(L[3]) + '</div><h1>' + esc(L[4]) + ' · ' + esc(L[5]) + '</h1>';
    h += '<h2>이 차시의 핵심 개념 ' + L[6].length + '개 <span class="note">(네 게임이 모두 같은 개념을 씁니다)</span></h2><div class="terms">' + L[6].map(function(t){ return "<span>" + esc(t) + "</span>"; }).join("") + "</div>";
    h += '<div class="go"><a class="big" href="' + C.url(C.steps[0], L) + '">▶ 마인드맵부터 연속 시작</a><span class="note">끝나면 화면 위 띠의 “다음 ▶”으로 이어집니다</span></div>';
    h += '<h2>② 45분 수업 흐름</h2><ol class="flow">';
    h += '<li class="step aux"><span class="ic">💡</span><div><b>도입·동기유발<span class="min">3분</span></b><p>오개념 질문으로 시작</p></div><span class="act"><a class="b" href="./수업도입_동기유발_5대게임.html">열기</a></span></li>';
    C.steps.forEach(function(s, i){
      h += '<li class="step"><span class="ic">' + s.ic + '</span><div><b>' + (i + 1) + '. ' + s.nm + '<span class="min">' + s.min + '분</span></b><p>' + s.d + '</p></div><span class="act"><a class="b" href="' + C.url(s, L) + '">시작 ▶</a></span></li>';
    });
    h += '<li class="step aux"><span class="ic">📊</span><div><b>정리·피드백<span class="min">3분</span></b><p>오답률 1위 개념을 함께 짚기</p></div><span class="act"><a class="b" href="./교사대시보드.html">대시보드</a></span></li></ol>';
    h += '<div class="same">✔ 마인드맵 · 개념격추 · 개념수비대 · 골든벨의 개념과 문제가 이 차시 기준으로 같아, 게임을 바꿔도 다시 설명할 필요가 없어요.</div>';
    $("dt").innerHTML = h;
    try { history.replaceState(null, "", "?lc=" + st.id); } catch (e) {}
  }
  function all(){ drawGrade(); drawUnit(); drawList(); drawDetail(); save(); }
  $("gr").addEventListener("click", function(e){ var b = e.target.closest("[data-g]"); if (!b) return; st.g = b.dataset.g; st.u = ""; st.id = ""; all(); });
  $("un").addEventListener("change", function(){ st.u = this.value; st.id = ""; drawList(); drawDetail(); save(); });
  $("ls").addEventListener("click", function(e){ var b = e.target.closest("[data-id]"); if (!b) return; st.id = b.dataset.id; drawList(); drawDetail(); save(); });
  all();
})();
</script>
<script src="./sounds/kjs-topbar.js"></script>
</body>
</html>
