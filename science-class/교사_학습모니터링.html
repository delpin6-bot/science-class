<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>학습 모니터링 · 교사용</title>
<style id="unified-drawer-nav-style">
/* ==========================================================================
   통일화된 상단 네비게이션 서랍 링크 바 (Universal Drawer Navigation)
   ========================================================================== */
.unified-nav-actions, .header-actions, .nav-actions, .top-links {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  flex-wrap: wrap !important;
}

.btn-unified-nav {
  display: inline-flex !important;
  align-items: center !important;
  gap: 5px !important;
  padding: 6px 12px !important;
  border-radius: 8px !important;
  font-size: 13px !important;
  font-weight: 700 !important;
  text-decoration: none !important;
  border: 1px solid #cbd5e1 !important;
  background: #ffffff !important;
  color: #1e293b !important;
  cursor: pointer !important;
  white-space: nowrap !important;
  transition: all 0.15s ease !important;
  line-height: 1.4 !important;
  font-family: inherit !important;
  box-sizing: border-box !important;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04) !important;
}

.btn-unified-nav:hover {
  background: #f1f5f9 !important;
  border-color: #94a3b8 !important;
  color: #0f172a !important;
  transform: translateY(-1px) !important;
}

.btn-unified-nav.btn-hub-main {
  background: #eff6ff !important;
  border-color: #bfdbfe !important;
  color: #1d4ed8 !important;
}
.btn-unified-nav.btn-hub-main:hover {
  background: #2563eb !important;
  color: #ffffff !important;
  border-color: #2563eb !important;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25) !important;
}

.btn-unified-nav.btn-hub-sim {
  background: #fffbeb !important;
  border-color: #fde68a !important;
  color: #b45309 !important;
}
.btn-unified-nav.btn-hub-sim:hover {
  background: #f59e0b !important;
  color: #ffffff !important;
  border-color: #f59e0b !important;
  box-shadow: 0 2px 6px rgba(245, 158, 11, 0.25) !important;
}

.btn-unified-nav.btn-hub-game {
  background: #faf5ff !important;
  border-color: #e9d5ff !important;
  color: #7e22ce !important;
}
.btn-unified-nav.btn-hub-game:hover {
  background: #7c3aed !important;
  color: #ffffff !important;
  border-color: #7c3aed !important;
  box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25) !important;
}

.btn-unified-nav.btn-ws {
  background: #ecfdf5 !important;
  border-color: #a7f3d0 !important;
  color: #047857 !important;
}
.btn-unified-nav.btn-ws:hover {
  background: #059669 !important;
  color: #ffffff !important;
  border-color: #059669 !important;
}

.btn-unified-nav.btn-theory {
  background: #f8fafc !important;
  border-color: #cbd5e1 !important;
  color: #334155 !important;
}
.btn-unified-nav.btn-theory:hover {
  background: #e2e8f0 !important;
  color: #0f172a !important;
}

/* 통일된 게임 헤더 */
header.unified-game-header {
  background: #ffffff !important;
  border-bottom: 1.5px solid #e2e8f0 !important;
  padding: 10px 20px !important;
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
  flex-wrap: wrap !important;
  gap: 12px !important;
  position: relative !important;
  z-index: 100 !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03) !important;
}
header.unified-game-header .header-brand {
  display: flex !important;
  align-items: center !important;
  gap: 10px !important;
}
header.unified-game-header .game-badge {
  background: #f1f5f9 !important;
  color: #475569 !important;
  padding: 2px 8px !important;
  border-radius: 999px !important;
  font-size: 11px !important;
  font-weight: 800 !important;
}
header.unified-game-header .game-title {
  font-size: 18px !important;
  font-weight: 900 !important;
  color: #0f172a !important;
}
</style>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--acc:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Pretendard","Malgun Gothic","맑은 고딕",sans-serif;font-size:14.5px}
button,input,select{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.login{max-width:380px;margin:40px auto}
.login h2{margin:0 0 4px}.login p{color:var(--mut);margin:0 0 14px;font-size:13px}
.login input{width:100%;height:44px;border:1.5px solid #cbd5e1;border-radius:10px;padding:0 12px;margin-bottom:8px;font-size:15px}
.btn{height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font-weight:800;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.full{width:100%;height:46px}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:18px;margin:8px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar select{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-weight:700}
.bar .sp{flex:1}.bar .who{color:var(--mut);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--mut)}
.live i{width:9px;height:9px;border-radius:50%;background:#cbd5e1;display:inline-block}.live.on i{background:#22c55e;box-shadow:0 0 0 3px #bbf7d0}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.cls{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left}
.cls.on{border-color:var(--acc);box-shadow:0 0 0 2px #c7d2fe}
.cls h3{margin:0 0 6px;font-size:16px}.cls .m{display:flex;gap:12px;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.cls .m b{display:block;font-size:18px;color:var(--ink)}
.cls .w{font-size:12px;color:#9a3412;margin-top:4px;line-height:1.6}
.cls .w span{display:inline-block;background:#fff7ed;border:1px solid #fed7aa;border-radius:999px;padding:1px 8px;margin:2px 3px 0 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{height:30px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:9px 10px;border-bottom:1px solid #f1f5f9;text-align:left;white-space:nowrap;font-size:13.5px}
th{background:#f8fafc;color:var(--mut);font-size:12.5px;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right}
tr.row{cursor:pointer}tr.row:hover td{background:#f8fafc}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
.st.참여{background:#dcfce7;color:#166534}.st.저참여{background:#fef3c7;color:#92400e}.st.미참여{background:#fee2e2;color:#991b1b}
.pbar{display:inline-flex;align-items:center;gap:6px}.pbar i{display:inline-block;height:8px;border-radius:4px;background:#e2e8f0;width:70px;position:relative;overflow:hidden}
.pbar i b{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
tr.det td{background:#fafaff;white-space:normal}
.recent{display:grid;gap:4px;font-size:12.5px}.recent div{display:flex;gap:10px;flex-wrap:wrap}
.recent .t{color:var(--mut);min-width:78px}
.note{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;padding:14px 16px;line-height:1.7}
.note code{background:#fff;border:1px solid #fde68a;border-radius:6px;padding:1px 6px}
.empty{color:var(--mut);padding:30px;text-align:center}
@media (max-width:640px){.bar .sp{display:none}}
</style>

<style id="kjs-seg-style">
/* 서랍 전환 탭 — 4대 서랍 머리글과 같은 모양 */
.kjs-seg{display:inline-flex;align-items:center;gap:2px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:11px;padding:3px;flex:none}
.kjs-seg a{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:8px;text-decoration:none!important;color:#334155!important;
  font:800 12.5px/1 -apple-system,"Pretendard","Malgun Gothic","맑은 고딕",sans-serif;white-space:nowrap;background:transparent;border:0;box-shadow:none}
.kjs-seg a:hover{background:#fff}
.kjs-seg a.on{background:var(--c);color:#fff!important;box-shadow:0 1px 4px rgba(15,23,42,.18)}
@media (max-width:760px){.kjs-seg a .t{display:none}.kjs-seg a{padding:0 8px}}
:is(html,body).qr-focus-mode .kjs-seg{display:none!important}
@media print{.kjs-seg{display:none!important}}
</style>

<body>
<header class="unified-game-header">
  <div class="header-brand"><span class="game-badge">교사용</span><span class="game-title">학습 모니터링</span></div>
  <div class="header-actions unified-nav-actions">
    <a href="./교사_학습모니터링.html" class="btn-top btn-unified-nav"><span>📊 모니터링</span></a>
    <a href="./교사_명단올리기.html" class="btn-top btn-unified-nav"><span>👥 명단</span></a>
    <nav class="kjs-seg" aria-label="서랍 이동"><a href="./통합_과학수업_서랍.html" class="btn-hub-main" style="--c:#4f46e5" title="과학수업 서랍">📚<span class="t"> 과학수업</span></a><a href="./45분_모듈러_수업서랍.html" class="btn-hub-mod" style="--c:#059669" title="45분 모듈러 서랍">⚡<span class="t"> 45분 모듈러</span></a><a href="./자바실험실_서랍.html" class="btn-hub-sim" style="--c:#2563eb" title="가상실험 서랍">🔬<span class="t"> 가상실험</span></a><a href="./시작하기_수업게임서랍.html" class="btn-hub-game" style="--c:#7c3aed" title="수업게임 서랍">🎮<span class="t"> 수업게임</span></a></nav>
  </div>
</header>
<div class="wrap" id="app"></div>
<script>
"use strict";
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let ME = null, DATA = null, FILTER = { cls: "", status: "" }, SORT = { key: "", dir: 1 }, TIMER = null, OPEN = new Set();

function setupNote(){
  app.innerHTML = `<div class="note"><b>⚙️ 학습 기록 DB가 아직 연결되지 않았어요.</b><br>
   1) Supabase 프로젝트를 만들고 <code>db/schema_postgresql.sql</code> → <code>db/supabase_api.sql</code> 순서로 실행합니다.<br>
   2) <code>sounds/kjs-db-config.js</code> 에 Project URL 과 anon key 를 넣습니다.<br>
   3) Supabase Auth 에서 교사 계정을 만들고 <code>teachers</code>·<code>teacher_schools</code> 에 등록합니다.<br>
   자세한 방법은 저장소의 <code>db/README.md</code> 를 보세요.</div>`;
}
function loginView(msg){
  app.innerHTML = `<form class="card login" id="lf"><h2>👩‍🏫 교사 로그인</h2><p>학생들의 학습 기록을 보려면 교사 계정으로 로그인하세요.</p>
    <input id="em" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn pri full" type="submit">로그인</button><p class="err" id="le">${esc(msg || "")}</p></form>`;
  $("#lf").onsubmit = e => {
    e.preventDefault(); $("#le").textContent = "확인 중…";
    KJSDB.teacher.login($("#em").value.trim(), $("#pw").value).then(start).catch(x => $("#le").textContent = x.message);
  };
}
function start(){
  KJSDB.teacher.rpc("teacher_me", {}).then(me => {
    ME = me;
    if (!me.is_teacher) { app.innerHTML = `<div class="note">이 계정은 아직 교사로 등록되지 않았어요. 관리자가 <code>teachers</code>·<code>teacher_schools</code> 표에 등록해야 합니다.<br><button class="btn" id="lo">로그아웃</button></div>`; $("#lo").onclick = logout; return; }
    if (!me.schools.length) { app.innerHTML = `<div class="note">담당 학교가 없어요. <code>teacher_schools</code> 에 학교를 등록해 주세요.</div>`; return; }
    shell(); load();
  }).catch(e => loginView(e.message));
}
function logout(){ clearInterval(TIMER); KJSDB.teacher.logout(); loginView(""); }
function shell(){
  const years = ME.years.length ? ME.years : [KJSDB.config.year || new Date().getFullYear()];
  app.innerHTML = `
    <div class="bar">
      <select id="yr">${years.map(y => `<option>${y}</option>`).join("")}</select>
      <select id="sc">${ME.schools.map(s => `<option>${esc(s)}</option>`).join("")}</select>
      <select id="dy"><option value="7">최근 7일</option><option value="14">최근 14일</option><option value="30">최근 30일</option></select>
      <button class="btn" id="rf">↻ 새로고침</button>
      <label class="live" id="lv"><input type="checkbox" id="auto" hidden><i></i> 실시간(1분)</label>
      <span class="sp"></span><span class="who">${esc(ME.name)} 선생님</span>
      <button class="btn" id="csv">⬇ CSV</button><button class="btn" id="lo">로그아웃</button>
    </div>
    <div id="asof" class="who" style="margin:-4px 0 10px"></div>
    <div class="classes" id="classes"></div>
    <div class="filters" id="filters"></div>
    <div class="tbl" id="tbl"><div class="empty">불러오는 중…</div></div>`;
  ["#yr","#sc","#dy"].forEach(s => $(s).onchange = () => { FILTER.cls = ""; load(); });
  $("#rf").onclick = load; $("#lo").onclick = logout; $("#csv").onclick = csv;
  $("#lv").onclick = e => { e.preventDefault(); const on = !$("#lv").classList.contains("on"); $("#lv").classList.toggle("on", on); clearInterval(TIMER); if (on) TIMER = setInterval(load, 60000); };
}
function load(){
  const args = { p_year: +$("#yr").value, p_school: $("#sc").value, p_days: +$("#dy").value };
  KJSDB.teacher.rpc("teacher_monitor", args).then(d => {
    if (!d.ok) { $("#tbl").innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    DATA = d; render();
  }).catch(e => { if (/로그인/.test(e.message)) loginView(e.message); else $("#tbl").innerHTML = `<div class="empty">불러오지 못했어요: ${esc(e.message)}</div>`; });
}
const clsKey = c => c.grade + "-" + c.class_no;
function render(){
  $("#asof").textContent = `${DATA.as_of} 기준 · 최근 ${DATA.days}일 · 학생 ${DATA.students.length}명`;
  $("#classes").innerHTML = DATA.classes.map(c => `
    <button class="cls ${FILTER.cls === clsKey(c) ? "on" : ""}" data-c="${clsKey(c)}">
      <h3>${c.grade}학년 ${c.class_no}반</h3>
      <div class="m"><span>참여<b>${c.participation ?? 0}%</b></span><span>평균 진도<b>${c.avg_progress ?? 0}%</b></span><span>평균 점수<b>${c.avg_score ?? "-"}</b></span></div>
      <div class="m" style="margin:0">${c.active}/${c.students}명 활동</div>
      ${c.wrong_top.length ? `<div class="w">📌 많이 틀린 개념<br>${c.wrong_top.slice(0,3).map(w => `<span>${esc(w.concept)} ${w.count}회</span>`).join("")}</div>` : ""}
    </button>`).join("") || `<div class="empty">학생 명단이 없어요. [학생 명단 올리기]에서 먼저 올려 주세요.</div>`;
  document.querySelectorAll(".cls").forEach(b => b.onclick = () => { FILTER.cls = FILTER.cls === b.dataset.c ? "" : b.dataset.c; render(); });
  const cnt = s => DATA.students.filter(x => (!FILTER.cls || clsKey(x) === FILTER.cls) && x.status === s).length;
  $("#filters").innerHTML = [["", "전체"], ["참여", "참여 " + cnt("참여")], ["저참여", "저참여 " + cnt("저참여")], ["미참여", "미참여 " + cnt("미참여")]]
    .map(([v, l]) => `<button class="chip ${FILTER.status === v ? "on" : ""}" data-s="${v}">${l}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { FILTER.status = b.dataset.s; render(); });
  let rows = DATA.students.filter(x => (!FILTER.cls || clsKey(x) === FILTER.cls) && (!FILTER.status || x.status === FILTER.status));
  if (SORT.key) rows = rows.slice().sort((a, b) => ((a[SORT.key] ?? -1) > (b[SORT.key] ?? -1) ? 1 : (a[SORT.key] ?? -1) < (b[SORT.key] ?? -1) ? -1 : 0) * SORT.dir);
  const COLS = [["grade","학년"],["class_no","반"],["student_no","번호"],["name","이름"],["status","상태"],["activities","활동 수","num"],["active_days","활동일","num"],
                ["minutes","학습(분)","num"],["avg_score","평균 점수","num"],["avg_accuracy","정확도%","num"],["avg_progress","평균 진도"],["items_completed","완료 항목","num"],["last_activity","마지막 활동"]];
  $("#tbl").innerHTML = rows.length ? `<table><thead><tr>${COLS.map(([k, l, c]) => `<th class="${c || ""}" data-k="${k}">${l}${SORT.key === k ? (SORT.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead><tbody>${
    rows.map(x => `<tr class="row" data-id="${x.id}"><td>${x.grade}</td><td>${x.class_no}</td><td>${x.student_no}</td><td><b>${esc(x.name)}</b></td>
      <td><span class="st ${x.status}">${x.status}</span></td><td class="num">${x.activities}</td><td class="num">${x.active_days}</td><td class="num">${x.minutes}</td>
      <td class="num">${x.avg_score ?? "-"}</td><td class="num">${x.avg_accuracy ?? "-"}</td>
      <td><span class="pbar"><i><b style="width:${x.avg_progress}%"></b></i>${x.avg_progress}%</span></td><td class="num">${x.items_completed}/${x.items_started}</td><td>${x.last_activity || "-"}</td></tr>
      ${OPEN.has(x.id) ? `<tr class="det"><td colspan="13"><div class="recent">${x.recent.length ? x.recent.map(r => `<div><span class="t">${esc(r.at)}</span><b>${esc(r.content)}</b><span>${esc(r.lesson || "")}</span><span>${r.score != null ? "점수 " + r.score : ""}</span><span>${r.accuracy != null ? "정확도 " + r.accuracy + "%" : ""}</span><span>${r.progress != null ? "진도 " + r.progress + "%" : ""}</span></div>`).join("") : "이 기간 활동이 없어요."}</div></td></tr>` : ""}`).join("")
  }</tbody></table>` : `<div class="empty">조건에 맞는 학생이 없어요.</div>`;
  document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { SORT.dir = SORT.key === th.dataset.k ? -SORT.dir : 1; SORT.key = th.dataset.k; render(); });
  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => { const id = +tr.dataset.id; OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); render(); });
}
function csv(){
  if (!DATA) return;
  const H = ["학년","반","번호","이름","상태","활동 수","활동일","학습(분)","평균 점수","정확도%","평균 진도%","완료 항목","시작 항목","마지막 활동"];
  const L = [H].concat(DATA.students.map(x => [x.grade, x.class_no, x.student_no, x.name, x.status, x.activities, x.active_days, x.minutes, x.avg_score ?? "", x.avg_accuracy ?? "", x.avg_progress, x.items_completed, x.items_started, x.last_activity || ""]));
  const blob = new Blob(["\ufeff" + L.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `학습모니터링_${DATA.year}_${DATA.school}_${DATA.as_of.slice(0,10)}.csv`; a.click();
}
if (!window.KJSDB || !KJSDB.enabled) setupNote(); else if (KJSDB.teacher.session()) start(); else loginView("");
</script>
