body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Pretendard","Malgun Gothic","맑은 고딕",sans-serif;font-size:14.5px}
button,input,select{font:inherit}

<div class="wrap" id="app"></div>
<script>
"use strict";
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let ME = null, FILE = null, ROWS = [], SHA = "";

/* ── 열 이름 표준화 (roster_importer.py 와 같은 규칙) ── */
const ALIASES = { year:["연도","학년도","년도","year","academic_year"], school_name:["학교","학교명","school","school_name"],
  grade:["학년","grade"], class_no:["반","학급","class","class_no"], student_no:["번호","출석번호","번","no","number","student_no"],
  name:["이름","성명","학생명","name","student_name"], student_code:["학번","student_code","student_id"] };
const norm = h => String(h).replace(/[\s_\-()（）\[\]]/g, "").toLowerCase();
const LOOK = {}; Object.entries(ALIASES).forEach(([k, a]) => a.forEach(x => LOOK[norm(x)] = k));
const RANGE = { year:[2000,2100], grade:[1,6], class_no:[1,30], student_no:[1,60] };
const LABEL = { year:"연도", grade:"학년", class_no:"반", student_no:"번호" };
const toInt = v => { const m = String(v ?? "").match(/\d+/); return m ? +m[0] : null; };

function setupNote(){ app.innerHTML = `<div class="note"><b>⚙️ 학습 기록 DB가 아직 연결되지 않았어요.</b><br><code>sounds/kjs-db-config.js</code> 에 Supabase 주소와 anon key 를 넣은 뒤 다시 열어 주세요. (저장소의 <code>db/README.md</code> 참고)</div>`; }
function loginView(msg){
  app.innerHTML = `<form class="card login" id="lf"><h2>👩‍🏫 교사 로그인</h2><p>학생 명단은 교사 계정으로만 올릴 수 있어요.</p>
    <input id="em" type="email" placeholder="이메일" autocomplete="username" required><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn pri full" type="submit">로그인</button><p class="err" id="le">${esc(msg || "")}</p></form>`;
  $("#lf").onsubmit = e => { e.preventDefault(); $("#le").textContent = "확인 중…"; KJSDB.teacher.login($("#em").value.trim(), $("#pw").value).then(start).catch(x => $("#le").textContent = x.message); };
}
function start(){
  KJSDB.teacher.rpc("teacher_me", {}).then(me => {
    ME = me;
    if (!me.is_teacher) { app.innerHTML = `<div class="note">교사로 등록되지 않은 계정이에요. 관리자에게 <code>teachers</code> 등록을 요청하세요.</div>`; return; }
    view();
  }).catch(e => loginView(e.message));
}
function view(){
  const y = KJSDB.config.year || new Date().getFullYear();
  app.innerHTML = `
    <h2 class="t">👥 학생 명단 올리기</h2>
    <p class="lead">엑셀(.xlsx)·CSV·텍스트(.txt) 명단을 올리면 연도·학교가 없을 때 자동으로 만들고, 같은 학년·반·번호 학생은 새로 넣지 않고 갱신해요.<br>
      필요한 열: <b>학년 · 반 · 번호 · 이름</b> (연도·학교 열이 없으면 아래 기본값을 씁니다) &nbsp;<button class="btn" id="tpl" type="button">⬇ 양식 받기</button></p>
    <div class="card">
      <div class="grid">
        <label>기본 학년도<input id="dy" type="number" value="${y}" min="2000" max="2100"></label>
        <label>기본 학교<select id="ds">${ME.schools.map(s => `<option ${s === KJSDB.config.school ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
      </div>
      <div class="opt"><label><input type="checkbox" id="deact"> 이 파일의 학년·반에 없는 학생은 비활성(전학 등)</label>
        <label><input type="checkbox" id="force"> 이미 올린 파일도 다시 반영</label></div>
    </div>
    <label class="drop card" id="drop"><input type="file" id="fi" accept=".xlsx,.xls,.csv,.txt,.tsv" hidden>
      <b>📂 명단 파일을 끌어다 놓거나 눌러서 고르세요</b><small>xlsx · xls · csv · txt · tsv (한글 윈도우 CP949 텍스트도 됩니다)</small></label>
    <div id="pv"></div>`;
  const dz = $("#drop");
  $("#fi").onchange = e => { const f = e.target.files[0]; if (f) read(f); e.target.value = ""; };   // 같은 파일을 다시 골라도 읽히게
  ["dragover","dragenter"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove("over"); }));
  dz.addEventListener("drop", e => e.dataTransfer.files[0] && read(e.dataTransfer.files[0]));
  ["#dy","#ds"].forEach(s => $(s).onchange = () => FILE && read(FILE));
  $("#tpl").onclick = () => { const b = new Blob(["\ufeff학년,반,번호,이름,학번\n2,1,1,홍길동,20260201\n"], { type:"text/csv" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "학생명단_양식.csv"; a.click(); };
}

/* ── 파일 읽기 ── */
async function sha256Hex(buf){
  if (crypto.subtle) { const h = await crypto.subtle.digest("SHA-256", buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  let h = 2166136261; new Uint8Array(buf).forEach(b => { h ^= b; h = Math.imul(h, 16777619) >>> 0; }); return ("fnv" + h.toString(16)).padEnd(64, "0");
}
function decodeText(buf){
  for (const enc of ["utf-8", "euc-kr"]) {
    try { const t = new TextDecoder(enc, { fatal: true }).decode(buf); return t.replace(/^\ufeff/, ""); } catch(e) {}
  }
  throw new Error("글자 인코딩을 알 수 없어요(UTF-8 또는 CP949로 저장해 주세요).");
}
function parseText(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const head = lines[0] || "", seps = ["\t", ",", "|", ";"];
  const sep = seps.find(s => head.split(s).length > 1);
  const split = l => sep ? l.split(sep).map(x => x.trim().replace(/^"|"$/g, "")) : l.trim().split(/\s+/);
  const H = split(head); return lines.slice(1).map(l => { const v = split(l), o = {}; H.forEach((h, i) => o[h] = v[i]); return o; });
}
async function read(file){
  FILE = file; const pv = $("#pv"); pv.innerHTML = `<div class="card">읽는 중…</div>`;
  try {
    if (!file.size) throw new Error("빈 파일이에요.");
    const ext = (file.name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
    const buf = await file.arrayBuffer(); SHA = await sha256Hex(buf);
    let raw;
    if ([".xlsx", ".xls", ".xlsm"].includes(ext)) {
      if (!window.XLSX) throw new Error("엑셀 읽기 부품(xlsx.full.min.js)을 불러오지 못했어요.");
      const wb = XLSX.read(buf, { type: "array" }); raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, defval: "" });
    } else if ([".csv", ".txt", ".tsv"].includes(ext)) raw = parseText(decodeText(buf));
    else throw new Error(`지원하지 않는 형식이에요(${ext || "확장자 없음"}). xlsx·csv·txt 를 써 주세요.`);
    if (!raw.length) throw new Error("학생 행이 없어요.");
    validate(raw);
  } catch(e) { pv.innerHTML = `<div class="res no">❌ ${esc(e.message)}</div>`; }
}
function validate(raw){
  const dy = +$("#dy").value, ds = $("#ds").value;
  const cols = {}; Object.keys(raw[0]).forEach(h => { const k = LOOK[norm(h)]; if (k && !Object.values(cols).includes(k)) cols[h] = k; });
  const has = k => Object.values(cols).includes(k);
  const miss = ["grade","class_no","student_no","name"].filter(k => !has(k));
  if (miss.length) { $("#pv").innerHTML = `<div class="res no">❌ 필수 열이 없어요: ${miss.map(k => ({grade:"학년",class_no:"반",student_no:"번호",name:"이름"})[k]).join(", ")}<br><small>인식한 열: ${Object.keys(cols).map(esc).join(", ") || "없음"}</small></div>`; return; }
  const seen = {}; ROWS = raw.map((r, i) => {
    const o = { _row: i + 2 }; Object.entries(cols).forEach(([h, k]) => o[k] = r[h]);
    const out = { _row: i + 2, year: has("year") ? toInt(o.year) : dy, school_name: String((has("school_name") ? o.school_name : ds) || "").trim(),
                  name: String(o.name || "").trim(), student_code: String(o.student_code || "").trim() || null };
    let why = "";
    for (const k of ["grade","class_no","student_no"]) out[k] = toInt(o[k]);
    for (const k of ["year","grade","class_no","student_no"]) {
      if (out[k] == null) { why = `${LABEL[k]} 값이 비었거나 숫자가 아님`; break; }
      if (out[k] < RANGE[k][0] || out[k] > RANGE[k][1]) { why = `${LABEL[k]} 범위 오류(${out[k]})`; break; }
    }
    if (!why && !out.name) why = "이름이 비어 있음";
    if (!why && !out.school_name) why = "학교명이 비어 있음";
    if (!why && !ME.schools.includes(out.school_name)) why = `담당 학교가 아님(${out.school_name})`;
    out._why = why;
    if (!why) { const key = [out.year, out.school_name, out.grade, out.class_no, out.student_no].join("|"); if (seen[key]) seen[key]._dup = out._row; seen[key] = out; }
    return out;
  });
  const good = ROWS.filter(r => !r._why && !r._dup), bad = ROWS.filter(r => r._why), dup = ROWS.filter(r => r._dup);
  $("#pv").innerHTML = `<div class="card">
      <b>📄 ${esc(FILE.name)}</b>
      <div class="sum"><span>전체 ${ROWS.length}행</span><span class="g">✅ 올릴 학생 ${good.length}명</span>${bad.length ? `<span class="r">❌ 오류 ${bad.length}행</span>` : ""}${dup.length ? `<span class="y">↺ 파일 안 중복 ${dup.length}행(뒤 행 사용)</span>` : ""}</div>
      <div class="tbl"><table><thead><tr><th>행</th><th>연도</th><th>학교</th><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>확인</th></tr></thead><tbody>
      ${ROWS.map(r => `<tr class="${r._why ? "bad" : r._dup ? "dup" : ""}"><td>${r._row}</td><td>${r.year ?? ""}</td><td>${esc(r.school_name)}</td><td>${r.grade ?? ""}</td><td>${r.class_no ?? ""}</td><td>${r.student_no ?? ""}</td><td>${esc(r.name)}</td>
        <td>${r._why ? "❌ " + esc(r._why) : r._dup ? `↺ ${r._dup}행으로 대체` : "✅"}</td></tr>`).join("")}</tbody></table></div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center"><button class="btn pri" id="up" ${good.length ? "" : "disabled"}>⬆ ${good.length}명 DB에 올리기</button><span id="st" class="err" style="color:var(--mut)"></span></div>
    </div><div id="res"></div>`;
  $("#up").onclick = upload;
}
function upload(){
  const rows = ROWS.filter(r => !r._why && !r._dup).map(r => ({ year: r.year, school_name: r.school_name, grade: r.grade, class_no: r.class_no, student_no: r.student_no, name: r.name, student_code: r.student_code }));
  $("#up").disabled = true; $("#st").textContent = "올리는 중…";
  KJSDB.teacher.rpc("teacher_upsert_roster", { p_file_name: FILE.name, p_sha256: SHA, p_rows: rows, p_deactivate_missing: $("#deact").checked, p_force: $("#force").checked })
    .then(r => {
      $("#st").textContent = "";
      $("#res").innerHTML = r.ok
        ? `<div class="res ok">✅ 반영했어요 (업로드 #${r.import_id})<br>새로 추가 ${r.inserted}명 · 갱신 ${r.updated}명 · 비활성 ${r.deactivated}명${r.rejected.length ? ` · 서버에서 거절 ${r.rejected.length}행` : ""}</div>`
        : `<div class="res no">${r.duplicate ? "⏭" : "❌"} ${esc(r.error)}</div>`;
      $("#up").disabled = !r.ok ? false : true;
    }).catch(e => { $("#st").textContent = ""; $("#res").innerHTML = `<div class="res no">❌ ${esc(e.message)}</div>`; $("#up").disabled = false; });
}
if (!window.KJSDB || !KJSDB.enabled) setupNote(); else if (KJSDB.teacher.session()) start(); else loginView("");
</script>
<script src="./sounds/kjs-topbar.js"></script>
</body>
</html>
