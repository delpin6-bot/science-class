<style>
:root{ --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#fff; --blue:#2563eb; --amber:#d97706; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; font-size:15px; }
button,input{ font:inherit; }
.wrap{ max-width:1100px; margin:0 auto; padding:16px 16px 60px; }
h1{ font-size:24px; margin:14px 0 4px; }
.lead{ color:var(--muted); margin:0 0 14px; line-height:1.6; }
.box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
.base{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.base input{ flex:1 1 320px; min-width:0; padding:10px 12px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:15px; }
.base .st{ font-size:12.5px; }
.warn{ color:#b45309; font-weight:700; }
.ok{ color:#047857; font-weight:700; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.tab{ border:1.5px solid var(--ink); background:#fff; border-radius:999px; padding:8px 16px; font-weight:800; cursor:pointer; }
.tab[aria-pressed="true"]{ background:var(--ink); color:#fff; }
.row{ display:flex; gap:10px; align-items:flex-start; margin:6px 0; }
.lab{ flex:none; width:56px; padding-top:7px; font-size:12.5px; font-weight:800; color:var(--muted); }
.chips{ display:flex; gap:6px; flex-wrap:wrap; min-width:0; }
.chip{ border:1px solid #cbd5e1; background:#fff; border-radius:9px; padding:7px 12px; font-weight:700; font-size:13.5px; cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--blue); border-color:var(--blue); color:#fff; }
.chip.g[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); }
.actions{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px; }
.btn{ border:0; border-radius:10px; padding:9px 14px; font-weight:800; cursor:pointer; background:#e2e8f0; color:var(--ink); }

.card .qr svg{ width:100%; height:100%; }
.card .k{ font-size:11.5px; font-weight:800; color:#7c3aed; }
.card.unit .k{ color:#047857; }
.card .t{ font-size:13.5px; font-weight:800; line-height:1.35; }
.card .gm{ font-size:11.5px; color:var(--muted); }

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

const gameName = f => (CAT.games.find(g => g.file === f) || {}).nm || f.replace(".html","");
const gameIcon = f => (CAT.games.find(g => g.file === f) || {}).ic || "🎮";

/* ---------- 사이트 주소 ---------- */
const LS = "kjs-qr-base";
function normBase(u){ u = (u || "").trim(); if (!u) return ""; if (!/^https?:\/\//i.test(u)) u = "https://" + u; return u.replace(/[^/]*\.html.*$/,"").replace(/\/?$/,"/"); }
let BASE = "";
(function(){
  let saved = ""; try { saved = localStorage.getItem(LS) || ""; } catch(e){}
  if (/^https?:/.test(location.protocol)) BASE = normBase(location.href.split("?")[0]);
  else BASE = saved;
  $("baseInput").value = BASE;
  paintBase();
})();
function paintBase(){
  $("baseState").innerHTML = BASE
    ? '<span class="ok">✔ 이 주소로 QR을 만들어요: ' + esc(BASE) + '</span>'
    : '<span class="warn">⚠ 학생들이 접속할 온라인 주소(Netlify 등)를 먼저 입력하세요. 교실 PC 파일로 연 상태에서는 휴대폰이 접속할 수 없어요.</span>';
}
$("baseSave").onclick = () => {
  BASE = normBase($("baseInput").value);
  try { localStorage.setItem(LS, BASE); } catch(e){}
  $("baseInput").value = BASE; paintBase(); renderList();
};
$("baseInput").addEventListener("keydown", e => { if (e.key === "Enter") $("baseSave").click(); });
function urlFor(file, q){ return (BASE || "https://(사이트주소)/") + "go.html?f=" + hcode(file) + (q ? "&q=" + q : ""); }
function qrSvg(text, cell){
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  return qr.createSvgTag({ cellSize: cell || 4, margin: 2, scalable: true });
}

/* ---------- 탭·필터 상태 ---------- */
const S = { tab: "lesson", game: Object.keys(CAT.lessons)[0], grade: "중1", unit: "", labGrade: "중1", labUnit: "" };
try { Object.assign(S, JSON.parse(localStorage.getItem("kjs-qr-state") || "{}")); } catch(e){}
function saveS(){ try { localStorage.setItem("kjs-qr-state", JSON.stringify(S)); } catch(e){} }
const TABS = [["lesson","🎮 수업 게임 (차시별)"],["lab","🔬 자바실험실"],["games","📦 게임 첫 화면"]];
function unitsOf(list, g){
  const us = []; list.forEach(x => { if (x.grade === g && x.unit && !us.includes(x.unit)) us.push(x.unit); });
  const o = ORDER[g] || []; return us.sort((a,b) => ((o.indexOf(a)+1)||99) - ((o.indexOf(b)+1)||99));
}
function chip(text, on, cls, fn){ const b = document.createElement("button"); b.className = "chip " + (cls||""); b.textContent = text; b.setAttribute("aria-pressed", String(!!on)); b.onclick = fn; return b; }
function rowEl(label, kids){ const r = document.createElement("div"); r.className = "row"; r.innerHTML = '<span class="lab">' + label + '</span>'; const c = document.createElement("div"); c.className = "chips"; kids.forEach(k => c.appendChild(k)); r.appendChild(c); return r; }

function renderTabs(){
  const t = $("tabs"); t.innerHTML = "";
  TABS.forEach(([k,l]) => { const b = document.createElement("button"); b.className = "tab"; b.textContent = l; b.setAttribute("aria-pressed", String(S.tab === k)); b.onclick = () => { S.tab = k; saveS(); render(); }; t.appendChild(b); });
}
function renderFilters(){
  const f = $("filters"); f.innerHTML = ""; f.style.display = "";
  if (S.tab === "lesson") {
    if (!CAT.lessons[S.game]) S.game = Object.keys(CAT.lessons)[0];
    f.appendChild(rowEl("게임", Object.keys(CAT.lessons).map(file => chip(gameIcon(file) + " " + gameName(file), file === S.game, "", () => { S.game = file; S.unit = ""; saveS(); render(); }))));
    const items = CAT.lessons[S.game];
    const grades = ["중1","중2","중3"].filter(g => items.some(x => x.grade === g));
    if (!grades.includes(S.grade)) S.grade = grades[0];
    f.appendChild(rowEl("학년", grades.map(g => chip(g, g === S.grade, "g", () => { S.grade = g; S.unit = ""; saveS(); render(); }))));
    const us = unitsOf(items, S.grade); if (!us.includes(S.unit)) S.unit = us[0] || "";
    f.appendChild(rowEl("대단원", us.map(u => chip(u, u === S.unit, "", () => { S.unit = u; saveS(); render(); }))));
  } else if (S.tab === "lab") {
    const grades = ["중1","중2","중3"].filter(g => CAT.labs.some(x => x.grade === g));
    if (!grades.includes(S.labGrade)) S.labGrade = grades[0];
    f.appendChild(rowEl("학년", grades.map(g => chip(g, g === S.labGrade, "g", () => { S.labGrade = g; S.labUnit = ""; saveS(); render(); }))));
    const us = unitsOf(CAT.labs, S.labGrade); if (!us.includes(S.labUnit)) S.labUnit = "";
    f.appendChild(rowEl("단원", [chip("전체", !S.labUnit, "", () => { S.labUnit = ""; saveS(); render(); })].concat(us.map(u => chip(u, u === S.labUnit, "", () => { S.labUnit = u; saveS(); render(); })))));
  } else f.style.display = "none";
}

/* ---------- 목록 ---------- */
let SHOWN = [];
function entries(){
  if (S.tab === "lesson") {
    return CAT.lessons[S.game].filter(x => x.grade === S.grade && x.unit === S.unit)
      .map(x => ({ file: S.game, q: x.q, game: gameName(S.game), title: x.title, sub: x.grade + " · " + x.unit, kind: x.kind, group: x.kind === "unit" ? "" : (x.mid || "") }));
  }
  if (S.tab === "lab") {
    return CAT.labs.filter(x => x.grade === S.labGrade && (!S.labUnit || x.unit === S.labUnit))
      .map(x => ({ file: x.file, q: "", game: "자바실험실", title: (x.ic ? x.ic + " " : "") + x.title, sub: x.grade + " · " + x.unit, kind: "lesson", group: x.unit }));
  }
  const hubs = [["통합_과학수업_서랍.html","📚 과학수업 통합 서랍"],["시작하기_수업게임서랍.html","🎮 수업 게임 서랍"],["자바실험실_서랍.html","🔬 자바실험실 서랍"]];
  return hubs.map(([f,t]) => ({ file: f, q: "", game: "서랍", title: t, sub: "메인 메뉴", kind: "unit", group: "서랍" }))
    .concat(CAT.games.map(g => ({ file: g.file, q: "", game: "수업 게임", title: g.ic + " " + g.nm, sub: "게임 첫 화면(학생이 직접 차시 선택)", kind: "lesson", group: "수업 게임" })));
}
function renderList(){
  const box = $("list"); box.innerHTML = "";
  SHOWN = entries();
  if (!SHOWN.length) { box.innerHTML = '<p class="empty">이 조건에 해당하는 항목이 없어요.</p>'; return; }
  let curG = null, grid = null;
  SHOWN.forEach((e, i) => {
    if (e.group !== curG || !grid) {
      curG = e.group;
      if (e.group) { const h = document.createElement("div"); h.className = "midh"; h.textContent = e.group; box.appendChild(h); }
      grid = document.createElement("div"); grid.className = "grid"; box.appendChild(grid);
    }
    const c = document.createElement("div"); c.className = "card " + (e.kind || "");
    c.innerHTML = '<label><input type="checkbox" data-i="' + i + '"></label>' +
      (KIND[e.kind] ? '<span class="k">' + KIND[e.kind] + '</span>' : '') +
      '<div class="qr" title="크게 보기">' + qrSvg(urlFor(e.file, e.q), 3) + '</div>' +
      '<div class="t">' + esc(e.title) + '</div><div class="gm">' + esc(e.game) + '</div>' +
      '<button class="big" type="button">🔍 크게 보기</button>';
    c.querySelector(".qr").onclick = c.querySelector(".big").onclick = () => openBig(e);
    grid.appendChild(c);
  });
}
function render(){ renderTabs(); renderFilters(); renderList(); }

/* ---------- 크게 보기 ---------- */
function openBig(e){
  const url = urlFor(e.file, e.q);
  $("bGame").textContent = e.game; $("bTitle").textContent = e.title; $("bUnit").textContent = e.sub;
  $("bQr").innerHTML = qrSvg(url, 10); $("bUrl").textContent = url;
  $("ov").classList.add("on");
  if (!BASE) $("bUrl").innerHTML = '<span class="warn">⚠ 사이트 주소를 먼저 저장해야 학생들이 접속할 수 있어요.</span>';
}
$("bClose").onclick = () => $("ov").classList.remove("on");
$("ov").onclick = ev => { if (ev.target === $("ov")) $("ov").classList.remove("on"); };
document.addEventListener("keydown", ev => { if (ev.key === "Escape") $("ov").classList.remove("on"); });
$("bCopy").onclick = () => { const t = $("bUrl").textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { $("bCopy").textContent = "복사됨 ✔"; setTimeout(() => $("bCopy").textContent = "주소 복사", 1200); }).catch(() => prompt("주소를 복사하세요", t)); };

/* ---------- 인쇄 ---------- */
function printList(list){
  if (!list.length) { alert("인쇄할 QR을 먼저 선택하세요."); return; }
  if (!BASE && !confirm("사이트 주소가 비어 있어요. 이대로 인쇄하면 학생들이 접속할 수 없어요. 계속할까요?")) return;
  $("printArea").innerHTML = list.map(e =>
    '<div class="pc"><div class="pg">' + esc(e.game) + '</div><div class="pq">' + qrSvg(urlFor(e.file, e.q), 4) + '</div>' +
    '<div class="pt">' + esc((KIND[e.kind] ? KIND[e.kind].replace(/^\S+\s/,"") + " · " : "") + e.title) + '</div><div class="pu">' + esc(e.sub) + '</div></div>').join("");
  window.print();
}
$("printSel").onclick = () => printList([...document.querySelectorAll('#list input[type=checkbox]:checked')].map(c => SHOWN[+c.dataset.i]));
$("printAll").onclick = () => printList(SHOWN);
$("selAll").onclick = () => document.querySelectorAll('#list input[type=checkbox]').forEach(c => c.checked = true);
$("selNone").onclick = () => document.querySelectorAll('#list input[type=checkbox]').forEach(c => c.checked = false);

render();
</script>
<script>document.getElementById('kjsHome').addEventListener('click',function(){ location.reload(); });</script>
</body>
</html>
