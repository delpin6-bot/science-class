<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>과학 퍼즐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f2e7;
    --paper-line: #ddd4bd;
    --ink: #21301f;
    --ink-soft: #55624f;
    --membrane: #3f7568;
    --membrane-soft: #d9e6df;
    --nucleus: #6b5a92;
    --highlight: #e2ac35;
    --highlight-soft: #f6e2b0;
    --error: #b5533c;
    --card: #fffdf7;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 28px);
    background-size: 28px 28px;
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap{ max-width: 980px; margin: 0 auto; }

  header{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap: 14px; margin-bottom: 22px; border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
  }
  .title-block h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .title-block p{
    margin:0; color: var(--ink-soft); font-size: 14px;
  }
  .badge{
    display:inline-block; background: var(--membrane); color:#fff;
    font-size: 12px; font-weight:600; padding: 3px 10px; border-radius: 3px;
    margin-bottom: 8px;
  }

  .stats{
    display:flex; gap: 10px;
  }
  .stat{
    background: var(--card); border: 1.5px solid var(--ink);
    padding: 8px 16px; min-width: 84px; text-align:center;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .stat .n{ font-family:'Fraunces', serif; font-size: 22px; font-weight: 700; line-height:1.1; }
  .stat .l{ font-size: 11px; color: var(--ink-soft); margin-top:2px; }

  .board{
    display:grid; grid-template-columns: minmax(0,1.5fr) minmax(220px, 1fr);
    gap: 26px; align-items: start;
  }
  @media (max-width: 720px){ .board{ grid-template-columns: 1fr; } }

  .grid-card{
    background: var(--card); border: 1.5px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 18px; position:relative;
  }
  #grid{
    display:grid;
    gap: 2px;
    user-select:none;
    touch-action: none;
    width: 100%;
  }
  .cell{
    aspect-ratio: 1 / 1;
    display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size: clamp(12px, 2vw, 17px);
    background: transparent;
    border-radius: 3px;
    cursor: pointer;
    color: var(--ink);
    position: relative;
    transition: background-color .08s ease;
  }
  .cell.selecting{ background: var(--highlight-soft); }
  .cell.found{ background: var(--membrane-soft); color: var(--membrane); }
  .cell.found-alt{ background: #ece4f5; color: var(--nucleus); }
  .cell.wrong{ background: #f5d9d1; }

  .panel{
    background: var(--card); border: 1.5px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 18px 20px;
  }
  .panel h2{
    font-family:'Fraunces', serif; font-size: 18px; margin: 0 0 4px;
  }
  .panel .sub{ font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; }
  #wordlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  #wordlist li{
    font-size: 15px; font-weight: 600; padding: 7px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    display:flex; align-items:center; justify-content:space-between;
    color: var(--ink);
  }
  #wordlist li.done{
    text-decoration: line-through;
    color: #9aa495;
    border-color: transparent;
    background: #f1efe4;
  }
  #wordlist li .mark{ font-size: 12px; }

  #wordInput{
    width: 100%; resize: vertical; min-height: 90px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 13.5px;
    padding: 10px 11px; border: 1.5px solid var(--paper-line); border-radius: 4px;
    background: var(--paper); color: var(--ink); line-height: 1.5;
  }
  #wordInput:focus{ outline: none; border-color: var(--membrane); }
  .input-msg{ font-size: 12px; min-height: 16px; margin-top: 6px; color: var(--error); }
  .controls{ display:flex; gap:8px; margin-top:16px; flex-wrap: wrap; }
  button{
    font-family:'Noto Sans KR', sans-serif; font-weight:600; font-size: 13px;
    padding: 9px 14px; border-radius: 4px; cursor:pointer;
    border: 1.5px solid var(--ink); background: var(--card); color: var(--ink);
  }
  button.primary{ background: var(--ink); color: var(--paper); }
  button:active{ transform: translateY(1px); }

  .overlay{
    position: fixed; inset:0; background: rgba(33,48,31,0.55);
    display:none; align-items:center; justify-content:center; padding: 20px; z-index:10;
  }
  .overlay.show{ display:flex; }
  .modal{
    background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    max-width: 380px; width:100%; padding: 28px 26px; text-align:center;
  }
  .modal .badge{ background: var(--highlight); }
  .modal h2{ font-family:'Fraunces', serif; font-size: 26px; margin: 6px 0 10px; }
  .modal p{ color: var(--ink-soft); font-size: 14px; margin: 0 0 18px; }
  .modal .score-final{ font-family:'Fraunces', serif; font-size: 40px; font-weight:700; margin-bottom: 4px;}
</style>

<div class="wrap">

<script>
(function(){
  const DEFAULT_WORDS = [
    "세포","핵","세포막","세포벽","리보솜","골지체","엽록체",
    "미토콘드리아","염색체","유전자","우성","열성",
    "감수분열","체세포분열","상동염색체","대립유전자"
  ];
  const MIN_LEN = 2, MAX_LEN = 8, MAX_COUNT = 20;
  const FILL_SYLLABLES = "가나다라마바사아자차카타파하거너더러머버서어저처커터퍼허고노도로모보소오조초코토포호규뉴듀류무부수우주추쿠투푸";

  let WORDS = [...DEFAULT_WORDS];
  let SIZE = 14;
  let grid, placements, foundWords, startTime, timerInterval, score, isDragging, selection;

  function computeSize(words){
    const longest = words.reduce((m,w)=>Math.max(m, Array.from(w).length), 0);
    const byCount = Math.ceil(Math.sqrt(words.length) * 3.4);
    const size = Math.max(10, longest + 3, byCount);
    return Math.min(20, size);
  }

  function parseWordsInput(text){
    const raw = text.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    const seen = new Set();
    const valid = [];
    const rejected = [];
    for(const w of raw){
      const clean = w.replace(/\s+/g, '');
      const len = Array.from(clean).length;
      if(len < MIN_LEN || len > MAX_LEN){ rejected.push(w); continue; }
      if(seen.has(clean)) continue;
      seen.add(clean);
      valid.push(clean);
      if(valid.length >= MAX_COUNT) break;
    }
    return { valid, rejected };
  }

  function emptyGrid(){
    return Array.from({length:SIZE}, () => Array(SIZE).fill(null));
  }

  const DIRECTIONS = [
    {dr:0, dc:1}, {dr:1, dc:0}, {dr:1, dc:1}, {dr:1, dc:-1},
    {dr:0, dc:-1}, {dr:-1, dc:0}, {dr:-1, dc:-1}, {dr:-1, dc:1}
  ];

  function tryPlaceWord(g, word){
    const letters = Array.from(word);
    const attempts = 200;
    for(let a=0; a<attempts; a++){
      const dir = DIRECTIONS[Math.floor(Math.random()*DIRECTIONS.length)];
      const row = Math.floor(Math.random()*SIZE);
      const col = Math.floor(Math.random()*SIZE);
      const endRow = row + dir.dr*(letters.length-1);
      const endCol = col + dir.dc*(letters.length-1);
      if(endRow < 0 || endRow >= SIZE || endCol < 0 || endCol >= SIZE) continue;

      let ok = true;
      for(let i=0;i<letters.length;i++){
        const r = row + dir.dr*i, c = col + dir.dc*i;
        if(g[r][c] !== null && g[r][c] !== letters[i]){ ok = false; break; }
      }
      if(!ok) continue;

      const cells = [];
      for(let i=0;i<letters.length;i++){
        const r = row + dir.dr*i, c = col + dir.dc*i;
        g[r][c] = letters[i];
        cells.push({r,c});
      }
      return cells;
    }
    return null;
  }

  function buildPuzzle(){
    let g, placed;
    let tries = 0;
    do {
      g = emptyGrid();
      placed = {};
      let success = true;
      const shuffled = [...WORDS].sort(()=>Math.random()-0.5);
      for(const w of shuffled){
        const cells = tryPlaceWord(g, w);
        if(!cells){ success = false; break; }
        placed[w] = cells;
      }
      tries++;
      if(success) break;
    } while(tries < 30);

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(g[r][c] === null){
          g[r][c] = FILL_SYLLABLES[Math.floor(Math.random()*FILL_SYLLABLES.length)];
        }
      }
    }
    grid = g;
    placements = placed;
  }

  function renderGrid(){
    const gridEl = document.getElementById('grid');
    gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
    gridEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = grid[r][c];
        cell.dataset.r = r;
        cell.dataset.c = c;
        gridEl.appendChild(cell);
      }
    }
  }

  function renderWordList(){
    const ul = document.getElementById('wordlist');
    ul.innerHTML = '';
    WORDS.forEach(w=>{
      const li = document.createElement('li');
      li.id = 'word-' + w;
      li.innerHTML = `<span>${w}</span><span class="mark"></span>`;
      ul.appendChild(li);
    });
  }

  function cellEl(r,c){
    return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  }

  function clearSelectionStyle(){
    document.querySelectorAll('.cell.selecting').forEach(el=>el.classList.remove('selecting'));
  }

  function lineCells(a, b){
    const dr = Math.sign(b.r - a.r);
    const dc = Math.sign(b.c - a.c);
    if(a.r !== b.r && a.c !== b.c && Math.abs(a.r-b.r) !== Math.abs(a.c-b.c)) return null;
    const len = Math.max(Math.abs(b.r-a.r), Math.abs(b.c-a.c)) + 1;
    const cells = [];
    for(let i=0;i<len;i++){
      cells.push({r: a.r + dr*i, c: a.c + dc*i});
    }
    return cells;
  }

  function cellsMatchWord(cells, word){
    const letters = Array.from(word);
    if(cells.length !== letters.length) return false;
    const forward = cells.every((cell,i)=> grid[cell.r][cell.c] === letters[i]);
    const backward = cells.every((cell,i)=> grid[cell.r][cell.c] === letters[letters.length-1-i]);
    return forward || backward;
  }

  function markFound(word, cells, altColor){
    cells.forEach(({r,c})=>{
      const el = cellEl(r,c);
      el.classList.remove('selecting');
      el.classList.add(altColor ? 'found-alt' : 'found');
    });
    const li = document.getElementById('word-' + word);
    li.classList.add('done');
    li.querySelector('.mark').textContent = '✓';
  }

  function flashWrong(cells){
    cells.forEach(({r,c})=> cellEl(r,c).classList.add('wrong'));
    setTimeout(()=>{
      cells.forEach(({r,c})=> cellEl(r,c).classList.remove('wrong','selecting'));
    }, 260);
  }

  function updateStats(){
    document.getElementById('foundDisplay').textContent = `${foundWords.size}/${WORDS.length}`;
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('subtitle').textContent = `가로·세로·대각선 방향으로 숨어있는 ${WORDS.length}개의 단어를 찾아보세요.`;
  }

  function formatTime(sec){
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    return `${m}:${s}`;
  }

  function startTimer(){
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
      const elapsed = Math.floor((Date.now()-startTime)/1000);
      document.getElementById('timeDisplay').textContent = formatTime(elapsed);
    }, 1000);
  }

  function elapsedSeconds(){
    return Math.floor((Date.now()-startTime)/1000);
  }

  function handleSelectionEnd(a, b){
    const cells = lineCells(a, b);
    clearSelectionStyle();
    if(!cells){ return; }
    for(const word of WORDS){
      if(foundWords.has(word)) continue;
      if(cellsMatchWord(cells, word)){
        foundWords.add(word);
        const elapsed = elapsedSeconds();
        const gain = Math.max(20, 100 - Math.floor(elapsed/2));
        score += gain;
        markFound(word, cells, foundWords.size % 2 === 0);
        updateStats();
        if(foundWords.size === WORDS.length){
          finishGame();
        }
        return;
      }
    }
    if(cells.length > 1){
      flashWrong(cells);
    }
  }

  function finishGame(){
    clearInterval(timerInterval);
    const elapsed = elapsedSeconds();
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalStats').textContent = `완료 시간 ${formatTime(elapsed)} · ${WORDS.length}개 단어 완성`;
    document.getElementById('overlay').classList.add('show');
  }

  function setupInteraction(){
    const gridEl = document.getElementById('grid');
    let anchor = null;

    function posFromEvent(e){
      const target = e.target.closest('.cell');
      if(!target) return null;
      return { r: parseInt(target.dataset.r), c: parseInt(target.dataset.c), el: target };
    }

    function previewSelection(a, b){
      clearSelectionStyle();
      const cells = lineCells(a, b);
      if(!cells) return;
      cells.forEach(({r,c})=> cellEl(r,c).classList.add('selecting'));
    }

    gridEl.addEventListener('mousedown', (e)=>{
      const p = posFromEvent(e);
      if(!p) return;
      isDragging = true;
      anchor = p;
      p.el.classList.add('selecting');
    });
    gridEl.addEventListener('mousemove', (e)=>{
      if(!isDragging || !anchor) return;
      const p = posFromEvent(e);
      if(!p) return;
      previewSelection(anchor, p);
    });
    window.addEventListener('mouseup', (e)=>{
      if(!isDragging || !anchor) { isDragging=false; return; }
      const p = posFromEvent(e) || anchor;
      handleSelectionEnd(anchor, p);
      isDragging = false;
      anchor = null;
    });

    gridEl.addEventListener('touchstart', (e)=>{
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const cell = el && el.closest('.cell');
      if(!cell) return;
      isDragging = true;
      anchor = { r: parseInt(cell.dataset.r), c: parseInt(cell.dataset.c) };
      cell.classList.add('selecting');
      e.preventDefault();
    }, {passive:false});
    gridEl.addEventListener('touchmove', (e)=>{
      if(!isDragging || !anchor) return;
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const cell = el && el.closest('.cell');
      if(!cell) return;
      const p = { r: parseInt(cell.dataset.r), c: parseInt(cell.dataset.c) };
      previewSelection(anchor, p);
      e.preventDefault();
    }, {passive:false});
    gridEl.addEventListener('touchend', (e)=>{
      if(!isDragging || !anchor) return;
      const touch = e.changedTouches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const cell = el && el.closest('.cell');
      const p = cell ? { r: parseInt(cell.dataset.r), c: parseInt(cell.dataset.c) } : anchor;
      handleSelectionEnd(anchor, p);
      isDragging = false;
      anchor = null;
    });
  }

  function revealOneWord(){
    const remaining = WORDS.filter(w=>!foundWords.has(w));
    if(remaining.length === 0) return;
    const word = remaining[0];
    const cells = placements[word];
    foundWords.add(word);
    score = Math.max(0, score - 15);
    markFound(word, cells, foundWords.size % 2 === 0);
    updateStats();
    if(foundWords.size === WORDS.length){ finishGame(); }
  }

  function newGame(){
    SIZE = computeSize(WORDS);
    buildPuzzle();
    renderGrid();
    renderWordList();
    foundWords = new Set();
    score = 0;
    isDragging = false;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('timeDisplay').textContent = '00:00';
    updateStats();
    startTimer();
  }

  function applyWordsFromInput(){
    const text = document.getElementById('wordInput').value;
    const { valid, rejected } = parseWordsInput(text);
    const msg = document.getElementById('inputMsg');
    if(valid.length < 3){
      msg.textContent = '2~8글자 단어를 최소 3개 이상 입력해주세요.';
      return;
    }
    WORDS = valid;
    msg.textContent = rejected.length
      ? `${rejected.length}개 단어는 글자 수 조건(2~8자)에 맞지 않아 제외되었습니다.`
      : '';
    msg.style.color = rejected.length ? 'var(--error)' : 'var(--ink-soft)';
    newGame();
  }

  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('playAgainBtn').addEventListener('click', newGame);
  document.getElementById('giveUpBtn').addEventListener('click', revealOneWord);
  document.getElementById('applyWordsBtn').addEventListener('click', applyWordsFromInput);
  document.getElementById('resetWordsBtn').addEventListener('click', ()=>{
    WORDS = [...DEFAULT_WORDS];
    document.getElementById('wordInput').value = DEFAULT_WORDS.join(', ');
    document.getElementById('inputMsg').textContent = '';
    newGame();
  });

  document.getElementById('wordInput').value = DEFAULT_WORDS.join(', ');
  setupInteraction();
  newGame();
})();
</script>
</body>
</html>
