<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>식물의 광합성 가상실험실</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;overflow:hidden}

.sp{flex:1}

main{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px}
.mode{display:none;height:100%}
.mode.on{display:grid;gap:10px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}

#top{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:6px 12px;background:#e2e8f0;flex-wrap:wrap}

.sm .btn{min-height:48px;font-size:clamp(12px,1.05vw,16px);padding:0 10px}

.hudc .i{border-color:#3b82f6;background:#eff6ff}.hudc .i b{color:#1d4ed8}.hudc .r{border-color:#f97316;background:#fff7ed}.hudc .r b{color:#c2410c}.hudc .m{border-color:#94a3b8}.hudc .m b{color:#475569}
.pres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pres .btn{min-height:52px;padding:0}.pres .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}

.dt{width:100%;border-collapse:collapse;font-weight:800;text-align:center;font-size:clamp(12px,1.05vw,16px)}.dt th,.dt td{border:2px solid #cbd5e1;padding:6px 3px}.dt th{background:#dbeafe;color:#1e3a8a}.dt td.f{background:#fef9c3;color:#166534}.dt td.cur{outline:3px solid #f59e0b}

.stg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stg3 .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.stg3 .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.stg3 .btn.ok{background:#dcfce7;border-color:#22c55e}
.alert{border-radius:12px;padding:8px 12px;font-weight:900;line-height:1.45;background:#fef2f2;border:3px solid #ef4444;color:#7f1d1d;font-size:clamp(13px,1.1vw,17px)}
.cv{width:100%;border:2px solid #cbd5e1;border-radius:12px;background:#f8fafc;display:block}
input[type=range].big{accent-color:#0f766e}

.seg{display:grid;gap:6px}.seg .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.seg .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.seg .btn.ok{border-color:#22c55e}
.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd div{border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;font-size:clamp(12px,1.02vw,15px);background:#f8fafc}.spd i{display:block;height:9px;border-radius:5px;background:#38bdf8;margin-top:3px}
.hudc .g b{color:#15803d}.hudc .g{border-color:#22c55e;background:#f0fdf4}
.med{display:grid;grid-template-columns:1fr 1fr;gap:6px}.med .btn{min-height:58px;line-height:1.2;padding:3px 8px;text-align:left;font-size:clamp(12px,1.05vw,16px)}.med .btn.on{background:#fffbeb;border-color:#f59e0b}

.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:900;font-size:clamp(12px,1.05vw,16px);border:2px solid}
.b-d{background:#fef9c3;border-color:#eab308;color:#713f12}.b-r{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}.b-f{background:#dcfce7;border-color:#22c55e;color:#14532d}.b-n{background:#e5e7eb;border-color:#9ca3af;color:#374151}

.sortbox{position:absolute;inset:0;overflow:auto;padding:12px;display:none;flex-direction:column;gap:10px;background:#f1f5f9}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cardb{min-height:84px;border:3px solid #cbd5e1;border-radius:14px;background:#fff;font-weight:900;font-size:clamp(13px,1.2vw,18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;line-height:1.2;padding:4px}.cardb span{font-size:clamp(26px,3vw,42px)}.cardb.sel{border-color:#f59e0b;background:#fffbeb;transform:scale(1.04)}.cardb.shake{animation:shk .4s;border-color:#ef4444;background:#fef2f2}

.zone.src{border-color:#f59e0b}.zone.non{border-color:#64748b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#dcfce7;border:2px solid #22c55e;border-radius:10px;padding:3px 8px;font-size:clamp(12px,1.05vw,16px)}

  $('#tip2').innerHTML='💡 상추가 광합성을 하면 <b>이산화 탄소를 흡수</b>하고 <b>산소를 내보내요</b>. 센서가 용기 속 기체 농도를 실시간으로 알려 줘요.'}
function ctl3(){$('#selh3').textContent='🥬 실험할 잎 조각 선택 (눌러서 선택/해제)';
  $('#sel3').innerHTML='<button class="btn" data-lf="sun"><span>☀️</span>햇빛 받은 잎</button><button class="btn" data-lf="dark"><span>🌑</span>어둠상자 잎</button><button class="btn" id="nl3"><span>🥬</span>새 잎으로<br>다시 하기</button>';
  $('#ctl3').innerHTML='<div class="kv2">🧪 순서대로 눌러요</div><button class="sw2" id="h3" style="min-height:64px;margin-top:6px">① 🔥 에탄올에 넣고 물중탕</button><button class="sw2" id="r3" style="min-height:64px;margin-top:6px">② 🚿 증류수로 헹구기</button><button class="sw2" id="i3" style="min-height:64px;margin-top:6px">③ 🧪 아이오딘 용액 떨어뜨리기</button>';
  $('#tip3').className='tipb warn';$('#tip3').innerHTML='⚠️ 에탄올은 불이 붙기 쉬워서 <b>직접 가열하지 않고</b> 뜨거운 물(80~100°C)에 담가 <b>물중탕</b>해요. 엽록소를 빼내야 아이오딘 반응 색을 잘 볼 수 있어요.';
  lfUI();info3()}
function lfUI(){$$('[data-lf]').forEach(b=>b.classList.toggle('on',!!LF[b.dataset.lf].sel))}
function info3(){const row=(k,n)=>{const l=LF[k];const s=['대기','탈색 중 '+Math.round(l.p*100)+'%','① 탈색 완료','② 헹굼 완료',l.fin?'③ 결과 확인':'③ 반응 중'][l.st];return `<tr><th>${n}</th><td>${s}</td></tr>`};
  $('#info3').innerHTML='<table class="cmpa"><tr><th>잎 조각</th><th>진행 상태</th></tr>'+row('sun','☀️ 햇빛 받은 잎')+row('dark','🌑 어둠상자 잎')+'</table>'}
// ---- 이벤트 ----
document.addEventListener('click',e=>{let b;
  if(e.target.closest('#lt1')){A.light=!A.light;A.light?sOK():sTap();ctl1U();tip1();if(A.light)fbx('#fb1','☀️ 빛을 비췄어요! 물과 이산화 탄소가 엽록체로 이동하는 모습을 지켜보세요.');return}
  if(e.target.closest('#lb1')){A.lab=!A.lab;sTap();ctl1U();return}
  if(e.target.closest('#lr1')){resetAll();return}
  if(e.target.closest('#lamp2')){startRun('on');return}
  if(e.target.closest('#dark2')){startRun('off');return}
  if(e.target.closest('#rst2')){if(R2.running)return;R2.run=null;R2.tv=0;R2.data={on:null,off:null};R2.tap=null;$('#cc2').style.display='none';sTap();btn2();fbx('#fb2','🧪 그래프를 지웠어요. 다시 측정해 보세요.');return}
  if(b=e.target.closest('[data-lf]')){const l=LF[b.dataset.lf];l.sel=l.sel?0:1;sTap();lfUI();return}
  if(e.target.closest('#nl3')){newLeaves();sTap();lfUI();info3();fbx('#fb3','🥬 새 잎 조각을 준비했어요.');return}
  if(e.target.closest('#h3')){const t=[LF.sun,LF.dark].filter(l=>l.sel);if(!t.length){toast('#toast3','먼저 잎 조각을 선택하세요.',2200);return}
    const ok=t.filter(l=>l.st===0);if(!ok.length){toast('#toast3','이미 물중탕한 잎이에요. ②번으로 넘어가요.',2400);return}ok.forEach(l=>{l.st=1;l.p=0});B3.heat=true;B3.target=90;sTap();fbx('#fb3','🔥 에탄올이 든 시험관을 뜨거운 물에 담가 <b>물중탕</b> 중이에요. 물이 80°C 이상이 되면 엽록소가 빠져나와요.');return}
  if(e.target.closest('#r3')){const t=[LF.sun,LF.dark].filter(l=>l.sel);if(!t.length){toast('#toast3','먼저 잎 조각을 선택하세요.',2200);return}
    if(t.some(l=>l.st===1)){toast('#toast3','아직 탈색 중이에요. 잎이 하얗게 될 때까지 기다려요.',2600);return}
    const ok=t.filter(l=>l.st===2);if(!ok.length){toast('#toast3','먼저 ① 물중탕으로 탈색해야 해요.',2400);return}ok.forEach(l=>{l.st=3});B3.rinse=1.8;sTap();chk3();fbx('#fb3','🚿 탈색된 잎을 증류수로 헹궈 에탄올을 씻어 냈어요. 이제 아이오딘 용액을 떨어뜨려요.');return}
  if(e.target.closest('#i3')){const t=[LF.sun,LF.dark].filter(l=>l.sel);if(!t.length){toast('#toast3','먼저 잎 조각을 선택하세요.',2200);return}
    if(B3.dp){return}const ok=t.filter(l=>l.st===3);if(!ok.length){toast('#toast3',t.some(l=>l.st<3)?'② 증류수로 헹군 뒤에 떨어뜨려요.':'이미 아이오딘 용액을 떨어뜨렸어요.',2600);return}
    const list=['sun','dark'].filter(k=>LF[k].sel&&LF[k].st===3);list.forEach(k=>{LF[k].st=4;LF[k].ir=0;LF[k].dropped=0});B3.dp={t0:B3.t,list};sTap();fbx('#fb3','🧪 스포이트로 아이오딘-아이오딘화 칼륨 용액을 떨어뜨리는 중…');return}
});
$('#a1').addEventListener('pointerdown',e=>{const r=$('#a1').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=22;for(const o of A.hit||[]){const d=Math.hypot(o[0]-x,o[1]-y);if(d<bd){bd=d;best=o}}if(!best)return;sTick();
  toast('#toast1',{co2:'이산화 탄소(CO₂): 기공으로 들어오는 광합성 재료',h2o:'물(H₂O): 뿌리에서 물관을 타고 올라온 광합성 재료',glc:'포도당(C₆H₁₂O₆): 광합성으로 만들어진 양분 → 곧 녹말로 바뀌어요',o2:'산소(O₂): 광합성으로 만들어져 기공으로 나가요'}[best[2]],3000)});
function hud(){const el=$('#pbar');el.style.display='flex';el.style.gap='6px';
  const it=[['① 광합성 원리',S.c.size,4],['② 센서 실험',S.sen.size,3],['③ 녹말 검출',S.st.size,3]];
  el.innerHTML=it.map(a=>{const ok=a[1]>=a[2];return `<div class="pseg${ok?' ok':''}">${a[0]} ${a[1]}/${a[2]}${ok?' ✔':''}</div>`}).join('')+`<div class="pseg${S.quiz>=QZ.length?' ok':''}">퀴즈 ${S.quiz<0?'–':S.quiz+'/'+QZ.length}</div>`}
const QZ=[
 {q:'광합성에 필요한 원료(재료)로 알맞게 짝지은 것은?',o:['이산화 탄소와 물','산소와 포도당','산소와 물','질소와 녹말'],a:0,e:'식물은 빛에너지를 이용해 이산화 탄소와 물을 원료로 포도당과 산소를 만들어요.'},
 {q:'빛을 비춘 상추 모종이 든 밀폐 용기의 기체 농도 변화로 알맞은 것은?',o:['이산화 탄소는 감소, 산소는 증가','이산화 탄소는 증가, 산소는 감소','둘 다 감소','둘 다 변화 없음'],a:0,e:'광합성으로 이산화 탄소가 흡수되어 줄고, 산소가 만들어져 늘어나요.'},
 {q:'녹말 검출 실험에서 잎을 에탄올에 넣고 물중탕하는 까닭은?',o:['엽록소를 빼내 탈색해 아이오딘 반응 색을 잘 보려고','잎에 녹말을 더 만들려고','잎을 단단하게 하려고','에탄올에 불을 붙이려고'],a:0,e:'초록색 엽록소를 빼내야 청람색 반응을 뚜렷하게 볼 수 있어요. 에탄올은 불이 붙기 쉬워 직접 가열하지 않고 물중탕해요.'},
 {q:'아이오딘 용액을 떨어뜨렸더니 햇빛을 받은 잎만 청람색이 되었다. 알 수 있는 사실은?',o:['빛을 받아 광합성을 한 잎에서 녹말이 만들어졌다','어둠상자 잎에서 더 많은 녹말이 만들어졌다','광합성에는 빛이 필요 없다','두 잎 모두 녹말이 없다'],a:0,e:'아이오딘 반응은 녹말이 있을 때 청람색이 돼요. 햇빛을 받은 잎에서만 녹말이 만들어졌으니 광합성에 빛이 필요함을 알 수 있어요.'},
 {q:'광합성으로 만들어진 포도당은 어떻게 될까?',o:['곧 녹말로 바뀌어 엽록체에 저장된다','모두 산소로 바뀐다','기공으로 밖으로 나간다','엽록소가 된다'],a:0,e:'포도당은 곧 녹말로 바뀌어 엽록체에 저장되고, 산소는 기공을 통해 밖으로 나가요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{S.quiz=Math.max(S.quiz,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};

function resetAll(){S.c=new Set();S.sen=new Set();S.st=new Set();S.quiz=-1;
  A.light=false;A.lab=true;A.p=[];A.ph=[];A.arr={co2:0,h2o:0};A.glc=0;A.starch=0;A.o2out=0;A.react={c:0,w:0};A.flash=0;A.t=0;
  R2.run=null;R2.tv=0;R2.running=false;R2.data={on:null,off:null};R2.tap=null;R2.bub=[];
  newLeaves();$('#cc2').style.display='none';
  ctl1();ctl2();ctl3();tip1();info1();btn2();hud();
  fbx('#fb1','🌱 "☀️ 빛 켜기" 버튼을 눌러 광합성이 일어나는 과정을 관찰하세요.');fbx('#fb2','📈 "LED 켜고 측정"을 눌러 이산화 탄소와 산소 농도의 변화를 확인하세요.');fbx('#fb3','🥬 잎을 고른 뒤 ①②③ 순서로 실험해 보세요.');setMode(1)}
$('#btnReset').onclick=resetAll;
let lastT=0,infT=0;
function loop(){try{const now=performance.now()/1000,dt=Math.min(.05,now-(lastT||now));lastT=now;
    if(mode===1)draw1($('#a1'),now,dt);else if(mode===2)draw2($('#a2'),now,dt);else draw3($('#a3'),now,dt);
    infT+=dt;if(infT>.4){infT=0;if(mode===1)info1();if(mode===3)info3()}}catch(e){console.error(e)}requestAnimationFrame(loop)}
resetAll();requestAnimationFrame(loop);
</script>
