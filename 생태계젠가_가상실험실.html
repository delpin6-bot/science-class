 {id:'bike',e:'🚲',n:'반사판 자전거',x:60,y:82,t:'고양이 눈을 본뜬 반사판 — 아이디어(생체 모방)'},
 {id:'bag',e:'🎒',n:'찍찍이 가방',x:38,y:30,t:'도꼬마리 열매를 본뜬 찍찍이 — 아이디어(생체 모방)'},
 {id:'honey',e:'🍯',n:'꿀',x:88,y:84,t:'꿀벌이 만든 꿀 — 식량 자원'}];
const DEC=[['🪟',18,14],['🖼️',48,12],['📺',80,14],['💡',30,48],['📱',70,72],['🧱',8,82],['🔌',52,44]];
function render3(){$('#room').innerHTML=DEC.map(d=>`<span class="dec" style="left:${d[1]}%;top:${d[2]}%">${d[0]}</span>`).join('')+IT.map(i=>`<button class="it${S.found.has(i.id)?' fd':''}" data-id="${i.id}" style="left:${i.x}%;top:${i.y}%">${i.e}</button>`).join('')+
   [[8,24],[92,36],[40,90],[10,64],[66,52]].map(p=>`<button class="it no0" data-d="1" style="left:${p[0]}%;top:${p[1]}%;font-size:clamp(34px,4.5vw,58px)">${['🧴','🥤','📦','🔧','🪨'][Math.floor(p[0]%5)]}</button>`).join('');
  $('#chk').innerHTML=IT.map(i=>`<div class="ck${S.found.has(i.id)?' got':''}">${S.found.has(i.id)?i.e+' '+i.n+'<br><small>'+i.t.split(' — ')[1]+'</small>':'❓ 아직 못 찾음'}</div>`).join('');
  $('#fc3').textContent=`(${S.found.size}/${IT.length})`;
  $$('#room .it').forEach(b=>b.onclick=()=>{if(b.dataset.d){sNO();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');say('🤔 이건 생물에서 얻은 자원이 아니에요. (플라스틱·금속·돌 등)',2200);return}
    const i=IT.find(x=>x.id===b.dataset.id);if(S.found.has(i.id)){say(`${i.e} ${i.n}: ${i.t}`,2600);return}
    S.found.add(i.id);sOK();render3();hud();say(`${i.e} ${i.n}<br><span style="font-size:.8em;font-weight:700">${i.t}</span>`,3600);
    if(S.found.size===IT.length)setTimeout(()=>{say('🎉 모두 찾았어요! 우리 생활 곳곳에 <em>생물 자원</em>이 있어요.',4800);confetti(['🌾','🧣','💊','🍯','🪑'])},3700)})}
// ---------- 공통 ----------
function say(h,ms){const p=$('#pop');p.innerHTML=h;p.classList.add('on');clearTimeout(popT);popT=setTimeout(()=>p.classList.remove('on'),ms||3200)}
function confetti(em){for(let i=0;i<22;i++){const e=document.createElement('div');e.className='cfx';e.textContent=em[i%em.length];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function hud(){const it=[['① 개구리 제거',S.frog],['② 도감 '+S.seen.size+'/'+BEN.length,S.seen.size===BEN.length],['③ 숨은 자원 '+S.found.size+'/'+IT.length,S.found.size===IT.length]];
  $('#pbar').innerHTML=it.map(x=>`<div class="pseg${x[1]?' ok':''}">${x[0]}${x[1]?' ✔':''}</div>`).join('')+`<div class="pseg${QSC>=QZ.length?' ok':''}">퀴즈 ${QSC<0?'–':QSC+'/'+QZ.length}</div>`}
const QZ=[
 {q:'단순한 먹이사슬(벼→메뚜기→개구리→매)에서 개구리가 사라지면?',o:['매가 굶고 메뚜기가 급증한다','아무 일도 없다','매가 늘어난다','벼가 늘어난다'],a:0,e:'개구리가 사라지면 매는 먹이가 없고, 메뚜기는 천적이 없어 급증해요.'},
 {q:'복잡한 먹이그물에서 개구리가 사라져도 매가 살아남는 까닭은?',o:['뱀·참새 등 다른 먹이로 옮겨 갈 수 있어서','매가 먹이를 안 먹어서','개구리가 안 사라져서','매가 식물을 먹어서'],a:0,e:'먹이 경로가 여러 갈래라 다른 먹이로 대체할 수 있어요.'},
 {q:'생물다양성이 높은 생태계의 특징은?',o:['먹이그물이 복잡해 안정적이다','먹이사슬이 한 줄뿐이다','생물이 한 종류뿐이다','변화에 아주 약하다'],a:0,e:'생물다양성이 높을수록 먹이그물이 복잡해 생태계가 안정적이에요.'},
 {q:'푸른곰팡이에서 얻은 페니실린은 어떤 자원일까?',o:['의약품 자원','식량 자원','목재 자원','섬유 자원'],a:0,e:'페니실린은 세균 감염을 치료하는 항생제(의약품)예요.'},
 {q:'고양이 눈을 본떠 도로 반사판을 만든 것은 어떤 혜택일까?',o:['생물의 특징을 이용한 아이디어','식량','목재','연료'],a:0,e:'생물의 구조·기능을 본떠 발명하는 것을 생체 모방이라고 해요.'},
 {q:'생물다양성이 우리에게 주는 혜택이 아닌 것은?',o:['플라스틱 쓰레기','식량','의약품','섬유'],a:0,e:'플라스틱 쓰레기는 생물다양성의 혜택이 아니에요.'},
 {q:'생태계에서 한 종이 사라질 때 영향이 가장 작은 것은?',o:['먹이그물이 복잡한 생태계','먹이사슬이 단순한 생태계','생물이 한 종뿐인 생태계','먹이가 하나뿐인 생태계'],a:0,e:'먹이그물이 복잡할수록 대체 먹이가 있어 안정적이에요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{QSC=Math.max(QSC,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};
function setPh(on,save){document.body.classList.toggle('ph',!!on);$('#btnPh').classList.toggle('on',!!on);$('#btnPh').textContent=on?'📱 스마트폰 모드 ON':'📱 스마트폰 모드';if(save){try{localStorage.setItem('eco-ph',on?'1':'0')}catch(e){}}setTimeout(drawAll,60)}
$('#btnPh').onclick=()=>setPh(!document.body.classList.contains('ph'),true);
function resetAll(){anim++;R=[];stage=99;S={frog:false,sayF:false,open:new Set(),seen:new Set(),m2:false,found:new Set()};drawAll();summary();render2();render3();hud();setMode(1);$('#pop').classList.remove('on')}
$('#btnReset').onclick=resetAll;
const _sm=setMode;setMode=function(m){_sm(m);$('#pop').classList.remove('on');window.scrollTo(0,0);if(m===1)setTimeout(drawAll,30)};
let phPref=null;try{phPref=localStorage.getItem('eco-ph')}catch(e){}
resetAll();setPh(phPref==='1'||(phPref===null&&innerWidth<=760),false);setTimeout(drawAll,100);
