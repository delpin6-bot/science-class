<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="보일 법칙 가상실험: 주사기 속 기체의 부피를 바꾸며 압력 변화와 입자 운동을 관찰해 보세요.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef4fa">
<meta property="og:type" content="website">
<meta property="og:title" content="보일 법칙 가상실험 - 주사기 속 기체의 부피와 압력">
<meta property="og:description" content="피스톤을 누르고 당기며 부피와 압력의 반비례 관계를 확인하는 중학교 과학 가상실험">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='20' y='14' width='24' height='32' rx='4' fill='%232b7de9'/%3E%3Crect x='14' y='8' width='36' height='8' rx='3' fill='%234b6fb5'/%3E%3Crect x='29' y='46' width='6' height='12' fill='%238aa6bd'/%3E%3C/svg%3E">
<title>보일 법칙 가상실험 - 주사기 속 기체의 부피와 압력</title>
<style>
  :root{
    --bg:#eef4fa; --card:#ffffff; --ink:#1d2b3a; --sub:#5b6b7c; --line:#d6e0ea;
    --blue:#2b7de9; --red:#e5533d; --green:#22a06b; --amber:#f0a020;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  header{display:flex; align-items:center; gap:14px; padding:12px 20px 4px; flex-wrap:wrap;}
  header h1{margin:0; font-size:26px;}
  header p{margin:0; color:var(--sub); font-size:16px;}
  .back{margin-left:auto; min-height:44px; display:inline-flex; align-items:center; padding:0 16px; border-radius:12px;
    background:#42576b; color:#fff; font-size:16px; font-weight:800; text-decoration:none;}
  .back:active{background:#2c3b49;}
  .app{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:14px; padding:10px 20px 20px; align-items:start;}
  .card{background:var(--card); border-radius:18px; box-shadow:0 2px 10px rgba(30,60,100,.10); padding:12px 14px;}
  .card h2{margin:0 0 8px; font-size:19px; display:flex; align-items:center; gap:8px;}
  .tag{font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff;}
  .tag.macro{background:var(--blue);} .tag.micro{background:var(--green);}
  .stages{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:14px;}
  canvas{display:block; width:100%; height:auto; border-radius:12px; background:#f8fbff;}
  .note{margin:6px 2px 0; font-size:14px; color:var(--sub); min-height:20px;}
  .right{display:flex; flex-direction:column; gap:14px;}
  .presets{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  button{font-family:inherit; cursor:pointer; border:0;}
  .pre{min-height:68px; border-radius:14px; font-size:18px; font-weight:800; color:#fff; line-height:1.2;
    box-shadow:0 3px 0 rgba(0,0,0,.18); transition:transform .08s, box-shadow .08s, outline-color .1s; outline:4px solid transparent;}
  .pre small{display:block; font-size:15px; font-weight:700; opacity:.95;}
  .pre:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .pre.p1{background:#3fae7a;} .pre.p2{background:#3a7bd5;} .pre.p3{background:#7a4fc4;}
  .pre.active{outline-color:#1d2b3a55;}
  .stepRow{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .stp{min-height:60px; border-radius:14px; font-size:17px; font-weight:800; color:#fff; background:#4b6fb5; box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .stp:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .stp.push{background:#d9603f;}
  .sliderRow{margin-top:14px;}
  .sliderRow label{display:flex; justify-content:space-between; font-size:16px; font-weight:700; margin-bottom:6px;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:14px; border-radius:999px;
    background:linear-gradient(90deg,#d9603f,#f3c45a 50%,#7fd0a8); outline:none; margin:10px 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:44px; height:44px; border-radius:50%;
    background:#fff; border:5px solid #1d2b3a; box-shadow:0 2px 6px rgba(0,0,0,.3);}
  input[type=range]::-moz-range-thumb{width:34px; height:34px; border-radius:50%; background:#fff; border:5px solid #1d2b3a;}
  .ticks{display:flex; justify-content:space-between; font-size:13px; color:var(--sub); padding:0 4px;}
  .toggles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .tg{min-height:60px; border-radius:14px; background:#e6edf4; color:#42576b; font-size:16px; font-weight:800;
    display:flex; align-items:center; justify-content:space-between; padding:0 14px; gap:8px; text-align:left;}
  .tg b{min-width:46px; text-align:center; padding:6px 0; border-radius:999px; background:#9fb1c3; color:#fff; font-size:14px;}
  .tg.on{background:#dff3e8; color:#14633f;} .tg.on b{background:var(--green);}
  .reset{margin-top:12px; width:100%; min-height:56px; border-radius:14px; background:#42576b; color:#fff; font-size:18px; font-weight:800;}
  .reset:active{background:#2c3b49;}
  .data{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .box{background:#f3f7fb; border-radius:12px; padding:8px 6px; text-align:center;}
  .box span{display:block; font-size:13px; color:var(--sub);}
  .box strong{display:block; font-size:26px; line-height:1.25;}
  .box em{font-style:normal; font-size:15px; color:var(--sub); font-weight:700;}
  .status{margin-top:8px; padding:9px 12px; border-radius:12px; background:#fff6e0; font-size:16px; font-weight:700; min-height:40px;}
  .facts{margin-top:8px; font-size:14px; color:var(--sub); display:flex; flex-wrap:wrap; gap:4px 14px;}
  .facts b{color:var(--ink);}
  .rec{margin-top:10px; width:100%; min-height:56px; border-radius:14px; background:var(--green); color:#fff; font-size:18px; font-weight:800; box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .rec:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .tblwrap{max-height:200px; overflow:auto; margin-top:6px;}
  table{width:100%; border-collapse:collapse; font-size:15px;}
  th,td{border-bottom:1px solid var(--line); padding:5px 4px; text-align:center;}
  th{color:var(--sub); font-size:13px; position:sticky; top:0; background:#fff;}
  .tabs{display:flex; gap:8px; margin:10px 0 6px;}
  .tab{flex:1; min-height:48px; border-radius:12px; background:#e6edf4; color:#42576b; font-size:16px; font-weight:800;}
  .tab.on{background:var(--blue); color:#fff;}
  @media (max-width:980px){
    .app{grid-template-columns:1fr; padding:8px 12px 16px;}
    .stages{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:640px){
    .stages{grid-template-columns:1fr;}
    header h1{font-size:21px;}
  }
</style>
</head>
<body>
<header>
  <h1>💉 보일 법칙 가상실험</h1>
  <p>기체를 누르면(부피가 줄면) 압력은 어떻게 될까요?</p>
  <a class="back" href="./가상실험실_서랍.html">← 서랍으로</a>
</header>

<div class="app">
  <!-- 왼쪽: 실험 뷰 -->
  <div class="card">
    <div class="stages">
      <div>
        <h2><span class="tag macro">거시 관점</span> 주사기와 압력계</h2>
        <canvas id="macro" width="520" height="560"></canvas>
        <div class="note" id="exNote">온도 20℃ 일정 · 기체의 양 일정</div>
      </div>
      <div>
        <h2><span class="tag micro">미시 관점</span> 주사기 속 확대</h2>
        <canvas id="micro" width="400" height="400"></canvas>
        <div class="note" id="microNote"></div>
        <div class="facts">
          <span>입자 수: <b>24개</b> (변하지 않음)</span>
          <span>평균 속력: <b>×1.00</b> (온도 일정)</span>
          <span>피스톤 충돌: <b id="hits">0</b>회/초</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 오른쪽: 조작 패널 + 데이터 -->
  <div class="right">
    <div class="card">
      <h2>🖐️ 피스톤 조절</h2>
      <div class="presets">
        <button class="pre p1" data-v="100">처음 상태<small>100 mL</small></button>
        <button class="pre p2" data-v="50">절반으로<small>50 mL</small></button>
        <button class="pre p3" data-v="25">1/4로<small>25 mL</small></button>
      </div>
      <div class="stepRow">
        <button class="stp push" id="btnPush">⬇ 5 mL 누르기</button>
        <button class="stp" id="btnPull">⬆ 5 mL 당기기</button>
      </div>
      <div class="sliderRow">
        <label><span>부피 미세 조절</span><span id="sliderVal">100 mL</span></label>
        <input type="range" id="slider" min="20" max="100" step="1" value="100">
        <div class="ticks"><span>20</span><span>40</span><span>60</span><span>80</span><span>100 mL</span></div>
      </div>
      <div class="toggles">
        <button class="tg on" id="tgP" aria-pressed="true"><span>입자 운동 표시</span><b>ON</b></button>
        <button class="tg" id="tgV" aria-pressed="false"><span>속도 벡터(화살표)</span><b>OFF</b></button>
      </div>
      <button class="reset" id="reset">↺ 초기화</button>
    </div>

    <div class="card">
      <h2>📊 실시간 데이터</h2>
      <div class="data">
        <div class="box"><span>기체의 부피</span><strong id="dV">100.0</strong><em>mL</em></div>
        <div class="box"><span>기체의 압력</span><strong id="dP">1.00</strong><em>기압</em></div>
        <div class="box"><span>압력 × 부피</span><strong id="dPV">100</strong><em>기압·mL</em></div>
      </div>
      <div class="status" id="status">피스톤을 눌러 보세요.</div>
      <button class="rec" id="rec">📍 측정값 기록</button>
      <div class="tblwrap"><table id="tbl"></table></div>
      <div class="tabs">
        <button class="tab on" id="tabPV">P–V 그래프</button>
        <button class="tab" id="tabInv">P–(1/V) 그래프</button>
      </div>
      <canvas id="graph" width="440" height="320"></canvas>
      <div class="note" id="gNote">점선: 보일 법칙 · 주황 선: 지금까지 측정한 값 · 주황 점: 기록한 값</div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- 상수 ---------- */
  var V_MIN=20, V_MAX=100;
  var PV=100;              // 압력 × 부피 = 100 (기압·mL) : 100 mL일 때 1기압
  var N=24;                // 입자 수(일정)
  var SPEED=260;           // 입자 속력(온도 일정이므로 변하지 않음)
  var PR=6;                // 입자 반지름(그림)
  var BX=50, BW=300, BB=370, BH=300;   // 미시 뷰 상자 (아래쪽 기준)
  var TUBE_X0=150, TUBE_X1=330, TUBE_TOP=130, TUBE_BOT=500, KPX=3.3; // 거시 뷰 주사기
  var MAX_REC=8;

  /* ---------- 상태 ---------- */
  var S={ V:100, target:100, showP:true, showV:false, trail:[], rec:[], recCount:0,
          hitCount:0, hitRate:0, hitTimer:0, t:0, mode:'pv', msg:'', msgT:0 };

  function pressure(V){ return PV/V; }
  function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
  function boxH(V){ return BH*V/100; }

  /* ---------- 캔버스 준비 ---------- */
  function setup(id){
    var e=document.getElementById(id);
    var c={el:e, ctx:e.getContext('2d'), W:e.width, H:e.height, s:1};
    c.fit=function(){
      var dpr=window.devicePixelRatio||1, w=e.clientWidth||c.W;
      e.width=Math.round(w*dpr); e.height=Math.round(w*c.H/c.W*dpr); c.s=e.width/c.W;
    };
    c.fit(); return c;
  }
  var macro=setup('macro'), micro=setup('micro'), graph=setup('graph');
  function refit(){ macro.fit(); micro.fit(); graph.fit(); }
  if(window.ResizeObserver){
    var ro=new ResizeObserver(refit);
    ro.observe(macro.el); ro.observe(micro.el); ro.observe(graph.el);
  } else { window.addEventListener('resize',refit); }

  function rr(ctx,x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  /* ---------- 입자 ---------- */
  var P=[];
  function initParticles(){
    P=[]; var h=boxH(S.V);
    for(var i=0;i<N;i++){
      var b=Math.random()*Math.PI*2;
      while(Math.abs(Math.sin(b))<0.3){ b=Math.random()*Math.PI*2; }
      P.push({ x:PR+Math.random()*(BW-2*PR), y:PR+Math.random()*Math.max(1,h-2*PR),
               dx:Math.cos(b), dy:Math.sin(b), f:0.85+Math.random()*0.3, flash:0, fx:0 });
    }
  }
  initParticles();

  function updateParticles(dt){
    var h=boxH(S.V);
    for(var i=0;i<P.length;i++){
      var p=P[i], v=SPEED*p.f;
      p.x+=p.dx*v*dt; p.y+=p.dy*v*dt;
      if(p.x<PR){ p.x=PR; if(p.dx<0) p.dx=-p.dx; }
      if(p.x>BW-PR){ p.x=BW-PR; if(p.dx>0) p.dx=-p.dx; }
      if(p.y<PR){ p.y=PR; if(p.dy<0) p.dy=-p.dy; }
      if(p.y>h-PR){
        p.y=h-PR;
        if(p.dy>0){ p.dy=-p.dy; S.hitCount++; p.flash=1; p.fx=p.x; }
      }
      if(p.flash>0) p.flash=Math.max(0,p.flash-dt*3);
    }
    S.hitTimer+=dt;
    if(S.hitTimer>=0.8){ S.hitRate=Math.round(S.hitCount/S.hitTimer); S.hitCount=0; S.hitTimer=0; }
  }

  /* ---------- 거시 뷰 ---------- */
  function yPist(V){ return TUBE_BOT-KPX*V; }

  function drawGauge(ctx,cx,cy,r,Pv){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#56708a'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    var a0=135, sweep=270, i;
    function ang(p){ return (a0+sweep*clamp(p,0,5)/5)*Math.PI/180; }
    var zones=[[0,2,'#7fd0a8'],[2,4,'#f3c45a'],[4,5,'#e5533d']];
    ctx.lineWidth=8; ctx.lineCap='butt';
    for(i=0;i<zones.length;i++){
      ctx.strokeStyle=zones[i][2]; ctx.beginPath(); ctx.arc(cx,cy,r-12,ang(zones[i][0]),ang(zones[i][1])); ctx.stroke();
    }
    ctx.fillStyle='#1d2b3a'; ctx.strokeStyle='#1d2b3a'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=2;
    for(i=0;i<=5;i++){
      var a=ang(i), ca=Math.cos(a), sa=Math.sin(a);
      ctx.beginPath(); ctx.moveTo(cx+ca*(r-20),cy+sa*(r-20)); ctx.lineTo(cx+ca*(r-27),cy+sa*(r-27)); ctx.stroke();
      ctx.fillText(i,cx+ca*(r-38),cy+sa*(r-38)+4);
    }
    var an=ang(Pv);
    ctx.strokeStyle='#c92a47'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(an)*(r-18),cy+Math.sin(an)*(r-18)); ctx.stroke();
    ctx.fillStyle='#1d2b3a'; ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2); ctx.fill();
    ctx.font='bold 16px sans-serif'; ctx.fillText(Pv.toFixed(2)+' 기압',cx,cy+36);
    ctx.font='bold 14px sans-serif'; ctx.fillStyle='#56708a'; ctx.fillText('압력계',cx,cy-r-8);
    ctx.lineCap='butt';
  }

  function drawMacro(){
    var c=macro, ctx=c.ctx, W=c.W, H=c.H, V=S.V, Pv=pressure(V);
    ctx.setTransform(c.s,0,0,c.s,0,0); ctx.clearRect(0,0,W,H);
    var cx=(TUBE_X0+TUBE_X1)/2, yp=yPist(V), i;

    // 탁자
    ctx.fillStyle='#d9c7a8'; ctx.fillRect(40,540,440,14);

    // 압력계 연결관
    ctx.strokeStyle='#8aa6bd'; ctx.lineWidth=8; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(cx,TUBE_BOT+2); ctx.lineTo(cx,524); ctx.lineTo(430,524); ctx.lineTo(430,504); ctx.stroke();

    // 주사기 몸통
    ctx.fillStyle='rgba(235,246,255,0.55)'; ctx.fillRect(TUBE_X0,TUBE_TOP,TUBE_X1-TUBE_X0,TUBE_BOT-TUBE_TOP);
    // 기체
    ctx.fillStyle='rgba(60,140,240,'+(0.14+0.07*Pv)+')';
    ctx.fillRect(TUBE_X0+3,yp,TUBE_X1-TUBE_X0-6,TUBE_BOT-yp);
    // 기체 입자(간단 표시: 밀도 느낌)
    ctx.fillStyle='rgba(43,125,233,0.55)';
    for(i=0;i<N;i++){
      var gx=TUBE_X0+14+((i*47+13)%152), gy=yp+10+(((i*71+S.t*40*(1+(i%3)*0.3))%1000)/1000)*Math.max(4,TUBE_BOT-yp-20);
      ctx.beginPath(); ctx.arc(gx,gy,4,0,Math.PI*2); ctx.fill();
    }
    // 노즐
    ctx.fillStyle='#d6e4ef'; ctx.fillRect(cx-8,TUBE_BOT,16,22);
    // 유리벽
    ctx.lineWidth=5; ctx.strokeStyle='#7f9bb3';
    ctx.beginPath(); ctx.moveTo(TUBE_X0,TUBE_TOP); ctx.lineTo(TUBE_X0,TUBE_BOT); ctx.lineTo(TUBE_X1,TUBE_BOT); ctx.lineTo(TUBE_X1,TUBE_TOP); ctx.stroke();

    // 눈금
    ctx.fillStyle='#56708a'; ctx.strokeStyle='#56708a'; ctx.lineWidth=2; ctx.font='bold 13px sans-serif'; ctx.textAlign='right';
    for(i=0;i<=100;i+=10){
      var ty=TUBE_BOT-KPX*i;
      ctx.beginPath(); ctx.moveTo(TUBE_X0-9,ty); ctx.lineTo(TUBE_X0,ty); ctx.stroke();
      ctx.fillText(i,TUBE_X0-13,ty+4);
    }
    ctx.textAlign='left'; ctx.fillText('mL',TUBE_X0-40,TUBE_TOP-6);

    // 피스톤 현재 위치선
    ctx.setLineDash([5,4]); ctx.strokeStyle='#d9603f'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(TUBE_X0-26,yp); ctx.lineTo(TUBE_X0,yp); ctx.stroke(); ctx.setLineDash([]);

    // 피스톤
    var g=ctx.createLinearGradient(0,yp-22,0,yp);
    g.addColorStop(0,'#b9c4cf'); g.addColorStop(1,'#8996a3');
    ctx.fillStyle=g; ctx.strokeStyle='#56708a'; ctx.lineWidth=3;
    rr(ctx,TUBE_X0+3,yp-22,TUBE_X1-TUBE_X0-6,22,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#7b8997'; ctx.fillRect(cx-7,yp-90,14,70);
    ctx.fillStyle='#4b6fb5'; rr(ctx,cx-42,yp-100,84,12,5); ctx.fill();

    // 누르는 힘 화살표
    var len=14+Pv*9, ay=yp-106;
    ctx.strokeStyle='#d9603f'; ctx.fillStyle='#d9603f'; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx,ay-len); ctx.lineTo(cx,ay-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,ay+4); ctx.lineTo(cx-11,ay-10); ctx.lineTo(cx+11,ay-10); ctx.closePath(); ctx.fill();
    ctx.lineCap='butt'; ctx.font='bold 14px sans-serif'; ctx.textAlign='left';
    ctx.fillText('누르는 힘',cx+18,ay-len/2+2);

    // 부피 표시
    ctx.fillStyle='#14437a'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('V = '+V.toFixed(0)+' mL',cx,(yp+TUBE_BOT)/2+7);

    drawGauge(ctx,430,440,62,Pv);
  }

  /* ---------- 미시 뷰 ---------- */
  function drawMicro(){
    var c=micro, ctx=c.ctx, W=c.W, H=c.H, V=S.V, h=boxH(V), top=BB-h, i, p;
    ctx.setTransform(c.s,0,0,c.s,0,0); ctx.clearRect(0,0,W,H);

    // 처음(100 mL) 위치 안내선
    ctx.setLineDash([5,6]); ctx.strokeStyle='#c4d0dc'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(BX-14,BB-BH); ctx.lineTo(BX+BW+14,BB-BH); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#8a97a5'; ctx.font='bold 13px sans-serif'; ctx.textAlign='right';
    if(V<99) ctx.fillText('100 mL 위치',BX+BW+12,BB-BH-6);

    // 기체 공간
    ctx.fillStyle='rgba(120,180,255,'+(0.12+0.06*pressure(V))+')';
    ctx.fillRect(BX,top,BW,h);

    // 벽
    ctx.lineWidth=7; ctx.strokeStyle='#56708a'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(BX,BB-BH-12); ctx.lineTo(BX,BB); ctx.lineTo(BX+BW,BB); ctx.lineTo(BX+BW,BB-BH-12); ctx.stroke();

    // 피스톤
    ctx.fillStyle='#9aa8b6'; ctx.strokeStyle='#56708a'; ctx.lineWidth=3;
    rr(ctx,BX+4,top-18,BW-8,18,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#7b8997'; ctx.fillRect(BX+BW/2-7,top-44,14,26);
    ctx.fillStyle='#4b6fb5'; rr(ctx,BX+BW/2-40,top-54,80,10,4); ctx.fill();

    if(!S.showP){
      ctx.fillStyle='#6b7c8d'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
      ctx.fillText('입자 운동 표시 OFF',BX+BW/2,top+h/2+6);
      return;
    }
    // 피스톤 충돌 불꽃
    for(i=0;i<P.length;i++){
      p=P[i];
      if(p.flash>0){
        ctx.fillStyle='rgba(255,196,0,'+(p.flash*0.9)+')';
        ctx.beginPath(); ctx.arc(BX+p.fx,top,5+9*p.flash,0,Math.PI*2); ctx.fill();
      }
    }
    // 입자
    for(i=0;i<P.length;i++){
      p=P[i];
      var sx=BX+p.x, sy=BB-p.y;
      ctx.fillStyle='#2b7de9'; ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(sx,sy,PR,0,Math.PI*2); ctx.fill(); ctx.stroke();
      if(S.showV){
        var len=SPEED*p.f*0.1, ux=p.dx, uy=-p.dy;
        var ex=sx+ux*(PR+len), ey=sy+uy*(PR+len);
        ctx.strokeStyle='#1d2b3a'; ctx.fillStyle='#1d2b3a'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.moveTo(sx+ux*PR,sy+uy*PR); ctx.lineTo(ex,ey); ctx.stroke();
        var a=Math.atan2(uy,ux);
        ctx.beginPath(); ctx.moveTo(ex+Math.cos(a)*6,ey+Math.sin(a)*6);
        ctx.lineTo(ex+Math.cos(a+2.5)*7,ey+Math.sin(a+2.5)*7);
        ctx.lineTo(ex+Math.cos(a-2.5)*7,ey+Math.sin(a-2.5)*7); ctx.closePath(); ctx.fill();
      }
    }
  }

  /* ---------- 그래프 ---------- */
  function drawGraph(){
    var c=graph, ctx=c.ctx, W=c.W, H=c.H;
    var L=62, Rg=20, Tp=20, B=52, pw=W-L-Rg, ph=H-Tp-B;
    var inv=(S.mode==='inv'), xMax=inv?5.5:110, yMax=6, i, v;
    function gxx(x){ return L+pw*x/xMax; }
    function gxv(V){ return gxx(inv?100/V:V); }
    function gy(Pv){ return Tp+ph*(1-Pv/yMax); }
    ctx.setTransform(c.s,0,0,c.s,0,0); ctx.clearRect(0,0,W,H);

    ctx.font='13px sans-serif'; ctx.lineWidth=1; ctx.strokeStyle='#dde6ee'; ctx.fillStyle='#5b6b7c';
    ctx.textAlign='right';
    for(v=0; v<=yMax; v+=1){ ctx.beginPath(); ctx.moveTo(L,gy(v)); ctx.lineTo(W-Rg,gy(v)); ctx.stroke(); ctx.fillText(v,L-8,gy(v)+4); }
    ctx.textAlign='center';
    var xs=inv?[0,1,2,3,4,5]:[0,20,40,60,80,100];
    for(i=0;i<xs.length;i++){ ctx.beginPath(); ctx.moveTo(gxx(xs[i]),Tp); ctx.lineTo(gxx(xs[i]),Tp+ph); ctx.stroke(); ctx.fillText(xs[i],gxx(xs[i]),Tp+ph+18); }
    ctx.strokeStyle='#42576b'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(L,Tp); ctx.lineTo(L,Tp+ph); ctx.lineTo(W-Rg,Tp+ph); ctx.stroke();
    ctx.fillStyle='#1d2b3a'; ctx.font='bold 14px sans-serif';
    ctx.fillText(inv?'부피의 역수 1/V (×100)':'부피 V (mL)',L+pw/2,H-8);
    ctx.save(); ctx.translate(16,Tp+ph/2); ctx.rotate(-Math.PI/2); ctx.fillText('압력 P (기압)',0,0); ctx.restore();

    // 이론선(보일 법칙)
    ctx.setLineDash([6,5]); ctx.strokeStyle='#8a97a5'; ctx.lineWidth=2; ctx.beginPath();
    if(inv){ ctx.moveTo(gxx(0),gy(0)); ctx.lineTo(gxx(5.4),gy(5.4)); }
    else { for(v=V_MIN; v<=V_MAX; v+=1){ var px=gxv(v), py=gy(pressure(v)); if(v===V_MIN) ctx.moveTo(px,py); else ctx.lineTo(px,py); } }
    ctx.stroke(); ctx.setLineDash([]);

    // 측정 자취
    if(S.trail.length>1){
      ctx.strokeStyle='#f08a1c'; ctx.lineWidth=5; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.beginPath();
      for(i=0;i<S.trail.length;i++){ var q=S.trail[i]; if(i===0) ctx.moveTo(gxv(q.V),gy(q.P)); else ctx.lineTo(gxv(q.V),gy(q.P)); }
      ctx.stroke(); ctx.lineCap='butt';
    }
    // 기록한 점
    for(i=0;i<S.rec.length;i++){
      var r=S.rec[i];
      ctx.fillStyle='#f08a1c'; ctx.strokeStyle='#1d2b3a'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(gxv(r.V),gy(r.P),10,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText(r.n,gxv(r.V),gy(r.P)+4);
    }
    // 현재 점
    ctx.fillStyle='#2b7de9'; ctx.strokeStyle='#1d2b3a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(gxv(S.V),gy(pressure(S.V)),9,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  /* ---------- 표/텍스트 ---------- */
  var el={ dV:document.getElementById('dV'), dP:document.getElementById('dP'), dPV:document.getElementById('dPV'),
    status:document.getElementById('status'), hits:document.getElementById('hits'),
    sliderVal:document.getElementById('sliderVal'), microNote:document.getElementById('microNote'),
    tbl:document.getElementById('tbl') };

  function renderTable(){
    var h='<tr><th>번호</th><th>부피(mL)</th><th>압력(기압)</th><th>압력×부피</th></tr>';
    if(S.rec.length===0){ h+='<tr><td colspan="4" style="color:#8a97a5">아직 기록한 값이 없어요</td></tr>'; }
    for(var i=0;i<S.rec.length;i++){
      var r=S.rec[i];
      h+='<tr><td>'+r.n+'</td><td>'+r.V.toFixed(1)+'</td><td>'+r.P.toFixed(2)+'</td><td>'+(r.V*r.P).toFixed(1)+'</td></tr>';
    }
    el.tbl.innerHTML=h;
  }

  function updateText(){
    var V=S.V, Pv=pressure(V), d=S.target-V;
    el.dV.textContent=V.toFixed(1); el.dP.textContent=Pv.toFixed(2); el.dPV.textContent=(V*Pv).toFixed(0);
    el.hits.textContent=S.hitRate;
    el.sliderVal.textContent=Math.round(S.target)+' mL';
    if(S.msgT>0) el.status.textContent=S.msg;
    else if(d<-0.4) el.status.textContent='⬇ 누르는 중: 부피 ↓ → 벽에 더 자주 부딪힘 → 압력 ↑';
    else if(d>0.4) el.status.textContent='⬆ 당기는 중: 부피 ↑ → 벽에 덜 부딪힘 → 압력 ↓';
    else el.status.textContent='부피 '+V.toFixed(0)+' mL에서 안정 상태입니다. 피스톤을 움직여 보세요.';
    el.microNote.textContent=S.showP ? '온도가 같아 입자는 같은 속력이지만, 공간이 좁을수록 피스톤에 더 자주 부딪혀요.' : '입자 운동 표시를 켜면 확대 화면이 보여요.';
  }

  /* ---------- 조작 ---------- */
  var slider=document.getElementById('slider'), presetBtns=document.querySelectorAll('.pre');
  function setTarget(v){
    S.target=clamp(v,V_MIN,V_MAX); slider.value=S.target;
    for(var i=0;i<presetBtns.length;i++){ presetBtns[i].classList.toggle('active', Number(presetBtns[i].dataset.v)===Math.round(S.target)); }
  }
  for(var bi=0;bi<presetBtns.length;bi++){
    presetBtns[bi].addEventListener('click',function(){ setTarget(Number(this.dataset.v)); });
  }
  slider.addEventListener('input',function(){ setTarget(Number(slider.value)); });
  document.getElementById('btnPush').addEventListener('click',function(){ setTarget(S.target-5); });
  document.getElementById('btnPull').addEventListener('click',function(){ setTarget(S.target+5); });

  function setToggle(btn,key,val){ S[key]=val; btn.classList.toggle('on',val); btn.setAttribute('aria-pressed',val); btn.querySelector('b').textContent=val?'ON':'OFF'; }
  var tgP=document.getElementById('tgP'), tgV=document.getElementById('tgV');
  tgP.addEventListener('click',function(){ setToggle(tgP,'showP',!S.showP); });
  tgV.addEventListener('click',function(){ setToggle(tgV,'showV',!S.showV); });

  var tabPV=document.getElementById('tabPV'), tabInv=document.getElementById('tabInv'), gNote=document.getElementById('gNote');
  function setMode(m){
    S.mode=m; tabPV.classList.toggle('on',m==='pv'); tabInv.classList.toggle('on',m==='inv');
    gNote.textContent = m==='pv'
      ? '점선: 보일 법칙 · 주황 선: 지금까지 측정한 값 · 주황 점: 기록한 값 (반비례 곡선)'
      : '압력과 부피의 역수는 원점을 지나는 직선 → 압력은 부피에 반비례해요.';
  }
  tabPV.addEventListener('click',function(){ setMode('pv'); });
  tabInv.addEventListener('click',function(){ setMode('inv'); });

  document.getElementById('rec').addEventListener('click',function(){
    if(S.rec.length>=MAX_REC){ S.msg='기록은 '+MAX_REC+'개까지 가능해요. 초기화 후 다시 기록하세요.'; S.msgT=3; return; }
    var V=Math.round(S.V*10)/10;
    S.recCount++; S.rec.push({n:S.recCount, V:V, P:pressure(V)});
    S.msg='📍 '+S.recCount+'번 기록: 부피 '+V.toFixed(1)+' mL, 압력 '+pressure(V).toFixed(2)+' 기압'; S.msgT=2.5;
    renderTable();
  });

  document.getElementById('reset').addEventListener('click',function(){
    S.V=100; setTarget(100); S.trail=[]; S.rec=[]; S.recCount=0; S.hitCount=0; S.hitRate=0; S.hitTimer=0; S.msgT=0;
    setToggle(tgP,'showP',true); setToggle(tgV,'showV',false); setMode('pv');
    initParticles(); renderTable();
    S.trail.push({V:S.V,P:pressure(S.V)});
  });

  /* ---------- 메인 루프 ---------- */
  var last=0;
  function frame(ts){
    var dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts; S.t+=dt;
    if(S.msgT>0) S.msgT-=dt;
    S.V+=(S.target-S.V)*(1-Math.exp(-dt*5));
    if(Math.abs(S.target-S.V)<0.05) S.V=S.target;
    var tr=S.trail, lp=tr[tr.length-1];
    if(!lp || Math.abs(S.V-lp.V)>=0.5){ tr.push({V:S.V,P:pressure(S.V)}); if(tr.length>600) tr.shift(); }
    updateParticles(dt);
    drawMacro(); drawMicro(); drawGraph(); updateText();
    requestAnimationFrame(frame);
  }
  setTarget(100); renderTable();
  S.trail.push({V:S.V,P:pressure(S.V)});
  requestAnimationFrame(frame);
})();
</script>
