<head>

<style>

.hudc .i{border-color:#3b82f6;background:#eff6ff}.hudc .i b{color:#1d4ed8}.hudc .r{border-color:#f97316;background:#fff7ed}.hudc .r b{color:#c2410c}.hudc .m{border-color:#94a3b8}.hudc .m b{color:#475569}

.stg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stg3 .btn{min-height:52px;line-height:1.15;padding:2px 6px;font-size:clamp(12px,1.05vw,16px)}.stg3 .btn.on{background:#fde68a;border-color:#f59e0b;color:#78350f}.stg3 .btn.ok{background:#dcfce7;border-color:#22c55e}

.cv{width:100%;border:2px solid #cbd5e1;border-radius:12px;background:#f8fafc;display:block}

.spd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.spd div{border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:800;font-size:clamp(12px,1.02vw,15px);background:#f8fafc}.spd i{display:block;height:9px;border-radius:5px;background:#38bdf8;margin-top:3px}

.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:900;font-size:clamp(12px,1.05vw,16px);border:2px solid}
.b-d{background:#fef9c3;border-color:#eab308;color:#713f12}.b-r{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}.b-f{background:#dcfce7;border-color:#22c55e;color:#14532d}.b-n{background:#e5e7eb;border-color:#9ca3af;color:#374151}

.zone.src{border-color:#f59e0b}.zone.non{border-color:#64748b}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#dcfce7;border:2px solid #22c55e;border-radius:10px;padding:3px 8px;font-size:clamp(12px,1.05vw,16px)}

const QZ=[
 {q:'검정말 수조에서 위로 올라오는 기포의 정체는?',o:['광합성으로 생긴 산소','호흡으로 생긴 이산화 탄소','수증기','질소'],a:0,e:'식물이 광합성을 하면 산소가 만들어져요. 기포 수가 많을수록 광합성량이 많다고 볼 수 있어요.'},
 {q:'빛을 일정 세기 이상으로 올려도 광합성량이 더 늘지 않는 까닭은?',o:['이산화 탄소 농도나 온도 같은 다른 요인이 부족하기 때문','검정말이 빛을 싫어하기 때문','빛은 광합성과 관계가 없기 때문','수조의 물이 줄어들기 때문'],a:0,e:'가장 부족한 요인(한계 요인)이 광합성량을 제한해요. 빛 외에 CO₂ 농도나 온도가 부족하면 빛을 더 줘도 광합성량이 일정해져요.'},
 {q:'수조에 탄산수소 나트륨을 넣는 목적은?',o:['물속에 이산화 탄소를 공급하려고','물을 따뜻하게 하려고','산소를 없애려고','빛을 더 밝게 하려고'],a:0,e:'탄산수소 나트륨(NaHCO₃)은 물에 녹아 이산화 탄소를 공급해 줘요.'},
 {q:'온도를 40°C보다 훨씬 높이면 광합성량은 어떻게 될까?',o:['급격히 감소한다','계속 같은 비율로 증가한다','일정하게 유지된다','두 배로 늘어난다'],a:0,e:'광합성에 관여하는 효소가 높은 온도에서 제 기능을 못 해 광합성량이 급격히 줄고, 식물도 시들어요.'},
 {q:'온도와 광합성량의 관계를 나타낸 그래프의 모양은?',o:['증가하다가 최적 온도 이후 급감하는 종 모양','계속 증가하다가 일정해지는 곡선','계속 감소하는 직선','변화 없는 수평선'],a:0,e:'빛·CO₂ 농도는 증가하다 일정해지지만, 온도는 최적 온도 이후 급감하는 종 모양 곡선이에요.'}];
let qi=0,qdone=false,qscore=0,qmap=[];
function showQ(){const Q=QZ[qi];qdone=false;$('#qprog').textContent='문제 '+(qi+1)+' / '+QZ.length+' · 점수 '+qscore;$('#qq').textContent=Q.q;$('#qexp').className='qexp';$('#qnext').style.display='none';$('#qopts').innerHTML='';
  qmap=Q.o.map((_,i)=>i);for(let i=qmap.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qmap[i],qmap[j]]=[qmap[j],qmap[i]]}
  qmap.forEach(oi=>{const b=document.createElement('button');b.className='qopt';b.textContent=Q.o[oi];b.dataset.o=oi;b.onclick=()=>{if(qdone)return;qdone=true;const ok=oi===Q.a;if(ok)qscore++;
    [...$('#qopts').children].forEach(x=>{if(+x.dataset.o===Q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#qexp').textContent=(ok?'⭕ 정답! ':'❌ 아쉬워요. ')+Q.e;$('#qexp').className='qexp on';ok?sOK():sNO();
    const nx=$('#qnext');nx.style.display='';nx.textContent=qi<QZ.length-1?'다음 ▶':'결과 보기 ✔'};$('#qopts').appendChild(b)})}
$('#btnQuiz').onclick=()=>{qi=0;qscore=0;$('#modal').classList.add('on');showQ()};
$('#qclose').onclick=()=>$('#modal').classList.remove('on');
$('#qnext').onclick=()=>{if(qi<QZ.length-1){qi++;showQ()}else{S.quiz=Math.max(S.quiz,qscore);hud();$('#qprog').textContent='결과';$('#qq').textContent='🎉 '+qscore+' / '+QZ.length+' 정답!';$('#qopts').innerHTML='';$('#qexp').className='qexp';$('#qnext').style.display='none'}};

function resetAll(){
  Object.assign(X,{1:5,2:3,3:25});for(const k of [1,2,3]){PL[k]={};S.pt[k]=new Set();S.done[k]=0;G.ghost[k]=0;$('#cc'+k).style.display='none'}S.quiz=-1;G.bub=[];G.gas=0;
  for(const k of [1,2,3]){sliderUI(k);infoU(k);tipU(k);$('#ctl'+k).style.display='none'}
  fbx('#fb1','🌿 슬라이더로 빛의 세기를 바꾸고, 놓을 때마다 기록되는 점으로 그래프를 완성해 보세요.');fbx('#fb2','🧂 탄산수소 나트륨 양을 바꿔 보며 그래프를 완성해 보세요.');fbx('#fb3','🌡️ 온도를 5°C씩 바꿔 보며 그래프를 완성해 보세요. 높은 온도도 꼭 확인!');
  hud();setMode(1)}
$('#btnReset').onclick=resetAll;
let lastT=0;
function loop(){try{const now=performance.now()/1000,dt=Math.min(.05,now-(lastT||now));lastT=now;
    drawScene(mode,$('#a'+mode),now,dt);drawGraph(mode,$('#b'+mode),now)}catch(e){console.error(e)}requestAnimationFrame(loop)}
resetAll();requestAnimationFrame(loop);
</script>
</body>
