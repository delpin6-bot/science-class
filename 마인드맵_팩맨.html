<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>마인드맵 팩맨 - 과학 개념 복습</title>
<style>
:root{--bg:#070b16;--gold:#ffd54a;--ink:#f3f6fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#hud{flex:0 0 auto;height:max(40px,6vh);display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 max(10px,1.2vw);background:#04060d;border-bottom:1px solid #1b2440;font-size:clamp(14px,2.5vh,26px);font-weight:800;white-space:nowrap}
#hud .grp{display:flex;align-items:center;gap:clamp(10px,1.6vw,30px);min-width:0}
#hud .lbl{color:#8a97b5;font-weight:600;margin-right:.35em}
#hUnit{color:var(--gold);overflow:hidden;text-overflow:ellipsis;max-width:26vw}
#hPct{font-variant-numeric:tabular-nums;display:inline-block;min-width:3.4ch;text-align:right}
.bar{display:inline-block;vertical-align:middle;width:clamp(60px,9vw,150px);height:clamp(9px,1.8vh,18px);border-radius:999px;background:#1a2342;border:2px solid #34426e;overflow:hidden;margin-left:.5em}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3B5BDB,#0CA678,#F08C00,#D6336C);transition:width .25s}
#hLives{letter-spacing:.08em;color:#ff5a6e}#hLives .x{color:#3a425e}
select{height:max(32px,4.8vh);border-radius:9px;border:1px solid #2a3558;background:#101830;color:var(--ink);font-weight:700;font-size:clamp(13px,2.2vh,22px);font-family:inherit;padding:0 .5em;max-width:24vw;touch-action:manipulation}
.ib{width:max(34px,4.8vh);height:max(34px,4.8vh);border-radius:9px;border:1px solid #2a3558;background:#101830;color:var(--ink);
  font-size:clamp(14px,2.4vh,24px);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;touch-action:manipulation}
.ib:active{background:#1d2850}.ib.warn{border-color:var(--gold);color:var(--gold)}.ib.off{opacity:.45}
#stage{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;background:var(--bg);touch-action:none}
#dpad{position:absolute;display:flex;z-index:3;touch-action:none}
#dpad.hide{display:none}
.dp{border:2px solid #3a4a80;border-radius:16px;background:rgba(18,28,60,.78);color:#e8eeff;padding:0;cursor:pointer;touch-action:none;font-family:inherit}
.dp:active,.dp.on{background:#2b4aa8;border-color:#8fb0ff}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,5,12,.8);z-index:5}
#modal.on{display:flex}
.card{width:min(900px,94%);max-height:96%;overflow:auto;background:#0f1630;border:2px solid #2d3b70;border-radius:22px;word-break:keep-all;
  padding:clamp(14px,2.6vh,32px) clamp(18px,3vw,42px);box-shadow:0 20px 70px #000a;touch-action:pan-y}
.card.wide{width:min(1120px,97%)}
.card h1{margin:0 0 .2em;font-size:clamp(22px,4.2vh,44px);line-height:1.15}
.card h2{margin:.2em 0 .4em;font-size:clamp(15px,2.4vh,24px);color:var(--gold)}
.card .sub{color:#aebbdd;font-size:clamp(14px,2.3vh,23px);margin:0 0 .6em}
.card ul{margin:0 0 .8em;padding:0;list-style:none;font-size:clamp(15px,2.6vh,27px);line-height:1.45}
.card li{margin:.35em 0;padding-left:1.8em;position:relative}
.card li b.n{position:absolute;left:0;top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:.3em 0 .8em}
.chip{padding:.25em .75em;border-radius:999px;color:#fff;font-weight:800;font-size:clamp(14px,2.3vh,23px);white-space:nowrap}
.center{display:inline-block;padding:.15em .8em;border:3px solid var(--gold);border-radius:999px;color:var(--gold);font-weight:900;font-size:clamp(20px,3.6vh,38px);margin:.1em 0 .5em}
.row{display:flex;gap:12px}
.btn{display:block;flex:1;min-height:max(56px,8.5vh);margin-top:.4em;border:0;border-radius:16px;font-weight:800;font-size:clamp(18px,3vh,30px);font-family:inherit;
  color:#08101f;background:linear-gradient(180deg,#ffe27a,#ffbf2e);cursor:pointer;touch-action:manipulation}
.btn.sec{background:#1c2750;color:#dfe7ff;border:2px solid #3a4a80}
.btn:active{filter:brightness(.9)}
.map svg{width:100%;height:auto;max-height:62vh;display:block}
.wn{opacity:0;animation:pop .45s ease-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.wn,.bn{transform-box:fill-box;transform-origin:center}
.bn{opacity:0;animation:pop .45s ease-out forwards}
@media (max-width:760px){#bMute{display:none}#hUnit{max-width:20vw}}
/* QRFIX_1017 */
#bQr{width:auto;padding:0 10px;font-weight:800;font-size:clamp(12px,2vh,18px)}
html.qrlock #selGrade,html.qrlock #selUnit,html.qrlock #bQr,html.qrlock #mNext{display:none!important}
</style>
<style id="phoneLabCss">/* PHONELAB_1018 : 스마트폰 전용 레이아웃 (전자칠판 화면은 그대로) */
@media (max-width:600px){
html header h1,html .title-group h1,html .title-block h1{font-size:16px!important;line-height:1.25!important;margin:0!important}
html header p,html .title-group p,html .title-block p{font-size:10.5px!important;line-height:1.35!important;margin:2px 0 0!important}
html .wrap>h1,html #home>h1{font-size:17px!important;line-height:1.25!important}
html .lead{font-size:11.5px!important;line-height:1.45!important}
html .unified-nav-actions,html .header-actions{display:flex!important;flex-wrap:nowrap!important;gap:4px!important;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:0!important;margin:4px 0!important}
html .unified-nav-actions::-webkit-scrollbar,html .header-actions::-webkit-scrollbar{display:none}
html .btn-top.btn-top,html .btn-help.btn-help,html a.back.back{flex:0 0 auto;min-height:30px!important;height:30px;padding:0 9px!important;font-size:11px!important;border-radius:9px!important;white-space:nowrap;display:inline-flex;align-items:center;box-sizing:border-box}
html .btn-unified-nav.btn-unified-nav:is(#kjsHome,.btn-hub-main,.btn-hub-sim,.btn-hub-game,.btn-hub-mod,#kjsQrBtn,.kjs-qr-btn,#btnRestart,#btnSound,a[href*="게임서랍"]):not(.kjs-seg *),html #btnFullscreen.btn-top{width:34px;height:32px;min-height:0!important;padding:0!important;justify-content:center;font-size:0!important}
html .btn-unified-nav:is(#kjsHome,.btn-hub-main,.btn-hub-sim,.btn-hub-game,.btn-hub-mod,#kjsQrBtn,.kjs-qr-btn,#btnRestart,#btnSound,a[href*="게임서랍"]):not(.kjs-seg *)>span{font-size:0!important}
html .btn-unified-nav:is(#kjsHome,.btn-hub-main,.btn-hub-sim,.btn-hub-game,.btn-hub-mod,#kjsQrBtn,.kjs-qr-btn,#btnRestart,#btnSound,a[href*="게임서랍"]):not(.kjs-seg *)::before,html #btnFullscreen::before{font-size:15px;line-height:1}
html .kjs-seg a{font-size:11px!important;padding:0 6px!important}
html [class*="kjs-"][class*="qr"]:not(.kjs-seg *)::before{content:"📱"}
html #kjsHome:not(.kjs-seg *)::before{content:"↺"}
html .btn-hub-main:not(.kjs-seg *)::before{content:"📚"}
html .btn-hub-sim:not(.kjs-seg *)::before{content:"🔬"}
html .btn-hub-game:not(.kjs-seg *)::before{content:"🎮"}
html .btn-hub-mod:not(.kjs-seg *)::before{content:"⚡"}
html #btnFullscreen::before{content:"⛶"}
html #kjsQrBtn::before{content:"📱"}
html #btnRestart.btn-unified-nav::before{content:"🔄"}
html #btnSound.btn-unified-nav::before{content:"🔊"}
html a.btn-unified-nav[href*="게임서랍"]:not(.btn-hub-game):not(.kjs-seg *)::before{content:"🎮"}
html #kjsImmBtn{right:8px!important;bottom:8px!important;width:36px;height:36px;min-height:0!important;padding:0!important;border-radius:11px!important;font-size:0!important;border-width:1.5px!important;opacity:.85}
html #kjsImmBtn::before{content:"⛶";font-size:17px;line-height:1}
html h2{font-size:14px!important}
html h3{font-size:13px!important}
html .stat-card{padding:7px 9px!important}
html .stat-val{font-size:15px!important}
html .stat-lbl,html .stat-desc{font-size:10px!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="grp">
      <span id="hUnit">-</span>
      <span><span class="lbl">수집</span><span id="hPct">0%</span><span class="bar"><i id="hBar"></i></span></span>
      <span id="hLives"></span>
    </div>
    <div class="grp" style="gap:7px">
      <button class="ib" id="bQr" title="이 단원 학생용 QR (스캔하면 바로 시작)">📱 QR</button>
      <select id="selGrade" aria-label="학년"></select>
      <select id="selUnit" aria-label="단원"></select>
      <button class="ib" id="bPad" title="방향 버튼 켜기/끄기">✥</button>
      <button class="ib" id="bMute" title="소리">♪</button>
      <button class="ib" id="bRestart" title="처음부터 (두 번 누르기)">↻</button>
      <button class="ib" id="bFull" title="전체화면 (F)">⛶</button>
      <button class="ib" id="bPause" title="일시정지 (P)">❚❚</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="dpad"><button class="dp" data-d="-1,0">◀</button><button class="dp" data-d="0,-1">▲</button><button class="dp" data-d="0,1">▼</button><button class="dp" data-d="1,0">▶</button></div>
    <div id="modal"><div class="card" id="card"></div></div>
  </div>
</div>

<script id="kjsLQR">

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function genMaze(seed){
  const rnd=mulberry32(seed);
  const g=Array.from({length:MR},()=>new Array(MC).fill(0));
  const set=(c,r)=>{g[r][c]=1;g[r][MC-1-c]=1;g[MR-1-r][c]=1;g[MR-1-r][MC-1-c]=1;};
  const cell=(c,r)=>c>=1&&c<=17&&r>=1&&r<=7&&!(c===17&&r===7);
  const seen=new Set(),key=(c,r)=>c+','+r;
  const stack=[[1,1]];seen.add(key(1,1));set(1,1);
  while(stack.length){
    const[c,r]=stack[stack.length-1];
    const nb=[[2,0],[-2,0],[0,2],[0,-2]].map(d=>[c+d[0],r+d[1],d]).filter(n=>cell(n[0],n[1])&&!seen.has(key(n[0],n[1])));
    if(!nb.length){stack.pop();continue;}
    const n=nb[Math.floor(rnd()*nb.length)];
    seen.add(key(n[0],n[1]));set(c+n[2][0]/2,r+n[2][1]/2);set(n[0],n[1]);stack.push([n[0],n[1]]);
  }
  for(let c=1;c<=16;c++)set(c,9);
  for(let r=1;r<=7;r++)set(19,r);
  for(let r=8;r<=10;r++)for(let c=17;c<=21;c++)g[r][c]=1;
  const pick=(arr,k)=>{const a=arr.slice(),o=[];while(o.length<k&&a.length)o.push(a.splice(Math.floor(rnd()*a.length),1)[0]);return o;};
  pick([1,3,5],2).forEach(r=>set(18,r));
  pick([1,3,5,7,9,11,13,15],3).forEach(c=>set(c,8));
  const inRing=(c,r)=>c>=16&&c<=22&&r>=7&&r<=11;
  const fl=(c,r)=>c>=0&&r>=0&&c<MC&&r<MR&&g[r][c]===1;
  const deg=(c,r)=>(fl(c+1,r)?1:0)+(fl(c-1,r)?1:0)+(fl(c,r+1)?1:0)+(fl(c,r-1)?1:0);
  for(let it=0;it<300;it++){
    let found=null;
    for(let r=1;r<MR-1&&!found;r++)for(let c=1;c<MC-1;c++){if(fl(c,r)&&deg(c,r)===1&&!inRing(c,r)){found=[c,r];break;}}
    if(!found)break;
    const[c,r]=found,cand=[];
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const wc=c+dx,wr=r+dy,tc=c+2*dx,tr=r+2*dy;
      if(tc<1||tr<1||tc>MC-2||tr>MR-2)continue;
      if(!fl(wc,wr)&&fl(tc,tr)&&!inRing(wc,wr)&&!inRing(tc,tr))cand.push([wc,wr]);
    }
    if(!cand.length){set(c,r);g[r][c]=0;break;}
    const w=cand[Math.floor(rnd()*cand.length)];set(w[0],w[1]);
  }
  const loops=[];
  for(let r=1;r<=9;r++)for(let c=1;c<=19;c++){
    if(fl(c,r)||inRing(c,r))continue;
    if(((c&1)&&!(r&1)&&fl(c,r-1)&&fl(c,r+1))||(!(c&1)&&(r&1)&&fl(c-1,r)&&fl(c+1,r)))loops.push([c,r]);
  }
  pick(loops,3).forEach(w=>set(w[0],w[1]));
  return g;
}

function bfsFrom(c0,r0){
  const d=new Int16Array(MC*MR).fill(-1);d[r0*MC+c0]=0;const q=[[c0,r0]];
  for(let i=0;i<q.length;i++){const[c,r]=q[i];for(const[dx,dy]of dirs){const nc=c+dx,nr=r+dy;if(isFloor(nc,nr)&&d[nr*MC+nc]<0){d[nr*MC+nc]=d[r*MC+c]+1;q.push([nc,nr]);}}}
  return d;
}
function layoutPellets(){
  const cand=[];
  for(let r=1;r<=7;r+=2)for(let c=1;c<=17;c+=2)if(isFloor(c,r)&&zone[r][c]===0&&!(c===1&&r===1))cand.push([c,r]);
  const seeds=[[1,1]],maps=[bfsFrom(1,1)],out=[];
  for(let k=0;k<4;k++){
    let best=null,bs=-1;
    for(const[c,r]of cand){
      let m=1e9;for(const d of maps)m=Math.min(m,d[r*MC+c]);
      if(out.some(o=>(o[1]===r&&Math.abs(o[0]-c)<8)||(Math.abs(o[1]-r)<=1&&Math.abs(o[0]-c)<5)))continue;   // 낱말 라벨이 겹치지 않게
      if(m>bs){bs=m;best=[c,r];}
    }
    out.push(best);seeds.push(best);maps.push(bfsFrom(best[0],best[1]));
    cand.splice(cand.findIndex(p=>p===best),1);
  }
  return out;
}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',v=.12,to=null,delay=0){
  if(muted)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.12,hp=800){
  if(muted)return;const a=ac();if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const b=noiseBuf.getChannelData(0);for(let i=0;i<b.length;i++)b[i]=Math.random()*2-1;}
  const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.02);
}

/* ===================== 추적용 거리 지도 ===================== */
function computeDmap(){
  dmap.fill(9999);const q=[];
  const pc=player.prog>.5?player.tc:player.c,pr=player.prog>.5?player.tr:player.r;
  if(zone[pr][pc]===5){for(const[c,r]of DOORS){dmap[r*MC+c]=0;q.push([c,r]);}}
  else{dmap[pr*MC+pc]=0;q.push([pc,pr]);}
  for(let i=0;i<q.length;i++){const[c,r]=q[i],d=dmap[r*MC+c];
    for(const[dx,dy]of dirs){const nc=c+dx,nr=r+dy;if(!isFloor(nc,nr)||zone[nr][nc]===5)continue;if(dmap[nr*MC+nc]>d+1){dmap[nr*MC+nc]=d+1;q.push([nc,nr]);}}}
}

/* ===================== 갱신 ===================== */
function spawnPopup(text,col,life=30,sub=null){popup={text,col,t:life,life,sub};}
function collectWord(w){

  floats.push({x,y:y-14,t:30,s:'+',c:lite(qCol[w.q],.5)});

}
function collectPower(p){
  p.on=false;p.t=POWER_RESPAWN;scaredT=SCARED_FRAMES;coreSeen[p.q]=true;SFX.power();
  spawnPopup('핵심 · '+U.branches[p.q].name,qCol[p.q],70,'오개념 몬스터를 정화하세요!');
  floats.push({x:OX+p.c*T+T/2,y:OY+p.r*T-6,t:50,s:'★ 핵심',c:'#ffe27a'});
  for(const g of ghosts)if(!g.dead&&g.moving){/* 방향 반전은 다음 결정에서 */}
}
function onArrive(){
  const c=player.c,r=player.r;
  for(const w of words)if(!w.got&&w.c===c&&w.r===r){collectWord(w);break;}
  for(const p of powers)if(p.on&&p.c===c&&p.r===r){collectPower(p);break;}
  computeDmap();
}
function moveOK(c,r,dx,dy){return isFloor(c+dx,r+dy);}
function tryStart(){
  const p=player,cand=[];
  if(p.wx||p.wy)cand.push([p.wx,p.wy]);
  if(p.dx||p.dy)cand.push([p.dx,p.dy]);
  for(const[dx,dy]of cand){
    if(moveOK(p.c,p.r,dx,dy)){p.dx=dx;p.dy=dy;p.tc=p.c+dx;p.tr=p.r+dy;p.prog=0;p.moving=true;p.face=Math.atan2(dy,dx);return true;}
  }
  p.moving=false;return false;
}
function stepEntity(e,speed,decide){
  if(!e.moving){decide(e);if(!e.moving)return;}
  e.prog+=speed;
  while(e.prog>=1){
    e.prog-=1;e.c=e.tc;e.r=e.tr;e.moving=false;
    if(e===player)onArrive();
    if(state!=='play'||deadT>0)return;
    decide(e);if(!e.moving){e.prog=0;break;}
  }
}
function ghostDecide(g){
  const opts=[];
  for(const[dx,dy]of dirs){const nc=g.c+dx,nr=g.r+dy;if(!isFloor(nc,nr)||zone[nr][nc]===5)continue;opts.push([dx,dy,nc,nr]);}
  if(!opts.length){g.moving=false;return;}
  const fwd=opts.filter(o=>!(o[0]===-g.dx&&o[1]===-g.dy)),use=fwd.length?fwd:opts;
  const inHub=zone[player.r][player.c]===5,scared=scaredT>0;
  const scatter=(tNow%1500)>1050;
  let pick;
  if(scared){
    if(Math.random()<.85){let bd=-1;for(const o of use){const d=dmap[o[3]*MC+o[2]];if(d>bd){bd=d;pick=o;}}}
    else pick=use[Math.floor(Math.random()*use.length)];
  }else if(!inHub&&!scatter&&Math.random()<g.aggr){
    let bd=1e9;for(const o of use){const d=dmap[o[3]*MC+o[2]]+Math.random()*.5;if(d<bd){bd=d;pick=o;}}
  }else pick=use[Math.floor(Math.random()*use.length)];
  g.dx=pick[0];g.dy=pick[1];g.tc=g.c+g.dx;g.tr=g.r+g.dy;g.prog=0;g.moving=true;
}
const ex=(e)=>(e.c+(e.tc-e.c)*e.prog);
const ey=(e)=>(e.r+(e.tr-e.r)*e.prog);
function step(){
  tNow++;
  if(shake>0)shake--;
  for(const f of floats){f.t--;f.y-=.4;}floats=floats.filter(f=>f.t>0);
  for(const f of flyers){f.t++;if(f.t>=f.life)f.w.land=tNow;}flyers=flyers.filter(f=>f.t<f.life);
  if(popup){popup.t--;if(popup.t<=0)popup=null;}
  if(state!=='play')return;
  if(deadT>0){deadT--;if(deadT===0){if(lives<=0){state='over';setTimeout(gameOver,200);}else resetPositions();}return;}
  if(invuln>0)invuln--;
  if(scaredT>0)scaredT--;
  for(const p of powers)if(!p.on&&p.t>0){p.t--;if(p.t===0)p.on=true;}
  const p=player;
  if(p.moving&&(p.wx===-p.dx&&p.wy===-p.dy)&&(p.wx||p.wy)){        // 이동 중 반대 방향 입력 → 즉시 U턴
    const oc=p.c,or=p.r;p.c=p.tc;p.r=p.tr;p.tc=oc;p.tr=or;p.prog=1-p.prog;p.dx=p.wx;p.dy=p.wy;p.face=Math.atan2(p.dy,p.dx);
  }
  stepEntity(p,PSPEED,()=>tryStart());
  if(state!=='play')return;
  for(const g of ghosts){
    if(g.dead>0){g.dead--;if(g.dead===0){g.c=g.tc=GSPAWN[g.k][0];g.r=g.tr=GSPAWN[g.k][1];g.prog=0;g.moving=false;g.dx=g.dy=0;}continue;}
    stepEntity(g,PSPEED*(scaredT>0?.55:.8),ghostDecide);
  }
  // 충돌 (허브 안은 안전지대)
  if(zone[p.prog>.5?p.tr:p.r][p.prog>.5?p.tc:p.c]===5)return;
  const px=ex(p),py=ey(p);
  for(const g of ghosts){
    if(g.dead>0)continue;
    if(Math.hypot(px-ex(g),py-ey(g))<.62){
      if(scaredT>0)purify(g);
      else if(invuln===0){hitPlayer();break;}
    }
  }
}

  ctx.fillStyle='#070b16';ctx.fillRect(0,0,cv.width,cv.height);
  if(!U)return;
  if(cache)ctx.drawImage(cache,0,0);
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.save();
  if(shake>0)ctx.translate(Math.sin(shake*2.4)*3,0);
  drawPellets();
  for(const g of ghosts)drawGhost(g);
  drawPlayer();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 17px '+FONT;ctx.lineWidth=5;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.t/20);ctx.strokeStyle='rgba(5,8,20,.9)';ctx.strokeText(f.s,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y);}
  ctx.globalAlpha=1;ctx.restore();
  drawTopBar();drawStrip();
  for(const f of flyers){
    const k=f.t/f.life,e=k*k*(3-2*k),x=f.x0+(f.x1-f.x0)*e,y=f.y0+(f.y1-f.y0)*e-Math.sin(k*Math.PI)*30,col=qCol[f.w.q];
    ctx.save();ctx.translate(x,y);ctx.scale(1-.2*k,1-.2*k);ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=2;
    rr(-48,-13,96,26,13);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';fitText(f.w.word,86,14,9,900);ctx.fillText(f.w.word,0,1);ctx.restore();
  }
  if(state==='paused'){
    ctx.fillStyle='rgba(3,5,12,.66)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 72px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('❚❚ 일시정지',W/2,H/2-10);ctx.font='600 28px '+FONT;ctx.fillStyle='#aebbdd';ctx.fillText('화면을 탭하면 계속',W/2,H/2+50);
  }
}

/* ===================== HUD / 카드 ===================== */
function updateHUD(){
  if(!U)return;
  $('hUnit').textContent=labelOf(unitKey);
  const pct=Math.round(got/Math.max(1,words.length)*100);
  $('hPct').textContent=pct+'%';$('hBar').style.width=pct+'%';
  let h='';for(let i=0;i<3;i++)h+=i<lives?'♥':'<span class="x">♥</span>';

}
function showModal(h,wide){card.className='card'+(wide?' wide':'');card.innerHTML=h;modal.classList.add('on');card.scrollTop=0;}
function hideModal(){modal.classList.remove('on');}
function branchChips(){return `<div class="chips">${U.branches.map((b,i)=>`<span class="chip" style="background:${qCol[i]}">${esc(b.name)}</span>`).join('')}</div>`;}
function showIntro(){
  state='menu';resetRun();
  showModal(`<h1>🧠 마인드맵 팩맨</h1>
    <p class="sub">${esc(labelOf(unitKey))} · 낱말을 먹으며 마인드맵을 완성해요!</p>
    <div class="center">${esc(U.center)}</div>${branchChips()}
    <ul>
      <li><b class="n">👆</b>화면을 <b>밀거나</b> 아래 <b>방향 버튼</b>·방향키(WASD)로 움직여요.</li>
      <li><b class="n">🔤</b>4개 구역의 <b>낱말 펠릿 16개</b>를 모두 먹으면 마인드맵 완성!</li>
      <li><b class="n">★</b>구석의 <b>핵심 펠릿</b>을 먹으면 <b>오개념 몬스터</b>를 정화할 수 있어요. 가운데 <b>허브</b>는 안전지대예요.</li>
    </ul>
    <div class="row"><button class="btn" id="mGo">시작하기 ▶</button></div>`);
  $('mGo').onclick=()=>{ac();SFX.ready();hideModal();state='play';};
}
function mapSVG(){
  const pos=[[330,140],[670,140],[330,420],[670,420]];
  let s=`<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family='${FONT.replace(/"/g,"&quot;")}'>`;
  const cx=500,cy=280;let lines='',nodes='';
  U.branches.forEach((b,q)=>{
    const[bx,by]=pos[q],left=q%2===0,col=qCol[q],wx=left?100:900;
    lines+=`<line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="5" stroke-linecap="round" opacity=".85"/>`;
    b.words.forEach((w,j)=>{
      const wy=by+(j-1.5)*44,ex=left?wx+70:wx-70,sx=left?bx-85:bx+85;
      lines+=`<path d="M${sx} ${by} C ${(sx+ex)/2} ${by}, ${(sx+ex)/2} ${wy}, ${ex} ${wy}" fill="none" stroke="${col}" stroke-width="2.5" opacity=".7"/>`;
      const fs=w.length>9?13:w.length>7?15:17;
      nodes+=`<g class="wn" style="animation-delay:${.25+q*.35+j*.09}s"><rect x="${wx-70}" y="${wy-17}" width="140" height="34" rx="17" fill="${rgba(col,.2)}" stroke="${col}" stroke-width="2"/><text x="${wx}" y="${wy+1}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(w)}</text></g>`;
    });
    const fs=b.name.length>6?19:22;
    nodes+=`<g class="bn" style="animation-delay:${.1+q*.35}s"><rect x="${bx-85}" y="${by-24}" width="170" height="48" rx="14" fill="${col}"/><text x="${bx}" y="${by+1}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="900" fill="#fff">${esc(b.name)}</text></g>`;
  });
  const t=U.center,fs=t.length>8?22:t.length>5?27:32;
  nodes+=`<g class="bn"><ellipse cx="${cx}" cy="${cy}" rx="125" ry="54" fill="#1a1500" stroke="#ffd54a" stroke-width="5"/><text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="900" fill="#ffe27a">${esc(t)}</text></g>`;
  return s+lines+nodes+'</svg>';
}
function stageClear(){
  SFX.clear();
  const hearts='♥'.repeat(lives)+'♡'.repeat(3-lives);
  showModal(`<h1>🎉 마인드맵 완성!</h1>
    <p class="sub">${esc(labelOf(unitKey))} · 정화한 오개념 ${purified}마리 · 남은 목숨 <span style="color:#ff5a6e">${hearts}</span></p>
    <div class="map">${mapSVG()}</div>
    <div class="row"><button class="btn sec" id="mAgain">다시 하기</button><button class="btn" id="mNext">다음 단원 ▶</button></div>`,true);
  $('mAgain').onclick=()=>{ac();showIntro();};
  $('mNext').onclick=()=>{ac();const ks=Object.keys(UNIT_DATA),i=ks.indexOf(unitKey);selectUnit(ks[(i+1)%ks.length]);};
}
function gameOver(){
  SFX.over();
  const miss=U.branches.map((b,q)=>({b,q,n:words.filter(w=>w.q===q&&w.got).length})).filter(o=>o.n<4);
  showModal(`<h1>😵 목숨을 모두 잃었어요</h1>
    <p class="sub">수집한 낱말 ${got}/${words.length} · 정화한 오개념 ${purified}마리</p>
    <h2>아직 못 채운 가지</h2>
    <div class="chips">${miss.map(o=>`<span class="chip" style="background:${qCol[o.q]}">${esc(o.b.name)} ${o.n}/4</span>`).join('')}</div>
    <ul><li><b class="n">💡</b>★ 핵심 펠릿으로 몬스터를 정화하고, 위험하면 <b>허브(안전지대)</b>로 피하세요.</li></ul>
    <div class="row"><button class="btn" id="mRetry">다시 도전 ▶</button></div>`);
  $('mRetry').onclick=()=>{ac();showIntro();};

/* ===================== 단원 선택 ===================== */
const GRADES=['중1','중2','중3','고1'];
function fillUnits(g,sel){
  const ks=Object.keys(UNIT_DATA).filter(k=>k.startsWith(g+'_'));
  $('selUnit').innerHTML=ks.map(k=>`<option value="${esc(k)}">${esc(labelOf(k))}</option>`).join('');
  if(sel&&ks.includes(sel))$('selUnit').value=sel;
  return ks;
}
function selectUnit(key){
  const g=key.split('_')[0];
  if(GRADES.includes(g)){$('selGrade').value=g;fillUnits(g,key);}
  buildUnit(key);showIntro();
  try{localStorage.setItem('mmPacUnit',key);}catch(e){}
}
$('selGrade').innerHTML=GRADES.filter(g=>Object.keys(UNIT_DATA).some(k=>k.startsWith(g+'_'))).map(g=>`<option>${g}</option>`).join('');
$('bQr').onclick=()=>{$('bQr').blur();if(window.kjsLessonQr&&window.kjsHcode)window.kjsLessonQr({q:window.kjsHcode(unitKey),title:labelOf(unitKey),sub:unitKey.split('_')[0]+' · 마인드맵 팩맨'});};
$('selGrade').onchange=()=>{const ks=fillUnits($('selGrade').value);$('selGrade').blur();buildUnit(ks[0]);showIntro();try{localStorage.setItem('mmPacUnit',unitKey);}catch(e){}};
$('selUnit').onchange=()=>{$('selUnit').blur();buildUnit($('selUnit').value);showIntro();try{localStorage.setItem('mmPacUnit',unitKey);}catch(e){}};

/* ===================== 입력 ===================== */
let ptr=null;
cv.addEventListener('pointerdown',e=>{
  ac();if(state==='paused'){togglePause();return;}
  cv.setPointerCapture(e.pointerId);ptr={id:e.pointerId,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(!ptr||ptr.id!==e.pointerId)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
  if(Math.hypot(dx,dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){player.wx=dx>0?1:-1;player.wy=0;}else{player.wx=0;player.wy=dy>0?1:-1;}
  ptr.x=e.clientX;ptr.y=e.clientY;
});
const endP=e=>{if(ptr&&ptr.id===e.pointerId)ptr=null;};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
for(const b of dpad.children){
  b.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(state==='paused')togglePause();const[dx,dy]=b.dataset.d.split(',').map(Number);player.wx=dx;player.wy=dy;b.classList.add('on');});
  const off=()=>b.classList.remove('on');b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
}
['touchmove','touchstart'].forEach(n=>document.addEventListener(n,e=>{if(!e.target.closest('.card,#hud,#dpad'))e.preventDefault();},{passive:false}));
['gesturestart','gesturechange','contextmenu','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
const KEYS={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1],KeyD:[1,0],KeyA:[-1,0],KeyS:[0,1],KeyW:[0,-1]};
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='SELECT')return;
  if(KEYS[e.code]){e.preventDefault();player.wx=KEYS[e.code][0];player.wy=KEYS[e.code][1];}
  else if(e.code==='KeyP'||e.code==='Escape')togglePause();
  else if(e.code==='KeyF')toggleFull();
});
function togglePause(){
  if(state==='play'){state='paused';$('bPause').textContent='▶';}
  else if(state==='paused'){state='play';$('bPause').textContent='❚❚';}
}
$('bPause').onclick=togglePause;
let rsT=0;
$('bRestart').onclick=()=>{
  const b=$('bRestart');
  if(b.classList.contains('warn')){clearTimeout(rsT);b.classList.remove('warn');ac();$('bPause').textContent='❚❚';showIntro();}
  else{b.classList.add('warn');rsT=setTimeout(()=>b.classList.remove('warn'),2200);}
};
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'✕':'♪';$('bMute').classList.toggle('off',muted);};
$('bPad').onclick=()=>{dpad.classList.toggle('hide');$('bPad').classList.toggle('off',dpad.classList.contains('hide'));};
function toggleFull(){
  const d=document,el=d.documentElement;
  try{if(!(d.fullscreenElement||d.webkitFullscreenElement)){(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);}
      else{(d.exitFullscreen||d.webkitExitFullscreen||(()=>{})).call(d);}}catch(err){}
}
$('bFull').onclick=toggleFull;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
window.addEventListener('resize',resize);
document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(resize,60));

/* ===================== 루프 ===================== */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(100,now-last);last=now;
  if(state!=='paused'&&state!=='menu'){acc+=dt;let n=0;while(acc>=16.667&&n<5){step();acc-=16.667;n++;}if(n>=5)acc=0;}else acc=0;
  if(state==='menu'){tNow++;}   // 메뉴에서도 펠릿 맥동
  draw();requestAnimationFrame(frame);
}
window.__mm={get state(){return state},get lives(){return lives},get got(){return got},get scaredT(){return scaredT},get purified(){return purified},get unitKey(){return unitKey},
  player,ghosts:()=>ghosts,words:()=>words,powers:()=>powers,floor,zone,step,dmap,UNIT_DATA,isFloor,
  begin:()=>{hideModal();state='play';},selectUnit,showIntro};
resize();
/* 시작 단원: ?g=중1&u=열 (서랍 딥링크) → 마지막 단원 → 첫 단원 */
(function(){
  const norm=x=>String(x||'').replace(/[\s·]/g,'');
  const ks=Object.keys(UNIT_DATA);let start=null;
  try{
    const p=new URLSearchParams(location.search),g=p.get('g'),u=p.get('u');
    if(u){start=ks.find(k=>(!g||k.split('_')[0]===g)&&norm(UNIT_DATA[k].label)===norm(u))||ks.find(k=>(!g||k.split('_')[0]===g)&&norm(UNIT_DATA[k].label).includes(norm(u)))||null;}
    if(!start&&g&&GRADES.includes(g))start=ks.find(k=>k.startsWith(g+'_'))||null;
  }catch(e){}
  try{const sp=new URLSearchParams(location.search),q=sp.get('q');if(q&&!start)start=ks.find(k=>window.kjsHcode&&window.kjsHcode(k)===q)||null;if(sp.get('qr')==='1'&&start)document.documentElement.classList.add('qrlock');}catch(e){}
  if(!start){try{const l=localStorage.getItem('mmPacUnit');if(l&&UNIT_DATA[l])start=l;}catch(e){}}
  selectUnit(start||ks[0]);
})();
requestAnimationFrame(frame);
})();
