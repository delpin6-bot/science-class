<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>5대 동기유발 아케이드 · 수업 도입 3분</title>
<style>
:root{
  --bar-h:40px;
  --bg:#0b1020; --stage:#0f172a; --panel:#131c33; --line:#26324d; --ink:#e2e8f0; --muted:#94a3b8;
  --myth:#ef4444; --bal:#f59e0b; --csi:#10b981; --zoom:#06b6d4; --whatif:#a855f7;
  --accent:#ef4444; --ok:#22c55e; --bridge:#facc15;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ───────── 1단계: 초슬림 마스터 바 ───────── */
.master{position:sticky;top:0;z-index:50;height:var(--bar-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:0 max(10px,calc((100% - 1240px) / 2));background:rgba(9,13,26,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.m-left{display:flex;align-items:center;gap:8px;min-width:0}
.m-brand{flex:none;font-weight:900;font-size:14px;white-space:nowrap}
.m-status{min-width:0;display:flex;gap:6px;align-items:center;overflow:hidden}
.m-status span{white-space:nowrap;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#1e293b;border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}
.m-status .mth{background:color-mix(in srgb,var(--accent) 22%,#0f172a);border-color:var(--accent);color:#fff}
.m-timer{display:flex;align-items:center;gap:4px;justify-self:center;background:#0b1224;border:1px solid var(--line);border-radius:10px;padding:2px 4px 2px 10px;height:32px}
.m-timer .t{font:800 17px/1 ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.5px;min-width:74px}
.m-timer.run .t{color:#86efac}
.m-timer.warn .t{color:#fbbf24}
.m-timer.done{animation:tdone .6s 4;border-color:#ef4444}
.m-timer.done .t{color:#f87171}
@keyframes tdone{50%{background:#3f1111}}
.ib{height:28px;min-width:30px;border:1px solid var(--line);background:#141d33;color:var(--ink);border-radius:8px;padding:0 8px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;text-decoration:none}
.ib:hover{border-color:#64748b;background:#1b2642}
.ib kbd{font:10px/1 ui-monospace,monospace;color:var(--muted);border:1px solid #334155;border-radius:4px;padding:2px 4px}
.m-right{display:flex;gap:6px;justify-content:flex-end;align-items:center}
#btnDrawer.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,0)}50%{box-shadow:0 0 0 4px rgba(250,204,21,.28);border-color:#facc15}}
#btnSound[aria-pressed="false"]{opacity:.55}

/* ───────── 2단계: 접이식 설정 서랍 ───────── */
.drawer{position:sticky;top:var(--bar-h);z-index:40;background:#0d1428;border-bottom:1px solid var(--line);overflow:hidden;
  max-height:0;opacity:0;transition:max-height .25s ease,opacity .25s ease;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.drawer.open{max-height:460px;opacity:1}
.d-in{padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px;max-width:1500px;margin:0 auto}
.d-row{display:flex;gap:8px;align-items:center;min-width:0}
.d-lab{flex:none;width:44px;font-size:12px;font-weight:800;color:var(--muted)}
.d-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:3px;min-width:0;flex:1;-webkit-overflow-scrolling:touch}
.gtab{flex:none;border:1px solid var(--line);background:#141d33;color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px}
.gtab.on{background:#f8fafc;color:#0f172a;border-color:#f8fafc}
.gtab:disabled{opacity:.45;cursor:not-allowed}
.uchip{flex:none;border:1px solid var(--line);background:#141d33;color:#cbd5e1;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.uchip b{color:#fff;margin-right:4px}
.uchip.on{background:#1d4ed8;border-color:#3b82f6;color:#fff}
.mchip{flex:1 1 0;min-width:150px;text-align:left;border:1.5px solid var(--line);background:#141d33;color:var(--ink);border-radius:12px;padding:8px 12px}
.mchip .n{display:block;font-weight:900;font-size:14.5px}
.mchip .d{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.mchip.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 16%,#141d33)}
.d-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.d-foot .keys{margin-left:auto}
.d-foot kbd{font:11px/1 ui-monospace,monospace;border:1px solid #334155;border-radius:4px;padding:2px 5px;color:#cbd5e1;margin:0 2px}

/* ───────── 도입 무대 ───────── */
.stage{min-height:calc(100vh - var(--bar-h));min-height:calc(100dvh - var(--bar-h));display:flex;flex-direction:column;gap:14px;
  padding:16px clamp(12px,3vw,40px) 18px;max-width:1500px;margin:0 auto}
.s-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.s-badge{font-weight:900;font-size:14px;padding:6px 12px;border-radius:999px;color:#fff;background:var(--accent)}
.s-crumb{font-size:13px;color:var(--muted);font-weight:700}
.s-dots{margin-left:auto;display:flex;gap:6px}
.s-dots i{width:10px;height:10px;border-radius:50%;background:#334155;display:inline-block}
.s-dots i.on{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.hero{font-size:clamp(22px,2.9vw,44px);font-weight:900;line-height:1.35;letter-spacing:-.01em;word-break:keep-all;
  border-left:6px solid var(--accent);padding:4px 0 4px 16px;margin:0}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.empty{text-align:center;color:var(--muted);font-size:18px;padding:40px 10px;line-height:1.7}

/* 공통: 투표 카드 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{position:relative;border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;
  transition:border-color .25s,box-shadow .25s,background .25s,transform .12s;user-select:none}
.card:active{transform:scale(.99)}
.card .tag{align-self:flex-start;font-weight:900;font-size:13px;padding:4px 10px;border-radius:8px;background:#1e293b}
.card .txt{font-size:clamp(17px,1.9vw,27px);font-weight:800;line-height:1.45;word-break:keep-all;flex:1}
.vote{display:flex;align-items:center;gap:10px}
.vote .bar{flex:1;height:14px;border-radius:999px;background:#0b1224;overflow:hidden;border:1px solid var(--line)}
.vote .bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .45s cubic-bezier(.16,1,.3,1)}
.vote .num{min-width:108px;text-align:right;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.vbtn{display:flex;gap:8px}
.vbtn button{border:1px solid var(--line);background:#1b2642;color:#fff;border-radius:10px;font-weight:900;padding:8px 14px;font-size:15px}
.vbtn .plus{flex:1;background:#1d4ed8;border-color:#3b82f6}
.card.wrong{border-color:#ef4444;background:linear-gradient(160deg,#3a0d12,#1a0b10);box-shadow:0 0 0 1px #ef4444 inset}
.card.right{border-color:#22c55e;background:linear-gradient(160deg,#052e1a,#071b12);box-shadow:0 0 26px 2px rgba(34,197,94,.45),0 0 0 1px #22c55e inset}
.stamp{position:absolute;top:12px;right:14px;font-weight:900;font-size:15px;padding:4px 10px;border-radius:8px;transform:rotate(4deg);opacity:0;transition:opacity .25s}
.card.wrong .stamp{opacity:1;background:#ef4444;color:#fff}
.card.right .stamp{opacity:1;background:#22c55e;color:#04210f}
.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.18)}}

/* 밸런스: 시소 */
.seesaw{position:relative;height:96px;margin:4px auto 0;width:min(620px,92%)}
.seesaw .beam{position:absolute;left:0;right:0;top:34px;height:12px;border-radius:8px;background:linear-gradient(90deg,#38bdf8,#f59e0b);
  transform-origin:50% 50%;transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.seesaw .beam b{position:absolute;top:-30px;font-size:15px;font-weight:900;padding:3px 10px;border-radius:8px;background:#1e293b;white-space:nowrap}
.seesaw .beam b.l{left:0}.seesaw .beam b.r{right:0}
.seesaw .pivot{position:absolute;left:50%;top:44px;width:0;height:0;margin-left:-22px;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:40px solid #475569}
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.split i{display:block;height:100%;transition:width .45s cubic-bezier(.16,1,.3,1)}

/* CSI: 사건 서류철 */
.dossier{position:relative;background:linear-gradient(180deg,#e9d6a8,#dcc28a);color:#2a1d07;border-radius:4px 18px 18px 18px;padding:18px 22px 62px;
  box-shadow:0 18px 40px rgba(0,0,0,.45);max-width:1100px;width:100%;margin:10px auto 0}
.dossier:before{content:"";position:absolute;top:-22px;left:0;width:210px;height:24px;background:#dcc28a;border-radius:10px 14px 0 0}
.dossier .dh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900;font-size:13.5px;border-bottom:2px dashed #8a6b2e;padding-bottom:8px;margin-bottom:12px}
.dossier .conf{color:#b91c1c;border:2px solid #b91c1c;border-radius:6px;padding:1px 8px;transform:rotate(-3deg)}
.clue{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:8px;
  font-size:clamp(16px,1.7vw,24px);font-weight:800;color:#2a1d07;line-height:1.5}
.clue .ck{flex:none;width:28px;height:28px;border:2.5px solid #7c5a1a;border-radius:6px;display:grid;place-items:center;font-size:18px;color:transparent;margin-top:2px}
.clue .tx{background-image:linear-gradient(transparent 55%,rgba(253,224,71,.95) 55%);background-size:0% 100%;background-repeat:no-repeat;transition:background-size .5s ease}
.clue.on .tx{background-size:100% 100%}
.clue.on .ck{background:#16a34a;border-color:#16a34a;color:#fff}
.solved{position:absolute;right:26px;bottom:12px;font-weight:900;font-size:26px;color:#b91c1c;border:4px solid #b91c1c;border-radius:10px;padding:2px 14px;
  transform:rotate(-12deg) scale(1.6);opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.dossier.done .solved{opacity:.9;transform:rotate(-12deg) scale(1)}

/* 줌인 */
.zoombox{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#020617;height:min(46vh,420px)}
.zoombox svg{width:100%;height:100%;display:block;transform-origin:50% 50%;transition:transform .9s cubic-bezier(.16,1,.3,1),filter .9s ease}
.zmag{position:absolute;left:14px;top:12px;font-weight:900;font-size:16px;background:rgba(2,6,23,.8);border:1px solid #0e7490;color:#67e8f9;padding:5px 12px;border-radius:999px}
.zcount{position:absolute;right:14px;top:12px;font:900 22px/1 ui-monospace,monospace;color:#fde68a;background:rgba(2,6,23,.8);padding:6px 12px;border-radius:10px}
.zsteps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.zsteps button{border:1.5px solid var(--line);background:#141d33;color:#cbd5e1;border-radius:10px;padding:9px 14px;font-weight:900}
.zsteps button.on{border-color:var(--zoom);color:#fff;background:#0e3a47}
.zsteps .go{background:#0e7490;color:#fff;border-color:#06b6d4}

/* What-If */
.wi-in{display:flex;gap:8px;max-width:900px;width:100%;margin:6px auto 0}
.wi-in input{flex:1;min-width:0;border:2px solid #6b21a8;background:#140a24;color:#fff;border-radius:12px;padding:14px 16px;font-size:18px;outline:0}
.wi-in input:focus{border-color:var(--whatif);box-shadow:0 0 0 4px rgba(168,85,247,.25)}
.wi-in button{border:0;background:var(--whatif);color:#fff;border-radius:12px;padding:0 20px;font-weight:900;font-size:16px}
.cloud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;min-height:150px;margin-top:14px;padding:16px;border:2px dashed #3b1f5c;border-radius:18px}
.cloud .hint{color:#7c6a99;font-size:15px;align-self:center}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:900;background:#2e1065;border:1.5px solid #7c3aed;color:#f3e8ff;
  animation:popin .35s cubic-bezier(.34,1.56,.64,1) both}
.chip:nth-child(3n){font-size:22px}.chip:nth-child(3n+1){font-size:18px}.chip:nth-child(3n+2){font-size:20px}
.chip button{border:0;background:transparent;color:#c4b5fd;font-weight:900;font-size:15px;padding:0}
.chip.ex{background:#052e2b;border-color:#14b8a6;color:#ccfbf1}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* 공개 영역 + 브릿지 */
.reveal{border:2px solid #334155;border-radius:16px;background:#101a30;overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .3s ease,border-color .3s;border-width:0}
.reveal.show{max-height:420px;opacity:1;border-width:2px;border-color:var(--ok)}
.reveal .rh{font-weight:900;font-size:15px;color:#86efac;padding:12px 16px 0}
.reveal .rd{font-size:clamp(16px,1.6vw,23px);font-weight:700;line-height:1.6;padding:6px 16px 14px;word-break:keep-all}
.bridge{border:2.5px solid var(--bridge);background:rgba(250,204,21,.08);border-radius:14px;padding:10px 16px;font-size:clamp(15px,1.45vw,20px);font-weight:800;line-height:1.5;color:#fef9c3;word-break:keep-all}
.bridge b{color:var(--bridge)}
.actions{display:flex;gap:12px}
.big{flex:1;border:0;border-radius:14px;padding:16px;font-weight:900;font-size:clamp(16px,1.6vw,21px);display:flex;align-items:center;justify-content:center;gap:10px}
.big kbd{font:12px/1 ui-monospace,monospace;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:3px 6px;opacity:.8}
.big.rv{background:linear-gradient(135deg,#16a34a,#22c55e);color:#04210f}
.big.rv.on{background:#1e293b;color:#e2e8f0}
.big.nx{flex:0 0 auto;min-width:220px;background:#1e293b;color:#fff;border:1px solid #334155}

/* 도움말 */
.ov{position:fixed;inset:0;background:rgba(2,6,23,.75);display:none;place-items:center;z-index:90;padding:16px}
.ov.on{display:grid}
.help{background:#0f172a;border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:460px;width:100%}
.help h3{margin:0 0 10px}
.help table{width:100%;border-collapse:collapse;font-size:14px}
.help td{padding:7px 4px;border-bottom:1px solid #1e293b}
.help td:first-child{width:90px}
.help kbd{font:12px/1 ui-monospace,monospace;border:1px solid #475569;border-radius:5px;padding:3px 7px;color:#fff}
.help .x{margin-top:12px;width:100%;height:40px;border:0;border-radius:10px;background:#e2e8f0;color:#0f172a;font-weight:900}

@media (max-width:900px){
  .m-brand .f,.m-status .un{display:none}
  .ib .f,.ib kbd{display:none}
  .choices{grid-template-columns:1fr}
  .mchip{min-width:132px}
  .big.nx{min-width:0}
}
@media (max-width:560px){
  .master{grid-template-columns:auto 1fr auto;padding:0 6px;gap:6px}
  .m-status{display:none}
  .m-timer .t{min-width:62px;font-size:15px}
  #btnHub{display:none}
  .d-lab{display:none}
  .actions{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="qr-focus-style">
:is(html,body).qr-focus-mode :is(.dh-seg,.dh-menu,#dhTools,#dhToolsBtn,header.header:not(:has(.unified-nav-actions)),nav.primary-nav-bar,nav.category-nav-bar,.flow-selector-card,.filter-search-row,.extra-tools-card,#btnHub,.dh-foot .r a,#kjsBgm,#kjsSfx,.kjs-qr-btn){display:none!important}
:is(html,body).qr-focus-mode .unified-nav-actions :is(a[href*="서랍"],.btn-hub-main,.btn-hub-sim,.btn-hub-game,.btn-hub-mod){display:none!important}
:is(html,body).qr-focus-mode .btn-unified-nav:not(#kjsHome):not(#snResetBtn):not(.btn-ws){display:none!important}
:is(html,body).qr-focus-mode :is(.nav-btn[onclick*="rule"],.nav-btn[onclick*="guide"],#btnTeacherMode,.ws-answer-key){display:none!important}
:is(html,body).qr-focus-mode .sim-nav-inner{grid-template-columns:1fr auto!important}
:is(html,body).qr-lesson-lock :is(.km-nav,.km-search,.km-g,.km-u,.km-j,.km-grid,.picker,#libCard,#picker,#pickHost,#navBar){display:none!important}
.qr-focus-badge{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;font:800 12.5px/1 -apple-system,"Malgun Gothic",sans-serif;white-space:nowrap}
.qr-focus-badge.float{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:99990}
.qr-reset{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#1e293b;font:700 13px/1 -apple-system,"Malgun Gothic",sans-serif;cursor:pointer}
.qr-lesson-label{margin-left:8px;font-size:.85em;font-weight:800;color:#b45309;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
</style>
<script id="qr-focus-js">
(function(){try{
  var p=new URLSearchParams(location.search), on=p.get("qr")==="1"||p.get("mode")==="focus"||p.has("q"), lock=p.has("q");
  if(!on) return;
  var add=function(el){ if(!el) return; el.classList.add("qr-focus-mode"); if(lock) el.classList.add("qr-lesson-lock"); };
  add(document.documentElement);
  function ui(){
    add(document.body);
    var nav=document.querySelector(".unified-nav-actions")||document.querySelector(".m-right");
    var b=document.createElement("span"); b.className="qr-focus-badge"; b.textContent="📱 학생 집중 모드";
    if(nav) nav.insertBefore(b, nav.firstChild); else { b.className+=" float"; document.body.appendChild(b); }
    var home=document.getElementById("kjsHome");
    if(home) home.textContent="↺ 다시하기";
    else if(nav){ var r=document.createElement("button"); r.type="button"; r.className="qr-reset"; r.textContent="↺ 다시하기";
      r.onclick=function(){ if(confirm("처음부터 다시 할까요?")) location.reload(); }; nav.appendChild(r); }
    var tries=0, t=setInterval(function(){                      /* 단원·차시명 표시 */
      var c=(window.KJSMenu&&window.KJSMenu._current)||window.__kjsCurrent;
      if(c&&c.title){ b.textContent="📱 "+[c.unit,c.title].filter(Boolean).join(" · "); b.title="학생 집중 모드"; clearInterval(t); }
      else if(++tries>20) clearInterval(t);
    },300);
  }
  if(document.body) ui(); else document.addEventListener("DOMContentLoaded",ui);
  document.addEventListener("click",function(e){                /* 집중 모드 유지 */
    var a=e.target.closest&&e.target.closest("a[href]"); if(!a) return;
    var u; try{ u=new URL(a.getAttribute("href"),location.href); }catch(_){ return; }
    if(u.origin!==location.origin||!/\.html$/.test(u.pathname)) return;
    if(u.searchParams.get("qr")!=="1"){ u.searchParams.set("qr","1"); a.setAttribute("href",u.pathname.split("/").pop()+u.search+u.hash); }
  },true);
}catch(e){}})();
</script>
</head>
<body>

<!-- 1단계: 초슬림 마스터 바 -->
<header class="master" role="banner">
  <div class="m-left">
    <div class="m-brand">🚀<span class="f"> 5대 동기유발 아케이드</span></div>
    <div class="m-status" aria-live="polite"><span class="un" id="stUnit">중1 · 단원</span><span class="mth" id="stMethod">💥 오개념 저격수</span></div>

/* ===== 소리 (수업게임 공통 효과음이 있으면 그것을 사용) ===== */
let actx = null;
function tone(freq, dur, type, vol){
  if (!soundEnabled) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}
const SFX = {
  click(){ tone(660,.06,"triangle",.05); },
  switchTab(){ tone(520,.07,"sine",.05); },
  vote(){ tone(880,.08,"triangle",.06); },
  reveal(){ if (window.KJS && soundEnabled) KJS.ok({ toast:false }); else { tone(523,.12); setTimeout(()=>tone(784,.18),110); } },
  timeUp(){ if (!soundEnabled) return; [0,300,600].forEach(t=>setTimeout(()=>tone(988,.25,"square",.06),t)); }
};

  const gt = $("gradeTabs"); gt.innerHTML = "";
  GRADES.forEach(g => {
    const n = lessonsOf(g).length, b = document.createElement("button");

    b.onclick = () => { SFX.switchTab(); curGrade = g; curUnit = 0; drawDrawer(); render(); };
    gt.appendChild(b);
  });
  const uc = $("unitChips"); uc.innerHTML = "";
  lessonsOf(curGrade).forEach((x, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "uchip" + (i === curUnit ? " on" : "");
    b.innerHTML = `<b>${i + 1}.</b>${esc(x.unit)} · ${esc(x.title)}`;
    b.onclick = () => { SFX.switchTab(); curUnit = i; drawDrawer(); render(); setDrawer(false); };
    uc.appendChild(b);
  });
  const on = uc.querySelector(".on"); if (on) on.scrollIntoView({ inline:"nearest", block:"nearest" });
  const mc = $("methodChips"); mc.innerHTML = "";
  METHODS.forEach((m, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "mchip" + (m.key === curMethod ? " on" : "");
    b.style.setProperty("--c", m.c);
    b.innerHTML = `<span class="n">${m.ic} ${i + 1}. ${m.nm}</span><span class="d">${m.d}</span>`;
    b.onclick = () => { SFX.switchTab(); curMethod = m.key; drawDrawer(); render(); setDrawer(false); };
    mc.appendChild(b);
  });
}

/* ===== 3분 타이머 ===== */
const TOTAL = 180; let left = TOTAL, tick = null;
function paintTimer(){
  const mm = String(Math.floor(left / 60)).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
  $("timerText").textContent = "⏱ " + mm + ":" + ss;
  const t = $("timer"); t.classList.toggle("run", !!tick); t.classList.toggle("warn", !!tick && left <= 30 && left > 0);
  $("btnTimer").textContent = tick ? "⏸" : "▶"; $("btnTimer").setAttribute("aria-label", tick ? "타이머 일시정지" : "타이머 시작");
}
function toggleTimer(){
  if (tick) { clearInterval(tick); tick = null; paintTimer(); return; }
  if (left <= 0) left = TOTAL;
  $("timer").classList.remove("done");
  tick = setInterval(() => {
    left--; paintTimer();
    if (left <= 0) { clearInterval(tick); tick = null; paintTimer(); $("timer").classList.add("done"); SFX.timeUp(); }
  }, 1000);
  paintTimer();
}
function resetTimer(){ clearInterval(tick); tick = null; left = TOTAL; $("timer").classList.remove("done"); paintTimer(); }
$("btnTimer").onclick = toggleTimer; $("btnTimerReset").onclick = resetTimer;

/* ===== 무대 렌더 ===== */
function voteCard(side, text, tagColor){
  return `<div class="card" id="card${side}">
      <span class="stamp">${side}</span>
      <span class="tag" style="background:${tagColor}">선택지 ${side}</span>
      <div class="txt">${esc(text)}</div>
      <div class="vote"><div class="bar"><i id="bar${side}" style="background:${tagColor}"></i></div><span class="num" id="num${side}">0% · 0표</span></div>
      <div class="vbtn"><button type="button" class="plus" data-v="${side}">＋1 손 든 학생</button><button type="button" data-u="${side}" aria-label="${side} 한 표 빼기">−</button></div>
    </div>`;
}
function paintVotes(){
  const t = votes.A + votes.B, pa = t ? Math.round(votes.A / t * 100) : 0, pb = t ? 100 - pa : 0;
  ["A","B"].forEach(k => {
    const p = k === "A" ? pa : pb, bar = $("bar" + k), num = $("num" + k);
    if (bar) bar.style.width = p + "%";
    if (num) num.textContent = `${p}% · ${votes[k]}표`;
  });
  if (curMethod === "bal") {
    const beam = $("beam"); if (beam) { const tilt = t ? (votes.B - votes.A) / t * 14 : 0; beam.style.transform = `rotate(${tilt}deg)`; }
    const sa = $("splitA"), sb = $("splitB"); if (sa && sb) { sa.style.width = (t ? pa : 50) + "%"; sb.style.width = (t ? pb : 50) + "%"; }
    const la = $("lblA"), lb = $("lblB"); if (la && lb) { la.textContent = `A ${t ? pa : 0}%`; lb.textContent = `B ${t ? pb : 0}%`; }
  }
}
function bindVotes(){
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = e => {
    e.stopPropagation(); votes[b.dataset.v]++; SFX.vote(); paintVotes();
    const n = $("num" + b.dataset.v); n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump");
  });
  document.querySelectorAll("[data-u]").forEach(b => b.onclick = e => { e.stopPropagation(); votes[b.dataset.u] = Math.max(0, votes[b.dataset.u] - 1); SFX.click(); paintVotes(); });
}

/* 줌인: 단원마다 조금씩 다른 미지의 확대 장면 */
function zoomScene(seed){
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) / 4294967296);
  const hue = Math.floor(rnd() * 360), shapes = [];
  for (let i = 0; i < 70; i++) {
    const x = rnd() * 800, y = rnd() * 400, r = 8 + rnd() * 34, k = rnd(), c = `hsl(${(hue + rnd() * 90) % 360} 70% ${40 + rnd() * 25}%)`;
    if (k < .4) shapes.push(`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(0)}" fill="${c}" opacity="${(.55 + rnd() * .4).toFixed(2)}"/>`);
    else if (k < .75) { const s = r * 1.6; shapes.push(`<polygon points="${x},${y - s} ${x + s * .87},${y + s / 2} ${x - s * .87},${y + s / 2}" fill="${c}" opacity=".7" transform="rotate(${Math.floor(rnd() * 360)} ${x} ${y})"/>`); }
    else shapes.push(`<rect x="${x}" y="${y}" width="${r * 1.8}" height="${r}" rx="${r / 3}" fill="${c}" opacity=".65" transform="rotate(${Math.floor(rnd() * 180)} ${x} ${y})"/>`);
  }
  return `<svg id="zsvg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-label="미지의 확대 장면">
    <defs><radialGradient id="zbg"><stop offset="0" stop-color="hsl(${hue} 60% 16%)"/><stop offset="1" stop-color="#020617"/></radialGradient></defs>
    <rect width="800" height="400" fill="url(#zbg)"/>${shapes.join("")}</svg>`;
}
const ZOOM = [ { lab:"10,000배", s:4.2, blur:2 }, { lab:"1,000배", s:2.6, blur:1.2 }, { lab:"100배", s:1.6, blur:.4 }, { lab:"1배", s:1, blur:0 } ];
let zLevel = 0, zTimer = null, zLeft = 20;
function setZoom(i){
  zLevel = i; const z = ZOOM[i], svg = $("zsvg"); if (!svg) return;
  svg.style.transform = `scale(${z.s})`; svg.style.filter = `blur(${z.blur}px)`;
  $("zmag").textContent = `🔬 배율 ${z.lab}`;
  document.querySelectorAll(".zsteps [data-z]").forEach(b => b.classList.toggle("on", +b.dataset.z === i));
}
function stopZoomAuto(){ clearInterval(zTimer); zTimer = null; const c = $("zcount"); if (c) c.classList.add("hidden"); const g = $("zgo"); if (g) g.textContent = "▶ 20초 자동 관찰"; }
function zoomAuto(){
  if (zTimer) { stopZoomAuto(); return; }
  zLeft = 20; setZoom(0); $("zcount").classList.remove("hidden"); $("zcount").textContent = "20"; $("zgo").textContent = "⏸ 멈추기";
  zTimer = setInterval(() => {
    zLeft--; $("zcount").textContent = String(zLeft);
    const step = Math.min(3, Math.floor((20 - zLeft) / 5)); if (step !== zLevel) { setZoom(step); SFX.click(); }
    if (zLeft <= 0) { stopZoomAuto(); setZoom(3); SFX.timeUp(); }
  }, 1000);
}

function render(){
  const L = lesson(), m = M();
  stopZoomAuto(); revealed = false; votes = { A:0, B:0 };
  document.documentElement.style.setProperty("--accent", m.c);
  $("reveal").classList.remove("show");
  $("btnReveal").classList.remove("on"); $("btnReveal").innerHTML = "🔓 정답 및 비밀 공개 <kbd>R</kbd>";
  $("dots").innerHTML = METHODS.map(x => `<i class="${x.key === curMethod ? "on" : ""}"></i>`).join("");
  $("stMethod").textContent = `${m.ic} ${m.nm}`;
  if (!L) {
    $("stUnit").textContent = curGrade; $("badge").textContent = `${m.ic} ${m.nm}`; $("crumb").textContent = "";
    $("hero").textContent = ""; $("bridge").classList.add("hidden");
    $("content").innerHTML = `<div class="empty">📚 ${curGrade} 문항은 아직 준비 중이에요.<br>설정 서랍에서 다른 학년을 골라 주세요.</div>`;
    return;
  }
  $("bridge").classList.remove("hidden");
  const D = L[curMethod];
  $("stUnit").textContent = `${L.grade} · ${L.unit}`;
  $("badge").textContent = `${m.ic} ${METHODS.indexOf(m) + 1}. ${m.nm} (${m.en})`;
  $("crumb").textContent = `${L.grade} 과학 › ${L.unit} · ${L.title}`;
  $("hero").textContent = D.q;
  $("bridge").innerHTML = `<b>🌉 본시 수업 브릿지</b> — ${esc(D.bridge)}`;
  const box = $("content");

  if (curMethod === "myth") {
    box.innerHTML = `<div class="choices">${voteCard("A", D.a, "#0284c7")}${voteCard("B", D.b, "#9333ea")}</div>`;
    $("revealHead").textContent = "💡 인지 갈등 해설 · 과학적 진실 (Fact)"; $("revealBody").textContent = D.fact;
    bindVotes(); paintVotes();
  } else if (curMethod === "bal") {
    box.innerHTML = `<div class="choices">${voteCard("A", D.a, "#0284c7")}${voteCard("B", D.b, "#f59e0b")}</div>
      <div class="seesaw"><div class="beam" id="beam"><b class="l" id="lblA">A 0%</b><b class="r" id="lblB">B 0%</b></div><div class="pivot"></div></div>
      <div class="split" style="width:min(620px,92%);margin:0 auto"><i id="splitA" style="width:50%;background:#0284c7"></i><i id="splitB" style="width:50%;background:#f59e0b"></i></div>`;
    $("revealHead").textContent = "⚖️ 과학적 토론 정리"; $("revealBody").textContent = D.fact;
    bindVotes(); paintVotes();
  } else if (curMethod === "csi") {
    box.innerHTML = `<div class="dossier" id="dossier">
        <div class="dh"><span>📁 CASE FILE #${esc(L.grade)}-${String(curUnit + 1).padStart(2, "0")} · ${esc(L.unit)}</span><span class="conf">CONFIDENTIAL</span><span>중학교 과학수사 연구소</span></div>
        ${D.evidences.map((e, i) => `<button type="button" class="clue" data-i="${i}"><span class="ck">✓</span><span class="tx">${esc(e)}</span></button>`).join("")}
        <span class="solved">SOLVED</span></div>`;
    box.querySelectorAll(".clue").forEach(b => b.onclick = () => { b.classList.toggle("on"); SFX.click(); });
    $("revealHead").textContent = "🕵️ 수사 결과 · 과학적 범인 규명"; $("revealBody").textContent = D.fact;
  } else if (curMethod === "zoom") {
    box.innerHTML = `<div class="zoombox">${zoomScene(L.unit + L.title)}<span class="zmag" id="zmag"></span><span class="zcount hidden" id="zcount">20</span></div>
      <div class="zsteps">${ZOOM.map((z, i) => `<button type="button" data-z="${i}">${i + 1}단계 · ${z.lab}</button>`).join("")}<button type="button" class="go" id="zgo">▶ 20초 자동 관찰</button></div>`;
    box.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { stopZoomAuto(); setZoom(+b.dataset.z); SFX.click(); });
    $("zgo").onclick = zoomAuto; setZoom(0);
    $("revealHead").textContent = "🔬 시각적 멘탈 모델 · 정체 공개"; $("revealBody").textContent = `${D.shapeDesc} — ${D.fact}`;
  } else if (curMethod === "whatif") {
    box.innerHTML = `<div class="wi-in"><input id="wiInput" type="text" autocomplete="off" placeholder="학생이 말한 상상을 적고 Enter ↵" aria-label="학생 아이디어 입력"><button type="button" id="wiAdd">추가</button></div>
      <div class="cloud" id="cloud"><span class="hint">💭 학생들의 생각이 여기에 모입니다</span></div>`;
    const add = () => { const v = $("wiInput").value.trim(); if (!v) return; addChip(v, false); $("wiInput").value = ""; $("wiInput").focus(); };
    $("wiAdd").onclick = add; $("wiInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
    $("revealHead").textContent = "🚀 과학적 연쇄 반응 시뮬레이션"; $("revealBody").textContent = D.fact;
  }
}
function addChip(text, example){
  const cloud = $("cloud"); if (!cloud) return;
  const h = cloud.querySelector(".hint"); if (h) h.remove();
  const c = document.createElement("span"); c.className = "chip" + (example ? " ex" : "");
  c.innerHTML = `${example ? "🔗" : "💡"} ${esc(text)} <button type="button" aria-label="지우기">✕</button>`;
  c.querySelector("button").onclick = () => { c.remove(); SFX.click(); };
  cloud.appendChild(c); SFX.vote();
}

/* ===== 공개 · 다음 ===== */
function toggleReveal(){
  if (!lesson()) return;
  revealed = !revealed;
  $("reveal").classList.toggle("show", revealed);
  $("btnReveal").classList.toggle("on", revealed);
  $("btnReveal").innerHTML = (revealed ? "🔒 해설 숨기기" : "🔓 정답 및 비밀 공개") + " <kbd>R</kbd>";
  if (revealed) SFX.reveal(); else SFX.click();
  const D = lesson()[curMethod];
  if (curMethod === "myth") {
    const wrong = D.wrongChoice === "A" ? "A" : "B", right = wrong === "A" ? "B" : "A";
    const cw = $("card" + wrong), cr = $("card" + right);
    cw.classList.toggle("wrong", revealed); cr.classList.toggle("right", revealed);
    cw.querySelector(".stamp").textContent = "❌ 오개념"; cr.querySelector(".stamp").textContent = "✅ 과학적 진실";
  }
  if (curMethod === "csi") {
    const d = $("dossier"); d.classList.toggle("done", revealed);
    if (revealed) d.querySelectorAll(".clue").forEach((b, i) => setTimeout(() => b.classList.add("on"), i * 180));
  }
  if (curMethod === "zoom" && revealed) { stopZoomAuto(); setZoom(3); }
  if (curMethod === "whatif") {
    const cloud = $("cloud");
    if (revealed) D.defaultChips.forEach((t, i) => setTimeout(() => addChip(t, true), 120 * i));
    else cloud.querySelectorAll(".chip.ex").forEach(c => c.remove());
  }
}
function nextMethod(){
  const i = METHODS.findIndex(m => m.key === curMethod);
  if (i === METHODS.length - 1) { const n = lessonsOf(curGrade).length; if (n) curUnit = (curUnit + 1) % n; }
  curMethod = METHODS[(i + 1) % METHODS.length].key;
  SFX.switchTab(); drawDrawer(); render();
}
$("btnReveal").onclick = toggleReveal; $("btnNext").onclick = nextMethod;

/* ===== 소리 · 전체화면 · QR · 도움말 ===== */
$("btnSound").onclick = () => {
  soundEnabled = !soundEnabled;
  $("btnSound").setAttribute("aria-pressed", String(soundEnabled)); $("btnSound").textContent = soundEnabled ? "🔊" : "🔇";
  if (window.KJS) { KJS.setSfx && KJS.setSfx(soundEnabled); KJS.setBgm && KJS.setBgm(soundEnabled); }
};
function toggleFull(){
  const d = document, el = d.documentElement;
  if (!(d.fullscreenElement || d.webkitFullscreenElement)) { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
  else { (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d); }
}
$("btnFull").onclick = toggleFull;
$("btnQr").onclick = () => {
  if (!window.KJSQR) return;
  KJSQR.show({ game:"🚀 수업 도입", opts:[{ label:"5대 동기유발", file:"수업도입_동기유발_5대게임.html", q:"", title:"5대 동기유발 아케이드" }] });
};
const helpOv = $("helpOv");
$("btnHelp").onclick = () => helpOv.classList.add("on");
$("helpClose").onclick = () => helpOv.classList.remove("on");
helpOv.addEventListener("click", e => { if (e.target === helpOv) helpOv.classList.remove("on"); });

/* ===== 교사용 단축키 ===== */
document.addEventListener("keydown", e => {
  const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
  if (e.key === "Escape") {
    if (helpOv.classList.contains("on")) { helpOv.classList.remove("on"); return; }
    if (typing) { t.blur(); return; }
    setDrawer(false); return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "h") { drawerTouched = true; setDrawer(!drawer.classList.contains("open")); }
  else if (k === "f") toggleFull();
  else if (e.code === "Space" || k === " ") { e.preventDefault(); toggleTimer(); }
  else if (k === "r") toggleReveal();
  else if (k === "n" || e.key === "ArrowRight") { e.preventDefault(); nextMethod(); }
  else return;
});

/* ===== 시작 ===== */
drawDrawer(); render(); paintTimer(); setDrawer(true);
</script>
