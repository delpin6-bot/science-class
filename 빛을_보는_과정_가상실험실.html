 {id:'moon',ic:'🌙',nm:'밤하늘의 달',s:0,e:'달은 스스로 빛을 내지 못하고, <b>태양 빛을 반사</b>할 뿐이에요.',w:'⚠️ <b>오답!</b> 달과 거울은 스스로 빛을 내지 못하고 다른 광원의 빛을 <b>반사할 뿐</b>입니다!'},{id:'mirror',ic:'🪞',nm:'거울',s:0,e:'거울은 스스로 빛을 내지 못하고, <b>다른 광원의 빛을 반사</b>할 뿐이에요.',w:'⚠️ <b>오답!</b> 달과 거울은 스스로 빛을 내지 못하고 다른 광원의 빛을 <b>반사할 뿐</b>입니다!'},{id:'apple',ic:'🍎',nm:'사과',s:0,e:'사과는 스스로 빛을 내지 못해요. 빛을 <b>반사</b>해서 보여요.'},{id:'book',ic:'📖',nm:'책',s:0,e:'책은 스스로 빛을 내지 못해요. 빛을 <b>반사</b>해서 보여요.'}];
const SO={sel:null,placed:{},miss:0};

  $$('#cards .cardb').forEach(b=>b.onclick=()=>{SO.sel=SO.sel===b.dataset.c?null:b.dataset.c;sTick();buildSort()});
  const ch=z=>CARDS.filter(c=>SO.placed[c.id]===z).map(c=>`<span class="chip">${c.ic} ${c.nm}</span>`).join('');$('#cSrc').innerHTML=ch(1);$('#cNon').innerHTML=ch(0);
  $$('.zone').forEach(z=>z.classList.toggle('on',SO.sel!=null));const np=$('#nPl');if(np)np.textContent=Object.keys(SO.placed).length+' / 8'}
$$('.zone').forEach(z=>z.onclick=()=>{if(SO.sel==null){toast('#toast3','먼저 위에서 카드를 눌러 선택하세요',1500);return}const c=CARDS.find(x=>x.id===SO.sel),zone=+z.dataset.z,f=$('#fb3');
  if(c.s===zone){SO.placed[c.id]=zone;SO.sel=null;f.className='fb good';f.innerHTML='⭕ 정답! '+c.e;sOK();buildSort();
    if(Object.keys(SO.placed).length===CARDS.length){S.sort=true;hud();f.innerHTML+='<br>🎉 <b>분류 완료!</b> 실수 '+SO.miss+'번 — 광원은 스스로 빛을 내는 물체, 달·거울·사과·책은 빛을 반사해서 보여요.'}}
  else{SO.miss++;f.className='fb bad';f.innerHTML=c.w||('⚠️ <b>오답!</b> '+c.e);sNO();const b=$('#cards .cardb[data-c="'+c.id+'"]');if(b){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450)}}});
$('#rstB').onclick=()=>{SO.sel=null;SO.placed={};SO.miss=0;buildSort();$('#fb3').className='fb';$('#fb3').innerHTML='카드를 다시 분류해 보세요.';sTick()};
function setSub3(s){M3.s=s;$$('#sub3 .btn').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$('#rowA').style.display=s==='A'?'':'none';$('#rowB').style.display=s==='B'?'':'none';$('#sort').style.display=s==='B'?'flex':'none';sig3='';
  if(s==='A'){$('#guide3').innerHTML='🧱 전등이 책을 비추고 있어요. <b>가림막</b>을 끌어서 <b>책과 눈 사이</b>에 끼워 보세요!'}
  else{$('#guide3').innerHTML='🗂 8장의 카드를 <b>광원</b>과 <b>비광원</b>으로 나눠 보세요. (함정 카드 조심!)';$('#hi3').innerHTML='<div>🎯 활동<br><b>광원 분류 챌린지</b></div><div>🗂 분류한 카드<br><b id="nPl">'+Object.keys(SO.placed).length+' / 8</b></div><div style="grid-column:span 2">✨ 기억하세요 <span class="badge b-d">광원: 스스로 빛을 낸다</span> <span class="badge b-r">비광원: 반사해서 보인다</span></div>';buildSort();$('#fb3').className='fb';$('#fb3').innerHTML='카드를 누른 뒤, 아래 <b>광원 / 비광원</b> 상자를 눌러 분류하세요.'}}
$$('#sub3 .btn').forEach(b=>b.onclick=()=>{setSub3(b.dataset.s);sTick()});

/* ═════════ 리셋 · 루프 ═════════ */
function resetAll(){
  Object.assign(M1,{on:true,mis:'A',arrows:{A:[],B:[]},done:{A:false,B:false},drag:null});$('#sw1').classList.add('on');$('#sw1').textContent='💡 전등 ON';$$('#mis .btn').forEach(b=>b.classList.toggle('on',b.dataset.m==='A'));sig1='';fb1('전등을 켜고, 빛이 지나가는 순서대로 점에서 점으로 <b>드래그</b>해 화살표를 그려 보세요.');
  Object.assign(M2,{d:'day',sel:null});$$('#dn .btn').forEach(b=>b.classList.toggle('on',b.dataset.d==='day'));sig2='';
  Object.assign(M3,{on:true,hyp:false,sx:.90,sy:.60,drag:null});$('#sw3').classList.add('on');$('#sw3').textContent='💡 전등 ON';$('#hyp').classList.remove('on');SO.sel=null;SO.placed={};SO.miss=0;
  S.path=new Set();S.m2=new Set();S.scrA=false;S.sort=false;S.quiz=-1;setSub3('A');hud();setMode(1)}
$('#btnReset').onclick=resetAll;
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  try{if(mode===1)scene1(dt,t);else if(mode===2)scene2(dt,t);else scene3(dt,t)}catch(e){console.error(e)}
  requestAnimationFrame(loop)}
guide1();info2();setSub3('A');hud();requestAnimationFrame(loop);
