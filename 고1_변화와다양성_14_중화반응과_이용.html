<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>고1 통합과학2 우리 주변의 변화 8차시 · 중화 반응과 생활 속 이용</title>
<style>
:root{--bg:#050a18;--pn:#0b1226;--ln:#2a3a66;--tx:#f1f5f9;--mu:#94a3b8;--gold:#fde68a;--cy:#7dd3fc;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:24px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;min-height:56px;border-radius:14px;border:3px solid var(--ln);background:#111b3a;padding:0 14px;font-weight:800}
button:active{transform:scale(.97)}button.on{border-color:var(--gold);background:#2a2a10;color:var(--gold)}button:disabled{opacity:.45;cursor:default}
header{height:76px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:3px solid var(--ln);background:#060c20}
header h1{font-size:24px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header h1 small{display:block;font-size:18px;color:var(--mu);font-weight:600}
.tabs{display:flex;gap:6px;margin-left:auto;flex-shrink:0}.tabs button{min-height:60px;font-size:21px;padding:0 12px;white-space:nowrap}
#app{height:calc(100% - 76px);display:grid;grid-template-columns:1fr 470px}
#stage{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hero{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#101a3a,#050a18 75%)}
#hw{position:relative}#himg{width:100%;height:100%;display:block;border-radius:12px;border:3px solid var(--ln);background:#fff;user-select:none;-webkit-user-drag:none}
#hcap{position:absolute;left:12px;top:10px;max-width:80%;background:rgba(3,7,18,.9);border:2px solid var(--ln);border-radius:12px;padding:6px 14px;font-size:22px;font-weight:900;color:var(--gold)}
#panel{background:var(--pn);border-left:3px solid var(--ln);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#0f1a3a;border:3px solid var(--ln);border-radius:18px;padding:12px 14px}.card h3{margin:0 0 8px;font-size:25px;color:var(--cy)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips.c3{grid-template-columns:1fr 1fr 1fr}.chips.c1{grid-template-columns:1fr}.chips button{font-size:21px;text-align:left;line-height:1.2;padding:6px 10px;min-height:58px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1e2b55}.row b{color:var(--gold);text-align:right}
.note{font-size:21px;color:var(--mu)}.big{font-size:30px;font-weight:900;color:var(--gold)}
.go{background:linear-gradient(#f59e0b,#ea580c);border-color:#fde68a;color:#111;font-size:25px;width:100%}
.prog{height:16px;border-radius:8px;background:#1e2b55;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#fde68a)}
.hi h4{margin:0 0 4px;font-size:27px;color:var(--gold)}.hi p{margin:0;font-weight:600}
.lab{font-size:20px;color:var(--mu);margin:8px 0 6px;font-weight:800}
input[type=range]{width:100%;height:56px;accent-color:#fbbf24}
.jung{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #2a3a66}.jung i{font-style:normal;flex-shrink:0;background:#1d4ed8;color:#fff;border-radius:10px;padding:2px 10px;font-size:20px;font-weight:900}.jung span{font-size:21px}
.q p{margin:4px 0 10px;font-weight:800;color:var(--gold)}.q .o{display:block;width:100%;text-align:left;margin-bottom:10px;min-height:60px;padding:8px 14px;line-height:1.3}
.q .o.ok{border-color:var(--ok);background:#06301f}.q .o.no{border-color:var(--bad);background:#3a0b16}
.fb{padding:8px 12px;border-radius:12px;background:#0b2a22;border:2px solid var(--ok);margin-top:6px}.fb.no{background:#32101b;border-color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:20px}table.t td,table.t th{border:1px solid #2a3a66;padding:4px 6px;text-align:center}table.t th{background:#16224a;color:var(--cy)}
@media (max-width:980px){html,body{overflow:auto}header{height:auto;flex-wrap:wrap;padding:8px 12px}header h1{font-size:21px;white-space:normal}.tabs{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(var(--nt,4),1fr)}.tabs button{font-size:18px;padding:0 2px;min-width:0}
 #app{display:block;height:auto}#stage{height:62vh;min-height:430px}#panel{border-left:0;border-top:3px solid var(--ln);overflow:visible}#hcap{font-size:18px}}
</style>
</head>

<script>

const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const cv=$('#cv'),cx=cv.getContext('2d');let W=800,H=600,DPR=1;const TAU=Math.PI*2;

function RNG(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647;}

function TX(t,x,y,sz,col,al,wt,maxw){if(W<520)sz*=.84;cx.font=`${wt||800} ${sz}px ${FONT}`;cx.textAlign=al||'left';const w=cx.measureText(t).width,a=al||'left';let av=maxw||(a==='left'?W-x-8:a==='right'?x-8:2*Math.min(x,W-x)-10);if(av>30&&w>av){sz=Math.max(11,sz*av/w);cx.font=`${wt||800} ${sz}px ${FONT}`;}

function glow(x,y,r,c0,c1){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1||'rgba(0,0,0,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,TAU);cx.fill();}
function rrect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}

function stars(a){BG.forEach(s=>{cx.globalAlpha=(a==null?1:a)*(.3+.35*Math.sin(TM*1.3+s[3]));cx.fillStyle='#fff';cx.beginPath();cx.arc(s[0]*W,s[1]*H,s[2],0,TAU);cx.fill();});cx.globalAlpha=1;}
function wl2rgb(nm){let r=0,g=0,b=0;if(nm<440){r=-(nm-440)/60;b=1;}else if(nm<490){g=(nm-440)/50;b=1;}else if(nm<510){g=1;b=-(nm-510)/20;}else if(nm<580){r=(nm-510)/70;g=1;}else if(nm<645){r=1;g=-(nm-645)/65;}else r=1;let f=nm<420?.3+.7*(nm-380)/40:nm>700?.3+.7*(780-nm)/80:1;f=clamp(f,0,1);return `rgb(${Math.round(255*clamp(r,0,1)*f)},${Math.round(255*clamp(g,0,1)*f)},${Math.round(255*clamp(b,0,1)*f)})`;}

/* 패널 도우미 */
const card=(h,inner)=>`<div class="card"><h3>${h}</h3>${inner}</div>`;
const hi=(h,p)=>`<div class="card hi"><h4>${h}</h4><p>${p}</p></div>`;
const row=(k,v)=>`<div class="row"><span>${k}</span><b>${v}</b></div>`;
const note=t=>`<div class="note" style="margin-top:6px">${t}</div>`;
function chips(list,cur,key,cls){return `<div class="chips ${cls||''}">${list.map((x,i)=>`<button data-${key}="${i}" class="${(Array.isArray(cur)?cur.includes(i):i===cur)?'on':''}">${x}</button>`).join('')}</div>`;}
function on(key,fn){$$(`#panel [data-${key}]`).forEach(b=>b.onclick=()=>fn(+b.dataset[key],b));}
function repanel(){const t=$('#panel').scrollTop;RUN.panel();$('#panel').scrollTop=t;}
const RUN={};
/* 분류 게임 탭 만들기: items=[[문구,정답번호]], opts=[보기...] */
function CLS(nm,head,items,opts,info,cols){const S={a:{},i:null};cols=cols||2;const geo=()=>{const w=(W-40-(cols-1)*10)/cols,rows=Math.ceil(items.length/cols),h=Math.min(62,(H-110)/rows-8);return {w,h};};
 return {nm,draw(){TX(head,16,34,21,'#7dd3fc','left',900);const {w,h}=geo();items.forEach((p,i)=>{const x=20+(i%cols)*(w+10),y=60+Math.floor(i/cols)*(h+8),a=S.a[i],ok=a===p[1];box(x,y,w,h,S.i===i?'#2a2a10':a==null?'#111b3a':ok?'#06301f':'#3a0b16',S.i===i?'#fde68a':'#2a3a66');TX(p[0],x+12,y+h/2+7,19,'#e2e8f0','left',800,w-(a!=null?110:24));if(a!=null)TX(ok?opts[a].replace(/^\S+\s/,'')+' ✔':'✖',x+w-10,y+h/2+7,17,ok?'#34d399':'#fb7185','right',900,100);});
  TX('맞힌 수 '+items.filter((p,i)=>S.a[i]===p[1]).length+' / '+items.length,W/2,H-20,22,'#fde68a','center',900);},
 down(x,y){const {w,h}=geo();items.forEach((p,i)=>{const bx=20+(i%cols)*(w+10),by=60+Math.floor(i/cols)*(h+8);if(x>bx&&x<bx+w&&y>by&&y<by+h){S.i=i;repanel();}});},
 panel(){const i=S.i;$('#panel').innerHTML=hi(info[0],info[1])+card('🔍 선택',i==null?note('왼쪽 카드를 눌러요.'):`<div class="note" style="color:#fde68a;font-size:23px">${items[i][0]}</div>`+chips(opts,S.a[i]==null?-1:S.a[i],'cls',opts.length>2?'c1':'')+(S.a[i]!=null?note(S.a[i]===items[i][1]?'✅ 정답!'+(items[i][2]?' '+items[i][2]:''):'❌ 정답: '+opts[items[i][1]]+(items[i][2]?' — '+items[i][2]:'')):''))+'<button id="clsr" style="width:100%">🔁 다시 하기</button>';
  on('cls',k=>{if(i!=null){S.a[i]=k;repanel();}});$('#clsr').onclick=()=>{S.a={};S.i=null;repanel();};}};}
/* 단계 보기 패널 도우미 */
function stepPanel(S,key,list,extra){$('#panel').innerHTML=hi((S[key]+1)+'. '+list[S[key]][0],list[S[key]][1])+card('⏩ 단계',chips(list.map((x,i)=>(i+1)+'. '+x[0]),S[key],'stp','c1')+`<div class="chips" style="margin-top:10px"><button id="spv" ${S[key]?'':'disabled'}>◀ 이전</button><button id="snx" class="go" ${S[key]<list.length-1?'':'disabled'}>다음 ▶</button></div>`)+(extra||'');
 on('stp',i=>{S[key]=i;S.t=0;repanel();});$('#spv').onclick=()=>{S[key]--;S.t=0;repanel();};$('#snx').onclick=()=>{S[key]++;S.t=0;repanel();};}
</script>
<script>
// FILE: 고1_변화와다양성_14_중화반응과_이용.html
// TITLE: 고1 통합과학2 우리 주변의 변화 8차시 · 중화 반응과 생활 속 이용
// IMGS: a43,a44
const S={drops:0};
const AV=20;
const LAB={title:'🧴 중화 반응과 이용',sub:'고1 통합과학2 · Ⅰ-2. 우리 주변의 변화 · 8차시',imgs:['a43','a44'],
tabs:[
{nm:'① 이온 수 변화',draw(){const b=S.drops,h=Math.max(0,AV-b),oh=Math.max(0,b-AV),w=Math.min(AV,b);TX('⚛️ 염산 20 mL에 NaOH 수용액을 조금씩 넣을 때 이온 수 변화',16,34,20,'#7dd3fc','left',900);
 const x0=30,w0=W*.42,y0=70,h0=H-160;box(x0,y0,w0,h0,(h>0?'rgba(250,204,21,':oh>0?'rgba(37,99,235,':'rgba(34,197,94,')+'.25)','#cbd5e1',14);const r=RNG(5);
 const pts=[['H⁺','#ef4444',h],['Cl⁻','#22c55e',AV],['Na⁺','#a855f7',b],['OH⁻','#3b82f6',oh]];pts.forEach(p=>{for(let i=0;i<Math.round(p[2]/2.5);i++){const x=x0+20+r()*(w0-40),y=y0+20+r()*(h0-40);circ(x,y,10,p[1],'#fff',1);TX(p[0],x,y+4,10,'#fff','center',900);}});for(let i=0;i<Math.round(w/2.5);i++)TX('💧',x0+20+r()*(w0-40),y0+20+r()*(h0-40),16,'#fff','center');
 const gx=W*.5,gw=W*.46,gy=70,gh=H-160;box(gx,gy,gw,gh,'#0f1a3a','#2a3a66');const X=v=>gx+20+v/40*(gw-40),Y=n=>gy+gh-20-n/40*(gh-40);
 [['H⁺',v=>Math.max(0,AV-v),'#ef4444'],['Cl⁻',v=>AV,'#22c55e'],['Na⁺',v=>v,'#a855f7'],['OH⁻',v=>Math.max(0,v-AV),'#3b82f6'],['H₂O',v=>Math.min(AV,v),'#7dd3fc']].forEach((s,j)=>{cx.strokeStyle=s[2];cx.lineWidth=3;cx.beginPath();for(let v=0;v<=40;v++){v?cx.lineTo(X(v),Y(s[1](v))):cx.moveTo(X(v),Y(s[1](v)));}cx.stroke();TX(s[0],gx+gw-8,gy+20+j*20,15,s[2],'right',900);});line(X(b),gy,X(b),gy+gh,'#fde68a',2,[5,5]);TX('넣은 NaOH(mL) →',gx+gw,gy+gh+20,13,'#94a3b8','right',700);
 TX(h>0?'산성':oh>0?'염기성':'중성 (완전 중화)',x0+w0/2,H-30,24,h>0?'#facc15':oh>0?'#60a5fa':'#86efac','center',900);},
panel(){$('#panel').innerHTML=hi('⚛️ 중화 반응','산의 H⁺와 염기의 OH⁻가 1 : 1의 개수비로 반응해 물을 만드는 반응이에요. <b style="color:#fde68a">H⁺ + OH⁻ → H₂O</b>. 반응하지 않은 이온(Cl⁻, Na⁺)은 남아 있어요.')+card('💧 NaOH 넣기',`<input type="range" id="dd" min="0" max="40" value="${S.drops}">`+row('넣은 양',S.drops+' mL'));$('#dd').oninput=e=>{S.drops=+e.target.value;repanel();$('#dd').focus();};}},
CLS('② 생활 속 중화','🏠 중화 반응을 이용한 예를 찾아 무엇이 무엇을 중화하는지 골라요',[['벌레에 물렸을 때 암모니아수 바르기',0,'벌레의 산성 물질을 염기로 중화'],['속쓰림에 제산제 먹기',0,'위산을 염기성 제산제로 중화'],['생선 비린내에 레몬즙 뿌리기',1,'염기성 비린내 물질을 산으로 중화'],['산성화된 토양에 석회 뿌리기',0,'산성 토양을 염기성 석회로 중화'],['치약으로 양치하기',0,'입속 세균이 만든 산을 약한 염기로 중화'],['비누로 씻은 뒤 산성 린스',1,'염기성 비누 성분을 산성 린스로 중화']],['🧴 염기로 산을 중화','🍋 산으로 염기를 중화'],['🏠 중화 반응의 이용','일상생활에서 산성이나 염기성을 약하게 하고 싶을 때 중화 반응을 이용해요.'])],
jung:[['중2','물질의 구성','이온의 개수를 모형으로 나타냈어요.'],['중3','화학 반응의 규칙과 에너지 변화','화학 반응에서 입자 수의 비가 일정해요.']],
sum:['중화 반응: H⁺ + OH⁻ → H₂O (1 : 1 개수비)','중화가 진행되며 H⁺(또는 OH⁻) 수는 줄고, 구경꾼 이온(Na⁺, Cl⁻)은 남아요.','제산제·치약·토양 개량·벌레 물림 처치 등에 중화 반응을 이용해요.'],
next:'다음 차시: 에너지를 흡수하거나 방출하는 반응을 알아봐요.',
quiz:[{t:'중화 반응의 알짜 이온 반응식은?',o:['H⁺ + OH⁻ → H₂O','Na⁺ + Cl⁻ → NaCl','H₂ + O₂ → H₂O'],a:0,w:'H⁺와 OH⁻가 물을 만들어요.'},
{t:'염산에 NaOH를 넣을수록 수가 계속 증가하는 이온은?',o:['Na⁺','H⁺','Cl⁻'],a:0,w:'Na⁺는 반응하지 않고 쌓여요.'},
{t:'염산에 NaOH를 넣는 동안 수가 변하지 않는 이온은?',o:['Cl⁻','H⁺','OH⁻'],a:0,w:'Cl⁻는 구경꾼 이온이에요.'},
{t:'속쓰림에 먹는 제산제의 성질은?',o:['염기성','산성','중성'],a:0,w:'위산을 중화해요.'},
{t:'산성화된 토양을 중화하려고 뿌리는 것은?',o:['석회','설탕','소금'],a:0,w:'염기성 석회를 뿌려요.'}]};

</script>
<script>
(function(){
const IMG=window.IMGS.img||{},CAP=window.IMGS.cap||{};
const T=LAB.tabs.concat([{nm:'📖 교과서·연계',hero:true},{nm:'❓ 퀴즈',quiz:true}]);
const st={tab:0,img:0,qi:0,qa:{},done:false};
$('#ttl').innerHTML=LAB.title+'<small>'+LAB.sub+'</small>';
document.documentElement.style.setProperty('--nt',Math.min(T.length,4));
$('#tabs').innerHTML=T.map((t,i)=>`<button data-t="${i}">${t.nm}</button>`).join('');
$$('#tabs button').forEach(b=>b.onclick=()=>setTab(+b.dataset.t));
function fitHero(){if($('#hero').style.display!=='flex')return;const im=$('#himg');const nw=im.naturalWidth||4,nh=im.naturalHeight||3;const r=$('#stage').getBoundingClientRect(),pad=14;const k=Math.min((r.width-pad*2)/nw,(r.height-pad*2)/nh);$('#hw').style.width=nw*k+'px';$('#hw').style.height=nh*k+'px';}
function showImg(k){const im=$('#himg');im.onload=fitHero;im.src=IMG[k];if(im.complete)fitHero();$('#hcap').textContent='교과서: '+(CAP[k]||'');}
function bookPanel(){const ks=LAB.imgs||[];
 $('#panel').innerHTML=(ks.length?card('🖼️ 교과서 그림',chips(ks.map(k=>CAP[k]),st.img,'im','c1')):'')
 +card('🔗 중학교에서 배운 내용과 연결',LAB.jung.map(j=>`<div class="jung"><i>${j[0]}</i><span><b style="color:#fde68a">${j[1]}</b><br>${j[2]}</span></div>`).join(''))
 +card('📌 이번 차시 핵심 정리',LAB.sum.map(s=>`<div class="row" style="justify-content:flex-start"><span>✔ ${s}</span></div>`).join(''))
 +(LAB.next?card('➡️ 다음 차시',`<div class="note" style="color:#e2e8f0">${LAB.next}</div>`):'');
 on('im',i=>{st.img=i;showImg(ks[i]);bookPanel();});}
function quizPanel(){const Q=LAB.quiz,s=st;
 if(s.done){const sc=Q.filter((q,i)=>s.qa[i]===q.a).length;$('#panel').innerHTML=hi('🏁 결과',`<span class="big">${sc} / ${Q.length}</span><br>${sc===Q.length?'완벽해요! 🎉':sc>=Q.length*.6?'잘했어요! 틀린 문제의 실험을 다시 해 봐요.':'실험 탭을 다시 해 보고 도전해요!'}`)+'<button class="go" id="re">🔁 다시 풀기</button>';$('#re').onclick=()=>{s.qi=0;s.qa={};s.done=false;quizPanel();};return;}
 const q=Q[s.qi],ans=s.qa[s.qi];
 $('#panel').innerHTML=card(`❓ ${s.qi+1} / ${Q.length}`,`<div class="prog"><i style="width:${s.qi/Q.length*100}%"></i></div>`)+`<div class="card q"><p>${q.t}</p>${q.o.map((o,i)=>`<button class="o ${ans!=null?(i===q.a?'ok':(i===ans?'no':'')):''}" data-o="${i}" ${ans!=null?'disabled':''}>${'①②③④'[i]} ${o}</button>`).join('')}${ans!=null?`<div class="fb ${ans===q.a?'':'no'}">${ans===q.a?'⭕ 정답!':'❌ 아쉬워요.'} ${q.w}</div><button class="go" id="nq" style="margin-top:10px">${s.qi<Q.length-1?'다음 문제 ▶':'결과 보기 🏁'}</button>`:''}</div>`;
 on('o',i=>{s.qa[s.qi]=i;quizPanel();});const n=$('#nq');if(n)n.onclick=()=>{if(s.qi<Q.length-1)s.qi++;else s.done=true;quizPanel();$('#panel').scrollTop=0;};}
function resize(){const r=$('#stage').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(300,r.width);H=Math.max(300,r.height);cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);fitHero();const t=T[st.tab];if(t&&t.resize)t.resize();}
function setTab(i){st.tab=i;const t=T[i];$$('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));const h=t.hero||t.quiz;$('#hero').style.display=h?'flex':'none';cv.style.display=h?'none':'block';
 RUN.panel=t.hero?bookPanel:t.quiz?quizPanel:t.panel;resize();
 if(t.hero||t.quiz){const ks=LAB.imgs||[];if(ks.length)showImg(ks[t.hero?st.img:0]);}
 if(t.enter)t.enter();RUN.panel();$('#panel').scrollTop=0;}
RUN.go=setTab;
window.addEventListener('resize',resize);
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
let drag=false;
cv.addEventListener('pointerdown',e=>{const t=T[st.tab];if(!t.down)return;drag=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}t.down(...pos(e));});
cv.addEventListener('pointermove',e=>{const t=T[st.tab];if(t.move)t.move(...pos(e),drag);});
cv.addEventListener('pointerup',e=>{drag=false;const t=T[st.tab];if(t.up)t.up(...pos(e));});
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;TM+=dt;const t=T[st.tab];
 if(t.draw){cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle=t.bg||'#050a18';cx.fillRect(0,0,W,H);t.draw(dt);}
 requestAnimationFrame(loop);}
if(LAB.init)LAB.init();setTab(0);requestAnimationFrame(loop);
window.__lab={st,setTab,LAB};
})();
</script>
