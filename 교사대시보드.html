<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교사용 오답 대시보드 · 수업 게임 서랍</title>
<style>
  body{ margin:0; background:#f6f2e7; color:#21301f; font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:26px 18px 60px; }
  header{ border-bottom:2px solid #21301f; padding-bottom:14px; margin-bottom:14px; padding-right:170px; }
  h1{ font-family:"Batang","바탕",serif; margin:0 0 6px; font-size:28px; }
  header p{ margin:0; color:#55624f; font-size:14px; line-height:1.6; }
  select{ font:inherit; font-size:14px; padding:7px 10px; border-radius:8px; border:1.5px solid #d8c9a6; background:#fff; margin:2px 0; }
  .note{ font-size:12.5px; color:#6b5d40; background:#fff; border:1px solid #e6dcc4; border-radius:10px; padding:10px 12px; line-height:1.6; }
  @media (max-width:640px){ header{ padding-right:52px; } }
</style>
<style id="unified-drawer-nav-style">
/* ==========================================================================
   통일화된 상단 네비게이션 서랍 링크 바 (Universal Drawer Navigation)
   ========================================================================== */
.unified-nav-actions, .header-actions, .nav-actions, .top-links {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  flex-wrap: wrap !important;
}

.btn-unified-nav {
  display: inline-flex !important;
  align-items: center !important;
  gap: 5px !important;
  padding: 6px 12px !important;
  border-radius: 8px !important;
  font-size: 13px !important;
  font-weight: 700 !important;
  text-decoration: none !important;
  border: 1px solid #cbd5e1 !important;
  background: #ffffff !important;
  color: #1e293b !important;
  cursor: pointer !important;
  white-space: nowrap !important;
  transition: all 0.15s ease !important;
  line-height: 1.4 !important;
  font-family: inherit !important;
  box-sizing: border-box !important;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04) !important;
}

.btn-unified-nav:hover {
  background: #f1f5f9 !important;
  border-color: #94a3b8 !important;
  color: #0f172a !important;
  transform: translateY(-1px) !important;
}

.btn-unified-nav.btn-hub-main {
  background: #eff6ff !important;
  border-color: #bfdbfe !important;
  color: #1d4ed8 !important;
}
.btn-unified-nav.btn-hub-main:hover {
  background: #2563eb !important;
  color: #ffffff !important;
  border-color: #2563eb !important;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25) !important;
}

.btn-unified-nav.btn-hub-sim {
  background: #fffbeb !important;
  border-color: #fde68a !important;
  color: #b45309 !important;
}
.btn-unified-nav.btn-hub-sim:hover {
  background: #f59e0b !important;
  color: #ffffff !important;
  border-color: #f59e0b !important;
  box-shadow: 0 2px 6px rgba(245, 158, 11, 0.25) !important;
}

.btn-unified-nav.btn-hub-game {
  background: #faf5ff !important;
  border-color: #e9d5ff !important;
  color: #7e22ce !important;
}
.btn-unified-nav.btn-hub-game:hover {
  background: #7c3aed !important;
  color: #ffffff !important;
  border-color: #7c3aed !important;
  box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25) !important;
}

.btn-unified-nav.btn-ws {
  background: #ecfdf5 !important;
  border-color: #a7f3d0 !important;
  color: #047857 !important;
}
.btn-unified-nav.btn-ws:hover {
  background: #059669 !important;
  color: #ffffff !important;
  border-color: #059669 !important;
}

.btn-unified-nav.btn-theory {
  background: #f8fafc !important;
  border-color: #cbd5e1 !important;
  color: #334155 !important;
}
.btn-unified-nav.btn-theory:hover {
  background: #e2e8f0 !important;
  color: #0f172a !important;
}

/* 통일된 게임 헤더 */
header.unified-game-header {
  background: #ffffff !important;
  border-bottom: 1.5px solid #e2e8f0 !important;
  padding: 10px 20px !important;
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
  flex-wrap: wrap !important;
  gap: 12px !important;
  position: relative !important;
  z-index: 100 !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03) !important;
}
header.unified-game-header .header-brand {
  display: flex !important;
  align-items: center !important;
  gap: 10px !important;
}
header.unified-game-header .game-badge {
  background: #f1f5f9 !important;
  color: #475569 !important;
  padding: 2px 8px !important;
  border-radius: 999px !important;
  font-size: 11px !important;
  font-weight: 800 !important;
}
header.unified-game-header .game-title {
  font-size: 18px !important;
  font-weight: 900 !important;
  color: #0f172a !important;
}
</style>
<style id="kjs-mobile-fix">@media (max-width:760px){
  html,body{overflow-x:clip}
  table{display:block!important;max-width:calc(100vw - 28px)!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}
  .km-row>.km-scroll,.km-row>.km-chips{align-self:stretch!important;max-width:calc(100vw - 48px)!important}
  .navrow>*{max-width:calc(100vw - 36px)!important;align-self:stretch}
  .unit-chips-row{flex-wrap:wrap!important}
  .card-box,.panel-card{max-width:calc(100vw - 24px)!important;min-width:0!important}
  .control-grid,.puzzle-container{min-width:0!important}
}</style>
</head>
<body>
<header class="unified-game-header">
  <div class="header-brand">
    <span class="game-badge">교사용</span>
    <span class="game-title">교사용 오답 대시보드</span>
  </div>
  <div class="header-actions unified-nav-actions">
    <button type="button" id="kjsHome" class="btn-top btn-unified-nav btn-theory" title="이 게임의 처음 화면으로">↺ 처음 화면</button>
    <a href="./통합_과학수업_서랍.html" class="btn-top btn-unified-nav btn-hub-main" title="과학수업 통합 서랍(메인 메뉴) 바로가기"><span>📚 통합과학</span></a>
    <a href="./자바실험실_서랍.html" class="btn-top btn-unified-nav btn-hub-sim" title="자바실험실 가상실험실 서랍 바로가기"><span>🔬 자바실험</span></a>
    <a href="./시작하기_수업게임서랍.html" class="btn-top btn-unified-nav btn-hub-game" title="수업 게임 서랍 바로가기"><span>🎮 수업게임</span></a>
  </div>
</header>

<div class="wrap">
  <header>
    <h1>👩‍🏫 교사용 오답 대시보드</h1>
    <p>학생들이 게임에서 틀리거나 놓치거나 힌트를 쓴 개념을 모아, 오답률이 높은 순으로 보여 줍니다. 게임이 끝난 직후 이 화면을 띄워 1위 개념부터 짚어 주세요.</p>
  </header>
  <div id="dash"></div>
  <p class="note">📱 기록은 게임을 한 <b>그 기기의 브라우저</b>에 쌓입니다. 반 전체 결과를 보려면 교실 공용 PC(전자칠판)로 돌아가며 하거나, 같은 웹사이트 주소에서 게임을 한 기기에서 이 화면을 열어 주세요. 개념 수비대·개념 격추·십자말풀이의 기록이 모입니다.</p>
</div>
<script src="./sounds/kjs-insight.js"></script>
<script>window.addEventListener("load", function(){ KJSInsight.renderDashboard(document.getElementById("dash")); });</script>
<script>
document.getElementById('kjsHome').addEventListener('click', function(){
  if(confirm('이 게임의 처음 화면으로 돌아갑니다. 진행 중인 내용은 사라집니다.')) location.reload();
});
</script>
<script src="./sounds/kjs-sound.js"></script>
</body>
</html>
