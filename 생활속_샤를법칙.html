<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생활 속 샤를의 법칙 가상실험실 (기체의 성질)</title>
<style>
:root{--bg:#0a0e17;--card:#0f1626;--ln:#26334d;--tx:#f1f5f9;--sub:#b6c4dd;--gold:#fde68a;--cy:#7dd3fc;--S:#fb7185;--T:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,a,select,input{font-family:inherit}button{color:inherit;cursor:pointer;border:0;background:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
/* ---------- 상단 : 제목 · 탭 · 도구(우측 상단) ---------- */
.hd{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:2px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .ic{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.brand h1{font-size:max(24px,1.7vw);font-weight:900;white-space:nowrap}
.brand small{display:block;font-size:max(18px,1vw);color:var(--sub);font-weight:700}
.tabs{display:flex;gap:10px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{min-height:56px;padding:0 clamp(14px,1.8vw,30px);border-radius:14px;background:var(--card);border:2px solid var(--ln);font-weight:900;font-size:max(20px,1.25vw);white-space:nowrap}
.tab.on{background:#f59e0b;border-color:#fde68a;color:#1a1200}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tb{min-width:56px;min-height:56px;padding:0 16px;border-radius:14px;background:var(--card);border:2px solid var(--ln);font-weight:800;font-size:max(20px,1.1vw);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--tx);text-decoration:none;white-space:nowrap}
.tb:active{background:#1e3a8a}.tb.on{background:#16a34a;border-color:#bbf7d0}
/* ---------- 본문 : 그림(왼쪽) + 읽기·조작 패널(오른쪽) ---------- */
.mn{flex:1;min-height:0;display:flex;gap:12px;padding:10px 12px 12px}
#stage{position:relative;flex:1;min-width:0;background:var(--bg);border-radius:18px;overflow:hidden;border:2px solid var(--ln)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#note{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(10,14,23,.96);color:#fff;border:2px solid var(--gold);border-radius:14px;padding:10px 22px;font-weight:800;font-size:max(20px,1.3vw);opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%;text-align:center;z-index:3}
#note.on{opacity:1}
#side{flex:0 0 clamp(400px,34vw,620px);display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;padding-right:2px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px 18px}
.card h2{font-size:max(24px,1.5vw);font-weight:900;color:var(--cy);margin-bottom:8px}
.card p,.card li{font-size:max(20px,1.25vw);line-height:1.65;color:#e8eefc;font-weight:600}
.card ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.card li{padding-left:1.5em;position:relative}.card li:before{content:"●";position:absolute;left:0;color:var(--gold);font-size:.7em;top:.55em}
.formula{background:linear-gradient(135deg,#3a2a06,#16306b);border-color:#f59e0b;text-align:center;padding:10px 14px}
.formula .eq{font-size:max(32px,2.3vw);font-weight:900;color:#fde68a;line-height:1.25}.formula small{display:block;font-size:max(19px,1.1vw);color:#e2e8f0;font-weight:700;margin-top:2px}
.steps3{padding:10px 14px}.steps3 h2{margin-bottom:6px}
.s3{display:flex;flex-direction:column;gap:4px}.s3 .bx{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 12px;border-radius:12px;background:#131c30;border:2px solid #2a3855}
.s3 .bx .no{width:34px;height:34px;border-radius:50%;background:#26334d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;grid-row:span 2}
.s3 .bx .t{font-size:max(18px,.95vw);font-weight:800;color:var(--sub)}.s3 .bx .v{font-size:max(20px,1.2vw);font-weight:900;color:#fff;line-height:1.35}
.s3 .bx.hot{border-color:#f97316;background:rgba(249,115,22,.12)}.s3 .bx.cold{border-color:#60a5fa;background:rgba(96,165,250,.12)}.s3 .bx.res{border-color:#22c55e;background:rgba(34,197,94,.12)}
.s3 .ar{text-align:center;font-size:20px;line-height:1;color:var(--gold);font-weight:900}
#badge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:6;background:linear-gradient(135deg,#16a34a,#15803d);border:5px solid #bbf7d0;border-radius:28px;padding:22px 40px;text-align:center;color:#fff;font-weight:900;font-size:max(34px,2.6vw);line-height:1.3;box-shadow:0 12px 50px rgba(0,0,0,.6);transition:all .35s cubic-bezier(.2,1.4,.4,1)}
#badge small{display:block;font-size:.62em;color:#dcfce7;margin-top:6px}#badge.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.k{color:var(--gold);font-weight:900}.cS{color:var(--S);font-weight:900}.cT{color:var(--T);font-weight:900}
/* 수치 카드 */
.big{font-size:max(36px,2.6vw);font-weight:900;line-height:1.15;color:#fff}
.big small{font-size:.5em;color:var(--sub);font-weight:700;margin-left:6px}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 12px;border-radius:12px;background:#131c30;font-size:max(20px,1.2vw);font-weight:700}
.row b{font-size:max(24px,1.5vw);font-weight:900;color:#fff}
.row.S{background:rgba(251,113,133,.14)}.row.S b{color:var(--S)}.row.T{background:rgba(96,165,250,.14)}.row.T b{color:var(--T)}
.cmp{margin-top:8px;padding:10px 14px;border-radius:12px;background:rgba(245,158,11,.14);border:2px solid #f59e0b;font-size:max(21px,1.3vw);font-weight:900;color:var(--gold);line-height:1.5;text-align:center}
.steps{display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 12px;border-radius:12px;background:#131c30;border:2px solid #2a3855;font-size:max(20px,1.2vw);font-weight:800;color:var(--sub)}
.st .n{width:34px;height:34px;border-radius:50%;background:#26334d;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex:none;color:#fff}
.st .tt{flex:1}.st .vv{font-size:max(22px,1.3vw);font-weight:900;color:#fff;text-align:right}
.st.done{background:rgba(34,197,94,.16);border-color:#22c55e;color:#bbf7d0}.st.done .n{background:#22c55e;color:#04210f}
.st.now{border-color:#f59e0b;color:#fff}
/* 말풍선(피드백) */
.fb{border-color:#4a5a85;background:#101b34}
.fb .chip{display:inline-block;padding:4px 14px;border-radius:999px;background:#1e3a8a;color:#bfdbfe;font-size:20px;font-weight:900}
.fbtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}.sys{display:flex;gap:8px}
.mini{width:54px;height:54px;border-radius:14px;background:#1e293b;border:2px solid #475569;font-size:26px;font-weight:900;color:#fff;display:inline-flex;align-items:center;justify-content:center}.mini.on{background:#16a34a;border-color:#bbf7d0}
.quiz{margin-top:10px;padding-top:10px;border-top:2px dashed #2a3855}.quiz .lab{margin:0 0 6px 2px}
#msg{font-size:max(21px,1.3vw);line-height:1.6;font-weight:700;color:#fff}
#msg b{color:var(--gold)}
/* 조작 독 (오른쪽 아래) */
.dock{display:flex;flex-direction:column;gap:9px;padding:12px}
.slw{display:grid;grid-template-columns:minmax(96px,32%) 1fr minmax(76px,24%);align-items:center;gap:10px;min-height:54px;padding:0 12px;border-radius:14px;background:#131c30;border:2px solid #2a3855}
.slw label{font-size:max(20px,1.1vw);font-weight:800;color:var(--sub)}.slw input[type=range]{width:100%;height:50px;accent-color:#f59e0b}
.slw b{font-size:max(22px,1.3vw);color:var(--gold);text-align:right;font-weight:900}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.one{grid-template-columns:1fr}.btns.three{grid-template-columns:1fr 1fr 1fr}.btns.five{grid-template-columns:repeat(5,1fr)}.btns.five .cb{padding:4px 2px;font-size:max(19px,1.05vw);flex-direction:column;gap:0;min-height:64px}.btns.five .cb small{font-size:max(18px,.95vw);font-weight:700;opacity:.95}
.ans{display:none;margin-top:8px;padding:10px 14px;border-radius:12px;background:rgba(34,197,94,.14);border:2px solid #22c55e;font-size:max(21px,1.25vw);line-height:1.6;font-weight:700;color:#dcfce7}.ans.on{display:block}
.cb.c-r{background:#b91c1c}.cb.c-y{background:#a16207}.cb.c-w{background:#64748b}.cb.c-b{background:#1d4ed8}
.cb{min-height:54px;padding:6px 12px;border-radius:14px;font-weight:900;font-size:max(20px,1.15vw);border:3px solid rgba(255,255,255,.4);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;text-align:center}
.cb:active{transform:scale(.97)}
.cb.gr{background:#15803d}.cb.bl{background:#1d4ed8}.cb.or{background:#c2410c}.cb.pu{background:#6d28d9}.cb.gy{background:#1e293b;border-color:#475569}.cb.rd{background:#b91c1c}
.cb.on{box-shadow:0 0 0 4px #fde68a}.cb:disabled{opacity:.45}
.lab{font-size:max(18px,1vw);font-weight:800;color:var(--sub);margin:2px 0 -4px 4px}
.inrow{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;align-items:center;gap:10px}
.inrow label{font-size:max(20px,1.1vw);font-weight:800;color:var(--sub)}.inrow small{font-size:max(20px,1.1vw);font-weight:800;color:var(--sub)}
.dock select,.dock input[type=number]{min-height:56px;border-radius:14px;border:2px solid var(--ln);background:#131c30;color:#fff;font:inherit;font-weight:800;font-size:max(21px,1.2vw);padding:0 12px;width:100%;user-select:text;-webkit-user-select:text}
.inrow.ok input{border-color:#22c55e;background:#052e16}.inrow.no input{border-color:#ef4444;background:#450a0a}
/* 모달·드로어 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}.ov.on{display:flex}
.pop{background:#0f1626;border:2px solid var(--ln);border-radius:20px;width:100%;max-width:1000px;max-height:94vh;overflow:auto;padding:clamp(16px,2vw,26px)}
.pop h2{font-size:max(26px,1.8vw);color:var(--cy);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{min-width:56px;min-height:56px;border-radius:14px;background:#27406e;font-size:24px;font-weight:900;color:#fff}
.segs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.seg{min-height:56px;padding:0 20px;border-radius:12px;background:var(--card);border:2px solid var(--ln);font-weight:800;font-size:max(20px,1.2vw)}.seg.on{background:#f59e0b;color:#1a1200;border-color:#fde68a}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cc{background:#131c30;border:2px solid #2a3855;border-radius:16px;padding:14px 18px}
.cc h3{font-size:max(24px,1.5vw);margin-bottom:6px}.cc p{font-size:max(20px,1.2vw);line-height:1.65;color:#e2e8f0;font-weight:600}.cc p b{color:var(--gold)}.cc .ex{margin-top:6px;font-size:max(18px,1vw);color:#93c5fd}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(94vw,480px);background:#0f1626;border-left:3px solid #f59e0b;transform:translateX(105%);transition:transform .25s;z-index:60;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}.dr.on{transform:none}
.dr h3{font-size:26px;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.dr section{background:#0b1220;border:2px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dr h4{font-size:21px;color:var(--cy)}.chk{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 12px;background:#131c30;border:2px solid var(--ln);border-radius:12px;font-weight:800;font-size:20px;cursor:pointer}.chk input{width:28px;height:28px;accent-color:#f59e0b}
.dr input[type=range]{width:100%;height:50px;accent-color:#f59e0b}.dr .row2{display:flex;gap:10px;flex-wrap:wrap}.dr small{color:var(--sub);font-size:19px;line-height:1.5}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}#dim.on{opacity:1;pointer-events:auto}
.qrn{background:#2a2410;border:1px solid #f59e0b;color:var(--gold);border-radius:10px;padding:10px 14px;font-size:19px;line-height:1.5}
#qrUrl{width:100%;min-height:56px;border-radius:12px;border:2px solid var(--ln);background:#0b1726;color:#fff;font:inherit;font-size:19px;padding:0 12px;user-select:text;-webkit-user-select:text}
#qrCv{background:#fff;padding:12px;border-radius:12px;width:min(70vw,360px);height:auto;image-rendering:pixelated;align-self:center}
#qrMsg{color:#fca5a5;font-size:19px;font-weight:700;min-height:1.3em}#qrCap{font-size:18px;color:var(--sub);word-break:break-all;text-align:center}
/* 심플 보기 : 꼭 필요한 것만 */
body.simple .hide-simple{display:none!important}
body.simple #learn li:nth-child(n+3){display:none}
@media (max-height:900px){.s3 .bx{padding:5px 10px}.formula .eq{font-size:max(28px,1.9vw)}.card{padding:10px 14px}.card h2{margin-bottom:4px}#learn li:nth-child(3){display:none}.cmp{font-size:max(20px,1.15vw)}.big{font-size:max(32px,2.2vw)}}
@media (max-width:1000px){.mn{flex-direction:column;overflow-y:auto}#stage{flex:none;height:56vh}#side{flex:none;overflow:visible}.cg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header class="hd">
    <div class="brand"><div class="ic">🎈</div><div><h1>생활 속 샤를의 법칙 실험실</h1><small>기체의 성질 · 기체의 온도와 부피 관계</small></div></div>
    <nav class="tabs">
      <button class="tab on" data-m="1">🎈 열기구의 원리</button>
      <button class="tab" data-m="2">🏓 찌그러진 공</button>
      <button class="tab" data-m="3">🍱 안 열리는 밀폐용기</button>
      <button class="tab" data-m="4">🥚 안 깨지는 달걀 삶기</button>
    </nav>
    <div class="tools">
      <button class="tb" id="bSimple" title="화면을 단순하게">👁 심플 보기</button>
      <button class="tb" id="bConcept">💡 개념</button>
      <button class="tb" id="bQRtop" title="학생용 QR코드">📱 QR</button>
      <button class="tb" id="bFs" title="전체화면">⛶ 전체화면</button>
      <button class="tb" id="bSet" title="설정">⚙️</button>
    </div>
  </header>
  <main class="mn">
    <div id="stage"><canvas id="cv"></canvas><div id="note"></div><div id="badge"></div></div>
    <aside id="side">
      <section class="card formula" id="formula"></section>
      <section class="card steps3" id="learn"></section>
      <section class="card" id="data"><div id="dv"></div><div id="quizBox"></div></section>
      <section class="card fb"><div class="fbtop"><span class="chip" id="fbTag">💬 지금 상태</span><span class="sys"><button class="mini" id="bPause" title="정지 / 재생" aria-label="정지">⏸</button><button class="mini" id="bReset" title="처음으로" aria-label="처음으로">↺</button></span></div><div id="msg"></div></section>
      <section class="card dock" id="ctl"></section>
    </aside>
  </main>
</div>
<div id="dim"></div>
<aside class="dr" id="dr">
  <h3>⚙️ 설정 <button class="x" id="drX">✕</button></h3>
  <section><h4>🐢 슬로모션</h4><button class="tb" id="bSlow">🐢 슬로모션 켜기/끄기</button><input type="range" id="slowK" min="0.1" max="0.5" step="0.05" value="0.25"><small>속도 배율 : <b id="slowV">×0.25</b></small></section>
  <section><h4>🔊 효과음</h4><label class="chk"><input type="checkbox" id="snd" checked> 효과음 켜기 (퐁! 착! 미션 성공)</label></section>
  <section><h4>🔗 이동</h4><div class="row2"><a class="tb" href="./가상실험실_서랍.html">🔬 가상실험실</a><a class="tb" href="./통합_과학수업_서랍.html">📚 통합과학</a><a class="tb" href="./시작하기_수업게임서랍.html">🎮 수업게임</a></div></section>
  <section><h4>📱 학생 접속 QR</h4><button class="tb" id="bQR">📱 QR 코드 만들기</button></section>
</aside>
<div class="ov" id="ovC"><div class="pop">
  <h2><span>💡 핵심 개념 한눈에 보기</span><button class="x" id="cX">✕</button></h2>
  <div class="segs"><button class="seg on" data-s="k">핵심 개념</button><button class="seg" data-s="f">교과서 그림 읽기</button></div>
  <div id="cBody"></div>
</div></div>
<div class="ov" id="ovQ"><div class="pop" style="max-width:520px">
  <h2><span>📱 학생 접속 QR코드</span><button class="x" id="qX">✕</button></h2>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="qrn">학생 휴대폰·태블릿 카메라로 찍으면 바로 열립니다. GitHub Pages 주소를 한 번 붙여 넣으면 이 컴퓨터에 저장돼요.</div>
    <input id="qrUrl" type="url" placeholder="https://계정명.github.io/저장소명/생활속_샤를법칙.html" autocomplete="off" spellcheck="false">
    <div id="qrMsg"></div><canvas id="qrCv" width="400" height="400"></canvas><div id="qrCap"></div>
  </div>
</div></div>

    cv.addEventListener('click',function(e){e.stopPropagation();openBig(cv);});
  }
  function scan(){var all=document.querySelectorAll('canvas');for(var i=0;i<all.length;i++){if(/qr/i.test(all[i].id))attach(all[i]);}}
  scan();document.addEventListener('DOMContentLoaded',scan);
  try{new MutationObserver(function(){scan();}).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}
  window.__qrBig=openBig;
})();
</script>
</body>
</html>
