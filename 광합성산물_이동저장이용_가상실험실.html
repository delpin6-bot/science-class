  const sr=clamp(w*.008,5,8);

    const y0=G.top+10,y1=G.gy-(G.gy-G.top)*.2;n.x=G.px+Math.sin(D3.t*2+n.ph)*5;n.y=lerp(y0,y1,n.p)+Math.sin(D3.t*3+n.ph)*(n.p>=1?4:0);
