<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전기 에너지의 전환과 소비 전력 · 자바실험실 2D</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#f8fafc;color:#0f172a;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
header.hub{background:#fff;border-bottom:1.5px solid #e2e8f0;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.brand-wrap{display:flex;align-items:center;gap:12px}
.brand-badge{background:#f1f5f9;color:#3b82f6;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.5px}
header.hub h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:baseline;gap:8px}
.sub-date{font-size:12px;color:#64748b;font-weight:500}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nb{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 13px;border-radius:8px;border:1px solid var(--c);background:#fff;color:var(--c);
  font:700 13px/1.4 inherit;font-family:inherit;text-decoration:none;white-space:nowrap;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all .15s}
.nb:hover{background:var(--c);color:#fff;transform:translateY(-1px)}
.nb.main{--c:#2563eb}.nb.sim{--c:#d97706}.nb.game{--c:#7c3aed}.nb.qr{--c:#059669}

html,body{overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
.mtabs{display:flex;gap:8px;padding:8px 14px 0;background:#fff;border-bottom:2px solid #e2e8f0;flex-wrap:wrap}
.mt{min-height:56px;padding:0 18px;border-radius:12px 12px 0 0;border:2px solid #cbd5e1;border-bottom:0;background:#f1f5f9;color:#0f172a;font-weight:800;font-size:16px}
.mt[aria-selected="true"]{background:#fff;border-color:#2563eb;color:#1d4ed8;box-shadow:0 3px 0 #fff}
main{flex:1;min-height:0;display:grid;grid-template-columns:55% 45%}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid #e2e8f0}
#stageWrap{flex:1;min-height:200px;position:relative;background:#e8eef5}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#ctl{background:#fff;border-top:1px solid #e2e8f0;padding:8px 12px;display:flex;flex-direction:column;gap:8px;max-height:44%;overflow:auto}
.blk{display:none;flex-direction:column;gap:8px}
.blk.on{display:flex}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{min-height:60px;border-radius:12px;border:2px solid #cbd5e1;background:#fff;padding:4px 8px;text-align:left;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;line-height:1.25;color:#0f172a}
.card .ic{font-size:28px}
.card small{display:block;font-weight:700;color:#64748b;font-size:12px}
.card.sel{border-color:#2563eb;background:#eff6ff;box-shadow:inset 0 0 0 2px #2563eb}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{min-height:56px;padding:0 16px;border-radius:12px;border:2px solid #94a3b8;background:#fff;color:#0f172a;font-weight:800;font-size:16px}
.big:hover{background:#f1f5f9}
.pw{min-width:150px}.pw.on{background:#16a34a;border-color:#15803d;color:#fff}
.tctl{display:flex;align-items:center;gap:8px;flex:1;min-width:260px;font-weight:800}
.tctl input[type=range]{flex:1;min-width:110px;height:40px}
#tvVal{min-width:44px;text-align:center;font-size:24px;color:#2563eb}
.un{min-height:48px;min-width:56px;border-radius:10px;border:2px solid #cbd5e1;background:#f8fafc;font-weight:800;font-size:15px}
.un.sel{background:#2563eb;border-color:#2563eb;color:#fff}
.dcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dc{border:2px solid #cbd5e1;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px}
.dc .btns{display:flex;gap:6px}
.dc button{flex:1;min-height:48px;border-radius:10px;border:2px solid #94a3b8;background:#fff;font-weight:800;font-size:14px}
.dc button.on{background:#16a34a;border-color:#15803d;color:#fff}
.dc button.warn{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.sp{min-height:52px;min-width:90px;border-radius:10px;border:2px solid #cbd5e1;background:#f8fafc;font-weight:800;font-size:14px;padding:0 8px}
.sp.sel{background:#7c3aed;border-color:#7c3aed;color:#fff}
.tap.on{background:#16a34a;border-color:#15803d;color:#fff}
.tap.off{background:#fee2e2;border-color:#dc2626;color:#991b1b}

.right{min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px;overflow:auto;background:#f8fafc}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:#fff;border:2px solid var(--c);border-radius:12px;padding:4px 12px}
.tile .l{font-size:13px;font-weight:800;color:#475569}
.tile .v{font-size:clamp(28px,2.6vw,44px);font-weight:900;color:var(--c);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:.45em;margin-left:4px;color:#475569}
#dwrap{flex:1;min-height:250px;position:relative;background:#fff;border:2px solid #e2e8f0;border-radius:12px}
#dash{position:absolute;inset:0;width:100%;height:100%;display:block}
#guide{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.6;font-weight:600}
#guide b.k{color:#b91c1c}
#guide details{margin-top:6px;background:#f1f5f9;border-radius:8px;padding:6px 10px}
#guide summary{font-weight:800;cursor:pointer;min-height:36px;display:flex;align-items:center}
.src{font-size:12px;color:#64748b;font-weight:600}
@media(max-width:980px){
  html,body{overflow:auto}.app{height:auto}
  main{display:block}#stageWrap{height:62vw;min-height:300px;flex:none}#ctl{max-height:none}
  #dwrap{min-height:300px;flex:none}
}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:50;align-items:center;justify-content:center;padding:12px}
.overlay.on{display:flex}
.sheet{background:#fff;color:#0f172a;border:2px solid #e2e8f0;border-radius:16px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:18px 22px}
.sheet h2{margin:0;font-size:24px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.qb{min-height:48px;padding:0 16px;border-radius:10px;border:2px solid #94a3b8;background:#fff;color:#0f172a;font-weight:800;font-size:16px}
.qb:hover{background:#f1f5f9}
.note{font-size:15px;font-weight:600;color:#475569;line-height:1.5;margin:8px 0}
#qrBox{text-align:center;margin:10px 0}
#qrCv{width:min(60vw,340px);height:min(60vw,340px);background:#fff;border:6px solid #fff;border-radius:8px;box-shadow:0 0 0 2px #cbd5e1;image-rendering:pixelated}
#qrTitle{font-size:24px;font-weight:900;margin:6px 0}
#qrCap{font-size:14px;font-weight:600;color:#475569;word-break:break-all}
#qrUrl{width:100%;min-height:48px;font-size:16px;padding:0 12px;border-radius:10px;border:2px solid #94a3b8;background:#f8fafc;color:#0f172a;-webkit-user-select:text;user-select:text}
#qrMsg{min-height:1.4em;font-size:16px;font-weight:700;color:#b91c1c;margin:6px 0}
@media print{
  body>*:not(#ovQR){display:none!important}
  body{overflow:visible;height:auto;background:#fff}
  #ovQR{position:static;display:block!important;background:none;padding:0}
  #ovQR .sheet{border:0;max-height:none;overflow:visible}
  #ovQR .noprint{display:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header class="hub">
    <div class="brand-wrap">
      <span class="brand-badge">자바실험실 2D</span>
      <h1>전기 에너지의 전환과 소비 전력 <span class="sub-date">에너지 효율 · 대기 전력</span></h1>
    </div>
    <div class="nav">
      <a href="./통합_과학수업_서랍.html" class="nb main" title="과학수업 통합 서랍(메인 메뉴) 바로가기">📚 통합과학</a>
      <a href="./자바실험실_서랍.html" class="nb sim" title="자바실험실 가상실험실 서랍 바로가기">🔬 자바실험</a>
      <a href="./시작하기_수업게임서랍.html" class="nb game" title="수업 게임 서랍 바로가기">🎮 수업게임</a>
      <button class="nb qr" id="btnQR" title="QR 코드 만들기">📱 QR</button>
    </div>
  </header>
  <nav class="mtabs" role="tablist">
    <button class="mt" data-m="1" role="tab" aria-selected="true">① 가전제품의 에너지 전환</button>
    <button class="mt" data-m="2" role="tab" aria-selected="false">② 조명 기구의 에너지 효율</button>
    <button class="mt" data-m="3" role="tab" aria-selected="false">③ 스마트 전력량계 · 대기 전력</button>
  </nav>
  <main>
    <section class="left">
      <div id="stageWrap"><canvas id="stage"></canvas></div>
      <div id="ctl">
        <div class="blk" id="b1"><div class="cards" id="cards"></div></div>
        <div class="blk" id="b12">
          <div class="row">
            <button class="big pw" id="pw">⏻ 전원 OFF</button>
            <div class="tctl"><span>사용 시간</span><input type="range" id="tv" min="1" max="100" step="1" value="1"><span id="tvVal">1</span>
              <button class="un" data-u="s">초</button><button class="un" data-u="m">분</button><button class="un sel" data-u="h">시간</button></div>
          </div>
        </div>
        <div class="blk" id="b3">
          <div class="dcards" id="dcards"></div>
          <div class="row">
            <button class="big tap on" id="tap">🔌 절전 멀티탭 ON</button>
            <button class="sp" data-s="0">⏸ 정지</button>
            <button class="sp sel" data-s="3600">1초 = 1시간</button>
            <button class="sp" data-s="86400">1초 = 1일</button>
            <button class="sp" data-s="2592000">1초 = 1개월</button>
            <button class="sp" id="m3r">↺ 처음부터</button>
          </div>
        </div>
      </div>
    </section>
    <section class="right">
      <div class="tiles" id="tiles"></div>
      <div id="dwrap"><canvas id="dash"></canvas></div>
      <div id="guide"></div>
    </section>
  </main>
</div>

<div class="overlay" id="ovQR">
  <div class="sheet" role="dialog" aria-label="QR 코드">
    <div class="row noprint" style="justify-content:space-between;align-items:center">
      <h2>📱 QR 코드 만들기</h2>
      <button class="qb" id="closeQR">닫기 ✕</button>
    </div>
    <div class="note noprint">학생 휴대폰·태블릿으로 스캔해 바로 접속합니다. GitHub Pages 주소를 한 번 붙여 넣으면 이 기기에 저장됩니다.</div>
    <div class="row noprint" style="margin:8px 0">
      <button class="qb" id="qrThis">🧪 이 페이지 QR</button>
      <button class="qb" id="qrDrawer">🔬 자바실험실 서랍 QR</button>
    </div>
    <input id="qrUrl" class="noprint" type="url" placeholder="https://사용자명.github.io/저장소명/파일이름.html" aria-label="QR로 만들 주소">
    <div id="qrMsg" class="noprint"></div>
    <div id="qrBox">
      <div id="qrTitle">전기 에너지의 전환과 소비 전력</div>
      <canvas id="qrCv" width="400" height="400"></canvas>
      <div id="qrCap"></div>
    </div>
    <div class="row noprint">
      <button class="qb" id="qrPng">⬇ PNG 저장</button>
      <button class="qb" id="qrPrint">🖨 인쇄</button>
    </div>
  </div>
</div>

<script>
/* qrcode-generator 2.0.4 (MIT, Kazuhiko Arase) — 오프라인 동작을 위해 파일 내부에 포함 */
//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

    else{c.setLineDash([5,5]);c.strokeStyle='#94a3b8';c.beginPath();c.moveTo(plugX+24,y);c.lineTo(620,y);c.stroke();c.setLineDash([]);}
    // 본체
    const lit=P.st==='on';
    rr(c,X-20,y-55,260,110,14);c.fillStyle=lit?'#ffffff':'#e5e7eb';c.fill();c.lineWidth=lit?5:3;c.strokeStyle=lit?COL.elec:'#94a3b8';c.stroke();
    T(c,DEVS[i].ic,X+22,y-8,46,'#000');
    T(c,DEVS[i].name,X+55,y-30,18,'#0f172a','left');
    const txt={on:'작동 중 '+DEVS[i].on+' W',sb:'대기 전력 '+DEVS[i].sb+' W',unplug:'플러그 뽑음 0 W',tap:'멀티탭 OFF 0 W',off:''}[P.st];
    T(c,txt,X+55,y+4,17,P.st==='on'?'#15803d':P.st==='sb'?'#b91c1c':'#64748b','left');
    if(P.st==='sb'){const bl=Math.sin(S.t*5)>0;c.beginPath();c.arc(X+220,y-34,8,0,7);c.fillStyle=bl?'#ef4444':'#7f1d1d';c.fill();T(c,'대기 표시등',X+200,y+30,12,'#b91c1c','right');}
    if(P.st==='on'){const g=c.createLinearGradient(X+60,0,X+230,0);g.addColorStop(0,'#38bdf8');g.addColorStop(1,'#a78bfa');rr(c,X+55,y+18,160,22,6);c.fillStyle=g;c.fill();}
    // 입자
    const rate=P.p<=0?0:P.st==='sb'?.7:1+7*Math.sqrt(P.p/1000);
    if(d.plug&&m.tap)stream(c,'d'+i,[[478,y],[plugX,y]],rate,dt,170,P.st==='sb'?'#f87171':COL.elec,null,P.st==='sb'?3.5:5);
  });
  // 줄기
  const tr=pw.tot<=0?0:1.5+8*Math.sqrt(pw.tot/1000);
  stream(c,'t1',[[71,300],[140,300]],tr,dt,170,COL.elec,null,5);stream(c,'t2',[[340,300],[400,300]],tr,dt,170,COL.elec,null,5);
  T(c,'경과 시간: '+fDur(m.sim),450,28,24,'#0f172a');
}

/* ---------- 대시보드(그래프) ---------- */
function drawDash(){
  const c=dc;c.setTransform(ddpr,0,0,ddpr,0,0);c.clearRect(0,0,DW,DH);
  const sx=DW/560,sy=DH/300,s=Math.min(sx,sy);
  c.save();c.translate((DW-560*s)/2,(DH-300*s)/2);c.scale(s,s);
  if(S.mod===1)dash1(c);else if(S.mod===2)dash2(c);else dash3(c);
  c.restore();
}
function pie(c,cx,cy,r,parts,dim){
  let a=-Math.PI/2;c.globalAlpha=dim?.35:1;
  for(const [k,f] of parts){const b=a+f*Math.PI*2;c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r,a,b);c.closePath();c.fillStyle=COL[k];c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
    if(f>=.08){const m=(a+b)/2;T(c,Math.round(f*100)+'%',cx+Math.cos(m)*r*.62,cy+Math.sin(m)*r*.62,18,'#fff');}a=b;}
  c.globalAlpha=1;
}
function dash1(c){
  const A=APPS[S.app];
  T(c,'에너지 전환 비율 (교육용 근사값)',140,18,15,'#0f172a');
  pie(c,140,118,82,A.out,!S.on);
  let y=222;for(const [k,f] of A.out){c.fillStyle=COL[k];c.fillRect(46,y-7,14,14);T(c,NAME[k]+' '+Math.round(f*100)+'%',68,y,15,'#334155','left',700);y+=22;}
  T(c,'소비 전력 비교',420,18,15,'#0f172a');
  APPS.forEach((a,i)=>{
    const yy=44+i*40,w=Math.max(6,a.P/1500*150),sel=i===S.app;
    if(sel){rr(c,288,yy-17,268,34,8);c.fillStyle='#eff6ff';c.fill();}
    T(c,a.short,296,yy,14,'#0f172a','left',sel?900:700);
    rr(c,372,yy-9,w,18,4);c.fillStyle=COL[a.bar];c.fill();
    T(c,a.P+' W',376+w,yy,14,'#0f172a','left',800);
  });
}
function dash2(c){
  T(c,'공급 에너지 100 %의 쓰임새',280,18,15,'#0f172a');
  BUL.forEach((b,i)=>{
    const y=70+i*88,W=500,lf=b.light/b.P;
    T(c,`${b.name} (${b.P} W)`,40,y-30,16,'#0f172a','left',900);
    rr(c,40,y-14,W,36,8);c.fillStyle=COL.heat;c.fill();
    rr(c,40,y-14,W*lf,36,8);c.fillStyle=COL.light;c.fill();
    T(c,'빛 '+Math.round(lf*100)+'%',40+W*lf/2,y+4,17,'#422006');
    T(c,'열 '+Math.round((1-lf)*100)+'%',40+W*lf+(W*(1-lf))/2,y+4,17,'#fff');
  });
  T(c,'에너지 효율 = 빛에너지 ÷ 공급 에너지 × 100',280,238,16,'#334155');
  T(c,'(가) 20 %   <   (나) 80 %     → 같은 밝기에 소비 전력 1/6',280,266,17,'#15803d');
}
function dash3(c){
  const m=S.m3,pw=m3Power(),H=m.hist;
  const wy=pw.sb*8.76,wk=pw.sb*8.76;
  T(c,'지금 대기 전력 '+pw.sb+' W 이대로 1년이면',280,16,16,'#0f172a');
  T(c,`${fn(pw.sb*8.76,1)} kWh · 약 ${fn(pw.sb*8.76*PRICE,0)}원 · CO₂ ${fn(pw.sb*8.76*CO2K/1000,1)} kg`,280,42,22,pw.sb>0?'#b91c1c':'#15803d');
  const L=48,R=548,Tp=72,B=262;
  c.strokeStyle='#0f172a';c.lineWidth=2;c.beginPath();c.moveTo(L,Tp);c.lineTo(L,B);c.lineTo(R,B);c.stroke();
  const tmax=Math.max(10,m.sim),ymax=Math.max(0.001,m.kwh*1.1);
  const X=t=>L+t/tmax*(R-L),Y=v=>B-v/ymax*(B-Tp);
  c.font='700 13px "Pretendard","Malgun Gothic",sans-serif';
  for(let i=0;i<=4;i++){const v=ymax*i/4;c.fillStyle='#334155';c.textAlign='right';c.textBaseline='middle';c.fillText(v<10?v.toFixed(2):fn(v,0),L-4,Y(v));
    c.beginPath();c.moveTo(L,Y(v));c.lineTo(R,Y(v));c.strokeStyle='#e5e7eb';c.lineWidth=1;c.stroke();}
  T(c,'kWh',24,Tp-4,13,'#475569');T(c,'0',L,B+12,13,'#475569');T(c,fDur(tmax),R,B+12,13,'#475569','right');
  const line=(idx,col)=>{c.beginPath();c.moveTo(X(0),Y(0));H.forEach(h=>c.lineTo(X(h[0]),Y(h[idx])));c.lineTo(X(m.sim),Y(idx===1?m.kwh:m.sb));c.strokeStyle=col;c.lineWidth=3;c.stroke();};
  line(1,COL.elec);line(2,'#ef4444');
  c.fillStyle=COL.elec;c.fillRect(70,282,14,6);T(c,'전체 누적',90,285,13,'#334155','left',700);
  c.fillStyle='#ef4444';c.fillRect(190,282,14,6);T(c,'대기 전력으로 낭비된 양',210,285,13,'#334155','left',700);
}

/* ---------- 타일/가이드/컨트롤 ---------- */
function tiles(){
  let t;
  if(S.mod===1){
    const A=APPS[S.app],P=S.on?A.P:0,ts=tSec(),E=P*ts,Wh=E/3600,co=Wh/1000*CO2K;
    const e=fJ(E),w=fWh(Wh),g=fCO(co);
    t=[['소비 전력 P',fn(P,0),'W',COL.elec],['전기 에너지 E = P×t',e[0],e[1],'#7c3aed'],['전력량 W = P×t',w[0],w[1],'#0891b2'],['CO₂ 배출량',g[0],g[1],'#059669']];
  }else if(S.mod===2){
    const ts=tSec(),on=S.on,a=on?60:0,b=on?10:0,d=(a-b)*ts/3600,w=fWh(d),g=fCO(d/1000*CO2K);
    t=[['(가) 백열전구 P',fn(a,0),'W','#ff4d2e'],['(나) LED 전구 P',fn(b,0),'W','#10b981'],['전력량 차이 (가)−(나)',w[0],w[1],'#0891b2'],['줄어드는 CO₂',g[0],g[1],'#059669']];
  }else{
    const m=S.m3,pw=m3Power(),g=fCO(m.kwh*CO2K);
    t=[['실시간 소비 전력',fn(pw.tot,0),'W',COL.elec],['누적 전력량',m.kwh<10?m.kwh.toFixed(3):fn(m.kwh,1),'kWh','#0891b2'],['예상 요금',fn(m.kwh*PRICE,0),'원','#7c3aed'],['CO₂ 발생량',g[0],g[1],'#059669']];
  }
  const box=$('tiles');
  if(box.children.length!==4)box.innerHTML=t.map(()=>'<div class="tile"><div class="l"></div><div class="v"><span></span><small></small></div></div>').join('');
  t.forEach((x,i)=>{const e=box.children[i];e.style.setProperty('--c',x[3]);e.children[0].textContent=x[0];e.children[1].children[0].textContent=x[1];e.children[1].children[1].textContent=x[2];});
}
let guideKey='';
function guide(){
  const key=S.mod+'|'+S.app+'|'+S.on;if(key===guideKey)return;guideKey=key;
  let h='';
  if(S.mod===1){const A=APPS[S.app];
    h=`<b>${A.ic} ${A.name}</b>: 전기 에너지 → <b>${A.main}</b>, 소비 전력 <b>${A.P} W</b> (1초에 ${A.P} J).<br>`+
    `<b class="k">정리</b> 열에너지를 내는 전기 기구(다리미·헤어드라이어 1500 W)의 소비 전력이 가장 크다.`+
    `<details><summary>🤔 생각해 보기: 선풍기를 2시간 켜면 전력량은?</summary>45 W × 2 h = 90 Wh (0.09 kWh). 소비 전력(W)은 1초 동안, 전력량(Wh)은 사용한 시간 동안 쓴 전기 에너지입니다.</details>`+
    `<div class="src">※ 소비 전력은 대표값, 에너지 전환 비율은 교육용 근사값입니다. 1 kWh ≈ 424 g CO₂.</div>`;
  }else if(S.mod===2){
    h=`같은 밝기(800 lm)를 내는데 (가) 백열전구는 <b>60 W</b>, (나) LED 전구는 <b>10 W</b>가 필요합니다.<br>`+
    `<b class="k">정리</b> 에너지 효율 = 빛에너지 ÷ 공급 에너지 × 100. 백열전구 20 %, LED 80 % → 같은 시간 켜면 LED가 전기 에너지를 훨씬 적게 쓰고, 나머지는 열로 낭비되지 않는다.`+
    `<details><summary>🤔 생각해 보기: 왜 백열전구는 만지면 뜨거울까?</summary>공급된 전기 에너지의 80 %(48 W)가 열에너지로 전환되기 때문입니다. LED는 20 %(2 W)만 열이 됩니다.</details>`;
  }else{
    h=`플러그가 꽂혀 있으면 전원이 꺼져 있어도 기기당 1~3 W의 <b>대기 전력</b>을 씁니다.<br>`+
    `<b class="k">정리</b> 쓰지 않는 기기는 <b>플러그를 뽑거나 절전 멀티탭을 꺼서</b> 대기 전력을 0 W로 만들 수 있다.`+
    `<details><summary>🤔 생각해 보기: 시간 가속 버튼으로 1개월을 보내 보세요</summary>작은 대기 전력도 오랜 시간이 쌓이면 전력량·요금·CO₂가 눈에 띄게 늘어납니다.</details>`+
    `<div class="src">※ 요금은 단가 ${PRICE}원/kWh 가정(누진제 미반영), 대기 전력은 기기당 1~3 W 가정입니다.</div>`;
  }
  $('guide').innerHTML=h;
}

/* 컨트롤 구성 */
function build(){
  $('cards').innerHTML=APPS.map((a,i)=>`<button class="card" data-i="${i}"><span class="ic">${a.ic}</span><span>${a.short}<small>${a.P} W · ${a.main.split(' + ')[0]}</small></span></button>`).join('');
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{S.app=+b.dataset.i;S.charge=0;S.temp=25;outs.length=0;for(const k in streams)delete streams[k];sync();});
  $('dcards').innerHTML=DEVS.map((d,i)=>`<div class="dc"><div>${d.ic} ${d.name}<br><small style="color:#64748b">${d.on} W · 대기 ${d.sb} W</small></div><div class="btns"><button data-d="${i}" data-a="on">⏻ 전원</button><button data-d="${i}" data-a="plug">🔌 플러그</button></div></div>`).join('');
  document.querySelectorAll('.dc button').forEach(b=>b.onclick=()=>{const d=S.m3.dev[+b.dataset.d];if(b.dataset.a==='on')d.on=!d.on;else d.plug=!d.plug;sync();});
}
function sync(){
  document.querySelectorAll('.mt').forEach(b=>b.setAttribute('aria-selected',+b.dataset.m===S.mod));
  $('b1').classList.toggle('on',S.mod===1);$('b12').classList.toggle('on',S.mod<3);$('b3').classList.toggle('on',S.mod===3);
  document.querySelectorAll('.card').forEach(b=>b.classList.toggle('sel',+b.dataset.i===S.app));
  $('pw').textContent=S.on?'⏻ 전원 ON':'⏻ 전원 OFF';$('pw').classList.toggle('on',S.on);
  $('tv').value=S.tVal;$('tvVal').textContent=S.tVal;
  document.querySelectorAll('.un').forEach(b=>b.classList.toggle('sel',b.dataset.u===S.tUnit));
  const m=S.m3;
  document.querySelectorAll('.dc button').forEach(b=>{const d=m.dev[+b.dataset.d];
    if(b.dataset.a==='on'){b.classList.toggle('on',d.on);b.textContent=d.on?'⏻ 켜짐':'⏻ 꺼짐';}
    else{b.classList.toggle('warn',!d.plug);b.textContent=d.plug?'🔌 꽂힘':'🔌 뽑음';}});
  $('tap').className='big tap '+(m.tap?'on':'off');$('tap').textContent=m.tap?'🔌 절전 멀티탭 ON':'🔌 절전 멀티탭 OFF (차단)';
  document.querySelectorAll('.sp[data-s]').forEach(b=>b.classList.toggle('sel',+b.dataset.s===m.speed));
  guideKey='';
}
document.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{S.mod=+b.dataset.m;S.on=false;S.anim=0;outs.length=0;for(const k in streams)delete streams[k];$('tiles').innerHTML='';sync();});
$('pw').onclick=()=>{S.on=!S.on;if(S.on&&S.charge>=1)S.charge=0;sync();};
$('tv').oninput=e=>{S.tVal=+e.target.value;sync();};
document.querySelectorAll('.un').forEach(b=>b.onclick=()=>{S.tUnit=b.dataset.u;sync();});
$('tap').onclick=()=>{S.m3.tap=!S.m3.tap;sync();};
document.querySelectorAll('.sp[data-s]').forEach(b=>b.onclick=()=>{S.m3.speed=+b.dataset.s;sync();});
$('m3r').onclick=()=>{const sp=S.m3.speed,tap=S.m3.tap;m3reset();S.m3.speed=sp;S.m3.tap=tap;sync();};


/* ---------- QR 코드 ---------- */
const QR_KEY='labQrBase';
const QR_TITLE='전기 에너지의 전환과 소비 전력';
let qrBase='';
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function normUrl(s){try{const u=new URL(s.trim());return /^https?:$/.test(u.protocol)?u.href:'';}catch(e){return '';}}
function drawQR(){
  const raw=$('qrUrl').value.trim(),cvq=$('qrCv'),c=cvq.getContext('2d'),msg=$('qrMsg');
  msg.textContent='';
  const url=raw?normUrl(raw):'';
  if(!url){
    cvq.width=cvq.height=400;c.fillStyle='#fff';c.fillRect(0,0,400,400);
    c.fillStyle='#64748b';c.font='700 22px sans-serif';c.textAlign='center';c.fillText('주소를 입력하세요',200,205);
    $('qrCap').textContent='';
    if(raw)msg.textContent='http:// 또는 https:// 로 시작하는 주소를 입력하세요.';
    return;
  }
  try{
    qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
    const qr=qrcode(0,'M');qr.addData(url,'Byte');qr.make();
    const n=qr.getModuleCount(),q=4,cell=Math.max(4,Math.floor(640/(n+q*2))),size=cell*(n+q*2);
    cvq.width=cvq.height=size;c.fillStyle='#fff';c.fillRect(0,0,size,size);c.fillStyle='#000';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect((k+q)*cell,(r+q)*cell,cell,cell);
    let cap=url;try{cap=decodeURI(url);}catch(e){}
    $('qrCap').textContent=cap;qrBase=url;lsSet(QR_KEY,url);
  }catch(e){msg.textContent='주소가 너무 길어 QR을 만들 수 없습니다.';}
}
function thisUrl(){
  if(/^https?:$/.test(location.protocol))return location.href.split('#')[0].split('?')[0];
  return lsGet(QR_KEY);
}
function showQR(url,title){
  $('qrUrl').value=url||'';$('qrTitle').textContent=title;$('ovQR').classList.add('on');drawQR();
  if(!url)$('qrMsg').textContent='GitHub Pages 주소를 붙여 넣으면 QR이 만들어집니다.';
}
function openQRFor(rel,title){
  let u='';const b=thisUrl();
  try{if(b)u=new URL(rel,b).href;}catch(e){}
  showQR(u,title);
}
$('btnQR').addEventListener('click',()=>showQR(thisUrl(),QR_TITLE));
$('closeQR').addEventListener('click',()=>$('ovQR').classList.remove('on'));
$('ovQR').addEventListener('click',e=>{if(e.target===$('ovQR'))$('ovQR').classList.remove('on');});
$('qrUrl').addEventListener('input',drawQR);
$('qrThis').addEventListener('click',()=>showQR(thisUrl()||qrBase,QR_TITLE));
$('qrDrawer').addEventListener('click',()=>{
  const b=$('qrUrl').value.trim()||thisUrl();
  try{showQR(new URL('./자바실험실_서랍.html',b).href,'자바실험실 가상실험 서랍');}
  catch(e){$('qrMsg').textContent='먼저 이 페이지의 주소를 입력하세요.';}
});
$('qrPng').addEventListener('click',()=>{
  const a=document.createElement('a');a.download='QR_자바실험실.png';a.href=$('qrCv').toDataURL('image/png');
  document.body.appendChild(a);a.click();a.remove();
});
$('qrPrint').addEventListener('click',()=>window.print());


/* ---------- 메인 루프 ---------- */
build();sync();sresize();dresize();
let last=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;S.t+=dt;
  S.anim+=((S.on?1:0)-S.anim)*Math.min(1,dt*3);
  S.ang+=S.anim*(S.mod===1&&S.app===4?4:14)*dt;
  const A=APPS[S.app];
  if(S.mod===1&&A.id==='iron')S.temp+=((S.on?200:25)-S.temp)*Math.min(1,dt*(S.on?.5:.25));
  sc.setTransform(sdpr,0,0,sdpr,0,0);sc.clearRect(0,0,stg.width,stg.height);
  sc.setTransform(sdpr*ss,0,0,sdpr*ss,sdpr*sox,sdpr*soy);
  sc.save();sc.beginPath();sc.rect(0,0,LW,LH);sc.clip();
  if(S.mod===1)draw1(sc,dt);else if(S.mod===2)draw2(sc,dt);else draw3(sc,dt);
  sc.restore();
  drawDash();
  if((uiT+=dt)>0.12){uiT=0;tiles();guide();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
