<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동기유발 서랍 · 수업 시작 3분 도입 패키지</title>
<style>
:root {
  --primary-blue: #2563eb;
  --primary-indigo: #4338ca;
  --accent-amber: #d97706;
  --accent-green: #059669;
  --accent-purple: #7c3aed;
  --ink: #0f172a;
  --ink-light: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --bg: #f8fafc;
  --card: #ffffff;
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.05);
  --shadow-lg: 0 10px 25px -3px rgba(15,23,42,0.09), 0 4px 8px -4px rgba(15,23,42,0.04);
  --m-myth:#ef4444; --m-bal:#d97706; --m-csi:#059669; --m-zoom:#0891b2; --m-wif:#7c3aed;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { text-decoration: none; color: inherit; }

/* ===== 1. 헤더 (다른 서랍과 동일) ===== */
.header { background: #ffffff; border-bottom: 1.5px solid var(--line); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(15,23,42,0.04); }
.header-inner { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand-group { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #f59e0b, #7c3aed); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.28); }
.brand-title h1 { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: -0.4px; color: #0f172a; display: flex; align-items: center; gap: 8px; }
.brand-sub { margin: 2px 0 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.badge-cognitive { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
.header-utils { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-guide-modal { background: #f1f5f9; border: 1px solid var(--line-strong); color: var(--ink-light); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
.btn-guide-modal:hover { background: #e2e8f0; color: var(--ink); }

/* ===== 2. 1차 네비게이션 ===== */
.primary-nav-bar { background: #f8fafc; border-bottom: 1px solid var(--line); }
.primary-nav-inner { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; gap: 6px; overflow-x: auto; }
.primary-nav-btn { padding: 12px 18px; font-size: 14.5px; font-weight: 800; color: #475569; background: transparent; border: none; display: flex; align-items: center; gap: 7px; position: relative; transition: all 0.15s; white-space: nowrap; }
.primary-nav-btn:hover { color: var(--primary-blue); }
.primary-nav-btn.active { color: var(--primary-blue); background: #ffffff; }
.primary-nav-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--primary-blue); }
.nav-counter { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: #e2e8f0; color: #475569; }
.primary-nav-btn.active .nav-counter { background: #dbeafe; color: #1e40af; }

/* ===== 3. 메인 · 2차 네비게이션 · 검색 ===== */
.container { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px; }
.flow-selector-card { background: #ffffff; border: 1.5px solid var(--line); border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
.flow-title { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.stage-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.stage-chip { background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 999px; padding: 7px 15px; font-size: 13.5px; font-weight: 800; color: #334155; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: all 0.15s; }
.stage-chip:hover { background: #e2e8f0; border-color: #cbd5e1; }
.stage-chip.active { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.stage-chip.m-myth.active { background: #ef4444; border-color: #dc2626; }
.stage-chip.m-bal.active { background: #d97706; border-color: #b45309; }
.stage-chip.m-csi.active { background: #059669; border-color: #047857; }
.stage-chip.m-zoom.active { background: #0891b2; border-color: #0e7490; }
.stage-chip.m-wif.active { background: #7c3aed; border-color: #6d28d9; }
.filter-search-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.search-wrapper { flex: 1; min-width: 280px; background: #ffffff; border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); padding: 0 14px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm); transition: all 0.15s; }
.search-wrapper:focus-within { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
.search-input { border: none; outline: none; background: transparent; width: 100%; padding: 10px 0; font-size: 14.5px; -webkit-user-select: text; user-select: text; }
.unit-chips-container { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.unit-chip { background: #ffffff; border: 1px solid var(--line-strong); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink-light); transition: all 0.15s; }
.unit-chip:hover { border-color: var(--primary-blue); color: var(--primary-blue); }
.unit-chip.active { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; font-weight: 800; }
.results-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; gap: 10px; flex-wrap: wrap; }
.results-info h3 { margin: 0; font-size: 15px; font-weight: 800; color: #334155; }

/* ===== 4. 카드 ===== */
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
@media (max-width: 680px) { .lesson-grid { grid-template-columns: 1fr; } }
.lesson-card { background: #ffffff; border: 1.5px solid var(--line); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
.lesson-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: #cbd5e1; }
.card-top { display: flex; gap: 14px; margin-bottom: 12px; }
.visual-anchor { width: 52px; height: 52px; border-radius: 14px; background: #f8fafc; border: 1.5px solid #e2e8f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 26px; }
.title-area { flex: 1; }
.meta-badges { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.badge-grade { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: #0f172a; color: #ffffff; }
.badge-unit { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 4px; background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
.lesson-card-title { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: -0.4px; color: #0f172a; line-height: 1.35; }
.btn-star { background: transparent; border: none; font-size: 20px; color: #cbd5e1; padding: 2px; line-height: 1; transition: transform 0.15s, color 0.15s; align-self: flex-start; }
.btn-star:hover { transform: scale(1.2); }
.btn-star.active { color: #f59f00; }
.concept-lead { font-size: 13.5px; color: #334155; line-height: 1.55; margin: 0 0 14px; background: #fffbeb; border-left: 3px solid #f59e0b; padding: 8px 12px; border-radius: 0 8px 8px 0; }
.card-tools-matrix { border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.matrix-label { font-size: 11px; font-weight: 800; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.action-btn-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.btn-action { padding: 8px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 5px; text-align: center; transition: all 0.15s; border: 1.5px solid transparent; line-height: 1.25; }
.btn-m-myth { background: #fef2f2; border-color: #fecaca; color: #b91c1c; } .btn-m-myth:hover, .btn-m-myth.rec { background: #ef4444; color: #fff; border-color: #ef4444; }
.btn-m-bal { background: #fffbeb; border-color: #fde68a; color: #b45309; } .btn-m-bal:hover, .btn-m-bal.rec { background: #d97706; color: #fff; border-color: #d97706; }
.btn-m-csi { background: #ecfdf5; border-color: #a7f3d0; color: #047857; } .btn-m-csi:hover, .btn-m-csi.rec { background: #059669; color: #fff; border-color: #059669; }
.btn-m-zoom { background: #ecfeff; border-color: #a5f3fc; color: #0e7490; } .btn-m-zoom:hover, .btn-m-zoom.rec { background: #0891b2; color: #fff; border-color: #0891b2; }
.btn-m-whatif { background: #faf5ff; border-color: #e9d5ff; color: #7e22ce; } .btn-m-whatif:hover, .btn-m-whatif.rec { background: #7c3aed; color: #fff; border-color: #7c3aed; }
.btn-sim { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; } .btn-sim:hover { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 2px 6px rgba(37,99,235,0.3); }
.btn-game { background: #faf5ff; border-color: #e9d5ff; color: #7e22ce; } .btn-game:hover { background: #7c3aed; color: #fff; border-color: #7c3aed; }
.btn-snake { background: #ecfdf5; border-color: #a7f3d0; color: #047857; } .btn-snake:hover { background: #10b981; color: #fff; border-color: #10b981; }
.btn-shoot { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; } .btn-shoot:hover { background: #4f46e5; color: #fff; border-color: #4f46e5; }
.btn-start { margin-top: 4px; padding: 11px 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; font-size: 14.5px; font-weight: 900; box-shadow: 0 3px 10px rgba(234,88,12,0.28); transition: transform .12s; }
.btn-start:hover { transform: translateY(-1px); } .btn-start:active { transform: scale(.98); }
.empty-state { background: #ffffff; border: 2px dashed #cbd5e1; border-radius: var(--radius-lg); padding: 50px 20px; text-align: center; color: var(--muted); margin-top: 20px; }

/* ===== 5. 진행 화면 (전자칠판용 큰 글씨 · 같은 색 체계) ===== */
#studio { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
#studio.on { display: flex; }
.sbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #fff; border-bottom: 1.5px solid var(--line); flex-wrap: wrap; box-shadow: 0 2px 10px rgba(15,23,42,0.04); }
.sbar .crumb { flex: 1; min-width: 220px; font-size: clamp(16px, 1.15vw, 26px); font-weight: 800; color: var(--muted); line-height: 1.3; }
.sbar .crumb b { color: var(--ink); }
.tb { min-height: 48px; padding: 0 16px; border-radius: 10px; background: #f1f5f9; border: 1px solid var(--line-strong); color: var(--ink-light); font-weight: 800; font-size: clamp(15px, 1.05vw, 24px); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: all .15s; }
.tb:hover { background: #e2e8f0; color: var(--ink); } .tb:active { transform: scale(.97); } .tb.on { background: #dcfce7; border-color: #86efac; color: #166534; }
.timer { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 0 14px; min-height: 48px; font-variant-numeric: tabular-nums; }
.timer b { font-size: clamp(26px, 2vw, 46px); font-weight: 900; } .timer.low b { color: #dc2626; } .timer.end { border-color: #ef4444; animation: bl .8s infinite; } @keyframes bl { 50% { background: #fee2e2; } }
.mtabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px 16px 4px; }
.mt { min-height: 66px; border-radius: 14px; background: #fff; border: 2px solid var(--line); padding: 4px 8px; text-align: center; line-height: 1.25; box-shadow: var(--shadow-sm); transition: all .15s; }
.mt b { display: block; font-size: clamp(17px, 1.25vw, 28px); font-weight: 900; } .mt small { display: block; font-size: clamp(13px, .85vw, 20px); color: var(--muted); font-weight: 700; } .mt.on { background: #fffbeb; }
.stage { flex: 1; min-height: 0; overflow: auto; padding: 8px 18px 12px; display: flex; flex-direction: column; gap: 12px; }
.sbadge { align-self: flex-start; padding: 6px 16px; border-radius: 999px; font-size: clamp(16px, 1.1vw, 26px); font-weight: 900; color: #fff; }
.hero { font-size: clamp(26px, 3vw, 54px); font-weight: 900; line-height: 1.35; word-break: keep-all; color: var(--ink); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ch { background: #fff; border: 3px solid var(--line-strong); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 190px; text-align: left; box-shadow: var(--shadow-sm); transition: transform .12s; } .ch:active { transform: scale(.99); }
.ch .tag { align-self: flex-start; padding: 4px 16px; border-radius: 999px; font-weight: 900; font-size: clamp(15px, 1.05vw, 24px); color: #fff; }
.ch .tx { font-size: clamp(21px, 2.1vw, 36px); font-weight: 800; line-height: 1.4; word-break: keep-all; color: var(--ink); }
.ch .vote { margin-top: auto; } .bar { height: 18px; background: #e2e8f0; border-radius: 9px; overflow: hidden; } .bar i { display: block; height: 100%; width: 0%; transition: width .35s; }
.vs { display: flex; justify-content: space-between; font-size: clamp(15px, 1.05vw, 24px); font-weight: 800; color: var(--muted); margin-top: 4px; } .vs b { color: var(--ink); font-size: 1.15em; }
.ch.right { border-color: #22c55e; background: #f0fdf4; } .ch.wrong { border-color: #ef4444; background: #fef2f2; }
.pick { font-size: clamp(16px, 1.05vw, 24px); font-weight: 800; color: #b45309; min-height: 1.4em; }
.dossier { background: #ecfdf5; border: 2.5px dashed #10b981; border-radius: 18px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.dh { display: flex; justify-content: space-between; color: #047857; font-weight: 900; font-size: clamp(14px, 1vw, 22px); flex-wrap: wrap; gap: 6px; }
.ev { background: #fff; border: 1.5px solid #a7f3d0; border-radius: 12px; padding: 12px 16px; font-size: clamp(19px, 1.9vw, 32px); font-weight: 700; line-height: 1.5; min-height: 58px; transition: all .3s; color: var(--ink); } .ev.hid { opacity: .3; filter: blur(7px); }
.zbox { background: #0b1220; border: 3px solid #155e75; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; overflow: hidden; }
.zbox svg { width: min(560px, 100%); height: 250px; transition: transform .5s cubic-bezier(.16,1,.3,1); background: radial-gradient(circle, #0b2a3a, #050810); }
.ztag { font-size: clamp(17px, 1.2vw, 28px); font-weight: 900; color: #67e8f9; } .zhint { min-height: 2.8em; font-size: clamp(19px, 1.9vw, 32px); font-weight: 800; color: #fde68a; text-align: center; line-height: 1.45; }
.wbox { background: #f5f3ff; border: 2.5px solid #a78bfa; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.wbox .wl { font-weight: 900; color: #6d28d9; font-size: clamp(15px, 1.1vw, 24px); }
.addr { display: flex; gap: 8px; } .addr input { flex: 1; min-height: 54px; border-radius: 12px; border: 2px solid #c4b5fd; background: #fff; color: var(--ink); font-size: clamp(18px, 1.2vw, 26px); padding: 0 14px; font-weight: 700; -webkit-user-select: text; user-select: text; }
.cloud { display: flex; flex-wrap: wrap; gap: 8px; min-height: 76px; } .chip { padding: 8px 16px; border-radius: 999px; background: #ede9fe; border: 2px solid #8b5cf6; color: #4c1d95; font-size: clamp(17px, 1.7vw, 30px); font-weight: 800; cursor: pointer; }
.res { display: none; background: #eef2ff; border: 2.5px solid #818cf8; border-radius: 20px; padding: 14px 18px; flex-direction: column; gap: 8px; } .res.on { display: flex; }
.res h4 { font-size: clamp(18px, 1.25vw, 28px); color: #4338ca; font-weight: 900; margin: 0; } .res .fa { font-size: clamp(19px, 1.9vw, 32px); font-weight: 700; line-height: 1.55; color: var(--ink); } .res .br { font-size: clamp(18px, 1.7vw, 30px); font-weight: 800; color: #b45309; border-top: 2px dashed #a5b4fc; padding-top: 8px; line-height: 1.5; }
.lk { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .lk .lab { font-weight: 900; color: var(--muted); font-size: clamp(14px, 1vw, 22px); }
.lk .btn-action { min-height: 44px; font-size: clamp(14px, 1vw, 22px); padding: 0 14px; }
.sact { display: flex; gap: 10px; padding: 8px 16px 12px; border-top: 1.5px solid var(--line); background: #fff; flex-wrap: wrap; align-items: stretch; }
.bigb { min-height: 62px; padding: 0 22px; border-radius: 14px; border: none; font-weight: 900; font-size: clamp(20px, 1.5vw, 32px); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 10px rgba(15,23,42,0.15); }
.bigb.rv { background: linear-gradient(135deg, #7c3aed, #4f46e5); flex: 1.4; } .bigb.nx { background: linear-gradient(135deg, #0ea5e9, #0369a1); flex: 1; } .bigb.gy { background: #e2e8f0; color: #334155; box-shadow: none; } .bigb.sm { flex: .5; }
.sp { flex: 1; }
/* ===== 모달 · 토스트 ===== */
.ov { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 300; padding: 14px; } .ov.on { display: flex; }
.pop { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; width: 100%; max-width: 520px; padding: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-lg); }
.pop h2 { margin: 0; font-size: 20px; color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
.x { min-width: 44px; min-height: 44px; border-radius: 10px; background: #f1f5f9; border: 1px solid var(--line-strong); font-size: 18px; font-weight: 900; color: var(--ink-light); }
.qn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
#qrUrl { width: 100%; min-height: 46px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--ink); font: inherit; font-size: 14px; padding: 0 12px; -webkit-user-select: text; user-select: text; }
#qrCv { background: #fff; padding: 12px; border-radius: 12px; border: 1px solid var(--line); width: min(70vw, 340px); height: auto; image-rendering: pixelated; align-self: center; } #qrMsg { color: #dc2626; font-size: 13px; font-weight: 700; min-height: 1.3em; } #qrCap { font-size: 12px; color: var(--muted); word-break: break-all; text-align: center; }
#toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -140%); z-index: 400; background: #0f172a; color: #fff; border-radius: 12px; padding: 10px 22px; font-size: 15px; font-weight: 800; transition: transform .3s; pointer-events: none; max-width: 92%; text-align: center; box-shadow: var(--shadow-lg); } #toast.on { transform: translate(-50%, 0); }
@media (max-width: 900px) { .choices { grid-template-columns: 1fr; } .mtabs { grid-template-columns: repeat(5, minmax(120px, 1fr)); overflow-x: auto; } .mt small { display: none; } }

/* ===== 간소화: 한 줄 필터 바 + 접이식 목록 (주의집중 부담 최소화) ===== */
.header-inner{padding:8px 16px;gap:10px}
.brand-icon{width:36px;height:36px;font-size:18px;border-radius:10px}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

을 만들어내는 원리를 밝혀냅니다."}, "bal": {"q": "우주 탐사 대원 선발! 둘 중 하나의 극한 임무를 수행해야 한다면?", "a": "표면 온도가 460℃에 기압이 90기압이고 황산 비가 쏟아지는 지옥의 '금성' 착륙", "b": "표면 온도가 영하 220℃에 대기가 얼어붙어 있는 태양계 최외곽 '명왕성' 착륙", "fact": "금성은 이산화탄소 대기로 인한 극단적 온실효과를 겪는 지구형 행성이고, 명왕성은 얼어붙은 왜소행성입니다.", "bridge": "태양계 행성들의 물리적 특징과 지구형 vs 목성형 행성 분류 기준을 배웁니다."}, "csi": {"q": "에라토스테네스의 미스터리: 2,200년 전 막대기 그림자 하나로 지구 크기를 어떻게 쟀을까?", "evidences": ["단서 1: 하짓날 정오에 시에네에서는 우물 바닥까지 그림자 없이 햇빛이 비침.", "단서 2: 같은 날 알렉산드리아의 막대기에는 7.2도의 그림자 각도가 생김.", "단서 3: 두 도시 사이의 거리(925km)와 호의 중심각 비례식(360도 : 2πR = 7.2도 : 925km) 적용!"], "fact": "햇빛이 평행하게 들어온다는 원리와 엇각 성질을 이용해 지구 둘레 약 46,250km를 계산해 냈습니다.", "bridge": "에라토스테네스의 지구 크기 측정 가상실험실로 직접 막대기 각도를 조절해 봅니다."}, "zoom": {"q": "20초 줌인 관찰: 달 표면의 운석 구덩이(크레이터) 바닥을 10,000배 확대하면?", "shapeDesc": "풍화와 침식이 없어 수십억 년 전 충돌했을 때의 유리질 파편과 미세한 월면토(레골리스)가 그대로 보존된 모습", "fact": "달은 대기와 물이 없기 때문에 비바람에 의한 풍화가 일어나지 않아 크레이터가 영구히 보존됩니다.", "bridge": "지구와 달의 환경 차이 및 달의 위상 변화를 탐구합니다."}, "whatif": {"q": "만약 지구의 자전축이 23.5도 기울어지지 않고 똑바로 수직(0도)으로 서 있다면?", "defaultChips": ["사계절 영구 소멸", "매일 낮밤 12시간 고정", "남중 고도 변화 없음", "열대/한대 기후 고착"], "fact": "사계절이 완전히 사라져 일 년 내내 똑같은 기온이 유지되며, 농작물 재배 환경이 완전히 뒤바뀝니다.", "bridge": "지구 공전과 자전축 기울기가 빚어내는 계절의 신비를 배웁니다."}}]}, {"grade": "중2", "unit": "물질의 특성", "icon": "⚗️", "sets": [{"title": "밀도, 끓는점, 용해도와 혼합물의 분리", "myth": {"q": "물 100g이 든 컵에 설탕이나 소금을 넣으면 저어주기만 하면 무한정 끝없이 녹아 들어갈까?", "a": "그렇다! 열심히 젓거나 기다리면 아무리 많이 넣어도 다 녹는다.", "b": "아니다! 특정 온도에서 물 100g에 녹을 수 있는 양에는 한계(용해도)가 정해져 있다.", "wrongChoice": "A", "fact": "정답은 B! 어떤 온도에서 물 100g에 최대로 녹을 수 있는 용질의 g수를 '용해도'라고 하며, 한계에 도달한 포화 상태 이후에는 아무리 저어도 바닥에 그대로 가라앉습니다.", "bridge": "온도에 따라 달라지는 용해도 곡선과 냉각 시 결정이 석출되는 양을 계산해 봅니다."}, "bal": {"q": "무인도 조난 식수 확보 딜레마! 단 하나의 장비만 선택할 수 있다면?", "a": "끓는점 차이를 이용해 바닷물을 가열해 수증기를 모아 민물을 얻는 '증류 장치'", "b": "밀도 차이를 이용해 기름과 흙탕물을 층별로 분리해 내는 '분별 깔때기 장치'", "fact": "증류는 소금물에서 순수한 물만 기화시켜 냉각하므로 바닷물을 식수로 바꿀 수 있는 유일한 방법입니다.", "bridge": "자바실험실 '증류 가상실험실'로 에탄올과 물 혼합물의 분리를 직접 시뮬레이션합니다."}, "csi": {"q": "가짜 금괴 사기 사건: 겉보기엔 똑같이 노란색인데, 자르거나 녹이지 않고 순금인지 어떻게 밝힐까?", "evidences": ["단서 1: 부피를 재기 위해 눈금실린더의 물에 담가 넘쳐난 물의 부피를 측정함.", "단서 2: 전자저울로 측정한 질량을 부피로 나누어 '밀도(g/cm³)'를 계산함.", "단서 3: 순금의 밀도는 19.3g/cm³인데, 측정된 밀도는 8.9g/cm³(구리합금 도금)로 가짜 판정!"], "fact": "물질의 고유한 특성인 '밀도(질량÷부피)'를 이용한 아르키메데스의 왕관 감정 기법입니다.", "bridge": "밀도 차이에 의한 혼합물의 분리와 사해 바다에 사람이 뜨는 원리를 탐구합니다."}, "zoom": {"q": "20초 줌인 관찰: 뜨거운 포화 질산 칼륨 용액을 서서히 식힐 때 비커 바닥을 확대하면?", "shapeDesc": "눈에 안 보이게 녹아있던 이온들이 온도가 내려가자 뾰족하고 투명한 바늘 모양 결정으로 쏟아져 나오는 순간", "fact": "온도가 낮아져 용해도가 감소하면 녹아있지 못하는 양만큼 순수한 결정으로 빠져나오는 '재결정'입니다.", "bridge": "용해도 곡선 그래프를 해석하여 석출되는 결정의 질량을 공식으로 계산합니다."}, "whatif": {"q": "만약 물과 기름이 밀도 차이에도 불구하고 완벽하게 한 덩어리로 섞여 버린다면?", "defaultChips": ["세포막(인지질) 붕괴", "바다 유류 유출 정화 불가", "마요네즈 에멀션 소멸", "생체 대사 혼란"], "fact": "극성 물질인 물과 무극성 물질인 기름이 섞이지 않고 층을 이루는 특성 덕분에 세포막이 존재할 수 있습니다.", "bridge": "밀도, 끓는점, 녹는점 등 물질마다 고유한 4대 특성을 총정리합니다."}}, {"title": "순물질과 혼합물, 녹는점과 끓는점", "myth": {"q": "물과 소금물을 같은 불로 끓일 때, 끓는 동안 온도는 둘 다 일정하게 유지될까?", "a": "그렇다! 순물질이든 혼합물이든 끓는 동안에는 모두 온도가 일정하다.", "b": "아니다! 순물질(물)은 끓는 동안 온도가 일정하지만 혼합물(소금물)은 끓는 동안에도 온도가 조금씩 올라간다.", "wrongChoice": "A", "fact": "정답은 B! 순물질은 끓는점이 일정해서 끓는 동안 온도가 변하지 않아요. 혼합물은 끓는 동안 성분 비율이 변해 온도가 계속 조금씩 올라가요.", "bridge": "물과 소금물의 가열·냉각 곡선을 비교하고 순물질과 혼합물 카드를 분류해 봅니다."}, "bal": {"q": "라면 물이 끓기 시작했어요! 더 빨리 익히려면?", "a": "불을 최대로 올려 물 온도를 더 높인다.", "b": "불을 줄여도 끓는 물의 온도는 같으니 약한 불로 유지한다.", "fact": "대기압이 같으면 끓는 동안 물의 온도는 약 100℃로 일정해요. 불을 세게 해도 더 빨리 증발할 뿐 온도는 올라가지 않아요.", "bridge": "끓는점이 일정한 까닭과 압력이 끓는점에 미치는 영향을 가열 곡선으로 확인합니다."}, "csi": {"q": "이름표가 사라진 흰색 물질 두 개(A, B)를 가열해 보니 온도 변화가 달랐다! 어느 것이 순물질일까?", "evidences": ["단서 1: A는 녹는 동안 온도가 일정한 구간이 나타났음.", "단서 2: B는 녹는 동안에도 온도가 계속 천천히 올라갔음.", "단서 3: 순물질은 녹는점이 일정하고, 혼합물은 녹는 온도 범위가 나타남."], "fact": "A가 순물질! 순물질은 상태가 변하는 동안 온도가 일정한 구간이 있고, 혼합물은 그렇지 않아요.", "bridge": "로르산·팔미트산의 녹는점과 가열 곡선을 직접 측정해 봅니다."}, "zoom": {"q": "20초 줌인 관찰: 고체가 녹는 동안(가열 곡선이 평평한 구간) 입자를 확대하면?", "shapeDesc": "가해 준 열이 온도를 높이는 데 쓰이지 않고, 고체 입자들의 규칙적인 배열을 무너뜨려 입자 사이가 멀어지는 데 쓰이는 모습", "fact": "상태가 변하는 동안에는 열이 입자 배열을 바꾸는 데 쓰여서 온도가 일정해요. 그래서 가열 곡선 트폰은 거의 플라스틱과 유리로만 만들어진다.", "b": "아니다! 구리·금·은·리튬·코발트 등 지권의 광물 자원에서 얻은 여러 금속이 들어 있다.", "wrongChoice": "A", "fact": "정답은 B! 스마트폰 한 대에는 수십 종류의 원소가 들어 있고, 배터리·회로·카메라 등에 지권의 광물에서 얻은 금속이 쓰여요.", "bridge": "스마트폰을 분해해 부품 속 광물 자원을 찾아봅니다."}, "bal": {"q": "자원 위기! 하나를 먼저 해야 한다면?", "a": "새로운 광산을 개발해 광물을 더 캔다(자연 훼손 우려).", "b": "버려진 전자제품에서 금속을 다시 얻는 도시광산을 키운다.", "fact": "광물 자원은 한정되어 있어요. 폐전자제품에서 금속을 되찾는 재활용은 새 채굴을 줄이고 환경 부담도 줄여 줘요.", "bridge": "가채연수 시계와 도시광산으로 자원의 한계를 확인합니다."}, "csi": {"q": "쓰레기 속 보물 사건! 폐휴대폰 더미에서 금속을 모으는 회사가 있다. 광산을 파는 것보다 이익이 날 수 있을까?", "evidences": ["단서 1: 휴대폰 회로 기판에는 금, 은, 구리 같은 금속이 쓰임.", "단서 2: 폐휴대폰 1톤에 들어 있는 금의 양이 일반 금광석 1톤보다 훨씬 많다고 알려져 있음.", "단서 3: 폐기물에서 금속을 되찾으면 채굴과 제련에 드는 에너지와 환경 훼손을 줄일 수 있음."], "fact": "도시광산! 쓰레기 속에도 값진 금속이 있어서 재활용하면 자원도 아끼고 환경도 지킬 수 있어요.", "bridge": "우리 주변 폐기물 속에 어떤 광물 자원이 있는지 찾아봅니다."}, "zoom": {"q": "20초 줌인 관찰: 스마트폰 회로 기판을 아주 크게 확대하면?", "shapeDesc": "금으로 도금된 단자, 구리로 된 가는 배선, 주석 합금 땜납이 촘촘하게 얽혀 있는 모습", "fact": "작은 기판에도 금·구리·주석 같은 금속이 정교하게 쓰여요. 이 금속들은 모두 광석에서 얻은 지권의 자원이에요.", "bridge": "국가지질공원 지도를 보며 우리나라의 암석과 지질 명소를 둘러봅니다."}, "whatif": {"q": "만약 오늘부터 새로운 광물 채굴이 완전히 중단된다면?", "defaultChips": ["전자제품 가격이 크게 오름", "재활용(도시광산) 산업이 커짐", "새 제품 생산이 줄어듦", "대체 소재 개발이 활발해짐"], "fact": "광물 자원은 한번 쓰면 다시 만들어지는 데 오랜 시간이 걸려요. 그래서 재활용, 대체 자원 개발, 절약이 중요해요.", "bridge": "자원을 아껴 쓰는 지속가능한 방법을 생각해 봅니다."}, "tools": [{"nm": "지권의 자원과 지질 명소 가상실험실", "file": "지권의_자원과_지질명소_가상실험실.html", "kind": "sim"}]}]}, {"grade": "중2", "unit": "빛과 파동", "icon": "🌈", "sets": [{"title": "빛의 합성, 거울과 렌즈, 파동", "myth": {"q": "그림 물감 빨강, 초록, 파랑을 다 섞으면 검은색이 되는데, 빛의 빨강, 초록, 파랑을 다 섞으면?", "a": "빛도 똑같이 짙은 갈색이나 어두운 암적색이 된다.", "b": "빛은 합칠수록 밝아져 눈부신 백색광(흰색)이 된다.", "wrongChoice": "A", "fact": "정답은 B! 물감은 빛을 흡수하므로 섞을수록 어두워지지만(감산혼합), 빛은 눈의 시세포를 함께 자극하므로 에너지가 더해져 백색광이 됩니다(가산혼합)!", "bridge": "무대 조명과 스마트폰 화면이 총천연색을 구현하는 빛의 3원색 합성을 실험합니다."}, "bal": {"q": "초능력 안경 선택! 평생 착용해야 한다면?", "a": "모든 세상이 상하좌우 뒤집혀 보이는 볼록렌즈 안경", "b": "모든 사람과 사물이 실제 크기보다 10배 축소되어 넓게만 보이는 오목렌즈 안경", "fact": "볼록렌즈는 거리에 따라 뒤집힌 실상을 만들고, 오목렌즈는 언제나 축소된 정립 허상을 만듭니다.", "bridge": "빛의 굴절과 볼록렌즈/오목렌즈의 상 작도법을 광선 추적 시뮬레이터로 배웁니다."}, "csi": {"q": "물속에 비친 물고기를 작살로 잡으려 할 때 왜 물고기 바로 위를 겨냥하면 빗나갈까?", "evidences": ["단서 1: 물고기에서 나온 빛이 물에서 공기로 나올 때 굴절되어 꺾임.", "단서 2: 사람 눈에는 빛이 직진해 온 것으로 착각되어 물고기가 실제보다 더 얕고 떠 있는 곳에 있는 것처럼 보임!"], "fact": "빛의 굴절 현상! 실제 물고기는 눈에 보이는 위치보다 더 아래쪽 깊은 곳에 있습니다.", "bridge": "빛이 서로 다른 매질을 통과할 때 속력 차이로 인해 꺾이는 굴절 법칙을 탐구합니다."}, "zoom": {"q": "20초 줌인 관찰: 백색 스마트폰 화면을 200배 확대 현미경으로 들여다보면?", "shapeDesc": "흰색 단일 빛이 아니라, 빨강(R), 초록(G), 파랑(B) 3개의 작은 서브픽셀이 빽빽하게 켜져 있는 모습", "fact": "인간 눈의 착시! 세 빛이 미세한 간격으로 모여 망막의 세 원뿔세포를 동시 자극하면 뇌가 흰색으로 인지합니다.", "bridge": "자바실험실 '빛의 삼원색 합성' 인터랙티브 도구로 색깔 배합을 직접 테스트합니다."}, "whatif": {"q": "만약 우주 공간에서도 지구처럼 공기가 가득 차서 소리가 전달된다면?", "defaultChips": ["태양의 핵융합 굉음이 지구를 강타", "잠을 잘 수 없음", "수억 데시벨 폭음", "귀마개 필수"], "fact": "소리는 물질(매질)의 진동으로 전달되는 파동입니다. 진공인 우주 덕분에 우리는 태양의 굉음으로부터 보호받고 있습니다.", "bridge": "매질이 필요한 역학적 파동(소리, 물결파)과 매질 없이 나아가는 빛의 차이를 정리합니다."}, "tools": [{"nm": "빛의 삼원색 합성", "file": "빛의_삼원색_합성.html", "kind": "sim"}, {"nm": "거울과 렌즈의 상 형성", "file": "거울과_렌즈_상의_형성.html", "kind": "sim"}]}, {"title": "빛의 반사: 반사 법칙, 정반사와 난반사", "myth": {"q": "종이처럼 울퉁불퉁한 면에서는 빛이 반사되지 않고 흡수되어 사라질까?", "a": "그렇다! 거울처럼 매끈한 면만 빛을 반사하고, 거친 면은 빛을 흡수해 버린다.", "b": "아니다! 거친 면에서도 빛은 반사되지만, 면마다 방향이 달라 사방으로 흩어져 반사된다(난반사).", "wrongChoice": "A", "fact": "정답은 B! 거친 면의 한 점 한 점에서도 입사각 = 반사각(반사 법칙)이 그대로 지켜져요. 다만 표면이 울퉁불퉁해 반사되는 방향이 제각각이라 빛이 사방으로 흩어지는 거예요. 이것이 난반사예요.", "bridge": "각도기 거울과 슬릿 레이저로 입사각과 반사각을 직접 재 보고, 정반사와 난반사를 비교해 봅니다!"}, "bal": {"q": "밸런스 게임! 딱 하루만 살아야 한다면?", "a": "모든 물체의 표면이 거울처럼 매끈해서 정반사만 일어나는 세상", "b": "모든 물체의 표면이 거칠어서 난반사만 일어나는 세상(거울이 없는 세상)", "fact": "난반사 덕분에 우리는 어느 방향에서든 물체를 볼 수 있어요. 정반사만 있는 세상에서는 반사된 빛이 한 방향으로만 가서 대부분의 물체가 잘 보이지 않을 거예요.", "bridge": "정반사와 난반사가 우리 생활에서 어떤 역할을 하는지 거울 미로와 산속 마을 미션으로 확인합니다."}, "csi": {"q": "비 오는 날 밤, 마른 날보다 도로의 차선이 잘 안 보이고 맞은편 헤드라이트가 유난히 눈부시다! 왜일까?", "evidences": ["단서 1: 마른 도로 표면은 울퉁불퉁해서 헤드라이트 빛이 사방으로 흩어져 반사됨.", "단서 2: 비에 젖은 도로는 물이 얇게 덮여 표면이 매끈해짐.", "단서 3: 매끈해진 도로가 거울처럼 빛을 한 방향으로 모아 반사해 운전자의 눈으로 들어옴."], "fact": "범인은 정반사! 젖은 도로에서는 정반사가 늘어 반사된 빛이 한쪽으로 몰려 눈부시고, 차선처럼 다른 방향으로 흩어지던 빛은 줄어 잘 안 보여요.", "bridge": "정반사와 난반사의 차이를 이용한 생활 속 현상을 찾아봅니다."}, "zoom": {"q": "20초 줌인 관찰: 매끈해 보이는 종이 표면을 아주 크게 확대하면?", "shapeDesc": "매끈해 보이던 종이 표면이 사실은 울퉁불퉁한 섬유 가닥으로 엉켜 있고, 같은 방향으로 들어온 빛이 면마다 다른 방향으로 튀어 나가는 모습", "fact": "눈에는 매끈해 보여도 확대하면 표면이 거칠어요. 이런 면에서는 빛이 사방으로 흩어지는 난반사가 일어나서 어느 방향에서나 글씨를 읽을 수 있어요.", "bridge": "각도를 바꿔 가며 반사된 빛이 흩어지는 모습을 가상실험으로 비교해 봅니다."}, "whatif": {"q": "만약 모든 물체의 표면이 거울처럼 완전히 매끈해서 정반사만 한다면?", "defaultChips": ["벽이나 책이 잘 보이지 않음", "눈부신 빛줄기만 보임", "영화 스크린에 영상이 퍼지지 않음", "어느 방향에서나 보기가 어려워짐"], "fact": "우리가 책·벽·친구를 어느 방향에서나 볼 수 있는 것은 난반사 덕분이에요. 정반사만 있다면 거울 속 상처럼 특정 방향에서만 보이게 될 거예요.", "bridge": "반사 법칙은 지키면서도 면의 상태에 따라 반사가 달라지는 까닭을 정리합니다."}, "tools": [{"nm": "빛의 반사 가상실험실", "file": "빛의_반사_가상실험실.html", "kind": "sim"}]}, {"title": "빛의 굴절: 꺾이는 빛과 착시", "myth": {"q": "물이 든 컵에 꽂은 빨대가 꺾여 보인다! 빨대는 정말 물속에서 꺾여 있을까?", "a": "그렇다! 물이 빨대를 눌러서 실제로 꺾이거나 휘어진다.", "b": "아니다! 빨대는 그대로이고, 물속 빨대에서 나온 빛이 수면에서 굴절되어 꺾여 보이는 착시다.", "wrongChoice": "A", "fact": "정답은 B! 빛이 물에서 공기로 나올 때 수면에서 꺾여(굴절) 눈에 들어오기 때문에, 우리 눈은 빛이 곧게 온 것처럼 느껴 빨대가 꺾이고 짧아 보여요.", "bridge": "수조 레이저로 입사각과 굴절각을 재고, 빨대와 동전 착시를 광선 추적으로 설명해 봅니다."}, "bal": {"q": "물이 맑아 바닥이 훤히 보이는 계곡! 어떻게 들어갈까?", "a": "보이는 깊이가 실제 깊이라고 믿고 그냥 뛰어든다.", "b": "물속 깊이는 실제로 더 깊을 수 있다고 생각하고 발끝으로 먼저 확인하며 들어간다.", "fact": "굴절 때문에 물속 바닥은 실제보다 얕아 보여요. 보이는 것보다 실제 물은 더 깊을 수 있으니 안전을 위해 깊이를 먼저 확인해야 해요.", "bridge": "물속 물체가 실제보다 얕은 곳에 떠올라 보이는 까닭을 광선 작도로 알아봅니다."}, "csi": {"q": "빈 컵 바닥에 동전이 있는데 지금은 안 보인다. 컵에 물을 부었더니 갑자기 동전이 보이기 시작했다! 어떻게 된 걸까?", "evidences": ["단서 1: 물을 붓기 전에는 컵의 가장자리가 시선을 가로막아 동전에서 나온 빛이 눈에 닿지 못함.", "단서 2: 물을 부으면 동전에서 나온 빛이 수면에서 공기 중으로 나오며 굴절해 눈 쪽으로 꺾임.", "단서 3: 눈은 꺾인 빛의 연장선 위쪽에서 동전이 떠오른 것처럼 인식함."], "fact": "범인은 빛의 굴절! 수면에서 꺾인 빛이 컵 가장자리를 넘어 눈에 들어오고, 동전은 실제보다 위로 떠올라 보여요.", "bridge": "굴절 광선의 연장선과 허상의 위치를 작도해 봅니다."}, "zoom": {"q": "20초 줌인 관찰: 공기에서 물로 들어가는 레이저 빛줄기의 경계를 확대하면?", "shapeDesc": "공기 중에서 곧게 오던 빛줄기가 수면에서 법선 쪽으로 꺾여 물속으로 들어가고, 물속에서는 속도가 느려져 파장이 짧아지는 모습", "fact": "빛은 물속에서 공기 중보다 느리게 진행해요. 속력이 달라지는 경계에서 빛이 꺾이는 것이 굴절이고, 공기에서 물로 갈 때는 법선 쪽으로 꺾여요.", "bridge": "입사각과 굴절각의 관계를 매질을 바꿔 가며 측정해 봅니다."}, "whatif": {"q": "만약 빛이 물속에서도 공기 중에서와 똑같은 속력으로 나아간다면?", "defaultChips": ["빨대가 꺾여 보이지 않음", "렌즈로 빛을 모을 수 없음", "안경이나 돋보기를 만들 수 없음", "물속 물고기 위치가 정확히 보임", "수영장이 실제 깊이로 보임"], "fact": "굴절은 매질에 따라 빛의 속력이 달라서 생겨요. 속력이 같다면 굴절이 없어 착시도 없지만, 렌즈를 이용하는 안경·카메라·현미경도 만들 수 없을 거예요.", "bridge": "굴절이 만드는 착시와 렌즈 같은 유용한 도구를 함께 정리합니다."}, "tools": [{"nm": "빛의 굴절 가상실험실", "file": "빛의_굴절_가상실험실.html", "kind": "sim"}]}, {"title": "빛을 보는 과정: 광원과 물체", "myth": {"q": "빛이 전혀 없는 깜깜한 방에서 눈을 크게 뜨고 한참 적응하면 책의 글씨를 읽을 수 있을까?", "a": "그렇다! 눈이 어둠에 적응하면 책이 보이기 시작한다.", "b": "아니다! 광원이 없으면 책에서 반사되어 눈으로 들어오는 빛이 없어 아무것도 볼 수 없다.", "wrongChoice": "A", "fact": "정답은 B! 책은 스스로 빛을 내지 못해요. 광원의 빛이 책에서 반사되어 눈에 들어와야 볼 수 있어요. 빛이 전혀 없으면 눈이 아무리 적응해도 볼 수 없어요.", "bridge": "전등을 켜고 끄며 빛의 경로를 화살표로 그려 보고, 암실에서는 왜 안 보이는지 확인합니다."}, "bal": {"q": "정전된 밤, 책을 읽어야 한다면 어느 쪽을 고를까?", "a": "보름달이 환하게 뜬 마당에 나가 달빛으로 읽는다.", "b": "반딧불이 한 마리를 손바닥에 올려놓고 읽는다.", "fact": "달빛은 달이 스스로 낸 빛이 아니라 태양 빛이 달 표면에서 반사된 빛이에요. 반딧불이는 스스로 빛을 내는 광원이고요. 어느 쪽이든 그 빛이 책에서 반사되어 눈에 들어와야 책이 보여요.", "bridge": "광원과 비광원을 구분하며 달과 거울이 왜 광원이 아닌지 알아봅니다."}, "csi": {"q": "정전된 도서관의 수수께끼! 한 학생이 “눈에서 손전등처럼 빛이 나가서 어둠 속에서도 책 제목을 읽었다”고 주장한다. 사실일까?", "evidences": ["단서 1: 비상등까지 꺼져 완전한 암흑이 되자 아무도 책 제목을 읽지 못함.", "단서 2: 문틈으로 가는 빛 한 줄기가 들어오자 그제야 가까운 책 제목이 보이기 시작함.", "단서 3: 책과 눈 사이에 두꺼운 판을 세우자 불이 켜져 있어도 책이 보이지 않음."], "fact": "학생의 주장은 오개념! 눈에서 빛이 나가는 것이 아니라, 광원의 빛이 책에서 반사되어 눈으로 들어와야 책이 보여요. 광원이 없거나 반사된 빛이 막히면 볼 수 없어요.", "bridge": "가림막 실험으로 반사된 빛이 눈에 닿지 못하면 책이 사라지는 모습을 확인합니다."}, "zoom": {"q": "20초 줌인 관찰: 밤하늘의 보름달 표면을 아주 크게 확대하면?", "shapeDesc": "달 표면의 울퉁불퉁한 먼지와 암석 알갱이들이 스스로 빛나는 것이 아니라, 한쪽에서 오는 태양 빛을 받아 사방으로 반사하는 모습", "fact": "달은 스스로 빛을 내지 못하는 비광원이에요. 태양 빛이 달 표면에서 반사되어 지구의 우리 눈에 들어오기 때문에 밤하늘에서 밝게 보여요.", "bridge": "우주에서 본 태양·달·관찰자의 위치로 달빛의 경로를 그려 봅니다."}, "whatif": {"q": "만약 우리 눈에서 빛이 나가 물체에 닿아야 물체를 볼 수 있다면?", "defaultChips": ["깜깜한 방에서도 책이 보임", "전등이 필요 없음", "눈을 뜨자마자 눈부신 빛이 나감", "먼 별을 보려면 눈빛이 오래 걸림"], "fact": "만약 그렇다면 전등을 꺼도 모든 것이 보여야 하지만 현실에서는 광원이 없으면 아무것도 볼 수 없어요. 우리는 광원에서 나온 빛이 물체에서 반사되어 눈에 들어올 때 물체를 볼 수 있어요.", "bridge": "광원 → 물체(반사) → 눈으로 이어지는 빛의 경로를 정리합니다."}, "tools": [{"nm": "빛을 보는 과정 가상실험실", "file": "빛을_보는_과정_가상실험실.html", "kind": "sim"}]}, {"title": "평면거울의 상: 크기·거리·좌우 대칭", "myth": {"q": "거울에서 뒤로 물러나면 거울 속에 생긴 내 모습(상)의 실제 크기도 작아질까?", "a": "그렇다! 멀어질수록 상의 크기도 실제로 작아진다.", "b": "아니다! 상의 실제 크기는 항상 물체와 같고, 멀어질수록 작아 보이는 것은 시야각이 줄어서다.", "wrongChoice": "A", "fact": "정답은 B! 평면거울에 생기는 상의 크기는 물체의 크기와 항상 같아요. 거울에서 멀어지면 눈에서 상까지의 거리가 멀어져 시야각이 작아지니 작아 보일 뿐이에요. 모눈종이로 재 보면 상의 높이는 그대로예요.", "bridge": "모눈종이와 반투명 거울로 물체와 상의 거리·크기를 직접 비교해 봅니다."}, "bal": {"q": "옷가게 거울 설치 딜레마! 내 전신을 한눈에 보려면 거울이 얼마나 길어야 할까?", "a": "내 키와 같은 길이의 전신 거울", "b": "내 키의 절반 길이의 거울", "fact": "평면거울에서는 눈높이에 맞게 달면 키의 절반 길이 거울로도 머리끝부터 발끝까지 볼 수 있어요. 상이 거울 뒤에서 물체와 같은 거리, 같은 크기로 생기기 때문이에요.", "bridge": "거울의 반사 광선과 연장선을 작도해 상의 위치를 확인합니다."}, "csi": {"q": "구급차 앞면의 글씨는 왜 AMBULANCE가 좌우로 뒤집힌 채 쓰여 있을까?", "evidences": ["단서 1: 구급차 앞면의 글자는 좌우가 뒤집힌 거울 문자로 적혀 있음.", "단서 2: 앞차 운전자는 룸미러(평면거울)로 뒤쪽 구급차를 봄.", "단서 3: 평면거울은 좌우를 바꿔 보여 주므로 뒤집힌 글자가 거울에서 다시 뒤집혀 바르게 읽힘."], "fact": "앞차 운전자가 룸미러로 볼 때 글자가 바르게 읽히도록 미리 좌우를 뒤집어 써 둔 거예요! 평면거울의 상은 좌우가 반대(상하는 같음)로 보여요.", "bridge": "거울 문자 변환기로 내가 쓴 글자가 거울에서 어떻게 보이는지 확인합니다."}, "zoom": {"q": "20초 줌인 관찰: 거울 앞 연필의 상이 거울 뒤쪽에 있는 것처럼 보이는 까닭을 빛줄기로 확대하면?", "shapeDesc": "거울 뒤쪽에는 아무것도 없지만, 거울 표면에서 반사되어 눈으로 들어온 빛줄기들의 연장선이 거울 뒤의 한 점에서 만나 마치 그곳에서 빛이 나오는 것처럼 보이는 모습", "fact": "반사된 빛을 눈이 직진해 온 것으로 느끼기 때문에 연장선이 만나는 거울 뒤쪽에 상이 있다고 인식해요. 그래서 물체까지의 거리와 상까지의 거리가 같아져요.", "bridge": "눈의 위치를 바꿔도 상의 위치는 그대로인지 광선 작도로 확인합니다."}, "whatif": {"q": "만약 거울이 빛을 반사하지 않고 그냥 통과시켜 버린다면?", "defaultChips": ["거울이 유리창처럼 투명해짐", "내 모습(상)이 생기지 않음", "화장이나 옷매무새를 확인할 수 없음", "자동차 룸미러를 쓸 수 없음"], "fact": "거울에 상이 보이는 것은 빛이 거울 표면에서 반사되어 눈으로 들어오기 때문이에요. 반사가 없다면 거울 속 상도 생기지 않아요.", "bridge": "반사 법칙이 만들어 내는 상의 성질을 정리합니다."}, "tools": [{"nm": "거울과 렌즈 가상실험실", "file": "거울과_렌즈_가상실험실.html", "kind": "sim"}, {"nm": "거울과 렌즈의 상 형성", "file": "거울과_렌즈_상의_형성.html", "kind": "sim"}]}, {"title": "볼록·오목 거울과 렌즈의 상", "myth": {"q": "돋보기로 멀리 있는 나무를 보면 항상 실제보다 크게 보일까?", "a": "그렇다! 볼록 렌즈는 언제나 물체를 크게 보여 준다.", "b": "아니다! 초점보다 가까울 때만 크고 바로 선 상이고, 멀어지면 작고 거꾸로 선 상이 보인다.", "wrongChoice": "A", "fact": "정답은 B! 볼록 렌즈(오목 거울도 같아요)는 물체가 초점 안쪽에 있을 때만 크고 바로 선 상을 만들어요. 초점 밖으로 멀어지면 거꾸로 선 상이 생기고 멀어질수록 작아져요.", "bridge": "무당벌레를 거리별로 옮겨 가며 4종 기구의 상을 비교해 봅니다."}, "bal": {"q": "굽은 도로에 안전 거울을 달아요! 더 넓은 범위를 한눈에 보려면?", "a": "오목 거울: 크게 확대해 보여 준다.", "b": "볼록 거울: 작게 줄이는 대신 넓은 범위를 보여 준다.", "fact": "볼록 거울은 빛을 퍼뜨려 항상 작고 바로 선 상을 만들지만, 시야(화각)가 매우 넓어요. 그래서 굽은 도로, 편의점 보안 거울, 자동차 사이드미러에 써요.", "bridge": "볼록 거울로 바꿔 거리를 늘리며 시야가 넓어지는 모습을 확인합니다."}, "csi": {"q": "시력이 나쁜 두 친구! 한 명은 먼 칠판이, 한 명은 가까운 책이 흐릿하다. 안경은 어떻게 달라야 할까?", "evidences": ["단서 1: 근시는 상이 망막 앞에 맺혀 먼 곳이 흐릿하게 보임.", "단서 2: 원시는 상이 망막 뒤에 맺혀 가까운 곳이 흐릿하게 보임.", "단서 3: 빛을 퍼뜨리는 렌즈는 상을 뒤로, 빛을 모으는 렌즈는 상을 앞으로 옮겨 줌."], "fact": "근시는 빛을 퍼뜨리는 오목 렌즈 안경, 원시는 빛을 모으는 볼록 렌즈 안경으로 교정해요. 먼 곳과 가까운 곳이 모두 불편하면 이중 초점 안경도 쓸 수 있어요.", "bridge": "환자 3명에게 안경을 씌워 보며 망막에 상이 맺히는 위치를 확인합니다."}, "zoom": {"q": "20초 줌인 관찰: 나란한 빛이 볼록 렌즈와 오목 거울을 만나면?", "shapeDesc": "나란하게 들어온 빛줄기들이 렌즈 또는 거울 면에서 꺾이거나 반사되어 한 점(초점)으로 모이는 모습", "fact": "볼록 렌즈와 오목 거울은 나란한 빛을 한 점에 모아요. 반대로 오목 렌즈와 볼록 거울은 빛을 넓게 퍼뜨려 모이지 않아요. 그래서 짝꿍끼리 상의 특징이 같아요.", "bridge": "평행광선 실험으로 모이는 기구와 퍼지는 기구를 구분합니다."}, "whatif": {"q": "만약 자동차 사이드미러가 볼록 거울이 아니라 평면거울이라면?", "defaultChips": ["보이는 범위가 좁아짐", "옆 차의 사각지대가 늘어남", "상이 실제와 같은 크기로 보임", "차선 변경이 더 위험해짐"], "fact": "볼록 거울은 상이 작아지는 대신 넓은 범위를 비춰 사각지대를 줄여 줘요. 그래서 사이드미러에는 볼록 거울을 쓰고 '사물이 보이는 것보다 가까이 있음'이라고 써 놓아요.", "bridge": "생활 속 거울·렌즈 카드를 5개 분류함으로 나눠 봅니다."}, "tools": [{"nm": "거울과 렌즈 상 관찰 가상실험실", "file": "거울과_렌즈_상_관찰_가상실험실.html", "kind": "sim"}, {"nm": "거울과 렌즈의 상 형성", "file": "거울과_렌즈_상의_형성.html", "kind": "sim"}]}, {"title": "빛의 합성: 물체의 색과 화소", "myth": {"q": "빨간색 조명 아래에서 초록색 잎은 그대로 초록색으로 보일까?", "a": "그렇다! 조명 색과 상관없이 물체는 자기 색으로 보인다.", "b": "아니다! 초록 잎은 빨간 빛을 흡수하고 반사할 빛이 없어서 검게 보인다.", "wrongChoice": "A", "fact": "정답은 B! 물체는 자기 색의 빛만 반사하고 나머지는 흡수해요. 빨간 조명에는 초록 빛이 없으니 잎에서 반사되는 빛이 없어 검게 보여요.", "bridge": "조명 색과 물체를 바꿔 가며 반사·흡수 경로를 확인해 봅니다."}, "bal": {"q": "무대 위 조명 연출! 가수의 흰 옷을 노랗게 보이게 하려면?", "a": "노란 물감을 흰 옷에 칠한다.", "b": "빨간 조명과 초록 조명을 함께 비춘다.", "fact": "빛은 합칠수록 밝아져요. 빨강+초록=노랑이므로 두 조명을 겹치면 흰 옷이 노랗게 보여요. 물감을 섞는 것과는 원리가 달라요.", "bridge": "빨강·초록·파랑 손전등을 겹쳐 합성색을 만들어 봅니다."}, "csi": {"q": "스마트폰 화면에는 노란색 화소가 따로 없는데 어떻게 노란색이 나올까?", "evidences": ["단서 1: 화면의 화소는 빨강·초록·파랑 세 종류의 발광체로 이루어져 있음.", "단서 2: 노란색을 표시할 때 파란 화소는 꺼져 있음.", "단서 3: 빨강과 초록 빛이 함께 눈에 들어오면 노랑으로 느껴짐."], "fact": "노란색 화면은 빨간 화소와 초록 화소가 함께 켜진 것이에요. 세 화소의 밝기를 조절해 모든 색을 만들어요.", "bridge": "디지털 현미경으로 화면 색별 화소를 확대해 봅니다."}, "zoom": {"q": "20초 줌인 관찰: 노란색을 보여 주는 화면을 확대하면 화소는 어떻게 켜져 있을까?", "shapeDesc": "작은 빨간 막대와 초록 막대가 나란히 밝게 켜져 있고, 파란 막대는 꺼져 있는 모습", "fact": "화소 하나는 빨강·초록·파랑 세 부분으로 나뉘어 있어요. 노랑은 빨강과 초록이, 흰색은 세 가지가 모두 켜진 것이에요.", "bridge": "여러 색 화면의 화소를 비교하며 합성 원리를 정리합니다."}, "whatif": {"q": "만약 화면의 파란 화소가 고장 나서 영영 꺼져 버린다면?", "defaultChips": ["흰색이 노랗게 보임", "파란색을 표현할 수 없음", "청록·자홍도 만들 수 없음", "화면 색이 누렇게 변함"], "fact": "파란 화소가 없으면 파랑, 청록, 자홍, 흰색을 만들 수 없고 화면이 누렇게 보여요. 세 가지 빛이 모두 있어야 다양한 색이 나와요.", "bridge": "대형 LED 전광판과 점묘화에서 점들이 합쳐져 보이는 원리를 알아봅니다."}, "tools": [{"nm": "빛의 합성 가상실험실", "file": "빛의_합성_가상실험실.html", "kind": "sim"}, {"nm": "빛의 삼원색 합성", "file": "빛의_삼원색_합성.html", "kind": "sim"}]}, {"title": "소리의 3요소: 세기·높낮이·음색", "myth": {"q": "소리가 클수록 소리가 더 높아질까?", "a": "그렇다! 큰 소리일수록 높은 소리다.", "b": "아니다! 소리의 크기(세기)는 진폭, 높낮이는 진동수가 결정하며 서로 별개다.", "wrongChoice": "A", "fact": "정답은 B! 큰 소리와 높은 소리는 달라요. 세기는 파형의 위아래 폭(진폭)이, 높낮이는 파형의 촘촘함(진동수)이 결정해요.", "bridge": "칼림바를 약하게·세게 튕겨 파형의 진폭 변화를 확인해 봅니다."}, "bal": {"q": "리코더의 소리를 더 높게 내려면?", "a": "구멍을 더 많이 막아 관을 길게 만든다.", "b": "구멍을 열어 소리가 나는 관을 짧게 만든다.", "fact": "소리가 나는 공기 기둥이 짧을수록 진동수가 커져 높은 소리가 나요. 구멍을 열면 관이 짧아지는 효과가 있어요.", "bridge": "리코더 구멍을 막고 열며 진동수와 파형의 촘촘함을 비교해 봅니다."}, "csi": {"q": "같은 도(C) 음을 같은 세기로 연주해도 플루트와 바이올린 소리를 쉽게 구별한다! 왜?", "evidences": ["단서 1: 두 소리의 높낮이(진동수)와 세기(진폭)는 같음.", "단서 2: 오실로스코프로 보면 플루트는 부드러운 곡선, 바이올린은 뾰족한 톱니 모양임.", "단서 3: 악기마다 소리의 파형 모양이 고유하게 다름."], "fact": "파형의 모양이 다르기 때문에 소리를 구별할 수 있어요. 이것을 소리의 음색이라고 해요.", "bridge": "악기 4종의 파형을 겹쳐 비교하며 음색의 차이를 확인합니다."}, "zoom": {"q": "20초 줌인 관찰: 높은 소리와 낮은 소리의 파형을 같은 시간 동안 확대해 보면?", "shapeDesc": "높은 소리는 같은 시간에 파동이 훨씬 촘촘하게 반복되고, 낮은 소리는 듬성듬성 반복되는 모습", "fact": "높은 소리는 진동수가 커서 한 번 진동하는 시간(주기)이 짧아요. 낮은 소리는 진동수가 작고 주기가 길어요.", "bridge": "칼림바 막대 길이를 바꾸며 주기와 진동수를 측정합니다."}, "whatif": {"q": "만약 모든 악기의 소리 파형이 똑같다면?", "defaultChips": ["악기 소리를 구별할 수 없음", "플루트와 바이올린이 같은 소리", "음색이라는 개념이 필요 없음", "합주해도 악기가 구분되지 않음"], "fact": "파형 모양이 같다면 높낮이와 세기가 같을 때 어떤 악기인지 구별할 수 없어요. 음색 덕분에 악기마다 다른 소리를 느낄 수 있어요.", "bridge": "소리의 3요소(세기·높낮이·음색)를 오실로스코프로 정리합니다."}, "tools": [{"nm": "소리의 3요소 가상실험실", "file": "소리의_3요소_가상실험실.html", "kind": "sim"}]}]}, {"grade": "중2", "unit": "물질의 구성", "icon": "⚛️", "sets": [{"title": "원소, 원자, 이온과 화학 결합", "myth": {"q": "은빛 쇠못이 공기 중에서 붉게 녹슬면, 원래 쇠못보다 무게가 더 무거워질까 가벼워질까?", "a": "부식되어 부서져 나가므로 원래보다 가벼워진다.", "b": "공기 중의 산소 기체가 결합하므로 원래보다 더 무거워진다.", "wrongChoice": "A", "fact": "정답은 B! 철(Fe) 원자에 공기 중의 산소(O) 원자가 화학 결합하여 산화철이 되므로 결합한 산소 질량만큼 무거워집니다.", "bridge": "원자와 원자가 만나 새로운 분자를 합성하는 공유결합과 화학 결합의 세계로 떠납니다!"}, "bal": {"q": "화학 반응 극단 밸런스! 둘 중 하나로 온몸의 화학 결합이 바뀐다면?", "a": "모든 결합이 물에 닿자마자 앙금으로 굳어버리는 불용성 몸", "b": "원자가 전자가 모조리 0개가 되어 다른 물질과 절대 결합 못 하는 비활성 기체형 몸", "fact": "생명체는 물에 잘 녹는 이온과 단단한 공유결합이 정교하게 공존해야만 대사 작용을 유지합니다.", "bridge": "이온 결합과 공유결합 테트리스의 결합선 규칙을 마스터해 봅니다."}, "csi": {"q": "투명한 두 지하수의 범죄: 섞자마자 흰색 우윳빛 앙금이 쏟아져 나왔다!", "evidences": ["단서 1: A수용액은 질산 은(AgNO₃), B수용액은 염화 나트륨(NaCl)이었음.", "단서 2: 은 이온(Ag⁺)과 염화 이온(Cl⁻)이 만나 물에 녹지 않는 흰색 침전 형성."], "fact": "앙금 생성 반응(Ag⁺ + Cl⁻ → AgCl↓)으로 미지의 이온을 검출하는 화학 수사 기법입니다.", "bridge": "양이온과 음이온의 결합 및 앙금 생성 반응 가상실험을 시작합니다."}, "zoom": {"q": "20초 줌인 관찰: 소금 알갱이를 1억 배 확대하면 정육면체 속에 무엇이?", "shapeDesc": "양전하를 띤 Na⁺ 이온과 음전하를 띤 Cl⁻ 이온이 정전기적 인력으로 3차원 바둑판처럼 교대 배열된 이온 결정", "fact": "양이온과 음이온이 1:1로 결합해 전기적으로 완벽한 중성을 이루고 있습니다.", "bridge": "이온 모형 화이트보드로 전하 중성과 옥텟 규칙을 직접 조립해 봅니다."}, "whatif": {"q": "만약 세상의 모든 원자가 최외각 전자를 8개 채우려는 '옥텟 규칙'을 거부한다면?", "defaultChips": : ["별이 1/4만큼 어두워짐", "약 1.5등급 어두워짐", "눈에 보이는 별 수 급감", "희미한 별은 사라짐", "은하수도 희미해짐"], "fact": "거리가 2배면 밝기는 1/4배로, 등급으로는 약 1.5등급 어두워져요. 그래서 맨눈 한계(6등급)에 가까운 희미한 별들은 보이지 않게 돼요.", "bridge": "밤하늘 별과 등급을 직접 조작해 보며 확인합니다."}, "tools": [{"nm": "별의 밝기와 등급", "file": "별의_밝기와_등급.html", "kind": "sim"}], "shoot": "2"}, {"title": "별까지의 거리와 연주 시차", "myth": {"q": "지구가 태양을 돌기 때문에, 가까운 별은 6개월 뒤 하늘에서 위치가 달라 보일까?", "a": "아니다! 별은 너무 멀어서 6개월이 지나도 똑같이 보인다.", "b": "그렇다! 아주 조금이지만 위치가 달라 보인다(연주 시차).", "wrongChoice": "A", "fact": "정답은 B! 가까운 별은 6개월 간격으로 보면 배경별에 대해 위치가 아주 조금 달라 보여요. 이 각도(연주 시차)가 클수록 별은 가까워요. d(pc) = 1 ÷ p(″), 예: 프록시마 센타우리 p ≈ 0.77″ → 약 1.3 pc(약 4.2광년).", "bridge": "연주 시차로 별까지의 거리를 직접 계산해 봅니다!"}, "bal": {"q": "엄지손가락 밸런스! 한쪽 눈을 번갈아 감을 때 더 많이 움직여 보이는 엄지는?", "a": "팔을 쭉 뻗은 엄지", "b": "코앞에 가까이 댄 엄지", "fact": "정답은 B! 가까운 물체일수록 관측 위치가 달라질 때 방향 차이(시차)가 커요. 별도 가까울수록 연주 시차가 커요.", "bridge": "시차를 체험한 뒤, 지구가 공전하며 만드는 연주 시차를 살펴봅니다."}, "csi": {"q": "거리 측정 미스터리! 두 별 S와 T 중 어느 별이 더 멀까?", "evidences": ["단서 1: 별 S의 연주 시차는 0.38″, 별 T의 연주 시차는 0.083″.", "단서 2: 연주 시차는 별까지의 거리에 반비례함.", "단서 3: 거리 d(pc) = 1 ÷ p(″)."], "fact": "S는 약 2.6 pc, T는 약 12 pc! 연주 시차가 더 작은 T가 훨씬 멀리 있어요.", "bridge": "연주 시차를 읽고 d = 1/p 로 거리를 구하는 활동을 합니다."}, "zoom": {"q": "20초 줌인 관찰: 가까운 별 하나를 1년 동안 사진으로 찍어 겹쳐 보면?", "shapeDesc": "별이 1년 주기로 아주 작은 타원(또는 선)을 그리며 왕복하는 모습", "fact": "지구의 공전 때문에 생기는 겉보기 움직임이에요. 이 움직임의 크기(연주 시차)로 별까지의 거리를 구해요.", "bridge": "지구 공전과 연주 시차의 관계를 교과서 그림처럼 재현해 봅니다."}, "whatif": {"q": "만약 지구가 태양 둘레를 돌지 않고 한 자리에 멈춰 있다면?", "defaultChips": ["연주 시차가 생기지 않음", "별 거리 측정법이 사라짐", "계절 변화도 달라짐", "별의 위치가 늘 같음", "다른 거리 측정법이 필요함"], "fact": "연주 시차는 지구의 공전 때문에 생기기 때문에, 공전이 없으면 이 방법으로 거리를 재지 못해요. 거꾸로 연주 시차는 지구가 공전한다는 증거이기도 해요.", "bridge": "멀리 있는 별의 거리를 재는 방법과 한계를 알아봅니다."}, "tools": [{"nm": "별의 연주 시차", "file": "연주시차.html", "kind": "sim"}], "shoot": "3"}]}, {"grade": "중2", "unit": "수권과 해수의 순환", "icon": "🌊", "sets": [{"title": "해수의 층상 구조와 해류", "myth": {"q": "북극해의 바닷물은 적도 바닷물보다 소금이나 염화 마그네슘 같은 염류의 성분 비율이 완전히 다를까?", "a": "그렇다! 추운 바다와 더운 바다는 성분 : "중력이 약해지면 물체가 떨어지는 속력 증가율과 위치 에너지가 줄어들어 건축, 낙하, 스포츠의 모든 역학 시스템이 바뀝니다.", "bridge": "자유 낙하 운동과 등속 운동의 그래프 해석 및 일-에너지 정리의 핵심 계산법을 완성합니다."}}]}, {"grade": "중3", "unit": "자극과 반응", "icon": "🧠", "sets": [{"title": "감각 기관, 신경계와 반사, 호르몬과 항상성", "myth": {"q": "코를 꽉 막고 눈을 감은 채로 양파와 사과를 먹으면, 둘의 아삭한 맛 차이를 구분할 수 있을까?", "a": "구분할 수 있다! 혀의 맛봉오리가 매운 양파 맛과 달콤한 사과 맛을 정확히 감지한다.", "b": "절대 구분 못 한다! 코를 막으면 양파와 사과는 똑같이 약간 달콤하고 아삭한 무 맛으로 느껴진다.", "wrongChoice": "A", "fact": "정답은 B! 우리가 느끼는 '맛'의 80% 이상은 혀의 5가지 기본 맛(단/짠/신/쓴/감칠맛)이 아니라 코의 '후각 세포'가 느끼는 음식 냄새의 결합입니다.", "bridge": "시각, 청각, 평형 감각, 후각, 미각, 피부 감각 등 5대 감각 기관의 구조와 감각 성립 경로를 파헤칩니다."}, "bal": {"q": "자율신경 이상 딜레마! 둘 중 단 하루 동안 몸이 고정되어야 한다면?", "a": "심장이 분당 180회 뛰고 동공이 풀리며 소화가 1도 안 되는 24시간 풀가동 '교감 신경 폭주' 상태", "b": "심장이 늘어지고 혈압이 떨어지며 아무리 위험한 맹수가 와도 잠만 쏟아지는 '부교감 신경 과수면' 상태", "fact": "자율신경계는 위기 상황에 대처하는 '교감 신경'과 휴식·소화를 돕는 '부교감 신경'이 서로 반대로 작용(길항 작용)하여 생명을 유지합니다.", "bridge": "대뇌가 명령하는 의식적인 반응과 척수·연수·중간뇌가 관여하는 무조건 반사의 반응 경로를 지도합니다."}, "csi": {"q": "뜨거운 냄비 손잡이 회피 사건: '앗 뜨거!' 소리를 지르며 생각하기도 전에 손이 먼저 튀어 올라간 이유!", "evidences": ["단서 1: 피부 감각점에서 뜨거움 자극을 감지함.", "단서 2: 자극 신호가 대뇌(판단 중추)까지 올라가기 전에 척수에서 즉각 팔 근육으로 수축 명령을 내림.", "단서 3: 손을 뗀 직후에야 비로소 '뜨겁다!'는 고통을 대뇌로 느껴 인지함!"], "fact": "대뇌를 거치지 않고 척수가 중추가 되는 '무조건 반사(회피 반사)' 덕분에 신체 손상을 최소화할 수 있었습니다.", "bridge": "의식적 반응(자극→감각기관→감각신경→대뇌→척수→운동신경→반응기)과 무조건 반사(자극→감각신경→척수→운동신경→반응기)의 시간 차이를 측정합니다."}, "zoom": {"q": "20초 줌인 관찰: 눈의 망막 뒤쪽 한 지점을 5,000배 확대했는데 시각 세포가 단 1개도 없다?!", "shapeDesc": "시각 세포는 전혀 없고, 100만 가닥의 시각 신경 섬유들이 뇌를 향해 한 다발로 묶여 빠져나가는 구멍", "fact": "이곳이 바로 '맹점(Blind Spot)'입니다! 상이 맹점에 맺히면 아무것도 보이지 않지만, 뇌가 주변 이미지를 합성해 메워주기 때문에 평소엔 느끼지 못합니다.", "bridge": "동공과 수정체 두께 조절, 망막과 시각 신경의 경로, 맹점 확인 실험을 직접 체험합니다."}, "whatif": {"q": "만약 이자에서 분비되는 '인슐린' 호르몬이 몸속에서 완전히 생산 중단된다면?", "defaultChips": ["식후 고혈당 쇼크", "혈액 속 포도당이 오줌으로 배출", "세포 에너지 기아 상태", "당뇨병 발생"], "fact": "인슐린은 혈액 속 포도당을 간에 글리코젠으로 저장시키고 세포 흡수를 도와 혈당량을 낮추는 필수 호르몬입니다. 결핍되면 당뇨병이 발생합니다.", "bridge": "간뇌의 조절 아래 인슐린과 글루카곤이 혈당량을 조절하고, 신경과 호르몬이 체온을 36.5℃로 유지하는 항상성 메커니즘을 배웁니다."}}]}, {"grade": "중3", "unit": "생식과 유전", "icon": "🧬", "sets": [{"title": "세포 분열, 발생, 멘델 유전 법칙과 사람의 유전", "myth": {"q": "코끼리가 쥐보다 몸집이 수천 배 거대한 이유는 코끼리의 세포 크기가 쥐 세포보다 훨씬 거대하기 때문일까?", "a": "그렇다! 거대한 코끼리는 세포 하나하나의 크기도 거대할 것이다.", "b": "아니다! 코끼리와 쥐의 세포 크기는 거의 똑같으며, 단지 세포 수가 압도적으로 많을 뿐이다.", "wrongChoice": "A", "fact": "정답은 B! 세포가 커지면 부피에 대한 표면적 비가 급감해 물질 교환이 불가능해집니다. 따라서 생물이 생장하는 원리는 세포가 커지는 것이 아니라 '체세포 분열'로 세포 수를 늘리는 것입니다.", "bridge": "체세포 분열(염색체 수 보존, 2개 딸세포)과 감수 분열(염색체 수 반감 2n→n, 4개 생식세포)의 염색체 행동을 비교합니다."}, "bal": {"q": "멘델의 완두콩 교배 연구원 딜레마! 둘 중 더 고통스러운 연구 과제는?", "a": "한 세대가 30년 걸리고 자손도 1명씩만 낳는 인간을 대상으로 3대 가계도 유전 법칙 추적하기", "b": "대립 형질이 100가지이고 자가수분이 절대 안 되는 식물로 순종 분리하기", "fact": "멘델이 유전 법칙을 발견할 수 있었던 비결은 한 세대가 짧고, 자손이 많으며, 7가지 대립 형질이 뚜렷하고 자가/타가 수분이 쉬운 '완두'를 골랐기 때문입니다.", "bridge": "우열의 원리, 분리의 법칙(잡종 2대 표현형비 3:1), 독립의 법칙(잡종 2대 9:3:3:1)의 확률과 통계를 정복합니다."}, "csi": {"q": "산부인과 혈액형 미스터리: O형 엄마와 AB형 아빠 사이에서 태어난 아기가 O형?!", "evidences": ["단서 1: 엄마는 O형이므로 대립유전자 형이 OO임.", "단서 2: 아빠는 AB형이므로 자녀에게 반드시 A 유전자나 B 유전자 중 하나를 물려줌.", "단서 3: 태어날 자녀의 가능한 유전자형은 무조건 AO(A형) 또는 BO(B형)뿐임!"], "fact": "ABO식 혈액형 가계도 분석 결과, 병원 신생아실 차트 기록 착오로 아기가 바뀐 사실을 과학적으로 입증해 냈습니다.", "bridge": "상염색체 유전(귓불, 이마선, ABO식 혈액형)과 성염색체 반성유전(적록 색맹, 혈우병) 가계도 분석법을 배웁니다."}, "zoom": {"q": "20초 줌인 관찰: 생식세포 분열(감수 1분열) 전기 세포의 핵 속을 50,000배 확대하면?", "shapeDesc": "부모에게서 각각 하나씩 물려받은 모양과 크기가 같은 상동 염색체 두 쌍이 자석처럼 딱 달라붙어 4가닥의 염색 분체를 형성한 '2가 염색체'", "fact": "감수 1분열 전기에 상동 염색체가 접합하여 2가 염색체를 형성했다가 분리되기 때문에 염색체 수가 2n→n으로 절반으로 줄어듭니다.", "bridge": "감수 분열을 통해 정자와 난자의 염색체가 23개가 되고, 수정란에서 다시 46개로 복원되는 세대 간 염색체 수 유지 원리를 배웁니다."}, "whatif": {"q": "만약 생식세포 형성 시 감수 분열이 일어나지 않고 체세포 분열처럼 염색체 수(46개) 그대로 정자와 난자가 만들어진다면?", "defaultChips": ["1세대 만에 염색체 92개", "다음 세대 184개 폭증", "유전적 불균형으로 기형 및 사산", "인류 종의 영구적 소멸"], "fact": "생식세포 형성 시 염색체 수가 절반으로 줄어들지 않으면 세대를 거듭할수록 염색체 수가 기하급수적으로 폭증해 종을 유지할 수 없습니다.", "bridge": "수정란의 난할 과정과 착상, 태아 발생의 신비로운 생명 탄생 과정을 추적합니다."}}]}, {"grade": "중3", "unit": "에너지 전환과 보존", "icon": "🔋", "sets": [{"title": "역학적 에너지 보존, 전자기 유도와 전기 에너지 전환", "myth": {"q": "롤러코스터가 가장 높은 꼭대기에서 출발해 질주한 후, 엔진 모터의 도움 없이 처음보다 더 높은 언덕을 스스로 넘어갈 수 있을까?", "a": "그렇다! 내려올 때 가속도가 붙어 운동 에너지가 엄청나게 커지므로 더 높은 곳까지 솟구칠 수 있다.", "b": "절대 불가능하다! 아무리 속력이 빨라도 처음 출발 높이보다 더 높은 언덕은 물리적으로 넘을 수 없다.", "wrongChoice": "A", "fact": "정답은 B! '역학적 에너지 보존 법칙'! 위치 에너지가 운동 에너지로 전환될 뿐, 외부에서 새로운 에너지가 공급되지 않는 한 최고 높이의 위치 에너지를 초과할 수 없습니다. (실제로는 마찰 때문에 처음 높이보다 낮아짐)", "bridge": "롤러코스터와 진자의 운동에서 위치 에너지와 운동 에너지가 서로 전환되며 총합이 일정하게 보존되는 원리를 학습합니다."}, "bal": {"q": "전력 소비 딜레마! 한 달 전기 요금이 더 많이 나와서 부모님께 등짝을 맞을 위험한 상황은?", "a": "소비 전력 35W짜리 일반 선풍기를 24시간 내내 켜두었을 때 (35W × 24h = 840Wh)", "b": "소비 전력 2,800W짜리 스탠드 에어컨을 딱 1시간 틀었을 때 (2800W × 1h = 2800Wh)", "fact": "에어컨을 1시간만 틀어도 선풍기를 80시간(3일 이상) 연속 가동한 것보다 훨씬 많은 전력량(전기 에너지)을 소모합니다! 전열기나 냉방기는 소비 전력이 어마어마합니다.", "bridge": "소비 전력(W = J/s)과 전력량(Wh = W × h)의 계산 공식 및 가정용 전기 기구의 에너지 효율을 분석합니다."}, "csi": {"q": "무전원 자전거 발전기 미스터리: 건전지도 배터리도 없는데 페달을 밟으면 전조등 LED에 불이 번쩍 켜지는 원리는?", "evidences": ["단서 1: 바퀴 회전축에 영구 자석과 구리선 코일이 장착되어 있음.", "단서 2: 페달을 밟아 바퀴가 돌면 자석이 코일 주변을 빠르게 통과함.", "단서 3: 코일 내부를 통과하는 자기장이 변하면서 코일에 스스로 유도 전류가 발생함!"], "fact": "패러데이의 '전자기 유도' 현상입니다! 자석과 코일의 상대적 운동(역학적 에너지)이 전기 에너지로 전환되어 전구를 밝힙니다.", "bridge": "수력, 화력, 풍력 발전소에서 거대한 터빈 발전기를 돌려 전기를 생산하는 원리를 배웁니다."}, "zoom": {"q": "20초 줌인 관찰: 공기 저항이 있는 바닥에 튕기는 테니스공의 바닥 충돌 순간을 초고속 카메라로 10,000배 확대하면?", "shapeDesc": "공이 바닥에 찌그러졌다가 펴지면서 고무 분자들의 마찰열과 공기를 진동시키는 팡! 소리 에너지가 사방으로 흩어지는 순간", "fact": "튕기는 공의 높이가 점점 낮아지는 것은 역학적 에너지가 사라진 것이 아니라, 소리와 열에너지로 형태가 전환되었기 때문이며 우주 전체의 에너지는 완벽히 보존됩니다.", "bridge": "에너지는 생성되거나 소멸되지 않고 전환될 뿐 총량이 일정하다는 '에너지 보존 법칙'을 학습합니다."}, "whatif": {"q": "만약 전자기 유도 현상이 사라져 코일 속에서 자석을 아무리 돌려도 전류가 생기지 않는다면?", "defaultChips": ["전 세계 모든 발전소 정지", "블랙아웃 대정전", "문명 200년 전 퇴보", "전기 기구 전면 마비"], "fact": "인류가 사용하는 전기의 99%는 전자기 유도를 이용한 발전기에서 생산됩니다. 이 법칙이 없다면 현대 전기 문명 자체가 존재할 수 없습니다.", "bridge": "손 발전기와 발전기의 구조, 전기에너지가 열·빛·운동·소리 에너지로 전환되는 생활 속 사례를 총정리합니다."}}]}, {"grade": "중3", "unit": "별과 우주", "icon": "🌌", "sets": [{"title": "별의 특성, 은하와 우주 팽창, 우주 탐사", "myth": {"q": "가스레인지 불꽃이나 밤하늘의 별 중에서 붉은색 별과 파란색 별 중 어느 쪽이 더 뜨거울까?", "a": "불은 당연히 붉은색이 활활 타오르므로 붉은색 별이 훨씬 뜨겁다.", "b": "아니다! 온도가 높을수록 파장이 짧은 파란빛을 내므로 파란색 별이 붉은색 별보다 몇 배나 더 뜨겁다.", "wrongChoice": "A", "fact": "정답은 B! 붉은색 별(베텔게우스)은 표면 온도가 약 3,500K 이하인 저온의 별이고, 청색·청백색 별(리겔)은 10,000K~30,000K 이상의 초고온 별입니다! (태양은 황색, 약 6,000K)", "bridge": "별의 색깔과 표면 온도의 관계, 그리고 겉보기 등급과 10pc 기준 절대 등급으로 별의 실제 밝기를 비교하는 법을 배웁니다."}, "bal": {"q": "천문학자의 우주 탐사 망원경 선택 딜레마! 단 하나의 관측 장비만 가질 수 있다면?", "a": "구경은 초대형이지만 지구 대기의 비바람과 빛 공해 때문에 흐릿하게 보이는 '지상 광학 망원경'", "b": "우주 쓰레기 충돌 위험이 있고 고장 나면 수리가 어렵지만 대기 간섭 없이 초선명한 은하를 찍는 '우주 망원경'", "fact": "허블, 제임스 웹 등 우주 망원경은 지구 대기의 흡수와 왜곡을 받지 않아 130억 년 전의 초기 우주와 심우주 천체를 선명하게 촬영합니다.", "bridge": "지구 대기권 밖 우주 탐사의 의의와 21세기 화성 탐사 로봇(큐리오시티, 퍼서비어런스)의 성과를 분석합니다."}, "csi": {"q": "허블의 외부 은하 도주 사건: 밤하늘의 거의 모든 은하들이 우리은하로부터 빛의 속도로 도망치고 있다?!", "evidences": ["단서 1: 외부 은하에서 오는 별빛 스펙트럼의 흡수선이 모두 붉은색 쪽으로 치우침(적색편이).", "단서 2: 거리가 2배 먼 은하는 2배 빠르게, 3배 먼 은하는 3배 빠르게 후퇴함 (v = Hr).", "단서 3: 은하 자체가 날아가는 것이 아니라, 은하 사이의 '우주 공간' 전체가 팽창하고 있음!"], "fact": "에드윈 허블이 밝혀낸 '우주 팽창'의 결정적 증거! 풍선 표면이 부풀듯 우주 공간 자체가 팽창하고 있습니다.", "bridge": "우주 팽창을 시간을 거슬러 되돌리면 한 점에서 시작되었다는 '빅뱅(대폭발) 우주론'의 탄생을 추적합니다."}, "zoom": {"q": "20초 줌인 관찰: 맑은 여름밤 하늘을 가로지르는 뿌연 은하수를 천체 망원경으로 100만 배 확대하면?", "shapeDesc": "중심부에 거대한 막대 모양 구조가 있고, 그 끝에서 소용돌이치듯 뻗어 나온 나선팔 속에 수천억 개의 별과 푸른 산개성단, 가스 성운이 소용돌이치는 모습", "fact": "우리은하는 지름 10만 광년(30kpc)의 막대 나선 은하이며, 태양계는 중심에서 3만 광년(8.5kpc) 떨어진 나선팔 가장자리에 위치합니다.", "bridge": "타원 은하, 정상 나선 은하, 막대 나선 은하, 불규칙 은하의 형태별 분류와 우리은하의 3차원 구조를 탐구합니다."}, "whatif": {"q": "만약 지구가 태양 주위를 공전하지 않고 한자리에 가만히 멈춰 정지해 있다면?", "defaultChips": ["별의 연주 시차 0초", "계절별 별자리 소멸", "지구 공전 증거 상실", "가까운 별 거리 측정 불가"], "fact": "지구가 공전하기 때문에 6개월 간격으로 관측한 가까운 별의 위치가 배경 별에 대해 달라 보이는 '연주 시차(p)'가 생기며, 이를 통해 별까지의 거리(d = 1/p)를 측정할 수 있습니다.", "bridge": "연주 시차와 파섹(pc), 광년(LY)의 거리 단위 계산법 및 히파르코스의 별 등급 체계를 학습합니다."}}]}, {"grade": "중3", "unit": "과학기술과 인류 문명", "icon": "🛰️", "sets": [{"title": "과학 원리와 기기의 발명, 첨단 과학기술과 미래", "myth": {"q": "과학자들이 공상 과학 소설이나 영화에 나오는 상상 속 미래 기술은 실제 현실 과학과는 전혀 무관한 엉터리 허구일까?", "a": "그렇다! 소설이나 영화의 상상은 현 function tone(f,t0,d,ty,v){const a=ac();if(!a||!S.snd)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
const SFX={click:()=>tone(440,0,.06,'sine',.1),tab:()=>tone(620,0,.07,'triangle',.1),reveal:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.22,'triangle',.16)),end:()=>[880,660,880,660,988].forEach((f,i)=>tone(f,i*.18,.22,'square',.1))};
let toastT=0;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600);}

function closePanels(){
  document.querySelectorAll(".fpanel.open").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".fb-btn[data-p]").forEach(b => { b.classList.remove("open"); b.setAttribute("aria-expanded","false"); });
}
function togglePanel(btn){
  const p = document.getElementById(btn.dataset.p);
  const was = p.classList.contains("open");
  closePanels();
  if (!was) { p.classList.add("open"); btn.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
}
function initBar(){
  document.querySelectorAll(".fb-btn[data-p]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); togglePanel(b); }));
  document.querySelectorAll(".fpanel").forEach(p => {
    p.addEventListener("click", () => { S.showAll = true; }, true);
    p.addEventListener("click", e => { if (e.target.closest("button")) closePanels(); });
  });
  document.addEventListener("click", e => { if (!e.target.closest(".fbar")) closePanels(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePanels(); });
}
function fbSet(id, t){ const e = document.getElementById(id); if (e) e.textContent = t; }
function fbOn(id, on){ const e = document.getElementById(id); if (e) e.classList.toggle("on", !!on); }

function nextMethod(){const i=METHODS.findIndex(x=>x.k===S.method);S.method=METHODS[(i+1)%5].k;SFX.tab();stage();}
function step(dir){const l=S.list.length?S.list:filtered();const i=l.findIndex(x=>x.id===S.cur.id);const nx=l[(i+dir+l.length)%l.length];S.cur=nx;S.method=S.startM==='ALL'?'myth':S.startM;timerReset();stage();}
$('#sBack').onclick=closeStudio;$('#bReveal').onclick=reveal;$('#bNextM').onclick=nextMethod;$('#pPrev').onclick=()=>step(-1);$('#pNext').onclick=()=>step(1);
$('#tStart').onclick=timerToggle;$('#tReset').onclick=timerReset;$('#sSnd').onclick=()=>{S.snd=!S.snd;$('#sSnd').textContent=S.snd?'🔊':'🔇';};
/* ---------- 머리글 도구 ---------- */
$('#q').addEventListener('input',e=>{S.q=e.target.value;render();});
$('#fbHome').onclick=goHome;$('#fbFav').onclick=toggleFavView;initBar();
$('#grid').addEventListener('click',e=>{const a=e.target.closest('a.btn-action');if(!a)return;const c=a.closest('.lesson-card');if(c&&c.dataset.id)addRecent(c.dataset.id);});
$('#bRand').onclick=()=>{ac();const l=filtered(true);if(!l.length)return;const c=l[Math.floor(Math.random()*l.length)];S.list=l;SFX.reveal();openStudio(c.id,METHODS[Math.floor(Math.random()*5)].k);};
function syncBoard(){const b=$('#bBoard');b.querySelector('span').textContent='🖥 전자칠판 모드 : '+(S.board?'켬':'끔');}
$('#bBoard').onclick=()=>{S.board=!S.board;try{localStorage.setItem('labBoardMode',S.board?'on':'off');}catch(e){}syncBoard();render();if(S.cur&&$('#studio').classList.contains('on'))stage();};
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
$('#bFs').onclick=()=>{try{if(!isFs())(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);else(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){toast('이 브라우저는 전체화면을 지원하지 않아요. (F11 키)');}};
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const on=$('#studio').classList.contains('on');
  if(e.key==='Escape'){if(on)closeStudio();$('#ovQ').classList.remove('on');}
  else if(on){if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key===' '){e.preventDefault();reveal();}else if(e.key==='Enter')nextMethod();else if(e.key==='t'||e.key==='T')timerToggle();else if(/^[1-5]$/.test(e.key)){S.method=METHODS[+e.key-1].k;SFX.tab();stage();}}});
/* QR */
const QK='labQrBase';const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}},lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};const normUrl=u=>{try{const x=new URL(u.trim());return/^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}};
function drawQR(){const raw=$('#qrUrl').value.trim(),c=$('#qrCv'),q=c.getContext('2d'),url=raw?normUrl(raw):'';$('#qrMsg').textContent='';
  if(!url){c.width=c.height=400;q.fillStyle='#fff';q.fillRect(0,0,400,400);q.fillStyle='#64748b';q.font='700 24px sans-serif';q.textAlign='center';q.fillText('주소를 입력하세요',200,205);$('#qrCap').textContent='';if(raw)$('#qrMsg').textContent='http:// 또는 https:// 로 시작하는 주소를 입력하세요.';return;}
  try{qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const m=qrcode(0,'M');m.addData(url,'Byte');m.make();const n=m.getModuleCount(),b=4,cell=Math.max(4,Math.floor(640/(n+b*2))),sz=cell*(n+b*2);c.width=c.height=sz;q.fillStyle='#fff';q.fillRect(0,0,sz,sz);q.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(m.isDark(r,k))q.fillRect((k+b)*cell,(r+b)*cell,cell,cell);let cap=url;try{cap=decodeURI(url);}catch(e){}$('#qrCap').textContent=cap;lsSet(QK,url);}catch(e){$('#qrMsg').textContent='주소가 너무 길어 QR을 만들 수 없습니다.';}}
$('#bQR').onclick=()=>{const here=/^https?:$/.test(location.protocol)?location.href.split('#')[0].split('?')[0]:lsGet(QK);$('#qrUrl').value=here;$('#ovQ').classList.add('on');drawQR();if(!here)$('#qrMsg').textContent='GitHub Pages 주소를 붙여 넣으면 QR이 만들어집니다.';};
$('#qrUrl').addEventListener('input',drawQR);$('#qX').onclick=()=>$('#ovQ').classList.remove('on');$('#ovQ').addEventListener('click',e=>{if(e.target.id==='ovQ')$('#ovQ').classList.remove('on');});
/* 시작 : 주소로 바로 열기 ?g=중2&u=별과 우주&i=0 */
syncBoard();render();
try{const qs=new URLSearchParams(location.search),g=qs.get('g'),u=qs.get('u'),i=parseInt(qs.get('i')||'0',10);if(g&&u){const c=CARDS.find(x=>x.grade===g&&x.unit===u&&x.idx===(i>=0?i:0))||CARDS.find(x=>x.grade===g&&x.unit===u);if(c){S.grade=g;S.unit=u;render();S.list=filtered();openStudio(c.id,qs.get('m'));}}}catch(e){}
window.__hook={S:S,CARDS:CARDS,render:render,openStudio:openStudio,stage:stage,reveal:reveal,nextMethod:nextMethod,step:step,filtered:filtered,METHODS:METHODS,timerToggle:timerToggle,timerReset:timerReset,drawZoom:drawZoom};
})();

</script>
